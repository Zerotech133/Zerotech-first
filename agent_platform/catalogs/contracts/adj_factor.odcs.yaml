apiVersion: v3.0.2
kind: DataContract
id: zerobond.adj_factor
name: adj_factor
version: 1.0.0
status: draft
description:
  purpose: A股复权因子（tushare 按日，回测前复权源）
  limitations: catalog 基线 v12；schema 取自 store 抽样 parquet footer
domain: quant
dataProduct: zerobond-datawarehouse
team:
- username: data1@open-metadata.org
  name: DATA1 张松
  role: data steward
servers:
- server: local-datawarehouse
  type: local
  path: tushare/adj_factor
  format: parquet
schema:
- name: adj_factor
  physicalName: tushare/adj_factor
  logicalType: object
  properties:
  - name: ts_code
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    description: 标的代码列
  - name: trade_date
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    description: 业务日期列（event date）
  - name: adj_factor
    logicalType: number
    physicalType: number
    required: false
slaProperties:
- property: frequency
  value: D
