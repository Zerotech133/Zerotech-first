    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    description: 标的代码列
  - name: trade_date
    logicalType: string
    physicalType: string
    required: true
    primaryKey: true
    description: 业务日期列（event date）
  - name: close
    logicalType: number
    physicalType: number
    required: false
  - name: turnover_rate
    logicalType: number
    physicalType: number
    required: false
  - name: turnover_rate_f
    logicalType: number
    physicalType: number
    required: false
  - name: volume_ratio
    logicalType: number
    physicalType: number
    required: false
  - name: pe
    logicalType: number
    physicalType: number
    required: false
  - name: pe_ttm
    logicalType: number
    physicalType: number
    required: false
  - name: pb
    logicalType: number
    physicalType: number
    required: false
  - name: ps
    logicalType: number
    physicalType: number
    required: false
  - name: ps_ttm
    logicalType: number
    physicalType: number
    required: false
  - name: dv_ratio
    logicalType: number
    physicalType: number
    required: false
  - name: dv_ttm
    logicalType: number
    physicalType: number
    required: false
  - name: total_share
    logicalType: number
    physicalType: number
    required: false
  - name: float_share
    logicalType: number
    physicalType: number
    required: false
  - name: free_share
    logicalType: number
    physicalType: number
    required: false
  - name: total_mv
    logicalType: number
    physicalType: number
    required: false
  - name: circ_mv
    logicalType: number
    physicalType: number
    required: false
slaProperties:
- property: frequency
  value: D
