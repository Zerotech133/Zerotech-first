apiVersion: v3.0.2
kind: DataContract
id: zerobond.daily_basic
name: daily_basic
version: 1.0.0
status: draft
description:
  purpose: 数据仓核心表 daily_basic（来源 tushare，频率 D）
  limitations: catalog 基线 v12；schema 取自 store 抽样 parquet footer
domain: quant
dataProduct: zerobond-datawarehouse
team:
- username: data1@open-metadata.org
  name: DATA1 张松
  role: data steward
servers:
- server: local-datawarehouse
  type: local
  path: tushare/daily_basic
  format: parquet
schema:
- name: daily_basic
  physicalName: tushare/daily_basic
  logicalType: object
  properties:
