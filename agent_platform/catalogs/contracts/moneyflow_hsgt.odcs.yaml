apiVersion: v3.0.2
kind: DataContract
id: zerobond.moneyflow_hsgt
name: moneyflow_hsgt
version: 1.0.0
status: draft
description:
  purpose: 沪深港通资金流向（南向/北向净额，H17 研究数据）
