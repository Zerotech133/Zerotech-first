  - name: ggt_sz
    logicalType: string
    physicalType: string
  - name: hgt
    logicalType: string
    physicalType: string
  - name: sgt
    logicalType: string
    physicalType: string
  - name: north_money
    logicalType: string
    physicalType: string
  - name: south_money
    logicalType: string
    physicalType: string
quality:
  freshness: 每日（交易日 T+1 可用）
