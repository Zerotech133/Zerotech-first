<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>数字军团 · 指挥沙盘</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #060F1D; font-family: -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif; color: #E8F0F8; padding: 14px; }
  .wrap { max-width: 1380px; margin: 0 auto; }
  .hdr { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 12px; }
  .hdr-l { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #4FD1A5; }
  h1 { font-size: 16px; font-weight: 500; }
  .sub { font-size: 11.5px; color: #8FA8C0; }
  .legend { display: flex; gap: 12px; font-size: 11px; color: #8FA8C0; flex-wrap: wrap; }
  .lg { display: flex; align-items: center; gap: 5px; }
  .lamp { width: 8px; height: 8px; border-radius: 50%; }
  .l-local { background: #4FD1A5; } .l-cyc { background: #4FA3E8; } .l-idle { background: #5A7190; } .l-none { background: #3A4A5E; }
  .seat.noprof { border-style: dashed; border-color: #2A4058; opacity: .72; }
  .seat.noprof .aid { color: #7C93AD; }
  .dept-meta { font-size: 9.5px; color: #5A7190; margin-left: 8px; }
  .statbar { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: #0F2440; border-radius: 10px; padding: 9px 13px; border: 0.5px solid #1E3A5F; }
  .stat-n { font-size: 21px; font-weight: 500; color: #4FD1A5; }
  .stat-n.amber { color: #EF9F27; }
  .stat-t { font-size: 10.5px; color: #8FA8C0; margin-top: 1px; }
  .camp { background: #0A1A2F; border-radius: 14px; border: 0.5px solid #1E3A5F; padding: 13px 15px; margin-bottom: 12px; }
  .camp-h { display: flex; align-items: center; gap: 10px; margin-bottom: 11px; flex-wrap: wrap; }
  .flag { width: 22px; height: 28px; border-radius: 3px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500; flex: none; }
  .camp-t { font-size: 14px; font-weight: 500; }
  .camp-s { font-size: 11px; color: #8FA8C0; }
  .dept-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 10px; }
  .dept { background: #0F2440; border-radius: 12px; padding: 11px 13px; border: 0.5px solid #1E3A5F; }
  .dept-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; gap: 6px; }
  .dept-n { font-size: 12.5px; font-weight: 500; }
  .dept-lead { font-size: 10.5px; color: #8FA8C0; text-align: right; }
  .dept-lead b { color: #E8F0F8; font-weight: 500; }
  .seats { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .seat { background: #0A1A2F; border-radius: 8px; padding: 7px 8px; cursor: pointer; transition: background .15s; }
  .seat:hover { background: #12294A; }
  .seat .aid { font-size: 10px; color: #8FA8C0; }
  .seat .cn { font-size: 11.5px; margin-top: 1px; display: flex; align-items: center; gap: 4px; }
  .slamp { width: 6px; height: 6px; border-radius: 50%; flex: none; }
  .seat.vac { border: 0.5px dashed #5A7190; background: transparent; display: flex; align-items: center; justify-content: center; min-height: 44px; color: #5A7190; font-size: 11px; }
  .seat.vac:hover { border-color: #EF9F27; color: #EF9F27; }
  .drawer { position: fixed; top: 0; right: -400px; width: 380px; max-width: 92vw; height: 100vh; background: #0F2440; border-left: 0.5px solid #1E3A5F; padding: 20px; overflow-y: auto; transition: right .25s; z-index: 50; }
  .drawer.open { right: 0; }
  .drawer h3 { font-size: 15px; font-weight: 500; margin-bottom: 4px; }
  .drawer .x { position: absolute; top: 14px; right: 16px; cursor: pointer; color: #8FA8C0; font-size: 18px; background: none; border: none; }
  .kv { display: flex; gap: 10px; font-size: 12.5px; margin: 7px 0; }
  .kv .k { width: 70px; color: #8FA8C0; flex: none; }
  .panel { background: #0A1A2F; border-radius: 10px; padding: 11px 13px; margin-top: 10px; font-size: 12px; color: #C7D6E8; line-height: 1.7; }
  .modal-mask { position: fixed; inset: 0; background: rgba(4,10,20,.72); display: none; align-items: center; justify-content: center; z-index: 60; }
  .modal-mask.open { display: flex; }
  .modal { width: 440px; max-width: 94vw; background: #0F2440; border-radius: 14px; border: 0.5px solid #1E3A5F; padding: 18px; }
  .modal h3 { font-size: 15px; font-weight: 500; margin-bottom: 12px; }
  .fitem { margin-bottom: 9px; }
  .fitem label { display: block; font-size: 11px; color: #8FA8C0; margin-bottom: 4px; }
  .fitem input, .fitem select, .fitem textarea { width: 100%; background: #0A1A2F; border: 0.5px solid #1E3A5F; border-radius: 8px; color: #E8F0F8; font-size: 12.5px; padding: 8px 10px; font-family: inherit; }
  .btnrow { display: flex; gap: 10px; margin-top: 12px; }
  .btn { flex: 1; border-radius: 8px; border: 0.5px solid #1D9E75; background: none; color: #4FD1A5; font-size: 13px; padding: 9px; cursor: pointer; font-family: inherit; }
  .btn.ghost { border-color: #5A7190; color: #8FA8C0; }
  .ok-tip { color: #4FD1A5; font-size: 11.5px; margin-top: 10px; display: none; line-height: 1.7; }
  .ft { border-top: 0.5px solid #1E3A5F; margin-top: 4px; padding-top: 9px; display: flex; justify-content: space-between; font-size: 11px; color: #5A7190; flex-wrap: wrap; gap: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-l"><div class="dot"></div><h1>数字军团 · 指挥沙盘</h1><span class="sub" id="ts">拉取快照…</span></div>
    <div class="legend">
      <span class="lg"><span class="lamp l-local"></span>本席在跑</span>
      <span class="lg"><span class="lamp l-cyc"></span>本营有活</span>
      <span class="lg"><span class="lamp l-idle"></span>待命</span>
      <span class="lg"><span class="lamp l-none"></span>未绑定</span>
      <span class="lg"><span class="lamp" style="background:none;border:1px dashed #2A4058"></span>有名无档</span>
      <span class="lg" style="color:#5A7190">▭ 虚位可募</span>
    </div>
  </div>
  <div class="statbar" id="statbar"></div>
  <div id="camps"></div>
  <div class="ft"><span>快照源 /api/snapshot · 只读聚合 org.json+hr+tasks+schedules</span><span>点席位看详情 · 点虚席招募（走工单制）</span></div>
</div>

<div class="drawer" id="drawer"><button class="x" onclick="closeDrawer()">✕</button><div id="drawerBody"></div></div>
<div class="modal-mask" id="recruitMask">
  <div class="modal">
    <h3 id="recTitle">招募新 Agent</h3>
    <div class="fitem"><label>席位代号（大写，全局唯一）</label><input id="rId" placeholder="例：DEV9"></div>
    <div class="fitem"><label>岗位名（中文名，不得重名）</label><input id="rName" placeholder="例：徐庶"></div>
    <div class="fitem"><label>干什么（职责一句话）</label><input id="rDuty" placeholder="例：舆情异动哨——盯雪球增量帖情感突变"></div>
    <div class="fitem"><label>模型档位</label>
      <select id="rModel">
        <option value="ollama/qwen3.5:9b">ollama/qwen3.5:9b（主力数据岗）</option>
        <option value="ollama/qwen3.6:35b-a3b">ollama/qwen3.6:35b-a3b（判读重档）</option>
        <option value="glm/glm-5.3">glm/glm-5.3（云端参谋档）</option>
        <option value="openai/gpt-6.0">openai/gpt-6.0（异族档·需key）</option>
      </select>
    </div>
    <div class="fitem"><label>隶属营</label><input id="rDept" readonly></div>
    <div class="fitem"><label>设立理由（进工单）</label><textarea id="rWhy" rows="3" placeholder="为什么现在需要这个席位？解决什么阻塞？"></textarea></div>
    <div class="btnrow"><button class="btn ghost" onclick="closeRecruit()">取消</button><button class="btn" onclick="submitRecruit()">生成编制工单</button></div>
    <div class="ok-tip" id="recTip"></div>
  </div>
</div>

<script>
const CAMPS = [
  { id:'zhong', name:'中军帐 · 参谋与管理席', flag:'帅', color:'#534AB7', match: d => /chief|参谋/.test(d.id + d.name) },
  { id:'qian', name:'前军 · 作战线', flag:'前', color:'#993C1D', match: d => /invest|trad|risk|research|acad/.test(d.id) || /量化|交易|风控|研究/.test(d.name) },
  { id:'zuo', name:'左军 · 研发线', flag:'左', color:'#185FA5', match: d => /dev|quality|data|product/.test(d.id) || /研发|质量|产品/.test(d.name) },
  { id:'you', name:'右军 · 支撑线', flag:'右', color:'#1D9E75', match: d => /ops|intel|comm|market|legal|hermes/.test(d.id) || /运行|情报|市场|法务/.test(d.name) },
  { id:'hou', name:'后军 · 专项行营', flag:'后', color:'#BA7517', match: d => /proj/.test(d.id) || /行营/.test(d.name) },
];
let SNAP = null;
const seatIndex = {};

function lamp(a, dept) {
  if (a.binding === 'none') return 'l-none';   // 规则执行体：编制上就没有 LLM
  const act = (SNAP && SNAP.activity) || {};
  const byAgent = act.by_agent || {}, byDept = act.by_dept || {};
  if ((byAgent[a.id] || []).length) return 'l-local';
  if (dept && (byDept[dept.id] || []).length) return 'l-cyc';
  if (!a.binding) return 'l-none';
  return 'l-idle';
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function render(snap) {
  SNAP = snap;
  document.getElementById('ts').textContent = '快照 ' + snap.ts + ' · 只读聚合';
  const q = snap.summary;
  document.getElementById('statbar').innerHTML =
    '<div class="stat"><div class="stat-n">' + q.departments + '</div><div class="stat-t">营（部门）</div></div>' +
    '<div class="stat"><div class="stat-n">' + q.agents + '</div><div class="stat-t">在编 agent</div></div>' +
    '<div class="stat"><div class="stat-n amber">' + q.doing + '</div><div class="stat-t">在途工单</div></div>' +
    '<div class="stat"><div class="stat-n">' + q.schedules + '</div><div class="stat-t">注册排程</div></div>';
  const buckets = {};
  CAMPS.forEach(c => buckets[c.id] = []);
  snap.departments.forEach(d => {
    const camp = CAMPS.find(c => c.match(d)) || CAMPS[1];
    buckets[camp.id].push(d);
  });
  let html = '';
  CAMPS.forEach(c => {
    const depts = buckets[c.id];
    if (!depts.length) return;
    const total = depts.reduce((n, d) => n + d.agents.length, 0);
    html += '<div class="camp"><div class="camp-h"><div class="flag" style="background:' + c.color + ';color:#fff">' + c.flag + '</div>' +
      '<span class="camp-t">' + c.name + '</span><span class="camp-s">' + depts.length + ' 营 · ' + total + ' 员</span></div><div class="dept-grid">';
    depts.forEach(d => {
      html += '<div class="dept"><div class="dept-h"><span class="dept-n">' + esc(d.name) + (d.cn_title ? '<span style="color:#5A7190;font-size:10px"> · ' + esc(d.cn_title) + '</span>' : '') + '</span>' +
        '<span class="dept-lead">' + (d.lead
          ? '主官 <b>' + esc(d.lead) + '</b>' + (d.lead_profiled ? '' : '<span style="color:#EF9F27">·无档</span>')
          : '<span style="color:#EF9F27">主官待任</span>') +
        '<span class="dept-meta">档案 ' + (d.seats_profiled || 0) + '/' + (d.seats_listed || d.agents.length) + '</span></span></div><div class="seats">';
      d.agents.forEach(a => {
        seatIndex[a.id] = a;
        const n = ((SNAP.activity && SNAP.activity.by_agent) || {})[a.id] || [];
        const noProf = a.has_profile === false;
        html += '<div class="seat' + (noProf ? ' noprof' : '') + '" onclick="showSeat(\'' + esc(a.id) + '\')"' +
          (noProf ? ' title="有名无档：组织真源未登记职责/模型/档级"' : '') + '><div class="aid">' + esc(a.id) +
          (n.length ? ' · ' + n.length + '单' : '') + (noProf ? ' ·无档' : '') + '</div>' +
          '<div class="cn"><span class="slamp ' + lamp(a, d) + '"></span>' + esc(a.cn) + '</div></div>';
      });
      if (!d.agents.length) html += '<div class="seat vac" onclick="openRecruit(\'' + esc(d.name) + '\',true)">＋ 任命主官</div>';
      html += '<div class="seat vac" onclick="openRecruit(\'' + esc(d.name) + '\')">＋ 虚席</div>';
      html += '</div></div>';
    });
    html += '</div></div>';
  });
  document.getElementById('camps').innerHTML = html;
}

function showSeat(id) {
  const a = seatIndex[id]; if (!a) return;
  const dept = (SNAP.departments.find(d => d.agents.some(x => x.id === id)) || {});
  const seat = seatIndex[id] || {};
  if (seat.has_profile === false) {
    document.getElementById('drawerBody').innerHTML =
      '<div style="color:#EF9F27;font-size:11.5px;line-height:1.8">' +
      '<b>有名无档</b><br>该席位在组织真源 org.json 的 <code>agents</code> 名单里，' +
      '但<b>没有 agent_profiles 档案</b>——职责、模型绑定、档级、工具授权均未登记。<br><br>' +
      '后果：无法回答「它在干什么」，也无法被派工。<br>' +
      '补齐须由田丰归口、老田裁定职责后，走 <code>engine/org_enroll.py</code>（需签字）。' +
      '<br><span style="color:#5A7190">工具不代填职责——造出来的职责比没有更糟。</span></div>';
    document.getElementById('drawer').classList.add('open');
    return;
  }
  const byAgent = (SNAP.activity && SNAP.activity.by_agent) || {};
  const myKeys = byAgent[id] || [];
  const doing = (SNAP.activity.doing || []).filter(t => myKeys.indexOf(t.key) >= 0);
  document.getElementById('drawerBody').innerHTML =
    '<h3>' + esc(a.cn) + ' <span style="color:#8FA8C0;font-size:12px;font-weight:400">' + esc(a.id) + '</span></h3>' +
    '<div class="kv"><span class="k">隶属营</span><span>' + esc(dept.name || '—') + '</span></div>' +
    '<div class="kv"><span class="k">职能</span><span>' + esc(a.role || '—') + '</span></div>' +
    '<div class="kv"><span class="k">模型</span><span>' + esc(a.binding || '未绑定（治理挂账）') + '</span></div>' +
    '<div class="kv"><span class="k">在途</span><span>' + (doing.length ? doing.map(t => esc(t.desc)).join('；') : '无归属本席的在途单') + '</span></div>' +
    '<div class="panel" style="color:#5A7190">生产版可接：hr/' + esc(a.id) + '/resume.yaml 全文 · decision/knowledge 记忆流 · 工单史 · 晨会记录</div>';
  document.getElementById('drawer').classList.add('open');
}
function closeDrawer() { document.getElementById('drawer').classList.remove('open'); }
function openRecruit(dept, isChief) {
  document.getElementById('rDept').value = dept;
  document.getElementById('recTitle').textContent = isChief ? '任命主官 · ' + dept : '招募新 Agent · ' + dept;
  document.getElementById('recTip').style.display = 'none';
  ['rId', 'rName', 'rDuty', 'rWhy'].forEach(k => { const el = document.getElementById(k); if (el) el.value = ''; });
  document.getElementById('recruitMask').classList.add('open');
}
function closeRecruit() { document.getElementById('recruitMask').classList.remove('open'); }
function submitRecruit() {
  const aid = document.getElementById('rId').value.trim();
  const name = document.getElementById('rName').value.trim();
  const duty = document.getElementById('rDuty').value.trim();
  const model = document.getElementById('rModel').value;
  const dept = document.getElementById('rDept').value;
  const why = document.getElementById('rWhy').value.trim();
  const tip = document.getElementById('recTip');
  tip.style.display = 'block';
  tip.innerHTML = '<span style="color:#8FA8C0">正在做编制校验（只读，不写任何真源）…</span>';

  // 第一步：只读校验预览 —— 重名/编号占用/职责过短/绑定越界都会在这里被拒
  fetch('/api/org/preview-enroll', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ dept: dept, agent_id: aid, cn_name: name, role_profile: duty.slice(0, 20) || '（待定）',
      duty: duty + (why ? '；设立理由：' + why : ''), binding: model, grade: 'E2',
      ticket: 'WO-ORG-PREVIEW', signed_by: '（预览·待老田签字）' }) })
  .then(r => r.json()).then(env => {
    if (!env.ok) {
      tip.innerHTML = '<b style="color:#E24B4A">校验未通过</b><br>' + esc(env.detail || env.error || '未知') +
        '<br><span style="color:#5A7190">未投递任何工单，真源未被改动。</span>';
      return;
    }
    const pl = env.plan;
    // 第二步：校验通过才投编制工单
    fetch('/api/zhaoyun/write-token').then(r => r.json()).then(j => { window.__DSH_TOKEN = (j && j.token) || ''; }).catch(() => {});
    fetch('/api/dispatch', { method:'POST', headers:{'Content-Type':'application/json','X-DSH-Token': window.__DSH_TOKEN || ''},
      body: JSON.stringify({ type:'work', title:'编制申请：' + dept + ' · ' + name + '（' + aid + '）',
        attendees: [], note: '职责：' + duty + '；模型：' + model + '；理由：' + why }) })
    .then(r => r.json()).then(d => {
      tip.innerHTML =
        '<b style="color:#4FD1A5">校验通过（未写入任何字节）</b><br>' +
        '将建立：<b>' + esc(pl.cn_name) + '</b>（' + esc(pl.agent.agent_id) + '）→ ' + esc(pl.dept_name) +
        '<br>职责：' + esc(pl.agent.charter_detail.slice(0, 60)) +
        '<br>绑定：' + esc(pl.agent.llm_binding) + ' · 档级 ' + esc(pl.agent.grade) +
        '<br>工单：' + (d.ok ? '<b>' + esc((d.data && d.data.id) || '') + '</b> 已投门面' : '<span style="color:#E24B4A">投递失败</span>') +
        '<br><br><span style="color:#EF9F27">真入编须老田在命令行签字执行：</span>' +
        '<br><code style="font-size:10px;color:#8FA8C0">python engine/org_enroll.py --dept ' + esc(pl.dept) +
        ' --id ' + esc(pl.agent.agent_id) + ' --name ' + esc(pl.cn_name) +
        ' --role ' + esc(pl.agent.role_profile) + ' --ticket &lt;工单&gt; --signed-by 老田 --apply</code>' +
        '<br><span style="color:#5A7190">组织真源（org.json）不经 HTTP 落地——这是红线，故此处只到计划为止。</span>';
    }).catch(() => { tip.innerHTML = '校验通过，但工单投递失败：服务不可达'; });
  }).catch(() => { tip.innerHTML = '校验请求失败：服务不可达'; });
}
document.getElementById('recruitMask').addEventListener('click', e => { if (e.target.id === 'recruitMask') closeRecruit(); });

if (window.__SNAP__) {
  render(window.__SNAP__);
  document.getElementById('ts').textContent = '静态快照 ' + (window.__SNAP__.ts || '') + ' · 导出件（无需服务）';
} else {
  fetch('/api/snapshot').then(r => r.json()).then(env => {
    if (!env.ok) { document.getElementById('ts').textContent = '快照不可用：' + (env.error || '?'); return; }
    render(env);
  }).catch(() => { document.getElementById('ts').textContent = '快照端点不可达'; });
}
</script>
</body>
</html>
