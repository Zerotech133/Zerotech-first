<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>会议档案 · 数字军团指挥台</title>
<style>
  :root {
    --bg: #0A1A2F; --panel: #0E2440; --panel2: #122B4A; --line: #1C3A5E;
    --cy: #4FD1A5; --blue: #4FA3E8; --am: #EF9F27; --red: #E5534B;
    --tx: #D6E4F0; --tx2: #8FA8C0; --tx3: #5A7190;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--tx);
    font-family: -apple-system, "Microsoft YaHei", "Segoe UI", sans-serif; font-size:13px; }
  header { padding:12px 18px; border-bottom:1px solid var(--line); display:flex;
    align-items:center; gap:14px; flex-wrap:wrap; background:var(--panel); }
  h1 { font-size:15px; margin:0; font-weight:600; letter-spacing:.5px; }
  h1 span { color:var(--cy); }
  .stat { font-size:11px; color:var(--tx2); }
  .stat b { color:var(--tx); font-size:12px; }
  .back { margin-left:auto; font-size:11px; color:var(--blue); text-decoration:none;
    border:1px solid var(--line); padding:3px 9px; border-radius:4px; }
  .back:hover { border-color:var(--blue); }
  main { display:grid; grid-template-columns: 320px 1fr; gap:0; height:calc(100vh - 51px); }
  #list { border-right:1px solid var(--line); overflow-y:auto; background:var(--panel); }
  .mi { padding:10px 13px; border-bottom:1px solid var(--line); cursor:pointer; }
  .mi:hover { background:var(--panel2); }
  .mi.on { background:var(--panel2); border-left:2px solid var(--cy); }
  .mi .ts { font-size:11.5px; color:var(--tx); font-weight:600; }
  .mi .sub { font-size:10.5px; color:var(--tx3); margin-top:3px; }
  .bar { display:flex; height:3px; margin-top:6px; border-radius:2px; overflow:hidden; }
  .bar i { display:block; }
  .bar .b-live { background:var(--cy); } .bar .b-deg { background:var(--am); }
  .bar .b-scr { background:var(--tx3); } .bar .b-host { background:var(--blue); }
  #pane { overflow-y:auto; padding:16px 20px; }
  .empty { color:var(--tx3); font-size:12px; padding:26px 4px; line-height:1.9; }
  .msg { display:flex; gap:9px; margin-bottom:11px; align-items:flex-start; }
  .av { width:26px; height:26px; border-radius:5px; display:flex; align-items:center;
    justify-content:center; font-size:11px; font-weight:600; flex:0 0 26px; }
  .av.host { background:rgba(239,159,39,.18); color:var(--am); }
  .av.live { background:rgba(79,209,165,.16); color:var(--cy); }
  .av.deg { background:rgba(239,159,39,.16); color:var(--am); }
  .av.scr { background:rgba(90,113,144,.25); color:var(--tx2); }
  .body { flex:1; min-width:0; }
  .who { font-size:10.5px; color:var(--tx2); margin-bottom:3px; }
  .who .src { font-size:9px; padding:1px 5px; border-radius:3px; margin-left:6px; font-weight:600; }
  .src.live { background:rgba(79,209,165,.16); color:var(--cy); }
  .src.degraded { background:rgba(239,159,39,.16); color:var(--am); }
  .src.script { background:rgba(90,113,144,.20); color:var(--tx3); }
  .src.host { display:none; }
  .txt { font-size:12.5px; line-height:1.72; color:var(--tx); word-break:break-word; }
  .mtitle { font-size:13px; font-weight:600; margin-bottom:4px; }
  .mmeta { font-size:11px; color:var(--tx3); margin-bottom:14px; padding-bottom:10px;
    border-bottom:1px solid var(--line); line-height:1.7; }
  .warn { color:var(--am); font-size:11px; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; height:auto; }
    #list { max-height:34vh; border-right:none; border-bottom:1px solid var(--line); } }
</style>
</head>
<body>
<header>
  <h1>会议档案 <span>· 作战会议室纪要回看</span></h1>
  <span class="stat" id="topstat">加载中…</span>
  <a class="back" href="/">← 指挥台</a>
</header>
<main>
  <div id="list"><div class="empty">读取纪要清单…</div></div>
  <div id="pane"><div class="empty">从左侧选一场会议。<br><br>
    纪要来源标记含义：<b style="color:#4FD1A5">真模型</b> = 模型实时应答；
    <b style="color:#EF9F27">降级通道</b> = 云端限额/故障后回落本地；
    <b style="color:#7C93AD">演示台词</b> = 未获应答时的兜底文案（不是模型结论）。</div></div>
</main>
<script>
let LIST = [], CUR = null;

function esc(t) {
  return String(t).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
}

function fmtTs(ts) {
  if (!ts) return '时间缺失';
  return ts.replace('T', ' ').slice(0, 19);
}

function renderList() {
  const el = document.getElementById('list');
  if (!LIST.length) {
    el.innerHTML = '<div class="empty">暂无会议纪要。<br><br>' +
      '在指挥台的「作战会议室」选人上桌、开会，点「会终·分发指令」即自动归档到这里。</div>';
    return;
  }
  el.innerHTML = LIST.map(m => {
    const s = m.src_stats || {};
    const tot = Math.max(1, m.count);
    const seg = k => ((s[k] || 0) / tot * 100).toFixed(1) + '%';
    return '<div class="mi' + (CUR === m.id ? ' on' : '') + '" onclick="open1(\'' + esc(m.id) + '\')">' +
      '<div class="ts">' + esc(fmtTs(m.ts)) + (m.broken ? ' <span class="warn">（文件损坏）</span>' : '') + '</div>' +
      '<div class="sub">' + m.count + ' 条 · 参会 ' + (m.participants || []).length + ' 席 · 真模型 ' + (s.live || 0) + '</div>' +
      '<div class="bar"><i class="b-live" style="width:' + seg('live') + '"></i>' +
      '<i class="b-deg" style="width:' + seg('degraded') + '"></i>' +
      '<i class="b-scr" style="width:' + seg('script') + '"></i>' +
      '<i class="b-host" style="width:' + seg('host') + '"></i></div></div>';
  }).join('');
}

const SRC_LABEL = { live:'真模型', degraded:'降级通道', script:'演示台词', host:'' };

function renderMeeting(env) {
  const pane = document.getElementById('pane');
  if (!env.ok) {
    pane.innerHTML = '<div class="empty">读取失败：' + esc(env.error || '?') + '</div>';
    return;
  }
  const d = env.meeting || {};
  const ms = d.minutes || [];
  const s = {};
  ms.forEach(m => { s[m.src] = (s[m.src] || 0) + 1; });
  let html = '<div class="mtitle">' + esc(fmtTs(d.ts)) + ' 作战会议室</div>' +
    '<div class="mmeta">参会：' + esc((d.participants || []).join(' / ') || '未记录') +
    '　·　共 ' + ms.length + ' 条' +
    '　·　真模型 ' + (s.live || 0) + ' / 降级 ' + (s.degraded || 0) + ' / 台词 ' + (s.script || 0) +
    (d.model_stats ? '<br>当时调用统计：' + esc(JSON.stringify(d.model_stats)) : '') +
    (d.note ? '<br>' + esc(d.note) : '') + '</div>';
  ms.forEach(m => {
    const src = m.src || 'script';
    const isHost = m.by === 'HOST';
    const nm = isHost ? '老田 · 董事长' : (m.by || '?');
    html += '<div class="msg"><div class="av ' + (isHost ? 'host' : (src === 'live' ? 'live' : (src === 'degraded' ? 'deg' : 'scr'))) + '">' +
      (isHost ? '田' : esc(String(m.by || '?').slice(0, 1))) + '</div>' +
      '<div class="body"><div class="who">' + esc(nm) +
      '<span class="src ' + esc(src) + '">' + esc(SRC_LABEL[src] || src) + '</span></div>' +
      '<div class="txt">' + esc(m.text) + '</div></div></div>';
  });
  pane.innerHTML = html;
  pane.scrollTop = 0;
}

function open1(id) {
  CUR = id;
  renderList();
  const pane = document.getElementById('pane');
  pane.innerHTML = '<div class="empty">读取中…</div>';
  fetch('/api/meeting/' + encodeURIComponent(id)).then(r => r.json())
    .then(renderMeeting)
    .catch(() => { pane.innerHTML = '<div class="empty">读取失败：端点不可达</div>'; });
}

fetch('/api/meeting/list').then(r => r.json()).then(env => {
  if (!env.ok) {
    document.getElementById('topstat').textContent = '清单不可用：' + (env.error || '?');
    document.getElementById('list').innerHTML = '<div class="empty">清单读取失败</div>';
    return;
  }
  LIST = env.meetings || [];
  const tot = LIST.reduce((a, m) => a + m.count, 0);
  const live = LIST.reduce((a, m) => a + ((m.src_stats || {}).live || 0), 0);
  document.getElementById('topstat').innerHTML =
    '共 <b>' + env.total + '</b> 场 · <b>' + tot + '</b> 条发言 · 真模型 <b>' + live + '</b> 条' +
    '<span style="margin-left:8px;color:#5A7190">（只读回看，不重新生成）</span>';
  renderList();
  if (LIST.length) open1(LIST[0].id);
}).catch(() => {
  document.getElementById('topstat').textContent = '端点不可达（需启动指挥台服务）';
  document.getElementById('list').innerHTML =
    '<div class="empty">无法读取纪要清单。<br><br>纪要文件保存在 ' +
    'agent_platform/data/meetings/warroom/，需启动指挥台服务后在此回看。</div>';
});
</script>
</body>
</html>
