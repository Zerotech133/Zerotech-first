<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三席多 Key 池 · 零界</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#060F1D;font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif;color:#E8F0F8;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:.5px solid #1E3A5F;flex-wrap:wrap;gap:8px}
h1{font-size:17px;font-weight:500}.sub{color:#8FA8C0;font-size:11.5px}
button{border:.5px solid #1E3A5F;background:#0F2440;color:#4FD1A5;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.15)}button.warn{color:#EF9F27}button.bad{color:#E24B4A}
main{padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
@media(max-width:1100px){main{grid-template-columns:1fr}}
.card{background:#0A1626;border:.5px solid #1E3A5F;border-radius:12px;padding:14px}
.card h2{font-size:14px;font-weight:500;margin-bottom:4px}
.meta{color:#8FA8C0;font-size:11.5px;margin-bottom:8px}
.pill{display:inline-block;font-size:10.5px;padding:2px 8px;border-radius:999px;border:.5px solid #1E3A5F}
.ok{color:#4FD1A5;border-color:#1D9E75;background:#0F2440}.warn{color:#EF9F27;border-color:#7A5A1E}
.bad{color:#E24B4A;border-color:#7A2A2E}.muted{color:#5A7190}
table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:8px}
th{text-align:left;color:#5A7190;font-weight:400;padding:5px 4px;border-bottom:.5px solid #1E3A5F}
td{padding:5px 4px;border-bottom:.5px dashed #16304F;vertical-align:top}
.add{display:grid;grid-template-columns:1fr;gap:6px;margin-top:10px;padding-top:8px;border-top:.5px dashed #16304F}
.add input,.add select{background:#081321;border:.5px solid #1E3A5F;border-radius:8px;color:#E8F0F8;padding:6px 8px;font-family:inherit;font-size:12px}
.log{grid-column:1/-1;background:#0A1626;border:.5px solid #1E3A5F;border-radius:12px;padding:14px}
.log h2{font-size:13px;margin-bottom:8px}.logitem{font-size:11.5px;color:#8FA8C0;padding:4px 0;border-bottom:.5px dashed #16304F}
.banner{display:none;margin:0 22px 12px;padding:10px 14px;border-radius:10px;background:#2A1214;border:.5px solid #7A2A2E;color:#F3B5B4;font-size:12px}
</style></head><body>
<header><div><h1>三席多 Key 池</h1><div class="sub">田丰 · 赵云 · 诸葛亮｜手动录 Key（4–5）｜额度耗尽自动切换｜仅页面/日志告警</div></div>
<div><button onclick="load()">刷新</button></div></header>
<div class="banner" id="banner"></div>
<div class="muted" id="alloc-banner" style="margin:14px 22px 0;font-size:13px">智能分配：平台会按任务自动选择本地模型 / 云端模型 / 中转站 GPT-6；所有 AI 卡片保留，可手动覆盖。</div>
<section class="log" id="relay-hero" style="margin:16px 22px 0">
<h2>平台中转站（主入口 · 所有 AI 共用）</h2>
<div class="muted" style="margin-bottom:8px">先配平台中转站；下方席位卡只做路由适配。所有 AI 通过 8796 网关统一使用这里的 Key。</div>
<div id="relay-presets" style="display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px">
  <button type="button" data-rp="dashscope-plus">百炼 DashScope · qwen-plus</button>
  <button type="button" data-rp="dashscope-max">百炼 DashScope · qwen3-max</button>
  <button type="button" data-rp="tokenegate">中转站 GPT-6 · gpt-6-sol</button>
  <button type="button" data-rp="custom">自定义</button>
</div>
<div class="add">
  <input id="relay-url" placeholder="中转站 URL" value="https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions">
  <input id="relay-model" placeholder="模型" value="qwen-plus">
  <input id="relay-key" type="password" placeholder="粘贴平台中转站 Key（加密存储，只回显掩码）">
  <input id="relay-label" placeholder="标签（如 百炼主Key / 备1）" value="平台中转站主Key">
  <button id="relay-save">保存为平台中转站</button>
</div>
<div id="relay-status" class="muted" style="margin-top:8px">加载中…</div>
</section>
<section class="log" id="modelch-section" style="margin:14px 22px 0">
<h2>模型通道（本地 + 中转站 GPT-6）</h2>
<div id="modelch" style="display:flex;gap:12px;flex-wrap:wrap"></div>
</section>
<main id="main"></main>
<section class="log" id="cred-section" style="margin:0 22px 20px">
<h2>统一凭据（JEV / 数据接口 / 飞书）<span class="muted" style="font-size:11px">只读目录 · 真源 _vault（age 加密）· 不显示密钥</span></h2>
<div id="cred-list"></div>
</section>
<section class="log" id="vk-section" style="margin:0 22px 20px">
<h2>虚拟 Key（给 AI 用，不暴露真 Key）</h2>
<div id="vk-list" style="margin-bottom:8px"></div>
<div class="add">
  <input id="vk-owner" placeholder="归属（如 tianfeng / zhaoyun / agent-name）">
  <select id="vk-alias"><option value="auto">auto</option><option value="strong">strong</option><option value="local">local</option></select>
  <input id="vk-allowed" placeholder="允许别名（逗号分隔，留空=全部）">
  <button id="vk-create">创建虚拟 Key</button>
</div>
<div id="vk-token" class="muted" style="margin-top:8px"></div>
</section>
<section class="log" style="margin:0 22px 20px"><h2>切换日志</h2><div id="log"></div></section>
<script>
const $=id=>document.getElementById(id);
const el=(t,c,x)=>{const n=document.createElement(t);if(c)n.className=c;if(x!==undefined)n.textContent=x;return n};
function pill(s){const m={healthy:'ok',quota:'bad',invalid:'bad',degraded:'warn',pending:'muted',cooling:'warn'};return '<span class="pill '+(m[s]||'muted')+'">'+s+'</span>'}
async function api(body){const r=await fetch('/api/keys/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return await r.json()}
async function load(){
  try{
    const r=await fetch('/api/keys/state',{cache:'no-store'});const v=await r.json();
    if(!v.ok)throw new Error(v.error||'state');
    $('banner').style.display='none';
    const main=$('main');main.replaceChildren();
    for(const [sid,s] of Object.entries(v.seats)){
      if(sid==='relay') continue;
      const c=el('div','card');
      c.appendChild(el('h2','',s.cn+' · '+s.provider));
      const meta=el('div','meta','绑定 '+s.binding+' ｜ active '+((s.active_key_id)||'—')+' ｜ ');
      if(s.degraded){ meta.appendChild(el('span','bad','全部不可用')); }
      else { meta.appendChild(document.createTextNode('自动切换 '+(s.auto_switch?'ON':'OFF'))); }
      c.appendChild(meta);
      const tb=document.createElement('table');
      tb.innerHTML='<thead><tr><th>#</th><th>标签</th><th>Key</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody>';
      const tbody=tb.querySelector('tbody');
      const keys=s.keys||[];
      if(!keys.length){const tr=el('tr');const td=el('td','muted','未添加 Key');td.colSpan=5;tr.appendChild(td);tbody.appendChild(tr);}
      keys.forEach(k=>{
        const tr=el('tr');
        tr.appendChild(el('td','',k.priority));tr.appendChild(el('td','',k.label));tr.appendChild(el('td','',k.masked));
        const st=el('td');st.innerHTML=pill(k.status);tr.appendChild(st);
        const op=el('td');
        const bTest=el('button','','测试');bTest.onclick=()=>act({action:'test',seat:sid,key_id:k.id});op.appendChild(bTest);
        const bSw=el('button','','切换');bSw.onclick=()=>act({action:'switch',seat:sid,key_id:k.id});op.appendChild(bSw);
        const bDel=el('button','bad','删');bDel.onclick=()=>{if(confirm('删除该 Key？'))act({action:'delete',seat:sid,key_id:k.id})};op.appendChild(bDel);
        tr.appendChild(op);tbody.appendChild(tr);
      });
      c.appendChild(tb);
      const add=el('div','add');
      const inp=el('input');inp.type='password';inp.placeholder='粘贴 Key（仅本机加密存储）';
      const lab=el('input');lab.placeholder='标签（如 主Key/备1）';
      const pri=el('input');pri.type='number';pri.placeholder='优先级 1-5';pri.value=keys.length+1;
      let burl=null,bmodel=null;
      if(s.extra){
        const fk=(keys||[])[0]||{};
        const preset=document.createElement('select');
        preset.innerHTML='<option value="dashscope-plus">百炼 DashScope · qwen-plus</option>'
          +'<option value="dashscope-max">百炼 DashScope · qwen3-max</option>'
          +'<option value="deepseek">DeepSeek · deepseek-chat</option>'
          +'<option value="custom">自定义</option>';
        burl=el('input');burl.placeholder='OpenAI 兼容 URL';burl.value=fk.base_url||'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
        bmodel=el('input');bmodel.placeholder='模型';bmodel.value=fk.model||'qwen-plus';
        const applyPreset=()=>{
          const v=preset.value;
          if(v==='dashscope-plus'){burl.value='https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';bmodel.value='qwen-plus'}
          else if(v==='dashscope-max'){burl.value='https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';bmodel.value='qwen3-max'}
          else if(v==='deepseek'){burl.value='https://api.deepseek.com/v1/chat/completions';bmodel.value='deepseek-chat'}
        };
        preset.onchange=applyPreset;
        add.append(preset,burl,bmodel);
      }
      const b=el('button','','添加 Key');
      b.onclick=async()=>{if(!inp.value.trim()){alert('请粘贴 Key');return}const body={action:'add',seat:sid,secret:inp.value.trim(),label:lab.value.trim(),priority:Number(pri.value)||keys.length+1};if(s.extra){body.base_url=(burl.value||'').trim();body.model=(bmodel.value||'').trim()}await act(body)};
      add.append(inp,lab,pri,b);c.appendChild(add);
      const auto=el('button',s.auto_switch?'warn':'','自动切换: '+(s.auto_switch?'ON':'OFF'));
      auto.onclick=()=>act({action:'autoswitch_toggle',seat:sid,enabled:!s.auto_switch});c.appendChild(auto);
      main.appendChild(c);
    }
    const lg=$('log');lg.replaceChildren();
    (v.log||[]).forEach(l=>lg.appendChild(el('div','logitem',l.at+' | '+l.seat+' | '+(l.from||'-')+'→'+(l.to||'-')+' | '+l.reason+' | '+l.result)));
  }catch(e){const b=$('banner');b.textContent='Key 池不可达：'+e.message;b.style.display='block'}
}
async function act(body){const r=await api(body);if(!r.ok)alert('失败：'+(r.error||'unknown'));load()}

async function loadVK(){
  try{
    const r=await fetch('/api/router/vk',{cache:'no-store'}); const v=await r.json();
    const box=document.getElementById('vk-list');
    if(!v.ok){box.innerHTML='<div class="muted">虚拟 Key 不可用：'+v.error+'</div>';return}
    if(!(v.items||[]).length){box.innerHTML='<div class="muted">还没有虚拟 Key</div>';return}
    let h='<table><thead><tr><th>ID</th><th>归属</th><th>别名</th><th>允许</th><th>掩码</th><th>状态</th><th>操作</th></tr></thead><tbody>';
    for(const k of v.items){
      h+='<tr><td>'+k.id+'</td><td>'+k.owner+'</td><td>'+k.alias+'</td><td>'+((k.allowed||[]).join(','))+'</td><td>'+k.masked+'</td><td>'+(k.enabled?'启用':'停用')+'</td>'
        +'<td>'+(k.enabled?'<button onclick="disableVK(\''+k.id+'\')">禁用</button>':'—')+'</td></tr>';
    }
    box.innerHTML=h+'</tbody></table>';
  }catch(e){document.getElementById('vk-list').innerHTML='<div class="muted">加载失败：'+e.message+'</div>'}
}
async function createVK(){
  const owner=document.getElementById('vk-owner').value.trim();
  const alias=document.getElementById('vk-alias').value;
  const raw=document.getElementById('vk-allowed').value.trim();
  const allowed=raw?raw.split(',').map(x=>x.trim()).filter(Boolean):null;
  if(!owner){alert('请填归属');return}
  const r=await fetch('/api/router/vk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',owner,alias,allowed})});
  const v=await r.json();
  if(!v.ok){alert('失败：'+v.error);return}
  document.getElementById('vk-token').textContent='新 Key（只显示一次）：'+v.item.token;
  loadVK();
}
async function loadCreds(){
  try{
    const r=await fetch('/api/credentials',{cache:'no-store'}); const v=await r.json();
    const box=document.getElementById('cred-list');
    if(!v.items){box.innerHTML='<div class="muted">目录不可用</div>';return}
    let h='<table><thead><tr><th>类别</th><th>名称</th><th>环境变量</th><th>加密</th><th>状态</th><th>更新时间</th><th>轮换入口</th></tr></thead><tbody>';
    for(const x of v.items){h+='<tr><td>'+x.category+'</td><td>'+x.name+'</td><td>'+(x.env||'')+'</td><td>'+(x.encrypted?'是':'明文/缺失')+'</td><td>'+x.status+'</td><td>'+(x.updated||'')+'</td><td class="muted">'+(x.rotate||'')+'</td></tr>'}
    box.innerHTML=h+'</tbody></table>';
  }catch(e){document.getElementById('cred-list').innerHTML='<div class="muted">加载失败：'+e.message+'</div>'}
}
loadCreds(); setInterval(loadCreds,60000);
async function disableVK(id){
  if(!confirm('禁用虚拟 Key '+id+'？'))return;
  const r=await fetch('/api/router/vk',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'disable',id})});
  const v=await r.json(); if(!v.ok){alert('失败：'+v.error);return} loadVK();
}
document.getElementById('vk-create').onclick=createVK;
loadVK();


const RELAY_PRESETS={
 'dashscope-plus':{url:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',model:'qwen-plus'},
 'dashscope-max':{url:'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions',model:'qwen3-max'},
 'tokenegate':{url:'https://tokenegate.com/v1/chat/completions',model:'gpt-6-sol'},
 'custom':{url:'',model:''}
};
document.querySelectorAll('#relay-presets button').forEach(b=>{
  b.onclick=()=>{const v=RELAY_PRESETS[b.dataset.rp]||{}; if(v.url) document.getElementById('relay-url').value=v.url; if(v.model) document.getElementById('relay-model').value=v.model;};
});
async function loadRelay(){
  try{
    const r=await fetch('/api/keys/state',{cache:'no-store'}); const v=await r.json();
    const s=(v.seats||{}).relay||{}; const box=document.getElementById('relay-status');
    const keys=s.keys||[];
    if(!keys.length){box.textContent='平台中转站未配置 Key。选上方预设，粘贴 Key 后保存。';return}
    box.innerHTML='当前：'+keys.map(k=>k.masked+' ['+k.status+'] '+(k.model||'')).join(' ｜ ');
  }catch(e){document.getElementById('relay-status').textContent='读取失败：'+e.message}
}
async function saveRelay(){
  const url=document.getElementById('relay-url').value.trim();
  const model=document.getElementById('relay-model').value.trim();
  const key=document.getElementById('relay-key').value.trim();
  const label=document.getElementById('relay-label').value.trim()||'平台中转站主Key';
  if(!url||!model||!key){alert('URL / 模型 / Key 都要填');return}
  const r=await fetch('/api/keys/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'add',seat:'relay',secret:key,label,base_url:url,model})});
  const v=await r.json();
  if(!v.ok){alert('保存失败：'+(v.error||'unknown'));return}
  document.getElementById('relay-key').value='';
  alert('已保存到平台中转站（只回显掩码）');
  loadRelay(); load();
}
document.getElementById('relay-save').onclick=saveRelay;
loadRelay(); setInterval(loadRelay,30000);



async function loadModelCh(){
  const box=document.getElementById('modelch'); if(!box) return;
  try{
    const r=await fetch('/api/models/status',{cache:'no-store'}); const v=await r.json();
    const L=v.local||{}, G=v.relay_gpt6||{};
    const lc=L.online?('在线'+(L.present?' · 默认 9B 已就绪':' · 模型未拉取')):('离线：'+(L.error||''));
    const mods=(L.models||[]).map(m=>m.name+' ('+m.size_gb+'GB)').join(' ｜ ')||'未读取到';
    const gc=G.configured?('已配置 · '+((G.keys||[]).map(k=>k.masked+'['+k.status+']').join(','))):'未配置 Key（需在平台中转站填中转站 Key）';
    box.innerHTML=
      '<div class="card" style="min-width:420px;flex:1"><h2>本地模型 · 分层自动选择</h2>'
      +'<div class="meta">'+lc+'</div><div class="meta">'+mods+'</div>'
      +'<div class="meta">简单→<b>qwen3.5:4b</b> ｜ 默认→<b>qwen3.5:9b</b> ｜ 复杂兜底→<b>qwen3.6:35b-a3b</b></div>'
      +'<div class="meta">手动别名：<b>local4</b> / <b>local9</b> / <b>local35</b> / <b>local</b></div></div>'
      +'<div class="card" style="min-width:340px;flex:1"><h2>中转站 GPT-6 · gpt-6-sol</h2>'
      +'<div class="meta">'+gc+'</div><div class="meta">需要中转站 Key · 端点由平台中转站决定</div>'
      +'<div class="meta">网关别名：<b>gpt6</b> / <b>gpt-6-sol</b></div>'
      +'<button id="gpt6-config">去配置 GPT-6</button></div>';
    const btn=document.getElementById('gpt6-config');
    if(btn) btn.onclick=()=>{const b=[...document.querySelectorAll('#relay-presets button')].find(x=>x.dataset.rp==='tokenegate'); if(b) b.click(); document.getElementById('relay-hero').scrollIntoView({behavior:'smooth'});};
  }catch(e){box.innerHTML='<div class="muted">模型通道读取失败：'+e.message+'</div>'}
}
loadModelCh(); setInterval(loadModelCh,30000);
load();setInterval(load,30000);
setInterval(loadVK,30000);
</script></body></html>
