# 社区情绪日表监控名单（tools/data_hub/sentiment.py 的取数范围）
#
# 改这个文件等于改监控范围，不需要动代码。
# code 用 6 位代码；note 写清为什么盯它 —— 半年后回来看，note 比 code 有用。

codes:
  - code: "600519"
    note: "茅台：帖子量大、噪声高，作为口径基准与压力测试样本"
  - code: "301216"
    note: "weak 案例库当前跟踪主体（已结案归档，保留观察）"

# 多空关键词：只做粗粒度方向，命中统计写进日表，原始标题也保留在帖子层，
# 后续要用模型重打分不必重采。
bull_words: [看多, 加仓, 买入, 涨停, 突破, 新高, 利好, 反转, 抄底, 起飞]
bear_words: [看空, 减仓, 卖出, 跌停, 破位, 新低, 利空, 割肉, 套牢, 崩]
