# 全网数据源登记表（data_hub 唯一事实来源）
#
# 定位：这是「能从哪里取数」的登记，不是「已经取到数」的登记。
#      - 已接入的表由 quant_backtest/data/catalog.json 负责（物理事实）
#      - 本文件负责来源侧：许可、频率、出口路径、探针、覆盖范围、状态
#      - 两者由 govern.py 对账，缺口即工单
#
# 字段契约（registry.py 校验，缺字段即报错）：
#   id            唯一标识，小写下划线
#   name          中文名
#   domain        quote|finance|disclosure|flow|macro|derivatives|overseas|crypto|alt
#   home          站点主页
#   license       public_api|public_page|open_license|paid|unknown
#   freq          RT|D|W|M|Q|A|EVENT
#   update_window 可得时间窗（自然语言，供调度参考）
#   proxy_policy  direct|env|local|auto（见 net.py 实测说明）
#   status        verified|reachable_guarded|unreachable|planned
#                 verified          实测 2xx
#                 reachable_guarded 实测 4xx 但站点可达，需特定头/参数/鉴权
#                 unreachable       实测连接失败（可能是本机出口限制，非源消失）
#                 planned           本次未测
#   adapter       取数方式：tushare|http_json|http_csv|http_html|file|sdk
#   covers        覆盖内容（中文要点）
#   linked_tables catalog.json 里对应的表名前缀（可为空）
#   probe         {url, expect, note}，expect 是期望状态码
#   note          实测备注（写实测到的事实，不写猜测）

meta:
  version: 1
  updated: "2026-11-05"
  measured_by: "tools/data_hub/probe.py"
  measured_at: "2026-11-05T07:4x+08:00"
  egress_finding: >
    国内 A 股源必须 direct：实测 api.tushare.pro 直连 1.1s / 走 env 代理 12.3s；
    d.10jqka.com.cn 直连 0.96s / 走代理超时；push2.eastmoney.com 走代理 ProxyError。
    akshare 默认 trust_env=True 会继承环境代理，是当前国内源慢/失败的主因。

# catalog.json 里的 source 是「渠道」语义（实际落数的通道），sources 的 id 是
# 「来源机构」语义。两者不是一一对应，必须显式声明，否则对账必然误报。
# 值为空列表 = 已知无对应源（属于真实缺口，由 govern 报「有表无源」）。
catalog_source_map:
  xtcloud: [xtcloud]
  tushare: [tushare]
  xueqiu: [xueqiu]
  cnopendata: [cnopendata]
  guba: [guba]
  crypto: [binance, okx]
  factor_library: [tushare]
  legacy: []
  pg: []

# 时效阈值（天）：catalog.freshness 距今天超过该值即判 stale。
# Q 取 150 而非 100：财报按季披露，季末到入库本就有 3-4 个月滞后，
# 卡 100 天会把港股财务四表这种正常数据全打成欠账（2026-11-05 实测误报 6 张）。
freshness_sla_days:
  RT: 3
  D: 3
  W: 10
  M: 35
  Q: 150
  A: 400
  EVENT: 15

# 按表覆盖 SLA：catalog 的 freq 有相当一部分标错（低频表标成 D），
# 不覆盖就会天天误报。这里只放"已核过实际更新节律"的表。
freshness_sla_overrides:
  ts_fina_audit: 100        # 审计意见，随年报/季报，非日更
  ts_fund_portfolio: 100    # 基金持仓，按季披露
  stk_managers: 45          # 管理层变动，低频
  ts_index_monthly: 45      # 指数月线
  ts_index_member_all: 45   # 指数成分，按月调整

# 不参与时效判定（探针表/一次性快照，本身不代表覆盖）
freshness_exempt:
  - irm_qa_sh_probe
  - irm_qa_sz_probe

