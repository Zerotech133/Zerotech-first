entry_rule: 五要素同现：①量柱长期百日低量群；②价柱大起大落波浪滔天；③启动柱倍阳过左峰/踩线（vol/prev_vol>=1.9 and close>prev_high）；④拉升柱价升量缩越走越强；⑤回踩依托黄金十字/黄金线 → 启动柱确认后入场；三阶段：孕育期→启动期→爆发期
exit_rule: 收盘跌破启动柱实底或最近黄金十字止损；趋势跟踪（价升量缩不破则持有）
