notes: |-
  原文（长腿踩线章末）：长腿踩线是多重基因集合的导火索，火药早在13天前的A柱开始填充；“任何单一的涨停基因不能引爆涨停，它必须有其他基因如导火索一样连结起来”（印刷84-97页，OCR 第104-117页，证据第116页）。
