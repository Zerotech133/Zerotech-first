entry_rule: 多个涨停基因（倍量伸缩/长腿踩线/假阴真阳/黄金柱/价升量缩等）在<=13个交易日内密集连成“导火索”形态；火药填充完成（底部逐步抬高）后，最后一根放量阳线过峰确认（close>prev_high and vol/prev_vol>=1.9）→ 入场
exit_rule: 收盘跌破导火索起点（A柱/首个黄金柱实底）止损；信号未确认不持有
