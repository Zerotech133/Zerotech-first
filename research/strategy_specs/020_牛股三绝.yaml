notes: |-
  原文：牛股三绝=倍量不穿（后市翻番）、高量不破（后市必火）、跳空不补（后市如虎）；用于“骑牛”不被甩下来的持有过滤，配合牛股量形使用（印刷155-163页，OCR 第175-183页）。
  简化定义：三种“不穿/不破/不补”用日线回调低点与柱体阈值程序化；作为过滤器需先有 LX02/LX19 选股前置。
