evidence_quote: 所谓“倍量不穿”，就是倍量柱后面的波段回调没有击穿其倍量柱对应的价柱实体
type: 过滤器
computability: A
params:
  double_vol_ratio_min: 1.9
  high_vol_lookback_days: 60
  gap_hold_ratio_min: 0.99
  target_multiple: 2.0
entry_rule: 持有/加仓过滤（不是独立入场）：倍量不穿=倍量柱（vol/prev_vol>=1.9 且收阳）后回调 close >= 该柱实体下沿；高量不破=高量柱（近60日最高量）后回调 close >= 其价柱实底 且后续量柱不超高量柱；跳空不补=向上跳空缺口回调低点不破缺口/元帅柱实顶 → 维持持有；目标位=第3根倍量不穿柱实顶×2 递推
exit_rule: 对应基因被击穿（跌破倍量柱实体/高量柱实底/回补缺口）即离场；目标位=实顶×2 到达后按书分批
