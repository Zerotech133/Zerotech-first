evidence_quote: 基柱后3天的平均收盘价低于基柱实顶线，却高于基柱实底线
type: 形态
computability: B
params:
  confirm_days: 3
  bottom_hold_ratio_min: 0.99
  flat_bottom_days_min: 3
  flat_bottom_days_max: 8
