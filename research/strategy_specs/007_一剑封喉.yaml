notes: |-
  原文三要素：封喉线取点、第3个大阴实顶确认、底部最好为精准线/黄金线；交叉处“逼涨三角”易出中到大阳，2012-07-19 两市 46 只涨停中 44 只符合（印刷153-161页，OCR 第171-180页）。
  简化定义：斜衡线/平衡线需算法拟合，属于画线类战法；给出可计算的“三角区间+底部基因”代理规则。
  状态：未测；可计算化程度 C（依赖画线算法与人工判读）。
