evidence_page: 171
evidence_quote: 所谓“一剑封喉”，就是一条特殊的下行斜衡线所形成的“剑”，刚好与底部水平的平衡线相交的“喉”切合，形成平底三角形
type: 形态
computability: C
params:
  cross_tol_pct: 0.005
  confirm_points_min: 3
  slope_lookback_days: 20
  triangle_window_days: 10
entry_rule: A=距今最近波峰右侧最凸出的大阴实顶; B=距今最近凹底左侧最凸出的大阴实顶; AB 连线为封喉线（需至少第3个大阴实顶 C 确认）; D=底部水平平衡线（精准线/黄金线/真底线）; 价格进入 AB×D 的逼涨三角并出现长阳矮柱/假阴真阳等底部涨停基因（close>open 且 vol/prev_vol>=1.5）→ 入场
exit_rule: 收盘跌破底部平衡线 D（close < D*0.995）止损；三角区上沿突破失败离场
test_status: untested
tested_ref: null
