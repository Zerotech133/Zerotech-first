notes: |-
  原文：双阴出货的临界点=第一阴柱跌破左侧第一阳柱实底（阴克阳，快逃亡）；第二阴柱有效跌破第一阴柱收盘价亦出货；17 处样本中仅 4 处失误，且失误全在上升途中（印刷43-53页，OCR 第63-68页）。
  简化定义：纯日线可算，但原书用于盘中分时确认，故作为事件级出场规则登记。
