entry_rule: 出场/风控信号（非做多入场）：连续两根阴柱（含低开高走假阳柱），若第二根阴柱收盘 <= 第一根阴柱收盘，或第一根阴柱跌破左侧第一阳柱实底 → 盘中/收盘出货；趋势过滤：下降途中的双阴出货全部正确，上升途中不正确（不做规避）
exit_rule: 触发即清仓/减仓；不适用持有期；与“大阴出货技术”联动可提高胜率
