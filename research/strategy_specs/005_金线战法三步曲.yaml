entry_rule: 三步曲：①找准黄金柱（LX02）；②顺着主力画黄金线（取点：基柱实顶/实底/后3日最低实底或虚底）；③用活黄金线：价格回踩黄金线不破 or 碰线即起（low <= line*1.01 and close >= line*0.99 and 收阳）→ 入场；强庄踩顶/精庄踩腰/狡庄踩脚分类用回踩深度区分
exit_rule: 收盘有效跌破当前黄金线（close < line*0.99）止损；黄金十字连续3个组合后目标涨幅约+30%分批止盈
