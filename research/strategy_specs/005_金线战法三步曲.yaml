notes: |-
  原文：黄金线=主庄攻防线/生命线；取点原则“先找顶，后找底，先找实，后找虚，微调抓战机”；黄金双线=依托黄金柱设上下两线（上线主攻、下线主守）；黄金十字=黄金柱竖线×精准线横线，“左支右撑、顶底互换”（印刷98-134页，OCR 第116-152页）。
  简化定义：黄金线用黄金柱/后3日极值可程序化生成，回踩用容差1%；画线精度要求高，可计算化程度 B。
