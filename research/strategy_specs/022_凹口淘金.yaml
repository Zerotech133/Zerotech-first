entry_rule: ①凹口形成：长阴短柱（pct_chg<=-3 且 vol<=prev_vol*0.7）砸出凹口；②凹底刹车换挡：凹底出现隐形黄金柱/接力黄金柱（两柱后3日价升量缩）；③凹底加油：放量阳线收复凹口平衡线（close > concave_line）→ 入场
exit_rule: 收盘跌破凹底谷底线/黄金线（close < bottom_line*0.99）止损；持有 5/10 个交易日
