entry_rule: 左右两个小阳柱（close>open、1.0<=vol/prev_vol<1.9），间隔3~5日，两柱实底/关键点重合形成精准线（abs(a/b-1)<=0.01），右阳为王牌柱/黄金柱（后续3日不破实底）; 突破右阳实顶（close > right_high）→ 入场
exit_rule: 收盘跌破精准线/左阳实底止损；持有 5/10/20 个交易日
