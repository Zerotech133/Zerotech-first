notes: |-
  原文五特点：对称小双阳夹精准线、对应量柱为“小阳”、左阳阳盖阴/阳并阴或长阳矮柱而右阳须为王牌柱、两柱间隔3~5日、“左刹车右换挡”的小 W 双底（印刷34-42页，OCR 第54-61页）。
  简化定义：小阳/精准线/右阳牌柱均可用日线阈值程序化；“王牌柱”复用 LX02/LX03。
