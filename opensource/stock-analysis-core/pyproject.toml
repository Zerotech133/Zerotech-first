[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-analysis-core"
version = "0.1.0"
description = "Open-core stock research pipeline: snapshot -> events -> features -> gates -> verdict -> report"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "ZeroBound Contributors"}]
keywords = ["stock", "research", "pipeline", "report", "equity"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
stock-analysis = "stock_analysis_core.cli:main"

[tool.setuptools]
packages = ["stock_analysis_core", "stock_analysis_core.adapters"]
