id_chain:
  version: id_chain/v1
  order:
  - pool_id
  - card_id
  - case_id
  - decision_id
  - handoff_id
  - watch_plan_id
  - trigger_id
  - confirmation_id
  - trade_id
  - outcome_id
  - training_episode_id
  entities:
    pool_id:
      format: ^ACAD1-REC-\d{8}$
      generator:
        owner: ACAD1
        interface: acad1.pool.get
        component: ACAD1 pool publisher
        status: v1
      source_of_truth:
        kind: pg_table
        ref: zhice_os_v2.public.v2_acad1_pool
        projection: agent_platform/data/recommendation_pool/latest.json
      upstream: []
      downstream:
      - card_id
      status: v1
      note: 当前 JSON 投影 pool_id=ACAD1-REC-YYYYMMDD 已存在；PG 发布器 F2 收口
    card_id:
      format: ^ACAD1-CARD-\d{8}-[0-9A-Za-z._-]{1,16}$
      generator:
        owner: ACAD1
        interface: acad1.pool.get
        component: ACAD1 pool card builder
        status: draft
      source_of_truth:
        kind: pg_table
        ref: v2_acad1_pool 卡视图（规划）
        projection: recommendation_pool/latest.json items[].item_id（当前代理 REC-*）
      upstream:
      - pool_id
      downstream:
      - case_id
      status: draft
      note: 当前仅有 item_id=REC-YYYYMMDD-NNNNNN 投影，F2 正式化 card_id
    case_id:
      format: ^D1-CASE-\d{8}-[0-9A-Za-z._-]{1,16}$
      generator:
        owner: D1
        interface: d1.case.upsert
        component: D1 research case store
        status: draft
      source_of_truth:
        kind: ledger
        ref: agent_platform/data/d1_cases.jsonl
        status: planned
      upstream:
      - card_id
      downstream:
      - decision_id
      status: draft
      note: 当前无 case 账本；D1 研究以 code/symbol 承载，F3 补 case_id（禁止用 code 代替）
    decision_id:
      format: ^D1-\d{8}-[0-9a-f]{10}$
      generator:
        owner: D1
        interface: d1.decision.create
        component: engine/decision_policy.py::decision_id
        status: draft
      source_of_truth:
        kind: ledger
        ref: agent_platform/data/d1_decisions.jsonl
        secondary: agent_platform/data/shadow/shadow_ledger.jsonl
      upstream:
      - case_id
      downstream:
      - handoff_id
      status: draft
      note: 权威生成方=engine/decision_policy.py（D1-<date>-<sha10>）；agent_platform/d1_decision.new_decision_id
        的 d1-<ts>-<hex6> 为人工裁决历史格式，F3 收敛，详见 deviations
    handoff_id:
      format: ^d1h-\d{14}-[0-9a-f]{6}$
      generator:
        owner: D1
        interface: d1.handoff.create
        component: agent_platform/d1_handoff.py::new_receipt_id
        status: v1
      source_of_truth:
        kind: ledger
        ref: agent_platform/data/d1_handoffs.jsonl
      upstream:
      - decision_id
      downstream:
      - watch_plan_id
      status: v1
      note: receipt_id 为 deprecated alias，统一名 handoff_id；v2 扩 watch_plans[] 后 handoff
        携带下游计划
    watch_plan_id:
      format: ^wp-\d{8}-[0-9a-f]{6}$
      generator:
        owner: WA1
        interface: watch.plan.create
        component: watch plan consumer
        status: v1
      source_of_truth:
        kind: ledger
        ref: agent_platform/data/watch_plans.jsonl
        status: planned
      upstream:
      - handoff_id
      downstream:
      - trigger_id
      status: v1
      note: 当前缺失（F3 WO-IFS-WATCHCONS）；armed plan 消费 D1 handoff
    trigger_id:
      format: ^trg-\d{8}-[0-9a-f]{6}$
      generator:
        owner: WA1
        interface: watch.trigger.create
        component: agent_platform/watch_trigger_adapter.py
        status: draft
      source_of_truth:
        kind: ledger
        ref: agent_platform/data/watch_triggers.jsonl
        status: planned
      upstream:
      - watch_plan_id
      downstream:
      - confirmation_id
      status: draft
      note: 现状 adapter 直接建 confirmation（跳过独立 trigger 账本），F3 补
    confirmation_id:
      format: ^CFM-[0-9A-F]{12}$
      generator:
        owner: TR1
        interface: confirm.create
        component: agent_platform/trading_bot_flow.py::create_confirmation
        status: v1
      source_of_truth:
        kind: ledger
        ref: agent_platform/data/confirmations/<confirmation_id>.json
      upstream:
      - trigger_id
      downstream:
      - trade_id
      status: v1
      note: 已有；但当前只承接 source_report_id，未承接四 ID（decision/handoff/watch_plan/trigger），F4
        补
    trade_id:
      format: ^trd-\d{8}-[0-9A-F]{8}$
      generator:
        owner: TR1
        interface: paper.execution.record
        component: agent_platform/paper/paper_book.py::append_ledger
        status: v1
      source_of_truth:
        kind: ledger
        ref: agent_platform/data/paper/paper_ledger.jsonl
      upstream:
      - confirmation_id
      downstream:
      - outcome_id
      status: v1
      note: 当前 paper ledger 只有 prev_hash/hash + date,symbol，无 trade_id（P1 实证），F4 补
    outcome_id:
      format: ^out-\d{8}-[0-9A-F]{8}$
      generator:
        owner: D1
        interface: outcome.get
        component: agent_platform/decision_outcomes.py::run_backfill
        status: draft
      source_of_truth:
        kind: ledger
        ref: agent_platform/data/shadow/decision_outcomes.jsonl
      upstream:
      - trade_id
      downstream:
      - training_episode_id
      status: draft
      note: outcome sidecar 已有 decision_id/next_day_return 等，但无 outcome_id，F5 补
    training_episode_id:
      format: ^ep-\d{8}-[0-9A-F]{8}$
      generator:
        owner: D1
        interface: training.episode.get
        component: D1 training episode builder
        status: draft
      source_of_truth:
        kind: dataset
        ref: agent_platform/data/training/episodes.jsonl
        status: planned
      upstream:
      - outcome_id
      downstream: []
      status: draft
      note: 训练 episode 当前缺失（F5 WO-IFS-TRAIN）
  invariants:
  - 下游记录必须保存上游 ID（每跳携带 upstream_id 字段；不得只存 code/report_id）
  - 同一 ID 只允许一个权威生成方（见 entities[*].generator.interface）
  - 禁止用 code 代替 case_id/decision_id（P0-5）
  - receipt_id 与 handoff_id 不双名混用：handoff_id 唯一，receipt_id 仅兼容读
  - trade_id 只由唯一执行入口 paper.execution.record 生成；paper.order/paper.direct 不得生成
  - 幂等：同一上游 ID 重复投递返回同一记录/同一 ID（IFS-06）
  deviations:
  - id: decision-id-dual-format
    current: engine/decision_policy.py → D1-<yyyymmdd>-<sha256[:10]>；agent_platform/d1_decision.py
      → d1-<YYYYMMDDHHMMSS>-<hex6>
    target: 单一权威 decision_id（建议 engine/decision_policy 公式）在 F3/F5 收敛；收敛前登记表以引擎公式为权威，人工裁决格式为兼容读
    wo: WO-IFS-HANDOFF-20261103
  - id: receipt-id-alias
    current: d1_handoff 内部字段 receipt_id（历史命名）
    target: 对外统一 handoff_id；receipt_id 仅作为 deprecated alias 读兼容
    wo: WO-IFS-HANDOFF-20261103
  - id: card-id-proxy
    current: 池 items[].item_id=REC-YYYYMMDD-NNNNNN
    target: 正式 card_id（ACAD1-CARD-*）由 ACAD1 卡构建器发布
    wo: WO-IFS-ACAD1-20261103
  gaps:
  - card_id
  - case_id
  - trigger_id
  - outcome_id
  - training_episode_id
envelope:
  success_required:
  - ok
  - schema_version
  - request_id
  - source
  - data
  - warnings
  success_optional:
  - generated_at
  - trace_id
  success_constraints:
    ok: true
    schema_version: <interface schema，如 d1.research/v1；禁止缺省>
    request_id: ^req-[0-9a-f]{32}$
    source: object：interface_id/source_of_truth/source_mode/as_of/freshness_s/stale
      + 接口相关 ID（如 pool_id/decision_id）
    data: object|array|null（null 仅限 ok=true 且 warnings 说明无数据；禁止假成功）
    warnings: array<{code,message,details}>（无告警必须 []，不得缺省）
  error_required:
  - ok
  - schema_version
  - request_id
  - error
  error_schema_version: error/v1
  error_required_detail:
  - code
  - message
  - retryable
  - details
  error_codes:
    invalid_request:
      http: 400
      retryable: false
      scene: 请求格式/方法/路由不匹配
    invalid_parameter:
      http: 400
      retryable: false
      scene: 参数取值非法
    bad_body:
      http: 400
      retryable: false
      scene: body 非 JSON / 非 object
    execution_field_forbidden:
      http: 400
      retryable: false
      scene: handoff/确认携带 order/qty/broker 等执行字段（IFS-05）
    bad_target_action:
      http: 400
      retryable: false
      scene: target/action 组合非法（watch/trade 目标域）
    unauthorized:
      http: 401
      retryable: false
      scene: 缺 portal-token；8787 401 为登录门
    forbidden:
      http: 403
      retryable: false
      scene: roles 不足
    not_paper:
      http: 403
      retryable: false
      scene: paper_only=true 被违反
    not_found:
      http: 404
      retryable: false
      scene: 资源不存在
    route_not_found:
      http: 404
      retryable: false
      scene: 未登记路由
    conflict:
      http: 409
      retryable: false
      scene: 状态冲突（已确认/已执行）
    duplicate:
      http: 409
      retryable: false
      scene: 重复创建但语义非幂等
    idempotent_replay:
      http: 200
      retryable: false
      scene: 同 idempotency_key/source 返回原记录（ok=true + warning）
    unprocessable:
      http: 422
      retryable: false
      scene: 业务规则拒绝（风控/证据不足）
    rate_limited:
      http: 429
      retryable: true
      scene: 限流，按 Retry-After 退避
    internal_error:
      http: 500
      retryable: true
      scene: 接口内部异常（掩码堆栈）
    upstream_unavailable:
      http: 502
      retryable: true
      scene: 上游依赖不可用
    not_ready:
      http: 503
      retryable: true
      scene: 依赖未就绪（如上下文预热）
    data_unavailable:
      http: 503
      retryable: true
      scene: 数据缺失/未生成（不造数）
    kill_switch_active:
      http: 503
      retryable: false
      scene: PAPER_KILL 生效
    timeout:
      http: 504
      retryable: true
      scene: 处理超时
  source_modes:
  - pg_official
  - projection
  - ledger
  - static
  - aggregate
  - manifest
