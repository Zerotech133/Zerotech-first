步都在前行。","video_key":"20260323_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_baa4ed6b19","blogger":"行道者悟道","match":"exact","cls":"U","claim":"我是天空中的鸟，怎敢奢望学会跑，飞着飞着就懂了各有各自的大道。我是天空中的鸟，怎敢奢望学会碰撞，也值得我这一生的骄傲。","video_key":"20260422_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_aac0848946","blogger":"行道者悟道","match":"exact","cls":"U","claim":"人风雨越过岁月清开，初心始终在点滴盛开，随人潮，坚守方向，不惧阻碍。让热忱穿过层层无碍，时针对抗无奈，将不用换来的路。","video_key":"20260513_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_711ad474f2","blogger":"行道者悟道","match":"exact","cls":"U","claim":"就去浅浅喜欢不猜，就去静静爱着现在，去深深思索着年代，去淡淡释怀那一晚。","video_key":"20260727_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_80a3b26c15","blogger":"行道者悟道","match":"exact","cls":"U","claim":"秋风你可懂不得已，不负寄握着牵挂飘向远方去。往事像冷冷的孤鸥机，在心里缠绕不曾停息。记不完过往的天地，安静独坐的时候也难忘记。从初识到半思绪，满卷的风提我要点你。","video_key":"20261021_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e522939acb","blogger":"（未归属）","match":"no_match","cls":"U","claim":"与你的世界盛大而灿烂。与你的身边永远。与所有长夜有等战。","video_key":"20261021_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_1bdf32cf7d","blogger":"（未归属）","match":"no_match","cls":"U","claim":"你总是莫老或牵手这样的我。","video_key":"20261022_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_aabb5b575b","blogger":"行道者悟道","match":"exact","cls":"M","claim":"敢于认错，才能一直在市场里留下来，等下一次送给所有还在和侥幸心理对抗的交易者。","video_key":"20261028_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_41cdd029a2","blogger":"翻奇兽AI","match":"exact","cls":"T","claim":"你有没有发现，资料越存越多，真正要用的时候，反而什么都找不到?个人知识库的核心问题不是存起来，而是问得出来。传统文件家靠你记文件名，AI知识库靠机器理解语义。你问去年报销政策怎么改了?它要能找到差旅费管理办法修订说明。这就是语义检索的价值。第一条关键认知，普通人搭建知识库，通常不是训练模型，而是做REC。也就是先从你的资料里检索，再把相关内容塞给大模型，让它基于证据回答。你可以把REG理解成一条流水线。前半段叫入库，把资料加工成机器能搜的形态。后半段叫问答，把问题转成检索请求，再让大模型基于检索结果生成答案。","video_key":"20260603_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_04340dc482","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"小学和初中真正要打下的基础是阅读能力、表达能力、逻辑能力和学习习惯。孩子能不能读懂一段文字，能不能讲清楚一件事，能不能知道什么是证据，能不能把不会的东西拆成小问题，这些能力比提前刷多少难题更重要。这个阶段怎么落地?学校可以减少机械重复作业，增加项目式学习。比如，让孩子围绕校园午餐浪费，做一次调查。他们要观察、记录、采访、统计、写报告、提方案。家长也可以从一句话开始改变。不要只问今天考了多少分，可以问，你今天学到的最有意思的东西是什么?你遇到的一个问题是什么?你准备用什么办法解决?高中阶段绕不开高考。在中国国情下，高考仍然是相对公平、相对透明的选拔机制。","video_key":"20260608_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_edc00004cb","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"但弱点是，如果环境变了，物体材质变了，它可能没来得及想后果就已经执行。4D世界模型比VLA多了一层时间感。它不只看当前画面，还会预测下一秒，下几秒场景怎么变化。比如杯子被推之后会移动，水可能晃动，障碍物会影响路径。它开始具备看未来的能力。5D世界模型更进一步，把动作控制也纳入世界演化。北大Evolve This World强调第一视角，人手交互，物理反馈和自我迭代。简单说，它不只是生成世界，而是让AI在世界里操作，验证，在学习。李飞飞团队把世界模型拆成三类功能，渲染器、模拟器、规划器。渲染器负责生成可见世界，模拟器负责预测变化，规划器负责选择下一步。这个地图让大家知道自己到底在做哪块拼图。","video_key":"20260610_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_cd5eec1444","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"与此同时，JackBrainz体系的主流ID也开始更好地接入鸿蒙开发环境，再加上云端智能编码能力，说明官方正在降低开发者入场门槛。生态方面，这次看点不是多了几个APP，而是全场景协同能力更清晰了。鸿蒙Next座舱第一次正式亮相，说明车机已经开始成为重点入口。再加上分布式软总线2.0、星闪3.0和WiFi7跨设备内容流转汇更像同一个系统，而不是多个设备之间硬连接。这对需要多终端联动的应用特别重要。很多人会问，鸿蒙原生和传统安卓方案相比，区别到底在哪?最核心的差别不是能不能安装，而是设计哲学不同。传统兼容开发强调先跑起来，而鸿蒙原生更强调统一能力调用、统一入口、系统级AAR和跨设备协同。","video_key":"20260612_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e3ad97b653","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"第四步，最后输出一份完整的数据分析报告。不管是销售数据、财务报表、用户行为分析还是市场调研都能零代码搞定。第三个场景，定时任务自动化。这个太香了。你可以设置，每天早上9点，帮我整理昨天的行业新闻，生成一份简报。每周五下午6点，自动生成本、周工作周报。每个月1号，统计上月数据并生成报表。设置好之后，豆包就会7×24小时无人执手自动执行，真正解放你的双手。第四个场景，零代码生成网页。不需要懂编程，只要描述你的需求，几分钟就能做出精美的网页，个人作品及网站，产品介绍落地页，活动宣传页面，个人简历主页。生成的网页是响应式设计，支持一键发布，免费托管，还能绑定独立域名。接下来分享三个实用技巧。","video_key":"20260614_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_8bfe3b24ad","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"Zuckerberg据称承认，重组和加码还没换来理想速度。结论很直接，把AI变成员工，不是多堆卡就能解决。第五条，生数科技发布Vidu SE。重点是实时视频通话、语音控制和连续互动。搞AIGC的可以马助，AI视频正在从等生成，变成可操控。第六条，Enthropic据报找Samsung聊定制AI芯片。模型大战继续下沉到硬件和供应链。谁能压住推理成本，谁就更有资格卷下一轮模型。第七条，Cloudflare开始给AI爬虫上强度。9月起，部分广告页面默认挡住混合用途爬虫。以后，AI拿网页内容训练和回答，可能真要先谈钱。第八条，国内AI应用开始比谁真赚钱。订阅、API、企业服务都在分化。","video_key":"20260706_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_439abb8afc","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"等待AI编码时，我们应该做什么?当AI编码工具开始读取项目、分析问题、修改文件、运行测试时，屏幕上可能暂时没有需要人操作的按钮。很多人便自然进入一种等待状态，拿起手机、刷视频、聊天，直到AI返回结果。但从软件工程角度看，这段时间根本不是等待时间，而是人类工作从输入代码切换到准备判断的时间。AI负责提高代码产生速度，人负责提高软件交付的正确率。关于AI编码效率，研究结论看似矛盾，却揭示了一个现实。GitHub的实验发现，使用Copilot的开发者在特定任务中完成速度最高可提升约55%。","video_key":"20260724_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_30f19042da","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"对比单agent记忆库，团队记忆多了一层治理义务，权限、留存和合规边界要在接入前先讲清。开源仓库默认不带企业级合规，需要团队自己补SSO、审计日志和数据出境策略。Tencent Agent Memory的价值集中在三类人。搭建多Agent协作平台的应用工程师，用Agent做团队知识沉淀的研发负责人，做Agent评测的研究员。它的边界是团队及记忆资产治理，不是单一向量数据库，也不是自动问答系统。要落地它，先想清楚四类资产的边界，Agent的写入权限和审计要求，再把现有REC流程接进来。Tencent Agent Memory的核心价值三点。","video_key":"20260811_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_d752d4e3a1","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"得益于Cdance和Cdream的接入，豆包工作交付的内容也比其他agent更丰富。三份原生可编辑文件，活动执行方案Word，报名与预算分析Excel，内部提案PPT,5小时额度，只用了1%。而豆包工作真正和其他办公agent拉开差异的地方是它和飞书的深度打通。agent不只是在一个独立对话框里处理文件，而是基于飞书账号登录后直接进入团队原本的文档、消息、任务和组织关系。网页生成与设计风格切换演示、手帧截图。这次豆包工作还把额度消耗压了下来。同样是个人订阅加强套餐，现在可以连续跑更多复杂任务。例如，让它根据一份活动brief、报名明细和供应商报价，生成三份原生可编辑文件，5H额度只用了1%。","video_key":"20260827_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_826d2671d3","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"但记住Agent不是越多越好。合适的分工、严格的验证、清晰的边界才是多智能体系统从Demo走向生产的关键。关注我下一期讲A2A协议到底怎么让不同公司的AI互相干活。","video_key":"20260909_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_0cc451aaf7","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"任务失败后，让模型用自然语言写一份反思，存尽情景记忆，下字当经验注入。HumanEval编程基准上，TestAd一从67%直接拉到91%,ElfWorld家居决策，从45%拉到97%。他证明了一件事，语言反思比标量奖励携带的信息多得多，不更新权重，也能在线学习。第三个里程碑，2023年5月，Memory Bank，作者钟畅等人。他第一次把心理学搬进工程，借鉴爱迭号斯遗忘曲线，一条记忆被反复调用，遗忘速度就变慢，长期不碰，强度就衰减。配套还做了个叫Silicon Friend的陪伴机器人。从此，遗忘成了记忆系统的正经功能，而不是缺陷。","video_key":"20260909_0004"},{"unit_id":"learn_视频号学习_全部文案_20261108_e6b0abbcca","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"用VLLM这类推理引擎把零散请求攒一波一起处理。社区实践显示，GPU利用率能从20%提到70%以上。第四招。模型集联。简单问题走小模型。难题踩上大模型。一份反模式清单。全是踩坑换来的。第一个坑。无限堆上下文。上下文越长，KV缓存越大。显存爆炸速度崩盘，上下文不是越长越好。第二个坑，无脑上大模型。80%的请求小模型就够。用大模型是拿大炮打蚊子成本十倍起。第三个坑，忽略提示词缓存。同样的系统提示词，每次请求都付全款，等于每天往窗外扔钱。第四个坑，死守全精度。为了一点感知不到的精度提升，把预算全烧在显存上。Enthropic官方降本指南核心三招，提示词缓存。去除反模式，按任务难度分级调用。","video_key":"20260915_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_74061a6a1c","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"60秒速览今天最值得关注的7条AI新闻。清访OpenAI内部，Codex已接管几乎所有工作。非工程部门使用率从0冲到9成。Perplexity自研数据库替代DynamoDB。两名工程师加数百智能体，每年省1亿美元。Trail of Bits拆穿ePassword复兵基准。并开源两个Agent验证技能。CRM场景追评顶级模型。以上就是今天的AI头条，我们明天见。","video_key":"20260916_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_3bb0183834","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"他可能跑着跑着，开始无限循环。可能自己编一个字目标，然后陷进去。也可能一本正经的胡说八道。早期AutoGPT最大的问题就是失控。给它一个目标，它一直烧Token。烧到你的账单爆掉，还在原地打转。这三道墙对应了后面三样东西。工具调用协议、MCP、记忆和状态管理。还有可控的编排和可观测。工具给了智能体手。记忆给了智能体脑子。编排给了智能体几率。还有一个更扎心的数据。有研究统计了300多个智能体项目。从试点真正走到生产的成功率只有5%。绝大多数智能体项目死在演示之后。这不是模型不行，是工程没跟上。三道墙摆在这，解法是天上掉下来的吗?不是。整个行业花了三年，一代一代踩坑，才把墙一堵一堵拆掉。","video_key":"20260918_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_d59ac19cee","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"第二层，从全量微调到LORA、QLORA，再到对齐方法，四代进化，核心是降成本，防遗忘。第三层，五步闭环，先提示词，再REP，建评测，保数据，选LORA。三大坑，当知识库，堆数据，下狠手。第四层，真正赚到钱的微调，全是行为塑造。第五层，四问决策法，帮你判断该不该掉。回到开场那个问题，OpenAI为什么关微条?因为对大多数应用来说，更强的机座模型，加上提示词、工具和记忆，已经够用了。微条的门槛和成本，让它在多数场景里不划算。但微条绝对没有死。它从万能工具变成了专科手术。知识密度极高，输出要求极严，行为必须内化的场景，依然是它的主场。法律、医疗、金融、专业客服，这些地方，微条的价值无可替代。","video_key":"20260920_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_67c9f19f37","blogger":"翻奇兽AI","match":"exact","cls":"M","claim":"但今天不一样了，现在的模型已经足够强。研究人员终于可以观察他们什么时候欺骗，什么时候试图绕过规则，什么时候出现未预期的目标。所以，阿莫迪的逻辑是，如果现在放慢一点，能在模型达到关键能力之前多争取一两年。而这些时间真正被用于对齐，可解释性和评估，风险就可能被显著降低。这就是Pace the Frontier的本质，不是停止，而是给安全研究争取一个和能力增长匹配的时间窗口。定义清楚了，但一个更紧迫的问题浮出水面。为什么偏偏是现在?阿莫迪自己说了，是两件事让他改变了判断。阿莫迪在文章里明确说了，让他改变判断的有两件事。第一件，地规自我改进，英文缩写RSI。过去，AI是工程师训练出来的工具。","video_key":"20260922_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_d8e35d5f52","blogger":"翻奇兽AI","match":"exact","cls":"M","claim":"1974年，保罗，伯格领导的美国国家科学院发表公开信，呼吁暂停几类风险不明的重组DNA实验。1975年，约140名专业人士在加州阿希洛马讨论了四天，铲出了一套按风险分级的原则。第二次，1945年之后的原子能。1946年，杜鲁门签署原子能法，原子能的控制权从军方移交给文官机构，决定权从实验室转移到了政府。第三次，2008年金融危机。危机之前，金融机构自行决定杠杆水平、收益归公司与股东。这里有一个很少被提起的细节。当时最有能力判断风险的人恰恰是创造风险的人。政府不了解重组DNA，公众更不了解。社会要建立规则，首先必须请教科学家危险在哪里。知识由此变成了另一种东西，认知权利。","video_key":"20260922_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_26b8a73879","blogger":"（未归属）","match":"no_match","cls":"U","claim":"Apache 2.0协议可商用。","video_key":"20260922_0003"},{"unit_id":"learn_视频号学习_全部文案_20261108_609ed2f0f0","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"在聊天框里打一句话，一个能直接开模的零件就出来了。拿下1.9万总星的Text2CAD,Python开发，单周新增近2000星，是给AI代理加CAD能力的开源技能库。不用你丛林学三维建模软件，说句人话或者传章参考图，模型就出来了。他把工业设计拆成一套代理技能，你说要什么，他先写出可编辑的Python建模代码，跑一遍铲出STEP、STL、3MF这些通用格式。还顺手做可制造性检查、出工程图、切片生成Gitcode。全程都在你自己的电脑上跑。Cloud Code、Codex、Cursor，这些代理装上就能用。做机械设计和硬件打样的，再也不用在建模软件里抠尺寸了。开源地址整理好了，评论区扣除模型字去。","video_key":"20261012_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_0d6f388dc6","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"给我一个界面让你同时指挥6个AI编程代理干活。拿下2.7万总星的T3 Code、TypeScript开发，单周星增超2300星，是把好几个AI编码代理统一到一个界面的控制台。不用你在好几个终端窗口之间来回切，一个面板全管住。Cloud Code、Codex、Cursor、Open Code，这些代理都能挂进来，各跑各的活，绘画状态存在本地库，关掉重开还在。内置Git集成和一键提交。提交信息能自己写，也能让AI按改动生成。一个按钮把提交、推送、开PR全办了。从完全放开到严格受控，几档权限模式随时切。天天同时开好几个AI代理写代码的，再也不用满屏找窗口了。开源地址整理好了，评论区扣控制台自取。","video_key":"20261013_0002"},{"unit_id":"learn_视频号学习_全部文案_20261108_0f338e0e67","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"他记住的是画面和动作之间的对应关系，但不理解背后的物理规律。为什么杯子掉地上会摔碎?为什么推轻了物体不动，推重了会翻?这些因果关系，VLA没有真正掌握。结果就是，一旦遇到没见过的新场景、新物体，泛化能力会快速失效。他之奇然，但不知其所以然。矛盾在今年4月被公开引爆。红杉资本的AISN大会上，英伟达机器人负责人吉姆·范抛出了一个极具争议的论断。他说，VLA已死，VM当立。VM是世界动作模型，核心是从语义理解转向物理预测。什么意思?VLA学的是看到X就做Y。VM学的是如果我做这个动作，世界会变成什么样?后者要求模型在脑子里建立一个物理世界的模拟器。行动之前，先在脑子里预演一遍结果，再决定怎么做。","video_key":"20261015_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_5c3888798a","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"异形命令，数据不出本机，就算只用来看看实时曲线也不亏。小团队从灵大监控，可以先拿它顶着。开源地址在下方置顶。","video_key":"20261019_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_4fbe26ad3d","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"RoboHarness的作者提出了一个完全不同的视角，LM已经具备了任务分解、规划、空间推理和工具使用的能力。它缺的不是动作生成能力，而是一个和物理世界对接的好接口。就像你让一个会开手动挡的人去开自动挡，他不是不会开车，是接口变了。你给他方向盘、油门、刹车，他就能开。你给他一百个按键的飞行操纵杆，他就猛了。VLA是在叫模型怎么踩踏板，RoboHarness是直接把方向盘递到模型手里。那这个方向盘到底长什么样?为什么LLM拿上它就能操控机器人?这就是RoboHarness的核心设计，一个视觉几何控制面板。RoboHarness的整个系统，核心就是三层，视觉追踪、几何约束、动作执行。","video_key":"20261021_0003"},{"unit_id":"learn_视频号学习_全部文案_20261108_9c6d29e0fe","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"你刷到过这种标题吧，8G显存，就能跑1250亿参数的大模型。老电脑也能装，我第一次看到也觉得是标题党，但当我打开它的监控面板，我沉默了。这是一张RTX5070 12G显存，屏幕上跑的是阿里刚开源的通义千问3.8 Flash Next。1250亿参数，每秒45个Token。今天这期，我把Stratum从仓库代码拆到工程原理。最后告诉你一句话，这不是魔法，是一场关于内存层级的极限工程。看完你会搞懂三件事。它怎么做到的?你的电脑够不够格跑?还有，它到底是不是标题挡吹的那样神?先给结论。Straight Up是一个独立开发者，网名叫Niko，用C++和CUDA手写的本地大模型推理引擎。","video_key":"20261028_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_2fda6149da","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"一个真实的AI编程绘画，7.5小时，176次请求。作者没有重跑模型，所有数字都是从磁盘上的绘画记录里逐行算出来的。先看三个数字，第一轮请求51700个token，整场只有一条破坏性命令，压缩次数是0。三个数字都在讲同一件事。第一轮，作者只打了28个词，其中一个还是拼写错误。可发出去的请求是51700个token。中间隔着的东西，叫上下文装配。这些曾在模型看见任何输入之前就装好了。系统提示、工具目录、指令文件、整份技能清单、还有编辑器知道你停在哪一行。真正属于你的，只有最后那一小段。而这一轮五万多个token里，真正属于新信息的，只有两个。其余全是窗口里常年摆着的家具，每一轮都要重新计费。","video_key":"20261029_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_0a1498c493","blogger":"翻奇兽AI","match":"exact","cls":"U","claim":"大家好，今天说一下WorkBody自动签到和Body去旅行如何实现。首先点击左上角的专家技能连接器，选择技能，切换到Skill Hub，我们输入积分助手，然后选择安装这个WorkBody积分助手，或者你已经安装了，然后直接去试试。输入每日全自动签到和Body去旅行即可。这里是执行结果。今天的它已经帮我签到成功了。","video_key":"20261029_0002"},{"unit_id":"learn_视频号学习_全部文案_20261108_1f1e259065","blogger":"数据帝-量化开发","match":"exact","cls":"U","claim":"一、QMT，快速交易终端，提供高效、风险可控的量化交易，可外接API。二、PTRate，专业投资软件，云端运行。三、PB，机构投资者的交易和结算平台，门槛高。四、Libni,Python开源量化交易框架，交易接口，开源免费。五、Juanquan，社区活跃，学习氛围浓，可是话好，但算法保密性差，运行速度慢。童话顺问财，金融信息服务平台，范围广，门槛不高。中国领先金融数据服务盘，但不能实盘，价格昂贵。投资顾问平台，数据库够用，统计神器，但二次开发性不强。","video_key":"20240712_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_8bdce7c81d","blogger":"数据帝-量化开发","match":"exact","cls":"U","claim":"国内外量化发展对比。国外1969年首支量化基金成立。国内2004年首支量化投资基金成立。国外1973年到1988年量化投资兴起。国内2009年到2015年量化产品发行迅速。国外1990年到2007年量化黄金时段。国内2015年到2019年高频策略快速发展。国外2007年到2008年量化动荡发生金融危机。国内2019年至今量化多元化精细化发展。国外2009年至今量化高速发展。","video_key":"202407 级别地规上来的高级别走势和在高级别上直接划分的走势相比较会更加的细致。有了区间套和地规的工具，我们就能够在把握大方向的同时尽可能多的抓住低级别的操作机会。","video_key":"20240308_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_1539fe7abe","blogger":"缠话股今","match":"exact","cls":"M","claim":"最近几年各种盲盒非常流行，凡是知名的IP都会出一些盲盒的周边产品。买盲盒与做交易有什么关联呢?让我们来拆解一下买盲盒的步骤。第一，你要定一个大方向。盲盒它有很多种，比如漫画的周边，电影的周边，景区的周边，游戏的周边。你得有一个大方向吧，一个正常人不太可能喜欢所有的类型吧。你一个大老爷们总不能买个芭比娃娃送给自己吧。第二，要确定预算。同一个IP也会有不同的系列，有高档和低档，你得根据自己的预算去选择范围。第三，考虑最大得失。即使是你再喜欢的盲盒系列，也不太可能盲盒里面的每一个品种你都很喜欢吧。就算你都很喜欢，总也得有一个偏好的先后顺序吧。","video_key":"20241124_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_6a22a80bd7","blogger":"缠话股今","match":"exact","cls":"T","claim":"为什么你的感觉总是错的呢?因为你做差靠的是盲猜，而高手靠的是结构。散户做差价最缺的三块拼图，走势结构、级别以及信号。第一，走势结构，你得看清楚，现在是中枢震荡还是趋势的延伸。在震荡里面可以适当的把握差价，在趋势里面做差价就是着死。第二，级别，你是在看一分钟级别的图去做T，还是在看日线级别的图做波段。很多散户拿着五分钟的信号去操作持股几周的标的，这叫牛头不对马嘴。第三，信号。你有没有看到出现背词信号?有没有缩量回调?没有确定性的结束的信号?你所谓的感觉涨高了，感觉回调到位了，都只是你的幻觉。如果你看不懂结构，你的每一次高抛都很有可能抛在起涨的位置。每一次低吸都很有可能吸在半山腰。","video_key":"20260325_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7bdbcfc16e","blogger":"缠话股今","match":"exact","cls":"M","claim":"同样是按照完全分类的思维模式，把K线分类为顶分形、底分形、上升K线形态以及下降K线形态，然后进一步归纳整理为底结构、段结构。于是就可以用段的重叠来替代次级别走势类型的重叠来构造中枢，大大的降低了操作的复杂度。级别是市场自己走出来的，不是你想象出来的。这一点是禅论与所有前辈理论最本质的区别。道士靠的是时间感知，艾略特靠的是波浪技术，江恩靠的是时间框架，传统多周期理论靠图表、靠视角切换。四种方法有一个共同点，分析师手里拿着一把玉色的驰去量市场。谈论反过来先看市场用什么词再走，再告诉你那把词有多长。技术分析一百年的演进其实就是在做一件事情，把越来越多的我觉得变成规则说。","video_key":"20260331_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_2ff7299ddd","blogger":"缠话股今","match":"exact","cls":"M","claim":"二是机会，代价是比第一类买点更贵一点，但是比第一类买点有更大的确定性。我们同样划分为三种不同层次的认知。低配版的认知。第一类买点，第二类买点都会错过。第一类买点之后的反弹行情，哇，果然反弹了，但是没有在这个时候去买。然后呢，行情回调又开始担心，还是没有买。等到行情再次拉升，实在是忍不住了。追涨买入，买在了中枢震荡的高点，甚至买在了趋势的顶部。错过了第一类买点，也错过了第二类买点。连内二买都错过了，最后追在了最贵的地方。中配版的认知会干什么事情呢?反弹之后跑去追涨。第一类买点出现了之后，没有买。行情反弹了，认为确认了，开始追涨买入。但这里有个问题，反弹之后还会回调的嘛。","video_key":"20260509_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_269b3c9f37","blogger":"缠话股今","match":"exact","cls":"T","claim":"那既然票面利率是固定的，那么二级市场的收益率它为什么会往上去抬升呢?那就是因为它的交易的价格下降了吧。也就是说呢，好比说你一开始是100美元去买的这一张国债，现在呢只需要90美元了。然后呢，你到期能够获得的面值和票面利率约定的利息的总金额还是不变的。比如说啊，是120块，随便举例子啊。这样的话，你的潜在的回报率它不是提升了吗?这就是你奥迪市场的收益率上升的原因。上升的原因，它的本质就是在它的价格下降了，因为有人在抛售，因为供大于求。我们来看一下具体是怎么供大于求呢?第一，它的规模已经超过了39万亿，这是美国国债的总规模。","video_key":"20260521_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f8e16f5312","blogger":"缠话股今","match":"exact","cls":"U","claim":"交易这件事情简直是难如登天。你想想看，在这个世界上还有没有第二个行当和咱们的交易一样?开户只需要几分钟，绑个账号，转点钱进去，你立马就可以实现人生的第一笔买卖。但是呢，你想要把它做好啊，那简直难到让人想哭啊。你不扒掉几层皮，你永远不可能悟到的。我曾经在机构里面干过十几年的资产管理的工作，接触过很多优秀的管理员以及交易员。从我入行到现在，我始终坚信最重要的一件事情就是风险管理。这四个字你可能听出简直很无聊很枯燥，能给我带来什么好处呢?风险管理永远确定不了你的回报的上限，天花板它是管不了你的，但是它却可以把你的亏损的下限给它锁死。你在这个行当里面，活得久永远比单笔的单字赚得多少更加重要。","video_key":"20260522_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a478850845","blogger":"缠话股今","match":"exact","cls":"M","claim":"第二个重点，我们要去看经济预测怎么更新。当前的宏观背景有一个特殊因素，每一一的冲突从2月末开始发酵，油价持续在上涨，通胀的预期在抬头。如果说美联储这一次上调了通胀的预期，同时下调了经济增速的预期，那么这就是滞胀信号。那么对股票和债券都是负面的，是最坏的组合，这个风险要特别留意。第三，我们要关注沃时本人他怎么说。发布会是沃时第一次以美联储主席的身份公开表态，他用什么语气强调什么回避什么，给市场的第一印象会直接影响未来几个月对他的风格的预期定价。如果他表现出来明确的独立性和审慎态度，市场会相对稳定。如果他的表态偏阴，而且措辞强硬，市场的波动就会比较大。那我们再来看一下这和人民币和A股有什么关系呢?","video_key":"20260602_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b010f8da1d","blogger":"缠话股今","match":"exact","cls":"M","claim":"以后的十年高速发展和你现在三千上进去没有一毛钱关系，你永远赚不到认知以外的钱。关注我，帮助你持续提升市场认知。","video_key":"20260612_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_6ab634519d","blogger":"缠话股今","match":"exact","cls":"M","claim":"对于一家非药品的硬件加软件公司来说，能长年保护保持20%以上的符合增长率足以证明它在全球高端医疗市场中拥有绝对的定价权和不可替代性。我们再来了解一下达芬奇宇宙。直觉外科它不只是一台手术机器。如果你以为直觉外科只是靠泌尿外科，比如说前列腺切除、打天下，那是你低估了它的战略众生。我们来看一下直觉外科目前的核心产品和应用矩阵。看懂了这张图，你就明白了直觉外科的扩张逻辑。大众认为它就是达芬奇手术机器人，但真正的直觉外科，它早已在横向与纵向完成了全方位的射击。在横向拓宽层面，达芬奇系统早已经跳出了泌尿外科，在普外科比如散气修复、胆囊切除、腹科、胸外科全面开花。","video_key":"20260704_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_253e7dd267","blogger":"缠话股今","match":"exact","cls":"T","claim":"这一盆冷水浇下去，应该冷静了，但是下一次呢?在本轮科技热潮中，有一个韩国的小伙子，从2000万韩元起步，做到了高峰时资产规模达到了3亿韩元。本来故事到这里结束就很完美了，但是这种故事到这里往往不是终局，它在6月份最高点上了杠杆，现在一个月过去了，全部归零，它不是个例啊。5月份、6月份，韩国的年轻人还在讨论炒股发家致富，而现在已经有超过120万个杠杆账户收到了保证金追缴的通知，超过30万个账户被全额强制平仓，大量本金清零。我们缺教训吗?不缺的。远的不说，就说今年1月份有多少人追高航空，现在不还是被挂在山顶吗?这一轮最高科技的人又要挂多久呢?这一盆冷水浇下去应该冷静了，但是下次呢?","video_key":"20260723_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_0939a0882a","blogger":"缠话股今","match":"exact","cls":"T","claim":"那我前几天的已经讲过这个地方啊，他如果说能够放量去站上年线的话，那么在年线附近右侧回踩的低点，我们是可以去考虑的。今天跌幅第一的板块是通信设备。通信设备这个地方日线级别上现在还是一个向下比的回调，但是它已经有很大的概率要去走一个日线的向下段了。那30分钟上我们所等待的就是这一个向下段，走完之后我们可以去低吸回补。美联储7月份议息会议维持利率不变，但是大家要注意，上一次议息会议利率不变，12张票是全部投了赞成票。这一次虽然利率没有变，但是是9比3，有3票是支持加息25BP的。也就是说美联储内部对于加息的预期整体来说是升温的内部的分歧越来越大。","video_key":"20260730_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_bb2ee54462","blogger":"缠话股今","match":"exact","cls":"T","claim":"只有那些个别的强于板块指数的标的，可以去等待它去考验6月份高点的结果。关于这一点，今天上午也有说明。关于大金刚赛道，我们以医药板块举例。6月份以来，还没有走出新的30分钟级别的中枢，它就不可能结束。构造中枢，它必须还得有向下段的回调，并且还会有反复。你把握了这个大前提，你就知道如何去运作了。比如说，当前是回调结束之后的一个新的30分钟向上段，它还没有走完。走完之后，它的右侧必定还会有30分钟级别向下段的回调。我们看一下大盘，大盘在日线级别上4258开始，把它处理为新的日线的向下段，这个已经讲了有一段时间了。那么在月线级别上，在今年的5月份，它就已经有了顶分形的结构了。","video_key":"20260923_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_03545426f8","blogger":"缠话股今","match":"exact","cls":"M","claim":"我们把54块89美元的走势在30分钟级别上就是一个盘整。这个中枢到目前为止既没有给过三买，也没有给过三卖，也就是说这个中枢是没有结束的。它往上去突破，可以去给三买，然后突破120美元，去完成了这一个30分钟级别的向上的盘整。到时候对应到日线上就还是当前的向上段的延伸。如果说这个中枢它直接往下去结束，直接去给山外，那么对应到日线上，它暂时就不会去新高了。那你在日线上就需要把它处理为两段，一个向上段加上一个向下段。这里有一个考点，如果说直接往下去离开的情况下，这一个30分钟级别上的盘整应当怎么样去处理呢?这是一个异形的盘整的结构，你有没有掌握呢?","video_key":"20261006_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e7849e7acd","blogger":"缠话股今","match":"exact","cls":"T","claim":"就像上一次9月17号到9月22号那一波一样，我从头提示到尾，它只是一个五分钟向上段的反弹。如果你听进去了，这个短叉你当然可以做。当然，这个短叉你也可以不参与了，毕竟级别是比较低的。再往后你是等什么呢?30分钟级别的一个向下段的回调，我们直接可以放到30分钟图上去看一下。30分钟现在是这一个向下段没有结束，你可以等这一个30分钟的向下段结束之后，去把握一个30分钟级别向上段的反弹。但是你要注意啊，后面这一个向上段，不管它的反弹的空间是大一点还是小一点，长一点还是久一点，你要知道它仅仅只是反弹而已啊，那这样呢，你就知道怎么样去把握它了。","video_key":"20261012_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a95ed40551","blogger":"缠话股今","match":"exact","cls":"T","claim":"互生300的G线图，同理，至少还需要一个GK线。下一个GK线当然只能是元旦之后才能画出来。我们按照最快最快的速度去计算，元旦刚过第一周，就是下一个GK线的转折点就出现了。那么在今年的12月底开始就会有一些标的，它先于指数实现转折，这就是所谓的分化。如果说你是等着抄底的科技和护身战板来举例来讲的话，你可以等到今年的12月份再留意有没有抄底的机会。在抄底机会到来之前，它还会有反复的波段的机会以及差价的机会，如果有能力可以适当的去把握。这是什么最快最快的节奏，慢的节奏我就不和你说了，你有兴趣的话举一反三自己去推演一下。这不是算命，这是基于空间结构的时间的预估，有严格的逻辑基础。","video_key":"20261016_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f8500103dc","blogger":"缠话股今讲武堂","match":"multi","cls":"T","claim":"如果说发生了变化，你就需要根据空间的变化调整时间的预估，这是一个动态的，不是刻舟求剑。好比说你发现了一个新的星球，它也在自转，你不知道它自转一圈需要多少时间，你从它自转开始的起点的位置去观测，你发现它转了半圈，它花了36天。好，你是不是可以直接去预估一下，转完整个的一圈需要72天，但是转了一会儿之后你发现它自转的速度突然变慢了，你去测算一下新的自转的速度，你是不是需要对它整个的自转一圈完成的时间进行一个预估的调整，这就是一个什么动态的。好，那么波段也好，差价也好，怎么去把握呢?我其实每天都有讲的吧，比如说本周的短叉是什么?本周的短叉是去找走完5分钟向下段回调的标的去低吸。","video_key":"20261016_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b1366280d4","blogger":"缠话股今","match":"exact","cls":"T","claim":"后续我也持续在跟进讲解，每一次只要一讲到那指要去回调，就好像触动了某些认美为爹的群体的逆鳞。我讲那指不是给这个群体听的，是给两类群体听的。自己有参与美股交易的，第二是来学习分析方法的。即使说你不参与美股的市场，这也是你可以学习的案例。市场先生他每天都在给你生动的演绎，还配合着我的客观的分析，你上哪找去呢?你看，像评论区的这些同志，他们就是来学习的。我讲纳指对他们来说就是很有帮助的。纳指的日线的向下段回调的内部还会有30分钟级别向上段的反弹。我们看这一个30分钟的走势图，我之前已经讲了很多遍了。从二五年四月份到现在它是一个30分钟上涨的趋势，对吧?","video_key":"20261102_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f51a40ee71","blogger":"交易不求人","match":"exact","cls":"U","claim":"你的进场之所以一直失败，只是因为你在突破当下就进场了。而问题就在于，单纯的突破本身并不能证明任何事情。价格可以在某个关键位上方留下引线，甚至收盘在其上方，但随后立刻反转重新回到区间内。所以不要直接进场而是要等待位移，也就是公平价值缺口。公平价值缺口是一个由三根K线组成的形态，中间那根K线会出现非常强势的推动，以至于第一根和第三根K线的引线之间留下空隙。这个缺口用来说明，究竟是买方还是卖方在掌控市场，它能告诉你到底是真正的主导力啊，还是一次假突破。当缺口形成之后不要立刻进场，耐心等待价格回测。如果价格在该位置表现出良好的支撑或压制，那里就是你的确认信号。","video_key":"20260213_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_401d59aa6a","blogger":"（未归属）","match":"no_match","cls":"M","claim":"在评论区告诉我，并关注获取更多价格行为解析。","video_key":"20260411_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f68ce2e2ea","blogger":"交易不求人","match":"exact","cls":"U","claim":"买入还是卖出?给你三秒钟做决定。我们来拆解这张图表。价格处于一个明显的下跌趋势中，不断形成更低的低点和更低的高点，但空头动能开始减弱。空头尝试继续打压价格，却无法延续下跌趋势，最终形成了一个反向头肩底结构，随后多头接管市场，以强势动能向上突破警线。这是一个关键时刻，交易者要么盈利，这也是为什么在我的价格行为视频中，我会讲清楚这种结构为什么会出现，该如何交易，以及如何进行风险管理。如果感兴趣，那就关注我。现在价格已经回调，重新测试被突破的结构位。如果价格在这里出现拒绝，将原本的阻力转化为支撑，那就是你的做多入场信号。预期行情向上反转。你判断对了吗?评论区告诉我，并记得关注，获取更多价格行为拆解。","video_key":"20260422_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_1a7b88d3dc","blogger":"交易不求人","match":"exact","cls":"M","claim":"R代表的是你这笔交易一开始承担的风险。例如你10USD进场，停损设在9USD，那你的ER就是EUSD。当价格往你有利的方向走出一而。职业交易者很常做的一件事就是先把停损移到保本，这一步非常关键，因为从这一刻开始，这笔交易的性质就变了。原本你是在承担风险，现在你是在保护机会，也就是说这笔交易最差也不会亏钱了。剩下的差别只是最后赚多还是赚少。很多人明明方向看对了却抱不住。不是因为方法不好，而是因为账上有浮盈之后很怕最后又吐回去。所以ER保本本质上就是先把这笔单变成市场愿不愿意送你后面那一段趋势。心态会稳很多，执行也会稳很多。好了，掌握这个技巧之后，我们来看职业交易者最常用的两种进场方式。","video_key":"20260509_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7c99cde402","blogger":"交易不求人","match":"exact","cls":"M","claim":"如果第二次上攻或下探，动能还是超强，量也没缩，K棒也没弱化，那你真的不要太早脑补反转，因为那很可能只是整理完，准备继续走原方向而已。但就算动能衰减了，还不能急着做。因为接下来还要看市场有没有真的表态。第三个关键，第二次回到关键位置时市场有没有表态。这一段也很重要。很多人把双底双顶想得太简单，觉得碰两次就算，其实不是。真正有意义的是第二次回到前低时，市场有没有出现明显反应。以双底来说，当价格第二次回到前低附近，如果空方动能已经衰减，那你通常会看到一些很明确的止跌讯号。垂直线、多方吞噬，或者匣幅整理后的小结构向上突破，这些讯号本质上都在讲同一件事。有人开始接了。而且不是模模糊糊的街，是有态度的街。","video_key":"20260509_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_f9955a8416","blogger":"交易不求人","match":"exact","cls":"M","claim":"这是做多，还是做空?给你三秒钟做决定。现在我们来分析这张图表。市场目前处于明显的下跌趋势。价格不断走出更低的低点和更低的高点。买方曾尝试发起一波强势反弹，但上涨动能很快完全衰竭。最后价格再次转头向下，回到支撑区域。之后多头又尝试第二次拉升，但这次上涨非常浅，力度也很弱。市场始终无法真正向上突破。突然之间，市场出现一根快速向下的插针，并在图表上留下长长的下影线。对于很多ICT交易者来说，这看起来像是一次标准的流动性扫荡。但在交易中，真正重要的是市场背景。这根下影线并不是反转信号，它其实是一个精心设计的陷阱。目的就是诱导提前做多的买家进场，然后市场再继续原本的下跌方向。","video_key":"20260520_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_373b6c880d","blogger":"交易不求人","match":"exact","cls":"U","claim":"你会买还是卖?你有五秒时间决定。这是实际上看起来最强的买点。看看这个支持级在这里。它已经持有三次了，所以所有长的人都保持他们的停留就在那条线下。而那就是所有的安排都在那里。现在价格切入了这个级别，继续走。我们看到这个灯光关上了下方的线。不是一只灰熏过它，而是一个全身关上。所以每个长的人都在这里停留。而卖家们都在下面。但是现在?请不吝点赞 订阅 转发 打赏支持明镜与点点栏目","video_key":"20261012_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_23b1b99d0f","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"收到粉丝举报，我们之前发布的AI换脸脚本，很多人已经用上了。但是大家普遍说，我想要更好看的UI界面，我还想要更多的参数调节。我要支持文献拖拽上传，今天它来了。我们新一代的云端脚本，不需要你输入任何一行字，只需要你把它布附在谷歌的免费资源上，无论你是手机、电脑还是平板，都可以打开这款强大的AI工具。你想在年会的节目上脱油而出吗?或是给朋友送上一份搞笑的祝福呢?甚至拿它去制作一款优秀的自媒体短视频。这款AI工具都会助你一臂之力。这么强大的AI换脸技术，你确定不学习吗?","video_key":"20240118_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b629b18f83","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"有人说扣子太少钱了，内部都快撑不住了。其实我觉得扣子可能就在下一盘非常大的期。你说给每个用户免费的GPT-4 128K还有非常完善的这种编排工具一键部署到各个平台，为啥就没有这种收费的动作呢?为什么呢?他们做这一切能得到啥呢?什么是编排工具呢?就是给你一个强大的模型，还有一堆工具，像是什么Google可以查信息了，奈飞可以查电影了，它给你打通代码库，就像是给你积木做好模块。那至于每一个开发者要怎么去用这些工具，创造出一些什么样好的点子呢，这个全靠我们自己。","video_key":"20240510_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f1b469b0ad","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"有的兄弟有的，直接给你发案三，邪修法。直接上作业。我们看选择了技能之后，在这里你可以找到一个按钮，它要求你上传一个SKILL的文件包。你可以在这里选择一个麦当已经打包好的SKILL技能，然后选择这个.SKILL文件。上传完成之后，它就可以直接帮你导入，把别人的神机技能转换成你的。这里还要给大家推荐一个神仙网站。大家可以在这里下载非常多现成的SKILL，做开发、做网站、做中化的都有。那这里你可以自己去逃网了。OK，不管你用以上哪种方案，完成数字你都会进到这个扣子编程的完整工作页面。页面是不是看着有点乱?没关系，我帮大家划分一下工作区，你看着就不乱了。","video_key":"20260128_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_10be0583ae","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"但是在Code编程里，这些统一被集成为叫做基础能力。如果你想知道这些底层能力到底怎么调，你可以看一下这节课。我在这节课里有保姆级的详细里头拆解，但是在课里，我们主打就是一个爽。我直接带你来实现它。好的，我们来到Code编程，在它的首页你可以找到网页应用的这个选项。选到这个标签之后，我们直接搞一个复制粘贴大板，把这段Prompt粘进去。注意了兄弟们，这次我给你的不只是针对这个项目的模板，而是一套成熟完整的Code开发全能模板。这套模板里覆盖了Code所有的核心功能，包括语音、绘画、图片、视程、联网搜索、对象存储。你需要哪个功能，就改这Prompt对应哪一段，不需要的能力删掉这一段。","video_key":"20260205_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_0b240acb4a","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"真抱歉兄弟们又打脸了，前两天还在教大家学如何用Code构建你自己的AI应用，但今天我要教你的是如何用Code一键构出你的微信小程序。而且Code.ai这次和微信平台打通的非常丝滑。你只要描述好你想开发的小程序，它会自动帮你完成小程序的开发测试以及迭代和发布。三连买入，今天大家走一遍全六程，开发一个属于你自己的微信小程序。OK，开发小程序之前，你首先需要注册微信的公众平台。这个步骤其实比较简单，大家只需要按照微信官方文档去做就好了。当你和我一样完成注册这里拿到一个APP ID之后，你的准备工作就已经做好了。OK，那此时我们回到Codes编程的首页，还是这个熟悉的聊天框。","video_key":"20260217_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_0992619591","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"而你要说清楚的是，我们要传入一个什么样的参数，我们要在过程中怎么样的去处理数据，最后你的数据要怎么用，发送到哪，结果是什么样的。让AI自己决定它想要使用哪种方式去帮你处理。那同时之前的课中我们学到的知识一样是用的。关于技能，AI可以自动的去加载一些官方技能，图片生成、模型调用、数据库、视频生成，这些都是已经有的。当然我们也可以上传自己的技能来使用。这完全没问题。那关于编程的模型选择，Code空间也提供了目前非常新的比较主流的国产模型，大多数情况下系统都自己选择，那麦当劳比较喜欢用这样的。","video_key":"20260306_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e9ccfc806b","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"点击这个新标签页，你可以在这里找到一个版本控制的功能。在版本控制的功能里会对你每次的更改进行一个保存。这里是WebCoding的安全网，也就是说即使改错了你也可以用后悔药。当你发现某一个功能改得不好，你可以选择对应的版本进行回滚。除此之外，如果你是专业人士，你可以直接点开代码编辑器去编辑脚本。这里买到你不坠付了。在我们聊天的功夫，是不是刚才要求了AI帮我把样式进行一个优化?大家可以看到，新接收到的消息已经是卡片的样式了，是不是比之前这种文字稿好很多呢?这也是Web Coding的魅力之一，你可以在给的需求讲清楚之后，自己去干一些自己的事情，它会极大的帮你省去这种重复操作的时间。","video_key":"20260306_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e82ef5a7af","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"哈喽兄弟们，上节课我们教会大家如何用Codes20搭建出一个AI选定情报站。那这节课我将教会你如何用Codes20的智能体搭出这样一个可以自由对话的AI agent。它可以随便的插入到你任何个人项目、小程序、APP中充当你的AI助手或者赛博分身。欢迎大家回到我们的我看水平的Codes2.0的最新一期课程。这节课我们要讲Codes2.0说至关重要的一个东西就是它的智能体开发。本节课干货满满，我们除了会像前一期课一样带着大家手把手的开发一个Code 2.0上面的智能体，并且这节课还会教会大家构建智能体的时候你一定绕不开，并且是非常重要的知识点，也就是知识库的开发。","video_key":"20260318_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f88034574d","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"很直白，你学AI到底是为了纯粹赚钱还是觉得这东西真的很牛逼，想搞懂它。第二个维度叫学习法，就是你是那种先系统的把课看完再动手做，还是那种直接到项目里去实战，遇到问题再查的那种学习类型。第三个维度我叫它专注度，是你更倾向于某一方面死磕，还是喜欢广杂网，OpenCloud小龙虾出来火了，我学习小龙虾，后子我25更新了，我就改回去玩了Code 2.5。第四个维度叫表达方式，也就是说当我们学习完了一项AI的技术或者某一个产品，你更倾向于做出一个类似的工具，还是说写文章、出视频、讲个原听。测试逻辑我设计的尽可能简单，基本上就是二选一。当然，如果你实在是模棱可，也可以选这个觉得都像说不准。","video_key":"20260416_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_eaf07cdbc3","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"OK，那最后我再补预判断，Token经济这个东西……这个模式短期内还会在，因为信息差一直在，但长期看，随着AI工具的普及度越来越高，这层信息差会越来越薄，所以问题来了。我个人认为真正有价值的并不是倒卖这些恶作，而是你在这个过程中用AI帮你解决的真实问题。这些积累下来的方法论和解决问题的办法，当你用在其他存在信息差的行业的时候，这才是真正的暴力。那用AI解决真实问题也是我一直在做的事情。那今天的内容就到这了，我是麦当，待你爱玩点实际的。点赞关注。","video_key":"20260508_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_66e82a181e","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"Skill的本质其实就是一个Markdown文档，写清了这个任务里的目标、输入、输出格式和步骤。如何创建一个Skill这个我们教过很多遍了，你可以直接在对话里输这样的吧，帮我创建一个周报Skill，要求是什么，它就会帮你写好Skill的文件。当你生成好了一个Skill之后，下次你再输入写杠，你就可以在这里面找到你对应的Skill来帮你创建内容了，是不是很简单?同样的操作在Cloud Code里面也是一样适用的。OK，那一会儿小伙伴就会问，那Plugin也就是插件它是什么呢?那Plugin它是接入外部工具的入口。Skill定义怎么做，Plugin决定用什么工具做。","video_key":"20260520_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_157417f4d3","blogger":"麦当mdldm","match":"exact","cls":"M","claim":"我们在之前的COSE 2.5它有自己的云端手机和云电脑但依旧碰不到你的本地文件。但3.0就不一样了。一旦你安装了它的桌面板它就从云端虾变成了云端虾在本地虾。它可以直接访问你的本地电脑本地手机里的文件。甚至直接调用你正在运行的其他AI工具，比如说Cloud Code和Codex。这就不只是云端助手帮你重复劳工了，它是真正踏入了生产力场景中的一步。我每天80%的工作都离不开AI，算是各类AI Agent的重度使用者了。Code 3.0直接打通了满地能力的一件事。即使它的模型能力比不上Cloud和OpenAI，我依旧会把它列入我核心的AI使用助手工具去使用。还有几个更新的点我们快速的过一下。","video_key":"20260601_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5214d468fc","blogger":"麦当mdldm","match":"exact","cls":"T","claim":"Step Center其实这样的模型还具备联网搜索能力，当你完成了继续动作之后，它还会搜索专业的修改意见。搜索其实已经是Agent基本推理中的一个部分了，搜到专业的意见分析出来才不是反而谈。那最后说白了就一件事，其实现在agent能不能用已经不是单点的看你的模型能力强不强大了，而是看整条链路能不能跑得够快够劈的。Flash模型在这件事情上就是从理论上能做变成了用户真的能用才是关键。原生动模态、搜索内置推理、开源可库储、这些东西架起来才是Flash模型真正的价值。需要TinySclip AI的Bump模板给我个三连兄弟们，我是麦当，带你玩玩，玩点实机的。","video_key":"20260602_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_16ca1a129c","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"麦当劳学院里面有非常多做电商的小伙伴，我发现大家用Codex里经常会做数据分析这件事。但是Codex的数据分析偏文字化，不太适合你导出去做展示。那怎么办?全体们，用OpenDesign。你可以在它的首页里找到数据分析的模板，它这里提供的并不多，但是这三个模板也非常实用了。其中我认为最好看的就是这个Notion风格的这个仪表盘。那在这里你可以直接插入你的数据表。后面它就会直接帮你生成这种可视化程度非常高的表团。这个东西你可以直接用于你的会上的数据分析展示。所以如果你在用Codex的数据分析，最后想要一个好呈现的方式，我非常推荐你用这个模板去生成对应数据表。接下来这个案例做视频的小伙伴很喜欢。","video_key":"20260711_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a6a70dc9b1","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"那这个工作流利，我们可以去详细的调节人物和光景的融合，比如说我们需要人物和景色高度融合，氛围感加强，皮肤要真实的机理，纹理要偏颗粒感，整体的聚光我们要有一个柔聚的效果。这个功能大家不要把它理解为美颜，它更像是把一张AI图片往真实摄影的方向去校准。比如它可以从而做这件事，降低AI感，把这种过度磨皮和塑料皮肤的问题往回拉。第二是优化人物的质感，让人物的皮肤纹理、头发形象、头发细节这些面部层次更加自然。第三是提升人景的融合，让人物和景色在边缘过渡上变得更加统一。最后是优化光影的融合。让场景的光源和人物的面部有个更加的一致。兄弟们，对补一下这个皮肤质感和画面的层次，是不是感觉质感上了一个档次呢?","video_key":"20260715_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_711d70d239","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"这么几年来，我说我原来确定的一件事就是你在多大平台上发的内容不等于你真正用的这些内容。我今天在这里发视频，明天大家发图文，后天在这里发文章。这些平台固然好，它给你容量，帮你更大化自己的进度面积，帮你接受更多人，但是他们不会真正的帮你把内容收回来。所以我现在判断特别简单，就是这些自媒体平台只能去帮你传播，但是你仍旧需要一个站点，帮你把这些内容真正的沉淀下来。所以我一直在做我的自己的吃站嘛，其实一开始也并不是卖课，更重要的目的是让我所有的视频、项目、课程、观点都有一个长期属于自己的地址。","video_key":"20260811_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_50c89a5e2c","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"今天教你一招让AI生成漫具像打牌一样简单。兄弟们，新的3.5刚出，大家都在讨论这个模型，画质有多强，画质有多好。但是当我真正的跑通流程之后，最大的感受不是视频的质量变好了，而是未来AIGC生成的手段位可能要变了。你将会拼的是什么?可能拼谁更会写pront。接下来我们拼的可能是谁手里的卡组工枪。欢迎大家来到AIGC3.0浮生万物时代傻瓜式的AI漫具生成流程。完整教程，看来。我先说明一下，这AIGC 3.0并不是Cdance或者Floor官方的教法，是我自己的创作方式的一个判断。","video_key":"20260818_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_14e46de4ae","blogger":"麦当mdldm","match":"exact","cls":"U","claim":"更有意思的是什么呢?这个技能并不是千万官方出的，是我在千万AI硬件平台上自己做出来的skill。从我自己写这个skill的规则经验，到调试眼镜的拍照识别、图像识别，整个电路已经非常完整了。前两天通过了千万官方的审核，只要你有一款千万AI眼镜，就可以在平台上下载使用我的skill。所以后面如果你看到有人和你喝酒，戴了千万眼镜，那就要小心点了。这平台上同样还有很多非常优秀的个人创作者做出来自己的skill。那AI穿戴设备这两年越来越火，那AI穿戴设备上的功能啊。这个东西具体玩出多少花还真就是看个人的玩家怎么去使用它，因为它的场景真的和你的生活息息相关吗?所以如果你对这个东西感兴趣的话一定要试试。","video_key":"20260926_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5921a33b1e","blogger":"麦当mdldm","match":"exact","cls":"M","claim":"但云电脑有它的好处，比如说它可以去注册一些海外公司的账号，比如说Cloud，懂的都懂，对吧?再或者说，如果你额度比较充分，也不太担心这个那个的，其实可以让它在云电脑上去把各家的CLI都装上。这样你的云电脑上跑是不吃你本地资源的，还能24小时的为你服务，那这个就看大家取舍了。当然这里有个小坑了，如果你在电脑上装Codex这类CLA的话，最好在你的电脑上重新授权一遍，别直接把本地的登录状态考过去，不然两边会互相抢这个登录状态，是没法同时使用的。Codex的设备代码登录默认是关着的，你先要去网页端的账号安全引登录里把这个开关打开。","video_key":"20261014_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_67b49f2907","blogger":"国金证券南京营业部","match":"multi","cls":"U","claim":"破五又反五。主力洗盘，快上车。三阴翻红。主力做多，大胆进。穿头破脚反包。强势逆转，向上扬。缩量恢房起涨点。买点时机，别错过。倍量扬主不击穿。主升行情在后头。我是指讲交易干货的国金海棠。","video_key":"20251216_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_9e8af2f917","blogger":"国金证券南京营业部","match":"multi","cls":"T","claim":"第七，低位放量不跌。说明已经接近底部。第八，底部量价齐升。说明趋势已经形成。第九，顶部无量下跌。后市还会创新高。第十，顶部放量下跌。后市很难创新高。掌握这十条规律就能搞定大部分问题。更多好菜我已经在后山给大家准备好了。我是只讲交易干货的国金海棠。记得点赞关注哦。","video_key":"20251223_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_385c451d59","blogger":"国金证券南京营业部","match":"exact","cls":"U","claim":"你说那时五湖面有白茫茫茫雪崖，山湖里有金黄金子在大风里飘摇，我看见山英才起莫量跳与上飞。","video_key":"20260405_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_28c737ddc5","blogger":"（未归属）","match":"no_match","cls":"U","claim":"请不吝点赞 订阅 转发 打赏支持明镜与点点栏目","video_key":"20260407_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_ad0e727670","blogger":"国金证券南京营业部","match":"exact","cls":"M","claim":"这也意味着鸿海的身份彻底变了，它不再是单纯的代工厂，而是深度绑定顶级企要知道，这类高端AI服务器订单此前一直被戴尔、超威两大巨头垄断。这是鸿海首次拿下SpaceX的超级大单。鸿海董事长刘扬伟此前公开透露，公司目前的AI服务器全球市占率已经突破40%，而这次520亿美元的订单是纯增量业务，完全不在此前的业绩预期之内。从代工苹果消费电子，到为SpaceX打造顶级AI算力设备，鸿海彻底完成了品牌和行业地位的升级，拿下了全球顶级AI客户的全满贯。第二，SpaceX早已搭建起其COOLS数据中心目前已部署超77万颗英伟达GPU。稳定合作的大客户轻易色行业顶流。谷歌每月花2亿美元租赁它的算力。","video_key":"20260721_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_ea924238bd","blogger":"北斗股术1688","match":"exact","cls":"T","claim":"废话就不多说了，我们直接看市场现状，全A等全低开高走，全天无尿点，属于强势结构。从日线级别来看，这个二买的公式在增强，那就没什么可说的，继续拿稳继续躺，没有大风险。接下来要关注的就是这个二买后的上涨段威力如何。别去预测，涨到哪算哪，只要不行成次级别卖点。那就是上涨段结构玩好。从60分钟级别来看，这第二个中枢已经成型，接下来等的就是突破新高之后，能否继续加速突破背驰段的问题。如果继续加速能够突破背驰段，那自然最好，相当于直接给日线二买点火了。如果这里不能加速突破背驰段，那大概率会形成一个级别扩展，形成一个日线级别的中枢。这种方式的话那依然还得磨蹭磨蹭，就看接下来市场如何选择了。","video_key":"20260831_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_c955f73893","blogger":"北斗股术1688","match":"exact","cls":"T","claim":"这个上涨段暂时并无结束的迹象，今天的承接并不差，像小月月都还连板了，继续拿稳就好。想吃到大肉，就得具备承受上涨过程中的小颠簸，别看到一点小调整就慌神了，那样是没资格吃到大肉的。再就是传媒娱乐了。这次AI软件应用的先锋。从日线级别来看，这里已经接近底部中枢的上沿了，即将面临突破的问题。所以，短期这里的关键就是能不能突破的问题。只要明天没有大幅回调，哪怕横在这里，也基本可以确认能过去的，无非就是以什么姿势突破的问题。我发现很多人都在看那个西游记的核心授意票，其实这个AI长距只是一个导火索。","video_key":"20260901_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_4789be4247","blogger":"北斗股术1688","match":"exact","cls":"T","claim":"今天上午缩量1100多亿，下午收盘只缩量400亿了，下午小幅放量了700亿。这意味着下午那一波反弹是有资金入场的，多头的抵抗很明显。对于这两天的调整，下跌力度其实比预料中要小，主要是空头抛压较少的因素导致的。多头合力并未明显增强，继续等待转折的契机。当前的市场现状并不复杂，权A等权今天也完成了一个分时图的V，并不是很弱。从日线级别来看，连顶分形都还没确认，在这里横住了就是偏强势。接下来这个上涨段是继续往上延伸，还是走一个下跌段回踩下沿?现在是还没有确认的，等待市场做出选择就行。无论这里是选择直接往上，还是回踩一段形成一个日线中枢，都不影响后面的上涨空间。","video_key":"20260903_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_8ab94118db","blogger":"北斗股术1688","match":"exact","cls":"T","claim":"从日线级别来看，这里还是空头立竭，需要多头发力的状态。如果这里多头迟迟不能发力，那往下破坏这个日线级别上涨结构的概率会增加。这里有一个政策上的机会，一旦美联储消息出来后，我们的应对政策大概率也会出台，见招拆招。后发制人的策略从924那次就确定了。至于AI应用软件，今天并未跟随昨晚的美股软件应用走强，那就意味着这个方向大概是没有扑涨的，是哪里有成绩就炒哪里的节奏。从日线级别来看，这里依然还是区间下沿位置，上涨结构完好，短期内不能再往下大跌，否则就很容易跌破这个底部结构了，急需多头发力来确认这个日线级别上涨成型。总之呢，这种无序的行情下，别总是内耗自己，看看短剧，玩玩游戏，少看盘就行。","video_key":"20260915_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f62b13b7cd","blogger":"北斗股术1688","match":"exact","cls":"M","claim":"这也是为什么从6月份AI基建开始加速之后，我就不建议任何成员再参与AI基建的行情。也正是基于这份谨慎，才能让我们避开了7月份AI基建的暴跌，才能在7月31日那一天直接让整个7月扭亏为盈。但是根据市场情绪的引导，最疯狂的时候，成交额往往都是最大的，也就是接盘资金是最多的。这些被市场情绪所引导的资金，都是市场的肥料。好了，这一篇就说到这儿吧。今天中秋节，祝各位中秋快乐。","video_key":"20260925_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_053f52f585","blogger":"北斗股术1688","match":"exact","cls":"M","claim":"所以画线的时候，我们只需要把走势分为上涨和下跌两种状态。这样就可以把繁杂的走势肢解成一个个清晰明了且首尾相连的线段。画图后，可以让我们一眼看过去就能判断出市场当前处于哪种状态。知道自己处于哪种状态，比瞎猜未来的涨跌更重要。3.画图的具体步骤画图的顺序，先找出顶底分形，把顶底分形相连构成了笔，把笔继续简化就有了线段。相邻三个线段由重叠的部分形成中枢，最后走势才有了方向。所以禅论里有一句很重要的话叫做没有级别就没有涨跌。第一步，找出顶分形和底分形。这是画图最基础的一层，为了避免后面模糊不清，禅师制定了一个标准。其实这个标准大家也可以自己设定，只要前后的标准一致就行。","video_key":"20261002_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_ed85f1dc34","blogger":"北斗股术1688","match":"exact","cls":"M","claim":"总之呢，画图是为了把复杂的走势简单化，是为了给走势分类，让我们知道市场当下处于什么状态。而不是说画了图就可以知道未来的涨跌，那是不可能的事情。也没有任何技术分析可以预测未来的涨跌。佛祖来了都不管用。好了，画图的这一篇就说到这儿吧。后面碰上一些特殊的情况会在群里说的。毕竟国庆这七篇主要是为了塑成一个可用的交易系统。有些不重要的地方后面再慢慢去调整。大框架先定下来，先学会如何看懂市场再说。对了，很多人连三类买卖点都还搞不明白。明天会把三类买卖点讲明白。祝好运。","video_key":"20261002_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_1f105a385a","blogger":"北斗股术1688","match":"exact","cls":"M","claim":"从月限级别来看，2005到2007启动过一波，板块指数翻了8倍。2013到2015启动过一波，板块指数翻了6倍。不过前面这两波行情在我看来算不上真正的文化产业大爆发，当前的游戏。短视频这些也没有真正满足人类精神空虚的需求。文化的本质就是把想象中的东西让大家看得见。之前受技术和效率的限制，大家看得见的东西只是想象中很小的一部分。而现在有了AI的加持，可以预见的是，未来的文化输出行业必然变得更加多姿多彩。很多之前只能靠想象的东西，将会变成看得见的东西。通过视觉把他人想象中的东西搬进我们自己的大脑，精神需求自然就能得到满足。所以，接下来AI软件应用方向就是时代的趋势，不用怀疑能否启动。","video_key":"20261006_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e72ca92746","blogger":"北斗股术1688","match":"exact","cls":"T","claim":"都是多指数、多板块形成统一的共振买点而形成的。就像拔河一样，如果一条线上的人使劲总是不同频，那是很难赢的。只有喊着口号一起使劲，才能形成最强的合力。而这种共振的买点也一样，本质上就是为了形成更强的合力，从而一举完成趋势的扭转。从60分钟级别来看，这个双底二买同样很标准，前面的被持一买，这里又形成二买。下周只要顺势往上冲一段，这个二买就能得到确认，这个级别就能重新进入上涨结构中。软件服务这里也是同样级别同样的二买，也是合理中的一元。从日线级别来看，这里属于被持一买区域，次级别是共振的二买。如果下周这个共振的二买能够顺利完成转折，同时也会确认这个日线被持一买成型，级别上也能形成共振的合理。","video_key":"20261016_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_1c1cf76467","blogger":"北斗股术1688","match":"exact","cls":"M","claim":"再看71-72这个背驰段的内部结构，就有了第四重。第四重71-72内部结构中，红色箭头前面是第一段，红色箭头后面是背驰段。这是线段内部的比倍池，是最小的级别了。方法都是一样的，比较上涨力度，看上涨力度是否减弱。这四重倍池段在当下同时成立时，就构成了72这个极其精确的卖点。在往后，72这个区间套倍池点出现后，卖出就是唯一的选择。当74这个点构成的是第二类卖点与第三类卖点重合的点位，学过禅论的都知道。二三脉重合往往意味着后续有更大力度的下跌。三、操作级别的纪律。禅师反复强调，操作者必须明确自己的操作级别。别问背驰后跌幅多大，如果你是月线级别操作者，一分钟的顶背驰与你无关。","video_key":"20261018_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_254f6a2be0","blogger":"北斗股术1688","match":"exact","cls":"T","claim":"从60分钟级别来看，二买依然是完好的状态，只要没有新低，那这个二买就随时都有可能发力。总之呢，我们持仓的方向虽然这里还未大幅发力，但是也并无多大风险，都是低位完成筑底的结构。没什么可担心的，耐心等就好。其他也没什么可说的，希望多头的攻势可以给力点，祝好运。","video_key":"20261019_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7e3a37759b","blogger":"北斗股术1688","match":"exact","cls":"T","claim":"AI应用软件这里也是类似的结构，日线级别被迟一买，次级别二买，都没什么可担心的，无非就是还未启动罢了。从日线级别来看，这个被被迟断一买的状态很标准，下跌力度也是持续减弱。共振的30分钟级别二买也还在，那就希望多头早日启动。如果本周内证券这个进入能启动，肯定是可以带动整个方向的人去。具体的行业板块，先看体量最大的软件服务。从日线级别来看，这个结构基本上和AI应用软件的走势保持一致，新低之后就进入了标准的被持一买区域中。再加上周五形成的次级别30分钟二买，那这里发生转折的概率正在大幅增加。互联网板块的结构比软件服务稍微强势一些，今天也有明显的止跌迹象。","video_key":"20261019_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_64eaa02814","blogger":"北斗股术1688","match":"exact","cls":"T","claim":"今天又是冲高回落的一天，这是底部阶段的常态。3674会不会被跌破，我们现在无法预知。但是我们布局的软件应用方向还算是比较抗揍的，账户也是微红了一些，不着急，继续耐心等着就行。其实从盘中时不时拉一波的那些个股就能看得出来，第一位的AI应用方向已经有越来越多的票开始有启动迹象了。这是好现象。废话就不多说了，直接看市场现状。所有的操作都应该基于市场现状做出应对，只有根据客观走势做出的合理应对，才是真正的顺应市场。那些根据主观思维产生的好股烂股，都是情绪在作祟，并不重要。指数这里依然在3674上面勉强支撑，暂时还没为跌破3674位置。","video_key":"20261021_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_6966dbb243","blogger":"北斗股术1688","match":"exact","cls":"T","claim":"今天又是让大家一难平的一天，市场又被硬科技带崩了，率4900多家，亏钱效应大增。市场氛围下，注意两个东西，一方面是已经见顶的硬科技方向不要碰，另一方面就是底部的AI应用软件不要恐慌，都是下跌，但性质是不一样的。其他废话就不多说了，直接看市场现状。从日线级别来看，底分形都还没确认就熄火了。反弹力度严重不足，估摸着真正的转折点还没出来。魔人的底部继续熬着吧。不过这里就算
