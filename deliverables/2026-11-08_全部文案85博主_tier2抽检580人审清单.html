ideo_key":"20260729_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_3efe6e86a5","blogger":"小李盯数据","match":"exact","cls":"U","claim":"啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊啊","video_key":"20260730_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_be4ccbcd7a","blogger":"小李盯数据","match":"exact","cls":"U","claim":"还有，爆仓的年轻人要树立起新生活的信心。千难万难都会过去的。","video_key":"20260805_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_598ceacca9","blogger":"小满碎念成章","match":"exact","cls":"M","claim":"不过有一条提醒，别做日线级别以下的操作。禅论只是帮你理清思路的工具。下一集，看看他眼里的走势，到底有几种可能。","video_key":"20261016_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_8b855ff540","blogger":"小满碎念成章","match":"exact","cls":"U","claim":"包含怎么合?涨跌完全相反。怎么合?规矩就两条，上升一条，下降一条。先说上升途中，正好遇到包含。高点取更高的，低点也取更高的。整根往上抬，方向一点没变。为什么?方向向上，合并就得顺着走。反过来取，等于把趋势抹掉了。下降途中，正好反过来。高点取更低的，低点也取更低的。两根一起往下沉，新K线方向仍然向下。连着好几根互相包含呢?依次处理。先合投两根，再拿新的根下一根笔，合到不再包含为止。合并是为了找分形，分形是为了划笔。记住，掌取高高，跌取低低。建议收藏，合并的时候拿出来对照。","video_key":"20261023_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_4b13d79293","blogger":"小满碎念成章","match":"exact","cls":"U","claim":"你画的笔，为什么不做数?笔，是禅论最小的分析单元。一根笔就三样，顶分形、底分形、中间加着K线。少一样，都不叫笔。K线是冰，分形是斑，笔就是排。笔是地基，地基歪了，后面全歪。往上走，起点底分形，终点顶分形，中间一路往上抬。往下走正好反过来，起点顶分形，终点底分形。从低到高，从高到低，就是上升比和下降比。每一根笔，本质上就是一条画上去的线。连起来，整段走势的股价就清楚了。记住，顶、底、中间K线，三样缺一不可。建议收藏，画笔的时候拿出来对照。","video_key":"20261025_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a7eec4c244","blogger":"大A蒙恬","match":"exact","cls":"T","claim":"看到这的人，建议你立刻点赞，顺手收藏，等明天开盘你犹豫不决的时候，能第一时间翻出这篇来对照方向。好了，闲话到此为止。接下来，我给你三条关于这根十字星的硬结论，能把你这几天的所有纠结一次性捋顺。第一，3652不是底，而是主力画给你看的一条测试线。今天最低砸到3652.37，然后就被拉起来了。看着像是有承接，像是跌不动了。但你注意看昨天的低点3648.30，今天的最低只比昨天高了4个点。这就是在试探，下面到底还有没有人接。答案是有，但只接一点点。这根24个点的长下影不是护盘，是试盘。主力用最少的钱摸清楚你的底，明天才决定是拉还是砸。","video_key":"20261028_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e064a0920a","blogger":"大A蒙恬","match":"exact","cls":"T","claim":"有多少人因为没有看到我的视频，买在了最高点，又卖在了最低点，被市场反复收割，来回挨打。又有多少人因为不信任我的观点，导致完全踏错节奏，已经彻底躺平。只有那些紧紧跟上舵主我节奏的家人们，才能猜准每一波反弹机会，规避每一次回调风险。说实话，在这种急涨急跌的行情下，已经没有多少人敢真正站出来分析市场那么回到重点，下周一到底会怎么走?做主我不废话，接下来小鱼我要说的观点非常明确。从现在起，所有人都把注意力集中在屏幕上。多主我可以斩钉截铁地告诉三亿股民，市场连续几天的大跌，并且最低点达到3574点，这个位置是十二十三行情启动的起点。","video_key":"20261030_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_6559507c0e","blogger":"大A蒙恬","match":"exact","cls":"T","claim":"11月3日开盘，一秒钟都别犹豫了，今天放量反攻，超4600架飘红，白股涨停。是情绪回暖的趋势反转，还是超跌反弹又多一日油?那么明天周二还会不会涨，甚至大涨?先别急着上头，听我把话讲完。明天周二的行情又要出乎所有人的意料，11月第一轮真正意义上的情绪修复已经来了，随后而来的就不言而喻。所以这条视频您现在就可以点上收藏，明天周二收盘再来验证，要是舵主我说错了，我直接低头认错。这条视频您现在就可以收藏好，接下来的市场大概率又要走得所有人措手不及，有些天天跌的可能真的要迎来希望了。我现在就带大家交个底，今天的盘面真是一路高科，今早天道直接出手，成功把大A堵住的水管直接修好了，直接涨到4681。","video_key":"20261102_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_0f14221e9c","blogger":"微醺미훈하다","match":"exact","cls":"M","claim":"上期咱们讲了20、60均线的金叉和死叉信号，很多朋友看完之后就开始盯着盘面，等着信号出现。今天咱们接着这个话题，往更深一层聊一聊。看懂金叉死叉只是第一步，同样是20日线上穿60日线的金叉，或者20日线下穿60日线的死叉，在不同行情环境里，它的参考价值是不一样的。咱们再回顾一下，20日均线代表短期行情节奏，60日均线代表中期大趋势。咱们上期说了金叉死叉的用法，但很多人容易忽略均线本身的姿态。如果60日均线走平，行情处在来回震荡的阶段。这时候出现的金叉，大多就是一波短线反弹，延续性一般。反过来，当60均线本身稳稳向上，中期趋势向好，这个时候20均线回踩之后形成的金叉，含金量就会高很多。","video_key":"20261024_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5430d6257a","blogger":"微醺미훈하다","match":"exact","cls":"M","claim":"最后也提醒大家，单靠一套均线组合不够，有条件可以配合位置、量能一起综合参考。","video_key":"20261024_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e42e7dcab7","blogger":"微醺미훈하다","match":"exact","cls":"T","claim":"价格稳稳站在15分钟60日均线之上，日内的趋势就是偏多的。价格一直在60均线下面运行，日内就是空头行情。那20均线是干啥的?20均线就是咱们找进场点位的线。多头行情里面，价格回踩20均线，没有狠狠跌破，稳住了，就是一个比较合适的多单机会。空头行情里面，价格反弹上来碰到20均线，涨不动，拐头往下，这就是空单的机会。这里有个关键点给大家提个醒。小周期假信号多，很容易骗线。要是60分钟的方向和15分钟走出来的方向是反着的，这种单子咱直接放弃，不做。还有做15分钟周期，止损一定要放小，不能扛单。一旦K线反向突破15分钟的60均线，就说明日内趋势变了，思路马上就要换。","video_key":"20261105_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_21518156b3","blogger":"结构派明月与六便士","match":"exact","cls":"T","claim":"点回去记住啊再到10点那这个是五分钟图啊，那是我们跟的1234567，那目前呢，还有一个参考的就是说五跟七，你看七的力度明显也是要大一点的，非倍值的。那还有一个就是说，你看这个MACD啊，这个是我的指标啊，就是说MACD它现在，你在五分钟图看它是进到零轴深水区去的啊，那它一个周期图上要走墙，它一定是要拉到零轴上面去的啊，那有可能是什么，它就是在五分钟反抽一下，这个往上拉，拉了之后再往下走啊，这里还没有倍值的啊，所以你要知道这个地方是不太建议动手的，就是要让它充分的把这个。好，这是7啊。那早上低开之后就一直在这里震荡震荡震荡，然后呢，构建了这个线段内部的第三个比重数，123。","video_key":"20261018_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_46f56ecb5a","blogger":"结构派明月与六便士","match":"exact","cls":"T","claim":"就是说如果以现在这个结构去突破，那它这里只要破了，它就是一个8的一个造势类型形成。那站在这个五分钟图的这个1234567，那我们现在如果说它突破形成8，那我们的压力位是要看哪里?我们压力位要看6的这个低点啊。也是要看它上。上下上能不能跟这个产生交集啊前面也说过了就是说你如果你的八上去没有力度跟这里没有交集那他也可能还要有新低的一个分类的啊就是说他的这里目前是要走五分钟去是吗那你的上下上如果在这里接触不到他无法构建第二个中枢那只能在最更低的位置去构建啊那可能是八到这里碰不到那他就往下面构建一个分周中枢壁啊然后到尾盘的时候巴士没有行程啊，要看明天的一个方向选择。","video_key":"20261019_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_30eb757bbe","blogger":"结构派明月与六便士","match":"exact","cls":"M","claim":"好，4258这里，5分钟走势类型下，3927，走势，5分钟走势类型上，出了30分钟的2S,4143点，往下走了个5分钟，3741，然后呢，又反弹了一个5分钟，到3995.18，三个5分钟，构建，重叠部分，构建了30分钟级别中枢，然后从3995.18这里，往下走了一个离开段，五分钟走势类型。放大一下399.18这一段，内部是一分钟一分钟一分钟一分钟，对吧?构建了一个五分钟的中枢A。绿色的是一分钟走势类型。然后五次离开段，六次没有回到中枢的三S，五分钟三S，继续走离开段，对吧?八是没有跟六接触，往下往上，对吧?这里是上下上构建了五分钟中枢B。","video_key":"20261103_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e3321164a8","blogger":"风向云软件","match":"exact","cls":"M","claim":"上轨和下轨，它们是在中轨的基础上，加减两倍的标准差。标准差是什么?衡量价格波动幅度的指标。如果一只股票每天涨跌都很小，标准差就小。上下轨离中轨很近，通道很窄。如果一只股票上窜下跳，标准差就大。上下轨离中轨很远，通道很宽。所以布林黛的宽度直接反映了市场的波动率。你可以把它想象成一条河的两岸。中轨是河床，上下轨就是河岸。正常情况下，河水在两岸之间流动。河岸的宽度就是波动率的范围。风平浪静时，河道窄。狂风暴雨时。河道宽。当价格冲破河岸，说明水流已经超出了正常的波动范围。要么是洪水来了，要么是河道改了。这就是为什么布林代看起来像一个通道。它画的不是支撑阻力，而是价格在正常状态下的活动边界。","video_key":"20260830_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b33bc64a0a","blogger":"风向云软件","match":"exact","cls":"T","claim":"两天都是10块，平均还是10块，看不出任何变化。但真实情况是，今天的换手量是昨天的100倍。市场对这个价位的认可程度完全不是一个量级。普通均线看不出来?VWAP一眼就看出来。为什么?因为VWAP是每一块钱投一票，同样的价格，带着的钱越多，分量越重。所以普通均线回答的是价格平均在哪?VWAP回答的是钱平均在哪?价格可以骗人，钱不会骗人，每一笔成交都是真金白银。这就是VWAP的底层逻辑，把价格按成交量加权，让钱的声音盖过价格的噪音，再深一层。看公式。数学上这叫以成交量为权重的加权平均。普通均线是算数平均，每个价格权重一样，人人平等。VWAP是加权平均，成交量大的价格权重更高，按钱分配。","video_key":"20260921_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_9f6606fd24","blogger":"风向云软件","match":"exact","cls":"T","claim":"MTR把当天真正发生过的价格幅度全部覆盖。第二行，ATR。对MTR取20天简单平均，把每天的真实波幅做平均。得到最近的平均真实波动幅度。翻译大白话，ATR告诉你，这支票一天平均要走过多大的价格空间。现在讲两个指标融合的数学原理。布林黛的标准差，ADR的真实波幅，都是衡量波动，但口径完全不同。标准差有两个毛病，只看收盘价。日内大波动只要收盘拉回来，它就当没发生，还怕跳空，一根高开大阳线瞬间就把通道撑爆。ATR正好相反，天然包含跳空，影线和日内全部真实波幅，而且用MA做平均，不会被单日极端K线带偏。但它也有毛病，只看单日波动幅度，不关心价格偏离均线多远，连续小阳线慢慢涨，ATR很小。","video_key":"20261002_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e3b12548ac","blogger":"猫哥的AI投研","match":"exact","cls":"T","claim":"把K线当成语言，训出来的金融基础模型，4万1000星。这是Cronus仓库，论文已被AAI2026接收。4万1000多星，今天又涨了355。核心两步，先把开高低收和成交量量化成离散Token，再用Transformer像写句子一样往后预测。开源了Mini、Small、Base三档，最大的Large,4.9亿参数，没开源。用法两种，几行代码直接预测，或者用Claib的A股数据微调，再跑个简单回测。局限，代码最后一次推送是4月13号，已经半年没更新，最大模型没开源，预测是概率性的，不能当买卖信号。研究分享，不构成投资建议。我是猫哥，下期见。","video_key":"20261022_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_94b83e93c1","blogger":"猫哥的AI投研","match":"exact","cls":"U","claim":"8万星的预测万物引擎，金融只是它的用途之一。这是Mirrorfish，一个通用的群体智能推演引擎。8万多星，今天又涨了394。流程是，用新闻、报告这类种子材料建知识图谱，生成一批有人设的agent在模拟社交平台上互动，最后出报告。用法很简单，上传材料，用一句话说你想推演什么，拿回一份报告和一个能对话的模拟事件。Readme里的演示是五大舆情推演和红楼梦结局。金融方向写的是陆续更新中。局限，金融不是主场，推演结果没有公开的准确率验证，很吃大模型额度，主分支代码7月23号之后没再改过。研究分享，不构成投资建议。我是猫哥，下期见。","video_key":"20261025_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_6c1e971350","blogger":"猫哥的AI投研","match":"exact","cls":"U","claim":"让AI写A股研究，最卡的常常不是模型，是数据。这个开源包，一次接了34个元。我是猫哥。Astopdata，一个给AI编程助手用的A股全站数据Skill文件。11200多星，近6天涨了233。行情K线，言报，资金面，新闻，财报，公告，宏观利率，期货，可转债，15类，87个端点。它把各家接口的参数、格式、健全都封装好。官方和腾讯员优先，主源被封就降级到备用员。把skill.md放进cloud code的skills目录，装好依赖，直接用中文文数据，别的AI助手也能当上下文用。局限，靠公开接口，可能失效或限流。口径出过错，比如科创版成交量单位，E1K要P，用钱看清个元条款。数据只管取，判断靠自己。","video_key":"20261031_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_01cd8e22fc","blogger":"Klar0","match":"exact","cls":"U","claim":"对于技术分析人员来说，应用最广的斐波那契比例是0.618。有的技术分析人员会对0.618进行取整，将这种回撤比例说成是三分之二回退。但是强烈建议使用0.618这种包含三位小数的表达方式。看涨的0.618回撤位是股价下跌过程中需要特别关注的重要区域，当看到在长期涨幅后出现了急速回调的时候。0.618是第一个需要观察是否会发生反转的区域。而看跌的0.618回撤则相反，因为无法上升到之前波浪的顶点，上升趋势自0.618位置发生看跌反转，通常意味着之前的主要跌势仍将继续。如果股价在0.618回撤位置发生反转，那么股价不会越过0.618位置太多。","video_key":"20260303_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_8500bdd3e8","blogger":"Klar0","match":"exact","cls":"M","claim":"1.272回撤位置往往是主力制造假突破、散户止损或诱惰进场后进行获利了结或反手做空的聚集点。这就是我们常说的二臂法则或破底翻的数学依据。反之，当价格向下跌破了起涨点X点，市场看似一片恐慌。但此时1.272回撤位置往往是空头力量的第一道看。这是一个极具价值的潜在支撑区，也是我们考虑停止做空，甚至尝试反手做多的关键位置。接下来是更为特殊的1.618外回撤。如果说1.2720试探，那么1.618回撤就代表了极端与衰竭。在谐波形态中，它通常对应着著名的螃蟹形态或深海螃蟹的极限反转点。当大众情绪极度亢奋，价格往往会出现过度延伸，正如钟摆摆道的最高点。1.618回撤预示着原有趋势动能的彻底耗尽。","video_key":"20260303_0002"},{"unit_id":"learn_视频号学习_全部文案_20261108_0a773ada32","blogger":"Klar0","match":"exact","cls":"T","claim":"反过来，价格创新低，DIF没有，叫底背离。三者串起来，一段上涨见顶，通常是这个顺序。先是红柱缩短，然后死叉。最后DIF跌破零轴。信号一个比一个晚，但也一个比一个确定。最后，说两个常见的坑。第一，滞后。MACD由均线算出，永远在描述已经发生的事。它只能确认趋势，不能预测趋势。第二，横盘。价格没有方向时，金叉死叉会反复出现，大多是假信号。一句话总结，DIF是速度，柱子是加速度。零轴看方向，金叉死叉看力度，背离看衰竭。建议收藏，下次看盘对照着用。下一期，讲透RSI，关注我。一次学会一个指标。","video_key":"20261105_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_1cf85d4e27","blogger":"马骡驴打滚","match":"exact","cls":"U","claim":"风沙终会散尽，中古金盘，行情终会回暖，守住住今天，等一个属于我们的归期。","video_key":"20261101_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_434d85a4f2","blogger":"马骡驴打滚","match":"exact","cls":"U","claim":"周三大盘预计先回彩，考验3574点关键支撑。若守住支撑，可能展开区间反弹。上方关注3625点。若突破3625，可看3638。若有效跌透3574，则关注3555。关键看3574得失，以及3625能否有效通破。","video_key":"20261103_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_12e29411cb","blogger":"马骡驴打滚","match":"exact","cls":"U","claim":"周五大盘大概率延续反弹，上方仍看3696点和3708点两道压力。考虑外围环境预计大概率难以有效冲破，随后可能回踩叙事。下方关注3664点和364点，再向两道压力点推进。若放量有效通破两道压力，则可确认大级别超跌反弹展开。下一步关注3743点。","video_key":"20261105_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_6cb59ad830","blogger":"BullTrading","match":"exact","cls":"U","claim":"这里是步，吹丁，K线结构会低可。这几根K线都碰到了浅高，为什么一根都不算突破呢?先找到关键位，上一段上涨的最高点就是这条线。一根引线刺破了，但收盘又回到线下面。接下来同样只是引线，盘中冲上去，收盘又被打回来。直到这一根实体收盘站上关键位，结构才算真正延续。影线只是盘中的试探，收盘才是这根K线最终的结果。收盘会卖你，换来的是更少的假突破。技术三步，先标关键为影线刺破只是试探收盘越过才算突破。50步，Trading，关注我下一课讲结构转变。","video_key":"20261013_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a2786bd8e9","blogger":"BullTrading","match":"exact","cls":"T","claim":"你是不是经常这样，看着行情一路大涨，忍住没追，结果刚回调两根线一进场，就买在最高点，因为你只盯着小周期拉升，却没看清大周期的真实方向。老交易员看盘，第一步永远是外部看方向，在大周期找出跌破前低的波段高点，划实线做防守边界。只要边界没破，大方向就还在往下走，绝不盲目做多。第二步，才是内部看节奏，切回小周期，用虚线跟反弹。半山腰绝不动手。耐心等价格进到上方关键承接区，出现右侧跌破确认信号，再顺着大方向出手。这张顺势交易三步自查卡，建议先收藏起来，下次开仓前对照看一遍。你平时最容易栽在哪一步?评论区聊聊。","video_key":"20261026_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_d3165ab7c2","blogger":"BullTrading","match":"exact","cls":"U","claim":"上一讲，我们学会了用收盘实体时破假次破又多。今天第三讲，接着解决石盘里的第三个难题。大周期明明在走下跌，切到小周期却在连续拉阳线猛涨，两个周期方向打架，到底听谁的?记住双层结构的核心分工，外层大周期管方向，内层小周期只管节奏。只要大周期向下的失效边界没有被实体突破，小周期再猛地上涨。本质上也只是大趋势里的一段回撤浪。所以，方向打架的时候，第一不逆着大周期去追涨，第二也不在小周期加速冲高时左侧硬顶，而是先观望、耐心等反弹进入大周期关键观察区，出现冲高衰竭、内层拐头向下，两个周期重新同向，再等右侧结构确认。把这张第三讲，大小周期冲突过滤表收藏好。方向和节奏都对齐了，防守位到底摆在哪才不会被扫掉。","video_key":"20261027_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_2724fe79a1","blogger":"（未归属）","match":"no_match","cls":"U","claim":"点个关注。明天第四讲，我们拆解外层结构，即之防守摆位法。","video_key":"20261027_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_d3caef0bbb","blogger":"投资知识加油站-江海证券青岛分","match":"exact","cls":"T","claim":"白线DF是……短期市场成本对应的是12日的均线。黄线DA是市场的中期成本，对应的是26日均线。黄白线差距越大，市场短期中期池塘成本分期就越大。这是红绿柱高低的根本原因。一旦两者差值缩小，形成交叉，就是市场成本的转换临界点，也是红绿柱切换的核心位置。第二，理清级别的关系，看懂背离的真相。记住，黄白线的级别永远大于红绿柱。黄白线反映的不是股价的涨跌，是市场中短期资金的成本趋势。这是贝离的最核心的价值。贝离不代表着马上见顶见底，它预示着市场所有交易者的心态发生转变。这是行情转折的本质。第三，大小周期套利的密码。提前研判行情。本级别的一次金叉、紫叉对应的都是次级别的两次以上的交叉信号。","video_key":"20260918_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_56fcc62c28","blogger":"投资知识加油站-江海证券青岛分","match":"exact","cls":"M","claim":"MACD只会看黄白线，永远赚不到短线的钱。真正的短线拐点，资金的强弱，精准的顶底，全部藏在红绿柱里。熟悉我的老家人都知道，我讲MACD是成套联系剧系统教学。MACD一共五大核心要素，黄白线、红绿柱、零轴。上节课我们讲透了黄白线，今天我们接着进阶，专门拆解99%散户都不知道的MACD红绿柱的核心用法。很多散户炒股之所以越学越亏，越学越乱。核心原因就是学的都是碎片化知识点。今天学K线，明天学成交量，后天死记应备指标，看似什么都懂，一时盘就是废，学了个季末，白白浪费时间。但我这里，我不教大家零散的无用的知识点，只给大家能落地，能实战，能直接指导交易的完整的交易系统。今天这套红绿柱干货。","video_key":"20260925_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5b27773be3","blogger":"投资知识加油站-江海证券青岛分","match":"exact","cls":"M","claim":"炒股还在追涨杀跌吗?别再盲目抄底了。今天这个反转数值底层战法，3K加薰介入法，是整套买卖点体系的地基。先言小红心，干货开奖，核心就两大条件。第一，看MACD反转数值，绿柱处级或靠近反转数值，低点后面不能有效击穿，没有击穿就代表着底部蓄力。第二，看K线，品字底部三步走。即禅论的底分形构数。第一，创出新机的K线标记为2，其呈现出贴近或处级反转数值特征。二，左边的K线标记为1号，在1号K线的最高点画水平线。三，后面的实体的阳线站稳这条线，同时股价站上50均线，即为3，是3K加均介入点信号的重形。重点止损条件，瓶子底的K线出来之后，不能再有实体的阴线创出新低。","video_key":"20261016_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_fc4e63b22a","blogger":"老武聊量化","match":"exact","cls":"U","claim":"来，喝起来，喝起来啊。你看这地方多好。啊，在下面玩。我在上面喝啤酒。","video_key":"20260803_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_89b082fc60","blogger":"老武聊量化","match":"exact","cls":"U","claim":"我期待的不是钱，而是花不完的钱。我期待的不是人，而是好几百万元。我期待上班一天，我收入等于你工作一年。我期待新过来就能实现。","video_key":"20260909_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b2a935e97c","blogger":"老武聊量化","match":"exact","cls":"U","claim":"黄沙子马慢慢来，太阳下山有月亮爬上来，云会再发挥开，好运总会为你而等待。","video_key":"20261106_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_427f2717ed","blogger":"如舟训练","match":"exact","cls":"T","claim":"我有可能面临着多大的波动?从这个角度来考虑。好，那第三点是什么呢?不会做空。做股票只做多不做空非常简单。你既不需要学会做空，你还可以把股票丢在那里，然后大不了被套了，放在那五年十年都无所谓，但期货不一样。期货你必须要懂得做空，因为做空在这个市场里面它占了相当一部分的时间，在市场里面多头空头两边赚钱。大部分商品它的主旋律还是多头，比如像黄金啊，这些像国债啊这些。但是空头往往来的非常的迅猛，非常的快速。如果你不会做空的话，你不仅仅会错过空头的行情，你连多单也会受到影响。因为你不知道分辨这个多空方向，你就很难去在急速下跌的时候去做出应对。所以咱必须要有做空的能力，学会如何去做空。","video_key":"20261011_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b1358b3706","blogger":"如舟训练","match":"exact","cls":"M","claim":"比如说我们看一下哪些事情，不对不对，我重新讲，就是我们来看哪些问题关于金钱，关于赚钱亏钱，哪些事情我们是不预测的?哪些我们虽然下个月的工资有可能老板扣了几百块也是但是我还是不会对吧还是不会预测好那我们再说年底前不预测啊好的然后再说啊再说就是你开饭店已经很稳定了那么虽然明天的营业额还是不确定的啊但是你会不会预测明天有，哦，可以吧，放这里啊。你会不会预测明天的营业额?会不会?不会，也不会。是不是啊?那么我还有哪些东西不会预测呢?一个人高考通知书没有拿到，没有拿到之前会不会预测?为什么拿到了通知书就不预测了?一个人谈恋爱实验。D，每天电击96次，每次15秒，随机电，随机通电。","video_key":"20261012_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_54461b8087","blogger":"如舟训练","match":"exact","cls":"M","claim":"但是大多数人过去这么多年都在努力寻找确定收益的方法。所以一直没找到，所以一直还要预测。这个逻辑听明白没有?那么赢家确定风险，不确定收益。确定风险等于确定安全感。然后等于不预测。听明白了，狠狠的打一波，巴巴巴巴巴巴巴，狠狠的打一波。明白没有?我是用数学的逻辑告诉你，这些东西你怎么拒绝的了?啊，这就是道啊。别人跟你讲道，跟你讲，跟你讲那些虚无缥缈的讲，讲那些东西，我用。咱们人人都听得懂的话。明白没有?好，确定风险，不确定收益。还没完这节课，还有更精彩的。接下来我再问你一个问题。对，确定风险，就是说，我今天下午。我今天下午在群里说了，你问我你说来二阶包不包赚钱，我肯定包不了啊，我怎么能包你赚钱呢?","video_key":"20261012_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_2710ecc62e","blogger":"神光弘缠高辉","match":"exact","cls":"U","claim":"朋友们，我做了12年的交易，但我更愿意说6个字。先求稳，后求胜。我是高辉，对股市有深度认知，用禅论波段战法进行训练和教学。趋势与短线差价的完美契合。波段战法有三大优势。当条件达成，回调不破新低，就是我们的入场位置。强者横强，顺势而为。我是高辉，关注我。下期分享。波段在法交易的秘密。","video_key":"20261016_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_4dc0d9e264","blogger":"神光弘缠高辉","match":"exact","cls":"M","claim":"破位点到5分钟下轨之间的空间，G为H,H小于等于5%，不卖。离5分钟下轨太近，卖出再追回，白胶磨损，直接把一分钟的止损上一道5分钟，宁可等5分钟真正破位再走。一分钟走弱，却没带坏5分钟，更不用动，只有H大于5%。破坏空间足够，才执行1分钟减仓。记住15个字，小仓是0米，大仓手底线，破位看距离。下期，解决你最大的痛，拿不住的高点，点关注。别等行情走完才刷到我。","video_key":"20261020_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a534d43138","blogger":"神光弘缠高辉","match":"exact","cls":"M","claim":"这支票能刚卖就涨停了，对吧?卖完少赚20个点，拍大腿吧。你以为是你心态不好，错了。其实是判断多空的方法，从根本上就错了。当我们看见一段行情出现放量上涨的时候，一般我们会在第二天去进场，同时第二天也是放量长阳。但是进去以后就会发现第三天的行情不能够支持直接反向打破前期入场的低位形成止损。当前期止损割肉以后，我们会发现第二天、第三天、第四天、第五天，它又涨回去了。那就说明在这个市场里边你用单一的K线或者是形态哪怕配合成交量都无法去判断这个市场的涨跌和走势的操作。这就是问题你拿一根K线在那猜方向多空不是一根K线定的多空是比出来的是这一段和上一段进行对到底谁强谁弱。我们来介绍一下什么是多空隧道。","video_key":"20261026_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_c136579c25","blogger":"大道无修","match":"exact","cls":"U","claim":"我抓过三千万就收手。祝你后路轮转一百万里。你还年轻，三千万不够。三亿。","video_key":"20260106_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_04f6df4e4b","blogger":"老张聊周期","match":"exact","cls":"T","claim":"传媒龙头直接关小黑窝了。昨天我提醒大家，这个方向触发异动风险。一波行情的龙头是怎么使的，通常分四步，先说监管降温。连续大涨触发异常波动，被重点监控，往往是见顶的前兆。接着断板，不是中点，是分期开始。高位放量，多空拉扯，断板之后要小心地。龙头、长、反包、回风。吸引追高的人，不少人就站上了山顶。收尾看补掌定生死，低位补掌都开始坑人。主线撤退，老龙头才真正的走下坡。所以龙头之死不是一根阴线，而是一段过程。监管降温，断板分歧，反包又多，补掌退潮。记牢笔记代码还管用。点按关注，也来评论区聊一聊，印象里哪一次龙头见顶让你印象最深。","video_key":"20261016_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_3dc7c9b109","blogger":"老张聊周期","match":"exact","cls":"U","claim":"做短线的人亏钱，很多时候不是选错了票，是这四件事里有一件没做到。第一件，错了要认。很多人不是不会买，是买了之后不认错，一路扛着。第二件，看清楚自己在什么地方。一个地方没人管的时候，耗在里边的时间是最贵的。你等的不是反弹，是别人都走光了，你还在。第三件，别上头，踏空本身不可怕，踏空了去追高才要命。卖飞也别着急，搬回来。报复性加仓才是真亏钱的开始。第四件。只做一种，你会一种模式反复做，比你会十种，每种都做半调子强。这四条里，你最容易栽在哪一条呢?评论区，扣个数字，我不给你代码，只告诉你纪律比判断重要。","video_key":"20261019_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_743af622ac","blogger":"缠论可视化","match":"exact","cls":"T","claim":"这整个线下走势概率的演变，由60%概率的弱倍时，然后变成80%力度变强的转折。所以这里的买点有两个，第一个是按照反弹来看的买点，这个买点质量不高，博弈价值也不高。这里是当作反转来看的买点，概率很高，它的位置也偏高。但是要注意。科创是从很高的位置下来的。到这里是第一次给30分钟级别转折的买点。这个位置虽然算不上是多好，但是也不差了，算一般质量的买点。在有买点的情况下，不存在追涨的问题。但这个位置的买点操作很有难度。一方面是心理的因素，过于担心风险，恐惧的心理会放大，这是最大的障碍。另外一方面是操作的问题。对这种买点对风控的要求要更高。30分钟级别这一笔，现在看起来力度很强。","video_key":"20261104_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_383d08fe4f","blogger":"缠论可视化","match":"exact","cls":"T","claim":"按照这个力度来看，它应该冲到更高的位置。但如果这一笔完成的不及预期，在这里完成了，那么要及时离场，回避风险。第四个问题，没有入场的怎么办?首先要看这一笔能冲多高。如果冲得不高的话，回调、给300或者给一个不错力度的200都适合博弈。但这一笔如果冲得力度很强的话，那么就不值得博弈了。","video_key":"20261104_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a1fdb4af96","blogger":"缠论可视化","match":"exact","cls":"T","claim":"上方压力位的下方在这个区间，也就是3800个点附近。科创反弹的位置是半分位，还有中枢下边沿区间，也就是1500点附近。第三个问题，这波主线是谁?可以分两条。第一条是老主线，云端算力链加上算力金属，昨天表现最强的。这个是可以提前预判到的。而后期的科技牛，这条线依然是有很高概率成为主线的。第二条是事件驱动。老美中期选举，像光伏、贵金属还有电池，今天表现最强的。这条线是由事件驱动，所以很难提前捕捉到。而之前买点基本上都是在昨天就给了。那么今天考虑的不是买点的问题，不要去追。接下来需要考虑的是能不能够顺利地到达目标位。","video_key":"20261105_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_df1d98467f","blogger":"ph源开发","match":"exact","cls":"U","claim":"我们寻找着在这条路的中间我们迷失着在这条路的两端每当黄昏阳光把所有都喧嚣你看那阶段多耀眼我们奔跑着在这条路的中间我们哭泣着在这条路的两端","video_key":"20261005_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_c84bfd0947","blogger":"ph源开发","match":"exact","cls":"T","claim":"相信不少朋友都好奇，究竟哪种策略才能在市场上能够长期稳定的正向盈利?我根据自己玩了三年的实盘经验，我可以这样和大家说，只有一单一节带止损和突破类型的EA带止损，它是能够长期存活在市场上。大部分朋友应该一开始接触到的都是网格和马丁，但这两种EA它有个致命的团板。一旦开单，遇到不回调的行情，要么你就爆仓，要么就加仓，要么你就止损。也就是大家常说的那句话，千日砍柴一日烧。你可能稳定营业了两个月，但是可能某一天，两个月，一波行情直接给你把本金和利润全部拿掉。所谓的一单一节，带止损，其实也有一个短板，它在载幅震荡的区间内，它会一直不断的被扫止损。比如今天你赚了10刀，可能明天你就会损20刀、30刀。","video_key":"20261106_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_81b66dcd56","blogger":"ph源开发","match":"exact","cls":"T","claim":"目前来说的话，突破类型一单一节，胜率特别高，特别是只开白天的情况下。每盘不开，就开早上的8点到晚上的8点，这个情况下胜率是特别高的。我最多的一次连续8天没有一次止损。但是市场行情每天都在变化，交易有风险，大家需要谨慎。","video_key":"20261106_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b72e75be60","blogger":"史月波巴菲兔","match":"exact","cls":"T","claim":"但是至于这一轮摸摸4000还是摸不摸4100，那个其实就是你们觉得很重要，其实我觉得不是特别重要。换句话说，可以忽略，你摸也行，不摸也行，我觉得无所谓。我要看的事不是这个，我要看的是你是否破坏趋势，是否破坏底部结构，是否量价混乱。你只要这三样不犯，我觉得就可以忽略，就可以不管它。这说的是大盘。个股也是一样，就是你要有一个恒定的一个评判的一个标准，就是我这个事。他俩不天天看盘。燃烧的周期过短。天天去着重于短线，今天我逮个板，明天我逮个牛，后天我踢个狗的，有意义吗?好玩吗?你能挣到钱吗?真正能挣到钱的是能捏得住的，是真正能够做价值投资的，那是能够挣到钱的。","video_key":"20251010_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_8da14adad9","blogger":"史月波巴菲兔","match":"exact","cls":"T","claim":"但是用底线思考，相对来讲就会好很多。比如说现在，你要考虑，第几根K线不能跌破呀?是不是这连续拉了三根K线，这第三根K线不能破呀?如果第三根K线破了，小趋势就破了。是不是平台位不能破呀?平台低点不能破呀?这就叫底线思维。那是说从这儿到底线思维差了不少了，降成本呀?你把成本降下去，降下去以后，它再折腾你就不怕了。而且你就看着它折腾，就像那个如来佛看着孙悟空在手心里飞是一样的。你飞吧孙子，你飞，你能飞哪儿去?就这么个劲儿，就是一种高危俯视低危的一种。思考模式。你那炒股票，你跟别人比，你，你，他能是一个，他能是一个维度吗，这东西。更多内容请关注高控盘。","video_key":"20251010_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7445aa23ae","blogger":"史月波巴菲兔","match":"exact","cls":"M","claim":"高控盘课程体系发展。十年降星沉淀，点滴用心雕琢。2015年高控盘正式入驻和训平台。在和训平台开启了高控盘的第一次课程。全年共177节课程，约88小时。2016年高控盘进阶课程开课。全年共179节，约125小时。2017年高控盘丰富课程体系。全年共247节，约195小时。三年的课程加强了学员们对市场认知的深化。2018年，高控盘开设K线读心术、降龙十八掌等全新课程，全年共256节，约215小时。2019年，高控盘开设独孤九剑、波浪理论等分析体系课程，全年共247节，约213小时。5年的课程提升了学员们的技术分析能力。高控盘开设铁血十三绿、高控盘股市丛林法则等课程，全年共291节，约233小时。","video_key":"20261015_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_59a56c5490","blogger":"老沈讲市值","match":"exact","cls":"T","claim":"下周一的行情不用瞎猜了，老沈直接给大家说答案。要是下周一行情不按照我说的逻辑演绎，大家直接过来把我看盘的电脑砸了。今天A股低开之后盘中有承接，护指探知3612点后有所回拉，最终收出假阳线，创业板大幅下挫，指数跌幅看着吓人，但场内并不是全盘崩盘，依旧有防御板块逆势走强，这和当下的盘面特征完全契合。那么问题来了，下周一还会继续杀跌，甚至出现放量破位大跌吗?持仓的股民要不要趁着反弹抓紧割肉离场?空仓观望的股民能不能着急抄底进场?这些都不用再胡乱猜测。如果你在下周一开盘前刷到这条视频，务必现在就保存好。三亿股民，周一开盘前请务必听我一言。今天，A股走出典型的外扰杀跌分化走势，受隔夜美股科技股暴跌冲击。","video_key":"20261106_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_9e9031aa7e","blogger":"老沈讲市值","match":"exact","cls":"T","claim":"熟悉老沈的朋友们都知道，我不敢说每天的判断100%精准，但我每一次分享的观点都是经过深度复盘，结合真实盘面与政策逻辑推导出来的。说实话，能在这个节点刷到我，说明你的财运不一般。先点亮一颗代表财运的小红心，留下一句888。如果连一颗免费的红心都懒得点，几个字也不愿留下，那么后续盘面一动，行情即将变盘的时候，系统就不会第一时间把我的关键内容推送给你。回到盘面，老沈的观点十分明确。今日受外围冲击大跌之后收出假阳线。不是趋势直接反转走熊，而是外部情绪宣泄之后的分歧考验。下周一是决定短期方向的关键验证窗口。下面通过三大逻辑分析，解答大家所有的疑虑。","video_key":"20261106_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_531b07f980","blogger":"老沈讲市值","match":"exact","cls":"T","claim":"第一，当下A股的底层逻辑没有发生改变，并不是内部基本面崩塌引发的下跌。政策持续拖抵资本市场，汇金表态，上市公司回购增持，大额代建仓ETF多重利好夯实底盘，会限制大盘非理性持续大跌的空间。但挡不住外围情绪带来的短期剧烈波动。第二，今天市场出现明显缩量，恐慌放量踩踏并没有出现。说明场内大量资金并没有选择不计成本出逃，更多是周五面对海外巨大不确定性，资金选择观望避险。只要没有出现放量杀跌，每一次急跌之后都存在资金博弈修复的可能性，但现阶段不要急于重仓抄底。第三，进入11月，机构开启年末净值冲刺阶段，但当下外围扰动加大。资金风险偏好明显下降。","video_key":"20261106_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a7cb86548a","blogger":"羽客11","match":"exact","cls":"U","claim":"有多高才算不负年少。路有远才算走到尽。我在这人间走了万重山。却始终等不到那一声赞。问天问地问命运。用尽了全部的力气。","video_key":"20260915_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_2e55478689","blogger":"作手烽火","match":"exact","cls":"T","claim":"11月9日到11月13日，下周行情推演。11月9日，周一，大盘惯性低开，电力逆势走强，银行稳如磐石，存储芯片，CPU跌跌不休，指数收贷下影线的小阳线。11月10日，周二，指数高位震荡，机器人、传媒高开拉升，银行低开低走，指数收十字星。11月11日，周三，指数低开震荡，医药、农业逆势飘红，光模块。半导体因低不止。指数收带上影线的中阳线。11月12日。周四。指数高开高走。券商。白酒重振旗鼓。指数收中阳线。11月13日。周五。指数震荡修复。算力低开高走。光通信。传媒。震荡分歧。指数收放量中阳。","video_key":"20261107_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_756bc1c825","blogger":"缠论船长","match":"exact","cls":"M","claim":"如果这一轮反弹连前面最后一个中枢区间都无法回到，说明这一轮修复力量偏弱，后续再度走弱的可能性比较大。那反弹能回到前期中枢的话，情况是不是就好很多?如果反弹能够重新回到之前的中枢区间，代表已经收复一部分失地，走势对比下跌阶段是有所改善的。要注意，哪怕出现止跌迹象，也不要看到信号就急于判定行情反转，先观察反弹力度。好的，那第二个观察维度是什么?第二点，回调之后再次向上，能不能突破上一轮反弹的高点。反弹之后通常会出现一轮回调，回调结束再度向上，这时候要看能不能突破前一次反弹的高点。如果反复冲高都过不去前高，是不是意味着向上的力量不够?","video_key":"20261106_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_8e786e41be","blogger":"缠论船长","match":"exact","cls":"M","claim":"如果反复冲高，始终冲不过前面的高点，说明向上的动能不足，大概率继续震荡，甚至再次走弱。那突破前高的话，是不是就是转强的信号?如果新一轮向上可以突破前高，代表向上的空间被打开。从走势结构角度，形成上下上三段结构。第三段能够突破第一段高点，是走势尝试转强的观察信号。简单说，不要看见几根上涨K线，就直接认定下跌已经结束，要看完整的结构有没有发生改变。前两个维度都满足之后，第三个观察点要看什么?第三点，看中枢震荡是走弱还是逐步抬升。前面两个观察点都出现之后，还要继续看震荡区间的变化。有些行情反弹之后一直在区间来回震荡，高点不断降低，低点也同步下移，这说明整体依旧偏弱，反复的风险依然存在。","video_key":"20261106_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5c929e719c","blogger":"缠论船长","match":"exact","cls":"M","claim":"那走势逐步转强的震荡特征是什么?走势逐步转强的特征一般是上涨阶段不断创出阶段新高，回调的时候不会跌破上一轮回调的低点，也就是新高不断出现，回调不会深度跌回去，代表向上有延续性，下方支撑在逐步加固，多头力量在慢慢占优。当形成这样的震荡结构之后，再配合一轮向上的推动是走势改善的参考信号，但这不代表后面一定会持续大涨，依然需要持续跟踪后续演变。听完这三个维度，我是不是可以把判断逻辑总结成三个问题?也就是说，满足的条件越多，转强信号就越明确?对，满足的特征越多，代表走势转强的信号越明显。这里也得提醒大家，技术分析本身的定位是什么?技术分析只是对过往走势做结构拆解，不是用来预判未来必涨必跌。","video_key":"20261106_0000"}];
const KEY='tier2_review_20261108';
const verdict=JSON.parse(localStorage.getItem(KEY)||'{}');
const bl=[...new Set(DATA.map(u=>u.blogger))].sort();
const fb=document.getElementById('fb');
bl.forEach(b=>{const o=document.createElement('option');o.value=b;o.textContent=b;fb.appendChild(o)});
function save(){localStorage.setItem(KEY,JSON.stringify(verdict))}
function paint(){
 const fbv=fb.value,fcv=fc.value,fsv=fs.value,q=document.getElementById('q').value.trim();
 const list=document.getElementById('list');list.innerHTML='';
 let shown=0;
 for(const u of DATA){
  const done=!!verdict[u.unit_id];
  if(fbv&&u.blogger!==fbv)continue;
  if(fcv&&u.cls!==fcv)continue;
  if(fsv==='0'&&done)continue;
  if(fsv==='1'&&!done)continue;
  if(q&&!(u.claim.includes(q)||u.blogger.includes(q)))continue;
  shown++;
  const d=document.createElement('div');d.className='card';
  const mm=u.match==='multi'?'<span class="match-multi">⧉同文多博主归属</span>':(u.match==='no_match'?'<span class="match-multi">?未归属</span>':'');
  d.innerHTML=`<div class="meta"><span class="badge b-${u.cls}">${u.cls}</span><b>${u.blogger}</b><span>${u.video_key}</span>${mm}<span style="margin-left:auto;color:#bbb">${u.unit_id.slice(-10)}</span></div>
  <div class="claim"></div>
  <div class="btns">
   <button class="pass" data-a="pass">通过</button>
   <button class="revise" data-a="revise">修改</button>
   <button class="reject" data-a="reject">拒绝</button>
  </div>`;
  d.querySelector('.claim').textContent=u.claim;
  d.querySelectorAll('button[data-a]').forEach(b=>{
   if(verdict[u.unit_id]===b.dataset.a)b.classList.add('on');
   b.onclick=()=>{verdict[u.unit_id]=b.dataset.a;save();paint()};
  });
  list.appendChild(d);
 }
 const n=Object.keys(verdict).length;
 document.getElementById('done').textContent=n;
 document.getElementById('pg').value=n;
 if(!shown){list.innerHTML='<div class="sub">（无匹配项）</div>'}
}
function exportJson(){
 const n=Object.keys(verdict).length;
 if(n<580 && !confirm(`还有 ${580-n} 条未判，仍导出？`))return;
 const out=Object.entries(verdict).map(([unit_id,action])=>({unit_id,action}));
 const blob=new Blob([JSON.stringify(out,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);
 a.download='tier2_review_verdicts.json';a.click();
}
['fb','fc','fs','q'].forEach(id=>document.getElementById(id).addEventListener('input',paint));
paint();
