已经走出了一个反向的线段，八号位置直接突破六号的前高。走出标准上下上的三段反向结构，也已经落地成型了。因此二买的确认就成立了。当然这里也要客观看待。反向结构的确定不代表行情就一定会走单边拉伸。","video_key":"20260819_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_9c78b0de87","blogger":"冬哥教缠论","match":"exact","cls":"M","claim":"只要这个形态成型，原有行情就会进入加速阶段。落实到实战操作上，思路也很简单，核心就两个字——顺势。如果是上涨过程中的奔走中枢，每次刺一个好的观察点位。如果是下跌走势里的奔走中枢，那每一次反弹都是离场的机会，切记心存讲信。大家一定要分清奔走中枢和常规的震荡中枢。蓄力中枢，蓄力中枢是完全不同的。它不是横盘整理，也不是蓄势等待，而是趋势走稳之后，行情进入加速阶段的信号。所以发现奔走中枢就相当于看到行情按下了快进键，所以你学会了吗?","video_key":"20260822_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_c0da2636b5","blogger":"海量量化小号","match":"exact","cls":"M","claim":"这里面涉及一个概率的问题。如果系统判断为震荡行情，那可以使用刚才的划线法。我们引入30均线方向作为判断是否为趋势的前提条件。这跟红色跟蓝色相连的是30均线。显示红色表示30均线方向向上处于多头趋势中。显示蓝色的表示30均线方向向下处于空头趋势中。来看开仓逻辑。在30均线方向向上的时候，如果复图指标CCI上穿100，则多单上车。在30均线方向向下的时候，如果复图指标CCI下穿-100，则空单上车。下车的方法你可以用指标类的出场，也可以用置顶视频讲的三参数追踪出场。来看具体案例。这个位置均线蓝色并且方向向下。同时下面复图CCI指标下穿-100空单上车。上车后产生止损线和盈利目标线。","video_key":"20241030_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_151ea96afe","blogger":"海量量化小号","match":"exact","cls":"M","claim":"三个月实现43倍的惊人战绩。投资大师安德烈布舒曾四次夺得世界大赛冠军。2560战法共四条操作口诀蕴藏着三个操作策略。短线策略之前已分享。学会的都说赚大了。今天我们再次公布价值百万的2560波段战法逻辑。请耐心看完并给视频加上小星星。我们在设置盈亏比为2比1的情况下批量测试了60个品种。发现很多品种效果都非常好。这要是再优化一下出厂逻辑那可就不得了了。请注意，今天这个视频是含有成熟的出厂优化方案的。由于回彩在量化交易中无法精准定义，所以我们对该口诀采取部分的优化。请看好了，上图是25均线，下图是5均量线和60均量线。优化后的波段逻辑是这样的，多单入场条件是。","video_key":"20250530_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_12935ba4b5","blogger":"海量量化小号","match":"exact","cls":"M","claim":"多单上车后，我们会在其下方一定的位置画追踪止损离场线。这个追踪止损的原理我们在之前的视频讲过。到底追踪多少幅度其实是根据历史K线的波动率测试出来的。本案例是价格的1%，行情一路走高，离场线也跟着上移，只要它不下破，这个离场线就一直拿着，一直等到行情最终击穿这根离场线止盈离场。再看后面的行情，像这些位置虽然K线有上穿下穿均线，这里是有两本K线完成上穿的动作。它上穿的时候均线方向是向下的，不符合多单条件。这里K线下穿的时候均线方向是向上的，也不符合多单条件，一直等到后面这个位置。P线再次下穿均线，同时这个时候均线方向也是向下的，符合策略的空单上车逻辑。","video_key":"20251115_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_30c184a115","blogger":"海量量化小号","match":"exact","cls":"M","claim":"空单上车后，在其上方1%位置划空单的追踪止损离场线。后面的行情一路下跌离场线跟着下移，直到这里行情反弹。击穿离场线，止盈离场。那么这两单它是吃到一个比较大的利润呢。当然，交易的过程中有很多时候并不是那么顺利的，更多的时候其实是不太顺畅的行情。比如说后面跟着的这个位置是符合多单上车逻辑的。多单上车后行情一直震荡，已经震荡了一个多星期了。庆幸的是目前行情并没有击穿下方的追踪止损离场线，所以就一直拿着。这里请注意了。在这些位置其实是出现了至少十次复合多单或者空单条件的K线。如果手工交易不断开仓不断平仓，那来回打脸，再加手续费划点，肯定会让你损失不少本金，甚至有可能把你前面的两单利润全部给亏回去。","video_key":"20251115_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_27181c20c7","blogger":"海量量化小号","match":"exact","cls":"M","claim":"只不过因为我们运用的是追踪止损，前面这里已经持有了多单，而且多单还在线，没有被止损，也没有止盈，所以就一直拿着。未来行情是涨是跌，谁也不知道。坚决执行交易系统，你才有机会成为最终的赢家。策略的整体的效果还是非常不错的。任何方法都会出现连续亏损的时候，策略仅供参考，不作为石盘买卖依据。","video_key":"20251115_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_dab8e445ec","blogger":"海量量化小号","match":"exact","cls":"T","claim":"九次爆仓亏掉百万才总结出的交易圈最狠的保命体律。看完少走十年弯路，这不是故事，是我一个兄弟拿真金白银砸出来的血泪教训。九次爆仓，百万学费，他说最后悟透的根本不是什么技术指标，而是怎么在市场里活下去。今天这三条保命法则，是他拿命换来的。不想被市场吞得连骨头都不剩的，给我盯紧吧。第一条，子弹永远别打光。这是他九次爆仓最痛的一刻。从那以后，他开仓永远不超三成，满仓，在他眼里就是自杀。账户里至少保留两倍保证金。这是你的救命绳，就像高空走钢丝。没这根绳，摔下去就是粉身碎骨。行情一反向，别犹豫，先砍仓再思考。亏损超5%。立刻断臂求生。记住，活着才有翻盘的机会。第二条，逆势作单，必死无疑。","video_key":"20251231_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7545792364","blogger":"海量量化小号","match":"exact","cls":"M","claim":"空单超级趋势线的标准是把上方白色创新低的点连接起来，如此循环，再把白线和黄线隐藏，就得到了这个大名鼎鼎的Super Trend超级趋势线。如果你觉得原理有点复杂，那就不要管这两关线是如何产生的，知道如何运用就可以了。当价格突破绿线清除空单看多，当价格跌破红线清除多单看空，如此循环即可。因此这是一个永远持仓，非多即空的趋势策略。这两根线就相当于多空趋势的动态止损线。这个是该指标的文化源代码。适用的软件有文化678，童话顺，开拓者TB-语言。其他软件则需要召唤代码。感兴趣的同学切记点赞收藏。我们更新主图测试，显示信号线，可以看出这个策略也是赢多亏少，可以截断亏损，让利润奔跑的一种指标线。","video_key":"20260207_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_eb6d891917","blogger":"海量量化小号","match":"exact","cls":"T","claim":"意义是，当前K线收强。靠近顶部属于墙梯阶。组合意义是落转强拐点。视为趋势延续及启动信号。空头入场遵循先强后弱。前一根K线最高价减去收盘价，除以K线振幅要求小于等于25%。后一根K线最高价减去收盘价，除以K线振幅要求大于等于75%。其意义是强转弱拐点，趋势反转及延续信号。多头离场逻辑为价格跌破近两根K线最低点减一跳。空投离场逻辑为近两根K线最高点加一条。其意义是严格限制单笔亏损，截断亏损让利润奔跑。预值的核心作用可以截图保存，均线参数根据不同周期可调整。以测试效果为准。我们来看实际案例。图中看到白色的快线为8日均线，黄色的慢线为40日均线，符合看多上车的逻辑为条件1。","video_key":"20260410_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_d641380a08","blogger":"海量量化小号","match":"exact","cls":"M","claim":"第三种，全天行情被困在白线和绿线之间小幅波动，属于窄幅震荡行情，没有有效流动性扫单机会，直接放弃操作。第四种，也是最常见的一种，行情走出标准的假突破扫流动性信号，这种情况必须果断进场并严格执行止损止盈，这也是出现频率最高的一种。既然有效机会很多，那有没有交易次数限制?会不会符合入场条件之后行情震荡导致反复被打脸?问得太棒了，这点非常关键。一定要严控交易频率，建议是单日最多出手两次，不管是同一方向连续开仓，还是多方向混合开仓，累计两次之后，哪怕后续再出现优质信号，也全部放弃。频繁交易只会增加亏损概率，管住手笔找机会更重要。这个策略还有继续优化的空间吗?有没有什么优化的方向建议?当然有。","video_key":"20260909_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_0f63ddaf6c","blogger":"期指K神","match":"exact","cls":"T","claim":"为什么明明是金叉时入场还会跌得一塌糊涂?为什么明明是死叉时离场之后又是一波主声浪呢?市面上大多讲解MACD的内容都在反复强调金叉买死叉卖，却忽略了一个核心逻辑，那就是指标本身就是滞后的，但滞后性可以通过维度提升来化解，这也是多数人没掌握的关键原因。今天不聊花里胡哨的技巧，只给大家讲透MACD的底层逻辑，帮你跳出信号陷阱。老规矩，先点赞再收藏，关键时刻能帮忙。首先要明确一个核心，MACD从来不是买卖开关，而是趋势探测器。很多人只看快慢线的交叉，却忽略了最关键的零轴和级别。这两个维度才是区分信号有效与否的核心。先讲零轴。零轴是趋势强弱的分界线。","video_key":"20260427_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_cd6eb0822d","blogger":"期指K神","match":"exact","cls":"M","claim":"若军线频繁出现金叉死叉交替，MACD确实金叉形态或者出现的时间周期不同，都不要轻易上车，否则很容易掉进下一个陷阱。一定要等待同周期双指标确认信号再出手。最后来看我总结的双均线加MACD共振战法简表。避免丢失找不见，记得收藏起来反复学习。","video_key":"20260617_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_69285cf253","blogger":"期指K神","match":"exact","cls":"M","claim":"看懂布林黛，早晚高富帅。本期视频分享布林黛黄金三句口诀，看懂你也可以一眼识破最佳买卖点。注意视频中会给到最新改版布林黛，老规矩先点赞再收藏，关键时刻能帮忙。布林黛由上轨、中轨、下轨三条线组成，分工明确，分别对应压力、趋势、支撑，是行情研判的核心依据。接下来带大家吃透三大操盘口诀，全方位掌握布林黛实战技巧。1.三线齐上，中轨进场，上轨离场。当三线同步上行，代表市场处于良性上涨趋势，行情以阶梯式上涨为主。操作上顺势而为，价格回踩中轨起稳是稳健的进场时机。价格冲高触及上轨，上涨动能衰减时，分批离场了结，把握完整上涨节奏。一旦有效跌破中轨，则需等待下次出现奇闻形态。二、三线走平、下轨低吸、上轨高抛。","video_key":"20260902_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_4d49bf4c9f","blogger":"期指K神","match":"exact","cls":"T","claim":"利用MACD的金叉和死叉来抄底逃顶的时候，发现往往会有滞后性，信号永远慢行情半拍，导致频繁被行情打脸。今天换一条思路，直接用MACD的红绿柱来快速抄底逃顶。相比于快慢线交叉，红绿柱更能实时反映多空动能变化，提前捕捉行情反转信号，完美解决指标滞后问题。先看绿柱变化，当一轮下跌行情中找到这根最长的绿色能量柱，意味着空头动能已经达到极值，俗话说胜极必衰。我们将这根极值绿柱对应的K线圈出来，在它的高点绘制一条水平压力横线。后续行情一旦放量突破该压力位，就代表空头格局终结，多头资金进场，是较为稳健的低多介入时机，之后大概率迎来新一轮主升行情。","video_key":"20260907_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_bd87bb59b2","blogger":"期指K神","match":"exact","cls":"M","claim":"唯一可以提前抄底的金叉便是，当MACD滤柱出现前大后小之后的水下金叉才能提前上车。因为这是典型的底部背离形态，随后行情迎来反转概率将会大幅提升。记住使用方法，前大后小，金叉就搞。本期MACD使用的参数我放在了下方，赶快抄作业吧。","video_key":"20260909_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_0752e9ce2a","blogger":"期指K神","match":"exact","cls":"M","claim":"中轨不破，不必操作。中轨说的就是这条不临待的中轨线。超80%的人不知道，其实这条中轨才是整套指标的核心生命线，进可攻退可守。中轨的重要性体现在三个不可替代的实战功能上。一、多空分界线，上多下空。二、动态支撑阻力，不破不进。三、趋势界定器，多空转换。当价格自下而上突破不灵中轨，同时中轨线拐头向上，形成U字形态，代表多头趋势开启，此时价格站稳中轨线便是低多布局信号。价格站稳中轨后，中轨就转变为动态支撑，行情维持在中轨上方，就可以大胆地持有拿住波段利润。一旦价格回落，加布林代三线同步缩口，要提前警惕行情拐点。如果缩口后价格有效跌破中轨，就是离场信号。之后往往出现一波大幅回落行情。","video_key":"20260921_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_2cd0d48bd5","blogger":"格格巫方法论","match":"exact","cls":"T","claim":"比如，涨停板的价格是10块，你挂10块买入，但是当天的开盘价是9块5，那你的单子就会以9块5成交。如果挂单在连续竞价阶段，也就是9点半以后，成交价就不是固定开盘价了，而是市场的实时价格。这个时候如果股价没有涨停，以涨停价挂单买入，系统会按照价格优先的原则优先去匹配当时卖单的价格，而不是必须要等到涨停的时候成交。这个逻辑不仅适用于涨停版买入，也适用于跌停版卖出。如果盘后有利空，想要快速止损，你可以试试隔夜挂跌停价卖出。很多散户往往就是利用这种挂单的规则来抢占成交先机的。好了，本期视频就到这了，看完的朋友别忘了点赞关注支持一下。我是格格乌，下期视频见。","video_key":"20260812_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_fd00946fcd","blogger":"格格巫方法论","match":"exact","cls":"M","claim":"在周线图中，五周均线是关键指标，一个月大约有五周，因此五周均线对于判断股票的强弱具有重要意义。当K线位于五周均线之上时，说明股票处于强势状态。反之，如果跌破五周均线，那么可能意味着行情的暂停或者将会出现反转。其次，日线图主要用于判断股票的短期趋势方向以及主力的动向。日线图的趋势可以分为主要趋势和次要趋势。主要趋势是股票的长期发展方向，而次要趋势则是短期的调整和波动。例如，在周线呈现向上趋势时，日线可能会出现涨跌起伏，甚至短暂回调。这种回调往往会给人一种错觉，仿佛主力要撤退了，但实际上这只是主力在调整之后继续向上进攻的节奏。","video_key":"20260817_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f234df8628","blogger":"格格巫方法论","match":"exact","cls":"T","claim":"成交量的本质其实就是四句口诀，一旦悟透，看懂多数量能异动，市场大起大落也轻松拿捏。主力的任何异动都体现在了成交量上，这是突破一切阻力的关键所在。因此，成交量的关键作用是在关键的位置进行突破，绝不是普遍的成交量涨就入场，成交量萎缩就离场这么简单。首先我们先来看第一句，突破前后的量能变化。价格突破关键位置之前要逐渐放量，但突破之后最好要缩量。比如这个案例，我们在前高压力位置画出一条线，可以发现当价格面临关键压力位的时候，量能逐渐放大，这就叫好钢用在刀刃上。","video_key":"20260826_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b4d1a868b4","blogger":"格格巫方法论","match":"exact","cls":"T","claim":"在真正突破之后，大量的套牢盘已经在这些位置进行了充分换手，后续继续拉升的压力就会比较小，这时候就容易走出缩量的上涨，说明资金一致看多，行情就容易持续，这就是突破之后要缩量。第二句口诀，突破压力位后的量能表现在突破了重要的压力位之后，缩量上涨还要涨，放量上涨要观察，当放量滞胀时就要考虑撤退了。如这个案例，在突破了前高压力位之后，价格连续上行，但成交量并没有放大，甚至有些阶段还是缩量的，这说明拉升阶段上方的阻力比较小，是短线更有潜力的上涨方式。如果是放量上涨出现在底部，则是一个较为良好的启动量价关系，如果价格来到高位之后再度放出大量。这时候如果你前面没进，在这种位置就更应该小心了。","video_key":"20260826_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_3169ad051f","blogger":"格格巫方法论","match":"exact","cls":"M","claim":"第六种，股东人数突然大幅增加的票不要碰，大家都知道，一支票的股本是固定的。一般情况下，主力的筹码是大体不变的，每天流动的筹码也是大体不变的。如果主力不动，那么就是散户之间不断进行倒手。你我来你往，股东户数一般不会有太大的变化。但当股东人数突然大幅增加，很明显就是主力把筹码派发给了散户，那里面的散户越多，说明筹码就越分散。筹码越分散的票往往越难拉升，越难形成合力走出相应的独立行情。第七种，既无业绩也无题材的公司，不要碰。我们要知道，炒股要么赚业绩增长的钱，要么赚题材预期的钱。你总得有一样，如果两样你都不占，那就是死股。没有业绩，拿着不放心，万一哪天说退市就退市了。","video_key":"20260901_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b0854e31c0","blogger":"格格巫方法论","match":"exact","cls":"T","claim":"当价格下跌到一定幅度，割肉盘枯竭，抄底意愿升温，便进入横盘整理，多空平衡阶段，股价方得企稳。这个时候新庄家或机构开始布局。部分大型机构甚至提前在下跌途中建仓，因为它们已嗅到利好信号。长期阴跌个股通常机构稀少，而机构扎堆标底不会持续深跌，阴跌后往往伴随低位震荡，等新装入场后行情重启。所以在这些位置介入亏损概率极高，建议等止跌震荡后再考虑。接下来，我们来看单装股的控盘手法。比如这个案例，流通盘26.56亿股。股价3元，流通市值82.88亿。如果前四大股东持股近50%，通常不在二级市场减持，实际流通筹码约41亿，庄家只需掌控50%，流通市值大约20亿资金，那么就可高度控盘。","video_key":"20260917_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_58a59dbcda","blogger":"格格巫方法论","match":"exact","cls":"T","claim":"冷门板块缺乏资金关注，即便偶有卖充也难以持续，尽量回避。好了，本期视频就到这儿了，看完的朋友记得点赞关注支持一下，我是格格乌，下期视频见。","video_key":"20260923_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_888e1824e1","blogger":"格格巫方法论","match":"exact","cls":"M","claim":"什么是CCI呢?CCI是一种顺势指标，也是短线指标之王。仅仅由一条14日的CCI线构成，没有运行的区域限制，因此不容易出现指标顿化的现象，非常有利于投资者更好的研判行情，特别是那些暴涨暴跌的非常态行情。CCI指标和KDZ指标类似，主要也是用来反映市场上买卖力量的强弱和超卖超卖现象。从取值范围来看是没有限制的，但是这里有三个比较关键的数字，就是正负100和0。当CCI为正值时，视为多头市场，多方占优。当CCI为负值时，视为空头市场，空方占优。CCI值大于100为超买状态，此时股票被市场过度买入，炒作风险较大，可视为卖出信号。CCI值小于100为超卖状态，此时股票被市场过度卖出。","video_key":"20261008_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e8292d74a8","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"Oh Sala Hey You睡着着海风你的白衬上住着一朵彩虹Oh Sala Hey You是不是心动好想把你的温度涌入怀中Oh Sala Hey You看着着星空你的月牙好像是一场梦Oh Sala Hey You大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、河口、大盘、�还是会好像是","video_key":"20211226_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_276284a630","blogger":"MBSE挑战者","match":"exact","cls":"M","claim":"Modular Open Systems Approach是模块化开放系统方法，是美国国防部推动的技术与商业策略，核心是用模块化设计加开放标准接口打造可灵活升级、多厂商竞争的系统，避免锁定、降低全周期成本、提升互操作性与技术迭代速度。该方法的核心目标是构建低成本且具备高度适应性的系统，使其成为国防建设中的优先路径。通过标准化接口与系统集成，MOSA有效连接了技术研发与商业协作，确保了各模块之间的互操作性。美国相关法规规定，所有重大国防采购项目必须遵循此设计标准。这是一个受法律保护的现代化系统设计框架。","video_key":"20260123_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_3f69748e4d","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"通过Palantir的算法与洛克希德·马丁的硬件平台这一具体案例，生动地诠释了人工智能如何赋能实体武器系统。这种结合旨在利用灵活性与物理制造能力的互补优势，以应对未来复杂的安全挑战。最终，数字化系统将成为现代国防架构的核心大脑，指导着高性能硬件的高效运作。总结展示软件技术在现代冲突中扮演的核心角色，并提出了代码级条令的新型军事理念。算法战争时代已经到来。软件系统已经不再仅仅是辅助工具，而是构成了现代国防工业的全新基石。这种转变意味着数字化计算与数据分析，已成为决定战场胜负的关键因素。","video_key":"20260125_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_c5035df797","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"培育O等于O1、O2、OM代表对象空间。属性定义，若对象O拥有属性集A，则任意A属于A皆为函数AO。那系统实现呢?该部分展示了数学理论在实际工程中的应用流程。输入端，以原始张量、结构化查询语言数据为代表的非结构化或异构的原始信息。中间标注有函数符号F，这象征着映射机制，将杂乱的数据通过特定的算法或规则进行过滤和重组。输出端，经过映射后，数据连接到右侧的具体业务实体，包括工厂，代表工业或生产环节。人物，代表用户或原力资源。涡轮，代表核心设备或技术组件。核心在于属性即函数，将异构数据元映射为统一对象。","video_key":"20260207_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_771a1efc22","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"使用神经网络计算噪声估计量，ε,θ。2.逐步去造，subtract，减去预测出的噪声分量。3.迭代收敛，iterate，重复上述过程数百次以稳定路径。右侧动态示意图展示了数据从噪声转变为结构化数据的过程。起点是一个红色的乱点粗，标注为XT,noise，代表完全随机的噪声状态。矢量场布满了白色的微小箭头，代表梯度场。这些箭头指向一个特定的圆形区域，指示了去噪的方向。演化路径，一条橙色的折线从造身区延伸出来，经历了多次剧烈的转折，体现了随机性与逐步修正，最终指向右侧。终点X0，折线最终进入一个带有经纬网格的球体，标注为X0 manifold，代表数据所在的真实流行，即生成的清晰图像或目标数据。","video_key":"20260208_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_fffb5f9ab0","blogger":"MBSE挑战者","match":"exact","cls":"M","claim":"物理本质，电机在运行过程中，电流和电压的变化会产生随时间变化的磁场。数字孪生的作用，虚拟模型并不是一个简单的三维动画，而是一个数值计算引擎。它通过接收实时采集的电流电压数据作为边界条件，在后台求解时变状态下的Maxwell方程组，这使得系统能实时计算出电机内部肉眼不可见的磁通密度分布、涡流损耗以及电磁力。2.多物理场恶合，从电磁到噪声，采集噪声数据，这涉及到电磁场与力场、声场的恶合，电机绕组和定转子之间的电磁相互作用会产生静向力。振动与噪声。这些电磁力会导致电机结构发生微小形变和振动，进而向空气中辐射声波、噪声。反向推演。通过监测噪声，数字孪生模型可以反推电机的健康状态。","video_key":"20260217_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_0a9260ada0","blogger":"MBSE挑战者","match":"exact","cls":"T","claim":"想象它为一个以角速度ω旋转的矢量，将它们的乘积对时间变量进行积分，就得到Fω所表示的某种振幅和相位的波。为什么我们要用信号乘以E的-IωT²并进行积分呢?讲到负理叶变换的数学本质，内积即相似度检测。在数学上，两个函数FT和GT的内积是一种积分形式。它有两个含义。一、投影。就像将一个矢量投影到坐标轴上以获取其分量一样，负理叶变换是将复杂的信号投影到无数个不同频率的积波上。二、相关性。内积的结果衡量了两个波形的相似程度。将信号与标准频率波做内积，当二者频率匹配时形成共振，得到积分峰值。当二者频率正好错开时，两个波相互抵消。数字世界的结实，从欧拉到5G。","video_key":"20260221_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a05c3c856e","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"2026前沿数学应用技术简报，拓扑数据分析。从几何到拓扑，识别非线性特征与高维数据的生为打击。背景与变革，当传统数值计算遇到瓶颈。一、面对光刻机、电网或高超音速飞行器的高维数据，传统线性分析PCA失效。局限在于关注几何坐标，忽略非线性偶合，导致结构丢失。二、拓扑数据分析TDA的核心，不关注坐标，关注连通性、环和空腔。动查，数据具有形状，而形状包含意义。核心价值TDA对大数据的升维打击。拓扑数据分析TDA被视为一种处理超高维数据的攻击武器。它能看见传统方法看不见的拓扑空洞和稳定性边界。应用场景、复杂通信网络、能源互联网、材料疲劳分析。数学核心一，持续同调，persistent homology。","video_key":"20260225_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e2498fcd5a","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"时空中两点间的距离，线源ds，不再是平直的欧几里德距离，而是由杜规张量jμν决定。在导航系统中，由于地球是一个近似球体且不旋转，我们使用史瓦西杜规。史瓦西现原方程，对于静止质量为m的球体，其周围的时空间隔表示为如下公式。其中G是引力常数，C是光速，R是观测者距离地心的距离，C时间膨胀公式。从上述度规中可以导出地面观测者的时间dt ground与卫星时间dt set的关系见公式。因为R set大于R ground，所以分子的数值比分母大，这意味着卫星时间流逝得更快。利用共行映射简化复杂的流体力学。在现代工程设计CAD、CIE中，复杂的曲面建模如汽车外壳、涡轮叶片依赖于离漫曲面的参数化技术。","video_key":"20260228_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_17769c1a52","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"数据来源的本质不同在于，一、实体空间，数据源于观测，存在噪声、延迟和不确定性。二、虚拟空间，数据源于计算，是基于物理规则推理、算法演算或AI模型的预测。因果率的颗粒度差异，混沌随机与确定出发。在物理世界中，关系的发生受随机过程影响，而在虚拟空间中，关系往往是确定的逻辑触发。Palantir的本体论虽然定义了关系真理，但虚拟空间往往无法完美还原物理空间中所有隐性的、未被建模的微观关系。虚拟空间中基于想定的确定逻辑也有明显局限性，如何突破呢?要改进虚拟空间中基于想定的确定逻辑，使其更接近真实战场的混沌感，可以从以下四个维度进行演进。一、从确定触发转向概率偶合。","video_key":"20260307_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_3785c0c42c","blogger":"MBSE挑战者","match":"exact","cls":"M","claim":"随着时间T推移，这块磁铁对皮筋的吸引力先变强后变弱。皮筋不会直接撞上P1，而是在其引力下划出一道平滑的弧线。3.为什么这种设计很伟大?局部控制与整体平滑。通过调整P1的位置，你可以极其直观地改变曲线的胖瘦，且曲线永远是连续平滑的。计算高效。计算机不需要处理复杂的圆弧几何，只需要进行简单的加法和乘法。突包性质，曲线永远被限制在控制点组成的封闭多边形之内，这让图形显示非常受控，不会乱跑。操控法则，端点与切线。端点特性，曲线严格穿过起点P0和终点Pn。切线特性，第一段和最后一段控制线决定了曲线的发射与着陆方向。应用。这一特性是工程中实现平滑拼接的基础，让分段曲线看起来像一条完整的流线。","video_key":"20260411_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f790b79409","blogger":"（未归属）","match":"no_match","cls":"U","claim":"对，对，对，对。Katy Watson","video_key":"20260501_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_4810e18d7f","blogger":"MBSE挑战者","match":"exact","cls":"M","claim":"本博主前面讲解弗里叶变换以及拉普拉斯变换的视频都是爆款，达到10万集播放量。今天介绍第三种变换，小波变换，它是信号处理领域的量子力学。视频后段含代码实现内容。弗里叶变换是现代信号处理的基石。它能将复杂的实域信号，如声音、图像，分解为具有不同振幅、频率和相位的正弦波叠加。通过这种由时间向频率的视角切换，工程人员可以轻松实现噪声过滤、数据压缩以及系统的频谱特征分析，是沟通数字世界与物理世界的桥梁。拉普拉斯变换在弗里叶变换基础上引入衰减因子，将实域V分方程转化为平域的代数方程，不仅简化了连续系统的计算，还能方便地分析复杂系统的稳定性和站态响应，在控制工程和电路分析中应用广泛。","video_key":"20260606_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_2e2347bdbf","blogger":"MBSE挑战者","match":"exact","cls":"M","claim":"混沌并不是指杂乱无章，而是指一种确定性系统中的内在随机性。奇异吸引子是它的一种核心特征。尽管混沌运动轨迹看似混乱，但它总是被吸引到一个特定的空间区域内，局部不稳定但整体有界。这个区域的结构通常就是分形。分形描述自相似性的非整数为结构。系统的局部与整体在某种方式上高度相似。当你不断放大一个分形图案，你会发现它不断重复出与整体相似的细节。这个视频演示了洛伦兹混沌吸引子，它实现了可调参的蝴蝶效应现象。洛伦兹系统用三条偶合微分方程描述大气对流运动，方程如上图所示。经典参数取σ等于10、RO等于28、β等于3分之8时，系统进入混沌态，产生著名的蝴蝶形奇异吸引子。","video_key":"20260613_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5845da966e","blogger":"MBSE挑战者","match":"exact","cls":"M","claim":"一、远离平衡态的开放系统，持续与外界交换物质和能量。二、外界变化达到预值，环境压力倒逼系统到达临界点。三、内部自组织作用，无需外部指令的自发协同。三个因素结合促使系统跃迁形成有序新结构，就是在时空或功能上展现出全新的规则与秩序。构建秩序的四大引擎。要让一个系统自发产生有序性，必须同时满足以下四个前置条件，缺一不可。它们是开放系统、远离平衡态、非线性相互作用、涨落。宏观环境引入富商与势能落差。1.开放系统，对抗商增的唯一途径。系统必须与外界交换物质与能量，引入负商流是抵消内部自然产生商增的唯一方式，封闭意味着死亡。远离平衡态，打破死水一潭。","video_key":"20260628_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_dd1c191181","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"外部环境对系统的作用，它不直接决定系统形态，但通过改变环境状态，如注入能量或施加压力，诱发系统内部产生竞争。自组织原理，内部。在没有外部指令的情况下，系统内部依靠协同作用，自发从无序走向宏观时空与功能上的有序结构。四幅原理。核心，协同论最伟大的发现，少数慢变量最终支配并主导所有快变量。寻找系统的牛鼻子，四幅原理与序参量。快变量，衰减快、寿命短的要素，在系统演化中会迅速消失，它们被动接受支配。慢变量到序参量，寿命长、变化慢的要素，少数几个在竞争中胜出的慢变量即为序参量。他们像交响乐团的指挥家一样，主导并伺服所有微观子系统的行为节奏。","video_key":"20260704_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f8dea3a8f8","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"图表综合比较了相比传统模式的智能化优势。核心观点总结。1. 智能化转型，通过引入NLP、LLM和知识图谱，将原本依赖人工的重复性工作转化为自动化流程。2. 技术演进，强调了从手动操作，如Excel、手工拉线，向算法驱动，如优化算法、图算法的转变。3. SysMLVR的应用，结合AI技术，解决了传统MBSE中效率低、溢出错和追溯难的痛点。并非未来概念，真实世界的工程验证。一、核心开发者验证，Sysmail VR核心开发者Tim Wilkins已成功演示AI辅助的NPSC全流程。二、落地基石。通过标准化文本语法与API的真实调用，AI实现从建模到验证的闭环自动化已成为切实可行的工程实践。","video_key":"20260904_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_78c8c6cc79","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"确保技术方案始终服务于业务价值与实际应用需求。第二步，数据准备。目标，为本体建模提供高质量标准化的基础数据，夯实本体图谱构建的底层基础，确保后续推理与应用的准确性。1. 全域数据圆盘点。全面梳理ERP、CRM等结构化数据，以及合同、邮件、文档等非结构化数据，建立完整的数据资产清单与目录。如果是军事领域，则包括相关结构化数据库以及多元易购数据源。清洗与标准化治理。执行数据去虫、格式统一、缺失值补全及主数据对齐操作。消除数据冗余与歧义。确保全量数据的一致性与准确性。3NER种子语料构建。针对业务核心实体进行人工标注。构建高质量种子语料库。为自动化实体抽取模型提供可靠的训练基础。","video_key":"20260917_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5cd1388128","blogger":"MBSE挑战者","match":"exact","cls":"U","claim":"XMI 2.5.1 XML Metadata Interchange.FUML Executable UML Models.版权贡献组织，包括波音、打锁、NoMagic、IBM、Incos、Lockit Martin等。KML语言应用案例。展示医疗气血研发本体论的KOML模型。第二个案例展示UAV森林火灾预警与救援无人机系统工程数字主线本体论模型。第三个案例展示针对美国猎鹰查打一体无人机的任务体系论证建模的本体论模型。","video_key":"20261011_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_f2232ee45d","blogger":"老K说形态","match":"exact","cls":"U","claim":"I have a goal fortified, with entire life to hold.All the countries I always call on my mind.大盘、六角、怀背、汉民、项链。出门三十七的汤圆的商店。按照你的Piece Make上去光线。我藏在山谷里挖出望景。也坐在酒馆里弹奏钢琴。让年轻女孩为我伤心。混账演在我手下任命。车轮正动，我为自己合一。六发六中，有着美的设计。他们奔过来，我可以从车里。六十的只有万里而高的奖励。朋友称的老板娘拿出半瓶Whiskey，倒进我的杯子里。我说Why don't you drink?","video_key":"20260715_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_fa9e79c322","blogger":"老K说形态","match":"exact","cls":"T","claim":"我们先来看大趋势。目前是处于下跌之后的整理阶段。因为已经踩到前低的支撑位，这种形态和点位我们是可以进场的。止损放到支撑位下面一点就好。而且下方已经走出一个WD，这个位置刚好回踩均线，直接上车。缩量回调，继续持有就好，不要被洗下车。WD的颈线在这里，注意能不能突破。两次回踩颈线，而且这根阳线站稳了，加仓。要走吗?不着急，看回踩均线能不能继续上攻。上弓有些无力了，再观察一下，可能得走了。这根长上引线出来，有点要走双顶的感觉，落袋为安了。这根高位十字星，反转还是洗盘?又接了一个三角形整理，你觉得后面会怎么走?","video_key":"20260718_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7f4f2c8928","blogger":"老K说形态","match":"exact","cls":"U","claim":"规料。砂礼炼出多金规，卖价不够本钱回。规片。规棒拉出切成片，价钱砍到本钱线。电池片。规片做成电池板，技术一换老现摊。组件。电池封装成组件，卖得越多越贴钱。逆电器。直流交流它逆变，全链窥时它最赚。电站运营。板子装好把电发，一年收租稳稳拿。胶膜。胶膜加在玻璃间，别人亏本它赚翻。","video_key":"20261002_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_89b977c03f","blogger":"（未归属）","match":"no_match","cls":"T","claim":"觉得有用，点个赞，咱们下期见。","video_key":"20260922_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_700b8d1b76","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"骑着单车去酒吧该省省该花花。大家好喽啊，我是社长。在2000年的春晚上，宋丹丹的小品《终点工》让全国人民记住了一个笑话。样装冰箱，拢共分几步。为什么这个笑话好笑呢?是因为它打破了常规认知，不仅制造了体型巨大的大象塞进狭小的冰箱里的强烈反差而带来的荒诞感，还创造了复杂问题简单化处理的极简方式，让人脑洞大开，靠极致的反差戳中了大众的笑点。在2008年，漫威翻身立作《钢铁侠》上映。高智商天才Tony Stark借助强大的人工智能Javis在短时间内做出真正可用于实战的改进型Mk2型钢铁单一。上天入海无所不能，收获了全球无数影迷的放心，并以此为起点开创了漫威电影宇宙。","video_key":"20250609_0002"},{"unit_id":"learn_视频号学习_全部文案_20261108_389194fe77","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"所以第一段需求一定要是核心需求，不然聪明如小甲也会理解不了。所以社长向小甲说了这样一段需求。帮我做一个早读课检测声音大小的HTML文件代码，要求如下。1.页面中含有30个颜色不同紧密排列大小一致的小球，并排成在页面下方。2.当检测到声音时，小球们会向上跳动。3.检测到的声音越大，向上跳动的小球越多，小球们跳动幅度越大，反之则仅有几个小球跳动。谢谢。为什么要说谢谢呢?你让人家小贾帮你干活还不客气点?所以不要去做那种无良假方。谢谢。好，小贾开始思考了。他先是充分理解了我的需求，并且抓住了早读课这一核心，立刻明白了这是个用来检测学生的朗读声音大小的程序。","video_key":"20250609_0002"},{"unit_id":"learn_视频号学习_全部文案_20261108_a7d6eee85e","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"于是我跟小甲又进行了第四次battle。如果是个程序员小哥，估计现在已经开始对我不耐烦了，但是小甲不会。我这次跟他说，请把状态提示Top80像素改成10像素，然后把背景改回白色，输出完整的代码并测试，谢谢。这一次小贾的表现如何呢?很好，忠实地执行了我的命令。接下来我又想到了一个有意思的点，当大多数小球都跳起时，说明孩子们在很努力地大声朗读，这个时候就需要给他们一些多巴胺奖励，鼓励他们继续加油呀。于是我又跟小贾提出了新的需求。当小修中有超过60%离开底部时，页面中央会出现一句鼓励同学们的话。这句话要幽默的互联网语言风格，请输出完整的代码并测试，谢谢。","video_key":"20250609_0002"},{"unit_id":"learn_视频号学习_全部文案_20261108_0d059733e9","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"现在的开源不单单是寻找新的业务突破口，更是在寻找新的技术突破，新的生产力的突破，用高效率去取代低效率，这同样也是一种开源。比如您的这家企业，原本需要安排大量的人工去做数据汇总、数据分析、数据统计等等这些繁琐且重复的工作，而且容易出错，还需要投入人力去做大量的校验工作。现在就不一样了，用人工智能模型去做，它不仅不会出错，而且速度和人工相比是几何级的倍增。所以，律所找到我们，让我们帮助它建立知识库，针对不同批次的客户案件进行分类归档，自动生成要素表格并输出。建筑公司找到我们，让我们导入建筑行业规范及公司相关文件，建立支出库，自动生成标书。","video_key":"20250609_0006"},{"unit_id":"learn_视频号学习_全部文案_20261108_e08417b068","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"这些智能体可以直接部署和现场应用，还可以把多个智能体灵活组合，形成企业级应用系统，最终助力工厂多场景智能运行与自主优化。TPT现在已经向全工业领域开放免费试用了，我实际上手体验了一下，发现它用起来相当简单。来看一下，就三步。第一步，向TPT提问。第二步，TPT开始调用专家模型自主生成解决方案。第三步，TPT基于专家模型自动生成智能体并循环执行。这种学习成本极低的可视化界面和步骤和OpenCloud有异曲同工之妙。社长刚才提到过，一个合格的智能体要具备五大本领。现在我以TPT为例，老板们可以跟着我的视角来学习一下如何确认某个智能体是否能解决你企业的痛点。不是老板也没关系。","video_key":"20260213_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_9c44e8e2c9","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"他们对AI私有化部署的要求还是比较高的，前后接触过不少AI服务商，但都因为这样那样的问题，最终没有达成合作。在与他的交流中，我能明显感受到他的焦虑。按照他的原话时，身边的律所都在积极结合AI做转型，特别担心被落下了。但大家都在黑暗森林里，也不知道对方已经进展到哪一步了。而且律师这个行业，专业性极强，要非常严谨，不能…在这种既怕落后又怕出错的压力下，找到一条安全、合规、好用的AI落地路径，已经成了他们律所的痛点。而这一次，他找到了我们。在2月的最后一天，A律刷到了我的视频，就直接联系上了我。简单的电话沟通中，他把他们律所的核心痛点一股脑地说了一遍。于是我们约定了第二天的线上会。","video_key":"20260416_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_3eab9de671","blogger":"单车酒吧搞机社","match":"exact","cls":"T","claim":"到了现场，你真真切切能看到机器，整柜摆放，封条完好，外观整齐，甚至可以拍照查看血液号。不少人到了这一步，就会觉得货就在眼前，总不会有问题了吧?可很多人都会忽略一个关键点，你能看到机器，只能证明它真实存在，并不代表卖给你货的这个人，真正拥有这批货的所有权和处置权。不少现场展示的货源。只是临时摆放、临时调配的。等交易完成之后，你会发现货根本不属于对方。这就好比你去商场看车，销售拍着胸脯说车是他的，让你把全款转给他。你一看车确实在那儿，脑子一热就把钱打了过去。可你不知道这车是4S店的，根本不是销售个人的。等你付完钱，人家拉黑跑路，你找谁都没用。服务器骗局用的也是这个逻辑。","video_key":"20260503_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_48613d52d2","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"真正成熟的数据化智能化，从来不是一蹴而就的颠覆，而是润物无声的油画，褪去技术的浮华，回归解决痛点的本心。让每一个工具每一次升级都能实实在在的为企业赋能。收藏这条，下次你企业有类似的需求，翻出来看一眼，就知道该从哪下手了。如果你也在做AI数字化改造，需要软件本地部署开发的，还是有硬件配置需求的，欢迎来找社长聊聊。","video_key":"20260605_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_10ce0f6676","blogger":"单车酒吧搞机社","match":"exact","cls":"M","claim":"还有CircleBot安全启动，企业级数据完全拉满。另外有个中国特供版，叫RTX Pro 6000D，为合规出口限制，核心数削减到19968个，显存较到84GB，带宽1568GB每秒，功耗400W左右，但价格便宜不少，预算敏感的企业可以看看它。而大家最关心的一个问题，它能不能替代H200?社长先不给你下结论，咱们先来看数据。在主流70B模型4比特推理场景下，Pro 6000的性能大概能达到H200的75%到80%。差距主要来自显存带宽。H200的带宽更高，上线文推理中优势明显。但H200的价格呢?一张H200能买三四张Pro6000。","video_key":"20260610_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_6692ee5bdc","blogger":"单车酒吧搞机社","match":"exact","cls":"M","claim":"P3E通道要够多，以后加卡不用换板子。在散热方面，600W的热量，风冷很难压住。工作站板自带双风扇开放式散热，但机箱风道必须好。用追风者614PC这种全塔机箱，前后通风。多卡部署建议直接上水冷，或者用Max-Q版。CPU不能太弱，AMD现成撕裂者7965WX。或英特尔至强W系列比较搭。推理也需要CPU做数据预处理和API调度。内存128GB起步，256GB不嫌多。RAC支持库、KB缓存都值内存。存储系统盘用PCIe 5.0固态。数据盘用企业级U2或大容量机械盘。硬盘性能会直接影响模型加载效率。这款显卡的三个版本怎么选?社长直接给答案。单机桌面用，选工作站版。","video_key":"20260610_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_4d2afb252f","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"2017年，福特架构彻底改写了AI硬件格局。这是因为它首发初代张量核心的架构，也是显卡从游戏卡变成AI算力卡的关键革新。显卡不再靠通用算力硬算AI任务。有了专属AI加速单元，这也是英伟达紧跟AI浪潮的第一次核心突破。V100显卡作为这一代AI算力卡的代表。迄今为止仍然活跃在垃圾佬的圈子中。32G大显存给了普通人获得大规模算力的机会。但V100显卡没有光追核心，只能进行上下文推理，无法完成文生视频的相关工作，这是它的短板。后续2018的图灵架构，也就是RTX20系列，TU102、TU104系列搭载了第二代张亮核心，同时首次新增光追核心、AI能力、图形能力双向升级。","video_key":"20260620_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_d0f3a492d3","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"这里有个所有人都容易掉进去的误区。上下文不是越长越好。长上下文确实能读更多内容。但越长的上下文，显存占用更高，并发更低，推理速度更慢，成本也更高。短上下文速度快，并发高，成本低。但处理不了长内容，多文档，复杂逻辑。所以真正专业的选行逻辑是什么呢?场景匹配档位，档位决定模型。不盲目追大窗口，也不将就小窗口。咱们从最低档位开始，足迹讲清楚。4K上下文，这是入门中的入门。4K大概等于3000个汉字左右。它的优点非常明显，速度最快，并发最高，显存占用最小，几乎零成本。缺点就一个，太短了，记不住太多东西。那它适合什么场景呢?","video_key":"20260727_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_d6020eee26","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"如果你只做纯文本推理，预算死死卡在千元档，能接受慢一点，吵一点，折腾一点，为132G可以的兄弟。但如果你心里还惦记着顺便跑跑图，偶尔生成个视频，社长给你一个实在建议，别碰。它就是个偏科生，偏到只有上下文推理这一门课能在及格线上，其他科目直接交白卷。那再换一个方案，第二种，CMP170HX，这卡的故事，社长每次讲都想笑。它本质上是英伟达把A100的核心拿来做矿卡，GA100核心。但出厂的时候，身上装的是64G级的HBM21高速显存颗粒。但出厂的时候，显存被锁到只有8G可用，算力差得死死的。P3E通道砍到近1乘4，相当于把一头老虎的牙齿扒了，爪子剁了，尾巴剪了，再关进笼子里，就让它用舌头挖矿。","video_key":"20260925_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b6dc1cd547","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"如果你也有AI本地部署的需求，不管是硬件配置搭配，还是软件的部署调试开发，都可以来问问社长。","video_key":"20261003_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_ce133733e2","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"好，你既然能坚持看到这里，那就听社长最后说一句，想要一个能真正帮你干活的AI搭子。真的可以试试它。基本上满足个人用户日常使用的大部分需求了。用最低的成本先用起来。这才是AI时代的正确工作方式。","video_key":"20261013_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_227cce9569","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"问你一个问题，让AI看完一部一个多小时的视频，然后问它，刚才的某个动作，头一回出现是几点几分，以及前因后果，它能不能给你整明白呢?再损一点，你凭空捏造一个视频里压根没发生的事，看它是顺着你的节奏瞎编，还是跟个老实人一样，回到画面里翻证据，再回来纠正你呢，上面这三连问，就是现在视频AI推理这块的注目狼马风。之前社长有不少粉丝朋友都在找这方面的答案，社长都说还不行，但现在已经差不多了。大家好，我是社长。就在9月份，杭州有家叫联会科技的公司，圈里都叫它OMAI。OMAI丢出了一个专门啃这块硬骨头的模型，VLXVR视频深度推理模型。","video_key":"20261018_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5aa89879b9","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"已经做了手机和汽车的小米，这次发了一台统一内存AI小主机，它就是小米AI Cube,80G统一内存，功耗只有150W，能在家跑120B的大模型。这些参数摆在一起，社长第一个想到的问题就是，雷总这次要做一个DGX Spark的平T?大家好，我是社长。今天咱们不吹不黑，先看它能干什么，凭什么跑得动，再放进本地部署圈里比一比，看看它够不够格当这个平T。先说它能干什么，小米在玄界芯片技术沟通会上把它摆了出来，雷军亲自发文介绍，前端开发、复杂编程这类任务，它都能直接本地跑。官方演示里，它本地能跑120B的大模型，也能跑3B的小模型，还支持快慢系统切换。需要深度思考，就切大模型，需要秒回，就切小模型。","video_key":"20261019_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_46ecfafac8","blogger":"单车酒吧搞机社","match":"exact","cls":"U","claim":"有人直接问他这单该批还是该拒，结果他把所有单子都换了去。他的边界就在这儿，让他按材料打个分，他在行。让他自己拍板，他不行。后来把它改成每单估个风险分，然后交给大模型业务系统按分数高低去处理才解决这个问题。第二，选项别超过20个。选项少的时候，Laya的判断很稳定，几乎不出错。可一旦给多了，比如给到70多个，准确率就会从将近9成掉到4成出头。它一次要处理的量是固定的，选项越多，谈到每个选项上的处理能力就越少，就越容易出错。Laya官方自己也建议别超过20个。第三，Laya的把握度，出厂时是假的。官方自己说拉亚出场时有九成把握度，这句咱可不能信哈。","video_key":"20261021_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_854d97c60e","blogger":"陈飞缠论","match":"exact","cls":"M","claim":"线段的连接的核心就是向上的线段一定要连接向下的线段，向下的线段也一定要连接向上的线段。如果我们前面看到一个向上的线段出现了笔破坏，后面延伸出向下的三笔，那么它就向下形成了新的线段。这样的话就由笔破坏延伸出来了线段破坏，就能够画出来。如果我们看到一个笔破坏，它没有延伸出来。然后把这些比的极限的这种区间高低点连成线段。就一段一段的就会画出来。然后在一段的基础上才是下一步中枢的问题。那么这个地方我们刚才讲到了笔破坏。另外一种就是非笔破坏的形式就需要用到特征系列分形来进行分析。我们放到下一个视频里面讲。那么今天关于线段的这种划分大家有没有领悟?如果还有什么问题在评论区留言。谢谢大家。","video_key":"20250315_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_04f1f28ed0","blogger":"陈飞缠论","match":"exact","cls":"M","claim":"好，那么如果它更强一点，这个地方拉起来，能突破这个位置回踩它不进来，它就容易形成第三类的买点。那么这个又弃掉了。这就是整个一段行情一路推过来的。这就叫同级别的分解。那么在这个同级别的分解里面，整个的这段走势我们就会发现，它变成了这样一段一段的行情。一个一分钟向上，一分钟向下，一分钟向上，一分钟向下，一分钟向上，一分钟向下，一分钟向上，一分钟向下。一分钟向上，一分钟向下，还没走完，看到没有?这就叫同级别分解。","video_key":"20250511_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e47cc30fbc","blogger":"陈飞缠论","match":"exact","cls":"T","claim":"上涨指数低开高走，缩量的小阳星。日线级别的底分形目前还没有出现。短期五合十两条均线还远远的在上方，所以它有一定的乖离。从日线态势来看，转向这个地方应该看一个小的横盘震荡式的反弹。从结构的层面，这个地方今天已经做出来了一个385号之后的右侧的一分钟中枢。明天这个地方可以看一个向上的B结构的移动。但是上方的压力比较大，而且在3915一线。后面做出来一个。然后3998向下开始走新的向下的日线级别的线段。这两个格局的选择在未来可能三四个交易日之内要分出来一个大概。如果是破了3850，那么它一笔下一笔反弹再一笔下，现段就会出来了。","video_key":"20260914_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_78dc6e40eb","blogger":"陈飞缠论","match":"exact","cls":"T","claim":"明天上的指数探体回升，略微放量的小阳线反包昨天的阴线。对于明天的行情，因为有凌晨的利率决议，不是很好分析。这个地方只对明天两种可能比较大的利好或者利空倾向性来做一个结构上的分解。如果明天是一个比较大的利空，依托今天这个破位之后的15分钟左右的盘整配持，拉起来的这一段刚好就会形成。139之后的第二个五分钟的中枢，这样的话它往下跌就是趋势C段破位了，就找趋势C段内部的背驰点，这样后面再拉起来，这是一种利空的走势。如果是利好的消息，外围如果也涨，那么明天就希望高开，高开的位置和高和低，3915或者3930这些都有可能，10天均线和60天均线上方都是压制。","video_key":"20260916_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_bedb8f7abe","blogger":"陈飞缠论","match":"exact","cls":"T","claim":"看了昨天的短视频，相信大家对于今天科技和制造的这种大涨应该会有一个更深入的理解。因为这个地方其实就是市场在大跌之后，大盘先见底，主跌板块，后见底，跟上一轮3741如图一辙。3741见底之后，科技后面跌了7个跤一日。见底、反转，才有了后面的一波向上的日线的线段反弹。3574见底之后，科技又跌了几天，到昨天刚刚好。但是3574没有被跌破，所以今天科技和制造就有了一种预期。","video_key":"20261104_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_06411395a1","blogger":"国金量化说","match":"exact","cls":"M","claim":"北交所给了个人玩家一个新的窗口，但窗外的路一个没走稳，也会掉下去。想要学习量化，后台找我领取QMT入门操作手册。","video_key":"20260824_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_8788a10b38","blogger":"国金量化说","match":"exact","cls":"U","claim":"那我肯定要看啊，我现在就是八戒不道高质量的量化英语，就是怕听不懂。你别看那个因子公式那么长，但它其实一点都不难。我把每一个因子的结构拆开给你讲一遍逻辑，再把它的应用场景和行情给你举个例子，你一下就明白。那太好了，赶快跟吧。能行，一个月给你讲的透透的。你知道我哪个号吧，关注了?哎呀，没有，没关系，我现在关注上。你小子一直白嫖我，来你过来。","video_key":"20261015_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_8336481a28","blogger":"国金量化说","match":"exact","cls":"T","claim":"结构简单的因子就一定没有吗?当然不是。今天要讲的因子就非常的简单，但很值得我们学习。因为他把因子挖掘当中最常用的截面排序和时序相关用最简单的步骤串起来了。看懂它，你就拿到了一个通用的因子模板。先排序，再看历史关系，最后反向取信号。后面很多的量价背离因子都是这个套路。不信你可以看我的完整101因子资料包对比一下。废话不多说，我们直接开始。这个就是我们今天的完整的因子。它找的是过去十天内开盘价和成交量对不上号的公司。也就是开盘价排得很高却没人买。开盘价排得很低但有很多人抢的公司。这个系列确实有点门槛。大家有遇到不懂的地方可以在评论区留言，我看到就会回复。第一步。","video_key":"20261020_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_6857cf43e1","blogger":"解套老猫","match":"exact","cls":"U","claim":"短线交易要的是确定性而底量过顶突破，解决了这个问题。资金在低位突破临界点，直接过滤90%的坑。突破顶量就加自选，突破临界点就干大道之简。","video_key":"20261005_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_1be95103ae","blogger":"解套老猫","match":"exact","cls":"U","claim":"别再追高被套了。做短线教你一招，放量过箱体交易法。股价长期震荡，经历第一次分期转移至加速，一旦放量冲破箱体顶部还能扛住二次分期，就加自选。注意，是量价都要超过箱体顶部且扛住二次分期，就有概率吃主声浪。关注我，持续分享实战干货。","video_key":"20261021_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_af477ede8a","blogger":"解套老猫","match":"exact","cls":"U","claim":"这就是今天的W底也叫双重底案例拆解，价格先后两次下探。第二个低点，通常不再创出新低，表明下方支撑有效，后面有效突破颈线，才算形态成立。之后就要画出上方压力位，方便我们做应对。关注我，持续分享，实战干货。","video_key":"20261104_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_9cbeb8f2d2","blogger":"雨林土申","match":"exact","cls":"U","claim":"派夫是供应战胜需求的阶段。专业投资者利用利好消息将股票卖给害怕错过机会的公众。超高的整要量和宽幅震荡后，上升趋势终结，反转下跌。","video_key":"20261018_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_4d92ea4042","blogger":"雨林土申","match":"exact","cls":"U","claim":"Law of Supply and Demand供应需求原则当需求大于供应时，价格上涨。当供应大于需求时，价格下跌。","video_key":"20261020_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_a79723f3f1","blogger":"雨林土申","match":"exact","cls":"U","claim":"市场不是简单线性系统，微小变化也可能引发巨大波动。不同周期，常常重复相似的高低点结构，这就是分形带来的自相似秩序。混乱中并非没有秩序，市场会在混沌震荡和有序趋势之间切换。交易不是强行预测顶底，而是识别当下状态并顺势跟随。先理解市场的真实结构，再建立自己的交易心智。","video_key":"20261105_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7640ce25bc","blogger":"趋势远瞻","match":"exact","cls":"U","claim":"再看这一例，虽然第二次过200时是阴险，但已难掩饰强势的特征。您看清了吗?","video_key":"20260619_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e742a7b342","blogger":"趋势远瞻","match":"exact","cls":"T","claim":"直接就买进，最后你发现买了就被逃，是不是很熟悉的动作呢?为什么又跌了?其实抄底很容易，来看，首先在下跌的过程中，找到一根倍量阴线以它的前一个量能化线，随后股价震荡上涨，并且在这一天你会发现成交量直接缩小到了水平线的向下。因此告诉你，这就开始抄底了，赶紧跟进，随后股价开始了一波上涨，但是没多久又掉下来了。此时也不用太担心。买入当天的最低点画一条线，不跌破可以继续持有。而且这一次不但没跌破，反而在底部收出了这么长的下影线。明显是二次探底，还可以做一个加仓的动作。你发现买完之后呢，直接抓到了后期连续的大展。想学习更多内容，可以点击橱窗观看书籍。","video_key":"20260622_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_0b6e4b665f","blogger":"趋势远瞻","match":"exact","cls":"T","claim":"从3万做到30万需要多长时间呢?今天就给大家分享一个每周获利10%的短线交易方法。只用了13个月的时间，将本金从3万做到了30万。方法既简单又实用。学会此方法，轻松赚到钱。方法一共有4个要点。一、5日均线经插10日均线，且两条均线要成多头排列。二、至少要出现连续5天的阳线。三、股价缩量调整，2-3天调整到5日均线和10日均线之间。这个时候要注意了。股价不要跌破10日均线。4.股价放量突破5日均线后即可买入。看个实际案例。这只股票经过一段时间的下跌之后开始反弹。此时均线处于空头排列。行情还没有启动。紧接着出现了连续5天的阳线。随后均线出现了金叉开始向上。股价缩量回调至两条均线之间。","video_key":"20260627_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5f134a72a4","blogger":"明玉的财富笔记","match":"exact","cls":"T","claim":"股市讲解，小盘股是指流通盘较小，市值较低的股票。就像王宇燕一直待在曼陀山庄，自身没有武功护体，情绪容易大起大落。而且他的走势完全受表哥慕容复稍微一点风吹草动，小盘股就容易上演大起大落。机油股，对应角色，去有风的地方，许红豆。角色特质，前五星级酒店大堂经理，业务能力强，履历光鲜，生活扎实。股市讲解，机油股就是公司业绩优良，净利润高的股票。相比白马股看重综合口碑，机油股更看重实打实的赚钱能力。就像许红豆，专业度极高，去大理开民宿也能把账算得明明白白，净资产收益率常年保持在高位。次星股，对应角色，金粉饰加骄傲任性，情绪极其不稳定，极易冲动行事。","video_key":"20260912_0005"},{"unit_id":"learn_视频号学习_全部文案_20261108_be75de4d62","blogger":"明玉的财富笔记","match":"exact","cls":"T","claim":"2.5到5，明显放量。如果股价突破了关键的支撑位或阻力位，那突破成功的概率比较高。5到10，剧烈放量。如果股票在长期低位出现这种剧烈放量突破，那后续上涨空间可能很大。但如果股票已经涨了很多。突然放这么大的量，你就要高度警惕了。超过10，这就属于极端放量了，要特别小心。如果是在连续上涨之后出现这种情况，股价却涨不动了，那就是典型的滞涨，很可能是见顶的信号。反过来，如果是在连续下跌之后突然出现巨量，那反而可能是建仓的好时机。记住，量比的核心，量比越大，说明今天成交量异常放大。要结合股价位置，判断是机会还是风险。第四个指标，大家肯定都听过，市盈率，也就是PE。","video_key":"20260914_0005"},{"unit_id":"learn_视频号学习_全部文案_20261108_c5dc90df4e","blogger":"明玉的财富笔记","match":"exact","cls":"T","claim":"集中代表芯片、半导体、高端装备、深屋医药等硬科技方向。相比科上宗旨，它更像是科上版里的尖子生。北站50，专精特新的试验田。从北交所中选出最具代表性的50家公司。里面有不少小而美的专精特新企业。如果你想观察中小企业、专精特新和北交所行情，重点看它。我是明玉，专注于分享通俗易懂的财经干货。关注我，让我们一起学习，共同成长。","video_key":"20260923_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_46e7c74344","blogger":"明玉的财富笔记","match":"exact","cls":"M","claim":"这就是很多散户真实的交易状态。所以散户最大的弱点并不是资金少，而是很容易在贪婪和恐惧之间反复横跳。当然，这并不意味着散户一定亏钱，只是相比专业资金，普通投资者在资金、信息、研究能力和交易几率上确实存在天然差异。第二类，机构资金。机构包括公募基金、私募基金、保险资金、社保基金等。和普通散户相比，它们最大的特点就是钱多、研究人员多、信息处理能力强，而且通常不会因为一天两天的涨跌就改变投资逻辑。比如一家企业今年赚多少钱，未来几年还能不能增长，行业空间有多大，公司的竞争优势是什么，这些可能都是机构研究的东西。所以你会发现一些基本面比较稳定的大盘蓝筹股走势往往没有那么刺激。","video_key":"20260924_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a8a7947e88","blogger":"明玉的财富笔记","match":"exact","cls":"U","claim":"这就引出了我们的第三张表，现金流量表。拿相亲来类比，如果说利润表是他的收支账单，那现金流量表就是施大师的银行流水。现金流量表的记法叫收付实现值，它唯一的标准就是看有钱没钱，钱进来记一笔，钱出去记一笔。有点像我们说的流水账，你看，这就是一张典型的现金流量表。关于现金流量表，我们只需要认识三部分，分别是经营活动现金流。投资活动现金流和投资活动现金流。还是继续用相亲类比。和本职工作相关的现金流，比如每个月到账的工资和每天上下班通勤花的钱，就叫经营活动现金流。和投资相关的现金流，比如理财到期赎回收到的钱和买股票花的钱，就叫投资活动现金流。","video_key":"20261030_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_4fad4956d1","blogger":"爱死磕-康康","match":"exact","cls":"U","claim":"反弹结束之后，再度开启下跌，最终回调至0.618和0.764这个高短区间。0.618和0.764这个区间呢。是价格的高转区。在这个区间内呢，价格支撑和压力的转换力度都比较强。行情在这里出现转折反转的概率会相对较高一点。一旦价格进入这个高转区间，很容易在这里扭转整体的走势。操作上面我们要谨遵一点。最后我们简单进行知识点梳理总结。首先，黄金分割的0.382是强弱的转换位，0.618和0.764是价格的高转区。在这个区间内，价格受到支撑和压力的转换力度都比较强。行情在这里发生反转的概率会非常高。第二就是，黄金分割的主要作用是在上涨趋势中寻找回调时候的潜在支撑位，在下跌趋势中寻找反弹时候的潜在阻力位。","video_key":"20260910_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5d8e93c157","blogger":"爱死磕-康康","match":"exact","cls":"M","claim":"95.15通过计算我找到92.97就在这儿我知道这个位置就是我去等待未来建立多单级位因为说老师我没有这种怎么办呢?刚才我们讲了吧你要等破掉这个低点高点就是破掉这个高点之后一单止跌那么你去在这位置去考虑。如果我有了，那我知道这个位置是一个重要的位置。这是我们看到的，这种位置它带来一种模型的上涨。","video_key":"20260918_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_2090185192","blogger":"爱死磕-康康","match":"exact","cls":"M","claim":"我们打开计算器19085到高点20684我们通过计算是在19868我们通过计算我们会发现行情在19868这个位置是什么样的一个表现正好行情达到了这个点位然后起涨回落还是在这个点位起涨这是不是横指说带来的呀那么同样你就去看你看在这个点我们通过行情的一个划线正好这位置又有一个是不同的区点我们来大家一块看一下。","video_key":"20261009_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_44ee89b9e4","blogger":"爱死磕-康康","match":"exact","cls":"M","claim":"如果你是做短线的，你以哪一个周期为进场短线点，就以哪一个周期做止损。因为波段和短线是不一样的，这是大周期。那么小周期看谁呢?小周期干什么事?很简单。我们刚才是不是把大周期分成到主力和正发展两种情况?那么在这两种情况里面，如果是到主力位了，在小周期里面就看，看什么呢?一，首次智商止跌是否有机会?第二，是否有二次确认机会?什么叫做首次智商止跌呢?价格、大周期这是支撑位。小周期它走在这个位置，首次智障止跌能不能进?如果不进，反弹以后，看它有没有二次确认机会。因为这就是涉及到具体的技术标准了。就我用什么样的技术把握首次智障止跌，我用什么样的技术把握二次确认，这是到阻力位。","video_key":"20261019_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_6a32d3aef3","blogger":"爱死磕-康康","match":"exact","cls":"M","claim":"那么如果说大周期是正在发展的，小周期顺势为主，逆向不做。什么样的顺势为主呢?就是刚才所说的，它正在往上。在小周期里面向下调整低多，突破低多，就是关注这种顺势机会就行。那么在这个过程中，有朋友刚才提到了，一，趋势走出来以后再进晚不晚?不晚。因为如果做短线，下跌反弹下跌反弹下跌，目前是不是下降?我从短线角度来讲，我是不是跟的是?主跟方向。但如果我要做波段，那么问题来了。从波段角度来讲，它在这个位置的第一波反弹，我们说是在日线吧，它的第一波正是一个反弹的反转。从我们所讲到的顶底转换角度来讲，除非这个位置有消息刺激，直接来微信反转。在没有消息刺激的情况下。这种位置发生V型反转的概率是不是比较低?","video_key":"20261019_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_d74751d8f4","blogger":"爱死磕-康康","match":"exact","cls":"M","claim":"那我发现这个位置是不是一倍的一个位置?打到一倍，形成趋势结构。方向点就确定了，未来这个点是很难去破位的。当它顶分形的确定。当顶分形确定之后，那么我们就可以做黄金分割。但是这个位置我们放大图形，有顶分形吗?没有顶分形。没有顶分形打一倍就预计市场有加速向上的嫌疑。就是因为它不在一倍的位置上，在顶分形的位置上。如果打一倍，它迟迟不能出现顶分形结构，就说明市场没有滞胀，有加速向上的嫌疑。当它出现顶分形，要出现回调的时候，这个时候一倍也到了，怎么办?那我是不是就可以在这个位置通过分隔线，在它最高这个位置，划到方向点C点的位置呢?进场点是不是有了?0.38、0.68、0.764的位置。","video_key":"20261021_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_68d6ecea43","blogger":"爱死磕-康康","match":"exact","cls":"M","claim":"但是如果说我想要这个左翼的成功率更高一些，那刚好在下跌的过程中遇到主力，而这个主力的位置又出现了，底分形突破了左翼，那么这个时候的进场是不是更好啊?你说这个位置下跌，它没有阻力，就是单一的出现了一个左翼突破了。可不可以见?也可以见。但是我们是不是要去思考这个左翼啊?那如果说这是下跌趋势啊，这个左翼刚出现就涨了一天，再回来破出新低怎么办呢?那如何去提高这个左翼或者进场点的?安全性的。是不是，诶，它刚好是在阻力的一个位置上。那么它的反弹的力度可能反弹的空间或者时间是不是就有可能会强一些啊。我们不说它一定百分之百会涨或者涨多少，至少它能够配合着组一能够提高它百分之二十的成功率是不是也可以啊?","video_key":"20261023_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_1312c2c6a7","blogger":"爱死磕-康康","match":"exact","cls":"M","claim":"也可以是我在使用均线过程中的一条长期均线，比如60日均线，属于什么?生命线。长期的均线。价格刚好打到了60日均线的一个位置出现了底分形突破了左翼。那么它未来反弹的概率是不是就更高了?为什么?因为60日是均。是生命线。因为前期低点重要的一个支撑造成了价格在这个位置可能连续的推动价格止跌、收扬、向上反弹。这就是阻力所带来的一个问题。同时也是阻力为进场所起到的作用。因为我们说主力有很多，比方刚才所讲到的均线，短期的我们说的10日均线，对吧，中期的20日30日，长期的60日或者说半年线120都可以。根据你的周期，你所目前参与的是短线的还是中长期的。我给大家带来的是什么?带来的是指标黄金分割。","video_key":"20261023_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a39ff8c79d","blogger":"依依学金融","match":"exact","cls":"T","claim":"没人愿意追高，很容易假突破，冲高就回落。最后给你一条黄金法则。任何的价格突破都必须要有量的确认。光涨不放量，多半是骗炮。我总结一下，成交量是真实换手，骗不了人。看高低不看颜色，位置决定好坏。低位放量是机会，高位放量是风险。健康行情是上涨有量，下跌缩量。突破的话一定要有量确认。总结得非常到位。最后提醒一句，没有百分百的铁律，技术面只是帮你提高胜率。今天作业很简单，打开任意一只股票，只看最下面这排柱子，分辨哪几天是放量，哪几天是缩量，先把眼睛练出来。下期我们直接分享一个超好用的技术指标，收藏好别掉队。","video_key":"20260606_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_9be79da6c5","blogger":"依依学金融","match":"exact","cls":"T","claim":"剩下五十万的一半，未来是不是留给你的?那这就是你的遗产吗?你跟父母说，我不要多的，先拿一万块钱给我。就要一万?在父母的账户上开户，你来操作。父母看得见，你赚了钱，父母知道你有这个能耐，明年就会给你两万，而且去年赚的那个钱就是你的安全垫。安全垫什么意思?比如一万块钱赚了10%，多了一千块。明年本金变2万了，那你可以承受亏5%，亏掉的1000就是你去年赚的，没伤到父母一分钱本金。如果亏没了，不做了，钱还给父母，没有任何损失。那如果又赚了呢?每年赚的钱一半给父母，一半留下来，当你未来投资的本金。这不就滚着走了吗?这真的有人做过吗?我有个学生21岁，自己2万块钱赚了1万5。","video_key":"20260709_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_960612cade","blogger":"依依学金融","match":"exact","cls":"T","claim":"2万赚1万5，那就是75%啊。家族一看，这小孩行，给了他500万。我那天一看，账上已经赚了62万了。他就是这样一步一步走来的。从2万到500万，就是先把本事练出来。对，别说没有本金，本事从哪来?从你那500块钱开始。我捋一下，光靠上班只能解决温饱，哪怕月光也要强制拿10%出来。因为您练的是收益率，不是金额。小钱练出本事，用安全垫一步步放大，雪球就是这么滚起来的。收益率是你的本事，验出来了，一辈子都是你的。下期教你武具开盘闭坑口诀。收藏好，别掉队。","video_key":"20260709_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_4944fc6991","blogger":"依依学金融","match":"exact","cls":"T","claim":"如果一只票涨了一段，突然出现长上引线，后面又不能放量突破这个高点。十有八九要往下调整，见到一定要小心。那长下引线呢?正好反过来，空头往下砸，结果又被多头拉回来，说明下面有人接，这个位置支撑比较强。长上引看压，长下引看支撑。最后一组是多空暂时打平。小阳线、小阴线和十字星。小阳、小阴就是涨跌都很少。对，涨跌一般都在一个点以内，实体很短。说明多头或者空头只有一点点优势，大部分资金还在观望。十字星呢?十字星的实体更小，上下都有影线，说明双方打了半天最后谁也没赢。但它最重要的一点是……原来的趋势可能要变了。比如前一天刚涨停，多头特别强，第二天突然收出十字星，说明多头的优势没了。","video_key":"20260806_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a373af7ea7","blogger":"cash猫4415","match":"exact","cls":"T","claim":"本期我们的关键词是，把交易当副业，控制欲望，有理想，但要拒绝幻想。下一期我们分享的主题是交易中我们应该选择什么样的赛道。","video_key":"20260829_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_78af1966fe","blogger":"cash猫4415","match":"exact","cls":"M","claim":"顶底分形再按照相应规则连接成笔。多笔之间相互组合，进一步形成中枢以及更完整的走势结构。所以，分形、笔、线段、中枢和走势类型并不是彼此孤立的名词，而是一套逐级生长的结构。理解线段，关键不是背诵线段的每一个细节，而是理解禅论的生长性和地规性。低级别的笔不断生长，可以构成线段和中枢。这些低级别结构经过地规又可以对应为高级别的义笔和高级别的中枢。因此，同一段走势，站在一分钟级别可以讨论线段和中枢，切换到五分钟级别也可以用笔和中枢来表达。观察角度不同。但描述的仍然是同一段市场结构。为什么很多人认为学习禅论必须重点研究线段?因为笔本身具有多样性和复杂性，后期还会涉及中枢延伸、扩张和扩展等问题。","video_key":"20260921_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_be5e80ea9d","blogger":"cash猫4415","match":"exact","cls":"T","claim":"一方面，这个候选低点存在进一步发展为日线低点的可能，另一方面，是否参与取决于交易级别。以30分钟为交易级别，就要按这一层级的回调与反弹安排，而不是只等日线完全确认。大级别下跌中的小级别反弹，意义还在于减少错误，在低位按结构观察，反弹后就更容易保持纪律，避免被盘面带着情绪追高。但这不是每一个低点都必须买，也不意味着日线已经反转，下跌找买点，上涨找卖点，每一次参与都要同时考虑后续的退出条件。这套日线一笔战法，核心策略是，日线上涨趋势，在30分钟级别做高抛低吸，日线下跌趋势，在30分钟级别做低吸高抛。","video_key":"20261009_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_83da68d4b1","blogger":"cash猫4415","match":"exact","cls":"T","claim":"只要后续回落不破3619，明天就仍有再次冲高的可能。再根据冲高力度，判断这笔30分钟上涨是否结束。明天第一个压力仍是3660，有效突破并站稳之后再看3708。具体到5分钟，早盘先看3619能否守住。如果直接跌破，就要警惕30分钟反弹结束。如果直接向上，则重点观察这笔5分钟上涨的力度。出现上涨乏力或背离时，要关注30分钟反弹的结束信号，不能只看价格冲高就认定反弹还会延续。这套日线一笔战法，核心策略是，日线上涨趋势，在30分钟级别做高抛低吸，日线下跌趋势，在30分钟级别做低吸高抛。","video_key":"20261102_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b523fa3e41","blogger":"黑豆讲财经","match":"exact","cls":"M","claim":"每一笔股票成交，明明都有一个人买，也有一个人卖，那为什么行情软件里还要分主买和主卖?接下来用几分钟，咱们把这里面的主动到底是什么意思捋清楚。上一条我们讲过，股票交易不是你点一下买入，系统就从仓库里给你发股票。市场里一直有人报价买，也有人报价卖，交易系统在按照规则把能够匹配的双方撮合起来。可当你继续看行情软件，很快就会遇到两个词，主买、主卖。看到这里，很多人第一反应可能是，主买是不是说明这一笔买的人比较多?主卖是不是说明这一笔卖的人比较多?可仔细一想，马上就不对了。假设成交了100股，那一定有人买到了100股，也一定有人卖出了100股，否则这100股不可能凭空出现。","video_key":"20260928_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_6fa0a3d97e","blogger":"黑豆讲财经","match":"exact","cls":"T","claim":"也可能有人卖，只要能够按照规则匹配，新的成交就会继续出现。所以你可能看到，股价已经停在收盘价，但成交量和成交金额还在继续增加。这两件事并不矛盾。而且，盘后固定价格交易产生的成交量和成交金额，交易结束后还会计入这只证券当天的总成交量和总成交金额。现在再回到开头的问题，下午三点都收盘了，为什么股票还能继续成交?因为下午三点结束的是正常竞价，而下午3点05到3点半还有盘后固定价格交易，这段时间里不再重新争价格，而是按照当天的收盘价继续撮合。简单记住，价格固定，时间排队。这回心里有数了。不过讲到这里，我们不妨顺手把A股一天的交易顺序一起捋一遍。","video_key":"20260929_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e0a952a2eb","blogger":"黑豆讲财经","match":"exact","cls":"T","claim":"但这里真正要问的是，为什么你偏偏在8块的时候最想卖?因为从十块跌到八块的过程里，不只是你一个人在难受，市场里可能有很多持有人都在经历类似变化。一开始，再等等，继续跌，应该会回来吧。再跌，是不是出问题了?等跌到某个阶段，越来越多人从还能拿变成算了，我卖，于是卖盘会集中释放。可卖家不是无限的，这点特别重要。假设原来有一百个人想卖，前面一批人卖了，继续跌，又一批人扛不住也卖了。再往后，那些最着急、最想离场的人也陆续把股票卖出去。这时候会发生什么?最急着卖的那批人会越来越少。如果这些卖盘逐渐被市场接走，而新的卖盘没之前那么强，哪怕买盘只是稍微增加一点，价格也可能出现反弹。","video_key":"20261002_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_4f5bc1e553","blogger":"黑豆讲财经","match":"exact","cls":"T","claim":"听起来像句废话，但涨停、跌停最让人难受的地方恰恰就在这儿。假设一只股票已经涨停，你特别想买，于是直接把价格挂到涨停价。你可能会想，我都出到今天最高价了，总该买得到吧?还真不一定，因为这时候可能不是你一个人这么想。前面已经排了一长串，我要买，我也要，我也是涨停价。可另一边呢，愿意卖出来的股票就那么多。这就像一场特别火的演唱会，最后只剩100张票，外面排着1000个人。你跑过去说，原价我接受，赶紧给我一张。工作人员告诉你，不是钱的问题，前面还有人呢。股票也一样，大家挂的都是同一个涨停价，通常先排进去的订单先等成交。所以涨停买不到，很多时候不是你价格出的不够高。","video_key":"20261005_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7a5895af9b","blogger":"黑豆讲财经","match":"exact","cls":"U","claim":"股票跌50%，为什么要涨100%才能回本?先问一个很多人都会碰到的问题，假设你10块钱买了一只股票，后来跌到5块，你一直没卖，再后来它又涨回了10块，这时候你是不是就没亏了?对，如果先不考虑券商手续费、过户费、印花税，还有分红送转，只看股价本身，10块买，最后又回到10块，就重新回到了原来的买入价。可奇怪的地方来了，10块跌到5块，明明是跌50%，为什么5块再回到10块，不是涨50%，而是要涨100%?同样都差5块钱，怎么一个50%，一个100%?别急，咱们捋一捋。其实问题就出在一个地方，两次算百分比，用的起点不一样。先看10块跌到5块，一共少了5块。这5块占原来的10块多少?","video_key":"20261009_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b526168c4d","blogger":"黑豆讲财经","match":"exact","cls":"T","claim":"成交量说白了，就是今天总共成交了多少股票。而成交额不一样，成交额看的是这些股票合起来成交了多少钱。一个数股数，一个算金额。但这里有个问题，2000万股算成交多还是少，光看这个数字其实不好判断。假设这只股票过去五个交易日平均每天只成交1000万股，今天却成交2000万股，比平时多了一倍。这时候有人说，今天明显放量了，就有依据了。所以，成交量不是数字越大就一定代表今天越活跃，还得看看它平时成交多少。不过别误会，成交量变大，只是完成的买卖变多了，并不代表股价就一定会涨。接下来，为什么刚才那只股票的换手率又有20%?","video_key":"20261010_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_edfc0777e8","blogger":"黑豆讲财经","match":"exact","cls":"T","claim":"好了，现在咱们回到最开始的问题。股市里的国家队到底是谁?它不是一个统一的神秘账户，而是部分具有特定国有背景承担重要职责的投资机构，有的长期管理重要金融企业股权。有的提供证券金融服务和资金支持，还有的通过股票、ETF等方式参与资本市场投资。从长期金融资本管理到关键时期的市场稳定行动，国家队的重要实力不仅体现在雄厚的资本基础，更体现在不同机构的专业分工、资金支持和协同能力。这回心里有数了。不过，刚才咱们反复提到一个词，ETF。老王听着听着突然冒出一个问题。黑豆，中央汇金增持的ETF究竟是什么?买ETF跟买股票到底有什么不一样?下一条，黑豆接着捋。","video_key":"20261017_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b5754755c6","blogger":"阿堂财经说","match":"exact","cls":"T","claim":"破局关键在于永远别单独使用MACD。必须结合股价整体趋势，关键支撑压力位，以及K线形态进行综合判断。当MACD信号与价格本身的强势特征矛盾时，优先相信价格本身，不理解这些市场动态与指标的局限，才是导致技术指标越用越亏的根源。好了，今天的MACD核心用法就总结到这儿。记住这个实用口诀，零轴分多空，金叉看量能，背离式警报，转向在行动。如果想彻底弄懂MACD从精准入场到完美离场，规避掉所有常见陷阱，欢迎点个关注。下期视频，我将带你走完MACD实战应用的全流程。","video_key":"20251107_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a38d8a65f5","blogger":"阿堂财经说","match":"exact","cls":"M","claim":"所谓共振早已失效。进取就是接盘侠。记牢这口诀，融入你的交易本能。KDJ找点MACD看试。零上做多，零下休息。共振出手，股独放弃。上面的坑你踩过几个，是KDJ的假动作骗了你，还是MACD的慢半拍让你踏空?评论区说出你的故事，我为你一对一整股。关注我，我们下期见。","video_key":"20251112_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_685939533c","blogger":"阿堂财经说","match":"exact","cls":"T","claim":"突破后行情往往延续原趋势。且幅度至少等于旗杆高度。记住，K线是市场心理的痕迹，不是百分百的预言。运用时务必第一看位置，绝对不要在上涨半山腰把上吊线当垂头线看。形态的意义永远由它在趋势中的位置决定。第二看量能，成交量是信号的验钞机，尤其是看涨和突破信号。没有放量配合就要打一个大问号。第三看共振，不要单凭一个信号孤注一掷。寻找多个技术工具，发出同一方向信号。这才是高胜率的输手时机。","video_key":"20260117_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_ca07c06d82","blogger":"阿堂财经说","match":"exact","cls":"T","claim":"深V反弹的痕迹，意味着卖方一度大肆打压，但被顽强的买盘托起，下方支撑强紧。三经典情绪瞬间，光头光脚长阳线，开盘级最低，收盘级最高，完美的单边上涨，市场极度乐观。带长上影的阳线，试图上涨，但被狠狠拍回，力不从心，乐观中带有强力的警惕。带长下影的阴线，试图下跌，但被强势买回，有惊无险，恐慌中暗藏转机。十字星，开盘收盘铜价。多空完全平衡。市场在深呼吸。下一个方向选择即将到来。核心要决。逐声看方向确信。引线看博弈过程。重要提醒。单根K线如同一个人的一句话。信息量有限。它必须被放在整体趋势。是牛市还是熊市和关键位置。是否涨到前高或跌到前低。终去看才能体现真正的意义。孤立解读。记忆犯错。下级预告。","video_key":"20260408_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_09ab30c20d","blogger":"我是千千千","match":"exact","cls":"U","claim":"看个弱智视频或者兄弟秀离谱操作，以扣的问号能直接弹在他电脑屏幕上。这是一个把英雄联盟信号轮盘搬到整个桌面的开源项目。上线10天安装包就被下载了2万多次。最绝的是他带联机房间，发个房间马拉兄弟进来，你再拿扣问号，他屏幕从一个位置立马弹出来，还带你ID，连音效都是原版。不会装的话，直接把项目名丢给豆包电脑版，他自己就帮你下载装好。按住LTE托，任何软件和桌面都能随便扣，平时还能换成表情轮Windows和Mac全都能装。赶紧转给天天跟你开黑的兄弟。","video_key":"20261013_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_32be1e2430","blogger":"我是千千千","match":"exact","cls":"U","claim":"二次元追翻的新王，今天算是彻底登基了。隆重介绍动漫界的全能放映室，Kazumi。短短时间就在GitHub斩获了3.6万颗星。它本身连一秒视频都不存，却能一键打通全网片源，搜翻名瞬间列出十几个播放源，点开秒播，弹幕刷屏，吐槽一个不少。更绝的是，自带实时超分辨率，成年老翻呼声马赛克也能一键变清晰，还能拉上一笛搭子，同步一起看。不想折腾GitHub的，直接把这段指令丢给豆包电脑版。选工作任务、本地电脑、点发送。它自己就帮你下载装好。打开一键导入片源，搜翻名就能看。这体验根本回不去了。","video_key":"20261014_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_93ac074609","blogger":"我是千千千","match":"exact","cls":"U","claim":"上下这两支动效片，你猜哪边是Opus 5.5做的，哪边是不到3块钱的DeepSeek做的?几乎分不出来吧?这是GitHub十万颗星的开源项目OpenDesign,10月刚出的Motion功能，CloudMotion的开源替代。它为什么能做出这种动效?其实是内置了一套动效技能和模板，模型照着它写网页动画代码，边做边自己截图检查，不满意就改，最后用浏览器一帧一帧渲染成高清MP4。连官方发布片都是团队用DeepSeek做的。你自己照着做也特别简单。执行方式选本地AI，模型选DeepSeek，点开Motion，用一句话说你要什么，或者直接选个内置模板就行。几块钱就能做出一只质感拉满的动效片。","video_key":"20261022_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_cf47f005d4","blogger":"指标公式入门","match":"exact","cls":"U","claim":"均线是使用最广泛的指标。很多人喜欢用均线粘合。作为信号，那均线粘合是什么?简单来说就是，不同周期均线非常接近。成本集中，属于形态信号。那均线粘合指标怎么编呢?","video_key":"20260912_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_fa19e2db63","blogger":"指标公式入门","match":"exact","cls":"U","claim":"均线图形结构中时常能看到小周期均线快速下穿，更大周期均线，然后在短时间内，小周期均线又快速上穿。较大周期均线的黄金坑图形结构如何用公式编写出来?以5、10、20日均线为例来编辑。","video_key":"20261006_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_75159f6431","blogger":"指标公式入门","match":"exact","cls":"U","claim":"我们常说的银山鼓是由三条均线组成的特殊结构。BMA10、MA20和MA30为例。三条线先后向上交叉，形成一个闭环三角形的结构，称为银山鼓。如何用代码表示并标记出来?","video_key":"20261024_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_33b6eec5e9","blogger":"刺猬投研","match":"exact","cls":"T","claim":"这也解释了为什么近期政策面和国内产业资本都在疯狂死磕国产存储的突围。因为这早已超出了单一商业公司的范畴，它是真正的大国博弈筹码。基本面的数据是不会撒谎的。只要大模型的参数量还在指数级膨胀，内存墙的焦虑就一直存在。铁三角的供需格局就会持续紧张，暴利期也远未结束。如果这篇内容帮大家把存储芯片的这桩恩怨情�你们的每一次支持都是我熬夜掉头发码子的动力。咱们下期见。","video_key":"20260702_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_bca0d5dda3","blogger":"刺猬投研","match":"exact","cls":"U","claim":"如果有一天华尔街的量化巨头们集体亏了成百上千亿，却没有任何一个顶尖的数学家能解释这钱到底是怎么亏掉的，这个世界会变成什么样?这不是危言耸听的科幻场景，而是当下全球量化投资行业的真实困境。如今量化行业正迎来颠覆性变革，传统多因子模型加速退场，端到端深度学习成为行业主流，彻底重构了华尔街的竞争格局，也为国内头部量化机构提供了弯道超车的机遇。但基于背后危机并存，深度学习普及后，超额收益持续萎缩，行业内卷加剧、模型黑箱化带来的系统性风险，已然成为行业最大隐患。目前华尔街量化AI早已度过测试摸索阶段，深度学习成为头部机构的底层标配，整体呈现两大特征，全行业普及端到端深度学习。","video_key":"20260708_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_378163bffa","blogger":"刺猬投研","match":"exact","cls":"U","claim":"报告末尾还列出未来要跟踪的指标和验证条件，挥挡进你的研究体系。下次再研究这家公司，从上次的判断接着往下走。财报还是那份财报，只是这一次你真的读懂了。","video_key":"20260915_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_2f75cb7d93","blogger":"只看金老大","match":"exact","cls":"T","claim":"中芯负责高度，郑和负责跟随。中市负责下午情绪点火，永信、博会这些20厘米负责弹性。这就不是一个票在表演，这是板块在开始搭台子。但别急，AI硬件第一个不服，超声高开涨停，中华继续趋势斗强。满坑科祥这些20厘米接连充板PCB、MLCC全面汇流。很多人看到这里马上喊科技回归。听着很软，但这里藏着一个坑。硬件今天强，但强得太一致。一致意味着什么?有先手的人舒服，没先手的人尴尬。明天如果继续缩量，先手资金会先兑现，后手资金又不敢追。那板块最怕的不是不强，而是强完没人接。周五领涨的中继长飞开盘就被兑现，这已经给过警报。所以硬件可以继续汉墙，但想直接接管9月难度很大。","video_key":"20260914_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_717b048454","blogger":"只看金老大","match":"exact","cls":"T","claim":"这里有个关键细节，润剑、南威、太极跟着涨停，不只是AI应用修复，它更像一套组合拳，AI应用托情绪，数据要素皆热度，算力皆弹性。如果你能看懂这个，明天就不会乱追。再看机器人，这个方向今天也不弱，大夜四板辨识度很高，泰尔、永达、九阳都在二板助攻。乍一看，机器人也能整主线，但坑就在这里，前排越强，后排越弱。资金不是扩散，而是在往少数高标身上挤。所以你才会看到弗莱奇金炸板，甚至中军三花也没有继续表态。更关键的是，机器人手板从昨天的12家缩到今天两家，这不是发酵，这是缩容聚焦，龙头还在吃溢价，后排已经开始消失。所以机器人明天真正要看的不是大业能不能继续强，而是板块能不能来一根大阳线，把后排重新带起来。","video_key":"20261021_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_2e8c57c8d1","blogger":"只看金老大","match":"exact","cls":"T","claim":"因为真正关键的不是指数跌了多少，而是恐慌里资金到底在护谁。如果11月行情真结束，3600点附近为什么还有神秘资金护盘?如果主力真想撤，尾盘为什么还偷偷抢筹?这说明抛压快砸干净了。明天最容易出现的不是继续恐慌，可能是探底回升。但反弹靠谁来带?答案不在最热的地方。先看李电池，他今天最像主线。紫竹三强二板，盛扬鲁扬掌停。国宣、宁德也主动表态，龙头有了，T队有了，中军也有了，看起来很完美，但越完美越危险。因为一个上午，资金就把李电池预期打满了。上午一致，下午就漏气。蒙古力为什么炸?不是锂电池不强，是强得太满。所以板块现在缺的不是热度，而是一个能稳住节奏的前排先锋。","video_key":"20261103_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_5fbebb3893","blogger":"北向宓妃","match":"exact","cls":"M","claim":"最低价是空方砸到过的最低点。把这四个价格画在一张图上，就成了一根K线。中间粗的部分叫实体。上下两条细线叫影线。收盘价高于开盘价是阳线，通常红色。收盘价低于开盘价是阴线，通常绿色。记住，K线记录的是过程，不只是结果。同样收盘涨5%，可以是开盘就涨一路走高，也可以是先跌后涨探底回升，还可以是冲高回落。只看收盘价，你只知道结果，看K线，你才知道过程。第二部分，看肌肉、实体和影线。实体，就是开盘价和收盘价之间的那段。实体越长，说明当天涨跌力度越大。大阳线，实体很长，买方强势。大阴线，实体很长，卖方强势。小阳线、小阴线，实体很短，多空力度都不强。十字线，实体几乎没有，开盘价和收盘价几乎一样，多空平衡。","video_key":"20260927_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_727eb307f8","blogger":"北向宓妃","match":"exact","cls":"T","claim":"你前脚刚卖，主力后脚就在底下用小单悄悄吃进去，随后股价一飞冲天，内盘在说谎，他说的卖也是假的。所以，光听辩论不行，你要看证据，一共三个证据。证据一，看位置，同样是外盘大，在低位可能是真吸筹，在高位可能是假又多，同样是内盘大，在低位可能是假砸盘，在高位可能是真出货，位置不对，一切白费。证据二，看量价。外盘大，内盘小，股价放量上涨，这是最健康的信号，说明资金真在进场。内盘大，外盘小，股价放量下跌，这是真跌，卖压沉重，别犹豫，赶紧走。外盘大，但股价跌，警惕，这是主力在制造买盘汹涌的假象，实际在出货。内盘大，但股价涨，关注，这是主力假打压，真吸筹，可能在洗盘。内外盘差不多，多空平衡，等方向明确再说。","video_key":"20261003_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_d49f00af78","blogger":"北向宓妃","match":"exact","cls":"T","claim":"公式是，RSV等于今天收盘价减过去9天最低价，除以过去9天最高价减过去9天最低价，乘100。举个例子，假设过去9天，这只股票最高价是20块，最低价是10块，今天收盘价是18块，那么RSV算出来就是80。意思是，今天的价格在这9天的价格区间里处于80%的位置，离顶部近，离底部远，说明最近买盘偏强，价格在区间里偏高。反过来，如果今天收盘价是12块，RSV计算出来就是20，说明价格在区间里偏低，卖盘偏强。所以RSV的范围是0到100。收在9天最高价，RSV就是100。收在9天最低价，RSV就是0。收在中间就是50。假如RSV是今天的原始分数，K是短期平均分，D是长期平均分，J是K和D差距的放大器。","video_key":"20261005_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_eaa54523e3","blogger":"北向宓妃","match":"exact","cls":"T","claim":"那建仓到底在干什么?说人话，在相对低位、隐蔽的、低成本的把流通筹码换到自己手里，形成一定的筹码集中和控盘能力。注意，换到自己手里这几个字。建仓不是单纯买入，是筹码转移。它可以通过箱体震荡膜，通过阴跌、极跌下，通过横盘消磨时间，让不坚定的人把筹码交出来。控盘度这件事，别被数字被傻了。粗略看，轻度控盘大概15%到25%，能影响股价，但主导不了大行情。中度25%到40%，能做波段、做趋势。高度40%到70%，容易走独立行情。70%以上叫绝对控盘。外部可交易筹码很少，涨跌全看主力。但这里有个坑，要按真实可交易的流通盘算，剔除大股东长期锁定、长期不动的躺平筹码。","video_key":"20261019_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7e4e51d663","blogger":"卯金刀89","match":"exact","cls":"U","claim":"别管你的行业好不好，在一个行业升更，轮也轮到你了。你只要坚持不下坡，早晚你有出头之日。","video_key":"20260812_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a6d1038361","blogger":"卯金刀89","match":"exact","cls":"U","claim":"你敢独自一人单枪匹马，挑战命运的时候，不管成功与否都已经很厉害，因为有些人连拿枪的勇气都没有。","video_key":"20260910_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_05c324eae0","blogger":"卯金刀89","match":"exact","cls":"U","claim":"我倒是相信那句话，市场永远是对的，错的只有自己。冲得太快还逃得太慢，肯定是要识别。头顶在肩膀上，脚掌在自己身上。只要保护好自己。","video_key":"20260927_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a52fbdd215","blogger":"A梦技术理论","match":"exact","cls":"T","claim":"试盘结束的表现是在调整一段时间后，放量突破试盘时的最高价位，也就是横盘整理的箱体上沿压力位，后市就会开启拉伸模式。5.高开阴线的试盘手法早盘高开三个点以上让大家感觉很强势。在分时图里就明显看出来股价高开以后快速下跌，股价立马翻绿，股价在低位震荡。高开阴线试盘时候成交量往往会放大，但是不会出现天亮。如果出现天亮就有可能主力在出货了。如果主力试盘的时候股价能快速反抽向上，超过了试盘K线的收盘价，说明主力试盘成功。好了，本期视频就分享到这里了，咱们下期再见。","video_key":"20261011_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_512f5bc583","blogger":"A梦技术理论","match":"exact","cls":"M","claim":"记住三个信号，一是五日均线下，拐头向下，二是K线跌在均线下方，三是出现实体的大阴线涨停，断板还没修复，看到这三条别犹豫，立刻空仓。守住本金比什么都重要，行情不好的时候很多人会心慌，但炒股拼的就是心态，不是技术。别人恐慌，我贪婪，这样才能不被市场牵着鼻子走。第三句。只做上升趋势的票，相信趋势的力量。一旦趋势形成就不会轻易改变，这就像推石头上山，顺势而为，省力又高效，逆势操作，累死还亏钱。具体怎么做?多关注热点板块里面的强势股，别在那些冷门股、弱势股里面浪费你的时间和资金。第四句。一直小涨会有大涨，连续大涨赶紧离场。当一只股票冷冷清清没人讨论的时候，往往可能是机会悄悄来临的时候。","video_key":"20261018_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_12acff57bd","blogger":"A梦技术理论","match":"exact","cls":"T","claim":"感觉连续决策失误时，先停手休息，把每次犯错的过程、后果、怎么纠错的、效果如何，全部记录下来。深度剖析根源，避免在同一个地方反复摔倒。考古最怕的不是亏钱，而是亏得不明不白，连续踩坑这五个错误。你看完觉得熟悉吗?熟悉的话赶紧点赞收藏，时刻提醒自己。咱们下期再见。","video_key":"20261103_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_74a41f3d8c","blogger":"半明同学","match":"exact","cls":"U","claim":"一天曝光一个强大的网站。第四期，今天分享的是，说真的，我要是早点发现它，就不会再某于花钱买软件了。它能让你免费、安全地装上各种专业软件，电脑小白也能轻松搞定。像Office WPS到Adobe全家桶和CAD这里都能找到，版本也很全。点击这里，你可以选择自己想要的版本。每个软件都有图文步骤，解压、激活，写得很清楚，照着步骤就能装好。最关键的是，免费，无弹窗，没有广告，真的很强大。","video_key":"20260208_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_92f3cfdaf4","blogger":"半明同学","match":"exact","cls":"U","claim":"这是一个可以生成各类笔记纸和学习用纸的网站。一天曝光一个强大的网站，第十八期。今天分享的是，它可以帮你生成各种类型的笔记纸。不管是直接下载用，还是打印出来，都很方便。它的纸张有方格纸、康奈尔笔记、拼音纸等。在这里可以设置纸张的类型、尺寸、颜色等。嫌自己调太麻烦，也不用折腾。直接在模板库里选一个就能用，省时又规整。选择好之后就可以导出来了。有三种格式可以选。不会操作也不用怕。网站里有使用指南。全程免费，不用登录。","video_key":"20260306_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_3d4251a177","blogger":"半明同学","match":"exact","cls":"U","claim":"这是一个能把任意图片上的字无痕改掉的协修工具。甚至放大十倍都找不到破绽。一天曝光一个强大的工具。第二期今天分享的是截图改时间、海报改标题，甚至连手写笔记都能直接重写。图片一丢，框住原文字，输入新内容，几秒自动替换。字号、字体风格、颜色渐变、阴影质感，通通自动匹配，和原图一模一样。不需要原文件，也不用会PS。移动端操作小白也能轻松上手。重点是免费，效率直接拉满。有了它，从此改图不求人。","video_key":"20260612_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_cb2b716bf6","blogger":"樊瑞强-亿万金","match":"exact","cls":"U","claim":"所以，小散真正，提高技术后，为自己定下一个财富增值的合理目标，并不是痴人说梦。这个目标完全可以实现。但同时大家要千万意识到。炒股是低门槛同时又很残酷的。","video_key":"20221030_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_ce2b80959a","blogger":"樊瑞强-亿万金","match":"exact","cls":"T","claim":"其他，我希望你呢，少去接触。不要今天人家说了这个，明天说了这个，你就来劲了。明天我看奇闻。可能上天的八百点还会破一破，破破当时就会拉上了，今天大家就说到这里。","video_key":"20250918_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_462f9de3a7","blogger":"樊瑞强-亿万金","match":"exact","cls":"U","claim":"每一回试探家仓，每一次踩坑后的咬牙坚持，都在为家族财务史写下全新的盘章。你打破的是埋头苦干等于致富的传统定势。你建立的从来不是账户里一串冰冷的数字，而是一种刻入骨髓的心理遗传，是对富力的敬畏，是对风险的度量，更是对财富规律的清醒认知。这条路的价值从不在你赚了多少，而在于从此以后家族的后代面对财富时，眼里会多一份笃定选择，更学会了让钱为自己工作。正如巴菲特所言，如果你没有找到睡觉时还能赚钱的方法，你就只能一直工作到老。而你迈出的这一步，正是替整个家族推开了那扇通往财富自由的大门。清醒的参与永远胜过怯懦的旁观。愿每位先行者投资顺利，终有所成。","video_key":"20261011_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_3bb9406240","blogger":"罗尼的图表","match":"exact","cls":"U","claim":"这两段走势各自会画出什么K线?先猜一猜。同一个小时，两个人盯着同一张图。老周看到的是，开盘就往上冲，冲到最高突然掉头，一路跌到最低，心里咯噔一件，最后又爬了回来。小林正好反过来，开盘先往下掉，看到他手心冒汗，探到最低之后掉头，一一口气拉到最高，最后回落一点。同样一小时，两个人的感受完全不一样。那画成K线呢?把两段说到一起。是同一根。开盘、最高、最低、收盘一模一样。因为K线是一份价格摘要。同一份摘要，背后可以是完全不同的过程。先到高点还是先到低点，中间来回了几次，这根K线都没写。拆成12根5分钟K线，谁先谁后就看出来了。不过，每一根5分钟K线，里面怎么走的，照样省掉了。","video_key":"20261016_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_059b63346e","blogger":"罗尼的图表","match":"exact","cls":"T","claim":"金价跌了，你在亏。他手里一根金条都没有，却在赚。他借来一根金条，借条上写还金条一根，坑就埋在这张借条上。借到手，转身卖掉，换来一叠钱。金价一跌，他花更少的钱买回一根，还上。省下的这一截就是他赚的。这套操作就叫做空。听着很美。再看一眼借条，上面写的是还金条一根，一个字没提前。这三年，金价差不多翻了一倍。三年前借金条卖掉的人，那叠钱今天只够买回半根。要是翻十倍呢?像你这样全款买金条的，最多亏光本钱。做空的人反过来，最多赚到当初卖的那叠钱，亏起来没有天花板。翻译成人话，做空欠的不是钱，是一样东西。它涨多少，债就涨多少。现实里做空要押保证金，亏到不够就被强制平仓。看对了也可能撑不到他爹的那天。","video_key":"20261022_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a06bdf72f0","blogger":"罗尼的图表","match":"exact","cls":"T","claim":"目标看他从哪起涨，歇行开头那个低点，跌破以后收盘又站上最后那个高点，这个歇行就不算了，认错离场。两线上收，新高别追，收破下沿才算。新高别追最要紧，冲得一回比一回短，新高是惯性挤出来的，常常就是顶。要是第四回又冲出个新高，只冲了三，收盘还在下沿上面，这个楔形成了没有?他说的是常常，不是一定。离场那条线先画好。关注罗尼，用每一个细节看清经济全貌。","video_key":"20261103_0001"},{"unit_id":"learn_视频号学习_全部文案_20261108_329a49a371","blogger":"AI量化工具手记","match":"exact","cls":"M","claim":"所有均线内量化条件，都是这个底层俘虏。本视频仅演示，量化工具搭建与代码编写，属于软件技术科普，不够承认核投资建议。股市有风险，入市需谨慎。","video_key":"20261013_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_c631cc2ccc","blogger":"AI量化工具手记","match":"exact","cls":"T","claim":"量价必须配合，缺一个都不稳。记住，平台是算出来的区间，不是数线根数。吃透这个逻辑，各类形态公式你都能独立编写。本视频仅演示，量化工具搭建与代码编写，属于软件技术科普，不够承认核投资建议。如有不懂的写法，可以在评论区留言。","video_key":"20261016_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7853226c0d","blogger":"AI量化工具手记","match":"exact","cls":"U","claim":"你写的饱满阳线，扔掉的那批可能才是最硬的。占比就是实体除以整根正幅，要求超过六成。试字看着没问题，一字板最高价等于最低价，分母是0。价格判断躲开除0也没用，它卡在必须收涨那一关。地开被砸下去又拉起来，实体不小，一除只剩0.4，一样出局。所以它筛的是形状干净，不是买盘印。预指反过来改成小于，0.3。冒出来的就是这两种。形状干净和买弹印，是两件事。加保护实际柱，别停也是一字。本视频仅演示，量化工具搭建与代码编写，属于远见技术科普，不够承认和投资建议。","video_key":"20261024_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_b4879fa5b9","blogger":"趋势浩天","match":"exact","cls":"T","claim":"没行情的时候就好好的修炼技术，好好磨刀，然后等行情来了大杀四方，建功立业，干啥啥有，明白吧?然后我也看了一下咱们的评论区，那现在的氛围很好，大家也都在分享技术，分享心得，那这种交流心得其实这才是正道，你这样你才能共同进步的，才能共同提高的。所以各位加油啊，行情留给大家的时间不多了，明白吧?还是再强调一句，咱们只有这一个账号，没有任何的小号，也不会给大家发私信关注大家，签加，大家不会的。如果有这种人，那全部都是假冒伪劣的，大家记得保护好自己，好吧?那还是老规矩，把该点的都点上，让咱们的视频发的顺畅一点，什么呀，点赞呀，收藏呀，推荐呀，都安排上，这样大家也都可以早一点看到。","video_key":"20260909_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_38190f53a1","blogger":"趋势浩天","match":"exact","cls":"T","claim":"所以要沉住气，保持耐心，要知道等待那也是交易的一部分。还有种业，那今天这一跌。咱们就得说说了，涨的时候咱们可以不说，可以少说，但是跌了呢，必须得喊一桑字，好吧。今天那些高标全军覆没了，很多人又是哇哇乱叫。其实这个前面说过了，五分钟上涨完成是要进入震荡的，只是啥时候震而已，啥时候来而已。所以调整这都是提前预定的事，好吧。那咱们今天就说说接下来怎么办，短期怎么办。还是打开一分钟主图吧，这个看的清晰一点。那一分钟主图上明显是一个下跌盘整加下跌的走势类型，对不对?这里有进入段，有中收，有离开段。那么下跌走势类型出现了，是不是可以考虑在这避一下呢?","video_key":"20260910_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_093989c8a3","blogger":"趋势浩天","match":"exact","cls":"T","claim":"这个中枢是多大，那么走势它就是多大。然后你再把图切换到1分钟主图或者15分钟主图上观察。那这里为什么要用小周期图去看呢?因为这样它会看得更清楚。比如一根日K线放到1分钟主图上，那么就是240根K线。那它内部的结构和走势你就看得一清二楚了。但是你在日线主图上看，它只有一根是K线，你看不到内部的结构。所以上面这些一分钟、五分钟、十五分钟、三十分钟、日线、周线，这叫周期图。周期图的本质，它相当于放大镜的作用。你要看得细一点，就把周期图放大。你要看整齐，你就把周期图缩小。但走势本身的级别，它是固定的。它不会因为你换不同的周期图看。比如这一段是5分钟级别的走势。","video_key":"20260918_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_8dd6ed1c63","blogger":"趋势浩天","match":"exact","cls":"T","claim":"那合理怎么看呢?那最直观的就是活生生的走势嘛。所以一定要多看走势图。这是世界上最昂贵的图画了，最昂贵的艺术品。你像这，这一张图几千个亿，对吧?上万亿，那还不是最昂贵的图吗?还不是最昂贵的艺术品吗?所以说要多看，那多看它就能培养你的鉴赏力。为什么那些地摊上玩古玩的?很多人总是被假的骗，有人就赚能破假的，这就是鉴赏力的区别。但是鉴赏力是需要磨练的，股票也是一样。今天这幅昂贵的世界名画该怎么看?其实结构上很简单，这里依旧是五分钟级别的震荡，观点不变。上周这里走的是一分钟级别下，没有破新低，那咱们就开始模仿一分钟同级别的上。等到后面这个一分钟上完了，不过新高，减掉。那如果过了，发生了背驰也要解。","video_key":"20261102_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_39db215393","blogger":"趋势浩天","match":"exact","cls":"T","claim":"如果今天带头的大金融，它能继续放量表现，而且成交量。突破2万亿，那就属于一个短期的进攻行情，那你情绪上就会相对舒服一些。如果明天还是跟前几天一样，继续打缩量或者是大幅调整，那就接着等。大金融能不能持续发力?能不能放量2万亿?就这三个条件就听好了。那么盘面讲到这儿，基本上望闻问切就算有了，但是光会看病，光会诊断，那没用的，后面还有操作。操作那就跟中医开药方一样，你会看病，你只等于中医的十分之一。用药开方子，那才是后面的十分之九。没有最后的开药方，你前面所有的东西都白搭的，因为判断走势那就跟中医看病一样的。为病而治那是第一等的。等到已经病了的阶段那只能算是亡羊补牢了。","video_key":"20261102_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_7933180bed","blogger":"巴爷聊价值","match":"exact","cls":"T","claim":"而另一些公司不需要投入特别多的钱，就能持续创造大量利润。从商业模式的角度来说，后者通常更加轻松。这也是为什么很多价值投资者会长期关注ROE。因为一家企业如果很多年都能够维持比较高的ROE，往往说明它身上可能存在某种优势。比如一个企业的品牌很强，别人卖100块钱只能赚5块钱，他卖100块钱可以赚20块钱。或者成本控制特别好，同样做一个产品，别人花80块，另一家公司只需要花60块。也可能是资产使用效率很高。同样100万元资产，别人一年只能做100万元生意，他一年可以做300万元生意。所以高ROE的背后可能藏着品牌、技术、渠道、成本、管理效率，甚至整个商业模式的优势。","video_key":"20260921_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_3e26f9d53e","blogger":"巴爷聊价值","match":"exact","cls":"U","claim":"长期低ROE的公司，低试镜率可能恰恰反映了资产赚钱能力弱。这也是为什么看到一家公司的试镜率只有0.8倍，你千万不要立刻喊，破镜了，太便宜了。破镜只代表股价低于账面净资产。不代表股价低于企业真实价值。比如一家制造企业，账面上有大量厂房、机器和售备，看起来净资产很多，但如果行业已经严重产能过剩，这些设备赚不到钱，甚至卖都卖不出账面上的价果，那么你看到的100亿净资产，经济价值可能远没有100亿。所以低市净率背后，你真正要问的是，这些净资产到底值不值钱，又能不能持续赚钱?那市净率什么时候特别有用?","video_key":"20261003_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_e100f6c75c","blogger":"巴爷聊价值","match":"exact","cls":"T","claim":"同样都是10年，为什么最后10年赚的钱比前20年加起来还多?因为富力不是简单地把收益加起来，而是在不断扩大的本金上继续创造收益。这就是富力最核心的秘密。时间越长，增长的绝对金额可能越惊人。当然，这只是按照每年稳定增长10%计算的数学事例，并不代表股票市场每年都能获得这样的收益。现在，你应该明白巴菲特为什么到了晚年，财富增长反而更加惊人了。他11岁就开始买股票，后来几十年持续投资，让资本不断积累。等到60岁以后，他已经拥有庞大的资产基础，哪怕同样的收益率，带来的财富增量也远远超过年轻时。所以巴菲特的秘密不只是投资能力出众，更是他让优秀的投资能力持续发挥了几十年。但是，这里有个问题。","video_key":"20261013_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_11d92f4d0e","blogger":"K哥真交易","match":"exact","cls":"T","claim":"我复盘了一通宵，突然灵光一闪，我发现了主力藏在当时圈子里面的人给我起了个外号叫做3K屠夫这套3K追魂阵法呢不管你是炒股小白还是说已经在家里带孙子的老股民你只要认真看完明天开盘的时候可以直接上手用今天呢我免费的把它分享给有缘的朋友你刷到这条视频呢就是你起事转运的开始请做好两件事情接住这个好运气第一点亮小红心红运当头就是你第二评论区里面留下实来运转四个字，这是给你自己的好彩头。新刷到K哥的顺手点个关注，炒股的路上多一个做量化的朋友，您不会吃亏的。我帮不了全天下的散户，但是我一定会拼尽全力让每一位信任我的。我们开始上干货。","video_key":"20261024_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_8ce295c511","blogger":"K哥真交易","match":"exact","cls":"T","claim":"第二步的话，我们把筛选出来的票保存到新建的动态分组以后，每天收盘后，你只需要点一下刷新，系统都会重新帮你筛选，自动的出票，不用一字一字的去翻，也不用整天的去盯盘。第三步，你第二天重点盯这几只票就够了，你看哪一只它回财五入均线还能够撑住，就是机会来了。确认有强度你就上车，强度不够呢就放弃。它是一定要记住一条铁律，买入的票第二天没有涨停，那说明强度它是不及预期的，果断的离场，不要恋战。然后再一次刷新分组，开始下一轮的筛选。有没有发现从选股到确认到离场，一条完整的量化短线的闭环，精简到你只需要一台手机就可以完成。你说简单不简单?","video_key":"20261031_0000"},{"unit_id":"learn_视频号学习_全部文案_20261108_a1bcd0e0f7","blogger":"K哥真交易","match":"exact","cls":"T","claim":"补仓是散户亏的最惨的地方没有之一。你以为越跌越买是在贪薄成本，错，你那是在给主力送钱。今天三个补仓陷阱，90%的人正踩着越补越亏，还以为自己在抄底。
