---
# 必要 Service：总线为全席位上行汇聚点，集群内经此访问（其余席位
# 仅被 prometheus 抓取/内部上报，暂不单列 Service，须要时按同模式追加）。
apiVersion: v1
kind: Service
metadata:
  name: os-legion-bus
  namespace: os-legion
spec:
  selector: { app: os-legion, component: message-bus }
  ports:
    - port: 9400
      targetPort: 9400
