# 个人 OS 数字军团 · K8s 部署清单骨架（可选，默认部署目标为 docker-compose）
# 占位说明：namespace、镜像、副本数与资源限额须按实际集群调整；
# 密钥经 Secret 引用（占位名），禁止明文。
# 端口约定（部署侧口径，与 deploy/docker-compose.yaml、monitoring/prometheus.yml 一致）：
#   通用席位 9400+10×角色序号（message_bus=9400 … os_commander=9470）；
#   平台席六实例：quant=9440（基准），其余五平台自 9480 起步长 10
#   （stock=9480 rd=9490 ppt=9500 biz=9510 review=9520）。
# 骨架状态披露（工位U 扩编后）：本清单已覆盖全部 8 席位（platform_agent
# 按 6 平台实例展开，共 13 Deployment，与 compose 服务一一对齐）；
# 镜像均为占位（os-legion/*:PLACEHOLDER_TAG），须替换后才能部署（骨架状态，不承诺部署）。
# 平台实例化说明：platform_agent 经 entrypoint 既有 --platform 参数区分平台，
# 入口已原生支持，未改动 entrypoint。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-legion-bus
  namespace: os-legion
  labels: { app: os-legion, component: message-bus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: os-legion, component: message-bus }
  template:
    metadata:
      labels: { app: os-legion, component: message-bus }
    spec:
      containers:
        - name: message-bus
          image: os-legion/bus:PLACEHOLDER_TAG
          ports: [{ containerPort: 9400 }]
          resources:
            requests: { cpu: 250m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          livenessProbe:
            httpGet: { path: /health, port: 9400 }
            initialDelaySeconds: 10
            periodSeconds: 30
          env:
            - name: BUS_PORT
              value: "9400"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: os-legion-zhuge-liang
  namespace: os-legion
  labels: { app: os-legion, component: zhuge-liang }
spec:
  replicas: 1
  selector:
    matchLabels: { app: os-legion, component: zhuge-liang }
  template:
    metadata:
      labels: { app: os-legion, component: zhuge-liang }
    spec:
      containers:
        - name: zhuge-liang
          image: os-legion/seat:PLACEHOLDER_TAG
          args: ["python", "entrypoint.py", "--role", "zhuge_liang", "--serve", "--port", "9410"]
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          env:
            - name: BUS_URL
              value: http://os-legion-bus:9400
