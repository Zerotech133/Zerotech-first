[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zhice-os-v2"
version = "0.1.0"
description = "zhice-OS V2 - AI 量化决策与执行闭环操作系统"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.1",
    "psycopg2-binary>=2.9.9",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.1",
    # 缠论策略（CHAN/CHAN_V2）结构引擎；未装 rs_czsc 时自动走纯 Python 实现
    # 钉 ==0.10.12 与云端 zhice-aos 一致：czsc 1.0.1 的 corr.py 缺 single_linear，
    # 导致 get_zs_seq 内部 import 失败、缠论 v1 中枢构建全废（>=0.10.12 会解析到坏的 1.0.1）。
    "czsc==0.10.12",
    "parse>=1.20",
    "tqdm>=4.66",
    "Deprecated>=1.2",
    # 行情数据源直连（复刻 V1）：CN 结算 tushare；US/HK/CRYPTO 客户端用 requests；
    # 东财日线/spot 用 akshare（US/HK 兜底源）；yfinance 最终兜底。
    "tushare>=1.4.0",
    "requests>=2.31.0",
    "akshare>=1.13.0",
    "yfinance>=0.2.40",
    # 交易日历（XHKG/XNYS/XSHG 权威日历，含未来节假日）：连续性检查的精确基准
    "pandas_market_calendars>=4.4.0",
    "email-validator>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-cov>=5.0.0",
    "black>=24.4.2",
    "ruff>=0.4.7",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["zhice_os_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-m 'not real_pg and not e2e'"
markers = [
    "real_pg: 直连真实 PostgreSQL（需要 REAL_PG=1 环境变量）",
    "e2e: 直打本机真实栈 API 8102 的多用户 E2E 旅程（httpx，绝不导入 zhice 模块；显式 -m e2e 才运行）",
]

[tool.mypy]
ignore_missing_imports = false
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "numpy.*",
    "psycopg2.*",
    "tushare.*",
    "czsc.*",
    "apscheduler.*",
    "dotenv.*",
    "yfinance.*",
    "akshare.*",
    "parse.*",
    "tqdm.*",
]
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# 固定一个确定的规则集，避免不同 ruff 版本默认集漂移导致 CI 忽绿忽红。
# 强制高价值规则（F=真 bug、I=导入序、UP=现代化、B=bugbear），
# 下列 ignore 为全库既有风格约定/框架惯用，属遗留债不做硬门（见评审 T6）。
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # 行长由格式化负责，不做硬门
    "B008",   # FastAPI 的 Depends()/Query() 惯用法即在默认值里调用，非缺陷
    "B904",   # 允许 except 中直接 raise HTTPException（路由层惯用）
    "E741",   # 单字母 l 是全库既有 line/list 命名约定（10 处），纯风格
    "E402",   # 少量规避循环导入的中段 import（brokers 等）
    "SIM102", # 嵌套 if 在部分判定链更可读，既有约定
    "SIM105", # try/except/pass 与 contextlib.suppress 等价，不强制
    "SIM201", # `not a == b` 可读性 nit，不做硬门
    "B007",   # 未使用的循环变量（既有遍历写法）
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
