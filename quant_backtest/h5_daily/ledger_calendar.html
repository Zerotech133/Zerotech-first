const agg=arr=>{const v=arr.filter(x=>x!=null);return v.length?{m:v.reduce((a,b)=>a+b,0)/v.length,n:v.length,win:Math.round(100*v.filter(x=>x>0).length/v.length)}:null};
const byYear={},byMonth={};
DATA.forEach(d=>{const y=d.day.slice(0,4),ym=d.day.slice(0,6);(byYear[y]=byYear[y]||[]).push(d);(byMonth[ym]=byMonth[ym]||[]).push(d)});
let view=document.getElementById('view'),crumbs=document.getElementById('crumbs');
function nav(level,key){crumbs.innerHTML='';view.innerHTML='';
 const mk=t=>{const a=document.createElement('a');a.textContent=t;
  a.onclick=()=>nav('y');crumbs.appendChild(a);return a};
 const sep=()=>{const s=document.createElement('span');s.className='sep';s.textContent=' › ';crumbs.appendChild(s)};
 const cur=t=>{const b=document.createElement('b');b.textContent=t;crumbs.appendChild(b)};
 const root=mk('全部年');
 if(level==='y'){cur('（选择年份 → 月 → 日 → 票）');renderYears()}
 else if(level==='m'){sep();cur(key+' 年');renderMonths(key)}
 else{sep();const a2=document.createElement('a');a2.textContent=key.slice(0,4)+' 年';
  a2.onclick=()=>nav('m',key.slice(0,4));crumbs.appendChild(a2);sep();
  cur(key.slice(4,6)+' 月');renderDays(key)}}
function renderYears(){
 const ys=Object.keys(byYear).sort();
 view.innerHTML=ys.map(y=>{const a=agg(byYear[y].map(d=>d.mean));
  return '<div class="year" onclick="nav(\'m\',\''+y+'\')"><h3>'+y+' 年</h3>'
  +'<div class="ystat"><span>日均 <b style="color:'+col(a&&a.m)+'">'+fmt(a&&a.m)+'%</b></span>'
  +'<span>交易日 <b>'+byYear[y].length+'</b></span>'
  +'<span>胜率 <b>'+(a?a.win:0)+'%</b></span></div></div>'}).join('');}
function renderMonths(y){
 const ms=Object.keys(byMonth).filter(k=>k.startsWith(y)).sort();
 view.innerHTML='<div class="months">'+ms.map(k=>{const a=agg(byMonth[k].map(d=>d.mean));
  const w=a?Math.max(3,Math.round(a.win)):3;
  return '<div class="month" onclick="nav(\'d\',\''+k+'01\')"><h4><span>'+k.slice(4,6)+' 月</span>'
  +'<span style="color:'+col(a&&a.m)+'">'+fmt(a&&a.m)+'%</span></h4>'
  +'<div class="mstat"><span>'+byMonth[k].length+' 交易日</span><span>胜率 '+(a?a.win:0)+'%</span></div>'
  +'<div class="bar"><i style="width:'+w+'%;background:'+(a&&a.m>0?C.up:C.dn)+'"></i></div></div>'}).join('')+'</div>';}
function renderDays(ym){
 const ds=byMonth[ym.slice(0,6)]||[];
 view.innerHTML='<div class="daysgrid">'+ds.map(d=>{
  return '<div class="day"><div class="dh"><b>'+d.day.slice(4,6)+'-'+d.day.slice(6)+'</b>'
  +'<span class="mr" style="color:'+col(d.mean)+'">'+fmt(d.mean)+'%</span></div>'
  +d.picks.map((p,k)=>'<div class="pick" onclick="show(event,\''+d.day+'\','+k+')">'
