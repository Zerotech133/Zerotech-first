<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<title>P1 日历账本 v2 · 年→月→日→票 四级下钻</title><style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0c1117;color:#e6edf3;font:13px/1.6 "Segoe UI",system-ui,"Microsoft YaHei",sans-serif;padding:20px}
h1{font-size:17px;margin-bottom:2px}.m{color:#6b7787;font-size:11.5px;margin-bottom:10px}
.crumbs{display:flex;gap:6px;align-items:center;margin-bottom:12px;font-size:13px;flex-wrap:wrap}
.crumbs a{color:#4f8fe6;cursor:pointer;text-decoration:none}
.crumbs span.sep{color:#6b7787}
.crumbs b{color:#e0b95c}
.years{display:flex;gap:10px;flex-wrap:wrap}
.year{background:#121924;border:1px solid #1f2835;border-radius:12px;padding:12px;cursor:pointer;min-width:190px}
.year:hover{border-color:#2a3546;background:#182130}
.year h3{font-size:15px;margin-bottom:4px}
.ystat{display:flex;gap:14px;font-size:11.5px;color:#9aa7b8}
.ystat b{font-size:14px}
.months{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.month{background:#121924;border:1px solid #1f2835;border-radius:10px;padding:10px;cursor:pointer}
.month:hover{border-color:#2a3546;background:#182130}
.month h4{font-size:13px;display:flex;justify-content:space-between;margin-bottom:4px}
.mstat{font-size:11px;color:#9aa7b8;display:flex;gap:10px}
.bar{height:5px;border-radius:3px;background:#1d2836;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%}
.daysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.day{background:#121924;border:1px solid #1f2835;border-radius:10px;padding:8px}
.dh{display:flex;justify-content:space-between;font-size:11px;color:#9aa7b8;margin-bottom:5px}
.dh b{color:#e6edf3}
.mr{font-weight:700;font-size:12px}
.pick{display:flex;justify-content:space-between;font-size:11.5px;padding:2px 4px;border-radius:4px;cursor:pointer}
.pick:hover{background:#0e141d}
.pcode{color:#c9d5e3}.prt{font-weight:600}
#modal{position:fixed;inset:0;background:rgba(5,8,12,.82);display:none;z-index:9;overflow:auto;padding:40px 20px}
#modal.on{display:flex;justify-content:center;align-items:flex-start}
.card{background:#121924;border:1px solid #2a3546;border-radius:14px;max-width:860px;width:100%;padding:20px}
.card h2{font-size:15px;margin-bottom:2px}.card .sub{color:#6b7787;font-size:11.5px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sec{background:#0e141d;border:1px solid #1f2835;border-radius:10px;padding:10px}
.sec h4{font-size:11px;color:#4f8fe6;margin-bottom:6px;letter-spacing:.5px}
.row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dashed #182130;gap:12px}
.row:last-child{border:none}
.tag{display:inline-block;border:1px solid #2a3546;border-radius:9px;padding:0 7px;font-size:10.5px;margin:2px 3px 0 0;color:#9aa7b8}
.tag.hit{border-color:#3d5a80;color:#7fb3ff}
.up{color:#e35d5d}.dn{color:#3aa76d}.flat{color:#8a93a3}
.close{float:right;cursor:pointer;color:#6b7787;font-size:16px;padding:0 6px}
.q{color:#e0b95c}
</style></head><body>
<h1>P1 日历账本 · 年 → 月 → 日 → 票</h1>
<div class="m">手法 v3 · v1.0 · 逐层下钻看态势，点票看完整证据链（板块/因子/五问）· 生成 __GEN__</div>
<div class="crumbs" id="crumbs"></div>
<div id="view"></div>
<div id="modal" onclick="if(event.target===this)this.classList.remove('on')">
<div class="card"><span class="close" onclick="document.getElementById('modal').classList.remove('on')">✕</span><div id="cbody"></div></div></div>
<script>
const DATA=__DATA__;
const C={up:'#e35d5d',dn:'#3aa76d',flat:'#8a93a3'};
const fmt=(v,d=2)=>v==null?'—':(v>0?'+':'')+v.toFixed(d);
const col=v=>v==null?C.flat:(v>0?C.up:(v<0?C.dn:C.flat));
const agg=arr=>{const v=arr.filter(x=>x!=null);return v.length?{m:v.reduce((a,b)=>a+b,0)/v.length,n:v.length,win:Math.round(100*v.filter(x=>x>0).length/v.length)}:null};
const byYear={},byMonth={};
DATA.forEach(d=>{const y=d.day.slice(0,4),ym=d.day.slice(0,6);(byYear[y]=byYear[y]||[]).push(d);(byMonth[ym]=byMonth[ym]||[]).push(d)});
let view=document.getElementById('view'),crumbs=document.getElementById('crumbs');
function nav(level,key){crumbs.innerHTML='';view.innerHTML='';
 const mk=t=>{const a=document.createElement('a');a.textContent=t;
  a.onclick=()=>nav('y');crumbs.appendChild(a);return a};
 const sep=()=>{const s=document.createElement('span');s.className='sep';s.textContent=' › ';crumbs.appendChild(s)};
 const cur=t=>{const b=document.createElement('b');b.textContent=t;crumbs.appendChild(b)};
 const root=mk('全部年');
 if(level==='y'){cur('（选择年份 → 月 → 日 → 票）');renderYears()}
 else if(level==='m'){sep();cur(key+' 年');renderMonths(key)}
 else{sep();const a2=document.createElement('a');a2.textContent=key.slice(0,4)+' 年';
  a2.onclick=()=>nav('m',key.slice(0,4));crumbs.appendChild(a2);sep();
  cur(key.slice(4,6)+' 月');renderDays(key)}}
function renderYears(){
 const ys=Object.keys(byYear).sort();
 view.innerHTML=ys.map(y=>{const a=agg(byYear[y].map(d=>d.mean));
  return '<div class="year" onclick="nav(\'m\',\''+y+'\')"><h3>'+y+' 年</h3>'
  +'<div class="ystat"><span>日均 <b style="color:'+col(a&&a.m)+'">'+fmt(a&&a.m)+'%</b></span>'
  +'<span>交易日 <b>'+byYear[y].length+'</b></span>'
  +'<span>胜率 <b>'+(a?a.win:0)+'%</b></span></div></div>'}).join('');}
function renderMonths(y){
 const ms=Object.keys(byMonth).filter(k=>k.startsWith(y)).sort();
 view.innerHTML='<div class="months">'+ms.map(k=>{const a=agg(byMonth[k].map(d=>d.mean));
  const w=a?Math.max(3,Math.round(a.win)):3;
  return '<div class="month" onclick="nav(\'d\',\''+k+'01\')"><h4><span>'+k.slice(4,6)+' 月</span>'
  +'<span style="color:'+col(a&&a.m)+'">'+fmt(a&&a.m)+'%</span></h4>'
  +'<div class="mstat"><span>'+byMonth[k].length+' 交易日</span><span>胜率 '+(a?a.win:0)+'%</span></div>'
  +'<div class="bar"><i style="width:'+w+'%;background:'+(a&&a.m>0?C.up:C.dn)+'"></i></div></div>'}).join('')+'</div>';}
function renderDays(ym){
 const ds=byMonth[ym.slice(0,6)]||[];
 view.innerHTML='<div class="daysgrid">'+ds.map(d=>{
  return '<div class="day"><div class="dh"><b>'+d.day.slice(4,6)+'-'+d.day.slice(6)+'</b>'
  +'<span class="mr" style="color:'+col(d.mean)+'">'+fmt(d.mean)+'%</span></div>'
  +d.picks.map((p,k)=>'<div class="pick" onclick="show(event,\''+d.day+'\','+k+')">'
   +'<span class="pcode">'+p.code.slice(0,9)+'</span>'
   +'<span class="prt" style="color:'+col(p.ret)+'">'+fmt(p.ret)+'</span></div>').join('')+'</div>'}).join('')+'</div>';}
const IDX={};DATA.forEach(d=>IDX[d.day]=d);
function show(e,day,k){e.stopPropagation();
 const d=IDX[day],p=d.picks[k],f=p.factors;
 const fac=[f.bei?'bei 同向力度背驰':null,f.bei2?'bei2 回踩力度背驰':null,
  f.bei24?'bei24 24课盘整背驰':null,f.tbe24?'tbe24 24课趋势背驰':null,
  f.mbei?'mbei MACD背驰':null].filter(Boolean);
 const secHtml=(p.sectors||[]).map(s=>'<span class="tag">'+s.name
  +(s.r5!=null?' <b style="color:'+col(s.r5*100)+'">'+fmt(s.r5*100,1)+'%</b>':'')+'</span>').join('')||'<span class="tag">成分快照未命中</span>';
 document.getElementById('cbody').innerHTML=
 '<h2>'+p.code+' · 三买 top'+(k+1)+'（评分 '+p.score+'）</h2>'
 +'<div class="sub">选择日 '+d.day+' · 结构日 dt '+p.dt+' · 次日 '+d.next+' 实况 · 手法 v1.0</div>'
 +'<div class="grid">'
 +'<div class="sec"><h4>次日真实（T+1 开盘买入→收盘）</h4>'
  +'<div class="row"><span>次日收益</span><b style="color:'+col(p.ret)+'">'+fmt(p.ret)+'%</b></div>'
  +'<div class="row"><span>选择日涨跌</span><b style="color:'+col(p.day_pct)+'">'+fmt(p.day_pct)+'%</b></div></div>'
 +'<div class="sec"><h4>因子命中（为什么选它）</h4>'
  +'<div class="row"><span>位置 price/zg</span><b>'+fmt(f.pos_pct)+'%（zg='+f.zg+' zd='+f.zd+'）</b></div>'
  +'<div class="row"><span>量比 vr</span><b>'+(f.vr==null?'—':f.vr.toFixed(2))+'</b></div>'
  +'<div style="margin-top:4px">'+(fac.length?fac.map(x=>'<span class="tag hit">'+x+'</span>').join(''):'<span class="tag">三源背驰全未命中</span>')+'</div></div>'
 +'<div class="sec" style="grid-column:1/3"><h4>所属板块（成分快照 · 板块 5 日强弱 r5）</h4>'+secHtml+'</div>'
 +'<div class="sec" style="grid-column:1/3"><h4>证据链五问</h4>'
  +'<div class="row"><span class="q">① 为什么选它</span><span>三买事件 + 评分 '+p.score+'（pos/vol/bei30 = 40/30/30 档位缩放）</span></div>'
  +'<div class="row"><span class="q">② 何时能看到</span><span>选择日盘中（day='+d.day+'）；回踩笔终点 dt='+p.dt+'（可早于选择日）</span></div>'
  +'<div class="row"><span class="q">③ 第二天真实</span><span style="color:'+col(p.ret)+'">'+fmt(p.ret)+'%（开盘买入口径，零成本）</span></div>'
  +'<div class="row"><span class="q">④ 板块环境</span><span>所属板块 r5 见上卡（板块层 asof=快照日，T+1 口径如实标注）</span></div>'
  +'<div class="row"><span class="q">⑤ 手法版本</span><span>v3 评分 v1.0（手法登记簿上线后自动分版本着色）</span></div></div>'
 +'</div>';
 document.getElementById('modal').classList.add('on');}
nav('y');
</script></body></html>
