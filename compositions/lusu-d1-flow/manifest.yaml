apiVersion: zerobound/v1
kind: Composition
metadata:
  id: lusu-d1-flow
  name: 鲁肃 D1 投研裁决流水线
  version: 1.1.0
  owner: D1
  lifecycle: draft
  tier: product
  host: lingjie
  description: ACAD1 选股池 → D1 投研/裁决/会议/交棒 → 盯盘 → 人工门 → TR1 paper 执行 → outcome/训练（IFS
    v1 F6 组合登记）
  created: '2026-11-02'
  updated: '2026-11-03'
spec:
  kernel: '>=0.9 <2.0'
  seats:
  - ref: agent/D1
  - ref: agent/T1
  - ref: agent/T2
  - ref: agent/N1
  - ref: agent/F1
  - ref: agent/ST1
  - ref: agent/QS1
  - ref: agent/WA1
  - ref: agent/WA2
    note: org 声明在册；hr 目录缺（审计在案）
  - ref: agent/WA3
    note: 同上
  - ref: agent/TR1
  - ref: agent/TR2
    note: org 声明在册；hr 目录缺（审计在案）
  - ref: agent/TR3
    note: 同上
  skills:
  - ref: skill/events
  - ref: skill/paper_positions
  data:
    requires:
    - ref: dataset/file/recommendation_pool
      note: IFS F2 上游池；dataset_registry 登记由 task-27 完成（当前 planned）
    - ref: dataset/file/pool_review
      note: IFS F2 池复盘；dataset_registry 登记由 task-27 完成（当前 planned）
    - ref: dataset/file/team_exec
      note: IFS F2 投研执行产物；dataset_registry 登记由 task-27 完成（当前 planned）
    - ref: dataset/file/paper_ledger
      note: IFS F4 paper 账；dataset_registry 登记由 task-27 完成（当前 planned）
    - ref: dataset/file/shadow_ledger
      note: IFS F5 outcome 影子账；dataset_registry 登记由 task-27 完成（当前 planned）
    - ref: dataset/file/d1_decisions
      note: IFS F1 裁决账；dataset_registry 登记由 task-27 完成（当前 planned）
    - ref: dataset/file/training_episode
      note: IFS F5 训练 episode（planned，训练契约未定）
    contract: trading-bot/v1
    sla:
      paper_only: true
      human_gate_external_only: true
      kill_switch: PAPER_KILL
      pool_scope: acad1_only
      interface_envelope: IFS-03 统一 envelope/schema_version 待 task-26 落地
  interfaces:
    exposes:
    - http: /api/d1/research
    - http: /api/d1/decisions
    - http: /api/d1/decision
    - http: /api/d1/meeting
    - http: /api/d1/handoffs
    - http: /api/d1/handoff
    - http: /api/d1/training
    - http: /api/d1/watch-plans
    consumes:
    - interface/hermes-control
    - taskstore
    - envelope/s21
    - llm/glm-5.3
    - interface/ifs-registry-v1
    - interface/acad1-pool-pg-v2
    auth:
      public: false
      methods:
      - portal-token
      roles:
      - A0
      - D1
      - ACAD1
  pages:
  - ref: page/d1/research
  - ref: page/d1/war-room
  - ref: page/d1/training
    note: planned：页面未建（IFS F6 / WO-IFS-ROUTE 待 Lead 接线）
  jobs:
  - ref: job/zhice-daily-research-ops
    note: ZhiceAcad1Pool 17:00 上游池（schtasks 2026-11-03 实测）
  - ref: job/agent-shadow-daily
    note: AgentShadowDaily 17:10（job_map 本次补登）
  - ref: job/d1-outcome-daily
    note: D1OutcomeDaily（ZeroBound 目录）17:10
  - ref: job/legion-daily-review
    note: LegionDailyReview 17:40 D1 复盘
  channels:
  - feishu
  - portal
  - trader
  permissions:
    default: read-only
    write_scopes:
    - agent/D1/*
    - agent_platform/data/paper/**
    - agent_platform/data/pool_review/**
    deny:
    - _vault
    - quant_backtest/data
  evidence:
    contract: trading-bot/v1
    ledger: agent_platform/data/paper/paper_ledger.jsonl
    handoff_store: agent_platform/data/d1_handoffs.jsonl
  runtime:
    service: portal-api
    endpoint: http://127.0.0.1:8091
    mode: internal-service
  slo:
    trading_permitted: false
    real_exchange_adapter: disabled
    watch_runtime: contract_only
    review_cadence: daily
    q_level: Q1
    health_probe: planned（Q2 缺口）：未接 health/SLO 探针，见 docs/plans/2026-11-03_IFS-COMP_D1组合对接登记_v1.md
    rollback: git revert WO-IFS-COMP-20261103 提交（6 文件声明层复原）；无运行态/数据变更
    test_entry: python -m pytest tools/tests/test_candidate_generation_guard.py -q
      && python tools/composition.py validate --all
  notes:
  - IFS v1 F6+WIRE 登记：8 API（7 active，/api/d1/training planned）、3 页面（2 active，/d1/training
    planned）、4 任务。
  - 数据：recommendation_pool/pool_review/team_exec/paper_ledger/shadow_ledger 已登记 active；d1_decisions
    登记 planned；training_episode planned（F5）。
  - 接口 schema/envelope 以 docs/standards/INTERFACE_REGISTRY_v1.yaml 为准；handoff v2 /
    watch_plan 由任务 28 实现，四 ID 由任务 29 + WIRE 收口。
  - Q2 缺口（health/SLO 实测/rollback 演练/契约测试入 fast gate）与 Lead 接线请求见 docs/plans/2026-11-03_IFS-COMP_D1组合对接登记_v1.md。
  - 不改运行时：不启停服务、不写数据；六段流水线见 agent_platform/registry/trading_bot.json。
status:
  phase: shadow
  health: unknown
  validated: false
  q_level: Q1
  interfaces:
    active: 7
    planned:
    - /api/d1/training
  pages:
    active: 2
    planned:
    - /d1/training
  jobs:
    active: 4
    planned: []
  data_refs: 5 active + d1_decisions planned + training_episode planned
  source: IFS v1 + WIRE 2026-11-03 集成 + schtasks + portal_api 实测
  gaps_doc: docs/plans/2026-11-03_IFS-COMP_D1组合对接登记_v1.md
