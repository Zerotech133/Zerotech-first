apiVersion: zerobound/v1
kind: Composition
metadata:
  id: data-warehouse
  name: 数据仓
  version: 1.0.0
  owner: DATA1
  lifecycle: draft
  tier: data
  host: lingjie
  description: 全域数据集登记/取数/血缘/契约（314 数据集，文件级 + PG 待补）
  created: "2026-11-02"
  updated: "2026-11-02"
spec:
  kernel: ">=0.9 <2.0"
  seats:
    - ref: agent/DATA1
    - ref: agent/AI1
  skills:
    - ref: skill/events
    - ref: skill/datamart_read
    - ref: skill/datamart_latest
  data:
    requires:
      - ref: dataset/registry/dataset_registry
      - ref: dataset/registry/catalog
      - ref: dataset/dir/quant_backtest_data
      - ref: dataset/dir/knowledge_base
    contract: data-warehouse/v1
    sla:
      registered_ratio: 0.95
      covered_ratio: 1.0
      freshness_required: true
      lineage_required: true
  interfaces:
    exposes:
      - http: /api/dw/stats
      - http: /api/dw/list
      - http: /api/dw/search
      - http: /api/dw/get
      - http: /api/dw/sample
      - page: /dw
      - page: /dataops
    consumes:
      - taskstore
      - envelope/s21
    auth:
      public: false
      methods: [portal-token, internal-key]
      roles: [A0, DATA1, ARCH1, ACAD1, D1]
  pages:
    - ref: page/dw
    - ref: page/dataops
  jobs:
    - ref: job/dw-daily
    - ref: job/metadata-daily
  channels:
    - portal
  permissions:
    default: read-only
    write_scopes:
      - tools/datawarehouse/**
      - research/reports/**
    deny:
      - _vault
      - quant_backtest/data
  evidence:
    contract: data-warehouse/v1
    readonly_default: true
  runtime:
    service: portal-api
    endpoint: http://127.0.0.1:8091
    mode: internal-service
  slo:
    datasets: 314
    registered: 265
    exposed: 72
    pg_table_covered: false
    temp_contract_covered: false
  notes:
    - "P0 影子清单；dataset_registry 现为文件级只读（dir/sqlite_table/corpus_layer）。"
    - "缺 pg_table 连接器：智策 83 张 v2_* 表全在登记外（P2 补）。"
    - "C:\\Temp 契约产物 0 覆盖；P2 收敛为带 schema/版本/保留期的契约目录。"
    - "统一数据面契约未成立前，数据仓只能当'文件级目录 + 取样'，不能宣称全域覆盖。"
status:
  phase: shadow
  health: unknown
  validated: false
  source: "dataset_inventory_20261102.json + WP-I3 回执 + 实测审计"
