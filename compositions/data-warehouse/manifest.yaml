apiVersion: zerobound/v1
kind: Composition
metadata:
  id: data-warehouse
  name: 数据仓
  version: 1.1.0
  owner: DATA1
  lifecycle: draft
  tier: data
  host: lingjie
  description: 全域数据集登记/取数/血缘/契约（314 数据集：registered 265/314=84.4%、exposed 72/314=22.9%；文件级 + PG/C:\Temp 待补）
  created: "2026-11-02"
  updated: "2026-11-02"
spec:
  kernel: ">=0.9 <2.0"
  seats:
    - ref: agent/DATA1
    - ref: agent/AI1
  skills:
    - ref: skill/events
    - ref: skill/datamart_read
    - ref: skill/datamart_latest
  data:
    requires:
      - ref: dataset/registry/dataset_registry
        note: "统一登记真源：314 数据集，registered 265（84.4%）/ exposed 72（22.9%）；文件级只读"
      - ref: dataset/registry/catalog
        note: "资产 catalog v18：256 物理表口径；与 314 数据集口径不同，勿混用"
      - ref: dataset/dir/tushare
        note: "接口数据域数据根 quant_backtest/data 的主数据子树 tushare/（真实目录，只读）；根级 241 数据集聚合口径见 inventory summary（W1 引用收口 2026-11-02：原 ref quant_backtest_data 根级聚合无 inventory 单条，校正到真实子树）"
      - ref: dataset/dir/knowledge_docs
        note: "学习派生文档根 knowledge_docs（inventory registered dir，117 文件/12.3MB，只读）；C:\\项目\\知识库 语料层见 yt_* corpus_layer（2026-11-02 校正：原 knowledge_base 根级聚合无 inventory 单条）"
      - ref: dataset/pg/v2_zhice_tables
        note: "PG 聚合口径：wave1 已登记 7 表（registry PG_WAVE1_TABLES）；wave2 动态发现需 ZHICE_V2_DSN（CLI resolve-ref）；本 ref 非物理表 → soft warning 保留（ADR-019 P5，严格化后 block）"
      - ref: dataset/file/temp_contract
        note: "GAP（保持 planned）：C:\\Temp 契约产物聚合口径无单文件真实载体；单件白名单见 dataset_registry TEMP_CONTRACT_WHITELIST；整改期 2026-11-12 契约目录化（DWH-103）"
    contract: data-warehouse/v1
    sla:
      # 目标（Sprint3 WP-I6）：登记率≥95%、取数入口覆盖率≥80%；不因基线低而下调
      registered_ratio_target: 0.95
      exposed_ratio_target: 0.8
      freshness_required: true
      lineage_required: true
      # 实测基线（2026-11-02，数据集口径 314；四源对账见 DWH-104 报告）
      baseline:
        datasets: 314
        registered: 265
        registered_ratio: 0.844
        exposed: 72
        exposed_ratio: 0.229
      # GAP 与整改期（DWH-102 对齐；明细见 notes 与 DWH-103）
      gap:
        registered_missing: 49
        exposed_missing: 242
        remediation_due: "2026-11-12"
  interfaces:
    exposes:
      - http: /api/dw/stats
      - http: /api/dw/list
      - http: /api/dw/search
      - http: /api/dw/get
      - http: /api/dw/sample
      - page: /dw
      - page: /dataops
    consumes:
      - interface/hermes-control
      - taskstore
      - envelope/s21
    auth:
      public: false
      methods: [portal-token, internal-key]
      roles: [A0, DATA1, ARCH1, ACAD1, D1]
  pages:
    - ref: page/dw
    - ref: page/dataops
  jobs:
    - ref: job/dw-daily
    - ref: job/metadata-daily
  channels:
    - portal
  permissions:
    default: read-only
    write_scopes:
      - tools/datawarehouse/**
      - research/reports/**
    deny:
      - _vault
      - quant_backtest/data
  evidence:
    contract: data-warehouse/v1
    readonly_default: true
  runtime:
    service: portal-api
    endpoint: http://127.0.0.1:8091
    mode: internal-service
  slo:
    datasets: 314
    registered: 265
    registered_ratio: 0.844
    exposed: 72
    exposed_ratio: 0.229
    pg_table_covered: false
    temp_contract_covered: false
    verified_at: "2026-11-02T08:38:48+08:00"
    verified_source: "dataset_inventory_20261102.json sha256:6D162E1E…B3C1A + /api/dw/stats@8091 四源对账"
  notes:
    - "P0 影子清单；dataset_registry 现为文件级只读（dir/sqlite_table/corpus_layer）。"
    - "缺 pg_table 连接器：智策 83 张 v2_* 表在登记外；GAP 整改期 2026-11-12（DWH-103），登记率 84.4% 的解是补 PG 后重算。"
    - "C:\\Temp 契约产物 0 覆盖；GAP 整改期 2026-11-12 收敛为带 schema/版本/保留期的契约目录（DWH-103）。"
    - "统一数据面契约未成立前，数据仓只能当'文件级目录 + 取样'，不能宣称全域覆盖。"
    - "DWH-102 v1.1（2026-11-02）：SLA 目标沿用 WP-I6（登记≥95%、取数入口≥80%）；基线 314/265/72（84.4%/22.9%），差 49/242，整改期 2026-11-12。"
    - "口径真源：dataset_inventory_20261102.json（sha256 6D16…B3C1A，mtime 2026-11-02 02:15:50）+ /api/dw/stats@8091 四源对账 2026-11-02T08:38:48+08:00；catalog.json 256 物理表为另一口径。"
    - "取数面：/api/dw/* 直连 8091 返回 200；经 8734 因 nginx H4-B 白名单未登记返回 401（L2 待批 task-11），auth.public=false 不变。"
    - "页面口径（2026-11-02 抽检 P2-1）：page /dw、/dataops 在 8734=404（资产 dw.html/dataops.html=200）；页面路由待 P2 收口。"
    - "口径双写（2026-11-02 抽检 P3-1）：spec.slo 与 spec.data.sla.baseline 同组数字双写；DWH-103 收口为单一真源。"
    - "metadata.version 已同批升 1.1.0（registry+manifest，2026-11-02，ARCH1 抽检通过）；后续升版仍须 registry.json 同批。"
    - "W1 引用收口（2026-11-02）：dataset/dir 两条校正到真实载体（quant_backtest_data→tushare 子树、knowledge_base→knowledge_docs inventory dir）；dataset/file/temp_contract 无单文件真实载体，保持 planned 缺口（不伪造）。证据：deliverables/2026-11-02_W1引用收口证据_v1.md。"
status:
  phase: shadow
  health: unknown

  rollback:
    steps:
      - "回退 manifest/registry 到上一版（git revert；不动数据文件）"
      - "停新入口：摘除 /api/dw/stats 与 /api/dw/search 暴露，保留 8091 只读审计"
      - "恢复 catalog/registry 只读快照并重载 8091；重跑 dw-stats 校验 total/registered/exposed"
      - "验证：tools/q2_probe.py --composition data-warehouse 2/2 + composition.py validate --all --strict"
    last_drilled: "pending（需在 11-16 前演练一次）"
  health_probe:
    tool: tools/q2_probe.py
    endpoints:
      - http://127.0.0.1:8091/api/dw/stats
      - http://127.0.0.1:8091/api/dw/search?q=__none__
    last_checked: "2026-11-03T22:18:00+08:00"
    last_result: ok
  slo_alert:
    tool: tools/q2_slo_alert.py
    owner: ARCH1
    checks:
      - registered_ratio>=0.95
      - exposed_ratio>=0.80
    last_checked: "2026-11-03T22:45:51+08:00"
    last_result: alert
    alert_reason: "registration 84.4% / exposed 22.9%; DWH-103 gap not closed"
  validated: false
  source: "dataset_inventory_20261102.json + WP-I3 回执 + DWH-104 四源对账（2026-11-02）"
