    - "PIT 与幸存者偏差为硬门槛：策略结论必须附 PIT 全池 + 容量 + 成本三件套。"
    - "2026-11-02 策略线结项：修正 PIT/幸存者偏差后无统计显著超额，待团队复核去留。"
    - "W1 引用收口（2026-11-02）：9 条 strategy/v1-* 按 PG v2_strategy 在 strategy_portfolio 增 planned 登记；dk→double_knife、page/strategies→market_strategy、dataset/dir→tushare 校正；strategy_registry 口径未覆盖（保持 planned）。"
