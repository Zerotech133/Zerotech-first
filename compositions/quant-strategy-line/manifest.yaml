apiVersion: zerobound/v1
kind: Composition
metadata:
  id: quant-strategy-line
  name: 量化策略线
  version: 1.0.0
  owner: STRAT1
  lifecycle: draft
  tier: product
  host: lingjie
  description: 12 条策略（9 平台 + 3 sidecar）的研究/回测/影子/晋级与策略账本
  created: "2026-11-02"
  updated: "2026-11-02"
spec:
  kernel: ">=0.9 <2.0"
  seats:
    - ref: agent/STRAT1
    - ref: agent/ST1
    - ref: agent/STRAT2
    - ref: agent/BACK1
    - ref: agent/DATA1
  skills:
    - ref: skill/events
    - ref: skill/datamart_read
    - ref: skill/signal_precedents
  strategies:
    - ref: strategy/v1-cn-strat-2
    - ref: strategy/v1-cn-strat-4
    - ref: strategy/v1-cn-strat-4-v7
    - ref: strategy/v1-hk-strat-7
    - ref: strategy/v1-hk-strat-8
    - ref: strategy/v1-us-strat-6
    - ref: strategy/v1-us-strat-7
    - ref: strategy/v1-crypto-strat-9
    - ref: strategy/v1-crypto-strat-11
    - ref: strategy/qpzm
    - ref: strategy/chanlun
    - ref: strategy/dk
      note: 研究态，不产每日 picks、不计产数
  data:
    requires:
      - ref: dataset/file/strategy_registry
      - ref: dataset/file/shadow_ledger
      - ref: dataset/file/paper_ledger
      - ref: dataset/file/research_hypotheses
      - ref: dataset/dir/quant_backtest_data
    contract: strategy-ledger/v1
    sla:
      strategy_count: 12
      platforms: [CN, HK, US, CRYPTO]
      shadow_observing: research_pending
      no_future_data: true
  interfaces:
    exposes:
      - http: /api/strategies
      - page: /strategies
      - page: /shadow.html
    consumes:
      - taskstore
      - llm/qwen3.5:9b
      - envelope/s21
    auth:
      public: false
      methods: [portal-token]
      roles: [A0, STRAT1, BACK1, ACAD1]
  pages:
    - ref: page/strategies
    - ref: page/shadow
  jobs:
    - ref: job/strategy-daily
    - ref: job/observe-point-review
    - ref: job/k33-shadow-check
  channels:
    - feishu
    - portal
  permissions:
    default: read-only
    write_scopes:
      - agent/STRAT1/*
      - agent/ST1/*
      - agent/STRAT2/*
      - research/hypotheses.db
    deny:
      - _vault
      - portal/data
  evidence:
    contract: strategy-ledger/v1
    pit_required: true
    survivorship_required: true
  runtime:
    service: portal-api
    endpoint: http://127.0.0.1:8091
    mode: internal-service
  slo:
    no_negative_evidence_hidden: true
    shadow_review: monthly
    research_cadence: daily
  notes:
    - "P0 影子清单；策略 12 条按 v2_strategy_ownership 归属（STRAT1=5/ST1=3/STRAT2=4）。"
    - "S1–S5 收编流水线未全部完成：Manifest 注册/Agent 化/回放/影子/授权。"
    - "PIT 与幸存者偏差为硬门槛：策略结论必须附 PIT 全池 + 容量 + 成本三件套。"
    - "2026-11-02 策略线结项：修正 PIT/幸存者偏差后无统计显著超额，待团队复核去留。"
status:
  phase: shadow
  health: unknown
  validated: false
  source: "司马徽军团组织章程 + ownership 表 + 策略收编计划 + 实测审计"
