    contract: acad1-pool/v1
    sla:
      # ACL-102 v1.1 校准（2026-11-02）：SLA 四字段唯一落点=此处，不双写 spec.slo。
      # 口径源：2026-10-31 老田《ACAD1 日复核 30 与数据源方案》配额 CN12/HK10/US6/CRYPTO2=30；
      #        freshness/lag 1 天；evidence 26h = 1 天 data_date 滞后 ×24h + 2h 日管线余量。
      # 回归：agent_platform/tests/test_academy_wiring.py::AcademyPoolSlaTests（4 例，ACL-101）。
      freshness_days: 1
      pool_max: 30
      evidence_max_age_h: 26
      data_date_lag_days: 1
  interfaces:
    exposes:
      - http: /api/acad1/pool
      - http: /quant-api/api/v1/acad1-research   # 8734 宿主入口→8105 原生 /api/v1/acad1-research（auth_request）
      - page: /academy/shuijing
    consumes:
      - taskstore
      - llm/glm-5.3
      - envelope/s21
      - job/zhice-daily-research-ops
    auth:
      public: false
      methods: [portal-token, internal-key]
      roles: [A0, ACAD1, ARCH1, D1]
  pages:
    - ref: page/academy/shuijing
    - ref: page/acad1/pool
  jobs:
    - ref: job/zhice-daily-research-ops
      note: 16 步日管线；计划任务 ZhiceAcad1Pool 每日 17:00（2026-11-02 实测 NextRun 17:00）
    - ref: job/academy-intake-brief
      note: 计划任务 AcademyIntakeBrief；周一 09:30（实测 NextRun 2026-11-02 09:30）
    - ref: job/academy-review
      note: 计划任务 AcademyReview；周三 15:00（实测 NextRun 2026-11-04 15:00）
    - ref: job/academy-weekly-report
      note: 计划任务 AcademyWeeklyReport；周五 16:00（实测 NextRun 2026-11-06 16:00）
  channels:
    - feishu
    - portal
  permissions:
    default: read-only
    write_scopes:
      - agent/ACAD1/*
      - agent_platform/data/academy/**
    deny:
      - portal/data
      - quant_backtest/data
      - _vault
  evidence:
    bundle_schema: acad1-evidence/v1
    readonly: true
  runtime:
    service: quant-api
    endpoint: http://127.0.0.1:8105
    mode: internal-service
  slo:
    daily_rc: 0
    pool_consistency: pg-vs-projection
    review_cards_before_freeze: 13
    human_decision_only: true
  notes:
