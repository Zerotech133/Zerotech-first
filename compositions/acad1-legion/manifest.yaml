  skills:
    - ref: skill/events
    - ref: skill/datamart_read
    - ref: skill/stock_info
    - ref: skill/pool_rows
  strategies:
    - ref: strategy/v1-cn-strat-2
    - ref: strategy/v1-cn-strat-4
    - ref: strategy/v1-hk-strat-7
    - ref: strategy/v1-us-strat-6
    - ref: strategy/v1-crypto-strat-9
  data:
