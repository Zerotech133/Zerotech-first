  host: lingjie
  description: ACAD1 选股研究治理军团（11 席 + 策略研究/验证/复核；30 卡池 CN12/HK10/US6/CRYPTO2；SLA freshness 1d / pool 30 / evidence≤26h / data_date lag 1d）
  created: "2026-11-02"
  updated: "2026-11-02"
spec:
  kernel: ">=0.9 <2.0"
  seats:
    - ref: agent/ACAD1
      note: 军团长/研究院院长（glm/glm-5.3）
    - ref: agent/STRAT1
    - ref: agent/ST1
    - ref: agent/STRAT2
    - ref: agent/BACK1
    - ref: agent/DATA1
    - ref: agent/AI1
    - ref: agent/PROD1
    - ref: agent/COMM1
    - ref: agent/INTEL1
    - ref: agent/LUSU1
