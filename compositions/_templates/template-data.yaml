    sla: { freshness_required: true }
  interfaces:
    exposes:
      - http: /api/dw/stats
    auth: { public: false, methods: [portal-token] }
  pages: []
  jobs: []
  channels: [portal]
  permissions:
    default: read-only
    write_scopes: [tools/datawarehouse/**]
    deny: [quant_backtest/data, _vault]
  runtime: { service: portal-api, endpoint: http://127.0.0.1:8091, mode: internal-service }
  slo: { datasets: 0 }
status: { phase: shadow, health: unknown, validated: false }
