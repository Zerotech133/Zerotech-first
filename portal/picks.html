<style>

</style>

<script>
let DATA=null, FILTER_T="", FILTER_M="", Q="", LIMIT=120;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tick(){ $("#clock").textContent=new Date().toLocaleString("zh-CN",{hour12:false}); }
setInterval(tick,1000); tick();

/* ── 市场判别：按 code 形态 ── */
function marketOf(code){
  const c=String(code||"").toUpperCase();
  if(c.endsWith(".SH")) return {key:"A", chip:"A股·沪", cls:"mka"};
  if(c.endsWith(".SZ")) return {key:"A", chip:"A股·深", cls:"mka"};
  if(c.endsWith(".BJ")) return {key:"A", chip:"北交所", cls:"mkbj"};
  if(c.endsWith(".HK")) return {key:"HK", chip:"港股", cls:"mkhk"};
  if(c.includes("USDT")||c.includes("/USD")) return {key:"CRYPTO", chip:"加密", cls:"mkcry"};
  if(c.startsWith("GB_")) return {key:"US", chip:"美股", cls:"mkus", bare:c.slice(3)};
  if(/^[A-Z]{1,5}$/.test(c)) return {key:"US", chip:"美股", cls:"mkus", bare:c};
  return {key:"X", chip:"其他", cls:"mkx"};
}
const MKT_DEF=[["A","A股","var(--red-500)"],["US","美股","var(--blu-500)"],["HK","港股","var(--pur-500)"],["CRYPTO","加密","var(--org-400)"],["X","其他","var(--gray-5)"]];
const SRC_LABEL={strong:"强势板块",weak:"弱势失速",chanlun:"缠论信号",qpzm:"青萍之末",ninedim:"九维评分",cross:"交叉共振",linkage:"板块联动"};

/* ── 解读词典：信号 tag → 大白话 ── */
const TAG_GLOSS={
 "strong|板块领涨":"当期扫描中该板块整体走强，此股是板块内的领涨头羊（强者恒强口径）",
 "strong|逆板块强势":"板块整体偏弱，但此股逆势走强——个股 α 显著强于板块 β",
 "weak|深度垫底":"板块内超额收益深度垫底，属反向预警/避雷参考，不是做多信号",
 "weak|强失速":"前期强势股近期超额快速回落——动量失速警示，防补跌",
 "weak|强失速+深度垫底":"前期强势已失速、当前又深度垫底，双重弱势警示",
 "chanlun|1买":"日线下跌衰竭段的第一类买点（左侧抄底，必须带止损纪律）",
 "chanlun|2买":"一买后回踩不创新低的第二类买点（右侧初步确认，胜率优于1买）",
 "chanlun|3买":"中枢上沿回踩不回中枢的第三类买点（趋势加速确认，追强势口径）",
 "chanlun|1卖":"上涨衰竭段的第一类卖点（左侧减仓信号）",
 "chanlun|2卖":"一卖后反抽不创新高的第二类卖点（右侧确认离场）",
 "chanlun|3卖":"中枢下沿反抽不回中枢的第三类卖点（趋势下跌确认，回避）",
 "qpzm|买入":"青萍之末（RPS 强度+技术+环境）综合达买入阈值",
 "qpzm|观察":"青萍之末综合分进入观察区，未达买入阈值",
 "qpzm|回避":"青萍之末综合判定回避（强度/技术/环境偏弱）",
 "ninedim|九维候选(影子未出分)":"九维模型候选池，正式分未出（影子状态，数据覆盖不足）",
 "cross|多策略共振":"同一交易日被多个独立策略同时命中——信号可信度加权",
};
const TIER_GLOSS={
 T1:"多策略同日命中，信号互相印证——核心观察池，优先深入研究",
 T2:"单策略命中但分值/信号强度高——高价值候选",
 CROWD:"九维高分拥挤警报（K33 实证：高分=拥挤非买入）——回避/降仓标记，勿当候选",
 T3:"单策略命中——一般观察池"};

function glossOf(s){ return TAG_GLOSS[(s.s||"")+"|"+(s.tag||"")]||""; }

/* ── 解读引擎：字段 → 大白话句子 ── */
function srcInterp(s){
  const out=[];
  if(s.ex250!=null)out.push(`250 日超额收益 <b class="num">+${s.ex250}pp</b>——长期动量扎实，跑赢基准`);
  if(s.ex!=null)out.push(`当前超额 <b class="num">${s.ex}%</b>${s.rank_in?` · 板块内排名 <b class="num">${esc(s.rank_in)}</b>`:""}——排名越靠后越弱（此源仅作避雷/反向参考）`);
  if(s.rps50!=null)out.push(`50 日相对强度百分位 <b class="num">${s.rps50}</b>——跑赢全市场 <b class="num">${s.rps50}%</b> 的标的`);
  if(s.cov!=null)out.push(`九维数据覆盖率 <b class="num">${(s.cov*100).toFixed(0)}%</b>${s.score==null?"——覆盖不足，正式分未出，先按影子候选跟踪":""}`);
  if(s.score!=null&&s.s==="qpzm")out.push(`综合 <b class="num">${s.score}</b> 分 · 技术 ${s.tech!=null?s.tech:"—"} · 环境 ${s.env!=null?s.env:"—"} · RPS ${s.rps!=null?s.rps:"—"}${s.added?` · 入池日 ${esc(s.added)}`:""}`);
  if(s.score!=null&&s.s==="ninedim")out.push(`影子分 <b class="num">${s.score}</b>——未正式定级，仅作排序参考`);
  if(s.entry_px!=null)out.push(`缠论参考介入价 <b class="num">${s.entry_px}</b>${s.tbe===true||s.tbe==="true"?" · <b>背驰确认</b>":(s.tbe&&s.tbe!=="false"?` · ${esc(s.tbe)}`:"")}${s.dt?` · 信号日 <b class="num">${esc(s.dt)}</b>`:""}`);
  if(s.hits!=null)out.push(`同日命中策略：<b>${esc(Array.isArray(s.hits)?s.hits.join("、"):String(s.hits))}</b>`);
  return out.map(t=>`<div class="interp">💡 ${t}</div>`).join("");
}
function clInterp(cl){
  const out=[];
  const px=+cl.px, stop=+cl.stop, tp1=+cl.tp1, tp2=+cl.tp2;
  if(!isNaN(px)&&!isNaN(stop)&&!isNaN(tp2)&&px>stop){
    const rr1=isNaN(tp1)?null:Math.abs((tp1-px)/(px-stop));
    const rr2=Math.abs((tp2-px)/(px-stop));
    if(rr1!=null)out.push(`盈亏比：至 TP1 ≈ <b class="num">${rr1.toFixed(2)}:1</b>${rr1<1?"（赔率不足，动手性价比低）":rr1<2?"（中性）":"（赔率占优）"}，至 TP2 ≈ <b class="num">${rr2.toFixed(2)}:1</b>`);
    const sp=+cl.stop_pct, t1p=+cl.tp1_pct, t2p=+cl.tp2_pct;
    const dist=[];
    if(!isNaN(sp))dist.push(`距止损 <b class="num">${cl.stop_pct}%</b>`);
    if(!isNaN(t1p))dist.push(t1p<0?"TP1 <b>已兑现</b>":`距 TP1 <b class="num">+${t1p}%</b>`);
    if(!isNaN(t2p))dist.push(t2p<0?"TP2 <b>已兑现</b>":`距 TP2 <b class="num">+${t2p}%</b>`);
    out.push(`空间刻度：${dist.join(" · ")}——止损是铁律位，触发即离场`);
  }
  const ps=cl.pivot_state||"";
  if(ps.includes("构建"))out.push("中枢尚在构建、方向未选择——等价格离开中枢的方向明确再动手");
  else if(ps.includes("上"))out.push("价格已从中枢向上离开——日线级别上行结构进行中，回踩不破中枢上沿则结构有效");
  else if(ps.includes("下"))out.push("价格已从中枢向下离开——日线级别下行结构进行中，回避反弹");
  return out.map(t=>`<div class="interp">💡 ${t}</div>`).join("");
}
function quoteInterp(q){
  if(!q||q.low==null||q.high==null||q.px==null||!(+q.high>+q.low))return "";
  const p=(+q.px-+q.low)/(+q.high-+q.low)*100;
  return `<div class="interp">💡 收在日内区间 <b class="num">${p.toFixed(0)}%</b> 分位${p>=70?"——强势收盘（接近日内高点，多头掌控）":p<=30?"——弱势收盘（接近日内低点，空头占优）":"——中性位置"}${q.amount?` · 当日成交额 <b class="num">${(+q.amount/1e8).toFixed(2)} 亿</b>`:""}</div>`;
}
function nbInterp(nb){
  if(!nb.verdict)return "";
  const n=nb.n_reasons||(nb.reasons||[]).length;
  return `<div class="interp">💡 决策链口径：每条 = 一个未满足的买入条件，「当前 → 需要」即补齐路径；共 <b class="num">${n}</b> 条压制，${nb.hard_no?"含<b>硬性否决</b>（铁律一票否决，其他条件再好也不放行）":"无硬性否决（条件补齐自动解除）"}</div>`;
}
function volInterp(ve){
  const out=[];
  (ve||[]).slice(0,3).forEach(e=>{
    if((e.tag||"").includes("巨量"))out.push(`<b class="num">${esc(e.date)}</b> 出现巨量（<b class="num">×${esc(e.mult)}</b> 常量，当日 ${esc(e.pct)}%）——异动放大，若是启动量则有关注价值，需后续量能确认`);
    else out.push(`<b class="num">${esc(e.date)}</b> ${esc(e.tag||"量能事件")}（×${esc(e.mult)}，${esc(e.pct)}%）`);
  });
  return out.map(t=>`<div class="interp">💡 ${t}</div>`).join("");
}

function tierBadge(t){ return `<div class="tier ${t}">${t}</div>`; }
function fmtPct(v){ if(v==null||v==="")return '<span class="dim">—</span>';
  const n=+v; const cls=n>0?"up":(n<0?"dn":"");
  return `<span class="${cls} num">${n>0?"+":""}${n.toFixed(2)}</span>`; }
function fmtPx(v){ return v==null?'<span class="dim">—</span>':`<span class="num">${(+v).toFixed(2)}</span>`; }
function srcTag(s){
  const t=s.tag||s.s; let cls="";
  if(/买/.test(t)&&!/回避|卖/.test(t))cls="buy";
  else if(/卖|回避/.test(t))cls="sell";
  else if(/领涨|共振/.test(t))cls="hot";
  const extra=s.score!=null?` ${s.score}`:"";
  const g=glossOf(s);
  return `<span class="tag ${cls}"${g?` title="${esc(g)}"`:""}>${esc(s.s)}·${esc(t)}${extra}</span>`;
}

/* ── 刻度条：统一 lo–hi 标尺 + 竖线游标 ── */
function levelBar(lo,hi,pts,grad){
  if(!(hi>lo))return "";
  const pos=v=>Math.max(0,Math.min(100,(v-lo)/(hi-lo)*100));
  return `<div class="gauge"><div class="gbar ${grad?"gstop-tp":""}"></div>`+
    pts.map(p=>`<div class="gm ${p.cls||""}" style="left:${pos(p.v).toFixed(1)}%"><em>${esc(p.label)}</em><i></i><b>${p.v}</b></div>`).join("")+
    `</div>`;
}
/* ── 策略命中卡：来源 + 关键指标 + 命中理由 + 大白话解读 ── */
function srcCard(s){
  const bits=[];
  ["block","band","cov","rps50","ex250","ex","rank_in"].forEach(k=>{
    if(s[k]!=null)bits.push(`${k}=${s[k]}`);});
  const rs=(s.reasons||[]).map(r=>`<li>${esc(r)}</li>`).join("");
  const g=glossOf(s);
  return `<div class="srccard"><div class="sh">
      <span class="srcname">${esc(SRC_LABEL[s.s]||s.s)}</span>${srcTag(s)}</div>
    ${g?`<div class="interp">💡 ${esc(g)}</div>`:""}
    ${bits.length?`<div class="kv" style="margin-top:7px">${bits.map(b=>`<span>${esc(b)}</span>`).join("")}</div>`:""}
    ${rs?`<ul>${rs}</ul>`:""}
    ${srcInterp(s)}</div>`;
}

async function pickDetail(code, el){
  document.querySelectorAll(".lrow").forEach(x=>x.classList.remove("sel"));
  if(el)el.classList.add("sel");
  const d=$("#detail"); d.style.display="block";
  d.innerHTML='<div class="loading">抓取事实包…</div>';
  d.scrollIntoView({behavior:"smooth",block:"nearest"});
  let f=null;

       if(res.ok)f=await res.json(); }catch(e){}
  const row=(DATA.stocks||[]).find(r=>r.code===code)||{};
  const mk=marketOf(code);
  const q=(f&&f.quote)||null;
  const cl=(f&&f.chanlun)||{};
  const nb=(f&&f.no_buy_reasons)||{};
  /* 1) 头部：层 + 市场徽标 + 名称代码行业 + 价格 */
  let html=`<div class="dhead">
    ${tierBadge(row.tier||"?")}
    <div class="mkt ${mk.cls}" style="padding:4px 12px;font-size:11px">${mk.chip}</div>
    <h3>${esc(f&&f.name||row.name||code)}</h3>
    <span class="code dim">${esc(mk.bare||code)}</span>
    <span class="ind">${esc(row.industry||"")}</span>
    <span class="dpx">${fmtPx(q&&q.px!=null?q.px:row.close)}</span>
    ${fmtPct(q&&q.pct!=null?q.pct:row.pct_chg)}
    <span class="dclose" title="收起" onclick="closeDetail()">✕ 收起</span>
  </div>
  <div class="dmeta">事实包 ${f?("ts="+esc(f.ts)):"<b>未生成</b>"} · 命中 ${(row.sources||[]).length} 策略 · 扫描日 ${esc(DATA.scan_run_date)} · 基准 ${esc(DATA.trade_basis)}</div>`;
  /* 1.5) 综合解读卡：层级 / 结构 / 决策 三行大白话 */
  const rl=[];
  if(TIER_GLOSS[row.tier])rl.push(["层级",`<b>${esc(row.tier)}</b>：${esc(TIER_GLOSS[row.tier])}`]);
  const ct=(row.sources||[]).find(s=>s.s==="chanlun");
  if(ct){const trendTxt={up:"上行",down:"下行"}[ct.trend]||ct.trend||"—";
    rl.push(["结构",`缠论 <b>${esc(ct.tag)}</b>（${esc(trendTxt)}${ct.dt?` · 信号日 ${esc(ct.dt)}`:""}）${ct.entry_px!=null?`，参考介入价 <b class="num">${esc(ct.entry_px)}</b>`:""}——${esc(glossOf(ct))}`]);}
  if(nb.verdict)rl.push(["决策",`决策链判定 <b>${esc(nb.verdict)}</b>——各条件「当前 → 需要」补齐路径见下方不买决策链明细`]);
  else if(cl.stop!=null&&cl.tp2!=null)rl.push(["空间",`缠论刻度：止损 <b class="num">${cl.stop}</b> → TP1 <b class="num">${cl.tp1||"—"}</b> → TP2 <b class="num">${cl.tp2}</b>`]);
  if(rl.length)html+=`<div class="readbox">${rl.map(r=>`<div class="rl"><span class="rk">${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>`;
  /* 2) 刻度条：日内区间 + 缠论止损/目标位阶 */
  let gauges="";
  if(q&&q.low!=null&&q.high!=null&&q.px!=null&&+q.high>+q.low){
    const pts=[{v:+q.px,label:"现价",cls:"gnow"}];
    if(q.open!=null)pts.push({v:+q.open,label:"开盘",cls:"gdim"});
    gauges+=`<div class="gbox"><div class="glab">日内区间 <b class="num">${q.low} – ${q.high}</b></div>`+
      levelBar(+q.low,+q.high,pts,false)+quoteInterp(q)+`</div>`;
  }
  if(cl.stop!=null&&cl.tp2!=null){
    const lows=[+cl.stop,+cl.dzd,+cl.mzd].filter(v=>!isNaN(v)&&v!=null);
    const his=[+cl.tp2,+cl.dzg,+cl.mzg].filter(v=>!isNaN(v)&&v!=null);
    const lo=Math.min(...lows), hi=Math.max(...his);
    if(hi>lo){
      const pts=[{v:+cl.stop,label:"止损",cls:"gstop"}];
      if(cl.tp1!=null)pts.push({v:+cl.tp1,label:"TP1",cls:"gtp"});
      pts.push({v:+cl.tp2,label:"TP2",cls:"gtp"});
      if(cl.px!=null&&!isNaN(+cl.px))pts.push({v:+cl.px,label:"现价",cls:"gnow"});
      gauges+=`<div class="gbox"><div class="glab">缠论位阶 <b>${esc(cl.pivot_state||"")}</b> · ${esc(cl.basis||"")}</div>`+
        levelBar(lo,hi,pts,true)+clInterp(cl)+`</div>`;
    }
  }
  if(gauges)html+=`<div class="gaugerow">${gauges}</div>`;
  /* 3) 策略命中明细（任何市场都有）*/
  html+=`<div class="dsec">策略命中明细 · ${(row.sources||[]).length} 项</div>

  if(!f){

      :`该标的为${mk.chip}市场，暂无 A 股事实包维度（共振/缠论/筹码/公告按 A 股口径抓取）；上方策略命中明细即为当前全部信息。`}</div>`;
  }else{
    const res=f.resonance||{};
    const v=(nb.verdict||"").includes("不买")?"no":"maybe";
    const kv=(o,keys)=>`<div class="kv">${keys.filter(k=>o[k]!=null).map(k=>`<span>${k}=${o[k]}</span>`).join("")||'<span class="dim">—</span>'}</div>`;
    html+=`<div class="dgrid">
    <div class="dbox"><h4>共振四维</h4>
      ${res.score!=null?`<div style="font-size:20px;font-weight:700" class="num">${res.score} <small class="dim" style="font-size:12px;font-weight:400">${esc(res.action||"")}</small></div>`:'<div class="dim">无评分</div>'}
      ${kv(res,["dims","tech","jev","rps","env","longs"])}</div>
    <div class="dbox"><h4>缠论结论</h4>
      ${cl&&Object.keys(cl).length?kv(cl,["daily","m30","type","trend","pivot_state","basis","tpb","stop","tp1","tp2","stop_pct","tp1_pct","tp2_pct","dzg","dzd","mzg","mzd"]):'<div class="dim">无缠论记录</div>'}</div>
    <div class="dbox"><h4>不买决策链</h4>
      ${nb.verdict?`<div class="verdict ${v}">${esc(nb.verdict)}</div>`:'<div class="dim">无记录</div>'}
      ${(nb.reasons||[]).map(r=>`<div class="reason"><b>${esc(r.dim)}</b> · <span class="why">${esc(r.why||"")}</span><br><span class="why num">当前: ${esc(r.cur||"—")} → 需要: ${esc(r.need||"—")}</span></div>`).join("")}${nbInterp(nb)}</div>
    <div class="dbox"><h4>筹码 / 板块联动</h4>
      ${f.chips?kv(f.chips,Object.keys(f.chips).slice(0,8)):'<div class="dim">无筹码数据</div>'}
      <div style="height:8px"></div>
      ${(f.sectors||[]).length?f.sectors.slice(0,4).map(s=>`<span class="tag">${esc(s.name||s.sector||JSON.stringify(s).slice(0,30))}</span>`).join(" "):'<span class="dim">无板块记录</span>'}</div>
    <div class="dbox"><h4>公告 / 龙虎榜</h4>
      ${(f.notices||[]).length?`<ul>${f.notices.slice(0,5).map(n=>`<li>${esc(n.date||"")} ${n.url?`<a href="${esc(n.url)}" target="_blank" rel="noopener">`:""}${esc(n.title||"").slice(0,42)}${n.url?"</a>":""}</li>`).join("")}</ul>`:'<div class="dim">近期无公告</div>'}
      ${(f.lhb||[]).length?`<div style="height:6px"></div><b class="num">龙虎榜</b><ul>${f.lhb.slice(0,3).map(l=>`<li>${esc(l.date||"")} ${esc(l.reason||"").slice(0,30)}</li>`).join("")}</ul>`:""}</div>
    <div class="dbox"><h4>买点定位 / 量能事件</h4>
      ${f.entry_signal?kv(f.entry_signal,Object.keys(f.entry_signal).slice(0,6)):'<div class="dim">无 entry_signal</div>'}
      <div style="height:8px"></div>
      ${(f.vol_events||[]).length?`<ul>${f.vol_events.slice(0,5).map(e=>`<li class="num">${esc(e.date)} ${esc(e.tag||"")} ×${esc(e.mult||"")} ${esc(e.pct!=null?e.pct+"%":"")}</li>`).join("")}</ul>`:'<span class="dim">无量能事件（或 K 线源今日不可用）</span>'}
      ${volInterp(f.vol_events)}
      ${f.quote==null&&f.has_bars===false?'<div class="why dim" style="margin-top:8px">注：行情/K线外部源今日不可用，相关维度受限</div>':""}</div>
  </div>`;
  }
  d.innerHTML=html;
}
