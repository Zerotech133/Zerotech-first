<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>今日选股总览 · 老田的 AI 工作站</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="icon" href="data:,">
<!--
  今日选股聚合页（门户层 · 全策略强制扫描产物）
  数据源：portal/data/todays_picks.json（build_todays_picks.py 聚合产出）
          portal/data/pick_details/<code>.json（build_pick_details.py 分片抓取，按需）
  策略源：strong/weak/chanlun/qpzm/ninedim/cross/linkage(说明位)
  口径：2026-10-07 强制扫描，数据基准 2026-09-30 收盘（国庆休市）
  验收调试：?demo=1 渲染内置样例（不写盘、不进仓库）
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; }
  .dim { color: var(--text-dim); }
  .num { font-family: Consolas, "Courier New", monospace; }
  main { max-width: 1180px; margin: 0 auto; padding: 0 26px 56px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 48px 12px; max-width: 1180px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--blu-600), var(--pur-500)); display: grid; place-items: center; font-size: 19px; font-weight: 800; color: #fff; }
  .brand h1 { font-size: 17px; font-weight: 700; }
  .brand small { color: var(--text-dim); font-size: 10.5px; letter-spacing: 3px; display: block; margin-top: 2px; }
  .clock { font-family: Consolas, monospace; font-size: 14px; color: var(--link); }
  .topnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 48px 0; max-width: 1180px; margin: 0 auto; }
  .pill { display: inline-block; padding: 7px 15px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-dim); text-decoration: none; font-size: 13px; background: var(--bg-surface); transition: border-color .2s ease, color .2s ease; }
  .pill:hover { border-color: var(--link); color: var(--text); }
  .pill.on { color: var(--text); border-color: var(--link); font-weight: 700; background: var(--bg-raised); }
  /* ── 顶部态势行 ── */
  .vitals { margin-top: 24px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-m); padding: 14px 20px; display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: center; font-size: 12.5px; color: var(--text-dim); font-family: Consolas, "Microsoft YaHei", monospace; }
  .vitals b { color: var(--text); font-weight: 600; }
  /* ── 策略卡 ── */
  .strats { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 10px; margin-top: 14px; }
  .scard { background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-m); padding: 12px 14px; }
  .scard .row1 { display: flex; align-items: baseline; gap: 8px; }
  .scard .n { font-family: Consolas, monospace; font-size: 22px; font-weight: 700; }
  .scard .lab { font-size: 12.5px; font-weight: 600; }
  .scard .note { margin-top: 6px; font-size: 11px; color: var(--text-dim); line-height: 1.5; }
  .scard.off { opacity: .55; }
  /* ── 筛选 ── */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 18px 0 10px; }
  .fbtn { padding: 6px 14px; border: 1px solid var(--border); border-radius: 999px; background: var(--bg-surface); color: var(--text-dim); font-size: 12.5px; cursor: pointer; }
  .fbtn.on { color: var(--text); border-color: var(--link); font-weight: 700; background: var(--bg-raised); }
  .fbtn input { border: none; outline: none; background: transparent; color: var(--text); width: 130px; font-size: 12.5px; }
  /* ── 列表 ── */
  .lhead { display: grid; grid-template-columns: 44px 96px 1fr 92px 90px 76px 1fr; gap: 10px; padding: 8px 14px; font-size: 11.5px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
  .lrow { display: grid; grid-template-columns: 44px 96px 1fr 92px 90px 76px 1fr; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); align-items: center; cursor: pointer; background: var(--bg-surface); transition: background .15s ease; }
  .lrow:hover { background: var(--bg-raised); }
  .lrow.sel { background: var(--bg-raised); outline: 1px solid var(--link); }
  .tier { font-size: 10px; font-weight: 700; text-align: center; padding: 3px 0; border-radius: 6px; }
  .tier.T1 { background: rgba(255,90,90,.14); color: #e05555; }
  .tier.T2 { background: rgba(240,170,40,.14); color: #d09520; }
  .tier.T3 { background: rgba(120,130,150,.12); color: var(--text-dim); }
  .code { font-family: Consolas, monospace; font-size: 12.5px; }
  .sname { font-weight: 600; }
  .sname small { color: var(--text-dim); font-weight: 400; margin-left: 6px; }
  .up { color: #e05555; } .dn { color: #2aa877; }
  .tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .tag { font-size: 10px; padding: 2px 9px; border-radius: 999px; border: 1px dashed var(--border); color: var(--text-dim); font-weight: 400; white-space: nowrap; }
  .tag.hot { color: var(--color-warn); border-color: var(--color-warn); }
  .tag.buy { color: #e05555; border-color: #e05555; }
  .more { text-align: center; padding: 12px; color: var(--link); font-size: 13px; cursor: pointer; }
  /* ── 详情面板 ── */
  .detail { margin-top: 16px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-m); padding: 18px 22px; display: none; }
  .detail h3 { font-size: 16px; margin-bottom: 4px; }
  .detail .sub { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .dbox { border: 1px solid var(--border); border-radius: var(--r-m); padding: 12px 14px; font-size: 12.5px; }
  .dbox h4 { font-size: 12px; color: var(--text-dim); font-weight: 600; margin-bottom: 8px; letter-spacing: 1px; }
  .dbox ul { list-style: none; }
  .dbox li { padding: 3px 0; line-height: 1.55; }
  .kv { display: flex; gap: 6px; flex-wrap: wrap; font-family: Consolas, monospace; font-size: 12px; }
  .kv span { background: var(--bg-raised); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; }
  .verdict { font-weight: 700; padding: 5px 10px; border-radius: 8px; display: inline-block; margin-bottom: 8px; font-size: 13px; }
  .verdict.no { background: rgba(255,90,90,.12); color: #e05555; }
  .verdict.maybe { background: rgba(240,170,40,.12); color: #d09520; }
  .reason { padding: 6px 0; border-top: 1px dashed var(--border); line-height: 1.6; }
  .reason b { font-size: 12px; }
  .reason .why { color: var(--text-dim); font-size: 12px; }
  .loading { color: var(--text-dim); font-size: 13px; padding: 20px 0; }
  .foot { margin-top: 26px; font-size: 11.5px; color: var(--text-dim); line-height: 1.7; border-top: 1px solid var(--border); padding-top: 14px; }
  @media (max-width: 900px) {
    .lhead { display: none; }
    .lrow { grid-template-columns: 40px 1fr 80px; }
    .lrow > :nth-child(4), .lrow > :nth-child(5), .lrow > :nth-child(6) { display: none; }
    .dgrid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">田</div>
    <div><h1>今日选股总览</h1><small>QUANT PICKS · 全策略强制扫描</small></div>
  </div>
  <div class="clock num" id="clock"></div>
</header>
<nav class="topnav">
  <a class="pill" href="/">🏠 首页</a>
  <a class="pill on" href="/picks.html">🎯 今日选股</a>
  <a class="pill" href="/strong.html">💪 板块强弱</a>
  <a class="pill" href="/quant">📈 量化</a>
  <a class="pill" href="/intel">🧠 情报</a>
  <a class="pill" href="/creator">✨ 创作者</a>
  <a class="pill" href="/dev.html">🧪 工作台</a>
  <a class="pill" href="/ops">⚙ 系统</a>
</nav>
<main>
  <div class="vitals" id="vitals">加载中…</div>
  <div class="strats" id="strats"></div>
  <div class="filters" id="filters">
    <button class="fbtn on" data-t="">全部</button>
    <button class="fbtn" data-t="T1">T1 多策略共振</button>
    <button class="fbtn" data-t="T2">T2 高价值</button>
    <button class="fbtn" data-t="T3">T3 单策略</button>
    <button class="fbtn"><input id="q" placeholder="搜索代码/名称"></button>
  </div>
  <div class="lhead">
    <div>层</div><div>代码</div><div>名称 / 行业</div><div>现价</div><div>涨跌%</div><div>命中</div><div>策略标签</div>
  </div>
  <div id="list"></div>
  <div class="more" id="more" style="display:none">展开更多 ↓</div>

  <div class="detail" id="detail"></div>

  <div class="foot" id="foot"></div>
</main>
<script>
let DATA=null, FILTER_T="", Q="", LIMIT=120;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function tick(){ $("#clock").textContent=new Date().toLocaleString("zh-CN",{hour12:false}); }
setInterval(tick,1000); tick();

function tierBadge(t){ return `<div class="tier ${t}">${t}</div>`; }
function fmtPct(v){ if(v==null||v==="")return '<span class="dim">—</span>';
  const n=+v; const cls=n>0?"up":(n<0?"dn":"");
  return `<span class="${cls} num">${n>0?"+":""}${n.toFixed(2)}</span>`; }
function fmtPx(v){ return v==null?'<span class="dim">—</span>':`<span class="num">${(+v).toFixed(2)}</span>`; }
function srcTag(s){
  const t=s.tag||s.s; let cls="";
  if(/买/.test(t)&&!/回避/.test(t))cls="buy";
  else if(/领涨|共振/.test(t))cls="hot";
  const extra=s.score!=null?` ${s.score}`:"";
  return `<span class="tag ${cls}">${esc(s.s)}·${esc(t)}${extra}</span>`;
}

function renderVitals(){
  const c=DATA.counts, m=DATA.strategies;
  $("#vitals").innerHTML =
    `<span>扫描日 <b>${DATA.scan_run_date}</b></span>`+
    `<span>数据基准 <b>${esc(DATA.trade_basis)}</b></span>`+
    `<span>清单 <b>${c.total}</b></span>`+
    `<span>T1 共振 <b>${c.T1_resonance}</b></span>`+
    `<span>T2 高价值 <b>${c.T2_high_value}</b></span>`+
    `<span>T3 单策略 <b>${c.T3_single}</b></span>`+
    `<span>生成 <b>${DATA.generated_at}</b></span>`;
  const cards=["strong","weak","chanlun","qpzm","ninedim","cross","linkage"].map(k=>{
    const s=m[k]||{};
    const n=s.n==null?"—":s.n;
    return `<div class="scard ${s.ok===false||s.n==null?"off":""}">
      <div class="row1"><div class="n num">${n}</div><div class="lab">${esc(s.label||k)}</div></div>
      <div class="note">${esc(s.note||"")}</div></div>`;
  }).join("");
  $("#strats").innerHTML=cards;
  $("#foot").innerHTML =
    `数据管道：build_todays_picks.py 聚合 quant_backtest 六策略产物 → portal/data/todays_picks.json；`+
    `个股详情 build_pick_details.py 分片抓取 collect_facts 事实包（共振/缠论/筹码/板块/公告/龙虎榜/不买决策链）→ data/pick_details/。`+
    `点击任一行查看详情。本页仅做展示与降级，不内置拷贝逻辑（与 strong.html 管道约定一致）。`;
}

function matchRows(){
  let rows=DATA.stocks||[];
  if(FILTER_T) rows=rows.filter(r=>r.tier===FILTER_T);
  if(Q){ const q=Q.toLowerCase();
    rows=rows.filter(r=>(r.code||"").toLowerCase().includes(q)||(r.name||"").includes(Q)); }
  return rows;
}
function renderList(){
  const rows=matchRows();
  const show=rows.slice(0,LIMIT);
  $("#list").innerHTML=show.map((r,i)=>`
    <div class="lrow" data-code="${esc(r.code)}" data-i="${i}">
      ${tierBadge(r.tier)}
      <div class="code">${esc(r.code)}</div>
      <div class="sname">${esc(r.name)}<small>${esc(r.industry||"")}</small></div>
      ${fmtPx(r.close)}${fmtPct(r.pct_chg)}
      <div class="num dim">${r.n_hit}</div>
      <div class="tags">${(r.sources||[]).slice(0,4).map(srcTag).join("")}${(r.sources||[]).length>4?`<span class="tag">+${r.sources.length-4}</span>`:""}</div>
    </div>`).join("");
  $("#more").style.display=rows.length>LIMIT?"block":"none";
  $("#more").textContent=`展开更多（剩余 ${rows.length-LIMIT}）↓`;
  document.querySelectorAll(".lrow").forEach(el=>
    el.addEventListener("click",()=>pickDetail(el.dataset.code,el)));
}
function bindFilters(){
  document.querySelectorAll(".fbtn[data-t]").forEach(b=>b.addEventListener("click",()=>{
    document.querySelectorAll(".fbtn").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); FILTER_T=b.dataset.t; LIMIT=120; renderList();
  }));
  $("#q").addEventListener("input",e=>{ Q=e.target.value.trim(); LIMIT=120; renderList(); });
  $("#more").addEventListener("click",()=>{ LIMIT+=200; renderList(); });
}

/* ── 详情面板 ── */
async function pickDetail(code, el){
  document.querySelectorAll(".lrow").forEach(x=>x.classList.remove("sel"));
  if(el)el.classList.add("sel");
  const d=$("#detail"); d.style.display="block";
  d.innerHTML='<div class="loading">抓取事实包…</div>';
  d.scrollIntoView({behavior:"smooth",block:"nearest"});
  let f=null;
  try{ const res=await fetch(`data/pick_details/${encodeURIComponent(code)}.json`);
       if(res.ok)f=await res.json(); }catch(e){}
  const row=(DATA.stocks||[]).find(r=>r.code===code)||{};
  if(!f){
    d.innerHTML=`<h3>${esc(row.name||code)} <span class="code dim">${esc(code)}</span></h3>
      <div class="sub">层 ${row.tier||"?"} · 命中 ${row.n_hit||1} 策略</div>
      <div class="loading">详情事实包尚未生成（后台分片抓取中，稍后刷新本页）。</div>
      <div class="tags">${(row.sources||[]).map(srcTag).join("")}</div>`;
    return;
  }
  const res=f.resonance||{};
  const cl=f.chanlun||{};
  const nb=f.no_buy_reasons||{};
  const v=(nb.verdict||"").includes("不买")?"no":((nb.verdict||"").includes("观望")?"maybe":"maybe");
  const kv=(o,keys)=>`<div class="kv">${keys.filter(k=>o[k]!=null).map(k=>`<span>${k}=${o[k]}</span>`).join("")||'<span class="dim">—</span>'}</div>`;
  d.innerHTML=`
  <h3>${esc(f.name||row.name||code)} <span class="code dim">${esc(code)}</span></h3>
  <div class="sub">事实包 ts=${esc(f.ts)} · 层 ${esc(f.tier||row.tier||"?")} · 来源 ${(f.sources||row.sources||[]).map(srcTag).join(" ")}</div>
  <div class="dgrid">
    <div class="dbox"><h4>共振四维</h4>
      ${res.score!=null?`<div style="font-size:20px;font-weight:700" class="num">${res.score} <small class="dim" style="font-size:12px;font-weight:400">${esc(res.action||"")}</small></div>`:'<div class="dim">无评分</div>'}
      ${kv(res,["dims","tech","jev","rps","env","longs"])}</div>
    <div class="dbox"><h4>缠论结论</h4>
      ${cl&&Object.keys(cl).length?kv(cl,["daily","m30","type","trend","px","zg","zd"]):'<div class="dim">无缠论记录</div>'}</div>
    <div class="dbox"><h4>不买决策链</h4>
      ${nb.verdict?`<div class="verdict ${v}">${esc(nb.verdict)}</div>`:'<div class="dim">无记录</div>'}
      ${(nb.reasons||[]).map(r=>`<div class="reason"><b>${esc(r.dim)}</b> · <span class="why">${esc(r.why||"")}</span><br><span class="why num">当前: ${esc(r.cur||"—")} → 需要: ${esc(r.need||"—")}</span></div>`).join("")}</div>
    <div class="dbox"><h4>筹码 / 板块联动</h4>
      ${f.chips?kv(f.chips,Object.keys(f.chips).slice(0,8)):'<div class="dim">无筹码数据</div>'}
      <div style="height:8px"></div>
      ${(f.sectors||[]).length?f.sectors.slice(0,4).map(s=>`<span class="tag">${esc(s.name||s.sector||JSON.stringify(s).slice(0,30))}</span>`).join(" "):'<span class="dim">无板块记录</span>'}</div>
    <div class="dbox"><h4>公告 / 龙虎榜</h4>
      ${(f.notices||[]).length?`<ul>${f.notices.slice(0,5).map(n=>`<li>${esc(n.date||"")} ${esc(n.title||"").slice(0,42)}</li>`).join("")}</ul>`:'<div class="dim">近期无公告</div>'}
      ${(f.lhb||[]).length?`<div style="height:6px"></div><b class="num">龙虎榜</b><ul>${f.lhb.slice(0,3).map(l=>`<li>${esc(l.date||"")} ${esc(l.reason||"").slice(0,30)}</li>`).join("")}</ul>`:""}</div>
    <div class="dbox"><h4>买点定位 / 量能事件</h4>
      ${f.entry_signal?kv(f.entry_signal,Object.keys(f.entry_signal).slice(0,6)):'<div class="dim">无 entry_signal</div>'}
      <div style="height:8px"></div>
      ${(f.vol_events||[]).length?`<ul>${f.vol_events.slice(0,5).map(e=>`<li class="num">${esc(e.date)} ${esc(e.tag||"")} ×${esc(e.mult||"")} ${esc(e.pct!=null?e.pct+"%":"")}</li>`).join("")}</ul>`:'<span class="dim">无量能事件（或 K 线源今日不可用）</span>'}
      ${f.quote==null&&f.has_bars===false?'<div class="why dim" style="margin-top:8px">注：行情/K线外部源今日不可用，相关维度受限</div>':""}</div>
  </div>`;
}

function render(data){ DATA=data; renderVitals(); bindFilters(); renderList(); }

async function boot(){
  if(new URLSearchParams(location.search).get("demo")==="1"){
    render({generated_at:"demo",scan_run_date:"demo",trade_basis:"内置样例",
      counts:{total:3,T1_resonance:1,T2_high_value:1,T3_single:1},
      strategies:{strong:{label:"强势板块领涨",n:2,note:"demo"},weak:{label:"弱势失速",n:1,note:"demo"},
        chanlun:{label:"缠论信号池",n:1,note:"demo"},qpzm:{label:"青萍之末",n:1,note:"demo"},
        ninedim:{label:"九维评分",n:1,note:"demo"},cross:{label:"交叉共振",n:1,note:"demo"},
        linkage:{label:"板块联动",n:null,note:"个股级工具，无全市场扫描口径"}},
      stocks:[
        {code:"603995.SH",name:"甬金股份",industry:"特种钢",close:33.5,pct_chg:2.4,n_hit:4,tier:"T1",
         sources:[{s:"strong",tag:"板块领涨"},{s:"chanlun",tag:"3买"},{s:"qpzm",tag:"观察池",score:85},{s:"cross",tag:"多策略共振"}]},
        {code:"000002.SZ",name:"万科A",industry:"全国地产",close:4.26,pct_chg:4.41,n_hit:1,tier:"T2",
         sources:[{s:"ninedim",tag:"九维候选",rps50:93.5}]},
        {code:"300803.SZ",name:"指南针",industry:"软件服务",close:45.1,pct_chg:-3.2,n_hit:1,tier:"T3",
         sources:[{s:"weak",tag:"深度垫底"}]}]});
    return;
  }
  try{
    const res=await fetch("data/todays_picks.json");
    if(!res.ok)throw new Error("HTTP "+res.status);
    render(await res.json());
  }catch(e){
    $("#vitals").textContent="todays_picks.json 加载失败："+e.message+
      "（确认 build_todays_picks.py 已运行、nginx 数据副本管道可达）";
  }
}
boot();
</script>
</body>
</html>
