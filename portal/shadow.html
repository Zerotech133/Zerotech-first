<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影子盘总览 · 零界</title>
<link rel="stylesheet" href="/static/nav.css">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2333;--bd:#2d333b;--fg:#e6edf3;--dim:#8b949e;--acc:#58a6ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;padding:24px;max-width:1200px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}h1 small{color:var(--dim);font-size:13px;font-weight:normal}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--bd);border-radius:8px;padding:12px}
.card .k{color:var(--dim);font-size:12px}.card .v{font-size:18px;font-weight:700;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:7px 8px;text-align:left}th{color:var(--dim);font-weight:600}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.b-ok{background:#12301c;color:var(--ok)}.b-warn{background:#2b2410;color:var(--warn)}.b-bad{background:#2a1512;color:var(--bad)}.b-info{background:#122642;color:#79c0ff}
.muted{color:var(--dim);font-size:12px}code{background:#0a0e14;padding:1px 6px;border-radius:4px;color:#79c0ff;font-size:12px}
@media(max-width:760px){body{padding:14px}table{display:block;overflow-x:auto;white-space:nowrap}}
</style>
<script src="/static/nav.js" defer></script></head>
<body>
<div id="nav"></div>
<h1>🪞 影子盘总览 <small>S08 · S11 · H14 · 统一跟踪</small></h1>
<div class="sub" id="sub">加载中…</div>

<div class="panel"><div class="cards" id="cards"></div>
<div class="muted" id="nodes" style="margin-top:10px"></div></div>

<div class="panel"><b>影子列表</b>
<table><thead><tr><th>策略</th><th>类型</th><th>状态</th><th>信号日/期</th><th>持仓</th><th>容量</th><th>期收益</th><th>超额</th><th>下次调仓/检查</th></tr></thead><tbody id="rows"></tbody></table></div>

<div class="panel"><b>挂起复核</b><ul id="reviews" style="margin:6px 0 0 18px"></ul></div>

<div class="panel"><b>边界</b><div class="muted">影子盘为研究跟踪，不构成投资建议；容量为 5% 参与率粗估；S11 容量上限 1.5 亿；S10 已因 PIT bug 作废。</div></div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  function badge(s){
    if(!s) return '<span class="badge b-info">未知</span>';
    if(s.indexOf('invalid')>=0) return '<span class="badge b-bad">作废</span>';
    if(s.indexOf('paused')>=0) return '<span class="badge b-warn">暂停</span>';
    if(s.indexOf('shadow')>=0) return '<span class="badge b-ok">影子</span>';
    if(s.indexOf('pending')>=0) return '<span class="badge b-warn">待复核</span>';
    return '<span class="badge b-info">'+s+'</span>';
  }
  fetch('/static/shadow_dashboard.json?ts='+Date.now()).then(r=>r.json()).then(function(d){
    $('sub').textContent='生成 '+d.generated_at+' · '+d.note;
    const sh=d.shadows||[];
    $('cards').innerHTML=sh.map(function(x){
      if(x.kind==='monthly_shadow'){
        return '<div class="card"><div class="k">'+x.id+'</div><div class="v" style="font-size:15px">期 '+ (x.period||'—') +'</div>'
          +'<div class="muted">'+ (x.n??'—') +' 持仓 · 陷阱 '+(x.trap_weight_pct??'—')+'%/'+(x.trap_cap_pct??'—')+'%</div></div>';
      }
      const tr=x.tracking||{};
      return '<div class="card"><div class="k">'+x.id+'</div><div class="v" style="font-size:15px">'+badge(x.status)+'</div>'
        +'<div class="muted">'+ (x.n??'—') +' 仓 · 容量 '+(x.capacity5_yi??'—')+' 亿</div>'
        +'<div class="muted">期收益 '+(tr.cur_ret_pct??'—')+'% / 超额 '+(tr.excess_pct??'—')+'%</div></div>';
    }).join('');
    $('rows').innerHTML=sh.map(function(x){
      if(x.kind==='monthly_shadow'){
        return '<tr><td>'+x.id+'</td><td>月度影子</td><td>'+badge(x.status)+'</td><td>'+(x.signal_date||'—')+'</td><td>'+(x.n??'—')+'</td><td>—</td><td>—</td><td>—</td><td>'+(x.next_check||'—')+'</td></tr>';
      }
      const tr=x.tracking||{};
      return '<tr><td>'+x.id+'</td><td>'+x.kind+'</td><td>'+badge(x.status)+'</td><td>'+(x.signal_date||'—')+'</td><td>'+(x.n??'—')+'</td>'
        +'<td>'+(x.capacity5_yi??'—')+' 亿</td><td>'+(tr.cur_ret_pct??'—')+'%</td><td>'+(tr.excess_pct??'—')+'%</td><td>'+(x.next_rebalance||'—')+'</td></tr>';
    }).join('');
    const nd=d.nodes||{};
    $('nodes').innerHTML='<b>即将到来：</b>'+Object.keys(nd).map(function(k){
      return '<div>'+k+'：'+(nd[k]||[]).join(' · ')+'</div>';
    }).join('');
    $('reviews').innerHTML=(d.pending_reviews||[]).map(function(r){
      return '<li><code>'+r.task_id+'</code> '+(r.topic||'')+'</li>';
    }).join('');
  }).catch(function(e){ $('sub').textContent='加载失败: '+e.message; });
})();
</script>
</body>
</html>
