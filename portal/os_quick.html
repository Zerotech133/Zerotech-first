<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<link rel="stylesheet" href="/static/tokens.css">
<script src="/static/nav.js" defer></script>

<style>
  .wrap{max-width:760px;margin:0 auto;padding:14px 18px 130px}
  h1{font-size:21px;margin:4px 0 2px}
  .sub{color:#5a6f83;font-size:13px;margin:0 0 8px}
  .badge{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:#e6f4f8;color:#0e7490;font-weight:700;margin-left:6px}
  .badge.warn{background:#faf3e6;color:#936224}
  .banner{border-left:4px solid #936224;background:#faf3e6;padding:7px 11px;border-radius:6px;font-size:12px;margin:6px 0 12px}
  .chat{display:flex;flex-direction:column;gap:10px}
  .msg{border-radius:16px;padding:12px 15px;font-size:14.5px;line-height:1.7;max-width:92%}
  .sys{background:#f4f9fb;border:1px solid #dbe5ee;align-self:flex-start}
  .user{background:#0e7490;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .card{border:1.5px solid #bcd8e2;background:#fff;align-self:stretch;max-width:100%}
  .card h3{margin:0 0 6px;font-size:16px;color:#0e7490}
  .list{margin:2px 0;padding-left:19px;font-size:13.5px;line-height:1.75}
  .muted{color:#5a6f83;font-size:12px}
  .pv{width:100%;height:340px;border:1px solid #dbe5ee;border-radius:12px;background:#fff;margin-top:8px}
  .err{color:#b3402e;font-size:13px;white-space:pre-wrap}
  .dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid #dbe5ee;padding:10px 14px;backdrop-filter:blur(6px);z-index:50}
  .dock .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{cursor:pointer;font:600 15px/1.2 inherit;border:0;border-radius:14px;padding:12px 18px}
  .mic{font-size:17px;padding:15px 24px;border-radius:999px;background:#0e7490;color:#fff;box-shadow:0 4px 14px rgba(14,116,144,.28)}
  .mic.listening{background:#b3402e;animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,64,46,.5)}100%{box-shadow:0 0 0 14px rgba(179,64,46,0)}}
  button.ghost{background:#fff;color:#0e7490;border:1.5px solid #bcd8e2}
  button:disabled{opacity:.5;cursor:not-allowed}

</style>
<meta name=wb-shell content=adopted></head>
<body>
<main class="wrap">
  <h1>说一句话，剩下的我来</h1>
  <p class="sub">点一下开始后自动听、自动做、自动念——<b>不用反复点按钮</b>。<span class="badge" id="asr-badge">识别方式检测中…</span></p>
  <div class="banner">默认授权：隔离环境 · 4 个可逆动作 · 24 小时 · 可撤回。推荐卡为规则辅助（非模型结论）；认领为模拟认领（未获真实认领）；不接生产/交易/外发。<span class="say" id="timer"></span></div>

  <div class="chat" id="chat">
    <div class="msg sys">您好。第 1 句说想法，第 2 句听卡说“行”，第 3 句看成果说“接受”或“这里改”。点 🎤 <b>点一下，说想法</b>，说完我会提示您再点；不会自动开麦，也不会自己回声循环。之后按提示点 🎤 说话、看结果点“按这个办”即可。</div>
  </div>

  <p class="err" id="err" hidden></p>
</main>

<div class="dock"><div class="in">
  <button class="mic" id="b-start">🎤 点一下，说想法</button>
  <button class="ghost" id="b-type">⌨️ 打字</button> <button class="ghost" id="b-textmode">⌨️ 纯文字验收</button>
  <button class="ghost" id="b-stop" hidden>⏹ 暂停</button>
  <span id="status">就绪</span>
</div></div>

<template id="type_panel_tpl">
  <div class="msg sys" id="type_panel">
    <div><b>打字模式</b>（可随时切回语音）</div>
    <textarea id="ask" placeholder="例：做个页面，让我每天打开就能看三条简报摘要"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="ghost" id="t-draft">出卡</button>
      <button class="ghost" id="t-ok" hidden>按这个办</button>
      <button class="ghost" id="t-accept" hidden>接受</button>
      <button class="ghost" id="t-change" hidden>这里改</button>
    </div>
  </div>
</template>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let DRAFT=null, ITEM=null, START=null, TICK=null, ACCEPTED=false, BUSY=false, DONE=false;
let ASR_MODE='browser', REC=null, VOICE_READY=false;
let LAST_SPEECH_NORM='', CARD_ROUNDS=0, VERDICT_ROUNDS=0, PAUSED=false;
let RECORDING=false, RECORD_STOP=null;
let TEXT_ONLY=false;
let PENDING_HANDLER=null;
let FAILS=0;
function setStatus(m){ const s=$('status'); if(s) s.textContent=String(m); }
function showErr(m){ const e=$('err'); e.hidden=false; e.textContent=String(m); }
function clearErr(){ const e=$('err'); e.hidden=true; }
function startTimer(){ if(START!==null) return; START=Date.now(); TICK=setInterval(()=>{ $('timer').textContent='已用 '+Math.round((Date.now()-START)/1000)+'s'; },1000); }
function say(role, html){ const d=document.createElement('div'); d.className='msg '+(role==='user'?'user':'sys'); d.innerHTML=html; $('chat').appendChild(d); d.scrollIntoView({block:'end',behavior:'smooth'}); return d; }
function speak(text){ try{ LAST_SPEECH_NORM=norm(String(text||'')); }catch(e){} try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=1.04; speechSynthesis.speak(u); }catch(e){} }
function stopVoice(){ try{ if(REC){ REC.onresult=null; REC.onerror=null; REC.onend=null; REC.abort(); } }catch(e){} REC=null; BUSY=false; $('b-start').classList.remove('listening'); }
function finish(){ DONE=true; stopVoice(); $('b-start').textContent='🎤 说下一件事'; $('b-start').classList.remove('listening'); setStatus('完成'); }
function pauseListening(msg){ PAUSED=true; stopVoice(); setStatus(msg||'已暂停'); say('sys', esc(msg||'已暂停')+' 点 🎤 继续，或点“打字”。'); $('b-start').textContent='🎤 继续'; }
/* ============ 识别方式：优先本地 SenseVoice（离线、高精度），失败回退浏览器 ============ */
async function ensureAsrMode(){
  try{
    const d=await (await fetch('/api/os/asr/status')).json();
    if(d && d.engine==='sensevoice_local'){
      ASR_MODE='local';
      $('asr-badge').textContent='本地高精度 · SenseVoice（离线）'; $('asr-badge').className='badge';
      if(!d.loaded){ setStatus('本地模型加载中（约 10-30 秒），加载好会提示'); }
      return;
    }
  }catch(e){}
}
async function fetchWithTimeout(url,opt,ms){
  const ctrl=new AbortController(); const to=setTimeout(()=>ctrl.abort(),ms);
  try{ return await fetch(url,Object.assign({signal:ctrl.signal},opt||{})); }
  finally{ clearTimeout(to); }
}
async function checkAsr(){
  try{
    const r=await fetch('/api/os/asr/status'); const d=await r.json();
    if(d && d.engine==='sensevoice_local'){
      ASR_MODE='local';
      if(d.loaded){
        $('asr-badge').textContent='本地高精度 · SenseVoice（离线）'; $('asr-badge').className='badge';
        setStatus('就绪（本地高精度识别）'); return;
      }
      $('asr-badge').textContent='本地模型加载中…'; $('asr-badge').className='badge';
      setStatus('本地模型加载中（约 20-30 秒；加载好我会提示）');
      for(let i=0;i<45;i++){
        await new Promise(r2=>setTimeout(r2,2000));
        try{
          const st=await (await fetch('/api/os/asr/status')).json();
          if(st.loaded){ $('asr-badge').textContent='本地高精度 · SenseVoice（离线）'; $('asr-badge').className='badge'; setStatus('本地高精度识别就绪'); say('sys','本地高精度识别就绪，可以说话了。'); return; }
          if(st.engine!=='sensevoice_local') break;
        }catch(e){ break; }
      }
      $('asr-badge').textContent='浏览器识别'; $('asr-badge').className='badge warn';
      setStatus('本地模型加载超时，已切浏览器识别'); return;
    }
    $('asr-badge').textContent='浏览器识别'; $('asr-badge').className='badge warn';
  }catch(e){ $('asr-badge').textContent='浏览器识别'; $('asr-badge').className='badge warn'; }
}
const DIALECT_WORDS={"啷个":"怎么","啥子":"什么","咋个":"怎么","晓得":"知道","莫":"不要","要得":"好","巴适":"满意","巴适得板":"满意","一哈":"一下","崽儿":"人","勒个":"这个","那哈儿":"那里","要不得":"不行","不得行":"不行","莫得":"没有"};
function dialectNormalize(t){ let out=String(t||''); for(const k in DIALECT_WORDS){ out=out.split(k).join(DIALECT_WORDS[k]); } return out; }
function norm(t){ return String(t||'').replace(/[\s，。！？、,.!?;；:："'“”‘’()（）~～]/g,''); }
function isFiller(t){ const s=norm(t); if(!s) return true; return /^[嗯啊哦呃唔唉呀吧嘛哈]+$/.test(s); }
function isStop(t){ return /^(停|停止|暂停|先停|别听|别说了|停一下)/.test(norm(t)); }
const ECHO_RE=/我理解您|默认授权|您说|如果没问题|就说行|要改就|第 [123] 句|怎么算成|做好了|改好了|满意就|这里改|直接说哪里|没听清|请说/;
function isEcho(t){ const s=norm(t); if(!s) return false; if(ECHO_RE.test(String(t))) return true; if(LAST_SPEECH_NORM && s.length>=2 && LAST_SPEECH_NORM.includes(s)) return true; return false; }
function isAccept(t){ const s=norm(t); if(isFiller(s)||isEcho(t)) return false;
  if(/要得|要的|可以噻|行噻|巴适/.test(s) && !/要不得|不巴适/.test(s)) return true;
  if(/^(行|好|可以|对|嗯|是的|没问题|按这个办|开始吧|执行|确认|就这么办|就这样|ok)$/i.test(s)) return true;
  return s.length<=12 && /按这个办|开始吧|就这么办|没问题|可以|确认/.test(s); }
function isAcceptVerdict(t){ const s=norm(t); if(isFiller(s)||isEcho(t)) return false;
  if(/^(接受|可以|好|行|满意|不错|行吧|嗯|对)$/.test(s)) return true;
  return s.length<=10 && /接受|满意|不错/.test(s); }
function looksLikeChange(t){ const s=norm(t); if(!s||isFiller(s)) return false; return /改|换|调整|加上|去掉|不要|不对|不行|重新|删|增加|减少|第二|第[一二三]|改一哈|改噻/.test(s); }
function isNegative(t){ return /要不得|不得行|莫得|不巴适|不行|不对|不好|不要|别|改|换|重来|重说/.test(norm(t)); }
function encodeWav16k(samples){
  const len=samples.length, ab=new ArrayBuffer(44+len*2), dv=new DataView(ab);
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); dv.setUint32(4,36+len*2,true); w(8,'WAVE'); w(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,16000,true); dv.setUint32(28,32000,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  w(36,'data'); dv.setUint32(40,len*2,true);
  for(let i=0;i<len;i++){ let v=Math.max(-1,Math.min(1,samples[i])); dv.setInt16(44+i*2, v<0?v*0x8000:v*0x7FFF, true); }
  return ab;
}
function abToB64(ab){ const bytes=new Uint8Array(ab); let bin=''; for(let i=0;i<bytes.length;i+=0x8000){ bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); } return btoa(bin); }
async function postAsr(b64, timeoutMs){
  const r=await fetchWithTimeout('/api/os/asr',{method:'POST',headers:{'Content-Type':'application/json','X-OS-Page':'quick'},body:JSON.stringify({audio_b64:b64,lang:'zh'})}, timeoutMs||60000);
  const d=await r.json().catch(()=>({}));
  if(!r.ok || d.ok===false) throw new Error(d.error||('HTTP '+r.status));
  return String(d.text||'').trim();
}
function splitWavChunks(wavAb){
  const bytes=new Uint8Array(wavAb); const data=bytes.subarray(44); const MAXDATA=44000;
  if(data.length<=MAXDATA) return [bytes];
  const out=[];
  for(let off=0; off<data.length; off+=MAXDATA){
    const part=data.subarray(off, Math.min(off+MAXDATA,data.length));
    const buf=new Uint8Array(44+part.length); buf.set(bytes.subarray(0,44),0);
    const dv=new DataView(buf.buffer); dv.setUint32(4,36+part.length,true); dv.setUint32(40,part.length,true);
    buf.set(part,44); out.push(buf);
  }
  return out;
}
function mergeChunkTexts(texts){
  let acc='';
  for(let t of texts){
    t=String(t||'').replace(/[嗯呃哦啊]+[。，]?$/,'').trim();
    if(!t) continue;
    if(acc && acc.slice(-1)===t.charAt(0)) t=t.slice(1);
    acc+=t;
  }
  return acc.trim();
}
async function transcribeWav(wavAb){
  const whole=new Uint8Array(wavAb);
  // 服务端允许大请求时优先整段识别（更准）；否则回退分片
  if(whole.length>44){
    try{ const t=await postAsr(abToB64(whole.buffer), 90000); if(t) return t; }catch(e){ /* fallback chunks */ }
  }
  const chunks=splitWavChunks(wavAb); const texts=[];
  for(const ch of chunks){
    const b64=abToB64(ch.buffer);
    let text=null;
    for(let attempt=0; attempt<2 && text===null; attempt++){
      try{ text=await postAsr(b64); }
      catch(e){ if(attempt===0){ await new Promise(r=>setTimeout(r,2000)); } else throw e; }
    }
    if(text) texts.push(text);
  }
  return mergeChunkTexts(texts);
}
async function recordTurn(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.AudioContext){ return browserListen(); }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){
    setStatus('麦克风打不开：'+(e.name||e.message||e));
    say('sys','麦克风没打开（'+esc(e.name||e.message||e)+'）。请在地址栏 🔒/🎤 图标里允许麦克风后刷新；也可点“⌨️ 打字”继续。');
    FAILS++; if(FAILS>=2) showTypePanel();
    return null;
  }
  $('b-start').classList.add('listening'); setStatus('麦克风已打开，请说话（说完自动停）');
  const ctx=new AudioContext();
  try{ if(ctx.state==='suspended') await ctx.resume(); }catch(e){}
  const label=(stream.getAudioTracks()[0]||{}).label||'默认麦克风';
  say('sys','🎤 使用设备：'+esc(label)+'（请直接说话）');
  return new Promise(resolve=>{
    const rate=ctx.sampleRate;
    const src=ctx.createMediaStreamSource(stream); const proc=ctx.createScriptProcessor(4096,1,1);
    const chunks=[]; const t0=performance.now(); let lastLoud=0, loudSeen=false, stopped=false;
    let lastStatus=0, level=0, warned=false;
    const cleanup=()=>{ RECORDING=false; RECORD_STOP=null; try{ proc.disconnect(); src.disconnect(); ctx.close(); }catch(e){} try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} $('b-start').classList.remove('listening'); };
    RECORDING=true;
    RECORD_STOP=()=>{ if(!stopped){ stopped=true; resolve(null); cleanup(); } };
    const stopNow=async()=>{ if(stopped) return; stopped=true; clearInterval(watch); cleanup();
      try{
        const all=new Float32Array(chunks.reduce((a,c)=>a+c.length,0)); let off=0; chunks.forEach(c=>{ all.set(c,off); off+=c.length; });
        if(!loudSeen || all.length<rate*0.25){ setStatus('没听到声音，再说一次'); say('sys','没收到声音：请检查麦克风是否静音/选错设备，或点“⌨️ 打字”。'); FAILS++; if(FAILS>=2) showTypePanel(); resolve(null); return; }
        const wav=encodeWav16k(resampleTo16k(all, rate));
        setStatus('识别中…（本地 SenseVoice）');
        let text=null;
        try{ text=await transcribeWav(wav); }
        catch(e){ setStatus('本地识别不可用，切浏览器识别'); ASR_MODE='browser'; $('asr-badge').textContent='浏览器识别'; $('asr-badge').className='badge warn'; resolve(await browserListen()); return; }
        if(!text){ setStatus('没听清，再说一次'); FAILS++; resolve(null); return; }
        FAILS=0;
        resolve(text);
      }catch(e){ setStatus('识别失败，切浏览器识别'); ASR_MODE='browser'; resolve(await browserListen()); }
    };
    proc.onaudioprocess=e=>{
      const d=new Float32Array(e.inputBuffer.getChannelData(0)); chunks.push(d);
      let sum=0; for(let i=0;i<d.length;i++) sum+=d[i]*d[i];
      const rms=Math.sqrt(sum/d.length), now=performance.now();
      level=rms;
      if(rms>0.004){ if(!loudSeen){ say('sys','听到声音了，继续说…'); } loudSeen=true; lastLoud=now; }
      if(now-lastStatus>300){ lastStatus=now; setStatus('我在听… 音量 '+Math.max(0,Math.min(99,Math.round(level*400)))+'（直接说话，说完自动停）'); }
    };
    src.connect(proc); proc.connect(ctx.destination);
    const watch=setInterval(()=>{ const now=performance.now();
      if(loudSeen && now-lastLoud>1100){ stopNow(); }
      else if(!loudSeen && now-t0>4000 && !warned){ warned=true;
        say('sys','麦克风没有收到声音（音量 '+Math.round(level*400)+'）：请确认系统输入设备/未静音；或点“⌨️ 打字”。'); }
      else if(now-t0>15000 || (!loudSeen && now-t0>9000)){ stopNow(); }
    },120);
  });
}
/* 浏览器识别（回退，也用于“点一下说想法”的第一次） */
function browserListen(){
  return new Promise((resolve)=>{
    if(!SR){ setStatus('此浏览器不支持语音，请用 Edge/Chrome，或点“打字”。'); resolve(null); return; }
    if(BUSY){ resolve(null); return; }
    BUSY=true; $('b-start').classList.add('listening'); setStatus('我在听…（浏览器识别）');
    const r=new SR(); r.lang='zh-CN'; r.interimResults=false; r.maxAlternatives=5; REC=r; let got=false;
    const done=()=>{ BUSY=false; $('b-start').classList.remove('listening'); REC=null; };
    r.onresult=e=>{ got=true; const alts=[]; for(let i=0;i<e.results[0].length;i++) alts.push(String(e.results[0][i].transcript||'').trim()); const t=alts.find(x=>x)||''; done(); resolve(t||null);
      if(alts.length>1) say('sys','（备选听法：'+alts.slice(1,3).map(esc).join(' / ')+'）'); };
    r.onerror=e=>{ done(); if(e.error==='no-speech'||e.error==='aborted'){ resolve(null); } else { showErr('没听清（'+e.error+'）'); resolve(null); } };
    r.onend=()=>{ if(!got){ done(); resolve(null); } };
    try{ r.start(); }catch(e){ done(); resolve(null); }
  });
}
function speakThen(text, handler){
  if(TEXT_ONLY){ setStatus(''); if(String(text).length<=80) say('sys', esc(text)); return; }
  say('sys', esc(text));
  const done=()=>{ if(DONE||PAUSED) return;
    if(handler){ PENDING_HANDLER=handler;
      setStatus('说完了。点 🎤 该您说了（不会自动开麦）');
      $('b-start').textContent='🎤 该您说了（点一下）'; } };
  if(!('speechSynthesis' in window)){ setTimeout(done,300); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=1.04;
    let ended=false; const once=()=>{ if(ended) return; ended=true; done(); };
    u.onend=once; u.onerror=once;
    setTimeout(once, Math.max(8000, Math.min(45000, 5000 + text.length*220)));
    speechSynthesis.speak(u);
  }catch(e){ done(); }
}
async function nextTurn(handler){
  if(DONE||PAUSED) return;
  if(ASR_MODE==='browser' && !SR){ showTypePanel(); pauseListening('此浏览器不支持语音识别，已切到打字'); return; }
  let t=null;
  for(let attempt=0; attempt<3 && !t; attempt++){
    t = (ASR_MODE==='local') ? await recordTurn() : await browserListen();
    if(!t) setStatus('没听清，我再说一次，您再说一句');
    else if(isEcho(t)){ say('sys','（听到的是我刚才的话，略过）'); t=null; }
  }
  if(t){ clearErr(); handler(t); }
  else { if(FAILS>=2) showTypePanel(); pauseListening('没听到您说话，我先暂停自动听。'); }
}
/* ============ 业务动作 ============ */
async function api(path,body){
  const opt=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-OS-Page':'quick'},body:JSON.stringify(body)};
  const r=await fetch(path,opt);
  const d=await r.json().catch(()=>({ok:false,error:'bad_json'}));
  if(!r.ok||d.ok===false) throw new Error((d.error||r.status)+': '+(d.message||''));
  return d;
}
function cardHtml(card){
  const kindLabel=(card.kind==='business_plan')?'商业计划（BP v1，假设版）':'软件原型';
  return '<div class="msg card"><h3>'+esc(card.title)+'</h3>'+'<div class="muted">类型：'+kindLabel+'</div>'
    +'<div><b>要做的</b><ul class="list">'+(card.goals||[]).map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul></div>'
    +'<div><b>怎么算成</b><ul class="list">'+(card.success_criteria||[]).map(s=>'<li>'+esc(s.statement)+'（'+esc(s.verify_method)+'）</li>').join('')+'</ul></div>'
    +'<div style="margin-top:4px"><b>我建议</b>：'+esc(card.recommended.option)+'</div>'
    +'<div class="muted">默认授权：'+esc(card.scope.env)+' / '+card.scope.actions.length+' 个可逆动作 / 有效至 '+esc(card.scope.valid_until)+' / 可撤回</div></div>';
}
function cardSpeech(card){
  return '我理解您要做：'+card.goals.join('；')+'。 我的建议：'+card.recommended.option+'。 怎么算成：'
    +(card.success_criteria||[]).map(s=>s.statement).join('；')
    +'。 默认授权是隔离环境、四个可逆动作、二十四小时、可撤回。 如果没问题，就说“行”，我马上办；要改就直接说要改哪句。';
}
function appendCardActions(){
  if(!TEXT_ONLY) return;
  const d=document.createElement('div'); d.className='msg sys';
  d.innerHTML='<button class="ghost" id="tx-ok">✅ 按这个办</button> <span class="muted">要改就在下面输入框重写一句，再点“出卡”</span>';
  $('chat').appendChild(d); d.scrollIntoView({block:'end'});
  $('tx-ok').onclick=()=>handleCardReply('行');
}
function appendVerdictActions(){
  if(!TEXT_ONLY) return;
  const d=document.createElement('div'); d.className='msg sys';
  d.innerHTML='<div>满意点“接受”；要改就写下改什么再提交。</div>'
    +'<input id="tx-fb" placeholder="要改什么？例：标题改成今日简报" style="width:100%;box-sizing:border-box;padding:8px;border:1.5px solid #bfd6e2;border-radius:8px;margin-top:6px">'
    +'<div style="margin-top:6px"><button class="ghost" id="tx-accept">✅ 接受</button> <button class="ghost" id="tx-change">✏️ 提交修改</button></div>';
  $('chat').appendChild(d); d.scrollIntoView({block:'end'});
  $('tx-accept').onclick=()=>handleVerdict('接受');
  $('tx-change').onclick=()=>{ const v=(($('tx-fb')&&$('tx-fb').value)||'').trim(); if(!v) return setStatus('请写一句要改什么'); handleVerdict(v); };
}
async function handleIdea(text){
  startTimer(); say('user', esc(text));
  const normalized=dialectNormalize(text);
  try{ const d=await api('/api/os/quickstart',{text:normalized}); DRAFT=d.card;
    $('chat').insertAdjacentHTML('beforeend', cardHtml(d.card));
    (document.querySelectorAll('.card')||[]).length && document.querySelectorAll('.card')[document.querySelectorAll('.card').length-1].scrollIntoView({block:'end',behavior:'smooth'});
    speakThen('第 2 句：一张卡。'+cardSpeech(d.card), handleCardReply);
    appendCardActions();
  }catch(e){ showErr(e.message); say('sys','这一步失败了：'+esc(e.message)); }
}
async function handleCardReply(t){
  say('user', esc(t));
  if(isStop(t)){ return pauseListening('已暂停自动听。'); }
  if(isEcho(t)||isFiller(t)){ return repromptCard('没听清（可能是回声或噪音）'); }
  if(isAccept(t)){ CARD_ROUNDS=0; return doConfirm(); }
  if(/重新|重来|换个/.test(t)){ return speakThen('好，我们重来。您想做什么？', handleIdea); }
  if(!looksLikeChange(t) && norm(t).length<6){ return repromptCard('没听清您是“行”还是要改'); }
  if(++CARD_ROUNDS>3){ CARD_ROUNDS=0; return pauseListening('改了几轮，我先暂停自动听；点🎤继续。'); }
  try{ const d=await api('/api/os/quickstart',{text:(DRAFT?DRAFT.text:'')+'；按您的修改：'+t, edits:{changes:t}}); DRAFT=d.card;
    $('chat').insertAdjacentHTML('beforeend', cardHtml(d.card));
    speakThen('改好了。'+cardSpeech(d.card), handleCardReply);
    appendCardActions();
  }catch(e){ showErr(e.message); }
}
async function repromptCard(msg){
  if(++CARD_ROUNDS>3){ CARD_ROUNDS=0; return pauseListening('我先暂停自动听；点🎤继续。'); }
  setStatus(msg||'没听清');
  speakThen('没听清。请说“行”，我就按这个办；要改就直接说要改哪句。', handleCardReply);
}
async function doConfirm(){
  say('sys','好，按这个办。');
  try{ const d=await api('/api/os/quickstart/'+encodeURIComponent(DRAFT.draft_id)+'/confirm',{}); ITEM=d.item_id;
    say('sys','已经隔离执行好了：产物 <b>'+esc(d.artifact.version)+'</b>。试用就在下面。');
    $('chat').insertAdjacentHTML('beforeend','<iframe class="pv" id="pv" src="'+esc(d.preview_url)+'"></iframe>');
    document.getElementById('pv').scrollIntoView({block:'center',behavior:'smooth'});
    speakThen('第 3 句：做好了，试用就在下面。满意就说“接受”，要改就说“这里改”，直接说哪里不满意。', handleVerdict);
    appendVerdictActions();
  }catch(e){ showErr(e.message); say('sys','执行失败：'+esc(e.message)); }
}
async function doAccept(){
  try{ await api('/api/os/item/'+encodeURIComponent(ITEM)+'/verdict',{decision:'accepted',feedback:'接受'}); ACCEPTED=true;
    say('sys','✅ 已验收。这条链完成，证据已经记在同一本账上。'); speak('已记录，您接受。完成。'); finish();
  }catch(e){ showErr(e.message); }
}
async function doChange(t){
  try{
    let needRework=ACCEPTED;
    if(!needRework){
      try{ await api('/api/os/item/'+encodeURIComponent(ITEM)+'/verdict',{decision:'changes_requested',feedback:t}); }
      catch(e){ if(String(e.message).includes('已验收')||String(e.message).includes('contract_violation')) needRework=true; else throw e; }
    }
    const r=await api('/api/os/item/'+encodeURIComponent(ITEM)+'/rework',{feedback:t});
    await api('/api/os/item/'+encodeURIComponent(ITEM)+'/trial',{});
    ACCEPTED=false;
    if($('pv')) $('pv').src='/api/os/item/'+encodeURIComponent(ITEM)+'/workspace/index.html';
    say('sys','改好了，新版本 <b>'+esc(r.artifact.version)+'</b> 已经更新在下面的试用窗口里。');
    speakThen('第 3 句：改好了，新版本在下面。满意就说“接受”，还要改就继续说。', handleVerdict);
    appendVerdictActions();
  }catch(e){ showErr(e.message); }
}
async function handleVerdict(t){
  say('user', esc(t));
  if(isStop(t)){ return pauseListening('已暂停自动听。'); }
  if(isEcho(t)||isFiller(t)){ return repromptVerdict('没听清（可能是回声或噪音）'); }
  if(isAcceptVerdict(t) && !isNegative(t)){ VERDICT_ROUNDS=0; return doAccept(); }
  if(!looksLikeChange(t) && norm(t).length<6){ return repromptVerdict('没听清您是要接受还是要改'); }
  if(++VERDICT_ROUNDS>3){ VERDICT_ROUNDS=0; return pauseListening('改了几轮，我先暂停自动听；点🎤继续。'); }
  return doChange(t);
}
async function repromptVerdict(msg){
  if(++VERDICT_ROUNDS>3){ VERDICT_ROUNDS=0; return pauseListening('我先暂停自动听；点🎤继续。'); }
  setStatus(msg||'没听清');
  speakThen('没听清。满意就说“接受”；要改就说“这里改”，并说要改哪里。', handleVerdict);
}
/* 打字兜底 */
function showTypePanel(){ const tpl=$('type_panel_tpl'); $('chat').appendChild(tpl.content.cloneNode(true)); $('type_panel').scrollIntoView({block:'end'}); }
$('b-start').onclick=async()=>{
  if(TEXT_ONLY){ showTypePanel(); setStatus('纯文字模式：在输入框写一句，点“出卡”'); return; }
  if(PENDING_HANDLER){ const h=PENDING_HANDLER; PENDING_HANDLER=null; $('b-start').textContent='🎤 正在听…'; nextTurn(h); return; }
  if(RECORDING){ try{ RECORD_STOP&&RECORD_STOP(); }catch(e){} setStatus('已停止录音；再点一次重新开始'); return; }
  clearErr(); PAUSED=false; CARD_ROUNDS=0; VERDICT_ROUNDS=0; LAST_SPEECH_NORM=''; FAILS=0; await ensureAsrMode(); if(DONE){ DONE=false; $('b-start').textContent='🎤 点一下，说想法'; } stopVoice(); say('sys','好，我在听。您想做什么？'); startTimer(); nextTurn(handleIdea); };
$('b-stop').onclick=()=>{ pauseListening('已暂停自动听'); };
$('b-type').onclick=()=>{ showTypePanel(); };
$('b-textmode').onclick=()=>{ TEXT_ONLY=!TEXT_ONLY; showTypePanel();
  if(TEXT_ONLY){ setStatus('已切换纯文字验收模式（不用麦克风）'); $('b-start').textContent='⌨️ 纯文字：在输入框写一句'; }
  else { setStatus('已切回语音模式'); $('b-start').textContent='🎤 点一下，说想法'; } };
document.addEventListener('click',ev=>{
  const id=ev.target&&ev.target.id;
  if(id==='t-draft'){ handleIdea((($('ask')&&$('ask').value)||'').trim()); }
  if(id==='t-ok'){ doConfirm(); }
  if(id==='t-accept'){ doAccept(); }
  if(id==='t-change'){ doChange((($('ask')&&$('ask').value)||'改一下').trim()); }
});
window.addEventListener('error',e=>showErr('页面脚本错误：'+(e.message||e.type)));
window.addEventListener('unhandledrejection',e=>showErr('未处理错误：'+((e.reason&&e.reason.message)||e.reason)));
let PREFILL='';
try{ const qs=new URLSearchParams(location.search); if(qs.get('text')==='1'){ TEXT_ONLY=true; } PREFILL=qs.get('prefill')||''; }catch(e){}
if(TEXT_ONLY){ $('b-start').textContent='⌨️ 纯文字：在输入框写一句'; showTypePanel(); if(PREFILL && $('ask')){ $('ask').value=PREFILL; } setStatus(PREFILL?'已带入一句话，点“出卡”即可':'纯文字验收模式：写一句→出卡→按这个办→接受/改'); }
checkAsr();
