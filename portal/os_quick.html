<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>零界 · 说一句话</title>
<link rel="stylesheet" href="/static/tokens.css">
<script src="/static/nav.js" defer></script>
<script src="/static/shortscreen.js" defer></script>
<style>
  .wrap{max-width:760px;margin:0 auto;padding:14px 18px 130px}
  h1{font-size:21px;margin:4px 0 2px}
  .sub{color:#5a6f83;font-size:13px;margin:0 0 8px}
  .badge{display:inline-block;font-size:11.5px;padding:2px 9px;border-radius:999px;background:#e6f4f8;color:#0e7490;font-weight:700;margin-left:6px}
  .badge.warn{background:#faf3e6;color:#936224}
  .banner{border-left:4px solid #936224;background:#faf3e6;padding:7px 11px;border-radius:6px;font-size:12px;margin:6px 0 12px}
  .chat{display:flex;flex-direction:column;gap:10px}
  .msg{border-radius:16px;padding:12px 15px;font-size:14.5px;line-height:1.7;max-width:92%}
  .sys{background:#f4f9fb;border:1px solid #dbe5ee;align-self:flex-start}
  .user{background:#0e7490;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .card{border:1.5px solid #bcd8e2;background:#fff;align-self:stretch;max-width:100%}
  .card h3{margin:0 0 6px;font-size:16px;color:#0e7490}
  .list{margin:2px 0;padding-left:19px;font-size:13.5px;line-height:1.75}
  .muted{color:#5a6f83;font-size:12px}
  .pv{width:100%;height:340px;border:1px solid #dbe5ee;border-radius:12px;background:#fff;margin-top:8px}
  .err{color:#b3402e;font-size:13px;white-space:pre-wrap}
  .dock{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);border-top:1px solid #dbe5ee;padding:10px 14px;backdrop-filter:blur(6px);z-index:50}
  .dock .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  button{cursor:pointer;font:600 15px/1.2 inherit;border:0;border-radius:14px;padding:12px 18px}
  .mic{font-size:17px;padding:15px 24px;border-radius:999px;background:#0e7490;color:#fff;box-shadow:0 4px 14px rgba(14,116,144,.28)}
  .mic.listening{background:#b3402e;animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,64,46,.5)}100%{box-shadow:0 0 0 14px rgba(179,64,46,0)}}
  button.ghost{background:#fff;color:#0e7490;border:1.5px solid #bcd8e2}
  button:disabled{opacity:.5;cursor:not-allowed}
  #status{font-size:12.5px;color:#5a6f83;flex:1;min-width:140px}
  .say{font-size:12px;color:#936224}
  textarea{width:100%;box-sizing:border-box;min-height:54px;margin-top:6px;font:inherit;padding:8px 10px;border:1.5px solid #bfd6e2;border-radius:10px}
</style>
</head>
<body>
<main class="wrap">
  <h1>说一句话，剩下的我来</h1>
  <p class="sub">点一下开始后自动听、自动做、自动念——<b>不用反复点按钮</b>。<span class="badge" id="asr-badge">识别方式检测中…</span></p>
  <div class="banner">默认授权：隔离环境 · 4 个可逆动作 · 24 小时 · 可撤回。推荐卡为规则辅助（非模型结论）；认领为模拟认领（未获真实认领）；不接生产/交易/外发。<span class="say" id="timer"></span></div>

  <div class="chat" id="chat">
    <div class="msg sys">您好。第 1 句说想法，第 2 句听卡说"行"，第 3 句看试用说"接受"或"这里改"。点下面的 🎤 <b>点一下，说想法</b>，之后就像聊天一样。</div>
  </div>

  <p class="err" id="err" hidden></p>
</main>

<div class="dock"><div class="in">
  <button class="mic" id="b-start">🎤 点一下，说想法</button>
  <button class="ghost" id="b-type">⌨️ 打字</button>
  <button class="ghost" id="b-stop" hidden>⏹ 暂停</button>
  <span id="status">就绪</span>
</div></div>

<template id="type_panel_tpl">
  <div class="msg sys" id="type_panel">
    <div><b>打字模式</b>（可随时切回语音）</div>
    <textarea id="ask" placeholder="例：做个页面，让我每天打开就能看三条简报摘要"></textarea>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px">
      <button class="ghost" id="t-draft">出卡</button>
      <button class="ghost" id="t-ok" hidden>按这个办</button>
      <button class="ghost" id="t-accept" hidden>接受</button>
      <button class="ghost" id="t-change" hidden>这里改</button>
    </div>
  </div>
</template>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let DRAFT=null, ITEM=null, START=null, TICK=null, ACCEPTED=false, BUSY=false, DONE=false;
let ASR_MODE='browser', REC=null, VOICE_READY=false;
function setStatus(m){ const s=$('status'); if(s) s.textContent=String(m); }
function showErr(m){ const e=$('err'); e.hidden=false; e.textContent=String(m); }
function clearErr(){ const e=$('err'); e.hidden=true; }
function startTimer(){ if(START!==null) return; START=Date.now(); TICK=setInterval(()=>{ $('timer').textContent='已用 '+Math.round((Date.now()-START)/1000)+'s'; },1000); }
function say(role, html){ const d=document.createElement('div'); d.className='msg '+(role==='user'?'user':'sys'); d.innerHTML=html; $('chat').appendChild(d); d.scrollIntoView({block:'end',behavior:'smooth'}); return d; }
function speak(text){ try{ if(!window.speechSynthesis) return; speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=1.04; speechSynthesis.speak(u); }catch(e){} }
function stopVoice(){ try{ if(REC){ REC.onresult=null; REC.onerror=null; REC.onend=null; REC.abort(); } }catch(e){} REC=null; BUSY=false; $('b-start').classList.remove('listening'); }
function finish(){ DONE=true; stopVoice(); $('b-start').textContent='🎤 说下一件事'; $('b-start').classList.remove('listening'); setStatus('完成'); }
/* ============ 识别方式：优先本地 SenseVoice（离线、高精度），失败回退浏览器 ============ */
async function checkAsr(){
  try{
    const r=await fetch('/api/os/asr/status'); const d=await r.json();
    if(d && d.engine==='sensevoice_local'){
      ASR_MODE='local'; $('asr-badge').textContent='本地高精度 · SenseVoice（离线）'; $('asr-badge').className='badge';
      setStatus('就绪（本地高精度识别；首次加载模型约 20-30 秒）');
      return;
    }
    $('asr-badge').textContent='浏览器识别'; $('asr-badge').className='badge warn';
  }catch(e){ $('asr-badge').textContent='浏览器识别'; $('asr-badge').className='badge warn'; }
}
function norm(t){ return String(t||'').replace(/[\s，。！？、,.!?;；:："'“”‘’()（）]/g,''); }
function isEcho(t){ return t.length>22 && /我理解您|默认授权|您说|第 [123] 句|做好了|改好了|怎么算成/.test(t); }
function isAccept(t){ const s=norm(t); if(isEcho(t)) return false;
  if(/^(行|好|可以|对|嗯|是的|没问题|按这个办|开始吧|执行|确认|就这么办|就这样|ok)$/i.test(s)) return true;
  return s.length<=12 && /按这个办|开始吧|就这么办|没问题|可以|确认/.test(s); }
function isAcceptVerdict(t){ const s=norm(t); if(isEcho(t)) return false;
  if(/^(接受|可以|好|行|满意|不错|行吧|嗯|对)$/.test(s)) return true;
  return s.length<=10 && /接受|满意|不错/.test(s); }
function isNegative(t){ return /不行|不对|不好|不要|别|改|换|重来|重说/.test(norm(t)); }
/* 录音 → 16k 单声道 WAV → base64 → 本地 ASR */
function resampleTo16k(buf, inRate){
  if(inRate===16000) return buf;
  const ratio=inRate/16000, outLen=Math.max(1,Math.floor(buf.length/ratio)), out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++){ const pos=i*ratio, i0=Math.floor(pos), i1=Math.min(buf.length-1,i0+1), frac=pos-i0; out[i]=buf[i0]*(1-frac)+buf[i1]*frac; }
  return out;
}
function encodeWav16k(samples){
  const len=samples.length, ab=new ArrayBuffer(44+len*2), dv=new DataView(ab);
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); dv.setUint32(4,36+len*2,true); w(8,'WAVE'); w(12,'fmt ');
  dv.setUint32(16,16,true); dv.setUint16(20,1,true); dv.setUint16(22,1,true);
  dv.setUint32(24,16000,true); dv.setUint32(28,32000,true); dv.setUint16(32,2,true); dv.setUint16(34,16,true);
  w(36,'data'); dv.setUint32(40,len*2,true);
  for(let i=0;i<len;i++){ let v=Math.max(-1,Math.min(1,samples[i])); dv.setInt16(44+i*2, v<0?v*0x8000:v*0x7FFF, true); }
  return ab;
}
function abToB64(ab){ const bytes=new Uint8Array(ab); let bin=''; for(let i=0;i<bytes.length;i+=0x8000){ bin+=String.fromCharCode.apply(null, bytes.subarray(i,i+0x8000)); } return btoa(bin); }
async function recordTurn(){
  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.AudioContext){ return browserListen(); }
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ setStatus('麦克风不可用：'+(e.message||e)); return browserListen(); }
  $('b-start').classList.add('listening'); setStatus('我在听…（说完自动停）');
  return new Promise(resolve=>{
    const ctx=new AudioContext(); const rate=ctx.sampleRate;
    const src=ctx.createMediaStreamSource(stream); const proc=ctx.createScriptProcessor(4096,1,1);
    const chunks=[]; const t0=performance.now(); let lastLoud=0, loudSeen=false, stopped=false;
    const cleanup=()=>{ try{ proc.disconnect(); src.disconnect(); ctx.close(); }catch(e){} try{ stream.getTracks().forEach(t=>t.stop()); }catch(e){} $('b-start').classList.remove('listening'); };
    const stopNow=async()=>{ if(stopped) return; stopped=true; clearInterval(watch); cleanup();
      try{
        const all=new Float32Array(chunks.reduce((a,c)=>a+c.length,0)); let off=0; chunks.forEach(c=>{ all.set(c,off); off+=c.length; });
        if(!loudSeen || all.length<rate*0.25){ setStatus('没听到声音，再说一次'); resolve(null); return; }
        const s16=resampleTo16k(all, rate); const b64=abToB64(encodeWav16k(s16));
        setStatus('识别中…（本地 SenseVoice）');
        const r=await fetch('/api/os/asr',{method:'POST',headers:{'Content-Type':'application/json','X-OS-Page':'quick'},body:JSON.stringify({audio_b64:b64,lang:'zh'})});
        const d=await r.json().catch(()=>({}));
        if(!r.ok || d.ok===false){ setStatus('本地识别不可用，切浏览器识别'); ASR_MODE='browser'; $('asr-badge').textContent='浏览器识别'; $('asr-badge').className='badge warn'; resolve(await browserListen()); return; }
        const text=String(d.text||'').trim();
        if(!text){ setStatus('没听清，再说一次'); resolve(null); return; }
        resolve(text);
      }catch(e){ setStatus('识别失败，切浏览器识别'); ASR_MODE='browser'; resolve(await browserListen()); }
    };
    proc.onaudioprocess=e=>{
      const d=new Float32Array(e.inputBuffer.getChannelData(0)); chunks.push(d);
      let sum=0; for(let i=0;i<d.length;i++) sum+=d[i]*d[i];
      const rms=Math.sqrt(sum/d.length), now=performance.now();
      if(rms>0.012){ loudSeen=true; lastLoud=now; }
    };
    src.connect(proc); proc.connect(ctx.destination);
    const watch=setInterval(()=>{ const now=performance.now();
      if(loudSeen && now-lastLoud>1100){ stopNow(); }
      else if(now-t0>15000 || (!loudSeen && now-t0>8000)){ stopNow(); }
    },120);
  });
}
/* 浏览器识别（回退，也用于“点一下说想法”的第一次） */
function browserListen(){
  return new Promise((resolve)=>{
    if(!SR){ setStatus('此浏览器不支持语音，请用 Edge/Chrome，或点“打字”。'); resolve(null); return; }
    if(BUSY){ resolve(null); return; }
    BUSY=true; $('b-start').classList.add('listening'); setStatus('我在听…（浏览器识别）');
    const r=new SR(); r.lang='zh-CN'; r.interimResults=false; r.maxAlternatives=5; REC=r; let got=false;
    const done=()=>{ BUSY=false; $('b-start').classList.remove('listening'); REC=null; };
    r.onresult=e=>{ got=true; const alts=[]; for(let i=0;i<e.results[0].length;i++) alts.push(String(e.results[0][i].transcript||'').trim()); const t=alts.find(x=>x)||''; done(); resolve(t||null);
      if(alts.length>1) say('sys','（备选听法：'+alts.slice(1,3).map(esc).join(' / ')+'）'); };
    r.onerror=e=>{ done(); if(e.error==='no-speech'||e.error==='aborted'){ resolve(null); } else { showErr('没听清（'+e.error+'）'); resolve(null); } };
    r.onend=()=>{ if(!got){ done(); resolve(null); } };
    try{ r.start(); }catch(e){ done(); resolve(null); }
  });
}
function speakThen(text, handler){
  say('sys', esc(text));
  const go=()=>{ if(handler) setTimeout(()=>nextTurn(handler),650); };
  if(!('speechSynthesis' in window)){ setTimeout(go,600); return; }
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=1.04;
    let ended=false; const once=()=>{ if(ended) return; ended=true; go(); };
    u.onend=once; u.onerror=once;
    setTimeout(once, Math.min(25000, 4000 + text.length*170));
    speechSynthesis.speak(u);
  }catch(e){ go(); }
}
async function nextTurn(handler){
  if(DONE) return;
  let t=null;
  for(let attempt=0; attempt<3 && !t; attempt++){
    t = (ASR_MODE==='local') ? await recordTurn() : await browserListen();
    if(!t) setStatus('没听清，我再说一次，您再说一句');
    else if(isEcho(t)){ say('sys','（听到的是我刚才的话，略过）'); t=null; }
  }
  if(t){ clearErr(); handler(t); }
  else { setStatus('没听到您说话。点 🎤 或改成打字。'); }
}
/* ============ 业务动作 ============ */
async function api(path,body){
  const opt=body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-OS-Page':'quick'},body:JSON.stringify(body)};
  const r=await fetch(path,opt);
  const d=await r.json().catch(()=>({ok:false,error:'bad_json'}));
  if(!r.ok||d.ok===false) throw new Error((d.error||r.status)+': '+(d.message||''));
  return d;
}
function cardHtml(card){
  return '<div class="msg card"><h3>'+esc(card.title)+'</h3>'
    +'<div><b>要做的</b><ul class="list">'+(card.goals||[]).map(g=>'<li>'+esc(g)+'</li>').join('')+'</ul></div>'
    +'<div><b>怎么算成</b><ul class="list">'+(card.success_criteria||[]).map(s=>'<li>'+esc(s.statement)+'（'+esc(s.verify_method)+'）</li>').join('')+'</ul></div>'
    +'<div style="margin-top:4px"><b>我建议</b>：'+esc(card.recommended.option)+'</div>'
    +'<div class="muted">默认授权：'+esc(card.scope.env)+' / '+card.scope.actions.length+' 个可逆动作 / 有效至 '+esc(card.scope.valid_until)+' / 可撤回</div></div>';
}
function cardSpeech(card){
  return '我理解您要做：'+card.goals.join('；')+'。 我的建议：'+card.recommended.option+'。 怎么算成：'
    +(card.success_criteria||[]).map(s=>s.statement).join('；')
    +'。 默认授权是隔离环境、四个可逆动作、二十四小时、可撤回。 如果没问题，就说“行”，我马上办；要改就直接说要改哪句。';
}
async function handleIdea(text){
  startTimer(); say('user', esc(text));
  try{ const d=await api('/api/os/quickstart',{text}); DRAFT=d.card;
    $('chat').insertAdjacentHTML('beforeend', cardHtml(d.card));
    (document.querySelectorAll('.card')||[]).length && document.querySelectorAll('.card')[document.querySelectorAll('.card').length-1].scrollIntoView({block:'end',behavior:'smooth'});
    speakThen('第 2 句：一张卡。'+cardSpeech(d.card), handleCardReply);
  }catch(e){ showErr(e.message); say('sys','这一步失败了：'+esc(e.message)); }
}
async function handleCardReply(t){
  say('user', esc(t));
  if(isAccept(t)) return doConfirm();
  if(/重新|重来|换个/i.test(t)) return speakThen('好，我们重来。您想做什么？', handleIdea);
  try{ const d=await api('/api/os/quickstart',{text:(DRAFT?DRAFT.text:'')+'；按您的修改：'+t, edits:{changes:t}}); DRAFT=d.card;
    $('chat').insertAdjacentHTML('beforeend', cardHtml(d.card));
    speakThen('改好了。'+cardSpeech(d.card), handleCardReply);
  }catch(e){ showErr(e.message); }
}
async function doConfirm(){
  say('sys','好，按这个办。');
  try{ const d=await api('/api/os/quickstart/'+encodeURIComponent(DRAFT.draft_id)+'/confirm',{}); ITEM=d.item_id;
    say('sys','已经隔离执行好了：产物 <b>'+esc(d.artifact.version)+'</b>。试用就在下面。');
    $('chat').insertAdjacentHTML('beforeend','<iframe class="pv" id="pv" src="'+esc(d.preview_url)+'"></iframe>');
    document.getElementById('pv').scrollIntoView({block:'center',behavior:'smooth'});
    speakThen('第 3 句：做好了，试用就在下面。满意就说“接受”，要改就说“这里改”，直接说哪里不满意。', handleVerdict);
  }catch(e){ showErr(e.message); say('sys','执行失败：'+esc(e.message)); }
}
async function doAccept(){
  try{ await api('/api/os/item/'+encodeURIComponent(ITEM)+'/verdict',{decision:'accepted',feedback:'接受'}); ACCEPTED=true;
    say('sys','✅ 已验收。这条链完成，证据已经记在同一本账上。'); speak('已记录，您接受。完成。'); finish();
  }catch(e){ showErr(e.message); }
}
async function doChange(t){
  try{
    let needRework=ACCEPTED;
    if(!needRework){
      try{ await api('/api/os/item/'+encodeURIComponent(ITEM)+'/verdict',{decision:'changes_requested',feedback:t}); }
      catch(e){ if(String(e.message).includes('已验收')||String(e.message).includes('contract_violation')) needRework=true; else throw e; }
    }
    const r=await api('/api/os/item/'+encodeURIComponent(ITEM)+'/rework',{feedback:t});
    await api('/api/os/item/'+encodeURIComponent(ITEM)+'/trial',{});
    ACCEPTED=false;
    if($('pv')) $('pv').src='/api/os/item/'+encodeURIComponent(ITEM)+'/workspace/index.html';
    say('sys','改好了，新版本 <b>'+esc(r.artifact.version)+'</b> 已经更新在下面的试用窗口里。');
    speakThen('第 3 句：改好了，新版本在下面。满意就说“接受”，还要改就继续说。', handleVerdict);
  }catch(e){ showErr(e.message); }
}
async function handleVerdict(t){
  say('user', esc(t));
  if(isAcceptVerdict(t) && !isNegative(t)) return doAccept();
  return doChange(t);
}
/* 打字兜底 */
function showTypePanel(){ const tpl=$('type_panel_tpl'); $('chat').appendChild(tpl.content.cloneNode(true)); $('type_panel').scrollIntoView({block:'end'}); }
$('b-start').onclick=async()=>{ clearErr(); if(DONE){ DONE=false; $('b-start').textContent='🎤 我继续说'; } stopVoice(); say('sys','好，我在听。您想做什么？'); startTimer(); nextTurn(handleIdea); };
$('b-stop').onclick=()=>{ stopVoice(); setStatus('已暂停'); $('b-start').textContent='🎤 继续'; };
$('b-type').onclick=()=>{ showTypePanel(); };
document.addEventListener('click',ev=>{
  const id=ev.target&&ev.target.id;
  if(id==='t-draft'){ handleIdea((($('ask')&&$('ask').value)||'').trim()); }
  if(id==='t-ok'){ doConfirm(); }
  if(id==='t-accept'){ doAccept(); }
  if(id==='t-change'){ doChange((($('ask')&&$('ask').value)||'改一下').trim()); }
});
window.addEventListener('error',e=>showErr('页面脚本错误：'+(e.message||e.type)));
window.addEventListener('unhandledrejection',e=>showErr('未处理错误：'+((e.reason&&e.reason.message)||e.reason)));
checkAsr();
</script>
</body>
</html>
