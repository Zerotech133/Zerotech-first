<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>零界 · 本机只读预览</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/ui/ui.css">
<script src="/static/nav.js" defer></script>
<style>
:root{color-scheme:dark}
body{margin:0;background:var(--bg-page);color:var(--text);font-family:var(--font-ui)}
.wrap{max-width:1210px;margin:0 auto;padding:20px 24px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0 10px;border-bottom:1px solid var(--border)}
.brand{font-weight:700;letter-spacing:.06em}
.banner{margin:14px 0;padding:10px 14px;border:1px solid var(--ylw-500);border-radius:10px;background:rgba(210,153,34,.08);color:var(--ylw-500);font-size:12.5px}
.meta{color:var(--text-dim);font-size:12px;margin:6px 0}
h1{font-size:22px;margin:16px 0 4px}
h2{font-size:15px;margin:24px 0 8px}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:14px 0}
.card{background:var(--bg-raised);border:1px solid var(--border);border-radius:10px;padding:12px 14px}
.card .k{color:var(--text-dim);font-size:11.5px}
.card .v{font-size:22px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-weak);vertical-align:top}
th{color:var(--text-dim);font-weight:600;background:var(--bg-raised);white-space:nowrap}
tr:last-child td{border-bottom:0}
.err{padding:12px;border:1px solid var(--red-500);border-radius:10px;color:var(--red-500);background:rgba(248,81,73,.07)}
.pill{display:inline-block;padding:2px 7px;border-radius:999px;border:1px solid var(--border);font-size:11px}
.pill.ok{color:var(--color-ok);border-color:color-mix(in srgb,var(--color-ok) 42%,transparent)}
.pill.warn{color:var(--color-warn);border-color:color-mix(in srgb,var(--color-warn) 42%,transparent)}
.pill.err{color:var(--color-err);border-color:color-mix(in srgb,var(--color-err) 42%,transparent)}
a{color:var(--link)}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:14px 14px 40px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">零界 · 本机只读预览</div>
    <a href="/hq">正式入口 /hq（需登录） →</a>
  </div>
  <div class="banner">本机只读预览：仅展示五角色 / 议程 / Directive / 军团汇报；不包含审批、商业、预算等敏感数据，不提供任何写操作。正式页面仍走登录。</div>
  <h1>指挥部只读预览</h1>
  <div class="meta" id="meta">加载中…</div>
  <div class="cards" id="cards"></div>
  <div id="error"></div>

  <h2>五角色</h2>
  <div class="table-wrap" id="roles"></div>

  <h2>议程与 Directive</h2>
  <div class="table-wrap" id="agenda"></div>
  <div class="table-wrap" id="directives" style="margin-top:10px"></div>

  <h2>军团汇报</h2>
  <div class="table-wrap" id="reports"></div>
</div>
<script>
(function(){
'use strict';
var BASE='/api/preview/hq/';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function card(k,v){return '<div class="card"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>';}
function table(headers,rows){
  return '<table><thead><tr>'+headers.map(function(h){return '<th>'+esc(h)+'</th>';}).join('')+'</tr></thead><tbody>'
    +(rows.length?rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+c+'</td>';}).join('')+'</tr>';}).join(''):'<tr><td colspan="'+headers.length+'" class="meta">无数据</td></tr>')
    +'</tbody></table>';
}
function pill(s){var t=String(s||'');var c=/green|pass|ok|done|closed/i.test(t)?'ok':(/red|fail|blocked|error/i.test(t)?'err':'warn');return '<span class="pill '+c+'">'+esc(t)+'</span>';}
async function get(path){
  var r=await fetch(BASE+path,{cache:'no-store',headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error(path+' HTTP '+r.status);
  var p=await r.json();
  if(!(p&&p.ok&&p.data)) throw new Error(path+' bad payload');
  return p.data;
}
async function main(){
  try{
    var d=await Promise.all([get('roles'),get('agenda'),get('directives'),get('reports')]);
    var ro=d[0],ag=d[1],dr=d[2],rp=d[3];
    var rs=ro.summary||{},ags=ag.summary||{},dirs=dr.directives||[],reps=rp.legions||[];
    document.getElementById('meta').textContent='只读预览 · 生成 '+new Date().toLocaleString()+' · 正式入口需登录';
    document.getElementById('cards').innerHTML=[
      card('五角色',rs.roles||0),card('议程项',ags.items||0),card('Directive',dirs.length),
      card('军团汇报',reps.length),card('待派单',dirs.filter(function(x){return x.status==='open';}).length)
    ].join('');
    document.getElementById('roles').innerHTML=table(['角色','席位','职责','模型','会议','派单'],
      (ro.roles||[]).map(function(x){return [esc(x.name)+'（'+esc(x.role)+'）',esc(x.seat_id),esc(x.duty),esc(x.model||'-'),esc(x.meetings),esc(x.orders)];}));
    document.getElementById('agenda').innerHTML=table(['类型','议题','owner','状态','来源'],
      (ag.items||[]).slice().reverse().slice(0,40).map(function(x){return [esc(x.kind),esc(x.item),esc(x.owner||'-'),esc(x.status),esc(x.source)];}));
    document.getElementById('directives').innerHTML=table(['Directive','类型','议题','军团','owner','状态','due'],
      dirs.slice(0,40).map(function(x){return [esc(x.id),esc(x.kind),esc(x.topic),esc(x.legion||'-'),esc(x.owner||'-'),pill(x.status),esc(x.due||'-')];}));
    document.getElementById('reports').innerHTML=table(['军团','进度','状态','任务','阻塞','ETA'],
      reps.slice(0,30).map(function(x){return [esc((x.scope||{}).legion||'-'),esc(x.progress==null?'-':x.progress+'%'),pill(x.status),esc(x.tasks_total),esc(x.blockers_count),esc(x.eta||'-')];}));
  }catch(e){
    document.getElementById('meta').textContent='加载失败';
    document.getElementById('error').innerHTML='<div class="err">只读预览加载失败：'+esc(e.message)+'（正式入口请登录 /hq）</div>';
  }
}
main();
})();
</script>
</body>
</html>
