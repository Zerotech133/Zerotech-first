<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📡 雪球情报日报 · 零界工作站</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:"Microsoft YaHei",Arial,sans-serif;margin:0;padding:0 0 40px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 20px 0}
h1{font-size:20px;margin:14px 0 4px;color:#e6edf3}
h1 .sub{font-size:12px;color:#8b949e;font-weight:400;margin-left:10px}
h2{font-size:14px;color:#8b949e;margin:26px 0 10px;letter-spacing:.5px}
input[type=date]{background:#161b22;border:1px solid #30363d;border-radius:8px;color:#c9d1d9;padding:5px 10px;font-size:12.5px}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.metric{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:12px 14px}
.metric .k{font-size:11.5px;color:#8b949e}
.metric .v{font-size:22px;font-weight:600;color:#e6edf3;margin-top:4px;font-family:Consolas,monospace}
.metric .v.warn{color:#d29922}.metric .v.bad{color:#f85149}.metric .v.good{color:#3fb950}
.panel{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:13px 16px;margin-bottom:12px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:8px 0 4px;background:#21262d}
.bar span{display:block;height:100%}
.legend{font-size:11.5px;color:#8b949e}
.legend b{color:#c9d1d9;font-weight:600}
.ctrow{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:12px}
.ctrow .lb{flex:none;width:6.5em;text-align:right;color:#8b949e}
.ctrow .tr{flex:1;height:14px;background:#21262d;border-radius:7px;overflow:hidden}
.ctrow .tr span{display:block;height:100%}
.ctrow .n{flex:none;min-width:2.2em;font-family:Consolas,monospace;color:#c9d1d9}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:#8b949e;text-align:left;font-weight:400;padding:5px 8px;border-bottom:1px solid #21262d}
td{padding:6px 8px;border-bottom:1px solid #161b22}
td.num{font-family:Consolas,monospace}
.bear{color:#f85149;font-weight:600}.bull{color:#3fb950}.neut{color:#8b949e}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#21262d;border:1px solid #30363d;border-radius:999px;padding:3px 11px;font-size:12px;color:#c9d1d9}
.chip b{color:#58a6ff;font-weight:600;font-family:Consolas,monospace}
.empty{color:#8b949e;font-size:12.5px;padding:8px 0}
footer{margin-top:30px;color:#484f58;font-size:11px;text-align:center}
.err{color:#f85149;font-size:12.5px}
</style>
<script src="/static/nav.js?v=20261018-p2a"></script>
<script src="/static/nav.js" defer></script></head>
<body>
<div class="wrap">
<h1>📡 雪球情报日报 <span class="sub">舆情打标 · 异动信号 · 高置信观点 · 源 /api/xq/intel</span></h1>
<div style="margin:10px 0 4px;display:flex;align-items:center;gap:12px;flex-wrap:wrap"><input type="date" id="d" onchange="load()"><span class="chips" id="dchips" style="display:none"></span></div>

<section><h2>一 · 总览</h2><div class="metrics" id="metrics"><span class="empty">加载中…</span></div></section>

<section><h2>二 · 情绪与事件分布（当日新帖）</h2><div class="panel" id="dist"><span class="empty">加载中…</span></div></section>

<section><h2>三 · 异动信号（bearish 突增 · 对比前 6 日基线）</h2><div class="panel" id="anom"><span class="empty">加载中…</span></div></section>

<section><h2>四 · 高置信信号（confidence ≥ 0.8 · 个股/策略/行情 · 带代码）</h2><div class="panel" id="sig"><span class="empty">加载中…</span></div></section>

<section><h2>五 · 热门标的</h2><div class="panel" id="hot"><span class="empty">加载中…</span></div><div id="tickerCard"></div></section>

<section><h2>六 · 管道体检</h2><div class="panel" id="health"><span class="empty">加载中…</span></div></section>

<footer>雪球情报日报 P2a · 2026-10-18 · 生成器 xq_daily_report.py（每日 19:00）· 出口 api_xq_intel.py</footer>
</div>

<script>
function el(id){return document.getElementById(id)}
function esc(s){return String(s==null?'?':s).replace(/[&<>"]/g,function(c){
 return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}

function metric(k,v,cls){return '<div class="metric"><div class="k">'+k+'</div><div class="v '+(cls||'')+'">'+v+'</div></div>'}

function render(d){
 if(d.report_exists===false){el('metrics').innerHTML='<span class="empty">该日无日报 —— 日报由 xq_daily_report.py 每日 19:00 生成；历史日期可手动补跑 <code>--date</code>。</span>';
  ['dist','anom','sig','hot','health'].forEach(function(i){el(i).innerHTML='<span class="empty">（无数据）</span>'});return}
 if(d.error){el('metrics').innerHTML='<span class="err">数据损坏：'+esc(d.error)+'</span>';return}
 var cov=d.posts_today?Math.round(100*d.classified_today/d.posts_today):null;
 el('metrics').innerHTML=
   metric('当日新帖（战术情报）',d.posts_today||0,(d.posts_today?'':'neut'))
  +metric('当日采集入库（管道）',d.ingested_today||0)
  +metric('打标覆盖率',cov===null?'—':cov+'%',cov!==null&&cov<50?'warn':'good')
  +metric('异动信号',(d.anomaly_signals||[]).length,(d.anomaly_signals||[]).length?'bad':'good')
  +metric('高置信观点',(d.high_confidence||[]).length);

 var s=d.sentiment||{},tot=(s.bullish||0)+(s.neutral||0)+(s.bearish||0);
 var ev=d.event_type||{},evk=Object.keys(ev).sort(function(a,b){return ev[b]-ev[a]});
 var bar='';
 if(tot){[['bullish','#3fb950','#3fb950'],['neutral','#8b949e','#8b949e'],['bearish','#f85149','#f85149']].forEach(function(x){
   var n=s[x[0]]||0;if(n)bar+='<span style="width:'+(100*n/tot)+'%;background:'+x[1]+'"></span>'})}
 el('dist').innerHTML=(tot?
   '<div class="bar">'+bar+'</div><div class="legend">bullish <b>'+(s.bullish||0)+'</b> · neutral <b>'+(s.neutral||0)+'</b> · bearish <b>'+(s.bearish||0)+'</b>（共 '+tot+'）</div>':
   '<div class="empty">当日新帖为空（18:00 生产轮产出后才有战术数据；历史回填帖不在当日窗口）</div>')
  +(evk.length?'<div style="margin-top:10px" class="legend">事件分布：</div><div class="chips" style="margin-top:6px">'
    +evk.map(function(k){return '<span class="chip">'+esc(k)+' <b>'+ev[k]+'</b></span>'}).join('')+'</div>':'');

 var ct=d.content_type||{};
 var ctn={tech:'技术面分析',community:'社区探讨',news:'个股资讯',fundamental:'基本面逻辑',edu:'投教科普',ad:'广告活动'};
 var ctc={tech:'#1f6feb',community:'#2f7df2',news:'#4493f8',fundamental:'#58a6ff',edu:'#79b8ff',ad:'#9ecbff'};
 var ctk=Object.keys(ct).filter(function(k){return ct[k]>0}).sort(function(a,b){return ct[b]-ct[a]});
 var ctot=0;ctk.forEach(function(k){ctot+=ct[k]});
 var ctb='';
 if(ctot)ctk.forEach(function(k){
   var col=ctc[k]||'#484f58',nm=ctn[k]||(k==='(待补)'?'（待补）':k);
   ctb+='<div class="ctrow"><span class="lb">'+esc(nm)+'</span><span class="tr"><span style="width:'+(100*ct[k]/ctot)+'%;background:'+col+'"></span></span><span class="n">'+ct[k]+'</span></div>'});
 el('dist').innerHTML+=(ctot?'<div style="margin-top:14px" class="legend">内容形态分布（v1.3 六类 · 共 '+ctot+'）：</div>'+ctb:'');

 var an=d.anomaly_signals||[];
 el('anom').innerHTML=an.length?
   '<table><tr><th>代码</th><th>当日样本</th><th>bearish</th><th>前 6 日基线</th><th>强度</th></tr>'
   +an.map(function(r){var st=r.baseline6d?(r.bearish-r.baseline6d):r.bearish;
     return '<tr><td class="num"><b>'+esc(r.code)+'</b></td><td class="num">'+r.n+'</td><td class="num bear">'+r.bearish+'</td><td class="num">'+r.baseline6d+'</td><td>'+(st>0?'+'+st:st)+'</td></tr>'}).join('')+'</table>'
   :'<div class="empty">（无——当日无达标标的）</div>';

 var sg=d.high_confidence||[];
 el('sig').innerHTML=sg.length?
   '<table><tr><th>conf</th><th>代码</th><th>情绪</th><th>事件</th><th>标题</th></tr>'
   +sg.map(function(r){return '<tr><td class="num">'+Number(r.confidence).toFixed(2)+'</td><td class="num"><b>'+esc(r.code)+'</b></td><td class="'+(r.sentiment==='bullish'?'bull':r.sentiment==='bearish'?'bear':'neut')+'">'+esc(r.sentiment)+'</td><td>'+esc(r.event_type)+'</td><td>'+esc(r.title)+'</td></tr>'}).join('')+'</table>'
   :'<div class="empty">（无）</div>';

 var tc=d.top_codes||{},tt=d.top_themes||{};
 el('hot').innerHTML='<div class="legend">个股/ETF/港股代码：</div><div class="chips" style="margin:6px 0 10px">'
   +(Object.keys(tc).length?Object.keys(tc).sort(function(a,b){return tc[b]-tc[a]}).map(function(k){return '<span class="chip" data-code="'+esc(k)+'" style="cursor:pointer"><b>'+esc(k)+'</b> ×'+tc[k]+'</span>'}).join(''):'<span class="empty">（无）</span>')
   +'</div><div class="legend">主题词（基金/指数）：</div><div class="chips" style="margin-top:6px">'
   +(Object.keys(tt).length?Object.keys(tt).sort(function(a,b){return tt[b]-tt[a]}).map(function(k){return '<span class="chip">'+esc(k)+' <b>'+tt[k]+'</b></span>'}).join(''):'<span class="empty">（无）</span>')+'</div>';

 var pipe=d.pipeline||{},exv=d.extractor_version,lin=[];
 if(pipe.llm_model)lin.push('标注引擎 '+esc(pipe.llm_model));
 if(pipe.prompt_version)lin.push('prompt '+esc(pipe.prompt_version));
 if(exv)lin.push('提取器 '+esc(exv));
 el('health').innerHTML='库内已打标 vs 总量、模型 lineage 等体检明细见机读版：<a href="/api/xq/intel?date='+(d.date||'')+'" style="color:#58a6ff">/api/xq/intel?date='+(d.date||'')+'</a>'
   +(lin.length?'<div class="legend" style="margin-top:6px">'+lin.join(' · ')+'</div>':'')
   +'<div class="legend" style="margin-top:6px">生成时间 '+(d.generated_at||'—')+' · 双口径说明：战术情报=created_at 当日新帖；管道健康=fetched_at 当日采集入库（含播种/回填）</div>';
}

function load(){
 var v=el('d').value;
 fetch('/api/xq/intel'+(v?'?date='+v:'')).then(function(r){return r.json()}).then(function(d){
   el('d').value=d.date||v;render(d);
 }).catch(function(){el('metrics').innerHTML='<span class="err">/api/xq/intel 不可达</span>'});
}
function pickDate(dt){el('d').value=dt;load()}

/* —— 标的下钻（热门标的 chip 点击 → /api/xq/intel/ticker 聚合卡）—— */
var tickerCur=null;
function tickerRender(j){
 if(!j||j.error)return '<span class="err">'+esc(j&&j.error||'空响应')+'</span>';
 var hc=j.high_confidence||[],an=j.anomaly||[],sc=j.sentiment_count||{};
 var h='<div class="legend">近 <b>'+esc(j.days)+'</b> 天 · 命中日报 <b>'+esc(j.dates_found)+'</b> 天 · 高置信 <b>'+hc.length+'</b> 条 · 异动 <b>'+an.length+'</b> 次 · 情绪 bullish <b>'+(sc.bullish||0)+'</b> / neutral <b>'+(sc.neutral||0)+'</b> / bearish <b>'+(sc.bearish||0)+'</b></div>';
 if(!hc.length&&!an.length)return h+'<div class="empty">近 '+esc(j.days)+' 天日报无该标的高置信/异动记录</div>';
 var cls={bullish:'bull',bearish:'bear',neutral:'neut'};
 if(hc.length){
  h+='<table><tr><th>日期</th><th>conf</th><th>情绪</th><th>事件</th><th>标题</th></tr>'
   +hc.map(function(r){return '<tr><td class="num">'+esc(r.date)+'</td><td class="num">'+(r.confidence==null?'—':Number(r.confidence).toFixed(2))+'</td><td class="'+(cls[r.sentiment]||'neut')+'">'+esc(r.sentiment||'—')+'</td><td>'+esc(r.event_type||'—')+'</td><td>'+esc(r.title||'—')+'</td></tr>'}).join('')+'</table>';
 }
 if(an.length){
  h+='<div class="legend" style="margin-top:8px">异动信号（bearish 突增 · 对比前 6 日基线）：</div><table><tr><th>日期</th><th>当日样本</th><th>bearish</th><th>前 6 日基线</th></tr>'
   +an.map(function(r){return '<tr><td class="num">'+esc(r.date)+'</td><td class="num">'+esc(r.n)+'</td><td class="num bear">'+esc(r.bearish)+'</td><td class="num">'+esc(r.baseline6d)+'</td></tr>'}).join('')+'</table>';
 }
 return h;
}
function tickerToggle(code){
 if(tickerCur===code){tickerCur=null;el('tickerCard').innerHTML='';return}
 tickerCur=code;
 el('tickerCard').innerHTML='<div class="panel"><span class="empty">加载 <b style="color:#58a6ff;font-family:Consolas,monospace">'+esc(code)+'</b> 近 7 天下钻中…</span></div>';
 fetch('/api/xq/intel/ticker?code='+encodeURIComponent(code)+'&days=7').then(function(r){
  return r.json().then(function(j){return {ok:r.ok,j:j}})
 }).then(function(o){
  if(tickerCur!==code)return;
  el('tickerCard').innerHTML='<div class="panel"><div class="legend" style="margin-bottom:4px">标的舆情下钻 <b style="color:#58a6ff;font-family:Consolas,monospace">'+esc(o.j&&o.j.code||code)+'</b> · 源 /api/xq/intel/ticker</div>'+tickerRender(o.j)+'</div>';
 }).catch(function(){
  if(tickerCur!==code)return;
  el('tickerCard').innerHTML='<div class="panel"><span class="err">/api/xq/intel/ticker 不可达（'+esc(code)+'）</span></div>';
 });
}
el('hot').addEventListener('click',function(ev){
 var t=ev.target&&ev.target.closest?ev.target.closest('[data-code]'):null;
 if(t)tickerToggle(t.getAttribute('data-code'));
});

function loadDates(){
 fetch('/api/xq/intel/dates').then(function(r){return r.json()}).then(function(j){
  var ds=(j&&j.dates)||[];if(!ds.length)return;
  var today=new Date().toLocaleDateString('sv-SE');
  ds.sort(function(a,b){if(a===today)return -1;if(b===today)return 1;return a>b?-1:1});
  el('dchips').innerHTML='近7日：'+ds.slice(0,7).map(function(dt){
    return '<span class="chip" style="cursor:pointer" data-date="'+dt+'" onclick="pickDate(this.getAttribute(\'data-date\'))">'+dt+'</span>'}).join('');
  el('dchips').style.display='';
 }).catch(function(){/* 静默隐藏零干扰：日期导航失败不影响主渲染 */});
}
el('d').value=new Date().toLocaleDateString('sv-SE');
load();
loadDates();
</script>
<script src="/static/dataops_link.js" data-entity="page:xq_intel" defer></script>
</body>
</html>
