<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>零界 · 语音质量门槛（真人 10 条）</title>
<link rel="stylesheet" href="/static/tokens.css">
<script src="/static/nav.js" defer></script>
<script src="/static/shortscreen.js" defer></script>
<style>
  .wrap{max-width:820px;margin:0 auto;padding:16px 18px 90px}
  h1{font-size:21px;margin:4px 0 4px}
  .sub{color:#5a6f83;font-size:13px;margin:0 0 10px}
  .banner{border-left:4px solid #936224;background:#faf3e6;padding:8px 12px;border-radius:6px;font-size:12.5px;margin:8px 0 14px}
  .card{background:#fff;border:1px solid #dbe5ee;border-radius:16px;padding:16px 18px;margin:12px 0;box-shadow:0 2px 10px rgba(14,116,144,.05)}
  .prompt{font-size:20px;font-weight:700;color:#173a4d;line-height:1.5;margin:8px 0}
  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#e6f4f8;color:#0e7490;font-weight:700}
  .miss{background:#faf3e6;color:#936224}
  button{cursor:pointer;font:600 15px/1.2 inherit;border:0;border-radius:12px;padding:12px 18px}
  .mic{font-size:17px;padding:15px 24px;border-radius:999px;background:#0e7490;color:#fff}
  .mic.listening{background:#b3402e;animation:pulse 1s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(179,64,46,.5)}100%{box-shadow:0 0 0 14px rgba(179,64,46,0)}}
  button.ghost{background:#fff;color:#0e7490;border:1.5px solid #bcd8e2}
  button.ok{background:#227a4b;color:#fff}
  button:disabled{opacity:.45;cursor:not-allowed}
  .muted{color:#5a6f83;font-size:12.5px}
  .heard{background:#f4f9fb;border-radius:10px;padding:10px 12px;margin:8px 0;font-size:14px;min-height:24px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
  .err{color:#b3402e;font-size:13px;white-space:pre-wrap}
  table{border-collapse:collapse;width:100%;font-size:13px;margin-top:8px}
  th,td{border:1px solid #dbe5ee;padding:5px 7px;text-align:left;vertical-align:top}
  th{background:#f4f9fb}
  .pass{color:#227a4b;font-weight:700;font-size:18px}
  .fail{color:#b3402e;font-weight:700;font-size:18px}
  .progress{font-size:13px;color:#0e7490;font-weight:700}
</style>
<meta name=wb-shell content=adopted></head>
<body>
<main class="wrap">
  <h1>语音质量门槛 · 真人 10 条</h1>
  <p class="sub">5 条长句 + 5 条标准命令 + 3 条重庆方言命令。每条点 🎤 说一遍，页面自动识别并计分；录音只发给本机 8091，不出本机。</p>
  <div class="banner">门槛：**标准命令 5/5** 且 **方言命令 3/3** 且 **长句平均 CER ≤ 10%**。通过后语音才转正；未通过仍可用纯文字（不阻塞做事）。<span id="asr-badge" class="tag">检测中…</span></div>

  <section class="card">
    <div class="row" style="justify-content:space-between">
      <span class="progress" id="progress">第 1 / 10 条</span>
      <span class="muted" id="device">麦克风：未打开</span>
    </div>
    <div><span class="tag" id="kind-tag">长句</span></div>
    <div class="prompt" id="prompt">—</div>
    <div class="heard" id="heard">点下面 🎤 开始说，说完自动停止。</div>
    <div class="row">
      <button class="mic" id="b-rec">🎤 点一下开始说</button>
      <button class="ghost" id="b-retry" disabled>重录本句</button>
      <button class="ghost" id="b-next" disabled>下一条 →</button>
    </div>
    <p class="row muted" id="score-line"></p>
  </section>

  <section class="card" id="summary" hidden>
    <div class="progress">评测结果</div>
    <div id="verdict" style="margin:8px 0"></div>
    <div id="detail"></div>
    <div class="row"><button class="ghost" id="b-copy">复制结果</button><button class="ghost" id="b-again">重新评测</button></div>
  </section>

  <p class="err" id="err" hidden></p>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ITEMS=[
  {kind:'long', text:'做个页面，让我每天打开就能看三条简报摘要'},
  {kind:'long', text:'帮我写一份商业计划，讲讲一个人怎么用 AI 组队做四类成果'},
  {kind:'long', text:'每天早上九点提醒我看盘前简报和昨日复盘'},
  {kind:'long', text:'把今天的新闻里关于人工智能的三条整理成一页'},
  {kind:'long', text:'我想让团队每周自动汇总一次各工作面的进展'},
  {kind:'cmd', text:'行'},
  {kind:'cmd', text:'可以，按这个办'},
  {kind:'cmd', text:'接受'},
  {kind:'cmd', text:'这里改，标题改成今日简报'},
  {kind:'cmd', text:'停止'},
  {kind:'dial', text:'要得', canon:'accept'},
  {kind:'dial', text:'要不得', canon:'reject'},
  {kind:'dial', text:'巴适得板', canon:'accept'}
];
let IDX=0, RESULTS=[], RECORDING=false, REC_STOP=null;
function norm(t){ const s=String(t||'').replace(/[\s，。！？、,.!?;；:："'“”‘’()（）~～-]/g,'');
  const map={'零':'0','〇':'0','一':'1','二':'2','两':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9'};
  return s.replace(/[零〇一二两三四五六七八九]/g, ch=>map[ch]||ch); }
function cer(ref,hyp){ ref=norm(ref); hyp=norm(hyp); if(!ref) return hyp?1:0;
  const m=ref.length,n=hyp.length; const dp=Array.from({length:n+1},(_,j)=>j);
  for(let i=1;i<=m;i++){ let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){ const cur=dp[j]; dp[j]=Math.min(dp[j]+1,dp[j-1]+1,prev+(ref[i-1]===hyp[j-1]?0:1)); prev=cur; } }
  return dp[n]/m; }
function dialectCanon(t){
  const s=norm(t);
  if(/要不得|不得行|莫得|不巴适|不行|不对/.test(s)) return 'reject';
  if(/要得|要的|可以噻|行噻|巴适|满意|不错/.test(s)) return 'accept';
  return '';
}
function setStatus(m){ $('score-line').textContent=m||''; }
function showErr(m){ const e=$('err'); e.hidden=false; e.textContent=String(m); }
function clearErr(){ $('err').hidden=true; }
function resampleTo16k(buf,inRate){ if(inRate===16000) return buf;
  const ratio=inRate/16000, outLen=Math.max(1,Math.floor(buf.length/ratio)), out=new Float32Array(outLen);
  for(let i=0;i<outLen;i++){ const pos=i*ratio,i0=Math.floor(pos),i1=Math.min(buf.length-1,i0+1),frac=pos-i0; out[i]=buf[i0]*(1-frac)+buf[i1]*frac; } return out; }
function encodeWav16k(samples){ const len=samples.length, ab=new ArrayBuffer(44+len*2), dv=new DataView(ab);
  const w=(o,s)=>{ for(let i=0;i<s.length;i++) dv.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); dv.setUint32(4,36+len*2,true); w(8,'WAVE'); w(12,'fmt '); dv.setUint32(16,16,true);
  dv.setUint16(20,1,true); dv.setUint16(22,1,true); dv.setUint32(24,16000,true); dv.setUint32(28,32000,true);
  dv.setUint16(32,2,true); dv.setUint16(34,16,true); w(36,'data'); dv.setUint32(40,len*2,true);
  for(let i=0;i<len;i++){ let v=Math.max(-1,Math.min(1,samples[i])); dv.setInt16(44+i*2, v<0?v*0x8000:v*0x7FFF, true); } return ab; }
function abToB64(ab){ const b=new Uint8Array(ab); let s=''; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function fetchTimeout(url,opt,ms){ const c=new AbortController(); const t=setTimeout(()=>c.abort(),ms);
  return fetch(url,Object.assign({signal:c.signal},opt||{})).finally(()=>clearTimeout(t)); }
async function transcribe(wavAb, timeoutMs){
  const b64=abToB64(wavAb);
  const r=await fetchTimeout('/api/os/asr',{method:'POST',headers:{'Content-Type':'application/json','X-OS-Page':'quick'},body:JSON.stringify({audio_b64:b64,lang:'zh'})}, timeoutMs||90000);
  const d=await r.json().catch(()=>({}));
  if(!r.ok||d.ok===false) throw new Error(d.error||('HTTP '+r.status));
  return String(d.text||'').trim();
}
async function checkAsr(){
  try{ const d=await (await fetch('/api/os/asr/status')).json();
    if(d.engine==='sensevoice_local'){ $('asr-badge').textContent=d.loaded?'本地 ASR 就绪':'本地 ASR 加载中…'; }
    else { $('asr-badge').textContent='本地 ASR 不可用'; }
  }catch(e){ $('asr-badge').textContent='本地 ASR 不可用'; }
}
async function recoverAsr(){
  try{
    setStatus('本地识别熔断，正在自动恢复（约 10-30 秒）…');
    await fetch('/api/os/asr/recover',{method:'POST',headers:{'Content-Type':'application/json','X-OS-Page':'quick'},body:'{}'});
    for(let i=0;i<30;i++){
      await new Promise(r=>setTimeout(r,2000));
      const d=await (await fetch('/api/os/asr/status')).json();
      if(d.loaded && !d.broken){ $('asr-badge').textContent='本地 ASR 就绪'; setStatus('本地识别已恢复，请点“重录本句”'); return; }
      if(d.broken){ break; }
    }
    setStatus('自动恢复未完成，请刷新页面或稍后再试');
  }catch(e){ setStatus('自动恢复失败：'+e.message); }
}
async function recordOnce(){
  if(RECORDING) return;
  const item=ITEMS[IDX];
  clearErr(); setStatus('');
  $('heard').textContent='正在准备麦克风…';
  let stream;
  try{ stream=await navigator.mediaDevices.getUserMedia({audio:true}); }
  catch(e){ $('heard').textContent='麦克风打不开：'+(e.name||e.message); showErr('请点地址栏 🔒/🎤 允许麦克风后刷新'); return; }
  $('device').textContent='麦克风：'+(((stream.getAudioTracks()[0]||{}).label)||'默认');
  RECORDING=true; $('b-rec').classList.add('listening'); $('b-rec').textContent='🔴 正在听…（说完自动停）';
  const ctx=new AudioContext(); try{ if(ctx.state==='suspended') await ctx.resume(); }catch(e){}
  const rate=ctx.sampleRate; const src=ctx.createMediaStreamSource(stream); const proc=ctx.createScriptProcessor(4096,1,1);
  const chunks=[], t0=performance.now(); let loud=false,lastLoud=0,stopped=false,level=0,warned=false;
  const cleanup=()=>{ RECORDING=false; REC_STOP=null; try{proc.disconnect();src.disconnect();ctx.close();}catch(e){} try{stream.getTracks().forEach(t=>t.stop());}catch(e){} $('b-rec').classList.remove('listening'); $('b-rec').textContent='🎤 点一下开始说'; };
  const finish=async()=>{ if(stopped) return; stopped=true; clearInterval(watch); cleanup();
    if(!loud || chunks.reduce((a,c)=>a+c.length,0)<rate*0.25){ $('heard').textContent='没有收到声音，请检查麦克风后重录'; return; }
    const all=new Float32Array(chunks.reduce((a,c)=>a+c.length,0)); let off=0; chunks.forEach(c=>{all.set(c,off);off+=c.length;});
    $('heard').textContent='识别中…';
    try{ const text=await transcribe(encodeWav16k(resampleTo16k(all,rate)));
      const c=cer(item.text,text);
      const isDial=item.kind==='dial';
      const exact=isDial ? (dialectCanon(text)===item.canon) : (norm(item.text)===norm(text));
      $('heard').innerHTML='我听到：<b>'+esc(text||'（空）')+'</b>';
      $('score-line').textContent=exact
        ? (isDial ? '✅ 方言命令理解正确（'+esc(text)+'）' : '✅ 与目标完全一致')
        : (isDial ? '⚠ 方言命令未理解（听到：'+esc(text)+'）' : '⚠ 有差异 · CER '+(c*100).toFixed(1)+'%');
      $('b-next').disabled=false; $('b-retry').disabled=false;
      RESULTS[IDX]={text:item.text,heard:text,cer:c,exact,kind:item.kind};
    }catch(e){
      $('heard').textContent='识别失败：'+e.message;
      showErr('本地识别失败：'+e.message+'（可点重录本句）');
      $('b-retry').disabled=false;
      if(String(e.message).includes('asr_unavailable')) recoverAsr();
    }
  };
  REC_STOP=finish;
  proc.onaudioprocess=e=>{ const d=new Float32Array(e.inputBuffer.getChannelData(0)); chunks.push(d);
    let s=0; for(let i=0;i<d.length;i++) s+=d[i]*d[i]; const rms=Math.sqrt(s/d.length); level=rms;
    if(rms>0.004){ loud=true; lastLoud=performance.now(); } };
  src.connect(proc); proc.connect(ctx.destination);
  const watch=setInterval(()=>{ const now=performance.now();
    if(loud && now-lastLoud>1100) finish();
    else if(!loud && now-t0>4000 && !warned){ warned=true; $('heard').textContent='没收到声音（音量 '+Math.round(level*400)+'），请靠近麦克风或检查系统输入设备…'; }
    else if(now-t0>15000 || (!loud && now-t0>9000)) finish();
  },120);

}
function render(){
  const item=ITEMS[IDX];
  $('progress').textContent='第 '+(IDX+1)+' / '+ITEMS.length+' 条';
  $('kind-tag').textContent=item.kind==='cmd'?'命令（必须全对）':(item.kind==='dial'?'方言命令（理解对即可）':'长句（看 CER）');
  $('kind-tag').className='tag'+(item.kind!=='long'?' miss':'');
  $('prompt').textContent=item.text;
  $('heard').textContent='点下面 🎤 开始说，说完自动停止。';
  $('score-line').textContent=''; $('b-next').disabled=true; $('b-retry').disabled=true;
  $('b-rec').classList.remove('listening'); $('b-rec').textContent='🎤 点一下开始说';
  $('b-next').textContent=IDX===ITEMS.length-1?'完成并计分 ✓':'下一条 →';
}
function summary(){
  const longs=RESULTS.filter(r=>r&&r.kind==='long'); const cmds=RESULTS.filter(r=>r&&r.kind==='cmd');
  const dials=RESULTS.filter(r=>r&&r.kind==='dial');
  const cmdOk=cmds.filter(r=>r.exact).length;
  const dialOk=dials.filter(r=>r.exact).length;
  const longCer=longs.length?longs.reduce((a,r)=>a+r.cer,0)/longs.length:1;
  const pass=(cmdOk===5 && dialOk===3 && longCer<=0.10);
  $('summary').hidden=false;
  $('verdict').innerHTML='<span class="'+(pass?'pass':'fail')+'">'+(pass?'✅ 通过：语音可以转正':'❌ 未通过：继续用纯文字 + 调优')+'</span>'
    +'<div class="muted">标准命令 '+cmdOk+'/5 · 方言命令 '+dialOk+'/3 · 长句平均 CER '+(longCer*100).toFixed(1)+'%（≤10% 达标）</div>';
  let rows='<table><tr><th>#</th><th>类型</th><th>目标</th><th>听到</th><th>结果</th></tr>';
  ITEMS.forEach((it,i)=>{ const r=RESULTS[i]||{heard:'（未录）',cer:1,exact:false};
    rows+='<tr><td>'+(i+1)+'</td><td>'+(it.kind==='cmd'?'命令':'长句')+'</td><td>'+esc(it.text)+'</td><td>'+esc(r.heard)+'</td><td>'+(r.exact?'✅':'⚠ '+(r.cer*100).toFixed(1)+'%')+'</td></tr>'; });
  rows+='</table>';
  $('detail').innerHTML=rows;
  window.__RESULT__={pass,cmdOk,longCer,rows:RESULTS,at:new Date().toISOString()};
}
$('b-rec').onclick=()=>{
  if(RECORDING){ RECORDING=false; try{ REC_STOP&&REC_STOP(); }catch(e){} return; }
  recordOnce();
};
$('b-retry').onclick=()=>{ RESULTS[IDX]=null; render(); };
$('b-next').onclick=()=>{ IDX++; if(IDX>=ITEMS.length){ summary(); } else { render(); } };
$('b-copy').onclick=async()=>{ const t=JSON.stringify(window.__RESULT__||{},null,1); try{ await navigator.clipboard.writeText(t); $('b-copy').textContent='已复制'; }catch(e){ showErr(t); } };
$('b-again').onclick=()=>{ IDX=0; RESULTS=[]; $('summary').hidden=true; render(); };
render(); checkAsr();
</script>
<!-- OS-UI-UNIFY:theme -->
<link rel="stylesheet" href="/static/os_theme.css" data-os-unify="1">
<!-- OS-UI-UNIFY:drill -->
<script defer src="/static/os_drill.js" data-os-unify="1"></script>

<!-- PAGE-SHELL-GEN:v2 -->
<link rel="stylesheet" href="/static/ui/ui.css" data-page-shell="1">
<script defer src="/static/ui/ui.js" data-page-shell="1"></script>
</body>
