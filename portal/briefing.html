<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>零界 · 田丰早间简报</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/ui/ui.css">
<script src="/static/nav.js" defer></script>
<style>
body{margin:0;background:var(--bg-page);color:var(--text);font-family:var(--font-ui)}
.wrap{max-width:1210px;margin:0 auto;padding:20px 24px 56px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
h1{font-size:22px;margin:18px 0 4px}.meta{color:var(--text-dim);font-size:12px;margin:6px 0}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.card{background:var(--bg-raised);border:1px solid var(--border);border-radius:10px;padding:12px}
.card .k{color:var(--text-dim);font-size:11.5px}.card .v{font-size:22px;font-weight:700;margin-top:4px}
h2{font-size:15px;margin:22px 0 8px}
.list{display:grid;gap:8px}
.item{display:block;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-surface);color:inherit;text-decoration:none}
.item:hover{border-color:var(--link)}
.item .t{font-weight:650;margin-bottom:4px}.item .m{color:var(--text-dim);font-size:12px}
.pill{display:inline-block;padding:2px 7px;border-radius:999px;border:1px solid var(--border);font-size:11px;margin-right:4px}
.err{padding:12px;border:1px solid var(--red-500);border-radius:10px;color:var(--red-500)}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:14px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><strong>零界 · 田丰早间简报</strong><a href="/hq">返回指挥部</a></div>
  <h1>今日简报</h1>
  <div class="meta" id="meta">加载中…</div>
  <div class="cards" id="cards"></div>
  <div id="error"></div>
  <h2>部门汇报</h2>
  <div id="depts" class="list"></div>
  <h2>研究题（点击进入人专项）</h2>
  <div id="topics" class="list"></div>
</div>
<script>
(function(){
'use strict';
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function card(k,v){return '<div class="card"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div></div>';}
function specLink(t){
  var p=new URLSearchParams({topic:t.id||'',title:t.title||'',source:t.source_lead||t.lead||'',kind:t.kind||'研究'});
  return '/special?'+p.toString();
}
function item(t,extra){
  return '<a class="item" href="'+esc(specLink(t))+'"><div class="t">'+esc(t.title||t.topic||t.item||'未命名研究题')+'</div>'
    +'<div class="m">'+esc(t.kind||'研究')+' · 来源 '+esc(t.source_lead||t.lead||t.source||'-')+(extra||'')+'</div></a>';
}
async function main(){
  try{
    var r=await fetch('/api/hq/snapshot',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var p=await r.json(); if(!(p&&p.ok&&p.data)) throw new Error('bad payload');
    var d=p.data, b=d.briefing||null;
    document.getElementById('meta').textContent='生成 '+new Date().toLocaleString()+' · 数据源 /api/hq/snapshot';
    var dirs=(d.directives&&d.directives.directives)||[];
    var topics=b&&b.research_topics?b.research_topics.slice():[];
    // 无部门早报时，用未派单 Directive 生成 A0 研究题，避免空页
    if(!topics.length){ topics=dirs.filter(function(x){return x.status==='open'||/(分析|研发|挖掘)/.test(x.kind||'');}).slice(0,8).map(function(x){return {id:x.id,title:x.topic,kind:x.kind,source_lead:x.owner||x.legion};}); }
    document.getElementById('cards').innerHTML=[
      card('研究题',topics.length),card('Directive',dirs.length),
      card('部门汇报',b&&b.departments?b.departments.length:0),card('需决策',b&&b.decision_requests?b.decision_requests.length:0)
    ].join('');
    var depts=(b&&b.departments)||[];
    document.getElementById('depts').innerHTML=depts.length?depts.map(function(x){
      return '<div class="item"><div class="t">'+esc(x.lead)+' · '+esc(x.dept)+' <span class="pill">'+esc(x.status)+'</span></div><div class="m">工作要点：'+esc((x.highlights||[]).join('；')||'未填')+'<br>阻塞：'+esc((x.blockers||[]).join('；')||'无')+'</div></div>';
    }).join(''):'<div class="meta">今日部门早报尚未汇总（13 位负责人 07:50 前提交，A0 用 <code>tools/hq_dept_brief.py --collect ... --briefing</code> 生成）。</div>';
    document.getElementById('topics').innerHTML=topics.length?topics.map(function(t){return item(t);}).join(''):'<div class="meta">暂无研究题。</div>';
  }catch(e){
    document.getElementById('error').innerHTML='<div class="err">简报加载失败：'+esc(e.message)+'（需登录 /hq）</div>';
    document.getElementById('meta').textContent='加载失败';
  }
}
main();
})();
</script>
</body>
</html>
