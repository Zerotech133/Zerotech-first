<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🧬 管道血缘 · 零界工作站</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{background:#0d1117;color:#c9d1d9;font-family:"Microsoft YaHei",Arial,sans-serif;margin:0;padding:0 0 40px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 20px 0}
h1{font-size:20px;margin:14px 0 4px;color:#e6edf3}
h1 .sub{font-size:12px;color:#8b949e;font-weight:400;margin-left:10px}
.tabs{display:flex;gap:8px;margin:16px 0 14px;flex-wrap:wrap}
.tab{padding:6px 14px;border:1px solid #30363d;border-radius:999px;color:#8b949e;font-size:12.5px;cursor:pointer;background:#0d1117}
.tab:hover{color:#e6edf3;border-color:#58a6ff}
.tab.on{color:#e6edf3;border-color:#58a6ff;font-weight:600;background:#161b22}
.stat{display:inline-block;margin:0 18px 8px 0;font-size:12px;color:#8b949e}
.stat b{color:#e6edf3;font-size:15px;margin-left:4px}
.card{background:#161b22;border:1px solid #21262d;border-radius:10px;padding:12px 14px;margin-bottom:8px}
.card.bad{border-color:#f8514966}
.card.warn{border-color:#d2992255}
.ttl{font-size:13px;font-weight:600;color:#e6edf3;word-break:break-all}
.meta{font-size:11px;font-family:Consolas,monospace;color:#8b949e;margin-top:5px;line-height:1.7;word-break:break-all}
.pill{display:inline-block;padding:1px 8px;border-radius:999px;font-size:10.5px;margin-left:6px;vertical-align:1px}
.pill.ok{background:#238636;color:#fff}
.pill.fail{background:#b62324;color:#fff}
.pill.lost,.pill.running{background:#9e6a03;color:#fff}
.pill.partial,.pill.skipped{background:#30363d;color:#8b949e}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
th{color:#8b949e;text-align:left;padding:5px 8px;border-bottom:1px solid #21262d;font-weight:400;white-space:nowrap}
td{padding:5px 8px;border-bottom:1px solid #161b22;font-family:Consolas,monospace;word-break:break-all}
td a{color:#58a6ff;text-decoration:none;cursor:pointer}
td a:hover{text-decoration:underline}
.search{display:flex;gap:8px;margin:6px 0 12px}
.search input{flex:1;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#e6edf3;padding:8px 12px;font-size:13px;outline:none}
.search input:focus{border-color:#58a6ff}
.search button{background:#238636;border:none;border-radius:8px;color:#fff;padding:8px 18px;font-size:13px;cursor:pointer}
.empty{color:#8b949e;font-size:12.5px;padding:20px 0;text-align:center}
.err{background:#b6232433;border:1px solid #f85149;border-radius:8px;color:#f85149;padding:10px 14px;font-size:12.5px;margin-bottom:10px}
.backlink{font-size:11.5px;color:#8b949e}
.backlink a{color:#58a6ff}
/* R3-C CATALOG BEGIN · CSS（可折叠「表级 schema / 主键」区块；默认隐藏，404 时页面表现与改造前一致） */
.r3c-box{background:#161b22;border:1px solid #21262d;border-radius:10px;margin:12px 0}
.r3c-box>summary{cursor:pointer;padding:10px 14px;font-size:13px;font-weight:600;list-style:none}
.r3c-box>summary::-webkit-details-marker{display:none}
.r3c-box>summary::before{content:'▸ ';color:#58a6ff}
.r3c-box[open]>summary::before{content:'▾ '}
.r3c-flag{font:600 11px Consolas,monospace;color:#d29922;margin-left:12px}
.r3c-body{padding:0 14px 14px}
.r3c-note{border:1px dashed #30363d;border-radius:8px;padding:10px 12px;color:#8b949e;font-size:12.5px;margin-bottom:10px}
.r3c-hidden{display:none}
.r3c-scroll{overflow:auto;max-height:320px}
/* R3-C CATALOG END */
</style></head>
<body>
<div class="wrap">
  <h1>🧬 管道血缘<span class="sub">表是谁算出来的 · 这张表挂了影响谁 · quant-pg lineage 三表只读</span></h1>
  <div class="backlink">数据资产三件套：<a href="/bt-data-health">🗄 数据仓健康</a> · 本页 🧬 管道血缘 · <a href="http://127.0.0.1:8585" target="_blank">🏛 数据治理 OpenMetadata</a></div>
  <div class="tabs" id="tabs">
    <span class="tab on" data-v="breaks">🚨 断链亮牌</span>
    <span class="tab" data-v="runs">🕰 作业时间线</span>
    <span class="tab" data-v="upstream">⬆ 上游溯源</span>
    <span class="tab" data-v="downstream">⬇ 下游影响面</span>
  </div>
  <div id="stats"></div>
  <div class="search" id="searchbar" style="display:none">
    <input id="tbl" placeholder="输入逻辑表 URN，如 neo4j:TRADED_ON / parquet:tdx/ts_top_inst / jsonl:chanlun_pool" spellcheck="false">
    <button onclick="doSearch()">查询</button>
  </div>
  <div id="errbox"></div>
  <div id="main"><div class="empty">加载中…</div></div>
<!-- R3-C CATALOG BEGIN · 可折叠「表级 schema / 主键」区块：URN 解析出的逻辑表名 → table?name= 只读补「表→字段」血缘；解析失败/404/available:false 静默收起，不改 /api/kg/lineage 主链 -->
<details class="r3c-box r3c-hidden" id="r3cSchemaBox">
  <summary>表级 schema / 主键（catalog 逻辑表口径）<span class="r3c-flag" id="r3cState">catalog 静态快照</span></summary>
  <div class="r3c-body">
    <div class="r3c-note" id="r3cNotice">实时通道未就绪（待 8091 自然重启）</div>
    <div id="r3cSchemaBody"></div>
  </div>
</details>
<!-- R3-C CATALOG END -->
</div>
<script src="/static/nav.js" defer></script>
<script>
let VIEW='breaks', LASTTABLE='';
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pill(st){return `<span class="pill ${esc(st)}">${esc(st)}</span>`}
function link(t){return `<a onclick="jump('${esc(t).replace(/'/g,"\\'")}')">${esc(t)}</a>`}
function jump(t){VIEW='downstream';LASTTABLE=t;$('#tbl').value=t;setTab('downstream');load();}
document.querySelectorAll('.tab').forEach(el=>el.onclick=()=>setTab(el.dataset.v));
function setTab(v){VIEW=v;document.querySelectorAll('.tab').forEach(e=>e.classList.toggle('on',e.dataset.v===v));
  $('#searchbar').style.display=(v==='upstream'||v==='downstream')?'flex':'none';
  if((v==='upstream'||v==='downstream')&&!$('#tbl').value&&LASTTABLE)$('#tbl').value=LASTTABLE;
  load();}
async function load(){
  $('#errbox').innerHTML='';
  const p=new URLSearchParams({view:VIEW});
  const t=$('#tbl').value.trim();
  if((VIEW==='upstream'||VIEW==='downstream')&&!t){$('#main').innerHTML='<div class="empty">请输入表 URN 再查询</div>';$('#stats').innerHTML='';return;}
  if(t){LASTTABLE=t;p.set('table',t);}
  let j;
  try{
    const r=await fetch('/api/kg/lineage?'+p,{cache:'no-store'});
    j=await r.json();
  }catch(e){$('#main').innerHTML='';$('#errbox').innerHTML=`<div class="err">请求失败：${esc(e)}</div>`;return;}
  if(j.error){$('#main').innerHTML='';$('#errbox').innerHTML=`<div class="err">${esc(j.error)}</div>`;return;}
  render(j);
}
function render(j){
  const d=j.data, out=[];
  if(j.view==='breaks'){
    const b=d.broken||[];
    $('#stats').innerHTML=`<span class="stat">在册表<b>${d.tracked_tables}</b></span><span class="stat">健康<b style="color:#3fb950">${d.healthy_count}</b></span><span class="stat">断链亮牌<b style="color:${b.length?'#f85149':'#3fb950'}">${b.length}</b></span><span class="stat">历史非 ok 运行<b>${d.runs_not_ok}</b></span>`;
    if(!b.length)out.push('<div class="empty">✅ 全部产出表最近一次作业均 ok，无断链</div>');
    b.sort((x,y)=>String(y.started_at).localeCompare(String(x.started_at))).forEach(r=>{
      out.push(`<div class="card bad"><div class="ttl">${esc(r.output_table)} ${pill(r.status)}</div>
        <div class="meta">最近作业 ${esc(r.job)} / ${esc(r.step)} · 开始 ${esc(r.started_at)} · 结束 ${esc(r.ended_at||'—')} · 写入 ${esc(r.rows_written==null?'—':r.rows_written)} 行</div></div>`);});
    if(d.all_latest&&d.all_latest.length){
      out.push('<table><tr><th>产出表</th><th>状态</th><th>最近作业</th><th>开始时间</th></tr>');
      d.all_latest.forEach(r=>out.push(`<tr><td>${link(r.output_table)}</td><td>${pill(r.status)}</td><td>${esc(r.job)} / ${esc(r.step)}</td><td>${esc(r.started_at)}</td></tr>`));
      out.push('</table>');}
  }else if(j.view==='runs'){
    $('#stats').innerHTML=`<span class="stat">最近作业<b>${d.length}</b> 条</span>`;
    if(!d.length)out.push('<div class="empty">暂无作业记录</div>');
    out.push('<table><tr><th>状态</th><th>作业 / 步骤</th><th>开始</th><th>结束</th><th>写入行数</th><th>git</th></tr>');
    d.forEach(r=>out.push(`<tr><td>${pill(r.status)}</td><td>${esc(r.job)} / ${esc(r.step)}</td><td>${esc(r.started_at)}</td><td>${esc(r.ended_at||'—')}</td><td>${esc(r.rows_written==null?'—':r.rows_written)}</td><td>${esc(r.git_sha||'—')}</td></tr>`));
    out.push('</table>');
  }else{
    $('#stats').innerHTML=`<span class="stat">${j.view==='upstream'?'⬆ 谁产出过':'⬇ 下游依赖'}<b>${esc(LASTTABLE||$('#tbl').value.trim())}</b></span><span class="stat">命中<b>${d.length}</b> 条边</span>`;
    if(!d.length)out.push('<div class="empty">无血缘边命中——该表未在 lineage_edge 登记（可能未插桩或 URN 拼写不符）</div>');
    else{
      out.push('<table><tr><th>'+(j.view==='upstream'?'产出方':'下游表')+'</th><th>对端表</th><th>变换</th><th>作业</th><th>状态</th><th>时间</th></tr>');
      d.forEach(r=>{
        const a=j.view==='upstream'?r.output_table:(r.input_table||r.output_table);
        const b=j.view==='upstream'?r.input_table:r.output_table;
        out.push(`<tr><td>${link(a)}</td><td>${esc(b)}</td><td>${esc(r.transform||'—')}</td><td>${esc(r.job)} / ${esc(r.step)}</td><td>${pill(r.status)}</td><td>${esc(r.started_at||r.created_at)}</td></tr>`);});
      out.push('</table>');}
  }
  $('#main').innerHTML=out.join('');
}
function doSearch(){load()}
$('#tbl').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
setTab('breaks');
/* R3-C CATALOG BEGIN · 双通道状态机 + URN→表→字段血缘（照 T2 / R2-A 模板；静默回落，不改 /api/kg/lineage 主链） */
var CATALOG_LIVE=null;
var CATALOG_STATE='unknown';
function timeoutSignal(){
  if(typeof AbortSignal!=='undefined' && typeof AbortSignal.timeout==='function') return AbortSignal.timeout(3000);
  if(typeof AbortController!=='undefined'){var ac=new AbortController();setTimeout(function(){ac.abort();},3000);return ac.signal;}
  return undefined;
}
function r3cSetState(t){var el=document.getElementById('r3cState');if(el)el.textContent=t;
  var n=document.getElementById('r3cNotice');if(n){if(t==='catalog 实时')n.classList.add('r3c-hidden');else n.classList.remove('r3c-hidden');}}
/* 从逻辑表 URN 解析 catalog 表名：取冒号后路径的末段（parquet:tdx/ts_top_inst → ts_top_inst；neo4j:TRADED_ON → TRADED_ON）；解析不出返回空串，不猜 */
function parseLogicalTable(urn){
  var s=String(urn==null?'':urn).trim();
  if(!s) return '';
  var i=s.indexOf(':');
  if(i<0) return '';
  var rest=s.slice(i+1).trim();
  if(!rest) return '';
  var segs=rest.split('/').filter(function(x){return x.length>0;});
  if(!segs.length) return '';
  var name=segs[segs.length-1].trim();
  if(!/^[A-Za-z0-9_]+$/.test(name)) return '';
  return name;
}
async function probeCatalog(){
  CATALOG_STATE='unknown'; CATALOG_LIVE=null;
  try{
    var r=await fetch('/api/data/catalog/tables?detail=brief',{cache:'no-store',signal:timeoutSignal()});
    if(!r.ok) throw new Error('HTTP '+r.status);
    var live=await r.json();
    if(!live || live.ok!==true || !(live.total>0)) throw new Error('bad payload');
    CATALOG_LIVE=live; CATALOG_STATE='live';
    r3cSetState('catalog 实时');
  }catch(e){
    /* 静默失败：不写错误日志、不弹窗、不抛未捕获异常；404 时页面表现与改造前一致 */
  }
  if(CATALOG_STATE!=='live'){
    CATALOG_STATE='snapshot'; CATALOG_LIVE=null;
    r3cSetState('catalog 静态快照');
  }
  if(CATALOG_LIVE){ try{ r3cProbeTable(); }catch(e){} }
  return CATALOG_STATE==='live';
}
/* 表级 schema / 主键：URN 解析成功且单表端点 200 才展开；解析失败/404/available:false/超时一律静默收起，不碰 #errbox、不干扰主链 */
async function r3cProbeTable(){
  var box=document.getElementById('r3cSchemaBox');
  if(!box) return;
  var urn=(document.getElementById('tbl')||{}).value||'';
  var name=parseLogicalTable(urn);
  if(!name){ box.classList.add('r3c-hidden'); return; }
  try{
    var r=await fetch('/api/data/catalog/table?name='+encodeURIComponent(name)+'&limit=20',{cache:'no-store',signal:timeoutSignal()});
    var d=null; try{ d=await r.json(); }catch(e){ d=null; }
    if(!r.ok || !d || d.ok!==true || d.available===false){
      box.classList.add('r3c-hidden');
      return;
    }
    box.classList.remove('r3c-hidden');
    var body=document.getElementById('r3cSchemaBody');
    if(body) body.innerHTML=r3cSchemaHtml(d,name);
  }catch(e){
    box.classList.add('r3c-hidden');
  }
}
/* 详情正文：meta.schema[] / primary_key / columns / meta.freshness / sample_note / clamped / limit_applied / 前 20 行，全部经 esc() */
function r3cSchemaHtml(d,name){
  var meta=d.meta||{},cols=Array.isArray(d.columns)?d.columns:[],rows=Array.isArray(d.rows)?d.rows:[];
  var pk=meta.primary_key==null?'—':(Array.isArray(meta.primary_key)?meta.primary_key.join(', '):meta.primary_key);
  var h='<div class="muted" style="font-size:12px;margin-bottom:6px">逻辑表 '+esc(name)+' → '+esc(d.resolved||d.name)+
    ' · catalog v'+esc(CATALOG_LIVE?CATALOG_LIVE.version:'?')+' · 返回 '+esc(d.row_count==null?rows.length:d.row_count)+' 行'+
    (d.truncated?'（已截断）':'')+(d.clamped?' · limit 已截断至 '+esc(d.limit_applied)+' 行':'')+'</div>';
  h+='<table><tbody>'+
    '<tr><th>源</th><td>'+esc(meta.source||'—')+'</td></tr>'+
    '<tr><th>频率</th><td>'+esc(meta.freq||'—')+'</td></tr>'+
    '<tr><th>新鲜度 freshness</th><td>'+esc(meta.freshness==null?'—':meta.freshness)+'</td></tr>'+
    '<tr><th>行数</th><td>'+esc(meta.rows==null?'—':meta.rows)+'</td></tr>'+
    '<tr><th>主键 primary_key</th><td>'+esc(pk)+'</td></tr>'+
    '<tr><th>columns</th><td>'+esc(cols.length?cols.join(', '):'—')+'</td></tr></tbody></table>';
  var schema=Array.isArray(meta.schema)?meta.schema:[];
  h+='<h3 style="font-size:13px;color:#58a6ff;margin:10px 0 6px">表级 Schema（'+schema.length+' 列）</h3>';
  h+=schema.length?('<table><thead><tr><th>#</th><th>列名</th><th>类型</th><th>说明</th></tr></thead><tbody>'+
    schema.map(function(c,i){return typeof c==='string'
      ? '<tr><td>'+i+'</td><td>'+esc(c)+'</td><td>—</td><td>—</td></tr>'
      : '<tr><td>'+i+'</td><td>'+esc(c.name||c.column||'')+'</td><td>'+esc(c.type||c.dtype||'—')+'</td><td>'+esc(c.desc||c.comment||'—')+'</td></tr>';}).join('')+
    '</tbody></table>'):'<div class="muted">schema 未返回</div>';
  h+='<h3 style="font-size:13px;color:#58a6ff;margin:10px 0 6px">样本数据（前 '+Math.min(20,rows.length)+' 行）</h3>';
  /* 样本按存储顺序返回，非按日期倒序；并列 sample_note 与 catalog 新鲜度，避免把「样本旧行」误读成「数据断更」 */
  if(d.sample_note){h+='<div class="r3c-note">'+esc(d.sample_note)+'（catalog 新鲜度：'+esc(meta.freshness==null?'—':meta.freshness)+'）</div>';}
  /* clamped / limit_applied 一并披露，不静默截断 */
  if(d.clamped||d.limit_applied){h+='<div class="r3c-note">样本说明：'+(d.clamped?'请求的 limit 超过上限，已夹至 '+esc(d.limit_applied==null?'—':d.limit_applied)+' 行；':'')+'limit_applied='+esc(d.limit_applied==null?'—':d.limit_applied)+' · clamped='+esc(!!d.clamped)+'。仅返回样本行，不代表全表数据。</div>';}
  if(!rows.length){h+='<div class="muted">无样本数据</div>';}
  else{
    var headCols=cols.length?cols:Object.keys(rows[0]||{});
    h+='<div class="r3c-scroll"><table><thead><tr>'+headCols.map(function(c){return '<th>'+esc(c)+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows.slice(0,20).map(function(rr){return '<tr>'+headCols.map(function(c,i){return '<td>'+esc(Array.isArray(rr)?(rr[i]==null?'':rr[i]):(rr&&rr[c]!=null?rr[c]:''))+'</td>';}).join('')+'</tr>';}).join('')+
      '</tbody></table></div>';
  }
  return h;
}
/* 触发点：新增监听（不改既有 doSearch()/load()/jump()/setTab() 与 /api/kg/lineage 请求），与既有查询链并行 */
try{
  var r3cBtn=document.querySelector('#searchbar button');
  if(r3cBtn) r3cBtn.addEventListener('click',function(){ try{ r3cProbeTable(); }catch(e){} });
  var r3cInput=document.getElementById('tbl');
  if(r3cInput) r3cInput.addEventListener('keydown',function(e){ if(e.key==='Enter'){ try{ r3cProbeTable(); }catch(e2){} } });
}catch(e){}
/* R3-C：实时 catalog 探测与原有 setTab/load 链并行，不 await、不阻塞；404 静默回落 */
try{ probeCatalog(); }catch(e){}
/* R3-C CATALOG END */
</script>
