<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>对话研究 · 个股分析 · 零界</title>
<link rel="stylesheet" href="/static/tokens.css">
<script src="/static/nav.js" defer></script>
<script src="/static/shortscreen.js" defer></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg-page);color:var(--text);
  font:14px/1.65 "Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;height:100%}
a{color:var(--link);text-decoration:none} a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
.wrap{display:flex;gap:14px;max-width:1280px;margin:0 auto;padding:14px 16px 22px;
  height:calc(100vh - 54px)}
.side{width:250px;flex:0 0 250px;display:flex;flex-direction:column;gap:10px;min-height:0}
.panel{background:var(--bg-surface);border:1px solid var(--border-weak);border-radius:12px}
.side .panel{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden}
.side h3{margin:0;padding:11px 13px;font-size:13px;color:var(--text-dim);
  border-bottom:1px solid var(--border-weak);display:flex;justify-content:space-between;align-items:center}
.side h3 button{border:0;background:transparent;color:var(--link);font-size:12px;padding:2px 4px}
#sessions{overflow:auto;padding:6px}
.sess{padding:8px 9px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.sess:hover{background:rgba(88,166,255,.07)}
.sess.on{background:rgba(88,166,255,.12);border-color:rgba(88,166,255,.35)}
.sess b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sess small{color:var(--text-dim);font-size:11px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0;position:relative}
.head{padding:12px 16px;border-bottom:1px solid var(--border-weak);display:flex;
  align-items:center;gap:10px;flex-wrap:wrap}
.head h2{margin:0;font-size:16px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--border-weak);
  color:var(--text-dim)}
.badge.ok{color:#3fb950;border-color:rgba(63,185,80,.4)}
.badge.run{color:#d29922;border-color:rgba(210,153,34,.4)}
.spacer{flex:1}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:min(820px,92%);padding:10px 13px;border-radius:12px;font-size:13.5px;
  white-space:pre-wrap;word-break:break-word}
.msg.user{align-self:flex-end;background:rgba(88,166,255,.16);border:1px solid rgba(88,166,255,.3)}
.msg.assistant{align-self:flex-start;background:var(--bg-surface);border:1px solid var(--border-weak)}
.msg.system{align-self:center;color:var(--text-dim);font-size:12px;background:transparent;border:0;padding:2px}
.msg .md b{color:var(--text)}
.qcard{margin-top:2px;border:1px solid rgba(210,153,34,.35);background:rgba(210,153,34,.06);
  border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.qcard .q{font-weight:600;font-size:13.5px}
.opts{display:flex;flex-wrap:wrap;gap:7px}
.opt{border:1px solid var(--border-weak);background:var(--bg-page);color:var(--text);
  border-radius:8px;padding:6px 11px;font-size:13px}
.opt:hover{border-color:var(--blu-500);color:var(--blu-500)}
.opt.primary{border-color:rgba(63,185,80,.5);color:#3fb950}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 8px}
.chip{border:1px solid var(--border-weak);background:transparent;color:var(--text-dim);
  border-radius:999px;padding:4px 10px;font-size:12px}
.chip:hover{color:var(--text);border-color:var(--blu-500)}
.compose{border-top:1px solid var(--border-weak);padding:11px 14px;
  display:flex;gap:9px;align-items:flex-end}
.compose textarea{flex:1;min-height:44px;max-height:120px;resize:vertical;padding:10px 12px;
  font:inherit;color:var(--text);background:var(--bg-page);
  border:1px solid var(--border-weak);border-radius:10px;outline:none}
.compose textarea:focus{border-color:var(--blu-500)}
.send{border:0;border-radius:10px;padding:10px 20px;font-weight:700;color:#06121f;
  background:linear-gradient(180deg,#58a6ff,#2f81f7)}
.send:disabled{opacity:.5;cursor:not-allowed}
.err{color:#f85149;font-size:12px;padding:4px 16px 0;min-height:16px}
.empty{margin:auto;text-align:center;color:var(--text-dim);padding:26px;font-size:13px;line-height:2}
.empty b{color:var(--text);font-size:17px;display:block;margin-bottom:6px}
.actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 10px}
.actions button{border:1px solid var(--border-weak);background:transparent;color:var(--text-dim);
  border-radius:8px;padding:5px 10px;font-size:12px}
.actions button:hover{color:var(--text)}
@media(max-width:820px){
  .wrap{flex-direction:column;height:auto;padding-bottom:12px}
  .side{width:auto;flex:0 0 auto;max-height:170px}
  .main{height:calc(100vh - 240px)}
}
</style>
</head>
<body>
<div class="wrap">
  <aside class="side">
    <div class="panel">
      <h3>会话 <button id="newBtn" title="新建会话">＋ 新建</button></h3>
      <div id="sessions"><div class="sess"><small>加载中…</small></div></div>
    </div>
  </aside>
  <main class="main panel">
    <div class="head">
      <h2 id="title">对话研究</h2>
      <span id="state" class="badge">未开始</span>
      <span class="spacer"></span>
      <span class="badge" title="反问策略：分析结束后主动询问关注点，可随时说「不用问了」关闭">反问 · 2–4 选项</span>
    </div>
    <div id="chat">
      <div class="empty"><b>从一只股票开始</b>
        输入代码（如 <code>600337.SH</code> 或 <code>600337</code>）→ 我跑完整分析，<br>
        完成后主动问你「下一步想关注什么」，可以点选或直接说「风险」「估值」「事件」「资金」「帮我盯着」。
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="err" id="err"></div>
    <div class="compose">
      <textarea id="input" rows="2" placeholder="输入股票代码开始分析，或继续追问（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="sendBtn">发送</button>
    </div>
  </main>
</div>
<script>
(function(){
  var API = "/api/analysis/dialog";
  var $ = function(id){ return document.getElementById(id); };
  var cur = null;          // current session object
  var curQ = null;         // pending question
  var shown = {};          // rendered turn ids
  var polling = null;

  function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function md(s){
    s = esc(s);
    s = s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    s = s.replace(/^##\s+(.+)$/gm, "<b>$1</b>");
    s = s.replace(/^-\s+/gm, "• ");
    return s;
  }
  function api(path, opts){
    opts = opts || {};
    return fetch(API + path, opts).then(function(r){
      return r.json().catch(function(){ return {ok:false,error:"响应解析失败("+r.status+")"}; })
        .then(function(j){ return {status:r.status, body:j}; });
    });
  }
  function err(msg){ $("err").textContent = msg || ""; }

  function addTurn(t){
    if (!t || !t.id || shown[t.id]) return;
    shown[t.id] = true;
    var d = document.createElement("div");
    d.className = "msg " + (t.role === "user" ? "user" : (t.role === "system" ? "system" : "assistant"));
    var inner = document.createElement("div");
    inner.className = "md";
    inner.innerHTML = md(t.content || "");
    d.appendChild(inner);
    $("chat").appendChild(d);
    $("chat").scrollTop = $("chat").scrollHeight;
  }
  function renderQuestion(q){
    var old = document.querySelector(".qcard"); if (old) old.remove();
    curQ = q || null;
    if (!q) return;
    var box = document.createElement("div");
    box.className = "qcard";
    var opts = (q.options || []);
    box.innerHTML = '<div class="q">' + esc(q.text || "下一步想关注什么？") + "</div>";
    var row = document.createElement("div"); row.className = "opts";
    opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "opt" + (o.key === "watch" ? " primary" : "");
      b.textContent = o.label || o.key;
      b.onclick = function(){ answer(o.key, o.label || o.key); };
      row.appendChild(b);
    });
    box.appendChild(row);
    $("chat").appendChild(box);
    $("chat").scrollTop = $("chat").scrollHeight;
  }
  function setState(s){
    var el = $("state"); var map = {new:["未开始",""], analyzing:["分析中…","run"],
      ready:["分析完成","ok"], failed:["分析失败",""]};
    var m = map[s] || [s || "未开始", ""];
    el.textContent = m[0]; el.className = "badge " + m[1];
  }
  function render(data){
    if (!data || !data.ok) return;
    var s = data.session; if (!s) return;
    cur = s;
    $("title").textContent = s.title || "对话研究";
    setState(s.state);
    (data.turns || []).forEach(addTurn);
    var q = data.question;
    if (q && (!curQ || curQ.id !== q.id)) renderQuestion(q);
    if (!q) { renderQuestion(null); }
    loadSessions();
    if (s.state === "analyzing") poll(s.id); else stopPoll();
  }
  function stopPoll(){ if (polling) { clearInterval(polling); polling = null; } }
  function poll(sid){
    if (polling) return;
    var tries = 0;
    polling = setInterval(function(){
      tries++;
      if (tries > 60) { stopPoll(); return; }
      api("/session?id=" + encodeURIComponent(sid)).then(function(r){
        if (r.body && r.body.ok) {
          render(r.body);
          if (r.body.session && r.body.session.state !== "analyzing") stopPoll();
        }
      });
    }, 2500);
  }
  function loadSessions(){
    return api("/sessions").then(function(r){
      var list = (r.body && r.body.sessions) || [];
      var box = $("sessions");
      if (!list.length) { box.innerHTML = '<div class="sess"><small>暂无会话</small></div>'; return; }
      box.innerHTML = "";
      list.forEach(function(s){
        var d = document.createElement("div");
        d.className = "sess" + (cur && cur.id === s.id ? " on" : "");
        d.innerHTML = "<b>" + esc(s.title || s.id) + "</b><small>" +
          esc((s.updated_at || "").slice(5,16)) + " · " + esc(s.state || "") + "</small>";
        d.onclick = function(){ openSession(s.id); };
        box.appendChild(d);
      });
    });
  }
  function openSession(sid){
    shown = {}; curQ = null;
    $("chat").innerHTML = '<div class="empty"><b>加载会话…</b></div>';
    api("/session?id=" + encodeURIComponent(sid)).then(function(r){
      if (r.body && r.body.ok) { $("chat").innerHTML = ""; render(r.body); }
      else { err((r.body && r.body.error) || "会话加载失败"); }
    });
  }
  function newSession(){
    shown = {}; curQ = null; cur = null;
    $("chat").innerHTML = '<div class="empty"><b>新会话</b>输入股票代码开始分析。</div>';
    $("title").textContent = "对话研究"; setState("new"); renderQuestion(null);
  }
  function send(){
    var text = ($("input").value || "").trim();
    if (!text) return;
    err("");
    $("input").value = "";
    $("sendBtn").disabled = true;
    var payload = {text: text, channel: "pc"};
    if (cur && cur.id) payload.session_id = cur.id;
    api("/message", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)}).then(function(r){
      $("sendBtn").disabled = false;
      if (!r.body || !r.body.ok) { err((r.body && r.body.error) || "发送失败"); return; }
      if (r.body.session) { render({ok:true, session:r.body.session,
        turns:r.body.turns || [], question:r.body.question}); }
      if (r.body.session && r.body.session.state === "analyzing") poll(r.body.session.id);
    }).catch(function(e){ $("sendBtn").disabled = false; err("网络错误：" + e); });
  }
  function answer(key, label){
    if (!cur || !curQ) return;
    err("");
    api("/answer", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({session_id: cur.id, question_id: curQ.id,
        option_key: key, text: label})}).then(function(r){
      if (r.body && r.body.ok) { render({ok:true, session:r.body.session,
        turns:r.body.turns || [], question:r.body.question}); }
      else err((r.body && r.body.error) || "提交失败");
    });
  }
  function quick(text){ $("input").value = text; send(); }
  function control(cmd){
    api("/profile", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify(cmd)}).then(function(r){
      err(r.body && r.body.ok ? "" : ((r.body && r.body.error) || "设置失败"));
      if (r.body && r.body.ok) quick(cmd.followup_enabled === false ? "关闭反问" : "开启反问");
    });
  }

  // chips
  [["风险","看一下风险"],["估值","看下估值"],["事件","最近有什么事件"],
   ["资金","资金面怎么样"],["帮我盯着","盯着"]].forEach(function(p){
    var b = document.createElement("button");
    b.className = "chip"; b.textContent = p[0]; b.title = p[1];
    b.onclick = function(){ quick(p[1]); };
    $("chips").appendChild(b);
  });
  // actions
  var acts = document.createElement("div"); acts.className = "actions";
  var b1 = document.createElement("button"); b1.textContent = "关闭反问"; b1.onclick = function(){ control({followup_enabled:false}); };
  var b2 = document.createElement("button"); b2.textContent = "开启反问"; b2.onclick = function(){ control({followup_enabled:true}); };
  var b3 = document.createElement("button"); b3.textContent = "查看订阅"; b3.onclick = function(){ quick("查看订阅"); };
  acts.appendChild(b1); acts.appendChild(b2); acts.appendChild(b3);
  document.querySelector(".main").insertBefore(acts, document.querySelector(".compose"));

  $("sendBtn").onclick = send;
  $("newBtn").onclick = newSession;
  $("input").addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  });
  loadSessions();
})();
</script>
</body>
</html>
