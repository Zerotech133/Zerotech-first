<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交易台账 · 零界</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="icon" href="data:,">
<style>
body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg,#0f1216);color:var(--text,#e8eaf0);font-size:14px}
.wrap{max-width:960px;margin:0 auto;padding:14px 14px 40px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.head h1{font-size:20px;margin:0}
.head small{color:var(--text-dim,#8a93a6);font-size:12px}
.sumbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{background:var(--card,#1a1f27);border:1px solid var(--border,#2a3242);border-radius:8px;padding:6px 12px;font-size:12.5px}
.chip b{font-size:14px}
.tabs{display:flex;gap:6px;margin:12px 0}
.tab{padding:7px 16px;border-radius:8px 8px 0 0;background:var(--card,#1a1f27);border:1px solid var(--border,#2a3242);border-bottom:none;cursor:pointer;font-size:13px;color:var(--text-dim,#8a93a6)}
.tab.on{color:var(--text,#e8eaf0);font-weight:600;background:var(--card2,#202735)}
table{width:100%;border-collapse:collapse;background:var(--card,#1a1f27);border:1px solid var(--border,#2a3242);border-radius:0 8px 8px 8px;font-size:12.5px}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--border,#2a3242);white-space:nowrap}
th{color:var(--text-dim,#8a93a6);font-weight:500;font-size:11.5px}
tr.click{cursor:pointer}
tr.click:hover{background:var(--card2,#202735)}
.up{color:var(--up,#f0524d)}.dn{color:var(--dn,#2fbf71)}
.detail{display:none;background:var(--card2,#202735)}
.detail td{padding:10px 12px;white-space:normal}
.spark{display:block;margin:4px 0 8px;max-width:520px;width:100%;height:56px}
.mk{display:inline-block;margin:2px 6px 2px 0;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.05);font-size:11.5px;color:var(--text-dim,#8a93a6)}
.mk b{color:var(--text,#e8eaf0)}
.empty{padding:26px;text-align:center;color:var(--text-dim,#8a93a6);background:var(--card,#1a1f27);border:1px dashed var(--border,#2a3242);border-radius:8px}
.mkt{font-size:10.5px;padding:1px 5px;border-radius:4px;background:rgba(255,255,255,.08);color:var(--text-dim,#8a93a6);margin-right:4px}
@media (max-width:700px){th.h-xs,td.h-xs{display:none}.wrap{padding:10px 8px 40px}th,td{padding:6px 6px}}
</style>
<script src="/static/nav.js" defer></script><meta name=wb-shell content=adopted></head>
<body>
<div class="wrap">
  <div class="head"><h1>💼 交易台账</h1><small id="ts">加载中…</small></div>
  <div class="sumbar" id="sum"></div>
  <div class="tabs">
    <div class="tab on" data-t="open">在仓持仓 <span id="n-open"></span></div>
    <div class="tab" data-t="pending">待买信号 <span id="n-pending"></span></div>
    <div class="tab" data-t="closed">历史平仓 <span id="n-closed"></span></div>
  </div>
  <div id="body"></div>
  <p style="font-size:11px;color:var(--text-dim,#8a93a6);margin-top:14px">纸面模拟台账 · 盘后 16:15 同步 · 不构成投资建议</p>
</div>
<script>
let LED=null,cur='open';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pc=(v,d=2)=>{const x=(v*100).toFixed(d);return `<span class="${v>=0?'up':'dn'}">${x>=0?'+':''}${x}%</span>`};
const fmt=(v,d=2)=>v==null?'—':(+v).toFixed(d);
function spark(ms){ /* marks → SVG 折线（pnl%） */
  if(!ms||ms.length<2)return'';
  const ys=ms.map(m=>m.pnl*100),mn=Math.min(...ys,0),mx=Math.max(...ys,0);
  const W=520,H=56,P=6,sp=(mx-mn)||1;
  const pt=ys.map((y,i)=>[P+i*(W-2*P)/(ys.length-1),H-P-(y-mn)/sp*(H-2*P)]);
  const path=pt.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ');
  const zero=H-P-(0-mn)/sp*(H-2*P);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <line x1="${P}" y1="${zero.toFixed(1)}" x2="${W-P}" y2="${zero.toFixed(1)}" stroke="#3a4356" stroke-dasharray="3 3"/>
    <polyline points="${path}" fill="none" stroke="${ys[ys.length-1]>=0?'#f0524d':'#2fbf71'}" stroke-width="2"/>
  </svg>`;
}
function rowOpen(e,i){
  const m=esc(e.market),nm=esc(e.name||e.symbol),cd=esc(e.symbol);
  return `<tr class="click" onclick="tog(${i})">
    <td><span class="mkt">${m}</span>${nm}<br><small style="color:var(--text-dim,#8a93a6)">${cd} · ${esc(e.strategy||'')}</small></td>
    <td class="h-xs">${esc((e.entry_date||'').slice(5))} @ ${fmt(e.entry_px)}</td>
    <td class="h-xs">${fmt(e.last_px)}<br><small style="color:var(--text-dim,#8a93a6)">${esc((e.last_date||'').slice(5))}</small></td>
    <td class="h-xs">${e.days??'—'}天</td>
    <td>${pc(e.pnl)}</td></tr>
  <tr class="detail" id="d${i}"><td colspan="5">
    <b>每日浮盈轨迹</b>（${e.marks?e.marks.length:0} 个快照）${spark(e.marks)}
    <div>${(e.marks||[]).map(k=>`<span class="mk">${esc((k.d||'').slice(5))} <b>${(k.pnl*100).toFixed(1)}%</b> @${fmt(k.px)}</span>`).join('')}</div>
  </td></tr>`;
}
function render(){
  const S=LED.summary;
  document.getElementById('ts').textContent='账本 '+ (LED.ledger_ts||LED.ts)+' · 同步 '+LED.ts;
  document.getElementById('sum').innerHTML=
    `<div class="chip">在仓 <b>${S.open_n}</b> 只</div>
     <div class="chip">等权浮盈 <b>${S.avg_pnl>=0?'+':''}${S.avg_pnl}%</b></div>
     <div class="chip">待买 <b>${S.pending_n}</b></div>
     <div class="chip">平仓 <b>${S.closed_n}</b> 笔 · 胜率 <b>${S.win_rate}%</b></div>
     <div class="chip">平仓均益 <b>${S.closed_total>=0?'+':''}${S.closed_total}%</b></div>`;
  document.getElementById('n-open').textContent='·'+S.open_n;
  document.getElementById('n-pending').textContent='·'+S.pending_n;
  document.getElementById('n-closed').textContent='·'+S.closed_n;
  const b=document.getElementById('body');
  if(cur==='open')b.innerHTML=LED.open.length?`<table><tr><th>标的</th><th class="h-xs">买入</th><th class="h-xs">最新</th><th class="h-xs">持有</th><th>浮盈</th></tr>${LED.open.map(rowOpen).join('')}</table>`:'<div class="empty">空仓</div>';
  else if(cur==='pending')b.innerHTML=LED.pending.length?`<table><tr><th>标的</th><th>信号日</th><th>现价</th></tr>${LED.pending.map(e=>`<tr><td><span class="mkt">${esc(e.market)}</span>${esc(e.name||e.symbol)}<br><small style="color:var(--text-dim,#8a93a6)">${esc(e.symbol)} · ${esc(e.strategy||'')}</small></td><td>${esc(e.sig_date||'—')}</td><td>${fmt(e.last_px)}</td></tr>`).join('')}</table>`:'<div class="empty">无待买</div>';
  else b.innerHTML=LED.closed.length?`<table><tr><th>标的</th><th class="h-xs">买入→卖出</th><th class="h-xs">持有</th><th>盈亏</th></tr>${LED.closed.map(e=>`<tr><td><span class="mkt">${esc(e.market)}</span>${esc(e.name||e.symbol)}<br><small style="color:var(--text-dim,#8a93a6)">${esc(e.symbol)} · ${esc(e.strategy||'')}</small></td><td class="h-xs">${esc((e.entry_date||'').slice(5))} @${fmt(e.entry_px)} →<br>${esc((e.exit_date||e.last_date||'').slice(5))} @${fmt(e.last_px)}</td><td class="h-xs">${e.days??'—'}天</td><td>${pc(e.pnl)}</td></tr>`).join('')}</table>`:'<div class="empty">无平仓记录</div>';
}
function tog(i){const el=document.getElementById('d'+i);el.style.display=el.style.display==='table-row'?'none':'table-row';}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');cur=t.dataset.t;render();});
fetch('data/ledger.json').then(r=>r.json()).then(d=>{LED=d;render();}).catch(()=>{document.getElementById('body').innerHTML='<div class="empty">台账数据加载失败（本地需 8734 入口 / 公网需访问码）</div>';});
</script>
<script src="/static/dataops_link.js" data-entity="ledger:riskguard" defer></script>
<!-- OS-UI-UNIFY:theme -->
<link rel="stylesheet" href="/static/os_theme.css" data-os-unify="1">
<!-- OS-UI-UNIFY:drill -->
<script defer src="/static/os_drill.js" data-os-unify="1"></script>
</body>
</html>
