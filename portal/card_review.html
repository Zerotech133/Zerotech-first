<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🧾 学习卡审核 · 零界</title>
<link rel="stylesheet" href="/static/tokens.css">
<script src="/static/nav.js" defer></script>
<style>
:root{--bg:var(--gray-0,#0d1117);--panel:var(--gray-2,#161b22);--panel2:var(--gray-1,#0f141c);--bd:var(--gray-4,#30363d);--fg:var(--gray-7,#e6edf3);--dim:var(--gray-5,#8b949e);--acc:var(--blu-500,#58a6ff);--ok:var(--grn-500,#3fb950);--warn:var(--ylw-500,#d29922);--bad:var(--red-500,#f85149)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,"Microsoft YaHei",system-ui,sans-serif;padding:20px 16px 48px;max-width:1100px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
h1 small{color:var(--dim);font-size:13px;font-weight:400}
.sub{color:var(--dim);font-size:12px;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row label{color:var(--dim);font-size:12px}
select,textarea,input[type=text]{background:var(--panel2);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit}
select{min-width:120px}
.btn{background:transparent;border:1px solid var(--bd);color:var(--fg);border-radius:9px;padding:8px 14px;font-size:13px;cursor:pointer}
.btn.primary{background:var(--blu-600,#1f6feb);border-color:var(--blu-600,#1f6feb);color:#fff}
.btn.ok{border-color:var(--ok);color:var(--ok)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px;margin:12px 0}
.stat{background:var(--panel2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px}
.stat b{display:block;font-size:20px}
.stat span{color:var(--dim);font-size:11px}
.bar{height:8px;background:var(--panel2);border:1px solid var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--ok));width:0}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;background:#122642;color:#79c0ff;margin-right:6px}
.badge.ae{background:#2d2414;color:#e3b341}
.badge.av{background:#1f3b2a;color:#7ee787}
.badge.s-pass{background:#1f3b2a;color:#7ee787}
.badge.s-revise{background:#2d2414;color:#e3b341}
.badge.s-reject{background:#30161a;color:#ff7b72}
.card{background:var(--panel);border:1px solid var(--bd);border-radius:12px;padding:14px 16px;margin:12px 0}
.card.done{border-color:var(--ok)}
.card .head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.card .q{font-size:16px;font-weight:700;margin:8px 0 6px;line-height:1.5}
.card .a{color:var(--gray-6,#c9d1d9);font-size:14px;margin:0 0 8px}
.card .meta{color:var(--dim);font-size:12px}
.card .src{color:var(--dim);font-size:12px;border-left:2px solid var(--bd);padding-left:8px;margin:6px 0}
.card .ev{color:var(--gray-5,#8b949e);font-size:12px;margin:6px 0;background:var(--panel2);border-radius:8px;padding:8px 10px}
.card details summary{cursor:pointer;color:var(--acc);font-size:12px}
.card .review{margin-top:10px;padding-top:10px;border-top:1px dashed var(--bd);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.card .review .verdicts{display:flex;gap:6px;flex-wrap:wrap}
.card .review .verdicts label{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);border:1px solid var(--bd);border-radius:8px;padding:5px 9px;cursor:pointer;background:var(--panel2)}
.card .review .verdicts input{accent-color:var(--acc)}
.card .review .verdicts label.sel-pass{color:var(--ok);border-color:var(--ok)}
.card .review .verdicts label.sel-revise{color:var(--warn);border-color:var(--warn)}
.card .review .verdicts label.sel-reject{color:var(--bad);border-color:var(--bad)}
.card textarea{flex:1;min-width:220px;min-height:38px;resize:vertical;font-size:12px}
.count{color:var(--dim);font-size:12px;margin:6px 0}
.empty{color:var(--dim);text-align:center;padding:32px}
.foot{margin-top:22px;color:var(--dim);font-size:12px}
code{background:#0a0e14;padding:1px 6px;border-radius:4px;color:#79c0ff;font-size:12px}
@media(max-width:640px){body{padding:14px 10px 36px}.card{padding:12px}.card .review{flex-direction:column;align-items:stretch}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<h1>🧾 学习卡审核 <small>60 候选 · 点选 → 导出 decisions → card_review.py decide</small></h1>
<div class="sub" id="sub">加载中…</div>

<div class="panel">
  <div class="row">
    <label>来源 <select id="f-source"><option value="all">全部</option><option value="AE">AE</option><option value="AV">AV</option></select></label>
    <label>主题 <select id="f-theme"><option value="all">全部</option></select></label>
    <label>预审建议 <select id="f-precheck"><option value="all">全部</option><option value="pass">pass</option><option value="revise">revise</option><option value="reject">reject</option></select></label>
    <label>状态 <select id="f-status"><option value="all">全部</option><option value="pending">未决</option><option value="done">已处理</option></select></label>
    <label>搜索 <input type="text" id="f-q" placeholder="问题/概念/关键词" style="min-width:180px"></label>
    <button class="btn ok" id="btn-export">⬇ 导出 decisions JSON</button>
    <button class="btn primary" id="btn-adopt">⚡ 一键采用机器预审建议</button>
    <button class="btn" id="btn-reset">🧹 一键清空</button>
    <span class="count" id="save-state">本地草稿未保存</span>
  </div>
  <div class="count" id="adopt-stats">预填统计：—（可一键采用机器预审建议，仅预填未决卡）</div>
  <div class="stats" id="stats"></div>
  <div class="bar"><i id="progress"></i></div>
  <div class="count" id="progress-text">—</div>
</div>

<div id="list"><div class="empty">加载中…</div></div>

<div class="foot">
  数据源：<code>/static/card_review_data.json</code> · 审核决定本地暂存在浏览器 localStorage，导出后续用
  <code>python tools/kb_corpus/card_review.py decide --decisions &lt;导出文件&gt; --apply</code>（先 dry-run 预览）。
  页面不改清单/学习卡数据。
</div>

<script>
(function(){
"use strict";
const DATA_URL='/static/card_review_data.json';
const LS_PREFIX='card_review_decisions_';
let DATA=null, STATE={};   // STATE: review_id -> {verdict:'pass|revise|reject|pending', notes}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lsKey=LS_PREFIX+'20261101', saveTimer=null;

function verdictOf(rid){ const s=STATE[rid]; return (s&&s.verdict)||'pending'; }
function notesOf(rid){ const s=STATE[rid]; return (s&&s.notes)||''; }
function doneCount(){ return (DATA?DATA.items:[]).filter(it=>verdictOf(it.review_id)!=='pending').length; }

function loadLocal(){
  try{ const raw=localStorage.getItem(lsKey); if(raw){ const obj=JSON.parse(raw); if(obj&&typeof obj==='object'){ STATE=obj; } } }catch(e){ console.warn('localStorage 读取失败',e); }
}
function saveLocal(){
  try{ localStorage.setItem(lsKey, JSON.stringify(STATE)); $('save-state').textContent='草稿已保存 · '+new Date().toLocaleTimeString(); }
  catch(e){ $('save-state').textContent='草稿保存失败：'+e.message; }
}
function scheduleSave(){ if(saveTimer)clearTimeout(saveTimer); saveTimer=setTimeout(saveLocal,250); }

function renderStats(){
  const items=DATA.items, total=items.length;
  const cnt={pass:0,revise:0,reject:0,pending:0};
  items.forEach(it=>cnt[verdictOf(it.review_id)]++);
  const done=total-cnt.pending;
  $('stats').innerHTML=[
    ['总数',total,''],['通过',cnt.pass,'ok'],['需修改',cnt.revise,'warn'],['驳回',cnt.reject,'bad'],['未决',cnt.pending,''],['进度',(total?Math.round(done/total*100):0)+'%','']
  ].map(([k,v])=>`<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
  $('progress').style.width=(total?done/total*100:0)+'%';
  $('progress-text').textContent=`已处理 ${done}/${total}（${total?Math.round(done/total*100):0}%）· 本地草稿自动保存`;
  updateAdoptStats();
}

function fillThemeFilter(){
  const sel=$('f-theme');
  const themes=[...new Set(DATA.items.map(it=>it.theme).filter(Boolean))].sort();
  sel.innerHTML='<option value="all">全部</option>'+themes.map(t=>`<option value="${esc(t)}">${esc(t)}</option>`).join('');
}

function filtered(){
  const src=$('f-source').value, theme=$('f-theme').value, pre=$('f-precheck').value,
        st=$('f-status').value, q=$('f-q').value.trim().toLowerCase();
  return DATA.items.filter(it=>{
    if(src!=='all'&&it.source!==src)return false;
    if(theme!=='all'&&it.theme!==theme)return false;
    if(pre!=='all'&&((it.precheck||{}).suggested_verdict||'')!==pre)return false;
    const v=verdictOf(it.review_id);
    if(st==='pending'&&v!=='pending')return false;
    if(st==='done'&&v==='pending')return false;
    if(q){ const hay=[it.question,it.answer_summary,it.source_ref,it.evidence_summary].join(' ').toLowerCase(); if(!hay.includes(q))return false; }
    return true;
  });
}

function precheckBadge(it){
  const p=it.precheck||{}, v=p.suggested_verdict;
  if(!v) return '';
  const cls=v==='pass'?'s-pass':v==='revise'?'s-revise':'s-reject';
  return `<span class="badge ${cls}" title="${esc((p.reasons||[]).join('；'))}">预审 ${esc(v)}·${esc(p.confidence||'')}${p.score!=null?'·'+esc(p.score):''}</span>`;
}

function cardHTML(it){
  const rid=it.review_id, v=verdictOf(rid), n=notesOf(rid);
  const srcCls=it.source==='AE'?'ae':'av';
  return `<div class="card ${v!=='pending'?'done':''}" data-rid="${esc(rid)}">
    <div class="head">
      <div><span class="badge ${srcCls}">${esc(it.source)}</span><span class="badge">${esc(it.theme||'—')}</span><span class="badge">${esc(it.angle_cn||'—')}</span>${precheckBadge(it)}</div>
      <div class="meta">${esc(rid)} · ${esc(it.source_card_id||'')}</div>
    </div>
    <div class="q">${esc(it.question)}</div>
    <div class="a">${esc(it.answer_summary)}</div>
    <details><summary>展开完整答案 / 原文证据</summary>
      <div class="a" style="margin-top:6px">${esc(it.answer)}</div>
      <div class="ev">原文证据：${esc(it.evidence_summary)}</div>
    </details>
    <div class="src">出处：${esc(it.source_ref)} · unit_id: <code>${esc(it.unit_id||'')}</code></div>
    <div class="review">
      <div class="verdicts" data-rid="${esc(rid)}">
        ${[['pass','☐ 通过','sel-pass'],['revise','☐ 需修改','sel-revise'],['reject','☐ 驳回','sel-reject'],['pending','○ 未决','']].map(([key,label,cls])=>{
          const checked=v===key?'checked':'', selCls=(v===key&&cls)?cls:'';
          return `<label class="${selCls}"><input type="radio" name="rv_${esc(rid)}" value="${key}" ${checked}>${label}</label>`;
        }).join('')}
      </div>
      <textarea placeholder="备注（可选）：修改点 / 驳回原因…" data-rid="${esc(rid)}">${esc(n)}</textarea>
    </div>
  </div>`;
}

function renderList(){
  const list=filtered();
  $('sub').textContent=`数据：${DATA.stats.total} 候选（AE ${DATA.stats.by_source.AE} / AV ${DATA.stats.by_source.AV}）· 当前筛选 ${list.length} 条 · 生成于 ${DATA.generated_at}`;
  const box=$('list');
  if(!list.length){ box.innerHTML='<div class="empty">没有符合条件的候选</div>'; return; }
  box.innerHTML=list.map(cardHTML).join('');
}

function bindEvents(){
  $('list').addEventListener('change',e=>{
    const input=e.target;
    if(input.type==='radio'){
      const rid=input.name.replace(/^rv_/,'');
      STATE[rid]=STATE[rid]||{verdict:'pending',notes:''};
      STATE[rid].verdict=input.value;
      scheduleSave();
      const card=input.closest('.card');
      if(card){
        card.classList.toggle('done', input.value!=='pending');
        card.querySelectorAll('.verdicts label').forEach(l=>l.classList.remove('sel-pass','sel-revise','sel-reject'));
      }
      renderStats();
    }
  });
  $('list').addEventListener('input',e=>{
    const ta=e.target;
    if(ta.tagName==='TEXTAREA'){
      const rid=ta.getAttribute('data-rid');
      STATE[rid]=STATE[rid]||{verdict:'pending',notes:''};
      STATE[rid].notes=ta.value;
      scheduleSave();
    }
  });
  ['f-source','f-theme','f-precheck','f-status'].forEach(id=>$(id).addEventListener('change',renderList));
  $('f-q').addEventListener('input',()=>{ if(saveTimer)clearTimeout(saveTimer); saveTimer=setTimeout(renderList,200); });
  $('btn-adopt').addEventListener('click',adoptPrecheck);
  $('btn-reset').addEventListener('click',()=>{
    if(!confirm('一键清空本地审核草稿（不会影响已导出文件/真实数据）？'))return;
    STATE={}; scheduleSave(); renderStats(); renderList();
  });
  $('btn-export').addEventListener('click',exportDecisions);
}

function suggestedOf(it){ return ((it&&it.precheck)||{}).suggested_verdict||''; }
function mappedVerdict(sugg){ return sugg==='pass'?'pass':sugg==='revise'?'revise':sugg==='reject'?'reject':''; }
function consistency(){
  let done=0, matched=0, suggested=0;
  (DATA?DATA.items:[]).forEach(it=>{
    const v=verdictOf(it.review_id);
    if(v!=='pending')done++;
    const m=mappedVerdict(suggestedOf(it));
    if(m){ suggested++; if(v===m)matched++; }
  });
  return {done,total:(DATA?DATA.items.length:0),matched,suggested};
}
function updateAdoptStats(extra){
  const c=consistency();
  const base=`已选 ${c.done}/${c.total} · 与预审建议一致 ${c.matched}/${c.suggested}（有建议卡）`;
  $('adopt-stats').textContent = (extra?extra+' · ':'')+base;
}
function adoptPrecheck(){
  if(!DATA) return;
  const pending=DATA.items.filter(it=>verdictOf(it.review_id)==='pending'&&mappedVerdict(suggestedOf(it)));
  if(!pending.length){ updateAdoptStats('无需预填：所有有建议的卡均已处理'); return; }
  if(!confirm(`将按机器预审建议预填 ${pending.length} 张未决卡（pass→通过 / revise→需修改），已决卡不覆盖。继续？`)) return;
  let nPass=0,nRevise=0,nReject=0;
  pending.forEach(it=>{
    const m=mappedVerdict(suggestedOf(it));
    STATE[it.review_id]=STATE[it.review_id]||{verdict:'pending',notes:''};
    STATE[it.review_id].verdict=m;
    if(m==='pass')nPass++; else if(m==='revise')nRevise++; else nReject++;
    try{ localStorage.setItem(lsKey, JSON.stringify(STATE)); }catch(e){}
  });
  if(saveTimer)clearTimeout(saveTimer);
  saveLocal(); renderStats(); renderList();
  updateAdoptStats(`一键预填 ${pending.length} 张（通过 ${nPass} / 需修改 ${nRevise} / 驳回 ${nReject}；仅未决，已决不覆盖）`);
}

function buildDecisionsPayload(){
  const decisions={};
  (DATA?DATA.items:[]).forEach(it=>{
    const v=verdictOf(it.review_id);
    if(v==='pending')return;   // 未决不导出，保持 pending_review
    decisions[it.review_id]={verdict:v, notes:notesOf(it.review_id)};
  });
  return {
    schema_version:1,
    reviewer:'card_review.html（人工审核页）',
    decided_at:new Date().toISOString(),
    source_data:DATA_URL,
    decisions:decisions
  };
}

function exportDecisions(){
  const payload=buildDecisionsPayload();
  const n=Object.keys(payload.decisions).length;
  if(!n){ alert('还没有勾选任何卡片：请先点选「通过/需修改/驳回」（未决不导出）。'); return; }
  const blob=new Blob([JSON.stringify(payload,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=(DATA&&DATA.options&&DATA.options.export_filename)||'card_review_decisions_20261101.json';
  document.body.appendChild(a); a.click(); a.remove();
  $('save-state').textContent=`已导出 ${n} 条 decisions（未决 ${(DATA?DATA.items.length:0)-n} 条不导出）`;
}

async function load(){
  try{
    const r=await fetch(DATA_URL+'?ts='+Date.now());
    if(!r.ok) throw new Error('HTTP '+r.status);
    DATA=await r.json();
    lsKey=(DATA.options&&DATA.options.localStorage_key)||lsKey;
    loadLocal(); fillThemeFilter(); renderStats(); renderList(); bindEvents();
    $('save-state').textContent='本地草稿：'+lsKey;
  }catch(e){
    $('sub').textContent='数据加载失败：'+e.message;
    $('list').innerHTML='<div class="empty">审核数据加载失败（'+esc(e.message)+'）<br>请稍后刷新，或检查 <code>/static/card_review_data.json</code> 是否可访问。</div>';
  }
}
load();
})();
</script>
</body>
</html>
