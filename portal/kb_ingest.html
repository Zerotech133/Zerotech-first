<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/tokens.css">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 知识入库 · 零界</title>
<link rel="stylesheet" href="/static/nav.css">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2333;--bd:#2d333b;--fg:#e6edf3;--dim:#8b949e;
      --acc:#58a6ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--purple:#bc8cff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px} h1 small{color:var(--dim);font-size:13px;font-weight:normal}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.card{background:var(--panel2);border:1px solid var(--bd);border-radius:8px;padding:12px}
.card .k{color:var(--dim);font-size:12px}
.card .v{font-size:22px;font-weight:700;color:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border-bottom:1px solid var(--bd);padding:8px;text-align:left}
th{color:var(--dim);font-weight:600}
.badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700}
.b-ok{background:#12301c;color:var(--ok)} .b-bad{background:#2a1512;color:var(--bad)} .b-warn{background:#2b2410;color:var(--warn)}
.muted{color:var(--dim);font-size:12px}
.foot{margin-top:16px;color:var(--dim);font-size:12px}
code{background:#0a0e14;padding:1px 6px;border-radius:4px;color:#79c0ff;font-size:12px}
ol{margin:6px 0 0 20px;padding:0}
</style>
<script src="/static/nav.js" defer></script></head>
<body>
<div id="nav"></div>
<h1>📥 PDF 知识入库 <small>扫描/文本 PDF → 章节结构 → 知识单元 → RAG</small></h1>
<div class="sub" id="sub">加载中…</div>

<div class="panel">
  <div class="cards">
    <div class="card"><div class="k">已入库书目</div><div class="v" id="c-books">—</div></div>
    <div class="card"><div class="k">总页数</div><div class="v" id="c-pages">—</div></div>
    <div class="card"><div class="k">章节数</div><div class="v" id="c-chapters">—</div></div>
    <div class="card"><div class="k">知识单元</div><div class="v" id="c-units">—</div></div>
    <div class="card"><div class="k">策略经典单元</div><div class="v" id="c-classics">—</div></div>
    <div class="card"><div class="k">RAG 文档 / 记录</div><div class="v" id="c-rag">—</div></div>
  </div>
</div>

<div class="panel">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
    <b>验收状态</b><span id="verify-badge" class="badge b-warn">—</span>
  </div>
  <table>
    <thead><tr><th>书目</th><th>页数</th><th>章节</th><th>知识单元</th><th>OCR 覆盖</th><th>验收</th></tr></thead>
    <tbody id="books-body"><tr><td colspan="6" class="muted">加载中…</td></tr></tbody>
  </table>
  <div class="muted" id="thr" style="margin-top:8px"></div>
</div>

<div class="panel">
  <b>下一步（SOP）</b>
  <div class="muted" id="pipeline-state" style="margin-top:4px"></div>
  <ol id="next-steps"></ol>
</div>

<div class="foot">
  数据源：<code>C:/项目/PDF/_ingest/</code> · 生成脚本：<code>tools/kb_corpus/kb_ingest_status.py</code> · 标准：<code>docs/standards/2026-10-31_PDF知识入库标准_v1.md</code>
</div>

<script>
(async function(){
  const $ = id => document.getElementById(id);
  function badge(ok){ return ok ? '<span class="badge b-ok">PASS</span>' : '<span class="badge b-bad">FAIL</span>'; }
  try{
    const r = await fetch('/static/kb_ingest.json?ts=' + Date.now());
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    $('sub').textContent = '生成时间 ' + (d.generated_at||'') + ' · 入库目录 ' + (d.ingest_dir||'');
    $('c-books').textContent = d.totals.books; $('c-pages').textContent = d.totals.pages;
    $('c-chapters').textContent = d.totals.chapters; $('c-units').textContent = d.totals.units;
    $('c-rag').textContent = (d.rag.docs ?? '—') + ' / ' + (d.rag.records ?? '—');
    if (d.classics) $('c-classics').textContent = d.classics.units + ' 条 / ' + d.classics.docs + ' 篇';
    const okAll = d.verify.ok && d.pipeline.ok;
    $('verify-badge').className = 'badge ' + (okAll ? 'b-ok' : 'b-bad');
    $('verify-badge').textContent = okAll ? 'ALL PASS' : 'CHECK FAILED';
    const tb = $('books-body'); tb.innerHTML = '';
    (d.books||[]).forEach(b=>{
      const checks = (d.verify.books||{})[b.book] || {};
      const ok = Object.values(checks).length ? Object.values(checks).every(Boolean) : false;
      const tr = document.createElement('tr');
      tr.innerHTML = `<td>${b.book}</td><td>${b.pages ?? '—'}</td><td>${b.chapters}</td><td>${b.units}</td>` +
                     `<td>${b.has_ocr ? 'OCR ✓' : '—'}</td><td>${badge(ok)}</td>`;
      tb.appendChild(tr);
    });
    const t = d.thresholds||{};
    $('thr').textContent = `阈值：OCR ≥${t.ocr_chars_per_page_min}字/页 · 覆盖 ≥${(t.page_coverage_min*100)|0}% · 章节 ≥${t.chapters_min} · 知识单元 ≥${t.units_min} 且引用 100% · RAG v${d.rag.version||'—'}`;
    $('pipeline-state').innerHTML = d.pipeline.ok ? '<span class="badge b-ok">流程 PASS</span>' : '<span class="badge b-bad">流程 FAIL</span>';
    const ol = $('next-steps'); ol.innerHTML = '';
    (d.pipeline.next_steps||[]).forEach(s=>{ const li=document.createElement('li'); li.textContent=s; ol.appendChild(li); });
  }catch(e){
    $('sub').textContent = '加载失败：' + e.message;
    $('sub').className = 'badge b-bad';
  }
})();
</script>
</body>
</html>
