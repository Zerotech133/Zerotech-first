<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>模拟盘 · 选股与打法的逐日账</title>
<style>
:root{
  --bg:#0d1117; --bg2:#111621; --bg3:#161b22;
  --line:#30363d; --line2:#3d444d;
  --fg:#e6edf3; --dim:#8b949e; --faint:#656d76;
  --acc:#58a6ff; --teal:#39c5cf;
  --up:#f85149; --dn:#3fb950;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149;
  --purple:#bc8cff;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--fg);font:15px/1.55 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:40px}
b{font-weight:600}
.small,.note{font-size:12px;color:var(--dim)}
header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
header .kicker{font-size:11px;color:var(--faint);letter-spacing:1px}
header h1{font-size:20px;margin-top:2px}
header .hd-date{float:right;font-size:11px;color:var(--faint);margin-top:3px}
.hero{padding:14px 18px 4px}
.hero h2{font-size:17.5px;line-height:1.5}
.lede{padding:8px 18px 2px;color:var(--dim);font-size:12.5px;line-height:1.8}
.lede b{color:var(--fg)}
.nums{display:flex;gap:8px;padding:12px 18px 4px}
.num{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:10px;
  padding:10px 8px 8px;text-align:center}
.num b{font-size:20px;display:block;line-height:1.15;font-variant-numeric:tabular-nums}
.num span{font-size:10.5px;color:var(--dim);display:block;margin-top:4px;line-height:1.5}
.num b.g{color:var(--ok)}.num b.w{color:var(--warn)}.num b.r{color:var(--bad)}.num b.a{color:var(--acc)}
.alert{margin:12px 16px;border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.7}
.alert.bad{background:#f851491a;border:1px solid #f8514955;color:#ffb3ae}
.alert.warn{background:#d299221a;border:1px solid #d2992255;color:#e3b341}
.alert.info{background:#1f6feb1a;border:1px solid #58a6ff44;color:#9fceff}
.alert b{color:#fff}
main{padding:4px 0 0}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;
  padding:16px 18px 6px}
.sec-h h2{font-size:14.5px}
.sec-h span{font-size:11px;color:var(--faint)}
.card{background:var(--bg3);border:1px solid var(--line);border-radius:12px;
  margin:0 14px 12px;overflow:hidden}
.day-h{display:flex;align-items:center;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);
  cursor:pointer}
.day-h .d{flex:1;min-width:0}
.day-h .d b{font-size:14.5px;display:block}
.day-h .d small{font-size:11.5px;color:var(--dim);display:block;margin-top:3px}
.pill{flex:none;font-size:10px;line-height:16px;padding:1px 8px;border-radius:99px;
  border:1px solid var(--line2);color:var(--dim)}
.pill.ok{color:var(--ok);border-color:#3fb95055}
.pill.bad{color:var(--bad);border-color:#f8514955}
.pill.warn{color:var(--warn);border-color:#d2992255}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.cell{background:var(--bg3);padding:9px 11px}
.cell .t{font-size:11px;color:var(--dim);display:flex;justify-content:space-between;gap:6px}
.cell .t em{font-style:normal;color:var(--faint);font-size:10px}
.cell .v{font-size:16px;font-variant-numeric:tabular-nums;margin-top:2px}
.cell .s{font-size:10.5px;color:var(--faint);margin-top:1px}
.up{color:var(--up)}.dn{color:var(--dn)}.flat{color:var(--dim)}
.chips{padding:10px 13px;border-top:1px solid var(--line);display:none}
.chips.on{display:block}
.chips .cs{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chips .cs i{font-style:normal;font-size:11px;background:#1f6feb26;color:#9fceff;
  border-radius:4px;padding:2px 6px;font-family:ui-monospace,Menlo,monospace}
.strat{display:flex;gap:9px;padding:10px 13px;border-bottom:1px solid var(--line)}
.strat:last-child{border-bottom:0}
.strat .id{flex:none;width:38px;font-size:11px;color:var(--acc);font-family:ui-monospace,monospace;
  padding-top:2px}
.strat .b{flex:1;min-width:0}
.strat .b b{font-size:13px;display:block}
.strat .b small{font-size:11.5px;color:var(--dim);display:block;margin-top:2px;line-height:1.6}
.strat .r{flex:none;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;
  padding-top:1px}
.strat .r small{display:block;font-size:10px;color:var(--faint);margin-top:2px}
.xrow{display:flex;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);
  align-items:baseline;font-size:12.5px}
.xrow:last-child{border-bottom:0}
.xrow.hd{padding:8px 13px;color:var(--faint);font-size:10.5px;background:var(--bg2)}
.xrow .id{flex:none;width:38px;font-size:11px;color:var(--acc);font-family:ui-monospace,monospace}
.xrow .nm{flex:1;min-width:0}
.xrow .nm small{display:block;color:var(--faint);font-size:10px;margin-top:1px;line-height:1.5}
.xrow .v{flex:none;width:72px;text-align:right;font-variant-numeric:tabular-nums}
.xrow .vd{flex:none;width:56px;text-align:right;font-size:10.5px}
.vd.pass{color:var(--ok)}.vd.fail{color:var(--bad)}
.vd.sample,.vd.unclear{color:var(--warn)}.vd.none{color:var(--faint)}
footer{padding:18px 18px 0;color:var(--faint);font-size:11px;line-height:1.9;border-top:1px solid var(--line);
  margin-top:8px}
footer b{color:var(--dim)}
</style>
</head>
<body>
<header>
  <div class="hd-date" id="genAt"></div>
  <div class="kicker">候风 · 模拟盘</div>
  <h1>每天选出什么股，用哪几种打法在跑，跑成什么样</h1>
</header>

<div class="hero"><h2 id="verdict">加载中…</h2></div>
<div class="lede" id="lede"></div>
<div class="nums" id="nums"></div>
<div id="alerts"></div>

<div class="sec-h"><h2>扣掉市场之后还剩什么</h2><span id="xtabTip"></span></div>
<div class="card" id="xtab"></div>

<div class="sec-h"><h2>逐日账：每个信号日 × 每种打法</h2><span id="rangeTip"></span></div>
<div id="days"></div>

<div class="sec-h"><h2>打法清单</h2><span>规则写死，不靠人盯盘</span></div>
<div class="card" id="strats"></div>

<footer id="foot"></footer>

<script>
const D = /*__DATA__*/ null;

function pct(x, digits) {
  if (x === null || x === undefined) return "—";
  const v = (x * 100).toFixed(digits === undefined ? 2 : digits);
  return (x > 0 ? "+" : "") + v + "%";
}
function cls(x) { return x > 0 ? "up" : (x < 0 ? "dn" : "flat"); }
function el(tag, cls_, html) {
  const e = document.createElement(tag);
  if (cls_) e.className = cls_;
  if (html !== undefined) e.innerHTML = html;
  return e;
}

function render() {
  if (!D) {
    document.getElementById("verdict").textContent = "数据没接上";
    document.getElementById("lede").textContent = "arena/latest.json 不存在或为空。先跑 paper_arena.py。";
    return;
  }
  document.getElementById("genAt").textContent = D.generated_at || "";
  const nDays = D.n_days || 0;
  const tradable = D.strategies.filter(s => !s.reconcile_only);
  const gated = D.strategies.filter(s => s.status === "all_gated").length;
  const MINOBS = D.min_obs || 10;
  const COST = (D.cost_round || 0.003) * 100;
  const autoObs = Math.max.apply(null, D.strategies.map(function (s) {
    return (s.excess && s.excess.auto && s.excess.auto.n) || 0;
  }));
  const passed = tradable.filter(s => s.enough_sample).length;
  const vd = {};
  tradable.forEach(function (s) { vd[s.excess_verdict] = (vd[s.excess_verdict] || 0) + 1; });

  // ── 结论层：先回答「这个数能不能信」，再给数字 ──────────
  const v = document.getElementById("verdict");
  if (vd.pass) {
    v.innerHTML = '有 <b>' + vd.pass + ' 种打法</b>扣掉大盘、再扣 ' + COST.toFixed(1) +
      '% 成本之后仍然站得住。其余打法要么被否，要么样本不够。';
  } else if (vd.fail) {
    v.innerHTML = '跑到现在，<b>' + vd.fail + ' 种打法的超额收益连 ' + COST.toFixed(1) +
      '% 成本线都够不到</b>——不是赚得少，是扣完成本为负。' +
      '外加 ' + (vd.sample || 0) + ' 种还没到期，判不了。';
  } else {
    v.innerHTML = '系统已经能自己买卖、自己平仓，' + nDays + ' 个交易日沉下 ' +
      D.n_signals + ' 条信号。但<b>能拿来下结论的观测只有 ' + autoObs + ' 个</b>' +
      '（门槛 ' + MINOBS + ' 个）——<b>现在判不了</b>。下面所有数字只是留痕，不是成绩。';
  }

  document.getElementById("lede").innerHTML =
    '这张表要钉住的是三件事：<b>哪一天选了什么股、用几种打法、后来各自怎样</b>。' +
    '买入用信号<b>次日开盘价</b>，卖出按规则自动执行，无人干预，双边扣 <b>' +
    COST.toFixed(1) + '%</b> 成本。' +
    '<br>看结果必须看<b>超额</b>（扣掉大盘同窗口涨跌之后），不能看绝对收益——' +
    '这 4 天大盘天天在涨，绝对收益里的绝大部分是市场给的，不是选出来的。';

  const nums = document.getElementById("nums");
  nums.appendChild(el("div", "num",
    "<b class='a'>" + nDays + "</b><span>已沉淀交易日</span>"));
  nums.appendChild(el("div", "num",
    "<b>" + D.n_signals + "</b><span>已登记信号</span>"));
  nums.appendChild(el("div", "num",
    "<b class='" + (autoObs >= MINOBS ? "g" : "w") + "'>" + autoObs + "/" + MINOBS +
    "</b><span>能下结论的观测</span>"));
  nums.appendChild(el("div", "num",
    "<b class='" + (passed ? "g" : "w") + "'>" + passed + "/" + tradable.length +
    "</b><span>过样本门槛的打法</span>"));

  // ── 警示层 ───────────────────────────────────────
  const al = document.getElementById("alerts");
  const s1 = D.strategies.filter(function (s) { return s.id === "S1"; })[0];
  if (s1 && s1.excess && s1.excess.auto && s1.excess.auto.gross !== null) {
    const a = s1.excess.auto;
    al.appendChild(el("div", "alert info",
      '<b>为什么绝对收益会骗人。</b>以最基础的「持有 1 天」为例：大样本池（每批 40~80 只）' +
      '绝对赚了 ' + pct(a.gross) + '，但同期大盘同窗口涨了 ' + pct(a.bench) +
      '，扣掉之后只剩 <b>' + pct(a.mean) + '</b>，再扣 ' + COST.toFixed(1) +
      '% 双边成本就是 <b>' + pct(a.mean - COST / 100) + '</b>。' +
      '选股真正贡献的部分，是后面这个数。'));
  }
  if (gated) {
    const g = D.strategies.find(s => s.status === "all_gated");
    al.appendChild(el("div", "alert bad",
      '<b>闸门把全部 ' + g.n_tracks_gate_skip + ' 条信号都拦下了，一条没买。</b>' +
      '这不是「策略表现 0%」，是根本没上车。闸门规则是「中位数 20 日收益 &lt; -3% 就不交易」，' +
      '这几个月一直在触发——如果它长期这样，等于这个策略永远空仓。'));
  }
  al.appendChild(el("div", "alert warn",
    '<b>样本单位是「一次选股」，不是「一笔交易」。</b>门槛 ' + MINOBS + ' 个已到期观测。' +
    '同一天选出的 80 只票共享同一个市场日，算成 80 个样本会把误差缩小十几倍，' +
    '看起来显著其实全是假的——这正是「短期测试无效」的算术原因。'));

  // ── 两把尺子：池子大小决定能验证什么 ────────────────
  const ps = D.pool_stats || {};
  if (ps.auto && ps.main) {
    al.appendChild(el("div", "alert info",
      '<b>两个池子要两把尺子。</b>大样本池每批 40~80 只，个股噪声被平均掉，' +
      '超额波动只有 ' + (ps.auto.sd * 100).toFixed(1) + ' 个百分点，约 <b>' +
      ps.auto.need_small + ' 个交易日</b>就能判断 ' + COST.toFixed(1) + '% 的成本线。' +
      '主选池只有 1~7 只票，超额波动 ' + (ps.main.sd * 100).toFixed(1) +
      ' 个百分点，同样精度要 <b>' + ps.main.need_small + ' 个交易日</b>（约 ' +
      (ps.main.need_small / 244).toFixed(1) + ' 年）——它只能验证 ' +
      '<b>' + ps.main.need_big + ' 个交易日</b>级别的 3% 大效应（择时、择势），' +
      '永远验证不了日频选股。混着看必然得出互相矛盾的结论。'));
  }
  const cand = tradable.filter(function (s) {
    return s.excess && s.excess.auto && s.excess.auto.n >= 2 && s.excess.auto.need;
  }).sort(function (x, y) { return y.excess.auto.n - x.excess.auto.n; })[0];
  if (cand) {
    const ca = cand.excess.auto;
    const gap = Math.max(0, ca.need - ca.n);
    al.appendChild(el("div", "alert info",
      '<b>还差多久能出第一份能用的结论。</b>用 ' + cand.id + ' 已到期观测的实际离散度（' +
      (ca.sd * 100).toFixed(2) + ' 个百分点）倒推：要分辨 ' + COST.toFixed(1) +
      '% 的成本线，需要约 <b>' + ca.need + ' 个观测</b>，现在有 ' + ca.n + ' 个。' +
      '每天产出 1 个新观测，所以还需要约 <b>' + gap + ' 个交易日</b>。' +
      '在那之前，任何排名都不成立。'));
  }

  // ── 超额对照：同样是「扣掉大盘」之后，各打法还剩多少 ──────────
  const xt = document.getElementById("xtab");
  xt.appendChild(el("div", "xrow hd",
    "<div class='id'>打法</div><div class='nm'>大样本池（每批 40~80 只），只用已到期的观测</div>" +
    "<div class='v'>超额</div><div class='v'>扣成本</div><div class='vd'>判定</div>"));
  const vdLabel = {pass: "站得住", fail: "否掉", sample: "样本不足",
                   unclear: "方向未定", none: "—"};
  tradable.forEach(function (st) {
    const a = (st.excess && st.excess.auto) || {n: 0};
    const r = el("div", "xrow");
    let sub, v1 = "—", v2 = "—", cl1 = "flat", cl2 = "flat";
    if (st.status === "all_gated") {
      sub = "闸门全拒，从未下单";
    } else if (!a.n) {
      sub = "还没到期" + (st.n_pending ? "（" + st.n_pending + " 条在持仓）" : "");
    } else {
      sub = "毛 " + pct(a.gross) + " · 大盘 " + pct(a.bench) + " · 观测 " + a.n + " 个";
      v1 = pct(a.mean); cl1 = cls(a.mean);
      v2 = pct(a.mean - COST / 100); cl2 = cls(a.mean - COST / 100);
    }
    const noDue = (!a.n && st.status !== "all_gated");
    const vlab = noDue ? "未到期" : (vdLabel[st.excess_verdict] || "—");
    const vcls = noDue ? "none" : (st.excess_verdict || "none");
    r.innerHTML = "<div class='id'>" + st.id + "</div>" +
      "<div class='nm'>" + st.name.replace(/（.*?）/g, "") +
      "<small>" + sub + "</small></div>" +
      "<div class='v " + cl1 + "'>" + v1 + "</div>" +
      "<div class='v " + cl2 + "'>" + v2 + "</div>" +
      "<div class='vd " + vcls + "'>" + vlab + "</div>";
    xt.appendChild(r);
  });
  document.getElementById("xtabTip").textContent =
    "超额 = 毛收益 − 同期大盘 · 成本线 " + COST.toFixed(1) + "%";

  // ── 逐日账 ───────────────────────────────────────
  const days = document.getElementById("days");
  const sigs = (D.signals || []).slice().reverse();   // 最新在上
  sigs.forEach(function (s) {
    const card = el("div", "card");
    const hd = el("div", "day-h");
    const doneAll = D.strategies.every(function (st) {
      const m = (D.matrix[st.id] || {})[s.key];
      return m && (m.skipped || m.done);
    });
    hd.appendChild(el("div", "d",
      '<b>' + fmtDate(s.asof) + ' 选出 ' + s.n + ' 只</b>' +
      '<small>' + s.pool_label + ' · 次日 ' + fmtDate(s.entry_date) + ' 开盘买</small>'));
    hd.appendChild(el("span", "pill " + (doneAll ? "ok" : ""),
      doneAll ? "已了结" : "仍在持有"));
    hd.onclick = function () { chips.classList.toggle("on"); };
    card.appendChild(hd);

    const grid = el("div", "grid");
    D.strategies.forEach(function (st) {
      const m = (D.matrix[st.id] || {})[s.key];
      const c = el("div", "cell");
      let vv = "—", ss = "", cl = "flat";
      if (m && m.skipped === "gate") {
        vv = "闸门拒"; ss = "没有买入"; cl = "warn";
      } else if (m && m.skipped === "no_fill") {
        vv = "买不进"; ss = "当日无开盘价";
      } else if (m) {
        if (m.excess !== null && m.excess !== undefined) {
          vv = pct(m.excess); cl = cls(m.excess);
          ss = "超额 · 绝对 " + pct(m.ret);
        } else {
          vv = pct(m.ret); cl = "flat";
          ss = m.done ? "绝对 · 当日基准未发布" : "绝对 · 未到期";
        }
        ss += m.done ? ("　已平 " + m.n_closed + " 笔") : ("　持有 " + m.n_left + " 只");
      }
      c.innerHTML = '<div class="t"><span>' + st.id + ' ' + st.name.replace(/（.*?）/g, "") +
        '</span><em>' + (st.hold === 0 ? "T+0" : "T+" + st.hold) + '</em></div>' +
        '<div class="v ' + cl + '">' + vv + '</div>' +
        '<div class="s">' + ss + '</div>';
      grid.appendChild(c);
    });
    card.appendChild(grid);

    const chips = el("div", "chips");
    chips.innerHTML = '<div class="small">当日选出的 ' + s.n + ' 只：</div>' +
      '<div class="cs">' + (s.codes || []).map(function (c) {
        return "<i>" + c.replace(/\.(SZ|SH|BJ)$/, "") + "</i>";
      }).join("") + '</div>';
    card.appendChild(chips);
    days.appendChild(card);
  });

  // ── 打法清单 ─────────────────────────────────────
  const stBox = document.getElementById("strats");
  D.strategies.forEach(function (st) {
    const r = el("div", "strat");
    const a2 = (st.excess && st.excess.auto) || {n: 0, mean: null};
    let right;
    if (a2.n && a2.mean !== null) {
      right = '<span class="' + cls(a2.mean) + '">' + pct(a2.mean) + '</span>' +
        '<small>超额 · 观测 ' + a2.n + ' 个</small>';
    } else if (st.status === "all_gated") {
      right = '<span class="warn">零交易</span><small>闸门全拒</small>';
    } else {
      right = '<span class="flat">—</span><small>还没到期</small>';
    }
    if (st.reconcile_only) right = '<span class="flat">对账</span><small>不参与排名</small>';
    let tag = '';
    if (st.stop_loss) tag = " 止损 " + (st.stop_loss * 100).toFixed(0) + "%";
    if (st.take_profit) tag = " 止盈 " + (st.take_profit * 100).toFixed(0) + "%";
    if (st.use_gate) tag = " 带闸门";
    r.innerHTML = '<div class="id">' + st.id + '</div>' +
      '<div class="b"><b>' + st.name + tag + '</b><small>' + st.desc +
      (st.n_tracks_gate_skip ? '　（' + st.n_tracks_gate_skip + ' 条信号被闸门拦下）' : '') +
      '</small></div>' +
      '<div class="r">' + right + '</div>';
    stBox.appendChild(r);
  });

  document.getElementById("rangeTip").textContent =
    (D.cal_first || "") + " ~ " + (D.cal_last || "");

  document.getElementById("foot").innerHTML =
    '<b>怎么读这张表</b><br>' +
    '· 同一个日期往下数，就是同一批股票在 ' + tradable.length + ' 种打法下的结果，横向可比。<br>' +
    '· <b>看超额，不看绝对。</b>超额 = 毛收益 − 同期大盘（两融池等权、同窗口）涨跌。' +
    '绝对收益里绝大部分是市场给的，扣完才是选股贡献；再扣 ' + COST.toFixed(1) +
    '% 双边成本，才是真正落袋的。<br>' +
    '· <b>未到期只显示绝对收益</b>，因为不同打法的持有天数不一样，浮盈没法跨打法比。<br>' +
    '· <b>观测数 ≠ 笔数。</b>同一天选出的几十只票只算 1 个观测，' +
    '它们共享同一个市场日，误差高度相关。<br>' +
    '· 「闸门拒」表示规则判定当天不该买，那条信号就空着，不产生任何收益。<br>' +
    '· S0 用来看引擎算得对不对（和选股台账的「当日收盘」口径对齐），不可交易，不参与排名。<br>' +
    '<b>生成时间</b> ' + (D.generated_at || '—') + ' ｜ 本金 ' +
    (D.capital ? (D.capital / 10000).toFixed(0) + ' 万/条轨' : '—') +
    ' ｜ 单边成本 ' + ((D.cost_one_side || 0) * 100).toFixed(2) + '%';
}

function fmtDate(d) {
  if (!d || d.length !== 8) return d || "—";
  return d.slice(0, 4) + "-" + d.slice(4, 6) + "-" + d.slice(6);
}

render();
</script>
</body>
</html>
