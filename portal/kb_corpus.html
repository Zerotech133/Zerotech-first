<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>语料知识库 · 零界</title>
<link rel="stylesheet" href="/static/nav.css">
<style>
:root{--bg:#0d1117;--panel:#161b22;--panel2:#1c2333;--bd:#2d333b;--fg:#e6edf3;--dim:#8b949e;
      --acc:#58a6ff;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--purple:#bc8cff;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 "Microsoft YaHei",system-ui,sans-serif;padding:24px}
h1{font-size:22px;margin:0 0 4px} h1 small{color:var(--dim);font-size:13px;font-weight:normal}
.sub{color:var(--dim);font-size:12px;margin-bottom:16px}
.panel{background:var(--panel);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
textarea{flex:1;min-width:280px;min-height:64px;background:var(--panel2);color:var(--fg);border:1px solid var(--bd);border-radius:8px;padding:10px;font:14px/1.6 inherit;resize:vertical}
.btn{background:#1f6feb;border:1px solid #1f6feb;color:#fff;border-radius:7px;padding:8px 16px;cursor:pointer;font-size:14px;font-weight:600}
.btn:disabled{opacity:.5;cursor:default}
.meta{color:var(--dim);font-size:12px;margin-top:6px}
.answer{white-space:pre-wrap;line-height:1.8}
.src{border-top:1px solid var(--bd);margin-top:10px;padding-top:8px;font-size:12px}
.src .s{margin:4px 0;color:var(--dim)}
.src .s b{color:var(--acc)}
.src .s .t{display:block;color:#9aa4b2;margin-top:2px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#122642;color:var(--acc);margin-left:6px}
.err{background:#2a1512;border:1px solid #67221c;color:#ffa198;border-radius:8px;padding:10px 14px;margin:8px 0}
.hidden{display:none}
.foot{margin-top:16px;color:var(--dim);font-size:12px}
code{background:#0a0e14;padding:1px 6px;border-radius:4px;color:#79c0ff;font-size:12px}
</style>
<script src="/static/nav.js" defer></script><meta name=wb-shell content=adopted></head>
<body>
<h1>📚 语料知识库 <small>YouTube 量化频道语料 · 本地检索问答</small></h1>
<div class="sub" id="stats">加载中…</div>
<div class="panel" id="govPanel" style="padding:10px 16px">
  <div style="font-size:12px;color:var(--dim);margin-bottom:6px">数据治理状态</div>
  <div id="gov" class="row" style="gap:8px"></div>
</div>

<div class="panel">
  <div class="row"><textarea id="q" placeholder="提问，例如：如何避免回测过拟合？walk-forward 验证怎么做？交易成本和滑点如何影响策略？"></textarea></div>
  <div class="row" style="margin-top:8px">
    <button class="btn" id="go" onclick="ask()">提问</button>
    <span class="meta">检索 top5 + qwen3.5:9b 生成；答案带 [S#] 引用；约 5–30 秒</span>
  </div>
</div>
<div id="err" class="err hidden"></div>
<div class="panel hidden" id="ansBox"><div id="ans" class="answer"></div><div class="src" id="src"></div></div>
<div class="foot">数据：100 频道 YouTube 量化语料（标题/描述/评论）；原始包只读；PII 已脱敏。仅研究用途。</div>

<script>
function pill(txt, ok){ return '<span style="display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;border:1px solid '+(ok?'#1f6feb':'#d29922')+';background:'+(ok?'#122642':'#2a2210')+';color:'+(ok?'#79c0ff':'#d29922')+'">'+txt+'</span>'; }
function renderGov(g){
  const v=g.verify||{}, n=g.normalized||{}, c=g.cleaned||{}, f=g.index_full||{}, b=g.backup||{};
  const parts=[];
  parts.push(pill('校验 '+(v.hash_ok||0)+'/'+(v.zips||0)+' SHA256', v.hash_bad===0));
  parts.push(pill('清洗保留 '+(c.retention_pct||'—')+'%', (c.retention_pct||0)>=90));
  parts.push(pill('索引 '+(f.rows||'—')+' docs', (f.rows||0)>0));
  parts.push(pill('备份 '+(b.result||'—')+' '+(b.files||'—')+' 文件', b.result==='OK'));
  parts.push(pill(g.catalog_registered?'目录已登记':'目录未登记', !!g.catalog_registered));
  document.getElementById('gov').innerHTML=parts.join('');
}
async function loadGovStatic(){
  try{
    const r=await fetch('/static/kb_corpus_gov.json?ts='+Date.now(),{cache:'no-store'});
    if(r.ok){ const g=await r.json(); renderGov(g||{}); }
  }catch(e){}
}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
async function loadStats(){
  try{
    const r=await fetch('/api/kb_corpus/stats',{cache:'no-store'}); const d=await r.json();
    if(d.ok){
      document.getElementById('stats').textContent='索引 '+d.rows+' chunks · dim '+d.dim+' · 更新 '+d.generated_at+' · embedding='+d.embed_model+' · chat='+d.chat_model;
      renderGov(d.governance||{});
      loadGovStatic();
    }
  }catch(e){ document.getElementById('stats').textContent='统计加载失败'; }
}
async function ask(){
  const q=document.getElementById('q').value.trim();
  const err=document.getElementById('err'); err.classList.add('hidden');
  if(!q){ err.textContent='请输入问题'; err.classList.remove('hidden'); return; }
  const btn=document.getElementById('go'); btn.disabled=true; btn.textContent='检索/生成中…';
  try{
    const r=await fetch('/api/kb_corpus/ask?q='+encodeURIComponent(q),{cache:'no-store'});
    const d=await r.json();
    if(!d.ok){ throw new Error(d.error||'请求失败'); }
    document.getElementById('ansBox').classList.remove('hidden');
    document.getElementById('ans').textContent=d.answer||'（空回答）';
    document.getElementById('src').innerHTML='<b>引用来源</b>'+d.sources.map(s=>'<div class="s">['+esc(s.sid)+'] <b>'+esc(s.source.split('\\\\').pop())+'</b><span class="tag">score '+s.score+'</span><span class="t">'+esc(s.text.slice(0,160))+'</span></div>').join('');
  }catch(e){ err.textContent='出错：'+e.message; err.classList.remove('hidden'); }
  finally{ btn.disabled=false; btn.textContent='提问'; }
}
document.getElementById('q').addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); ask(); }});
loadStats();
</script>
</body>
</html>
