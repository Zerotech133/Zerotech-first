<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>零界 · 人专项工作台</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/ui/ui.css">
<script src="/static/nav.js" defer></script>
<style>
body{margin:0;background:var(--bg-page);color:var(--text);font-family:var(--font-ui)}
.wrap{max-width:1000px;margin:0 auto;padding:20px 24px 56px}
.top{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
h1{font-size:22px;margin:18px 0 4px}.meta{color:var(--text-dim);font-size:12px;margin:6px 0}
.card{border:1px solid var(--border);border-radius:12px;background:var(--bg-surface);padding:16px;margin:12px 0}
h2{font-size:15px;margin:18px 0 8px}
label{display:block;margin:8px 0;color:var(--text-dim);font-size:12px}
input,textarea{width:100%;box-sizing:border-box;background:var(--bg-raised);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px;font:inherit}
textarea{min-height:72px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-raised);color:var(--text);text-decoration:none;cursor:pointer;font-size:13px}
.btn.primary{border-color:var(--blu-600);background:var(--blu-600);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.note{color:var(--text-dim);font-size:12px;line-height:1.6}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><strong>零界 · 人专项工作台</strong><a href="/briefing">← 返回简报</a></div>
  <h1 id="title">人专项</h1>
  <div class="meta" id="meta">等待选题…</div>

  <div class="card">
    <h2>专项定义</h2>
    <label>研究题<input id="f-topic" readonly></label>
    <label>来源<input id="f-source" readonly></label>
    <label>我为什么关心（可选）<textarea id="f-why" placeholder="例：这条直接影响数据资源主官下一步的供给承诺"></textarea></label>
    <label>期望产出（可选）<textarea id="f-out" placeholder="例：一页判断 + 3 个可验证假设 + 下一步派单建议"></textarea></label>
    <div class="row">
      <button class="btn primary" id="btn-card">生成专项卡</button>
      <button class="btn" id="btn-copy">复制 JSON</button>
      <button class="btn" id="btn-download">下载专项卡</button>
      <a class="btn" href="/meeting">去会议系统</a>
    </div>
    <div class="note" id="hint">本页是个人专项工作台；生成专项卡后可交给田丰派单/立项，不自动执行、不代批 L2。</div>
    <pre id="preview" class="note" style="white-space:pre-wrap"></pre>
  </div>
</div>
<script>
(function(){
'use strict';
function qs(k){return new URLSearchParams(location.search).get(k)||'';}
var topic=qs('topic')||qs('title')||'未命名研究题';
var title=qs('title')||topic;
var source=qs('source')||'-'; var kind=qs('kind')||'研究';
document.title='零界 · 人专项 · '+title;
document.getElementById('title').textContent=title;
document.getElementById('meta').textContent='来源：'+source+' · 类型：'+kind+' · 状态：待立项';
document.getElementById('f-topic').value=topic;
document.getElementById('f-source').value=source;
function card(){
  return {schema:'hq/personal_special/v1', id:'PS-'+new Date().toISOString().slice(0,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6),
    topic:topic, title:title, source:source, kind:kind,
    why:document.getElementById('f-why').value.trim(),
    expected_output:document.getElementById('f-out').value.trim(),
    owner:'老田', created_at:new Date().toISOString(), status:'draft',
    note:'人专项草稿；立项/派单需田丰或老田确认'};
}
var current=null;
document.getElementById('btn-card').onclick=function(){
  current=card();
  document.getElementById('preview').textContent=JSON.stringify(current,null,2);
  document.getElementById('hint').textContent='专项卡已生成（本地草稿）。复制或下载后交给田丰/老田确认，不自动执行。';
};
document.getElementById('btn-copy').onclick=async function(){
  current=current||card(); document.getElementById('preview').textContent=JSON.stringify(current,null,2);
  try{await navigator.clipboard.writeText(JSON.stringify(current,null,2));document.getElementById('hint').textContent='已复制专项卡 JSON。';}catch(e){document.getElementById('hint').textContent='复制失败，请手动选择预览区文本。';}
};
document.getElementById('btn-download').onclick=function(){
  current=current||card(); var blob=new Blob([JSON.stringify(current,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=(current.id||'personal-special')+'.json'; a.click(); URL.revokeObjectURL(a.href);
  document.getElementById('preview').textContent=JSON.stringify(current,null,2);
};
})();
</script>
</body>
</html>
