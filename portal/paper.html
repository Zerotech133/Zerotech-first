<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>模拟仓 · 老田的 AI 工作站</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="icon" href="data:,">
<!--
  K-STOCK 模拟仓页（2026-10-09 前端规划 P2，复用 M6 三层接线模式）
  数据源：/api/paper_status（数据层 k_stock/paper/portal_status.py，纯标准库 sqlite 只读）
  口径：AI 信号单 T+1 撮合（决策当日开盘价，次日晨确认）——页面数据滞后至最近一次 mark 属预期；
  行情依赖数据在 mark 时点固化快照，页面零实时行情计算。
  纪律：页面不硬编码业务数字，全部动态渲染防两处漂移；只读，无下单入口（写路径另拍板）。
-->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif; background: var(--bg-page); color: var(--text); min-height: 100vh; }
  .dim { color: var(--text-dim); }
  .num { font-family: Consolas, "Courier New", monospace; }
  main { max-width: 1080px; margin: 0 auto; padding: 0 26px 56px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px 48px 12px; max-width: 1080px; margin: 0 auto; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--blu-600), var(--pur-500)); display: grid; place-items: center; font-size: 19px; font-weight: 800; color: #fff; }
  .brand h1 { font-size: 17px; font-weight: 700; }
  .brand small { color: var(--text-dim); font-size: 10.5px; letter-spacing: 3px; display: block; margin-top: 2px; }
  .clock { font-family: Consolas, monospace; font-size: 14px; color: var(--link); }
  .topnav { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 48px 0; max-width: 1080px; margin: 0 auto; }
  .pill { display: inline-block; padding: 7px 15px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-dim); text-decoration: none; font-size: 13px; background: var(--bg-surface); transition: border-color .2s ease, color .2s ease; }
  .pill:hover { border-color: var(--link); color: var(--text); }
  .pill.on { color: var(--text); border-color: var(--link); font-weight: 700; background: var(--bg-raised); }
  .banner { margin-top: 22px; background: rgba(88,166,255,.08); border: 1px solid rgba(88,166,255,.35); border-radius: var(--r-m); padding: 13px 18px; font-size: 13px; line-height: 1.65; }
  .card { margin-top: 14px; background: var(--bg-surface); border: 1px solid var(--border); border-radius: var(--r-m); padding: 16px 20px; }
  .card h2 { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
  .big { display: flex; gap: 12px; flex-wrap: wrap; }
  .big .b { flex: 1 1 120px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: var(--r-m); padding: 12px 14px; text-align: center; }
  .big .b .v { font-family: Consolas, monospace; font-size: 24px; font-weight: 700; }
  .big .b .k { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
  .up { color: #f85149; } .down { color: #3fb950; } .ok { color: #3fb950; } .bad { color: #f85149; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; text-align: left; line-height: 1.6; }
  th { color: var(--text-dim); font-weight: 600; font-size: 11.5px; white-space: nowrap; }
  td.num, th.num { font-family: Consolas, monospace; }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 10.5px; font-weight: 700; }
  .tag.ai { background: rgba(88,166,255,.15); color: #58a6ff; border: 1px solid rgba(88,166,255,.4); }
  .tag.manual { background: rgba(210,153,34,.12); color: #d29922; border: 1px solid rgba(210,153,34,.4); }
  .note { font-size: 12px; color: var(--text-dim); line-height: 1.7; margin-top: 10px; }
  .err { margin-top: 22px; background: rgba(248,81,73,.1); border: 1px solid rgba(248,81,73,.45); border-radius: var(--r-m); padding: 14px 18px; font-size: 13px; color: #f85149; }
  footer { margin-top: 26px; font-size: 11px; color: var(--text-dim); line-height: 1.8; }
  svg text { font-family: Consolas, monospace; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">🧾</div>
    <div><h1>K-STOCK 模拟仓</h1><small>PAPER TRADING · S1 执行层</small></div>
  </div>
  <div class="clock num" id="clock"></div>
</header>
<nav class="topnav">
  <a class="pill" href="/">🏠 首页</a>
  <a class="pill" href="/fin">🏠 驾驶舱</a>
  <a class="pill" href="/bt-positions">💼 持仓</a>
  <a class="pill on" href="/paper">🧾 模拟仓</a>
  <a class="pill" href="/audit">🛡 审计状态</a>
</nav>
<main>
  <div id="banner"></div>
  <div id="content"></div>
  <div id="err" class="err" style="display:none"></div>
  <footer>
    数据源：<code>/api/paper_status</code> ←
    <code>k_stock/paper/portal_status.py</code>（paper.db 只读投影）<br>
    口径：AI 信号单 <b>T+1 撮合</b>（决策当日开盘价，湖盘后更新→次日晨确认）；手动单按最近收盘即时成交。
    人为测试 CLI：<code>python k_stock/paper/cli.py buy/sell/status</code>
  </footer>
</main>
<script>
function fmt(n, d) { return Number(n).toLocaleString('zh-CN', {minimumFractionDigits: d || 0, maximumFractionDigits: d === undefined ? 2 : d}); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
setInterval(function() { document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-CN', {hour12: false}); }, 1000);

function equitySvg(curve) {
  if (!curve || curve.length < 2) return '<div class="note">快照不足 2 日，暂不成线（每日 07:05 automation mark 累积）。</div>';
  var W = 1000, H = 180, P = 34;
  var vals = curve.map(function(c) { return c.total; });
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max - min < 1) { max = min + 1; }
  var pts = curve.map(function(c, i) {
    var x = P + (W - 2 * P) * i / (curve.length - 1);
    var y = H - P - (H - 2 * P) * (c.total - min) / (max - min);
    return [x, y];
  });
  var line = pts.map(function(p) { return p[0].toFixed(1) + ',' + p[1].toFixed(1); }).join(' ');
  var svg = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%">';
  svg += '<polyline points="' + line + '" fill="none" stroke="var(--link, #58a6ff)" stroke-width="2"/>';
  pts.forEach(function(p, i) {
    svg += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="3" fill="var(--link, #58a6ff)"/>';
    svg += '<text x="' + p[0].toFixed(1) + '" y="' + (H - 12) + '" font-size="10" fill="var(--text-dim,#8b949e)" text-anchor="middle">' + esc(curve[i].date.slice(5)) + '</text>';
    svg += '<text x="' + p[0].toFixed(1) + '" y="' + (p[1] - 9).toFixed(1) + '" font-size="10" fill="var(--text-dim,#8b949e)" text-anchor="middle">' + fmt(curve[i].total / 10000, 1) + '万</text>';
  });
  svg += '</svg>';
  return svg;
}

function render(d) {
  var L = d.latest;
  var html = '';
  html += '<div class="banner">快照日期 <b>' + esc(L.date) + '</b> · 口径：AI 信号单 T+1 撮合，本页数据滞后至最近一次 mark 属预期 · 资金链对账 <b class="' + (L.verify_ok ? 'ok' : 'bad') + '">' + (L.verify_ok ? '✅ 通过' : '❌ 失败') + '</b></div>';
  html += '<div class="card"><h2>账户概览</h2><div class="big">'
    + '<div class="b"><div class="v num">' + fmt(L.total) + '</div><div class="k">总资产 (¥)</div></div>'
    + '<div class="b"><div class="v num">' + fmt(L.cash) + '</div><div class="k">现金 (¥)</div></div>'
    + '<div class="b"><div class="v num">' + fmt(L.market_value) + '</div><div class="k">持仓市值 (¥)</div></div>'
    + '<div class="b"><div class="v num">' + (L.pos_pct * 100).toFixed(1) + '%</div><div class="k">仓位</div></div>'
    + '<div class="b"><div class="v num ' + (L.cum_pct > 0 ? 'up' : L.cum_pct < 0 ? 'down' : '') + '">' + (L.cum_pct > 0 ? '+' : '') + L.cum_pct.toFixed(2) + '%</div><div class="k">累计收益</div></div>'
    + '</div><div class="note">待撮合 ' + L.pending + ' 单 · 风控：单票 ≤20% / 总仓 ≤95% · 费率：佣金万2.5（最低5元）+ 卖出印花税0.05%</div></div>';
  html += '<div class="card"><h2>权益曲线</h2>' + equitySvg(d.curve) + '</div>';
  html += '<div class="card"><h2>持仓明细（' + esc(L.date) + ' 快照）</h2>';
  if (!d.positions.length) { html += '<div class="note">空仓。</div>'; }
  else {
    html += '<table><tr><th>股票</th><th class="num">数量</th><th class="num">可卖</th><th class="num">成本</th><th class="num">现价</th><th class="num">市值</th><th class="num">盈亏</th></tr>';
    d.positions.forEach(function(p) {
      html += '<tr><td>' + esc(p.stock) + '</td><td class="num">' + p.qty + '</td><td class="num">' + p.available + '</td>'
        + '<td class="num">' + p.avg_cost.toFixed(2) + '</td><td class="num">' + p.last.toFixed(2) + '</td>'
        + '<td class="num">' + fmt(p.market_value) + '</td>'
        + '<td class="num ' + (p.pnl >= 0 ? 'up' : 'down') + '">' + (p.pnl >= 0 ? '+' : '') + fmt(p.pnl) + '</td></tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  html += '<div class="card"><h2>待撮合单（' + d.pending_orders.length + '）</h2>';
  if (!d.pending_orders.length) { html += '<div class="note">无。</div>'; }
  else {
    html += '<table><tr><th>#</th><th>来源</th><th>方向</th><th>股票</th><th class="num">数量</th><th class="num">计划撮合日</th><th>依据</th></tr>';
    d.pending_orders.forEach(function(o) {
      html += '<tr><td class="num">' + o.id + '</td><td><span class="tag ' + esc(o.source) + '">' + esc(o.source) + '</span></td>'
        + '<td>' + esc(o.side) + '</td><td>' + esc(o.stock) + '</td><td class="num">' + o.qty + '</td>'
        + '<td class="num">' + esc(o.plan_date) + '</td><td class="dim">' + esc(o.reason) + '</td></tr>';
    });
    html += '</table>';
  }
  html += '</div>';
  html += '<div class="card"><h2>最近订单（20 条）</h2><table><tr><th>#</th><th>时间</th><th>来源</th><th>状态</th><th>方向</th><th>股票</th><th class="num">数量</th><th class="num">成交价</th></tr>';
  d.recent_orders.forEach(function(o) {
    var st = esc(o.status);
    html += '<tr><td class="num">' + o.id + '</td><td class="num">' + esc(String(o.ts).slice(5, 16)) + '</td>'
      + '<td><span class="tag ' + esc(o.source) + '">' + esc(o.source) + '</span></td><td>' + st + '</td>'
      + '<td>' + esc(o.side) + '</td><td>' + esc(o.stock) + '</td><td class="num">' + o.qty + '</td>'
      + '<td class="num">' + (o.filled_price ? o.filled_price.toFixed(2) : '—') + '</td></tr>';
  });
  html += '</table></div>';
  document.getElementById('content').innerHTML = html;
}

fetch('/api/paper_status').then(function(r) { return r.json(); }).then(function(d) {
  if (!d.ok) {
    document.getElementById('err').style.display = 'block';
    document.getElementById('err').textContent = '投影失败：' + (d.error || 'unknown');
    return;
  }
  render(d);
}).catch(function(e) {
  document.getElementById('err').style.display = 'block';
  document.getElementById('err').textContent = 'API 不可达（portal_api 未重启到含 /api/paper_status 的版本，待 P3）：' + e;
});
</script>
</body>
</html>
