<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策略市场 · K-STOCK</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:var(--bg-page); color:var(--text); min-height:100vh; font-size:14px;}
  .wrap{max-width:var(--page-w); margin:0 auto; padding:0 26px 48px;}
  header{display:flex; align-items:center; justify-content:space-between; padding:20px 26px 12px; max-width:var(--page-w); margin:0 auto; flex-wrap:wrap; gap:12px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .logo{width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--blu-600),var(--pur-500)); display:grid; place-items:center; font-size:19px; font-weight:800; color:#fff;}
  .brand h1{font-size:17px; font-weight:700;}
  .brand small{color:var(--text-dim); font-size:10.5px; letter-spacing:3px; display:block; margin-top:2px;}
  .topnav{display:flex; gap:8px; flex-wrap:wrap;}
  .topnav a{padding:6px 14px; border-radius:999px; background:var(--bg-raised); border:1px solid var(--border); color:var(--text); text-decoration:none; font-size:12.5px;}
  .topnav a.on{background:var(--blu-600); border-color:var(--blu-600); color:#fff;}
  .stats{display:flex; gap:18px; flex-wrap:wrap; margin:14px 0 4px;}
  .stats .s{font-size:12.5px; color:var(--text-dim);}
  .stats .s b{color:var(--text); font-size:15px; margin-right:3px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-top:14px;}
  .card{background:var(--bg-raised); border:1px solid var(--border); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:9px; cursor:pointer; transition:transform .12s, box-shadow .12s; position:relative;}
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .card h3{font-size:15px; display:flex; align-items:center; gap:8px;}
  .tag{font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--bg-page); border:1px solid var(--border); color:var(--text-dim);}
  .tag.live{color:#3fb950; border-color:#3fb95055;}
  .tag.shadow{color:#e3b341; border-color:#e3b34155;}
  .tag.tool{color:#8b949e;}
  .tl{color:var(--text-dim); font-size:12.5px; line-height:1.5;}
  .mtags{display:flex; gap:6px; flex-wrap:wrap;}
  .mtags span{font-size:10.5px; padding:2px 8px; border-radius:6px; background:rgba(88,166,255,.12); color:#79b8ff;}
  .foot{display:flex; justify-content:space-between; align-items:center; margin-top:auto; font-size:11.5px; color:var(--text-dim);}
  .sub{padding:5px 14px; border-radius:8px; border:1px solid var(--blu-600); background:var(--blu-600); color:#fff; font-size:12px; cursor:pointer;}
  .sub.done{background:transparent; color:#3fb950; border-color:#3fb950;}
  /* K-STOCK-137f S-d 轻量直订：直接建仓为次要按钮（区别于订阅/雇佣主按钮） */
  .sub.ghost{background:transparent; color:#79b8ff; border-color:#79b8ff55; font-size:11px;}
  /* 下钻抽屉 */
  .mask{display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9;}
  .drawer{display:none; position:fixed; top:0; right:0; bottom:0; width:min(560px,94vw); background:var(--bg-page); z-index:10; overflow-y:auto; padding:26px; border-left:1px solid var(--border);}
  .drawer h2{font-size:18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .drawer .close{position:absolute; top:14px; right:18px; font-size:22px; cursor:pointer; color:var(--text-dim); background:none; border:none;}
  .sect{margin-top:16px;}
  .sect h4{font-size:12.5px; color:var(--text-dim); letter-spacing:1px; margin-bottom:8px;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  td{padding:6px 8px; border-bottom:1px solid var(--border); vertical-align:top;}
  td:first-child{color:var(--text-dim); white-space:nowrap; width:64px;}
  .warn{margin-top:12px; padding:9px 12px; border-radius:8px; background:rgba(227,179,65,.1); border:1px solid rgba(227,179,65,.4); color:#e3b341; font-size:12px; line-height:1.5;}
  .sample{font-size:12.5px; padding:7px 0; border-bottom:1px dashed var(--border); display:flex; justify-content:space-between; gap:8px;}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--bg-raised); border:1px solid var(--border); padding:10px 20px; border-radius:10px; font-size:13px; display:none; z-index:20;}
  #pf{margin-top:16px; padding:14px 16px; background:var(--bg-raised); border:1px solid var(--border); border-radius:12px; display:none;}
  #pf .free{font-size:10.5px; color:#3fb950; margin-left:8px;}
  /* 投研团队 */
  .team-title{margin:22px 0 4px; font-size:14.5px; font-weight:700; display:flex; align-items:center; gap:8px;}
  .team-title small{font-weight:400; color:var(--text-dim); font-size:11.5px;}
  .tgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; margin-top:10px;}
  .tcard{background:var(--bg-raised); border:1px solid var(--border); border-radius:12px; padding:13px 14px; display:flex; flex-direction:column; gap:6px; cursor:pointer; transition:transform .12s, box-shadow .12s;}
  .tcard:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .tcard h4{font-size:13.5px; display:flex; align-items:center; gap:7px;}
  .tcard .meta{font-size:11.5px; color:var(--text-dim); line-height:1.55;}
  .grade{font-size:10px; padding:1px 7px; border-radius:999px; border:1px solid var(--border); color:var(--text-dim);}
  .grade.live{color:#3fb950; border-color:#3fb95055;}
  .grade.training{color:#e3b341; border-color:#e3b34155;}
  .grade.ops{color:#79b8ff; border-color:#79b8ff55;}
  .hired-dot{font-size:10px; color:#3fb950;}
  .tbtns{display:flex; gap:8px; margin-top:2px;}
  .btn-fire{padding:4px 12px; border-radius:8px; border:1px solid #f8514988; background:transparent; color:#f85149; font-size:11.5px; cursor:pointer;}
  .btn-idx{font-size:11px; color:var(--text-dim); line-height:1.5;}
</style>
<script src="/static/nav.js" defer></script>
<script src="/static/cainiao.js" defer></script><meta name=wb-shell content=adopted>
<!-- OS-UI-UNIFY:theme -->
<link rel="stylesheet" href="/static/os_theme.css" data-os-unify="1">
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">策</div>
    <div><h1>策略市场</h1><small>STRATEGY MARKET · K-STOCK-122</small></div>
  </div>
  <nav class="topnav">
    <a href="/">首页</a><a href="/paper">模拟仓</a><a href="/picks">选股</a>
    <a class="on" href="/market-strategy">策略市场</a>
  </nav>
</header>
<div class="wrap">
  <div class="stats" id="stats">加载中…</div>
  <div id="pf"></div>
  <div class="grid" id="grid"></div>
  <div class="team-title">👔 操盘手团队 <small>投资部经理介绍 · 分等级 · 点卡片下钻历史能力</small></div>
  <div class="tgrid" id="team"><div class="tl">名册加载中…</div></div>
  <p style="margin-top:18px; font-size:11.5px; color:var(--text-dim);">
    合规脚注：本页为模拟盘策略展示。shadow 态策略处于研究验证期，不构成任何选股依据；订阅当前免费，未来商业化另行公示。</p>
</div>
<div class="mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="close" onclick="closeDrawer()">×</button>
  <div id="dbody">加载中…</div>
</div>
<div class="toast" id="toast"></div>
<script>
let DATA=null, SUBS=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 2026-10-19 审计修复（396dc7d2 后续普查）：内联事件处理器上下文
   onclick="openTrader('...')" —— t.id 来自 /api/trader_roster API 数据，裸插单引号 JS 串：
   值含 ' → JS 串 breakout；值含 " → HTML 属性 breakout。双上下文双重转义
   （先 JS 串转义 \ 与 '，再 HTML 实体转义 & " < >，两组互不产生对方字符）。 */
const jsAttr=s=>String(s??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
/* class 上下文白名单：status 枚举对应 CSS .grade.live/.training/.ops，非枚举一律中性（不加类） */
const GRADE_CLS={live:1,training:1,ops:1};
const gradeCls=s=>GRADE_CLS[s]?s:'';
async function apiPost(url,body){
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  return r.json();}
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2200);}
async function toggleSub(id,ev){
  ev.stopPropagation();
  const r=await apiPost('/api/portfolio_subscribe',{strategy:id,action:'toggle'});
  if(r.ok){toast((r.action==='add'?'已订阅 ':'已退订 ')+id); await loadSubs(); render();}
  else toast('失败：'+(r.error||'?'));}
/* K-STOCK-137f S-d 轻量直订动线：不雇佣、不组团队，直接模拟建仓 */
async function directOpen(id,ev){
  ev.stopPropagation();
  const s=(DATA.strategies||[]).find(x=>x.id===id);
  if(!s||s.status!=='live'){toast('仅产线（live）策略支持直接建仓');return;}
  const stock=prompt('模拟建仓标的（6位代码.SH/.SZ/.BJ）：','');
  if(!stock)return;
  const qty=parseInt(prompt('股数（100 整数倍）：','100'),10);
  if(!qty||qty<=0||qty%100){toast('qty 须为 100 的整数倍');return;}
  if(!confirm('轻量直订：在「'+s.name+'」动线下直接模拟建仓 '+stock.trim().toUpperCase()+' ×'+qty+'？\n（无经理无复盘，不组团队）'))return;
  const r=await apiPost('/api/paper_direct_open',{strategy_id:id,stock:stock.trim().toUpperCase(),qty:qty});
  if(r.ok){toast('✅ 已模拟建仓 '+stock.trim().toUpperCase()+' · 轻量模式：无经理无复盘，随时可在策略详情升级雇佣');}
  else toast('建仓失败：'+(r.error||'?'));}
function renderPf(){
  const pf=document.getElementById('pf');
  if(!SUBS.size){pf.style.display='none'; return;}
  pf.style.display='block';
  const names=DATA.strategies.filter(s=>SUBS.has(s.id)).map(s=>esc(s.name));
  const shadow=DATA.strategies.filter(s=>SUBS.has(s.id)&&s.status==='shadow');
  const hired=TEAM.filter(t=>t.hired_pf);
  const hiredHtml=hired.length
    ?('<div class="meta" style="margin-top:8px;">🤖 操盘手：'+hired.map(t=>'<b>'+esc(t.name||t.id)+'</b>').join('、')
      +'（跟单工作日 07:10 自动执行）</div>')
    :('<div class="meta" style="margin-top:8px; color:#e3b341;">尚未聘操盘手——在下方团队名册选一位，或手动模拟买卖。</div>');
  pf.innerHTML='<b style="font-size:13.5px;">我的组合</b><span class="free">免费体验 · 未来商业化收费</span>'
    +'<div class="mtags" style="margin-top:8px;">'+names.map(n=>'<span>'+n+'</span>').join('')+'</div>'
    +hiredHtml
    +(shadow.length?'<div class="warn" style="margin-top:8px;">组合含 shadow 态策略：'+shadow.map(s=>esc(s.name)).join('、')+'（研究验证中，不构成选股依据）</div>':'')
    +'<div style="margin-top:10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">'
    +'<button class="sub" onclick="document.getElementById(\'team\').scrollIntoView({behavior:\'smooth\'})">去团队选操盘手 ↓</button>'
    +'<a class="sub" style="text-decoration:none; background:transparent; color:#79b8ff;" href="/paper">手动模拟买卖 →</a>'
    +'</div>';}
function render(){
  document.getElementById('stats').innerHTML=
    '策略 <b>'+DATA.count+'</b> 个 ｜ 产线 <b class="s" style="color:#3fb950">'+DATA.live+'</b> ｜ 影子验证 <b style="color:#e3b341">'+DATA.shadow+'</b>';
  document.getElementById('grid').innerHTML=DATA.strategies.map(s=>{
    const st=s.status;
    return '<div class="card" onclick="openDetail(\''+s.id+'\')">'
      +'<h3>'+(s.recommended?'<span title="经理主推">⭐</span>':'')+esc(s.name)+' <span class="tag '+st+'">'+(st==='live'?'产线':st==='shadow'?'影子验证':st==='tool'?'工具':'暂停')+'</span></h3>'
      +'<div class="tl">'+esc(s.tagline)+'</div>'
      +(s.manager_intro?'<div class="tl" style="font-size:11.5px; color:#d2a8ff;">👔 经理：'+esc(s.manager_intro)+'</div>':'')
      +'<div class="mtags">'+s.method_tags.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>'
      +'<div class="foot"><span>今日命中 <b>'+s.hits_today+'</b> · 订阅 '+s.subscribers+'</span>'
      +'<span style="display:flex; gap:6px;">'
      +(st==='live'?'<button class="sub ghost" title="轻量直订：不雇佣操盘手，直接模拟建仓" onclick="directOpen(\''+s.id+'\',event)">直接建仓</button>':'')
      +'<button class="sub'+(SUBS.has(s.id)?' done':'')+'" onclick="toggleSub(\''+s.id+'\',event)">'
      +(SUBS.has(s.id)?'✓ 已订阅':'订阅')+'</button></span></div></div>';}).join('');
  renderPf();}
function closeDrawer(){document.getElementById('mask').style.display='none';
  document.getElementById('drawer').style.display='none';}
async function openDetail(id){
  document.getElementById('mask').style.display='block';
  document.getElementById('drawer').style.display='block';
  const b=document.getElementById('dbody'); b.textContent='加载中…';
  const r=await fetch('/api/strategy_detail?id='+encodeURIComponent(id));
  const d=await r.json(); if(!d.ok){b.textContent='加载失败'; return;}
  const s=d.strategy, dy=d.dynamic;
  b.innerHTML='<h2>'+(d.recommended?'⭐ ':'')+esc(s.name)+' <span class="tag '+s.status+'">'+s.status+'</span></h2>'
    +'<div class="tl" style="margin-top:8px;">'+esc(s.tagline)+'</div>'
    +(d.manager_intro?'<div class="sect"><h4>👔 投资部经理介绍</h4><div class="tl" style="color:#d2a8ff;">'+esc(d.manager_intro)+'</div></div>':'')
    +'<div class="mtags" style="margin-top:10px;">'+d.method_tags.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>'
    +(s.status==='shadow'?'<div class="warn">⚠ '+esc(s.status_note||'研究态 · 不构成选股依据')+'</div>':'')
    +'<div class="sect"><h4>记分卡</h4><table>'+(s.metrics||[]).map(m=>'<tr><td>'+esc(m.k)+'</td><td>'+esc(m.v)+'</td></tr>').join('')+'</table></div>'
    +'<div class="sect"><h4>今日命中样本（'+dy.n+'）</h4>'
    +(dy.samples.length?dy.samples.map(x=>'<div class="sample"><span><b>'+esc(x.code)+'</b> '+esc(x.name)+' · '+esc(x.industry)+'</span><span class="tag">'+esc(x.tag)+'</span></div>').join(''):'<div class="tl">今日暂无命中</div>')+'</div>'
    +'<div class="sect"><button class="sub" onclick="toggleSub(\''+s.id+'\',event);closeDrawer();">'+(SUBS.has(s.id)?'✓ 退订':'订阅（免费）')+'</button>'
    +' <a href="'+esc(s.href||'#')+'" style="margin-left:10px; font-size:12.5px; color:#79b8ff;">进入策略工作台 →</a></div>';}
async function loadSubs(){
  const r=await (await fetch('/api/portfolios')).json();
  SUBS=new Set();
  for(const pf of (r.portfolios||[])) for(const s of (pf.strategies||[])) SUBS.add(s);}
let TEAM=[];
function pct(v){return (v==null?'-':(v>0?'+':'')+Number(v).toFixed(2)+'%');}
function renderTeam(){
  const el=document.getElementById('team');
  if(!TEAM.length){el.innerHTML='<div class="tl">名册为空</div>';return;}
  el.innerHTML=TEAM.map(t=>
    '<div class="tcard" onclick="openTrader(\''+jsAttr(t.id)+'\')">'
    +'<h4>'+esc(t.name||t.id)+' <span class="grade '+gradeCls(t.status)+'">'+esc(t.grade)+'</span>'
    +(t.hired_pf?'<span class="hired-dot">● 组合在岗</span>':'')+'</h4>'
    +'<div class="meta">'+(t.style?('风格：'+esc(t.style)+' · '):'')
    +'运行 '+t.days+' 天</div>'
    +(t.days>0?('<div class="meta">累计 '+pct(t.cum_pct)+' · 最大回撤 '+pct(t.max_dd_pct)
      +(t.sharpe!=null?(' · Sharpe '+Number(t.sharpe).toFixed(2)):'')+'</div>'):'')
    +'<div class="tbtns">'
    +(t.hired_pf
      ?'<button class="btn-fire" onclick="fireTrader(\''+t.id+'\',event)">解聘</button>'
      :'<button class="sub" onclick="hireTraderId(\''+t.id+'\',event)">聘为组合操盘手</button>')
    +'<span class="btn-idx">点卡片看历史能力 →</span></div></div>').join('');}
async function loadTeam(){
  const r=await (await fetch('/api/trader_roster')).json();
  TEAM=r.ok?(r.rows||[]):[];
  renderTeam();}
async function hireTraderId(id,ev){
  ev.stopPropagation();
  const r=await apiPost('/api/portfolio_hire',{trader:id});
  if(r.ok){toast('已聘 '+id+'（次日 07:05 主闭环生效）'); await Promise.all([loadTeam(),loadSubs()]); renderPf();}
  else toast('聘用失败：'+(r.error||'?'));}
async function fireTrader(id,ev){
  ev.stopPropagation();
  if(!confirm('确认解聘 '+id+'？组合跟单将停止。')) return;
  const r=await apiPost('/api/trader_fire',{trader:id});
  if(r.ok){toast('已解聘 '+id); await Promise.all([loadTeam(),loadSubs()]); renderPf();}
  else toast('解聘失败：'+(r.error||'?'));}
async function openTrader(id){
  document.getElementById('mask').style.display='block';
  document.getElementById('drawer').style.display='block';
  const b=document.getElementById('dbody'); b.textContent='加载中…';
  const r=await fetch('/api/trader_detail?id='+encodeURIComponent(id));
  const d=await r.json(); if(!d.ok){b.textContent='加载失败：'+esc(d.error||''); return;}
  const t=d.trader;
  const eq=(d.equity||[]).map(e=>
    '<div class="sample"><span>'+esc(e.date)+'</span><b>¥'+Number(e.total).toLocaleString()+'</b></div>').join('');
  const rec=(d.recent||[]).map(o=>
    '<div class="sample"><span>'+esc(o.fill_date)+' <b>'+esc(o.stock)+'</b> '+esc(o.side)+' ×'+o.qty+'</span>'
    +'<span>'+(o.filled_price?('@'+Number(o.filled_price).toFixed(2)):'-')+'</span></div>').join('');
  b.innerHTML='<h2>'+esc(t.name||t.id)+' <span class="grade '+gradeCls(t.status)+'">'+esc(t.grade)+'</span>'
    +(t.hired_pf?'<span class="hired-dot">● 组合在岗</span>':'')+'</h2>'
    +'<div class="tl" style="margin-top:8px;">'+(t.style?('风格：'+esc(t.style)+' · '):'')+'运行 '+t.days+' 天 · 成交 '+d.filled_total+' 笔'
    +(t.verify_ok!=null?(' · 验证 '+(t.verify_ok?'✅':'⚠')):'')+'</div>'
    +(t.days>0?('<div class="sect"><h4>能力记分卡</h4><table>'
      +'<tr><td>累计收益</td><td>'+pct(t.cum_pct)+'</td></tr>'
      +'<tr><td>最大回撤</td><td>'+pct(t.max_dd_pct)+'</td></tr>'
      +(t.sharpe!=null?'<tr><td>Sharpe</td><td>'+Number(t.sharpe).toFixed(2)+'</td></tr>':'')
      +(t.sortino!=null?'<tr><td>Sortino</td><td>'+Number(t.sortino).toFixed(2)+'</td></tr>':'')
      +'</table></div>'):'<div class="warn">储备/设计期交易员，暂无实盘模拟成绩，启用后开始累计。</div>')
    +'<div class="sect"><h4>净值快照（近 '+ (d.equity||[]).length +' 日）</h4>'+(eq||'<div class="tl">暂无净值</div>')+'</div>'
    +'<div class="sect"><h4>近期成交</h4>'+(rec||'<div class="tl">暂无成交</div>')+'</div>'
    +'<div class="sect"><button class="sub" onclick="closeDrawer();'
    +(t.hired_pf?('fireTrader(\''+t.id+'\',event)'):('hireTraderId(\''+t.id+'\',event)'))+'">'
    +(t.hired_pf?'解聘':'聘为组合操盘手（免费）')+'</button></div>';}
(async()=>{
  const r=await fetch('/api/strategy_market');
  DATA=await r.json();
  if(DATA.ok){ await loadSubs(); await loadTeam(); render(); }
  else document.getElementById('grid').innerHTML='<p style="color:#f85149">加载失败：'+esc(DATA.error)+'</p>';
})();
</script>
