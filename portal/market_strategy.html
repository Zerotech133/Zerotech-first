<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>策略市场 · K-STOCK</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="icon" href="data:,">
<style>
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif; background:var(--bg-page); color:var(--text); min-height:100vh; font-size:14px;}
  .wrap{max-width:1280px; margin:0 auto; padding:0 26px 48px;}
  header{display:flex; align-items:center; justify-content:space-between; padding:20px 26px 12px; max-width:1280px; margin:0 auto; flex-wrap:wrap; gap:12px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .logo{width:38px; height:38px; border-radius:10px; background:linear-gradient(135deg,var(--blu-600),var(--pur-500)); display:grid; place-items:center; font-size:19px; font-weight:800; color:#fff;}
  .brand h1{font-size:17px; font-weight:700;}
  .brand small{color:var(--text-dim); font-size:10.5px; letter-spacing:3px; display:block; margin-top:2px;}
  .topnav{display:flex; gap:8px; flex-wrap:wrap;}
  .topnav a{padding:6px 14px; border-radius:999px; background:var(--bg-card); border:1px solid var(--line); color:var(--text); text-decoration:none; font-size:12.5px;}
  .topnav a.on{background:var(--blu-600); border-color:var(--blu-600); color:#fff;}
  .stats{display:flex; gap:18px; flex-wrap:wrap; margin:14px 0 4px;}
  .stats .s{font-size:12.5px; color:var(--text-dim);}
  .stats .s b{color:var(--text); font-size:15px; margin-right:3px;}
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; margin-top:14px;}
  .card{background:var(--bg-card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:9px; cursor:pointer; transition:transform .12s, box-shadow .12s; position:relative;}
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .card h3{font-size:15px; display:flex; align-items:center; gap:8px;}
  .tag{font-size:10.5px; padding:2px 8px; border-radius:999px; background:var(--bg-page); border:1px solid var(--line); color:var(--text-dim);}
  .tag.live{color:#3fb950; border-color:#3fb95055;}
  .tag.shadow{color:#e3b341; border-color:#e3b34155;}
  .tag.tool{color:#8b949e;}
  .tl{color:var(--text-dim); font-size:12.5px; line-height:1.5;}
  .mtags{display:flex; gap:6px; flex-wrap:wrap;}
  .mtags span{font-size:10.5px; padding:2px 8px; border-radius:6px; background:rgba(88,166,255,.12); color:#79b8ff;}
  .foot{display:flex; justify-content:space-between; align-items:center; margin-top:auto; font-size:11.5px; color:var(--text-dim);}
  .sub{padding:5px 14px; border-radius:8px; border:1px solid var(--blu-600); background:var(--blu-600); color:#fff; font-size:12px; cursor:pointer;}
  .sub.done{background:transparent; color:#3fb950; border-color:#3fb950;}
  /* 下钻抽屉 */
  .mask{display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:9;}
  .drawer{display:none; position:fixed; top:0; right:0; bottom:0; width:min(560px,94vw); background:var(--bg-page); z-index:10; overflow-y:auto; padding:26px; border-left:1px solid var(--line);}
  .drawer h2{font-size:18px; display:flex; gap:10px; align-items:center; flex-wrap:wrap;}
  .drawer .close{position:absolute; top:14px; right:18px; font-size:22px; cursor:pointer; color:var(--text-dim); background:none; border:none;}
  .sect{margin-top:16px;}
  .sect h4{font-size:12.5px; color:var(--text-dim); letter-spacing:1px; margin-bottom:8px;}
  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  td{padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top;}
  td:first-child{color:var(--text-dim); white-space:nowrap; width:64px;}
  .warn{margin-top:12px; padding:9px 12px; border-radius:8px; background:rgba(227,179,65,.1); border:1px solid rgba(227,179,65,.4); color:#e3b341; font-size:12px; line-height:1.5;}
  .sample{font-size:12.5px; padding:7px 0; border-bottom:1px dashed var(--line); display:flex; justify-content:space-between; gap:8px;}
  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%); background:var(--bg-card); border:1px solid var(--line); padding:10px 20px; border-radius:10px; font-size:13px; display:none; z-index:20;}
  #pf{margin-top:16px; padding:14px 16px; background:var(--bg-card); border:1px solid var(--line); border-radius:12px; display:none;}
  #pf .free{font-size:10.5px; color:#3fb950; margin-left:8px;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo">策</div>
    <div><h1>策略市场</h1><small>STRATEGY MARKET · K-STOCK-122</small></div>
  </div>
  <nav class="topnav">
    <a href="/">首页</a><a href="/paper">模拟仓</a><a href="/picks">选股</a>
    <a class="on" href="/market-strategy">策略市场</a>
  </nav>
</header>
<div class="wrap">
  <div class="stats" id="stats">加载中…</div>
  <div id="pf"></div>
  <div class="grid" id="grid"></div>
  <p style="margin-top:18px; font-size:11.5px; color:var(--text-dim);">
    合规脚注：本页为模拟盘策略展示。shadow 态策略处于研究验证期，不构成任何选股依据；订阅当前免费，未来商业化另行公示。</p>
</div>
<div class="mask" id="mask" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <button class="close" onclick="closeDrawer()">×</button>
  <div id="dbody">加载中…</div>
</div>
<div class="toast" id="toast"></div>
<script>
let DATA=null, SUBS=new Set(JSON.parse(localStorage.getItem('sm_subs')||'[]'));
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(m){const t=document.getElementById('toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',2200);}
function toggleSub(id,ev){ev.stopPropagation();
  SUBS.has(id)?SUBS.delete(id):SUBS.add(id);
  localStorage.setItem('sm_subs',JSON.stringify([...SUBS]));
  render(); toast(SUBS.has(id)?'已订阅 '+id+'（M3 组合上线后自动生效）':'已退订 '+id);}
function renderPf(){
  const pf=document.getElementById('pf');
  if(!SUBS.size){pf.style.display='none'; return;}
  pf.style.display='block';
  const names=DATA.strategies.filter(s=>SUBS.has(s.id)).map(s=>esc(s.name));
  pf.innerHTML='<b style="font-size:13.5px;">我的组合</b><span class="free">免费体验 · 未来商业化收费</span>'
    +'<div class="mtags" style="margin-top:8px;">'+names.map(n=>'<span>'+n+'</span>').join('')
    +'</div><div class="tl" style="margin-top:8px;">组合生效后可选：聘交易员自动跟单 / 手动模拟买卖（M3/M4 上线）</div>';}
function render(){
  document.getElementById('stats').innerHTML=
    '策略 <b>'+DATA.count+'</b> 个 ｜ 产线 <b class="s" style="color:#3fb950">'+DATA.live+'</b> ｜ 影子验证 <b style="color:#e3b341">'+DATA.shadow+'</b>';
  document.getElementById('grid').innerHTML=DATA.strategies.map(s=>{
    const st=s.status;
    return '<div class="card" onclick="openDetail(\''+s.id+'\')">'
      +'<h3>'+esc(s.name)+' <span class="tag '+st+'">'+(st==='live'?'产线':st==='shadow'?'影子验证':st==='tool'?'工具':'暂停')+'</span></h3>'
      +'<div class="tl">'+esc(s.tagline)+'</div>'
      +'<div class="mtags">'+s.method_tags.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>'
      +'<div class="foot"><span>今日命中 <b>'+s.hits_today+'</b> · 订阅 '+s.subscribers+'</span>'
      +'<button class="sub'+(SUBS.has(s.id)?' done':'')+'" onclick="toggleSub(\''+s.id+'\',event)">'
      +(SUBS.has(s.id)?'✓ 已订阅':'订阅')+'</button></div></div>';}).join('');
  renderPf();}
function closeDrawer(){document.getElementById('mask').style.display='none';
  document.getElementById('drawer').style.display='none';}
async function openDetail(id){
  document.getElementById('mask').style.display='block';
  document.getElementById('drawer').style.display='block';
  const b=document.getElementById('dbody'); b.textContent='加载中…';
  const r=await fetch('/api/strategy_detail?id='+encodeURIComponent(id));
  const d=await r.json(); if(!d.ok){b.textContent='加载失败'; return;}
  const s=d.strategy, dy=d.dynamic;
  b.innerHTML='<h2>'+esc(s.name)+' <span class="tag '+s.status+'">'+s.status+'</span></h2>'
    +'<div class="tl" style="margin-top:8px;">'+esc(s.tagline)+'</div>'
    +'<div class="mtags" style="margin-top:10px;">'+d.method_tags.map(t=>'<span>'+esc(t)+'</span>').join('')+'</div>'
    +(s.status==='shadow'?'<div class="warn">⚠ '+esc(s.status_note||'研究态 · 不构成选股依据')+'</div>':'')
    +'<div class="sect"><h4>记分卡</h4><table>'+(s.metrics||[]).map(m=>'<tr><td>'+esc(m.k)+'</td><td>'+esc(m.v)+'</td></tr>').join('')+'</table></div>'
    +'<div class="sect"><h4>今日命中样本（'+dy.n+'）</h4>'
    +(dy.samples.length?dy.samples.map(x=>'<div class="sample"><span><b>'+esc(x.code)+'</b> '+esc(x.name)+' · '+esc(x.industry)+'</span><span class="tag">'+esc(x.tag)+'</span></div>').join(''):'<div class="tl">今日暂无命中</div>')+'</div>'
    +'<div class="sect"><button class="sub" onclick="toggleSub(\''+s.id+'\',event);closeDrawer();">'+(SUBS.has(s.id)?'✓ 退订':'订阅（免费）')+'</button>'
    +' <a href="'+esc(s.href||'#')+'" style="margin-left:10px; font-size:12.5px; color:#79b8ff;">进入策略工作台 →</a></div>';}
(async()=>{
  const r=await fetch('/api/strategy_market');
  DATA=await r.json();
  if(DATA.ok) render();
  else document.getElementById('grid').innerHTML='<p style="color:#f85149">加载失败：'+esc(DATA.error)+'</p>';
})();
</script>
</body>
</html>
