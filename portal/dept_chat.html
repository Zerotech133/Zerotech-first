<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>零界 · 部门点对点对话</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="stylesheet" href="/static/ui/ui.css">
<script src="/static/nav.js" defer></script>
<script src="/static/hq_people.js"></script>
<style>
html,body{height:100%}
.wb-palette-trigger{display:none!important}
body{margin:0;background:var(--bg-page);color:var(--text);font-family:var(--font-ui);display:flex;flex-direction:column;height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--bg-surface);flex:none}
.top .who{font-weight:700}.meta{color:var(--text-dim);font-size:12px}
.pill{display:inline-block;padding:2px 7px;border-radius:999px;border:1px solid var(--border);font-size:11px}
.pill.red{color:var(--color-err)}.pill.amber{color:var(--color-warn)}.pill.green{color:var(--color-ok)}
.wrap{display:flex;flex:1;min-height:0}
.side{width:330px;flex:none;border-right:1px solid var(--border);overflow:auto;padding:14px;background:var(--bg-surface)}
.side h3{font-size:12px;color:var(--text-dim);margin:12px 0 6px;font-weight:600}
.side p{font-size:12.5px;line-height:1.6;color:var(--text);margin:0 0 6px;white-space:pre-wrap}
.side a.topic{display:block;font-size:12.5px;color:var(--link);text-decoration:none;margin:4px 0;padding:6px 8px;border:1px solid var(--border);border-radius:8px}
.main{display:flex;flex-direction:column;flex:1;min-width:0;min-height:0}
.chat{flex:1;overflow-y:auto;padding:16px 20px;display:flex;flex-direction:column;gap:10px;background:var(--bg-page)}
.msg{max-width:78%;padding:9px 12px;border-radius:10px;font-size:13.5px;line-height:1.65;white-space:pre-wrap}
.msg.user{align-self:flex-end;background:var(--blu-600);color:#fff}
.msg.bot{align-self:flex-start;background:var(--bg-raised);border:1px solid var(--border)}
.msg.sys{align-self:center;max-width:90%;background:transparent;border:0;color:var(--text-dim);font-size:12px;text-align:center}
.composer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg-surface);flex:none;position:relative;z-index:50}
.composer input{flex:1;min-width:0;background:var(--bg-raised);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:9px 11px;font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg-raised);color:var(--text);text-decoration:none;cursor:pointer;font-size:13px}
.btn.primary{border-color:var(--blu-600);background:var(--blu-600);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.err{color:var(--color-err);font-size:12px}
@media(max-width:800px){.wrap{flex-direction:column}.side{width:auto;max-height:34vh;border-right:0;border-bottom:1px solid var(--border)}}
</style>
</head>
<body>
<div class="top">
  <div><a class="btn" href="/briefing">← 返回简报</a></div>
  <div class="who" id="title">部门点对点对话</div>
  <div class="meta" id="status">加载中…</div>
</div>
<div class="wrap">
  <aside class="side">
    <h3>今日汇报</h3>
    <div id="report"><div class="meta">加载中…</div></div>
    <h3>研究题</h3>
    <div id="topics"><div class="meta">—</div></div>
  </aside>
  <main class="main">
    <div class="chat" id="chat"></div>
    <div class="composer">
      <input id="input" placeholder="直接问该部门负责人…" autocomplete="off">
      <button class="btn primary" id="send" type="button">发送</button>
    </div>
  </main>
</div>
<script>
(function(){
'use strict';
var DAY=new Date().toISOString().slice(0,10);
var LS='hq_human_brief_'+DAY, CHATLS='hq_dept_chat_'+DAY;
function pLead(id){return (window.HQ_PEOPLE&&HQ_PEOPLE.leads&&HQ_PEOPLE.leads[id])||id||'-';}
function pDept(code){return (window.HQ_PEOPLE&&HQ_PEOPLE.depts&&HQ_PEOPLE.depts[code])||code||'-';}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(id){return document.getElementById(id);}
function qs(k){return new URLSearchParams(location.search).get(k)||'';}
function pill(s){var v=String(s||'');var c=/red/.test(v)?'red':(/amber/.test(v)?'amber':'green');return '<span class="pill '+c+'">'+esc(v)+'</span>';}
var lead=qs('lead')||'', dept=qs('dept')||'', report=null, chats={};
function loadChats(){try{chats=JSON.parse(localStorage.getItem(CHATLS)||'{}')||{};}catch(e){chats={};}}
function saveChats(){try{localStorage.setItem(CHATLS,JSON.stringify(chats));}catch(e){}}
function msgs(){return chats[lead]||[];}
function addMsg(role,text){chats[lead]=chats[lead]||[];chats[lead].push({role:role,text:text,ts:Date.now()});saveChats();renderChat();}
function renderChat(){
  var c=$('chat'); if(!c)return;
  var arr=msgs();
  c.innerHTML='<div class="msg sys">点对点对话 · '+esc(lead||'')+' · 继续追问今日汇报；真实云端模型，不自动派单</div>'
    +(arr.length?arr.map(function(m){return '<div class="msg '+(m.role==='user'?'user':'bot')+'">'+esc(m.text)+'</div>';}).join(''):'');
  c.scrollTop=c.scrollHeight;
}
function reportHtml(r){
  var topics=(r.research_topics||[]).map(function(t){var title=(t&&t.title)||t;return '<a class="topic" href="/special?'+new URLSearchParams({topic:title,title:title,source:lead,kind:'研究'}).toString()+'">'+esc(title)+' → 人专项</a>';}).join('');
  return '<p><b>'+esc(pLead(r.lead||lead))+'（'+esc(r.lead||lead)+'）· '+esc(leadingDept(r))+'</b> '+pill(r.status||'')+'</p>'
    +'<p><b>工作要点</b><br>'+esc((r.highlights||[]).join('；')||'未填')+'</p>'
    +'<p><b>阻塞</b><br>'+esc((r.blockers||[]).join('；')||'无')+'</p>'
    +'<p><b>需决策</b><br>'+esc((r.decision_requests||[]).join('；')||'无')+'</p>'
    +'<div class="meta" id="topics-inline">'+topics+'</div>';
}
function leadingDept(r){return pDept(r.dept||dept||'');}
function findReport(){
  var arr=[]; try{arr=JSON.parse(localStorage.getItem(LS)||'[]')||[];}catch(e){arr=[];}
  var r=arr.filter(function(x){return (x.lead||'')===lead;})[0]; if(r)return r;
  return null;
}
async function loadFromSnapshot(){
  try{
    var resp=await fetch('/api/hq/snapshot',{cache:'no-store'}); if(!resp.ok)return null;
    var p=await resp.json(); if(!(p&&p.ok&&p.data))return null;
    var b=(p.data.briefing&&p.data.briefing.departments)||[];
    return b.filter(function(x){return (x.lead||'')===lead;})[0]||null;
  }catch(e){return null;}
}
async function init(){
  loadChats();
  report=findReport()||await loadFromSnapshot();
  if(!report){
    $('title').textContent='部门点对点对话';
    $('status').innerHTML='<span class="err">无该部门今日汇报</span> · <a href="/briefing">回简报运行</a>';
    renderChat(); return;
  }
  dept=report.dept||dept;
  document.title='零界 · '+pLead(lead)+' · 点对点对话';
  $('title').textContent=pLead(lead)+' · '+leadingDept(report);
  $('status').innerHTML=pill(report.status||'')+' · 对话保存在本页';
  $('report').innerHTML=reportHtml(report);
  renderChat();
}
async function send(){
  var q=($('input').value||'').trim(); if(!q||!lead)return;
  var btn=$('send'); btn.disabled=true; $('input').value=''; addMsg('user',q);
  var hist=msgs().slice(-10).map(function(m){return (m.role==='user'?'老田：':'负责人：')+m.text;}).join('\n');
  var system='你是'+pLead(lead)+'（'+lead+'），零界'+pDept(dept)+'负责人。只从职能面回答；不编造具体数字，缺证据标需查证；不自动派单、不代批 L2。';
  var body={agent:lead,system:system,purpose:'dept_chat',user:'历史对话：\n'+hist+'\n\n当前问题：'+q};
  try{
    var ctl=new AbortController(); var timer=setTimeout(function(){ctl.abort();},90000);
    var r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,body:JSON.stringify(body)});
    var env=await r.json(); clearTimeout(timer);
    if(!r.ok||!env||!env.ok)throw new Error((env&&env.error&&(env.error.message||env.error.code))||('HTTP '+r.status));
    var text=(env.data&&env.data.text)||''; if(!text)throw new Error('empty_model_text');
    addMsg('assistant',text);
    $('status').innerHTML='已回复 · '+esc(env.binding||env.data.binding_resolved||'-')+(env.degraded?' · 降级':'');
  }catch(e){
    addMsg('assistant','[云端回复失败] '+String(e.message||e).slice(0,200));
    $('status').innerHTML='<span class="err">回复失败，可重试</span>';
  }finally{btn.disabled=false;$('input').focus();}
}
$('send').onclick=send;
$('input').addEventListener('keydown',function(e){if(e.key==='Enter')send();});
init();
})();
</script>
</body>
</html>
