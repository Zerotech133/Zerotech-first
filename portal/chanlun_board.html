<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>结构池与模拟仓 · 零界</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/static/tokens.css">
  <link rel="stylesheet" href="/static/os_theme.css">
  <link rel="stylesheet" href="/static/ui/ui.css">
  <script src="/static/nav.js" defer></script>
  <script src="/static/ui/ui.js" defer></script>
  <style>
    /* 只写业务布局，不改基础组件外观；颜色一律走 tokens（UI 宪法 §4.4） */
    .gate { display: grid; grid-template-columns: minmax(0,1.4fr) minmax(0,1fr); gap: 20px; align-items: center; }
    .gate__label { display: block; color: var(--ui-muted); font-size: 11px; font-weight: 700; letter-spacing: .14em; }
    .gate__state { display: flex; align-items: baseline; gap: 10px; margin: 6px 0 2px; }
    .gate__state b { font-size: clamp(26px, 3.2vw, 38px); line-height: 1.1; }
    .gate__state em { font-style: normal; font-size: 14px; font-weight: 700; }
    .gate--ok .gate__state b, .gate--ok .gate__state em { color: var(--color-ok); }
    .gate--warn .gate__state b, .gate--warn .gate__state em { color: var(--ui-amber); }
    .gate--stop .gate__state b, .gate--stop .gate__state em { color: var(--ui-red); }
    .gate__facts { display: grid; gap: 8px; }
    .fact { display: flex; justify-content: space-between; gap: 12px; padding: 8px 11px; border: 1px solid var(--ui-line); border-radius: 9px; background: var(--ui-paper-2); font-size: 12px; }
    .fact span { color: var(--ui-muted); }
    .fact b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-weight: 600; }

    .up { color: var(--color-up); font-variant-numeric: tabular-nums; }
    .dn { color: var(--color-dn); font-variant-numeric: tabular-nums; }
    .flat { color: var(--ui-muted); font-variant-numeric: tabular-nums; }
    .near { color: var(--ui-blue); font-variant-numeric: tabular-nums; }
    .bad { color: var(--ui-amber); font-variant-numeric: tabular-nums; }
    .warnmark { color: var(--ui-amber); font-weight: 700; }
    .muted { color: var(--ui-muted); }
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; margin: 0 0 12px; color: var(--ui-muted); font-size: 11.5px; }

    .dots { display: inline-flex; gap: 3px; vertical-align: middle; }
    .dots i { width: 7px; height: 7px; border-radius: 50%; background: transparent; border: 1px solid var(--ui-line); }
    .dots i.on { background: var(--ui-blue); border-color: var(--ui-blue); }

    .viewnav { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
    .viewtab { padding: 9px 18px; border: 1px solid var(--ui-line); border-radius: 10px; background: var(--ui-paper-2); color: var(--ui-muted); font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
    .viewtab[aria-selected="true"] { color: var(--ui-ink); border-color: var(--ui-blue); background: var(--ui-paper); }
    .viewtab small { margin-left: 6px; font-weight: 400; color: var(--ui-muted); }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 14px; }
    .segs { display: inline-flex; border: 1px solid var(--ui-line); border-radius: 9px; overflow: hidden; }
    .seg { padding: 7px 14px; border: 0; background: var(--ui-paper-2); color: var(--ui-muted); font: inherit; font-size: 12.5px; cursor: pointer; }
    .seg + .seg { border-left: 1px solid var(--ui-line); }
    .seg[aria-pressed="true"] { background: var(--ui-blue-weak, var(--ui-paper)); color: var(--ui-ink); font-weight: 700; }

    .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(206px, 1fr)); gap: 12px; }
    .card { display: block; width: 100%; text-align: left; padding: 13px 15px 12px; border: 1px solid var(--ui-line); border-radius: 12px; background: var(--ui-paper-2); color: inherit; font: inherit; cursor: pointer; transition: border-color .15s, transform .15s; }
    .card:hover { border-color: var(--ui-blue); transform: translateY(-1px); }
    .card__top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .card__name { font-size: 14px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card__n { font-family: var(--font-mono); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .card__meta { margin-top: 2px; display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--ui-muted); }
    .card__foot { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--ui-line); font-size: 11.5px; color: var(--ui-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card--accent { border-color: var(--ui-blue); }

    .rows { display: grid; gap: 1px; border: 1px solid var(--ui-line); border-radius: 12px; overflow: hidden; background: var(--ui-line); }
    .row { display: grid; grid-template-columns: minmax(0,1.5fr) 62px minmax(0,1fr) 76px 84px 84px 70px; gap: 8px; align-items: center; padding: 10px 13px; border: 0; background: var(--ui-paper-2); color: inherit; font: inherit; font-size: 12.5px; text-align: left; cursor: pointer; }
    .row:hover { background: var(--ui-paper); }
    .row--head { background: var(--ui-paper); color: var(--ui-muted); font-size: 11px; font-weight: 700; letter-spacing: .04em; cursor: default; }
    .row--head:hover { background: var(--ui-paper); }
    .row__nm { display: flex; align-items: center; gap: 7px; min-width: 0; }
    .row__nm b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row__code { color: var(--ui-muted); font-family: var(--font-mono); font-size: 11px; }
    .tag { display: inline-block; padding: 1px 6px; border-radius: 5px; border: 1px solid var(--ui-line); font-size: 10.5px; color: var(--ui-muted); white-space: nowrap; }
    .tag--buy1 { border-color: var(--ui-blue); color: var(--ui-blue); }
    .tag--sell { border-color: var(--ui-amber); color: var(--ui-amber); }
    .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

    .backbar { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; flex-wrap: wrap; }
    .backbar h3 { margin: 0; font-size: 15px; }
    .linkbtn { border: 1px solid var(--ui-line); border-radius: 8px; background: var(--ui-paper-2); color: var(--ui-muted); font: inherit; font-size: 12px; padding: 6px 12px; cursor: pointer; }
    .linkbtn:hover { color: var(--ui-ink); border-color: var(--ui-blue); }

    .ui-drawer .dtitle { margin: 0; font-size: 17px; }
    .drawer__sub { color: var(--ui-muted); font-size: 12px; margin: 0 0 14px; }
    .kv { display: grid; grid-template-columns: 88px minmax(0,1fr); gap: 7px 10px; font-size: 12.5px; margin: 0 0 16px; }
    .kv dt { color: var(--ui-muted); }
    .kv dd { margin: 0; font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .close-x { border: 1px solid var(--ui-line); background: var(--ui-paper-2); color: var(--ui-muted); width: 28px; height: 28px; border-radius: 8px; font-size: 15px; line-height: 1; cursor: pointer; }
    .close-x:hover { color: var(--ui-ink); border-color: var(--ui-blue); }

    .chain { list-style: none; margin: 0 0 16px; padding: 0 0 0 16px; border-left: 2px solid var(--ui-line); }
    .chain li { position: relative; padding: 0 0 12px 12px; font-size: 12.5px; }
    .chain li::before { content: ""; position: absolute; left: -21px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--ui-blue); }
    .chain li.dim::before { background: var(--ui-line); }
    .chain b { display: block; font-size: 12px; }
    .chain span { color: var(--ui-muted); font-family: var(--font-mono); font-size: 11.5px; }

    .tbl-wrap { overflow-x: auto; }
    .tbl-wrap .ui-table { min-width: 680px; }
    .note ul { margin: 0; padding-left: 18px; color: var(--ui-muted); font-size: 12.5px; line-height: 1.85; }
    /* ---- 买点对照（ab）---- */
    .ab-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(148px, 1fr)); gap: 10px; }
    .ab-kpi { border: 1px solid var(--ui-line); border-radius: 10px; padding: 11px 13px; background: var(--ui-paper-2); }
    .ab-kpi span { font-size: 12px; color: var(--ui-muted); }
    .ab-kpi b { display: block; margin-top: 4px; font-size: 19px; font-variant-numeric: tabular-nums; }
    .ab-kpi small { display: block; margin-top: 2px; font-size: 11.5px; color: var(--ui-muted); }
    .ab-row { grid-template-columns: minmax(0,1.6fr) 78px 78px 78px 78px 68px 78px 58px 54px; }
    .ab-row.is-on { border-color: var(--ui-blue); background: var(--ui-paper-2); }
    .abchart { display: block; width: 100%; height: auto; }
    .abchart .grid { stroke: var(--ui-line); stroke-width: 1; }
    .abchart .base { stroke: var(--ui-muted); stroke-width: 1; stroke-dasharray: 4 3; }
    .abchart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; }
    .abchart .ln-idx { stroke: var(--ui-muted); stroke-width: 1.4; stroke-dasharray: 5 4; }
    .abchart .ln-all { stroke: var(--ui-amber); }
    .abchart .ln-sel { stroke: var(--ui-blue); }
    .abchart text { font-size: 10px; fill: var(--ui-muted); }
    .ab-legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 6px; font-size: 12px; color: var(--ui-muted); }
    .ab-legend i { display: inline-block; width: 16px; height: 3px; margin-right: 5px; vertical-align: middle; border-radius: 2px; }
    .ab-legend i.k-sel { background: var(--ui-blue); }
    .ab-legend i.k-all { background: var(--ui-amber); }
    .ab-legend i.k-idx { background: var(--ui-muted); }
    .ab-bar { display: grid; grid-template-columns: 108px minmax(0,1fr) 96px; gap: 10px; align-items: center; }
    .ab-bar__track { position: relative; height: 12px; border-radius: 6px; background: var(--ui-paper-2); border: 1px solid var(--ui-line); }
    .ab-bar__track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 1px; background: var(--ui-line); }
    .ab-bar__track i { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; }
    .ab-bar__track i.pos { left: 50%; background: var(--color-up); }
    .ab-bar__track i.neg { right: 50%; background: var(--color-dn); }
    .ab-note { margin: 8px 0 0; font-size: 12.5px; color: var(--ui-muted); line-height: 1.7; }
    .ab-hl { padding: 10px 12px; border-left: 3px solid var(--ui-amber); background: var(--ui-paper-2); border-radius: 0 8px 8px 0; }
    @media (max-width: 900px) {
      .ab-row { grid-template-columns: minmax(0,1.5fr) 74px 74px 62px; }
      .ab-row > .h-hide { display: none; }
      .ab-bar { grid-template-columns: 92px minmax(0,1fr) 82px; }
    }
    /* ---- 升级验证（up）---- */
    .up-row { grid-template-columns: minmax(0,1.2fr) 62px 74px 74px 74px 74px 62px; }
    .up-row--wide { grid-template-columns: minmax(0,1.4fr) 74px 74px 74px 74px; }
    .up-row--skip { grid-template-columns: 88px 66px 66px 66px minmax(0,1fr); }
    .p3-row { grid-template-columns: minmax(0,1.5fr) 72px 78px 62px 70px 56px; }
    .p3-row--short { grid-template-columns: minmax(0,1.4fr) 68px 72px 68px 68px 68px 58px; }
    .p3-x { grid-template-columns: minmax(0,1fr) 96px 96px 96px 96px; }
    .p3-ov { grid-template-columns: minmax(0,1.4fr) 74px 90px 86px; }
    .p3-xcell { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; line-height: 1.25; }
    .p3-xcell small { font-size: 10.5px; color: var(--ui-muted); font-variant-numeric: tabular-nums; }
    .p3-verdict { margin: 10px 0 0; padding: 10px 13px; border-left: 3px solid var(--ui-amber);
      background: var(--ui-paper-2); border-radius: 0 8px 8px 0; font-size: 13px; line-height: 1.75; }
    .p3-verdict b { color: var(--ui-ink); }
    .p3-verdict--quiet { border-left-color: var(--ui-line); }
    .up-hist { display: grid; gap: 6px; }
    .up-hist__row { display: grid; grid-template-columns: 62px minmax(0,1fr) 64px; gap: 10px; align-items: center; }
    .up-hist__row span:first-child { font-size: 12px; color: var(--ui-muted); }
    .up-hist__bar { height: 12px; border-radius: 6px; background: var(--ui-paper-2); border: 1px solid var(--ui-line); overflow: hidden; }
    .up-hist__bar i { display: block; height: 100%; background: var(--ui-amber); border-radius: 5px; }
    .up-hist__row em { font-size: 12px; color: var(--ui-muted); font-style: normal; font-variant-numeric: tabular-nums; }
    .mt12 { margin-top: 12px; }
    .sk-42 { width: 42%; } .sk-68 { width: 68%; } .sk-55 { width: 55%; }
    .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

    /* 候风盘：净值曲线 + 带止损止盈位的持仓行 */
    .hf-row { grid-template-columns: minmax(0,1.4fr) 50px 70px 66px 74px 86px 76px; }
    .hf-row > span, .hf-row > .num { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
    .sl { color: var(--ui-amber); font-variant-numeric: tabular-nums; }
    .tp { color: var(--ui-blue); font-variant-numeric: tabular-nums; }
    .hfchart { width: 100%; height: auto; display: block; }
    .hfchart text { fill: var(--ui-muted); font-size: 10px; font-family: var(--font-mono); }
    .hfchart .base { stroke: var(--ui-line); stroke-dasharray: 3 3; }
    .hfchart .ln { fill: none; stroke: var(--ui-blue); stroke-width: 1.8; }
    .hfchart .dot { fill: var(--ui-blue); }
    .hfchart .grid { stroke: var(--ui-line); stroke-width: .6; opacity: .55; }
    .hfbar { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--ui-muted); margin: 6px 0 0; }
    .hfbar b { font-family: var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ui-ink); font-weight: 600; }

    .viewtab:focus-visible, .seg:focus-visible, .card:focus-visible, .row:focus-visible,
    .linkbtn:focus-visible, .close-x:focus-visible, .ui-btn:focus-visible,
    .ui-search input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
      .card, .viewtab, .ui-skeleton, .ui-btn { transition: none !important; animation: none !important; }
    }
    @media (max-width: 900px) {
      .gate { grid-template-columns: 1fr; }
      .row { grid-template-columns: minmax(0,1.4fr) 56px 92px 76px; }
      .row > .r-hide { display: none; }
      .row--head > .r-hide { display: none; }
    }
    @media (max-width: 560px) {
      .cards { grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
      .ui-drawer { width: calc(100vw - 16px); }
    }

    /* 候风盘响应式必须放在 .row 的媒体查询之后：同优先级下后者胜 */
    /* 390px 实测：4 列 + 3 个 8px gap + 26px padding 会把名称列压到 24px（只剩「同…」）。
       移动端一律 3 列；持仓表再叠一层两行网格，让止损位 / 止盈位各占一行且都看得见。 */
    @media (max-width: 900px) {
      .hf-row { grid-template-columns: minmax(0,1fr) 68px 78px; }
      .hf-row > .h-hide { display: none; }
      .hf-row .row__code { display: none; }
      .hf-row .row__nm b { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
      .hf-row--pos {
        grid-template-columns: minmax(0,1fr) 62px 82px;
        grid-template-areas: "nm pnl sl" "nm pnl tp";
        row-gap: 3px;
      }
      .hf-row--pos > .nm { grid-area: nm; }
      .hf-row--pos > .pnl { grid-area: pnl; }
      .hf-row--pos > .slc { grid-area: sl; }
      .hf-row--pos > .tpc { grid-area: tp; }
    }

    /* 成本验证：6 列（口径 / 净值 / 超额 / 每单位α / t / 成本） */
    .p5-row { grid-template-columns: minmax(0,1.75fr) 68px 72px 76px 50px 56px; }
    /* 方法论复盘：资产盘点表 5 列；势×期限矩阵宽一点（每格要放 超额+t） */
    .p6-row { grid-template-columns: minmax(0,1.5fr) repeat(4, 74px); }
    .p6m-row { grid-template-columns: 96px repeat(3, minmax(0,1fr)); }
    .p6m-row--head { color: var(--ui-muted); }
    .p6m-row .num { font-variant-numeric: tabular-nums; }
    .p6m-allpos { color: var(--up, #d0453c); font-weight: 600; }

    /* 三方向验证：敞口档 / 窗口 / 停3买 三张表，列数比 p3 多一列 */
    .p4-row { grid-template-columns: minmax(0,1.6fr) 70px 74px 64px 56px 76px 52px; }
    .p4-x { display: grid; gap: 6px; margin-top: 10px; font-variant-numeric: tabular-nums; }
    .p4-x > div { display: grid; grid-template-columns: 82px repeat(5, minmax(0,1fr));
      gap: 6px; align-items: center; font-size: 13px; }
    .p4-x > div > span { text-align: right; }
    .p4-x > div > span:first-child { text-align: left; color: var(--ui-muted); font-size: 12px; }

    /* 三件事验证：390px 下 6 列放不下，只留口径 / 净值 / 敞口归一，其余折叠 */
    @media (max-width: 900px) {
      .p3-row, .p3-row--short { grid-template-columns: minmax(0,1fr) 74px 78px; }
      .p3-row > span:nth-child(n+4), .p3-row--short > span:nth-child(n+4) { display: none; }
      /* 三方向：390px 下同样只留口径 / 净值 / 超额，其余折叠 */
      .p4-row { grid-template-columns: minmax(0,1fr) 72px 72px; }
      .p4-row > span:nth-child(n+4) { display: none; }
      .p5-row { grid-template-columns: minmax(0,1fr) 62px 68px; }
      .p5-row > span:nth-child(n+4) { display: none; }
      .p6-row { grid-template-columns: minmax(0,1fr) 62px 68px; }
      .p6-row > span:nth-child(n+4) { display: none; }
      /* 390px：三档必须都看得到（这是结论本身），只压字号不折列 */
      .p6m-row { grid-template-columns: 52px repeat(3, minmax(0,1fr)); }
      .p6m-row > span { font-size: 11px; }
      /* 390px 实测：.row__nm 是 flex，<small> 的说明文字会被压成逐字竖排，
         整行高度炸开且看不出是哪个变体。窄屏一律改成块级堆叠。 */
      .p3-row .row__nm, .p4-row .row__nm, .p5-row .row__nm,
      .p6-row .row__nm { display: block; }
      .p3-row .row__nm small, .p4-row .row__nm small,
      .p5-row .row__nm small { display: block; margin-top: 1px; line-height: 1.32; }
      .p5-row .row__nm small.p5-desc { display: none; }
      /* 校准表 6 列在 390px 放不下：只留 情景 / 双边 / 判定，条件折进标题 */
      .p4-x--cal > div { grid-template-columns: minmax(0,1fr) 52px 44px; }
      .p4-x--cal > div > span:nth-child(n+4) { display: none; }
      .p4-x { font-size: 11.5px; }
      .p4-x > div { grid-template-columns: 54px repeat(5, minmax(0,1fr)); gap: 3px; }
      /* 390px 实测：minmax(0,1fr) 首列会被 62px 固定列挤成 0px，类型名整列消失 */
      .p3-x { grid-template-columns: 46px repeat(4, minmax(0,1fr)); font-size: 12px; }
      .p3-xcell small { display: none; }
      .p3-ov { grid-template-columns: minmax(0,1fr) 46px 66px 64px; }
      .p3-verdict { padding: 9px 11px; font-size: 12.5px; }
    }
  </style>
</head>
<body data-wb-shell="adopted">
  <main class="ui-page">
    <header class="ui-page-head">
      <div>
        <span class="ui-eyebrow">ZEROBOUND · 结构池 · 只读</span>
        <h1>结构池与模拟仓</h1>
        <p>选是选，买是买。一买二买三买只负责入池；出不出手由势和时机决定。池子按板块或买点归类查看，点开任一只看它的条件与成交。</p>
      </div>
      <div class="ui-actions">
        <button class="ui-btn" type="button" id="reload">刷新数据</button>
        <a class="ui-btn" href="/">← 返回今日工作台</a>
      </div>
    </header>

    <nav class="viewnav" role="tablist" aria-label="视图">
      <button class="viewtab" role="tab" data-view="pool" aria-selected="true">池子 <small id="nv-pool">—</small></button>
      <button class="viewtab" role="tab" data-view="book" aria-selected="false">模拟仓 <small id="nv-book">—</small></button>
      <button class="viewtab" role="tab" data-view="hf" aria-selected="false">候风盘 <small id="nv-hf">—</small></button>
      <button class="viewtab" role="tab" data-view="ab" aria-selected="false">买点对照 <small id="nv-ab">—</small></button>
      <button class="viewtab" role="tab" data-view="up" aria-selected="false">升级验证 <small id="nv-up">—</small></button>
      <button class="viewtab" role="tab" data-view="p3" aria-selected="false">三件事验证 <small id="nv-p3">—</small></button>
      <button class="viewtab" role="tab" data-view="p4" aria-selected="false">三方向验证 <small id="nv-p4">—</small></button>
      <button class="viewtab" role="tab" data-view="p5" aria-selected="false">成本验证 <small id="nv-p5">—</small></button>
      <button class="viewtab" role="tab" data-view="p6" aria-selected="false">方法论复盘 <small id="nv-p6">—</small></button>

    <div id="app" aria-live="polite" aria-busy="true">
      <div class="ui-panel">
        <div class="ui-skeleton sk-42"></div>

      </div>

  </main>

<script>
(function () {
  'use strict';

  var S = { view: 'pool', dim: 'type', grp: null, q: '', code: null, bookTab: 'pos', hfTab: 'pos', abSel: 'b1' };
  var D = null;      // observe_board.json
  var B = null;      // trade_book.json
  var T = null;      // trade_trades.json（按需）
  var H = null;      // hf_book.json（候风模拟盘）
  var HT = null;     // hf_trades.json（候风逐笔，按需）
  var AB = null;     // hf_ab.json（买点对照）
  var UV = null;     // hf_variants.json（升级验证）
  var P3 = null;     // hf_phase3.json（冷却 / 排序 / 空头腿）
  var P4D = null;    // hf_phase4.json（降敞口 / 换窗口 / 停3买）
  var P5D = null;    // hf_phase5.json（成交成本 / 盈亏平衡 / walk-forward）
  var P6D = null;    // hf_phase6.json（择势层：势档 / 闸门 / 势×期限）
  var MX6 = null;    // hf_matrix.json（57 个老脚本的纳入状态盘点）

  function $(id) { return document.getElementById(id); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function n(v, d) { return (v == null || isNaN(v)) ? '—' : Number(v).toFixed(d == null ? 2 : d); }
  function pct(v) {
    if (v == null || isNaN(v)) return '<span class="flat">—</span>';
    var c = v > 0 ? 'up' : (v < 0 ? 'dn' : 'flat');
    return '<span class="' + c + '">' + (v > 0 ? '+' : '') + n(v) + '%</span>';
  }
  // 距离/余量的变化不是涨跌，不能借红绿（UI 宪法 §8.2）
  function pp(v, mode) {
    if (v == null || isNaN(v)) return '<span class="flat">—</span>';
    var c = 'flat';
    if (mode === 'worsen') c = v > 0 ? 'bad' : (v < 0 ? 'near' : 'flat');
    else c = v > 0 ? 'near' : 'flat';
    return '<span class="' + c + '">' + (v > 0 ? '+' : '') + n(v) + 'pp</span>';
  }
  function dots(c) {
    var h = '<span class="dots" aria-label="六条命中 ' + c.split('1').length + '">';
    for (var i = 0; i < c.length; i++) h += '<i' + (c[i] === '1' ? ' class="on"' : '') + '></i>';
    return h + '</span>';
  }
  function tagOf(t) {
    var cls = t === '1买' ? 'tag tag--buy1' : (/卖/.test(t) ? 'tag tag--sell' : 'tag');
    return '<span class="' + cls + '">' + esc(t) + '</span>';
  }

  // ---------------------------------------------------------------- 通用块
  function gate() {
    var g = (D && D.regime) || {};
    var state = g.grade || '未知';
    var cls = state === 'GREEN' ? 'gate--ok' : (state === 'RED' ? 'gate--stop' : 'gate--warn');
    var txt = state === 'RED' ? '停手' : (state === 'GREEN' ? '可做' : '减半');
    var nl = (g.next_levels || [])[0] || {};
    var h = '<section class="ui-panel gate ' + cls + '">';
    h += '<div><span class="gate__label">势闸门 · LAYER 2</span>';
    h += '<div class="gate__state"><b>' + esc(state) + '</b><em>' + esc(txt) + '</em></div>';
    h += '<p class="muted">判定基准：中证全指 20 日动量 ±2%，当前 ' + n(g.mom20_pct) + '%。' +
      'RED 的含义是「不新增 beta 暴露」，不是「马上要跌」。</p></div>';
    h += '<div class="gate__facts">';
    h += '<div class="fact"><span>主判指数</span><b>' + esc(g.primary || '—') + '</b></div>';
    if (nl.to) h += '<div class="fact"><span>转 ' + esc(nl.to) + ' 需</span><b>' + esc(nl.need || '') +
      (nl.dist_pct != null ? '（' + n(nl.dist_pct) + '%）' : '') + '</b></div>';
    h += '<div class="fact"><span>恢复开仓</span><b>20 日动量回到 −2% 以上</b></div>';
    h += '</div></section>';
    return h;
  }

  function kpis() {
    var c = (D && D.counts) || {};
    return '<section class="ui-grid ui-grid--4 mt12">' +
      '<div class="ui-kpi"><span>入池</span><b>' + (D.n || 0) + '</b><small>三类买点合计</small></div>' +
      '<div class="ui-kpi"><span>够格等势</span><b>' + (c.a || 0) + '</b><small>只差势这一步</small></div>' +
      '<div class="ui-kpi"><span>蓄势待突破</span><b>' + (c.b || 0) + '</b><small>本周在向上够门槛</small></div>' +
      '<div class="ui-kpi"><span>本周在恶化</span><b>' + (c.c || 0) + '</b><small>生死线余量在缩</small></div>' +
      '</section>';
  }

  // ---------------------------------------------------------------- 池子
  function quickCards() {
    var c = D.counts || {};
    var items = [
      { k: 'a', n: c.a || 0, t: '够格等势', s: '1买 且 ready≥5', foot: '点开看这一批' },
      { k: 'b', n: c.b || 0, t: '蓄势待突破', s: '仍在 ZG 下方、本周向上够', foot: '先看这一批' },
      { k: 'c', n: c.c || 0, t: '本周在恶化', s: '生死线余量在缩', foot: '从「等」改成「盯」' },
      { k: '*', n: D.n || 0, t: '全池', s: '三类买点全部', foot: '看全部' }
    ];
    var h = '<div class="cards">';
    for (var i = 0; i < items.length; i++) {
      var it = items[i];
      h += '<button class="card card--accent" type="button" data-quick="' + it.k + '">' +
        '<div class="card__top"><span class="card__name">' + esc(it.t) + '</span>' +
        '<span class="card__n">' + it.n + '</span></div>' +
        '<div class="card__meta"><span>' + esc(it.s) + '</span></div>' +
        '<div class="card__foot">' + esc(it.foot) + '</div></button>';
    }
    return h + '</div>';
  }

  function groupCards() {
    var g = (D.groups || {})[S.dim === 'type' ? 'by_type' : (S.dim === 'ind' ? 'by_ind' : 'by_grade')] || {};
    var byCode = {};
    for (var i = 0; i < D.rows.length; i++) byCode[D.rows[i].code] = D.rows[i];
    var keys = Object.keys(g);
    var h = '<div class="cards">';
    for (var j = 0; j < keys.length; j++) {
      var k = keys[j], codes = g[k];
      var ready5 = 0, sample = [];
      for (var m = 0; m < codes.length; m++) {
        var r = byCode[codes[m]];
        if (!r) continue;
        if (r.ready >= 5) ready5++;
        if (sample.length < 3) sample.push(r.name);
      }
      h += '<button class="card" type="button" data-grp="' + esc(k) + '">' +
        '<div class="card__top"><span class="card__name">' + esc(k) + '</span>' +
        '<span class="card__n">' + codes.length + '</span></div>' +
        '<div class="card__meta"><span>ready≥5 有 ' + ready5 + ' 只</span><span>' +
        Math.round(ready5 / codes.length * 100) + '%</span></div>' +
        '<div class="card__foot">' + esc(sample.join('、')) + '</div></button>';
    }
    return h + '</div>';
  }

  function poolList() {
    var codes;
    if (S.grp && S.grp.indexOf('Q:') === 0) {
      var qk = S.grp.slice(2);
      codes = qk === '*' ? D.rows.map(function (r) { return r.code; }) : (D.views[qk] || []).slice();
    } else if (S.grp) {
      var gg = (D.groups || {})[S.dim === 'type' ? 'by_type' : (S.dim === 'ind' ? 'by_ind' : 'by_grade')] || {};
      codes = (gg[S.grp] || []).slice();
    } else {
      codes = D.rows.map(function (r) { return r.code; });
    }
    var byCode = {};
    for (var i = 0; i < D.rows.length; i++) byCode[D.rows[i].code] = D.rows[i];
    var q = S.q.trim().toLowerCase();
    var list = codes.map(function (c) { return byCode[c]; }).filter(function (r) {
      if (!r) return false;
      if (!q) return true;
      return (r.code + r.name + r.ind + r.type).toLowerCase().indexOf(q) >= 0;
    });
    list.sort(function (a, b) { return (b.ready - a.ready) || (a.code > b.code ? 1 : -1); });

    var h = '<div class="rows">';
    h += '<div class="row row--head"><span>名称 / 代码</span><span>类型</span><span class="r-hide">板块</span>' +
      '<span class="num">距 ZG</span><span class="num r-hide">5 日Δ</span>' +
      '<span class="num r-hide">5 日涨跌</span><span class="num">条件</span></div>';
    if (!list.length) {
      h += '</div><div class="ui-empty">没有匹配的票。清空搜索或换一个分组。</div>';
      return h;
    }
    for (var j = 0; j < list.length; j++) {
      var r = list[j];
      var warn = (r.d5_ret != null && r.d5_ret < -10) ? ' <span class="warnmark">⚠</span>' : '';
      h += '<button class="row" type="button" data-code="' + esc(r.code) + '">' +
        '<span class="row__nm"><b>' + esc(r.name) + warn + '</b><span class="row__code">' + esc(r.code) + '</span></span>' +
        '<span>' + tagOf(r.type) + '</span>' +
        '<span class="r-hide muted">' + esc(r.ind) + '</span>' +
        '<span class="num">' + (r.gap_zg_s == null ? '—' : n(r.gap_zg_s) + '%') + '</span>' +
        '<span class="num r-hide">' + pp(r.d5_zg, 'near') + '</span>' +
        '<span class="num r-hide">' + pct(r.d5_ret) + '</span>' +
        '<span class="num">' + dots(r.c) + '</span></button>';
    }
    return h + '</div>';
  }

  function renderPool() {
    var h = gate() + kpis();
    if (S.grp) {
      var title = S.grp.indexOf('Q:') === 0
        ? ({ a: '够格等势', b: '蓄势待突破', c: '本周在恶化', '*': '全池' })[S.grp.slice(2)] || S.grp.slice(2)
        : S.grp;
      h += '<section class="ui-panel mt12"><div class="backbar">' +
        '<button class="linkbtn" type="button" data-back="1">← 分组</button>' +
        '<h3>' + esc(title) + '</h3>' +
        '<span class="muted" id="cnt">—</span></div>' +
        '<div class="ui-toolbar"><div class="ui-search">' +
        '<label class="sr" for="q2">搜索</label>' +
        '<input id="q2" type="search" placeholder="搜代码 / 名称 / 板块" value="' + esc(S.q) + '">' +
        '</div></div>' + poolList() + '</section>';
      return h;
    }
    h += '<section class="ui-panel mt12"><h2>先看这四类</h2>' +
      '<p class="muted">点卡片进列表，点股票看详情。够格不等于买——势这一步还没过。</p>' +
      quickCards() + '</section>';
    h += '<section class="ui-panel mt12"><div class="toolbar"><h2>按维度归类</h2>' +
      '<div class="segs" role="group" aria-label="分组维度">' +
      '<button class="seg" type="button" data-dim="type" aria-pressed="' + (S.dim === 'type') + '">按买点</button>' +
      '<button class="seg" type="button" data-dim="ind" aria-pressed="' + (S.dim === 'ind') + '">按板块</button>' +
      '<button class="seg" type="button" data-dim="grade" aria-pressed="' + (S.dim === 'grade') + '">按定级</button>' +
      '</div></div>' + groupCards() + '</section>';
    return h;
  }

  // ---------------------------------------------------------------- 模拟仓
  function bookKpis() {
    var st = (B && B.stats) || {};
    var rb = st.ret_buy || {}, ab = st.alpha_buy || {}, rs = st.ret_sell || {};
    var pos = (B.positions || []).length;
    var weakPos = (B.positions || []).filter(function (r) { return r.reg === '弱'; }).length;
    var h = '<section class="ui-grid ui-grid--4">';
    h += '<div class="ui-kpi"><span>可执行已平</span><b>' + (rb.n || 0) + '</b><small>多头买点，A 股只能做多</small></div>';
    h += '<div class="ui-kpi"><span>笔均收益</span><b class="' + (rb.mean > 0 ? 'up' : 'dn') + '">' + (rb.mean > 0 ? '+' : '') + n(rb.mean) + '%</b><small>胜率 ' + n(rb.win, 1) + '%</small></div>';
    h += '<div class="ui-kpi"><span>笔均 alpha</span><b class="' + (ab.mean > 0 ? 'up' : 'dn') + '">' + (ab.mean > 0 ? '+' : '') + n(ab.mean) + '%</b><small>扣掉 beta 后</small></div>';
    h += '<div class="ui-kpi"><span>当前持仓</span><b>' + pos + '</b><small>未出场多头</small></div>';
    h += '</section>';
    h += '<section class="ui-panel mt12"><h2>合并口径的 +2.4% 是假的</h2>' +
      '<p class="muted">台账双向：买点做多、卖点做空。A 股不能裸卖空，卖点只能当「该减了」的提示。' +
      '把两类合起来算，alpha 是 <b class="flat">+' + n((st.alpha || {}).mean) + '%</b>；' +
      '只算可执行的多头，是 <b class="' + (ab.mean > 0 ? 'up' : 'dn') + '">' + (ab.mean > 0 ? '+' : '') + n(ab.mean) + '%</b>。' +
      '不可执行那部分的 ' + n(rs.n || 0) + ' 笔（均值 +' + n(rs.mean) + '%）不计入业绩。</p>' +
      '<p class="muted">还要看清一件事：当前 ' + pos + ' 笔在途里，<b class="warnmark">' + weakPos +
      ' 笔是在弱市入的场</b>——按 v3 规则一笔都不该开。产线不等势就买，这才是可执行多头为负的原因。</p></section>';
    return h;
  }

  function bookList() {
    var rows = [];
    if (S.bookTab === 'closed') {
      if (!T) return '<div class="ui-empty">成交明细有 4MB，正在按需加载…</div>';
      rows = T.rows.slice();
      var q0 = S.q.trim().toLowerCase();
      if (q0) rows = rows.filter(function (r) {
        return ((r.code || '') + (r.name || '') + (r.ind || '') + (r.type || '')).toLowerCase().indexOf(q0) >= 0;
      });
      rows.sort(function (a, b) { return a.exit < b.exit ? 1 : (a.exit > b.exit ? -1 : 0); });
      var CAP = 150;
      var total = rows.length;
      rows = rows.slice(0, CAP);
      var hc = '<div class="rows"><div class="row row--head"><span>名称 / 代码</span><span>类型</span>' +
        '<span class="r-hide">板块</span><span class="num">入场 → 出场</span>' +
        '<span class="num">收益</span><span class="num r-hide">alpha</span><span class="num">出场原因</span></div>';
      if (!rows.length) return hc + '</div><div class="ui-empty">没有匹配的成交。</div>';
      for (var c1 = 0; c1 < rows.length; c1++) {
        var r1 = rows[c1];
        hc += '<button class="row" type="button" data-code="' + esc(r1.code) + '">' +
          '<span class="row__nm"><b>' + esc(r1.name) + '</b><span class="row__code">' + esc(r1.code) + '</span></span>' +
          '<span>' + tagOf(r1.type) + '</span>' +
          '<span class="r-hide muted">' + esc(r1.ind) + '</span>' +
          '<span class="num">' + esc(r1.entry) + ' → ' + esc(r1.exit) + '</span>' +
          '<span class="num">' + pct(r1.ret) + '</span>' +
          '<span class="num r-hide">' + pct(r1.alpha) + '</span>' +
          '<span class="num muted">' + esc(r1.reason || '—') + '</span></button>';
      }
      hc += '</div>';
      if (total > CAP) hc += '<p class="muted">按出场日倒序，只列最近 ' + CAP + ' 笔（共 ' + total + ' 笔）。用搜索框查特定股票。</p>';
      return hc;
    }
    if (S.bookTab === 'pos') rows = B.positions || [];
    else if (S.bookTab === 'hint') rows = B.sell_hints || [];
    else if (S.bookTab === 'blocked') rows = B.blocked || [];
    else rows = [];
    var q = S.q.trim().toLowerCase();
    if (q) rows = rows.filter(function (r) {
      return ((r.code || '') + (r.name || '') + (r.ind || '') + (r.type || '')).toLowerCase().indexOf(q) >= 0;
    });

    if (S.bookTab === 'blocked') {
      var h = '<div class="rows"><div class="row row--head"><span>名称 / 代码</span><span>类型</span>' +
        '<span class="r-hide">检测日</span><span class="num">近 20 日涨</span><span class="num r-hide">理由</span><span></span><span></span></div>';
      if (!rows.length) return h + '</div><div class="ui-empty">没有被拦的信号。</div>';
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        h += '<div class="row"><span class="row__nm"><b>' + esc(r.code) + '</b></span>' +
          '<span>' + tagOf(r.type) + '</span>' +
          '<span class="r-hide muted">' + esc(r.detect_date) + '</span>' +
          '<span class="num">' + pct((r.pre20 || 0) * 100) + '</span>' +
          '<span class="num r-hide muted">' + esc(r.reason) + '</span><span></span><span></span></div>';
      }
      return h + '</div>';
    }

    var hh = '<div class="rows"><div class="row row--head"><span>名称 / 代码</span><span>类型</span>' +
      '<span class="r-hide">板块</span><span class="num">入场</span>' +
      '<span class="num">持有</span><span class="num r-hide">势</span>' +
      '<span class="num">v3</span></div>';
    if (!rows.length) return hh + '</div><div class="ui-empty">这一栏是空的。</div>';
    for (var j = 0; j < rows.length; j++) {
      var r2 = rows[j];
      hh += '<button class="row" type="button" data-code="' + esc(r2.code) + '">' +
        '<span class="row__nm"><b>' + esc(r2.name) + '</b><span class="row__code">' + esc(r2.code) + '</span></span>' +
        '<span>' + tagOf(r2.type) + '</span>' +
        '<span class="r-hide muted">' + esc(r2.ind) + '</span>' +
        '<span class="num">' + (r2.entry_px == null ? '—' : n(r2.entry_px)) + '</span>' +
        '<span class="num">' + (r2.held == null ? '—' : r2.held + ' 日') + '</span>' +
        '<span class="num r-hide">' + esc(r2.reg || '—') + '</span>' +
        '<span class="num">' + (r2.v3_ok === true ? '<span class="near">是</span>' : '<span class="flat">否</span>') + '</span></button>';
    }
    return hh + '</div>';
  }

  function renderBook() {
    if (!B) return '<div class="ui-panel"><div class="ui-empty">账本没加载出来。</div></div>';
    if (S.bookTab === 'closed' && !T) {
      loadTrades().then(function () { if (S.bookTab === 'closed') render(); });
    }
    var h = bookKpis();
    var tabs = [
      { k: 'pos', t: '当前持仓', n: (B.positions || []).length },
      { k: 'closed', t: '历史成交', n: T ? T.n : '点开加载' },
      { k: 'hint', t: '减仓提示', n: (B.sell_hints || []).length },
      { k: 'blocked', t: '被拦', n: (B.blocked || []).length }
    ];
    h += '<section class="ui-panel mt12"><div class="ui-toolbar">' +
      '<div class="segs" role="group" aria-label="账本分栏">';
    for (var i = 0; i < tabs.length; i++) {
      h += '<button class="seg" type="button" data-btab="' + tabs[i].k + '" aria-pressed="' + (S.bookTab === tabs[i].k) + '">' +
        esc(tabs[i].t) + ' <span class="muted">' + tabs[i].n + '</span></button>';
    }
    h += '</div><div class="ui-search"><label class="sr" for="q">搜索</label>' +
      '<input id="q" type="search" placeholder="搜代码 / 名称" value="' + esc(S.q) + '">' +
      '</div></div>';
    h += bookList();
    h += '<p class="muted mt12">点任一条看完整溯源链（信号日 → 检测日 → 入场 → 出场）与该股全部成交。</p></section>';
    return h;
  }

  // ---------------------------------------------------------------- 候风盘
  // 口径来源：quant_backtest/_qpzm_rd_20261106/paper/（hold5 · inv_vol · guardian SL/TP
  // · sell_methodology 三标签）。与「模拟仓」的区别是：那一栏是产线台账原样（hold20、
  // 收盘价成交），这一栏是逐日盯市、T+1 开盘建仓的模拟盘。
  function hfChart(hf) {
    var nav = hf.nav || [];
    if (nav.length < 2) return '';
    var W = 680, HH = 158, L = 46, R = 12, T = 12, B = 22;
    var ys = nav.map(function (r) { return r.nav; });
    var lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
    if (hi - lo < 0.02) { hi += 0.012; lo -= 0.012; }
    function X(i) { return L + (W - L - R) * i / (nav.length - 1); }
    function Y(v) { return T + (HH - T - B) * (1 - (v - lo) / (hi - lo)); }
    var h = '<svg class="hfchart" viewBox="0 0 ' + W + ' ' + HH + '" role="img" aria-label="候风模拟盘逐日净值曲线，共 ' +
      nav.length + ' 个交易日，期末 ' + n((ys[ys.length - 1] - 1) * 100) + '%">';
    [hi, (hi + lo) / 2, lo].forEach(function (v) {
      h += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) +
        '" y2="' + Y(v).toFixed(1) + '"/>';
      h += '<text x="' + (L - 6) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end">' +
        v.toFixed(3) + '</text>';
    });
    if (lo <= 1 && 1 <= hi) {
      h += '<line class="base" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(1).toFixed(1) +
        '" y2="' + Y(1).toFixed(1) + '"/>';
      h += '<text x="' + (W - R) + '" y="' + (Y(1) - 4).toFixed(1) + '" text-anchor="end">本金 1.000</text>';
    }
    var pts = nav.map(function (r, i) { return X(i).toFixed(1) + ',' + Y(r.nav).toFixed(1); });
    h += '<polyline class="ln" points="' + pts.join(' ') + '"/>';
    var last = nav.length - 1;
    h += '<circle class="dot" cx="' + X(last).toFixed(1) + '" cy="' + Y(ys[last]).toFixed(1) + '" r="3"/>';
    h += '<text x="' + L + '" y="' + (HH - 6) + '">' + esc(nav[0].d) + '</text>';
    h += '<text x="' + (W - R) + '" y="' + (HH - 6) + '" text-anchor="end">' + esc(nav[last].d) + '</text>';
    return h + '</svg>';
  }

  // ---------------------------------------------------------------- 买点对照
  // 目的不是"证明 1买 好"，而是检验三件事：名额挤占、敞口混淆、时段稳健。
  // crowm 组是故意留的反例：它靠降仓把净值做上去，敞口归一后反而更差。
  var AB_LABEL = {
    all: '1买+2买+3买（现行）', b12: '只做 1买+2买', b1: '只做 1买',
    b2: '只做 2买', crowd: '拥挤度闸门'
  };

  function abChart(axis, curves, idx, sel) {
    if (!axis || axis.length < 2) return '';
    var W = 680, HH = 200, L = 48, R = 14, T = 12, B = 24;
    var keys = ['all', sel].filter(function (k, i, a) { return a.indexOf(k) === i; });
    var all = [];
    keys.forEach(function (k) { if (curves[k]) all = all.concat(curves[k]); });
    if (idx) all = all.concat(idx.filter(function (v) { return v != null; }));
    if (!all.length) return '';
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (hi - lo < 0.05) { hi += 0.03; lo -= 0.03; }
    function X(i) { return L + (W - L - R) * i / (axis.length - 1); }
    function Y(v) { return T + (HH - T - B) * (1 - (v - lo) / (hi - lo)); }

    var h = '<svg class="abchart" viewBox="0 0 ' + W + ' ' + HH + '" role="img" aria-label="' +
      '买点对照净值曲线，' + axis.length + ' 个交易日">';
    [hi, (hi + lo) / 2, lo].forEach(function (v) {
      h += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v).toFixed(1) +
        '" y2="' + Y(v).toFixed(1) + '"/>';
      h += '<text x="' + (L - 6) + '" y="' + (Y(v) + 3.5).toFixed(1) + '" text-anchor="end">' +
        v.toFixed(3) + '</text>';
    });
    if (lo <= 1 && 1 <= hi) {
      h += '<line class="base" x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(1).toFixed(1) +
        '" y2="' + Y(1).toFixed(1) + '"/>';
    }
    function line(vals, cls) {
      var pts = [];
      for (var i = 0; i < vals.length; i++) {
        if (vals[i] == null) continue;
        pts.push(X(i).toFixed(1) + ',' + Y(vals[i]).toFixed(1));
      }
      return pts.length > 1 ? '<polyline class="ln ' + cls + '" points="' + pts.join(' ') + '"/>' : '';
    }
    if (idx) h += line(idx, 'ln-idx');
    h += line(curves['all'], 'ln-all');
    if (sel !== 'all') h += line(curves[sel], 'ln-sel');
    h += '<text x="' + L + '" y="' + (HH - 6) + '">' + esc(axis[0]) + '</text>';
    h += '<text x="' + (W - R) + '" y="' + (HH - 6) + '" text-anchor="end">' +
      esc(axis[axis.length - 1]) + '</text>';
    return h + '</svg>';
  }

  function abBar(label, d, span) {
    if (!d) return '';
    var v = d.mean, w = Math.min(50, Math.abs(v) / span * 50);
    return '<div class="ab-bar"><span>' + esc(label) + '</span>' +
      '<div class="ab-bar__track"><i class="' + (v >= 0 ? 'pos' : 'neg') + '" data-w="' + w.toFixed(1) + '"></i></div>' +
      '<span class="num ' + (v >= 0 ? 'up' : 'dn') + '">' + (v >= 0 ? '+' : '') + n(v) + '%' +
      '<small class="muted"> n=' + d.n + '</small></span></div>';
  }

    // 结论卡

    // 曲线
    h += '<section class="ui-panel"><h2>净值曲线</h2>' + abChart(AB.meta.axis, AB.curves, (AB.index || {}).curve, sel) +

      '<span><i class="k-all"></i>现行（1+2+3买）</span>' +
      '<span><i class="k-idx"></i>中证全指</span></div>' +
      '<p class="ab-note">点下表任一行可切换蓝线。两本账仓位密度不同，跨线比高低时请并看「每单位敞口」。</p></section>';

    // 明细表
    h += '<section class="ui-panel"><h2>五组合明细</h2>' +
      '<div class="rows"><div class="row ab-row row--head"><span>组合</span>' +

      '<span class="num">前半</span><span class="num h-hide">后半</span>' +
      '<span class="num">笔均</span><span class="num h-hide">敞口归一</span>' +
      '<span class="num h-hide">仓位</span><span class="num h-hide">笔数</span></div>';
    ['all', 'b12', 'b1', 'b2', 'crowd'].forEach(function (k) {
      var c = C[k]; if (!c) return;

      h += '<button class="row ab-row' + (k === sel ? ' is-on' : '') + '" type="button" data-absel="' + k + '">' +
        '<span class="row__nm"><b>' + esc(AB_LABEL[k]) + '</b><span class="row__code">' +
        (c.only || []).join('+') + '</span></span>' +
        '<span class="num ' + (t.total_return >= 0 ? 'up' : 'dn') + '">' + n(t.total_return * 100) + '%</span>' +
        '<span class="num ' + ((t.alpha || 0) >= 0 ? 'up' : 'dn') + '">' +
        ((t.alpha || 0) >= 0 ? '+' : '') + n((t.alpha || 0) * 100) + 'pp</span>' +
        '<span class="num ' + ((t.seg_h1 || 0) >= 0 ? 'up' : 'dn') + '">' + n((t.seg_h1 || 0) * 100) + '%</span>' +
        '<span class="num h-hide ' + ((t.seg_h2 || 0) >= 0 ? 'up' : 'dn') + '">' + n((t.seg_h2 || 0) * 100) + '%</span>' +
        '<span class="num ' + (t.avg_ret >= 0 ? 'up' : 'dn') + '">' + n(t.avg_ret * 100) + '%</span>' +
        '<span class="num h-hide ' + ((t.ret_per_util || 0) >= 0 ? 'up' : 'dn') + '">' + n((t.ret_per_util || 0) * 100) + '%</span>' +
        '<span class="num h-hide">' + n(t.avg_util * 100) + '%</span>' +
        '<span class="num h-hide">' + t.n_trades + '</span></button>';
    });
    h += '</div><p class="ab-note">前半 / 后半以 ' + esc((AB.meta || {}).mid || '') +
      ' 切分，指数分别是 ' + n((AB.index.h1 || 0) * 100) + '% 与 ' + n((AB.index.h2 || 0) * 100) +
      '%。<b>「拥挤度闸门」是故意留的反例</b>：它把净值从 ' + n(C.all.stats.total_return * 100) + '% 抬到 ' +
      n((C.crowd ? C.crowd.stats.total_return : 0) * 100) + '%，但敞口归一从 ' +
      n((C.all.stats.ret_per_util || 0) * 100) + '% 掉到 ' + n((C.crowd ? C.crowd.stats.ret_per_util : 0) * 100) +
      '%——纯粹是仓位从 ' + n(C.all.stats.avg_util * 100) + '% 降到 ' + n((C.crowd ? C.crowd.stats.avg_util : 0) * 100) + '% 的效果。</p></section>';

    // 名额挤占
    var ov = AB.overlap || {};
    if (ov.both || ov.only_b12) {
      h += '<section class="ui-panel"><h2>名额挤占检验</h2>' +
        '<p class="note">现行盘每天只有 40 个仓位，' + (C.all.stats.skipped_room || 0) +
        ' 个信号被挡。把 3买 拿掉后，1买/2买 能多进来 ' + (ov.n_only_b12 || 0) +
        ' 笔。这批就是「被 3买 挤掉的样本」，它们的表现决定了挤占到底是不是损失。</p>' +
        abBar('两边都选中', ov.both, 2) + abBar('仅 b12 有（被挤掉）', ov.only_b12, 2) +

        '，胜率 ' + (ov.only_b12 || {}).win + '%，统计上显著为负。它们检出日的候选池中位 ' +
        ((ov.only_b12_pool || {}).median || '—') + ' 条，比两边都选中的 ' + ((ov.both_pool || {}).median || '—') +
        ' 条更拥挤——<b>信号越拥挤的日子，新检出的票越差</b>。所以 3买 不是抢了机会，是顺手挡住了一批烂信号。</p></section>';
    }

    // 分类型
    h += '<section class="ui-panel"><h2>同一类型在不同组合里的表现</h2>' +
      '<div class="rows"><div class="row ab-row row--head"><span>组合</span>' +
      '<span class="num">1买</span><span class="num">2买</span><span class="num">3买</span></div>';
    ['all', 'b12', 'b1', 'b2'].forEach(function (k) {
      var c = C[k]; if (!c) return;
      function cell(t) {

      h += '<div class="row ab-row"><span class="row__nm"><b>' + esc(AB_LABEL[k]) + '</b></span>' +
        cell('1买') + cell('2买') + cell('3买') + '</div>';
    });
    h += '</div><p class="ab-note">竖着看这一列 1买：现行 +0.87% → 只做 1买 −0.43%。<b>同一套规则、同一段窗口，只改了名额，符号就翻了。</b>' +
      '所以「1买 有 alpha」这个说法站不住；站得住的只有 3买 为负。</p></section>';

    // 还欠什么
    h += '<section class="ui-panel"><h2>这条路走不通，那走哪</h2><div class="ab-hl note">' +
      '<p>笔均全负 + 双边成本 0.2% + 这段窗口指数 −' + n(Math.abs((idx.full || 0) * 100)) +
      '%，三条叠在一起，<b>任何满仓做多的子集都不可能翻正</b>。继续切买点只会在噪声里挑最幸运的那个。</p>' +
      '<p>能真正改变符号的只有三条：① <b>降暴露时间</b>（不是降仓，是少开仓、缩短持有）；' +
      '② <b>提高单笔质量</b>（需要新入场条件，现在没有）；③ <b>加空头腿</b>——台账里 1卖/2卖 一直在，' +
      '候风盘只做了买点，这是唯一没被消耗过的方向。</p></div></section>';

    return h;
  }

  // ---------------------------------------------------------------- 升级验证
  // 四项升级同引擎对照。判定标准统一为「每单位敞口收益」(ret_per_util)：
  // 这段窗口指数跌 22%，降仓必然让净值变好，那是零选股能力的假改善。
  var UP_LABEL = {
    base: '基线（ATR · 等权 · 死拿5日）', struct_sl: '结构位止损',
    risk: '风险预算 1%', risk_2pct: '风险预算 2%',
    tag_all: '标签全卖（红/橙）', tag_red: '标签只卖红', tag_half: '标签卖一半+红清'
  };

  function upSlPanel(V) {
    var v = V.struct_sl || V.base;
    var mx = v.sl_mix || {};
    var tot = 0, sl = 0, atr = 0;
    for (var k in mx) {
      tot += mx[k];
      if (k === 'atr' || k === 'atr_far') atr += mx[k]; else sl += mx[k];
    }
    var h = '<section class="ui-panel"><h2>① 结构位止损：ATR 退回兜底</h2>' +
      '<div class="note"><p>止损语义从「波动率」换成「结构失效」：现价站上日线中枢 → 止损=中枢上沿 ZG（跌回就不是 3买 了）；' +
      '中枢内运行 → 止损=最近笔低点（跌破即笔破坏）。ATR 只在结构不足时兜底。</p></div>' +
      '<div class="ab-kpis">' +
      '<div class="ab-kpi"><span>中枢 ZG 定损</span><b>' + (mx.pivot_zg || 0) + ' 只</b><small>站上中枢的 3买结构</small></div>' +
      '<div class="ab-kpi"><span>笔低点定损</span><b>' + (mx.bi_low || 0) + ' 只</b><small>中枢内，笔破坏位</small></div>' +
      '<div class="ab-kpi"><span>退回 ATR</span><b class="' + (atr ? 'bad' : 'flat') + '">' + atr + ' 只</b>' +
      '<small>' + (mx.atr_far ? mx.atr_far + ' 只结构位过远' : '结构位都可用') + '</small></div>' +
      '<div class="ab-kpi"><span>结构覆盖</span><b>' + (tot ? Math.round(sl / tot * 100) : 0) + '%</b>' +
      '<small>当前 ' + tot + ' 只持仓</small></div></div>';
    var ex = v.sl_examples || [];
    if (ex.length) {
      h += '<div class="rows mt12"><div class="row up-row row--head"><span>名称</span>' +
        '<span class="num">现价</span><span class="num">结构止损</span><span class="num h-hide">ATR 止损</span>' +
        '<span class="num">距止损</span><span class="h-hide">依据</span></div>';
      for (var i = 0; i < ex.length; i++) {
        var r = ex[i];
        var d = r.px > 0 && r.sl > 0 ? (r.px / r.sl - 1) * 100 : null;
        h += '<div class="row up-row"><span class="row__nm"><b>' + esc(r.name || r.code) + '</b>' +
          '<span class="row__code">' + esc(r.code) + '</span></span>' +
          '<span class="num">' + n(r.px) + '</span>' +
          '<span class="num">' + n(r.sl) + '</span>' +
          '<span class="num h-hide flat">' + n(r.atr) + '</span>' +
          '<span class="num ' + (d != null && d < 3 ? 'bad' : 'flat') + '">' +
          (d == null ? '—' : (d >= 0 ? '+' : '') + n(d) + '%') + '</span>' +
          '<span class="h-hide muted">' + esc(r.kind === 'pivot_zg' ? '中枢 ZG' : '笔低点') + '</span></div>';
      }
      h += '</div>';
    }
    h += '<p class="ab-note">结构位由 <b>chanlun_bi</b>（项目既有笔/中枢算法）在<b>建仓前一交易日</b>截断计算，' +
      '不含建仓日 K 线，无前视。止损只提示不执行，所以净值与 ATR 口径完全一致。</p></section>';
    return h;
  }

  function upRiskPanel(V) {
    var tags = ['base', 'risk', 'risk_2pct'];
    var h = '<section class="ui-panel"><h2>② 风险预算：在负期望上等于加大赌注</h2>' +
      '<div class="note"><p>公式 <code>仓位 = 净值×1% ÷ max(2ATR/px, 4%)</code> 的隐含前提是策略有正期望——' +

      '<div class="rows"><div class="row up-row--wide row--head"><span>口径</span>' +
      '<span class="num">净值</span><span class="num">敞口归一</span><span class="num">仓位</span><span class="num">笔数</span></div>';
    for (var i = 0; i < tags.length; i++) {
      var c = V[tags[i]]; if (!c) continue;

      h += '<div class="row up-row--wide"><span class="row__nm"><b>' + esc(UP_LABEL[tags[i]]) + '</b></span>' +
        '<span class="num ' + (t.total_return >= 0 ? 'up' : 'dn') + '">' + n(t.total_return * 100) + '%</span>' +

    for (var i = 0; i < tags.length; i++) {

      h += '<div class="row up-row"><span class="row__nm"><b>' + esc(UP_LABEL[tags[i]]) + '</b>' +

        '%、持有从 ' + n(V.base.stats.avg_hold) + ' 日缩到 ' + n(V.tag_all.stats.avg_hold) + ' 日——' +
        '<b>腾出来的钱又投进了同样为负期望的新仓</b>。出场规则是正贡献，但它救不了入场。</p>';
    }
    h += '</section>';
    return h;
  }

  function upSkipPanel(UV) {
    var sk = UV.skip;

    var h = '<section class="ui-panel"><h2>④ 被挡信号按日拆开</h2>' +
      '<div class="ab-kpis">' +
      '<div class="ab-kpi"><span>被持仓上限挡掉</span><b>' + sk.n_block + ' 个</b><small>占信号总数的大头</small></div>' +
      '<div class="ab-kpi"><span>发生在</span><b>' + sk.n_days_with_block + ' 天</b><small>共 ' + sk.n_days_total + ' 个交易日</small></div>' +
      '<div class="ab-kpi"><span>满仓无空位</span><b class="bad">' + sk.zero_room_days + ' 天</b><small>room=0，只看不买</small></div>' +

          '<em>' + r.days + ' 天 / ' + r.blocks + ' 个</em></div>';
      }
      h += '</div>';
    }
    var bt = sk.by_type || {};
    var keys = Object.keys(bt).sort(function (a, b) { return bt[b] - bt[a]; });
    h += '<p class="ab-note">按类型：' + keys.map(function (k) {
      return '<b>' + esc(k) + '</b> ' + bt[k] + ' 个';
    }).join(' · ') + '。' +
      '<b>被挡最多的不是 3买 而是 1买</b>——3买 信号数不如 1买，但 lag 更短、排序更靠前，' +

        '<span class="h-hide">已有持仓</span></div>';

  function openDrawer(code) {
    var r = null;
    if (D) for (var i = 0; i < D.rows.length; i++) if (D.rows[i].code === code) r = D.rows[i];
    if (!r && B) {
      var all = (B.positions || []).concat(B.sell_hints || []);
      for (var j = 0; j < all.length; j++) if (all[j].code === code) r = all[j];
    }
    // 历史成交里的票可能既不在池子、也不在当前持仓 → 到台账明细里找最近一笔
    if (!r && T) {
      var best = null;
      for (var k2 = 0; k2 < T.rows.length; k2++) {
        var tr = T.rows[k2];
        if (tr.code === code && (!best || tr.exit > best.exit)) best = tr;
      }
      r = best;
    }
    if (!r) return;
    closeDrawer();
    var dlg = document.createElement('dialog');
    dlg.className = 'ui-drawer';
    dlg.id = 'dlg';
    dlg.setAttribute('aria-label', r.name + ' 详情');
    dlg.innerHTML = drawer(r);
    document.body.appendChild(dlg);
    dlg.showModal();
    var cl = dlg.querySelectorAll('[data-close]');
    for (var k = 0; k < cl.length; k++) cl[k].addEventListener('click', closeDrawer);
    dlg.addEventListener('cancel', function (ev) { ev.preventDefault(); closeDrawer(); });
    renderTrades(code);
    if (!T) loadTrades().then(function () { renderTrades(code); });
  }

  function closeDrawer() {
    var d = $('dlg');
    if (!d) return;
    try { if (d.open) d.close(); } catch (e) { /* 已关闭 */ }
    if (d.parentNode) d.parentNode.removeChild(d);
  }

    Promise.all([
      fetch('/observe_board.json', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('/trade_book.json', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('/hf_book.json', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('/hf_ab.json', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('/hf_variants.json', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('/hf_phase3.json', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('/hf_phase4.json', { cache: 'no-store' }).then(function (r) { return r.json(); })
      ,fetch('/hf_phase5.json', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('/hf_phase6.json', { cache: 'no-store' }).then(function (r) { return r.json(); }),
      fetch('/hf_matrix.json', { cache: 'no-store' }).then(function (r) { return r.json(); })
    ]).then(function (res) {
      D = res[0]; B = res[1]; H = res[2]; AB = res[3]; UV = res[4]; P3 = res[5];
      P4D = res[6];
      P5D = res[7];
      P6D = res[8];
      MX6 = res[9];
      if (MX6 && MX6.code_reuse) {
        $('nv-p6').textContent = MX6.code_reuse.n_reused + '/' + MX6.code_reuse.n_total;
      }
      $('nv-pool').textContent = (D.n || 0) + ' 只';
      $('nv-book').textContent = ((B.positions || []).length) + ' 笔';
      if (H) $('nv-hf').textContent = (H.positions || []).length + ' 笔';
      if (P4D && P4D.c && P4D.c.agg && P4D.c.agg['停3买']) {
        $('nv-p4').textContent = n(P4D.c.agg['停3买'].avg_excess * 100) + '%';
      }
      if (P5D && P5D.d && P5D.d.rows && P5D.d.rows.length) {
        var best5 = null;
        for (var i5 = 0; i5 < P5D.d.rows.length; i5++) {
          var x5 = P5D.d.rows[i5];
          if (x5.cost !== 'k10') continue;
          if (!best5 || (x5.nav || -9) > (best5.nav || -9)) best5 = x5;
        }
        if (best5) $('nv-p5').textContent = 'hold' + best5.hold + ' ' + n((best5.nav || 0) * 100) + '%';
      }
      if (P3 && P3.short && P3.short.s1) {
        $('nv-p3').textContent = '+' + n(P3.short.s1.total) + '%';
      }
      if (AB && AB.combos && AB.combos.b1) {
        $('nv-ab').textContent = n(AB.combos.b1.stats.total_return * 100) + '%';
      }
      if (UV && UV.variants && UV.variants.struct_sl) {
        var mx = UV.variants.struct_sl.sl_mix || {};
        var tot = 0, structN = 0;
        for (var kk in mx) { tot += mx[kk]; if (kk !== 'atr') structN += mx[kk]; }
        $('nv-up').textContent = structN + '/' + tot + ' 结构位';
      }
      render();
    }).catch(function (err) {
      app.innerHTML = '<div class="ui-panel"><div class="ui-error">' +
        '<b>数据没加载出来</b><p>' + esc(err && err.message) + '</p>' +
        '<p class="muted">先跑 <span class="mono">python tools/research/observe_board.py</span> 与 ' +
        '<span class="mono">python tools/research/trade_book.py</span> 生成 JSON，再刷新。</p>' +
        '<button class="ui-btn" type="button" id="retry">重试</button></div></div>';
      app.setAttribute('aria-busy', 'false');
      var rt = $('retry');
      if (rt) rt.addEventListener('click', load);
    });
  }

  document.addEventListener('click', onAppClick);
  document.addEventListener('input', onInput);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeDrawer();
  });
  var rl = $('reload');
  if (rl) rl.addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
