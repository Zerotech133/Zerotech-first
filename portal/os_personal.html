<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老田的个人 OS · 驾驶舱</title><link rel="icon" href="data:,"><style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color:#19344b;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;height:100dvh;overflow:hidden}.shell{height:100dvh;min-height:0;display:grid;grid-template-rows:58px 42px minmax(0,1fr) 30px;max-width:1700px;margin:auto;padding:0 16px}.top,.rail,.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.top{border-bottom:1px solid #dce5ee}.top h1{font-size:19px;margin:0}.muted,.top small{font-size:11px;color:#647a90}.chips{display:flex;gap:7px}.chip{border:1px solid #dce6f1;border-radius:16px;padding:5px 9px;background:#fff;font-size:11px}.rail strong{font-size:13px;flex:none}.rail span{font-size:11px;color:#805a28;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.main{display:grid;grid-template-columns:1.04fr 1.34fr 1.04fr;grid-template-rows:1fr 1fr;gap:10px;min-height:0}.box{background:#fff;border:1px solid #dce5ee;border-radius:12px;padding:12px;min-height:0;overflow:hidden;display:flex;flex-direction:column}.box h2{font-size:14px;margin:0 0 7px;display:flex;justify-content:space-between;align-items:center}.box h2 span{font-size:10px;font-weight:400;color:#75899b}.list,.domains{overflow:auto;min-height:0;scrollbar-width:thin}.line{width:100%;border:0;border-top:1px solid #edf1f5;background:transparent;padding:8px 2px;text-align:left;display:flex;gap:9px;align-items:flex-start;color:inherit;cursor:pointer}.line:first-child{border-top:0}.line:hover,.domain:hover{background:#f1f7fc}.line b{display:block;font-size:12px;line-height:1.4}.line small{display:block;font-size:10px;color:#6a8092;line-height:1.45;margin-top:3px}.dot{width:8px;height:8px;border-radius:50%;margin-top:4px;flex:none;background:#8299aa}.dot.bad{background:#bd5252}.dot.warn{background:#c28e35}.dot.info{background:#3f84b1}.tag{font-size:10px;border-radius:4px;padding:2px 5px;background:#e9f1fa;color:#2b668d;white-space:nowrap;margin-left:auto}.tag.unknown{background:#f1f1f1;color:#687782}.domains{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.domain{border:1px solid #e3ebf2;background:#fcfdff;border-radius:8px;padding:9px;cursor:pointer;text-align:left}.domain b{font-size:12px;display:block}.domain small{font-size:10px;color:#698095}.bottom{font-size:10px;color:#718497;overflow:hidden;white-space:nowrap}.overlay{position:fixed;inset:0;background:rgba(15,33,50,.27);display:none;justify-content:flex-end;z-index:20}.overlay.open{display:flex}.drawer{width:min(540px,100%);height:100%;background:#fff;padding:22px;overflow:auto;box-shadow:-8px 0 30px #1b3d5720}.drawer h2{font-size:19px;margin:4px 0 13px}.drawer h3{font-size:13px;margin:18px 0 7px}.drawer p{font-size:12px;line-height:1.8;color:#4f6578}.stage{padding:10px;border:1px solid #e3ebf2;border-radius:8px;background:#f8fafc;font-size:12px;line-height:1.7;overflow-wrap:anywhere}.close{float:right;border:1px solid #cbd9e5;border-radius:7px;background:#fff;padding:6px 12px;cursor:pointer}.warnbar{border-left:3px solid #bf8c32;padding:8px 10px;background:#fcf6e9;font-size:12px}.action{padding:8px 10px;background:#f1f4f7;color:#5a6b7a;border-radius:7px;font-size:11px;margin-top:16px}.link{color:#246c9c;text-decoration:none;font-size:12px}.link:hover{text-decoration:underline}button:focus-visible,a:focus-visible{outline:2px solid #2773a7}@media(max-width:950px){.main{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,minmax(0,1fr))}.shell{grid-template-rows:52px 38px minmax(0,1fr) 25px}.top small{display:none}}@media(max-width:650px){.shell{padding:0 7px}.main{gap:5px}.box{padding:7px}.box h2{font-size:11px}.box h2 span{display:none}.line{padding:5px 1px}.line b,.domain b{font-size:10px}.line small,.domain small{display:none}.domains{gap:3px}.domain{padding:5px}.top h1{font-size:15px}.rail span{font-size:10px}}
</style><script src="/static/nav.js" defer></script><meta name=wb-shell content=adopted></head><body><div class="shell"><header class="top"><div><h1>老田的个人 OS <small>· 全域驾驶舱（只读试运行）</small></h1><small>时间、合作、交付、研发与异常，优先展示需要关注的事</small></div><div class="chips"><span class="chip" id="source-state">数据读取中</span><span class="chip" id="clock">--:--</span></div></header><div class="rail"><strong>此刻应关注</strong><span id="focus">正在检查已有来源；未接入的个人日历不代表今天没有安排</span></div><main class="main"><section class="box"><h2>今日与未来七天 <span>出行 · 会见 · 节点</span></h2><div class="list" id="schedule"></div></section><section class="box"><h2>需要你介入 <span>确认 ≠ 通知 ≠ 执行</span></h2><div class="list" id="decisions"></div></section><section class="box"><h2>通知与异常 <span>按证据可信度分层</span></h2><div class="list" id="notices"></div></section><section class="box"><h2>商务与交付 <span>合作 · 文稿 · PPT</span></h2><div class="list" id="business"></div></section><section class="box"><h2>开发进度 <span>不以提交数证明交付</span></h2><div class="list" id="projects"></div></section><section class="box"><h2>领域下钻 <span>本页只读 · 不发起动作</span></h2><div class="domains" id="domains"></div></section></main><footer class="bottom"><span>单屏固定；卡片下钻事实、时间与下一步，区域内部按需滚动</span><span id="refresh-time">来源尚未核验</span></footer></div><div class="overlay" id="overlay" aria-hidden="true"><div class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><button class="close" id="close">关闭 ×</button><div class="muted" id="crumb"></div><h2 id="drawer-title"></h2><div id="drawer-body"></div></div></div><script>
'use strict';
const ZONES=['schedule','decisions','notices','business','projects'];
const SAFE_LINKS={'/dev':1,'/legion':1,'/learn':1,'/creator':1,'/quant':1,'/intel':1,'/os-entry':1,'/os-board':1};
const $=id=>document.getElementById(id);
function item(zone,title,summary,status,source,detail,next,level='info',href=null){return{zone,title,summary,status,source,detail,next,level,href};}
function placeholder(zone,title,detail){return item(zone,title,'待接入 · 不能据此判断今天无事','unknown','尚无可信的实时个人源',detail,'接入经过授权且具备更新时间、事项 ID 的来源；先只读。','neutral');}
function initial(){return[
 placeholder('schedule','个人日历和交通行程待接入','已有 biz.json 历史行程，但没有完整的个人日历、车票/航班和提醒回执。'),
 placeholder('decisions','跨项目待确认队列待接入','静态拍板文档与 Git 变更不能自动变成需要老田确认的实时工单。'),
 placeholder('notices','跨渠道通知收件箱待接入','通知发送、送达、已读和事项关闭是不同事实。'),
 placeholder('business','商务合作机会账待接入','会议纪要已有历史条目；合作阶段、对方承诺和下一次跟进没有统一账本。'),
 placeholder('projects','开发阻塞证据待接入','现有计数与计划不可替代里程碑验收、依赖风险和待确认工单。')];}
function isoDay(value){const s=String(value||'');if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return null;const d=new Date(s+'T00:00:00Z');return !Number.isNaN(d.getTime())&&d.toISOString().slice(0,10)===s?s:null;}
function personalDay(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function futureWithin(day,today,n){if(!isoDay(day))return false;const delta=(Date.parse(day+'T00:00:00Z')-Date.parse(today+'T00:00:00Z'))/86400000;return delta>=0&&delta<=n;}
async function getJSON(path,timeout=7000){const c=new AbortController(),timer=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(path,{cache:'no-store',signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(timer);}}
function fromOS(data,today){if(!data||typeof data!=='object'||!data.biz||!data.coding)throw Error('OS schema');const out=[];const biz=data.biz,notes=Array.isArray(biz.notes)?biz.notes:[];
 const near=Array.isArray(biz.near)?biz.near:[];const current=near.filter(x=>x&&futureWithin(x.date,today,7));
 if(current.length){for(const x of current.slice(0,4)){const date=isoDay(x.date);out.push(item('schedule',(x.where?'出行 / ':'会见 / ')+(x.topic||'待确认事项'),date+' · '+(x.where||x.who||'地点待核'), 'ledger-unverified','/api/os → portal/data/biz.json；来源更新时间需另核', '旧台账列有未来日期，尚未与个人日历、交通凭证或对方确认记录交叉核对。','核对地点、交通缓冲、联系人和当日提醒；不在本页变更台账。','warn'));}}
 else if(Array.isArray(biz.near))out.push(item('schedule','biz.json 七天内无列出的行程','这仅说明本地台账未列，不代表个人日历没有安排','source-incomplete','/api/os biz.near；个人日历未接入','旧台账最后更新与目前日期可能不一致。','接入授权日历与交通回执后再给出“今日无安排”的结论。','neutral'));
 if(notes.length){for(const d of notes.filter(x=>x&&typeof x==='object').slice(0,4)){out.push(item('business',String(d.type||'文稿')+' · '+String(d.title||'未命名'),String(d.status||'状态待核')+' · 台账更新 '+String(d.updated||'未知'), 'historical','/api/os biz.notes → portal/data/notes.json','在研只表示旧台账状态，不能证明当前仍在编辑或临近交付。','下钻原文档、版本、审阅人、交稿时间与发出回执（均待接）。','info','/creator'));}}
 else if(Array.isArray(biz.notes))out.push(item('business','台账无在研文稿条目','不代表真实文稿和 PPT 工作为空','source-incomplete','/api/os biz.notes','旧台账的覆盖范围与更新时间未核。','接入文稿版本、审阅和交付回执。','neutral'));
 const coding=data.coding;out.push(item('projects','研发活动投影：提交记录',coding.last_commit?'最近提交 '+String(coding.last_commit):'提交时间未核实','activity-only','/api/os coding → Git reflog','提交是工程活动证据，不能表明里程碑完成、质量通过或无需确认。','需要项目任务/测试/验收三证合一，再判定阻塞；下钻开发域。','info','/dev'));
 return out;}
function fromHome(data,today){if(!data||!data.calendar||!Array.isArray(data.calendar.items))throw Error('home calendar schema');const out=[];const cal=data.calendar,list=cal.items;const upcoming=list.filter(x=>x&&futureWithin(x.day,today,7));
 if(upcoming.length){for(const x of upcoming.slice(0,3))out.push(item('schedule',String(x.what||'项目节点'),String(x.day||'日期待核')+' · 项目时点','project-timeline','/api/home calendar；非个人日历','这是系统项目节点，不是已确认的私人出行或会议。','核对源记录和截止时间后再决定是否提醒。','info'));}
 else out.push(item('schedule','项目时点没有未来七天条目','不代表会议/出行为空；历史节点不冒充未来节点','source-incomplete','/api/home calendar；今日 '+today,'项目时点与个人日历并非同一来源。','接入个人日历，并对过期节点做归档或复核。','neutral'));
 return out;}
function fromAlerts(data){const sh=data&&data.source_health||{},sources=sh.sources&&typeof sh.sources==='object'&&!Array.isArray(sh.sources)?sh.sources:{};const bad=Object.entries(sources).filter(([,v])=>!v||v.status!=='ok'&&v.status!=='empty');if(!Object.keys(sources).length)return [placeholder('notices','告警逐源状态缺失','源健康接口未返回逐源可证结果。')];if(!bad.length)return[item('notices','逐源探针未报告异常','仅代表该探针覆盖的源在其检查时点合格','limited-ok','/api/alerts source_health','不能由此推出全域个人 OS 健康。','下钻逐源生产者回执，确认覆盖范围。','info','/intel')];const out=bad.slice(0,3).map(([name,v])=>item('notices','数据源待核：'+name,String(v&&v.status||'unknown')+' · '+String(v&&v.reason||'无原因'),'unverified','/api/alerts source_health；源完成时点 '+String(v&&v.as_of||'未证实'),'该源缺可信生产者完成证明或已过期；接口可达不能直接亮绿。','下钻源 → 批次 → 产物 → 原证据；此页不触发重跑。','warn','/intel'));if(bad.length>3)out.push(item('notices','另有 '+(bad.length-3)+' 个数据源待核','本屏只显示前三项；其余不可视为健康','truncated','/api/alerts source_health','逐源异常列表已截断。','到原始逐源状态核对全部异常。','warn','/intel'));return out;}
function render(items,health){for(const zone of ZONES){const root=$(zone);root.replaceChildren();const list=items.filter(x=>x.zone===zone);for(const it of list){const b=document.createElement('button');b.type='button';b.className='line';const dot=document.createElement('span');dot.className='dot '+(it.level||'neutral');const mid=document.createElement('span'),title=document.createElement('b'),sub=document.createElement('small');title.textContent=it.title;sub.textContent=it.summary;mid.append(title,sub);const tag=document.createElement('span');tag.className='tag '+(it.status==='unknown'?'unknown':'');tag.textContent='详情 ›';b.append(dot,mid,tag);b.addEventListener('click',()=>openDetail(it));root.appendChild(b);}}
 $('source-state').textContent='读面：'+health.join(' / ');$('refresh-time').textContent='观察时点 '+new Date().toLocaleTimeString('zh-CN',{hour12:false})+' · 非生产者完成时点';}
function addStage(root,title,value){const h=document.createElement('h3'),box=document.createElement('div');h.textContent=title;box.className='stage';box.textContent=value;root.append(h,box);}
const overlay=$('overlay');let returnFocus=null;function openDetail(it){returnFocus=document.activeElement;$('crumb').textContent='个人 OS › '+it.zone+' › 证据';$('drawer-title').textContent=it.title;const body=$('drawer-body');body.replaceChildren();const state=document.createElement('div');state.className='warnbar';state.textContent='状态 '+it.status;body.appendChild(state);addStage(body,'为何关注',it.detail);addStage(body,'来源与时点',it.source);addStage(body,'下一级 / 建议动作',it.next);const caution=document.createElement('div');caution.className='action';caution.textContent='只读页面：不确认、不派单、不重跑、不发消息，不将诸葛亮建议当批准。';body.appendChild(caution);if(it.href&&SAFE_LINKS[it.href]){const a=document.createElement('a');a.href=it.href;a.target='_blank';a.rel='noopener noreferrer';a.className='link';a.textContent='打开现有领域页 →';body.appendChild(a);}overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');$('close').focus();}
function closeDetail(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');if(returnFocus&&returnFocus.isConnected)returnFocus.focus();returnFocus=null;} $('close').addEventListener('click',closeDetail);overlay.addEventListener('click',e=>{if(e.target===overlay)closeDetail();});window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();});
const domains=[['我的时间','schedule','/os-entry'],['商务合作','business','/os-entry'],['内容材料','business','/creator'],['研发军团','projects','/dev'],['情报量化','notices','/intel'],['学习成长','projects','/learn']];for(const [label,zone,href] of domains){const b=document.createElement('button');b.type='button';b.className='domain';const name=document.createElement('b'),tip=document.createElement('small');name.textContent=label;tip.textContent='点开来源与下钻';b.append(name,tip);b.addEventListener('click',()=>openDetail(item(zone,label,'', 'domain','已有门户领域入口；源状态依各项证据','领域入口仅提供进一步查看；不是全域健康结论。','可从详情前往既有领域页。','info',href)));$('domains').appendChild(b);}
/* G2 标注：待 L2 修 301（nginx auto-redirect 丢 8734 端口）；切勿改成带尾斜杠，会 401/404。下方 requests 里的 /api/os 为裸调用，保持原样不改 URL。 */
let sequence=0;async function refresh(){const run=++sequence,today=personalDay(),base=initial(),status=[];const requests=[['OS','/api/os',x=>fromOS(x,today)],['项目时点','/api/home',x=>fromHome(x,today)],['逐源健康','/api/alerts',fromAlerts]];const results=await Promise.allSettled(requests.map(x=>getJSON(x[1])));if(run!==sequence)return;for(let i=0;i<results.length;i++){const r=results[i],q=requests[i];if(r.status==='fulfilled'){try{const v=q[2](r.value);base.push(...v);status.push(q[0]+'已读取');}catch(err){status.push(q[0]+'解析失败');base.push(item(i===2?'notices':i===1?'schedule':'projects',q[0]+'结构无法解析','接口已返回，但字段不符合本页预期','parse-failed',q[1],String(err.message||err),'核对生产者结构与字段映射，不把空数据判成健康。','bad'));}}else{status.push(q[0]+'不可用');base.push(item(i===2?'notices':i===1?'schedule':'projects',q[0]+'读取失败','来源不可用，保留未知态','fetch-failed',q[1],String(r.reason&&r.reason.message||r.reason),'排查连接和服务状态；本页不重跑。','bad'));}}base.push(item('decisions','诸葛亮可辅助复核','建议/反向质询 ≠ 本人授权','not-authorized','角色约定；尚未接入全域审批身份链','诸葛亮可以提出复核意见，不能代替老田签准或触发生产/资金操作。','待定义委托范围、身份、有效期、撤销与责任，未获批准前只读。','info','/legion'));base.push(item('decisions','动作鉴权边界待整改','旧 GET 动作与独立服务动作不接本页','blocked','portal/portal_api.py、api_bridge.py、api_model_admin.py','认证和终态回执不闭合时，禁止在个人驾驶舱直挂执行按钮。','先修请求鉴权，再建设授权→执行→回执→复验闭环。','warn'));render(base,status);$('focus').textContent=status.some(s=>s.includes('不可用')||s.includes('失败'))?'部分读面不可用；请点击对应事项定位，勿据空白判断无事':'优先查看待确认事项与逐源缺口；旧台账与系统时点不等于今日日历。';}
function clock(){$('clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false,hour:'2-digit',minute:'2-digit'});}clock();setInterval(clock,60000);render(initial(),['尚未读取']);refresh();setInterval(refresh,60000);
</script>
