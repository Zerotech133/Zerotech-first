<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>零界指挥部 · /hq</title>
<link rel="stylesheet" href="/static/tokens.css">
<script src="/static/nav.js" defer></script>
<style>
body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg,#0f1216);color:var(--text,#e8eaf0);font-size:14px}
.wrap{max-width:1180px;margin:0 auto;padding:14px 14px 60px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
.head h1{font-size:21px;margin:0}
.head small{color:var(--text-dim,#8a93a6);font-size:12px}
.badge{display:inline-block;border:1px solid var(--border,#2a3242);border-radius:6px;padding:1px 8px;font-size:11px;color:var(--text-dim,#8a93a6)}
.badge.warn{color:#e8b45a;border-color:rgba(232,180,90,.4)}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.card{background:var(--card,#1a1f27);border:1px solid var(--border,#2a3242);border-radius:9px;padding:9px 11px}
.card .k{font-size:11.5px;color:var(--text-dim,#8a93a6)}
.card .v{font-size:21px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px;border-bottom:1px solid var(--border,#2a3242);padding-bottom:8px}
.tab{background:var(--card2,#202735);border:1px solid var(--border,#2a3242);border-radius:7px;color:var(--text,#e8eaf0);padding:6px 13px;font-size:13px;cursor:pointer}
.tab.on{border-color:#4f8ef7;color:#9cc4ff}
.panel{display:none}.panel.on{display:block}
table{width:100%;border-collapse:collapse;background:var(--card,#1a1f27);border:1px solid var(--border,#2a3242);border-radius:9px;overflow:hidden;margin:8px 0}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--border,#2a3242);font-size:12.5px;vertical-align:top}
th{color:var(--text-dim,#8a93a6);font-weight:600;font-size:11.5px;background:var(--card2,#202735)}
tr:last-child td{border-bottom:none}.mono{font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--text-dim,#8a93a6);word-break:break-all}
.risk{background:rgba(232,105,113,.07);border:1px solid rgba(232,105,113,.35);border-radius:8px;padding:9px 11px;margin:8px 0;font-size:12.5px;color:#e86971}
.ok{background:rgba(93,211,158,.07);border:1px solid rgba(93,211,158,.3);border-radius:8px;padding:9px 11px;margin:8px 0;font-size:12.5px;color:#5dd39e}
.meta{color:var(--text-dim,#8a93a6);font-size:11.5px;margin:6px 2px}
.empty{padding:24px;text-align:center;color:var(--text-dim,#8a93a6)}
.err{background:rgba(232,105,113,.08);border:1px solid rgba(232,105,113,.4);border-radius:9px;padding:10px 12px;margin:10px 0;font-size:12.5px;color:#e86971}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>零界指挥部</h1>
    <small>组织 · 任务 · 审批 · 预算 · 心跳｜只读</small>
    <span class="badge">/hq 静态快照</span>
    <span class="badge warn">实时 API 待 W3</span>
  </div>
  <div class="meta" id="meta">加载中…</div>

  <div class="cards" id="cards"></div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-tab="roles">五角色</button>
    <button class="tab" data-tab="agenda">议程</button>
    <button class="tab" data-tab="org">组织</button>
    <button class="tab" data-tab="tasks">任务</button>
    <button class="tab" data-tab="approvals">审批</button>
    <button class="tab" data-tab="commercial">商业</button>
    <button class="tab" data-tab="budget">预算</button>
    <button class="tab" data-tab="heartbeat">心跳</button>
  </div>

  <div class="panel on" id="p-roles"></div>
  <div class="panel" id="p-agenda"></div>
  <div class="panel" id="p-org"></div>
  <div class="panel" id="p-tasks"></div>
  <div class="panel" id="p-approvals"></div>
  <div class="panel" id="p-commercial"></div>
  <div class="panel" id="p-budget"></div>
  <div class="panel" id="p-heartbeat"></div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function card(k,v){return `<div class="card"><div class="k">${esc(k)}</div><div class="v">${esc(v)}</div></div>`}
function table(headers,rows){return `<table><thead><tr>${headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="'+headers.length+'" class="empty">无数据</td></tr>'}</tbody></table>`}
async function main(){
  let d=null;
  try{
    const live=await fetch('/api/hq/snapshot',{cache:'no-store'});
    if(!live.ok) throw new Error('HTTP '+live.status);
    const p=await live.json();
    if(!(p && p.ok && p.data)) throw new Error('bad payload');
    d=p.data;
  }catch(e){
    document.getElementById('meta').innerHTML=`<div class="err">数据加载失败：${esc(e.message)}（需登录；未登录返回 401）</div>`;
    return;
  }
  document.getElementById('meta').textContent=`数据源：实时 /api/hq/snapshot · 生成：${d.generated_at||'-'} · ${d.read_only?'只读':'?'}`;
  const o=d.org?.summary||{},t=d.tasks?.summary||{},a=d.approvals?.summary||{},b=d.budget||{},bh=d.heartbeat?.summary||{},ro=d.roles||{},ag=d.agenda||{},cm=d.commercial||{};
  document.getElementById('cards').innerHTML=[
    card('五角色',(ro.summary||{}).roles||0),card('议程待办',(ag.summary||{}).pending_orders||0),card('任务 WIP',t.wip||0),card('审批已决',a.total_decisions||0),card('商业租户',(cm.summary||{}).tenants||0)
  ].join('');
  document.getElementById('p-roles').innerHTML=table(['角色','席位','职责','模型','会议','派单'],(ro.roles||[]).map(x=>[x.name+'（'+x.role+'）',x.seat_id,x.duty,x.model||'-',x.meetings,x.orders])) + `<div class="meta">${esc(ro.note||'五角色只读：意见/会议/派单，不执行、不签字')}</div>`;
  const ags=ag.summary||{};
  document.getElementById('p-agenda').innerHTML=`<div class="meta">议题按类型：${esc(JSON.stringify(ags.by_kind||{}))} · 会议 ${esc((ag.meetings||{}).total||0)} · 闭环率 ${esc((ag.meetings||{}).closure_rate??'-')}</div>` + table(['类型','议题','owner','状态','来源'],(ag.items||[]).slice().reverse().slice(0,40).map(x=>[x.kind,x.item,x.owner||'-',x.status,x.source]));
  const cs=cm.summary||{};
  document.getElementById('p-commercial').innerHTML=table(['指标','值'],[['租户',cs.tenants],['活跃',cs.active],['套餐分布',JSON.stringify(cs.by_plan||{})],['试用',cs.trials],['试用转付费',cs.trial_to_paid],['待回访',cs.followups],['公众号草稿',(cs.content||{}).gzh_drafts],['策略订阅',(cs.content||{}).strategy_subscriptions]]) + table(['套餐','价格/月','报告/月','API/日'],(cm.plans||[]).map(x=>[x.name||x.plan,x.price_month,x.reports_month,x.api_day])) + `<div class="meta">${esc(cm.note||'')}</div>`;
  document.getElementById('p-org').innerHTML=table(['部门','名称','Lead','席位'],(d.org.departments||[]).map(x=>[x.dept,x.name,x.lead||'-',x.n])) + `<div class="meta">无 HR：${(d.org.gaps||{}).no_hr_profile}｜无 team 投影：${(d.org.gaps||{}).no_team_projection}</div>`;
  const bd=d.tasks.board||{};
  document.getElementById('p-tasks').innerHTML=table(['任务','状态','owner','年龄(天)','描述'],[...(bd.doing||[]),...(bd.review||[])].map(x=>[x.id,x.status,x.owner||'-',x.age_days??'-',x.desc]));
  document.getElementById('p-approvals').innerHTML=(d.approvals.risks||[]).map(x=>`<div class="risk">${esc(x)}</div>`).join('') + table(['时间','类型','目标','决策','决策人'],(d.approvals.latest||[]).map(x=>[x.decided_at||x.created_at,x.target_type,x.target_id,x.decision,x.decided_by]));
  document.getElementById('p-budget').innerHTML=table(['域','calls','in_tok','out_tok'],Object.entries(d.budget.by_domain||{}).map(([k,v])=>[k,v.calls,v.in_tok,v.out_tok])) + (d.budget.risks||[]).map(x=>`<div class="risk">${esc(x)}</div>`).join('');
  document.getElementById('p-heartbeat').innerHTML=table(['agent','count','due','reasons'],(d.heartbeat.coalesced_wakes||[]).map(x=>[x.agent,x.count,x.due||'-',(x.reasons||[]).join(',')])) + (d.heartbeat.schedules.failed_last_result||[]).slice(0,5).map(x=>`<div class="risk">${esc(x.id)} · ${esc(x.agent)} · ${esc(x.result)}</div>`).join('');
  document.querySelectorAll('.tab').forEach(btn=>btn.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b===btn));
    document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+btn.dataset.tab));
  }));
}
main();
</script>
</body>
</html>
