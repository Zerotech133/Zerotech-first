er-radius:var(--r-s);padding:8px 12px;margin-top:15px}.empty{border:1px dashed var(--border);color:var(--gray-6);border-radius:var(--r-m);padding:14px;font-size:12px;line-height:1.8}.foot{border-top:1px solid var(--line);color:var(--muted);font-size:11px;margin-top:30px;padding-top:15px;line-height:1.8}@media(max-width:800px){.home-grid{grid-template-columns:1fr}.stack{grid-template-columns:1fr 1fr}.domain-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.main{padding:18px 16px 40px}.home-grid,.stack,.domain-grid,.item-grid,.detail{grid-template-columns:1fr}.category-head{align-items:flex-start}.count{margin-top:30px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

const view=document.querySelector('#view'),crumb=document.querySelector('#crumb');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let evidenceItems=[],selectedEvidence=0,requestId=0;
function evidenceError(error){if(error&&typeof error==='object'){const parts=[error.code,error.message].filter(v=>typeof v==='string'||typeof v==='number').map(String).filter(Boolean);return parts.join('：')||'服务不可用'}return typeof error==='string'&&error?error:'服务不可用'}
function evidenceDetail(){const row=evidenceItems[selectedEvidence],box=document.querySelector('#evidence-detail');if(!box)return;if(!row){box.innerHTML='<div class="empty">选择左侧证据查看原文、匹配依据与模型判断。</div>';return}const code=typeof row.code==='string'&&/^\d{6}\.(SH|SZ|BJ)$/.test(row.code)?row.code:'';const xqCode=code?code.slice(0,6):'';const value=v=>v===null||v===undefined||v===''?'未提供':safe(v);box.innerHTML=`<h2>${value(row.title)}</h2><div class="meta"><span>证据 ID / 来源指针</span><b>${value(row.evidence_id)} · ${value(row.source_ref)}</b></div><div class="meta"><span>来源 / 标的</span><b>${value(row.source)} · ${value(row.code)}</b></div><div class="meta"><span>发生时间 / 入库时间</span><b>${value(row.occurred_at)} / ${value(row.ingested_at)}</b></div><div class="meta"><span>确切关联依据（仅匹配，不是因果）</span><b>${value(row.match_basis)}</b></div><div class="meta"><span>原始证据内容</span><div class="raw">${value(row.content)}</div></div><div class="meta"><span>JEV 模型判断（未经人工核验）</span><b>${row.jev&&typeof row.jev==='object'?`方向 ${value(row.jev.bias)} · 置信度 ${value(row.jev.conf)}`:'无 JEV 判断'}</b></div><p class="evidence-warning">此处只呈现证据与标的的最小匹配关系；不证明因果，也不代表人工复核或授权。</p>${code?`<div class="evidence-links"><a href="/kg/stock/${encodeURIComponent(code)}">股票研判 →</a><a href="/api/xq/intel/ticker?code=${encodeURIComponent(xqCode)}&days=7">雪球同标的日报聚合（非逐帖原文） →</a><a href="/xq_intel.html">雪球日报页面 →</a></div>`:''}`;document.querySelectorAll('.evidence-row').forEach((el,i)=>el.setAttribute('aria-current',String(i===selectedEvidence)))}
function evidenceResults(data){const status=document.querySelector('#evidence-status'),list=document.querySelector('#evidence-list');if(!status||!list)return;const errors=[];if(data.error)errors.push(`后端错误：${safe(evidenceError(data.error))}（可能缺库或不可用）`);if(Number(data.bad_rows)>0)errors.push(`坏行 ${safe(data.bad_rows)} 条，已跳过`);if(Number(data.excluded_count)>0)errors.push(`未匹配或无精确代码 ${safe(data.excluded_count)} 条，未纳入列表（代码筛选也可能造成排除）`);evidenceItems=Array.isArray(data.items)?data.items.filter(x=>x&&typeof x==='object'):[];selectedEvidence=0;status.innerHTML=`${errors.length?`<div class="evidence-warning">${errors.join('；')}</div>`:''}<div class="summary">返回 ${safe(data.count??evidenceItems.length)} 条；当前展示 ${evidenceItems.length} 条。匹配结果未经过人工核验。</div>`;list.innerHTML=evidenceItems.length?evidenceItems.map((r,i)=>`<button type="button" class="evidence-row" data-evidence="${i}" aria-current="${i===0}"><strong>${safe(r.title||'无标题')}</strong><small>${safe(r.code||'未关联代码')} · ${safe(r.source||'来源未提供')} · ${safe(r.occurred_at||'时间未提供')}</small></button>`).join(''):'<div class="empty">没有可展示的证据—标的关系。可调整代码、日期范围或条数重试；缺库与后端错误见上方提示。</div>';evidenceDetail()}
async function loadEvidence(){const form=document.querySelector('#evidence-form');if(!form)return;const code=form.elements.code.value.trim().toUpperCase(),days=Number(form.elements.days.value),limit=Number(form.elements.limit.value),status=document.querySelector('#evidence-status');requestId++;if(code&&!/^\d{6}\.(SH|SZ|BJ)$/.test(code)){status.textContent='代码须为 6 位数字加 .SH / .SZ / .BJ，或留空查看全部。';return}if(!Number.isInteger(days)||days<1||days>30||!Number.isInteger(limit)||limit<1||limit>100){status.textContent='天数限 1–30，条数限 1–100。';return}const id=requestId,params=new URLSearchParams({days:String(days),limit:String(limit)});if(code)params.set('code',code);status.textContent='正在读取证据—标的关系…';document.querySelector('#evidence-list').innerHTML='';document.querySelector('#evidence-detail').innerHTML='';try{const response=await fetch(`/api/intel/evidence-targets?${params}`);const data=await response.json();if(id!==requestId||!document.querySelector('#evidence-form'))return;if(!response.ok){status.textContent=`接口请求失败（HTTP ${response.status}）：${evidenceError(data?.error)}。请稍后重试。`;return}if(!data||!Array.isArray(data.items)){status.textContent='接口返回格式异常：缺少 items 列表。';return}evidenceResults(data)}catch(error){if(id===requestId&&document.querySelector('#evidence-form'))status.textContent='网络或接口读取失败，无法获取证据—标的关系。请检查服务后重试。'}}
function renderEvidence(){view.innerHTML=`<div class="eyebrow">01 / READ & JUDGE · EVIDENCE → TARGET</div><h1>证据—标的关系</h1><p class="lead">线索 → 原始证据与匹配依据 → 股票研判 / 多源观察 → 人工复核与授权。这里只做只读下钻，不自动确认因果或执行授权。</p><form class="workbench-controls" id="evidence-form"><label>股票代码（可选）<input name="code" placeholder="600000.SH" autocomplete="off" aria-label="股票代码"></label><label>最近天数<input name="days" type="number" min="1" max="30" value="7"></label><label>最多条数<input name="limit" type="number" min="1" max="100" value="50"></label><button type="submit" class="primary">查询关系</button></form><div id="evidence-status" role="status"></div><div class="evidence-layout"><section class="panel"><h2>匹配证据</h2><div id="evidence-list" class="evidence-list"></div></section><section class="panel evidence-detail" id="evidence-detail" aria-label="证据详情"></section></div><div class="evidence-links" style="margin-top:12px"><a href="/intel/stream">旧新闻证据流 →</a><a href="/xq_intel.html">雪球日报（聚合阅读） →</a><a href="/approvals">审批登记（只读，非授权） →</a></div>`;loadEvidence()}

function statusClass(s){return /规划|隔离/.test(s)?'plan':/独立|CLI|运维/.test(s)?'split':''}
function button(target,label,cl=''){return `<button type="button" class="${cl}" data-go="${target}">${safe(label)}</button>`}
function render(){const [id,index]=location.hash.slice(1).split('/');if(id==='evidence-targets'){crumb.innerHTML=`<a href="/portal">门户</a>　/　${button('home','情报工作台')}　/　${button('evidence','情报流与研判')}　/　<span>证据—标的关系</span>`;document.title='证据—标的关系 · 情报工作台｜零界';renderEvidence();window.scrollTo(0,0);return}requestId++;const group=groups.find(g=>g.id===id);const item=group&&/^\d+$/.test(index||'')?group.items[Number(index)]:null;crumb.innerHTML=`<a href="/portal">门户</a>　/　${group?button('home','情报工作台'):'<span>情报工作台</span>'}${group?`　/　${item?button(group.id,group.name):`<span>${safe(group.name)}</span>`}`:''}${item?`　/　<span>${safe(item.name)}</span>`:''}`;
if(!group){view.innerHTML=`<div class="eyebrow">INTELLIGENCE / WORKBENCH</div><h1>情报，从线索到证据。</h1><p class="lead">从线索进入，先回查证据与标的匹配，再观察股票与多源信息；人工复核、授权另行完成。</p><div class="flow"><span>线索</span><b>→</b><span>证据—标的最小关系</span><b>→</b><span>股票研判 / 多源观察</span><b>→</b><span class="gate">人工复核 / 授权（非本页自动完成）</span></div><div class="section-title">当前工作主线</div><div class="home-grid"><article class="spotlight"><span class="micro">START HERE / EVIDENCE FIRST</span><h2>先回查证据，再研判标的。</h2><p>查看证据原文、关联依据和时间；JEV 仅为模型判断。雪球同标的内容是日报聚合，不是逐帖原文。</p>${button('evidence-targets','查看证据—标的关系 →','primary')}</article><div class="stack"><button type="button" class="quick" data-go="events"><small>02 / EVENTS</small><strong>事件与路径</strong><span>浏览关系、原文与路径边界</span></button><button type="button" class="quick" data-go="graph"><small>03 / GRAPH</small><strong>知识图谱</strong><span>探索实体与来源关系</span></button></div></div><div class="section-title">六个工作台 · 点击进入</div><div class="domain-grid">${groups.map(g=>`<button class="tile" type="button" data-go="${g.id}"><small>${g.number} / ${g.tag}</small><strong>${safe(g.name)}</strong><p>${safe(g.intro)}</p><em>进入 ${g.items.length} 个功能 →</em></button>`).join('')}</div><div class="section-title">边界</div><div class="empty">这是功能入口，不显示虚构实时计数或健康状态。独立服务、隔离工作树、只读接口及规划能力均在详情中说明。</div>`}
else if(!item){view.innerHTML=`<div class="category-head"><div><div class="eyebrow">${safe(group.number)} / ${safe(group.tag)}</div><h1>${safe(group.name)}</h1></div><div class="count">${group.items.length} 个功能</div></div><p class="lead">${safe(group.intro)}</p><div class="summary">选择一个功能，查看用途、既有位置与实现边界。</div><div class="item-grid">${group.items.map((x,i)=>`<button type="button" class="item" data-go="${group.id}/${i}"><div class="item-top"><strong>${safe(x.name)}</strong><span class="badge ${statusClass(x.status)}">${safe(x.status)}</span></div><p>${safe(x.desc)}</p><span class="arrow">查看功能详情 →</span></button>`).join('')}</div>`}
else{view.innerHTML=`<div class="eyebrow">${safe(group.number)} / ${safe(group.tag)} · FUNCTION DETAIL</div><h1>${safe(item.name)}</h1><p class="lead">${safe(item.desc)}</p><div class="detail"><section class="panel"><h2>这里负责什么</h2><p>${safe(item.desc)}</p><div class="meta"><span>所属工作台</span><b>${safe(group.name)}</b></div><div class="meta"><span>实现口径</span><b><span class="badge ${statusClass(item.status)}">${safe(item.status)}</span></b></div><div class="meta"><span>相关位置</span><b><span class="route">${safe(item.route)}</span></b></div>${item.link?`<p><a href="${item.link}">打开现有页面 →</a></p>`:'<p>此项仅供说明，无可点击页面入口。</p>'}</section><aside class="panel"><h2>使用边界</h2><p class="note">${safe(item.boundary)}</p><div class="empty">页面入口不等于实时状态、事实核验或人工授权；请回查对应产线证据。</div>${button(group.id,'← 返回功能列表','back')}</aside></div>`}
document.title=`${item?item.name+' · ':group?group.name+' · ':''}情报工作台｜零界`;window.scrollTo(0,0)}
function go(target){if(location.hash.slice(1)===target)render();else location.hash=target}document.addEventListener('click',e=>{const b=e.target.closest('button[data-go]');if(b)go(b.dataset.go);const row=e.target.closest('button[data-evidence]');if(row){selectedEvidence=Number(row.dataset.evidence);evidenceDetail()}});document.addEventListener('submit',e=>{if(e.target.id==='evidence-form'){e.preventDefault();loadEvidence()}});addEventListener('hashchange',render);render();
</script>
