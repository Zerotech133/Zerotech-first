<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>司马徽推荐池 · 全池复盘 · 零界</title>
<link rel="stylesheet" href="/static/tokens.css">
<link rel="icon" href="data:,">
<style>
body{margin:0;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--gray-0);color:var(--gray-7);font-size:14px}
.wrap{max-width:1280px;margin:0 auto;padding:14px 14px 60px}
.head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.head h1{font-size:20px;margin:0}
.head small{color:var(--gray-5);font-size:12px}
.badge{display:inline-block;border:1px solid var(--gray-4);border-radius:6px;padding:1px 7px;font-size:11px;color:var(--gray-6)}
.badge.warn{color:var(--color-warn);border-color:var(--ylw-500)}
.badge.ok{color:var(--color-ok);border-color:var(--grn-600)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.btn{background:var(--gray-2);border:1px solid var(--gray-4);border-radius:7px;color:var(--gray-7);padding:5px 12px;font-size:12.5px;cursor:pointer}
.btn:hover{border-color:var(--blu-500)}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.card{background:var(--gray-2);border:1px solid var(--gray-4);border-radius:9px;padding:9px 11px}
.card .k{font-size:11.5px;color:var(--gray-5)}
.card .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.card .t{font-size:10.5px;color:var(--gray-5);margin-top:2px}
.sect{margin:16px 0 6px;font-size:14.5px;font-weight:700}
.sect small{font-weight:400;color:var(--gray-5);font-size:11.5px;margin-left:8px}
table{width:100%;border-collapse:collapse;background:var(--gray-2);border:1px solid var(--gray-4);border-radius:9px;overflow:hidden}
th,td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--gray-4);font-size:12.5px;vertical-align:top}
th{color:var(--gray-5);font-weight:600;font-size:11.5px;white-space:nowrap;background:var(--gray-3)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(88,166,255,.05)}
tr.main{cursor:pointer}
tr.detail{display:none;background:var(--gray-1)}
tr.detail td{padding:10px 12px;font-size:12px;color:var(--gray-6);line-height:1.7}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:11px;color:var(--gray-5);word-break:break-all}
.num{font-variant-numeric:tabular-nums}
.empty{padding:26px;text-align:center;color:var(--gray-5);font-size:13px}
.meta{color:var(--gray-5);font-size:11.5px;margin:6px 2px}
.note{color:var(--gray-5);font-size:11.5px;margin:10px 2px;line-height:1.8}
.err{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.4);border-radius:9px;padding:10px 12px;margin:10px 0;font-size:12.5px;color:var(--red-500)}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,1fr)}.wrap{padding:10px}}
</style>
<script src="/static/nav.js" defer></script>
<script src="/static/shortscreen.js" defer></script>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>司马徽推荐池 · 全池复盘</h1>
    <span class="badge warn">研究推荐 / 不接实盘</span>
    <small>ACAD1 选池 · 每日逐票 T1/T2/N1/F1 + D1 裁决</small>
  </div>
  <div class="tools">
    <button class="btn" id="btn-refresh">刷新</button>
    <span class="meta" id="gen-at"></span>
    <span class="meta" id="status"></span>
    <a class="btn" href="/quant_paper.html" style="text-decoration:none">paper 组合页</a>
  </div>
  <div id="err"></div>
  <div class="cards" id="cards"></div>
  <div class="meta" id="data-meta"></div>

  <div class="sect">池内逐票 <small>点击行展开多角度明细；数据日过期会标 stale</small></div>
  <table><thead><tr><th>代码</th><th>名称</th><th>tier</th><th>来源</th><th>D1裁决</th><th>置信</th><th>价格</th><th>动作</th></tr></thead>
  <tbody id="rows"><tr><td colspan="8" class="empty">加载中…</td></tr></tbody></table>
  <div class="note">本页只读：推荐池由 ACAD1（司马徽）按健康策略生成；池内全部逐票复盘，D1 通过≠下单。</div>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pct(x){return x==null?'—':(Number(x)*100).toFixed(1)+'%';}
function num(x,d){return x==null?'—':Number(x).toLocaleString('zh-CN',{maximumFractionDigits:d==null?2:d});}
function card(k,v,t){return '<div class="card"><div class="k">'+esc(k)+'</div><div class="v">'+v+'</div><div class="t">'+esc(t||'')+'</div></div>';}
function actionBadge(a){const m={buy:'ok',watch:'warn',avoid:'err',pending_analysis:''};return '<span class="badge '+(m[a]||'')+'">'+esc(a)+'</span>';}
function detailHtml(r){
  const ana=r.analyses||{}; const labels={T1:'T1 多头技术',T2:'T2 空头/风险',N1:'N1 情绪',F1:'F1 基本面'};
  let h='';
  for(const k of ['T1','T2','N1','F1']){ if(ana[k]) h+='<div><b>'+labels[k]+'：</b>'+esc(String(ana[k]).slice(0,420))+'</div>'; }
  if(!h) h='<div>暂无多角色明细（可能尚未分析）</div>';
  h+='<div class="mono">sources='+esc((r.sources||[]).join('+'))+' · data_date='+esc(r.data_date||'—')+' · risk='+esc((r.risk_flags||[]).join(','))+'</div>';
  return h;
}
async function load(){
  const err=document.getElementById('err'); err.innerHTML='';
  try{
    const r=await fetch('/api/acad1/pool',{cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const d=await r.json(); if(!d.ok) throw new Error(d.error||'bad payload');
    document.getElementById('gen-at').textContent='更新：'+(d.generated_at||'—');
    const s=d.summary||{}, plan=d.plan||{}, act=s.by_action||{};
    document.getElementById('status').innerHTML=
      '<span class="badge '+(d.stale?'warn':'ok')+'">'+(d.stale?'stale '+d.freshness_days+'d':'fresh')+'</span> '+
      '<span class="badge">池 '+s.pool_total+' / 已复盘 '+s.reviewed+' / 待 '+s.pending+'</span>';
    document.getElementById('cards').innerHTML=
      card('池内',num(s.pool_total,0),'ACAD1 推荐池')+
      card('已复盘',num(s.reviewed,0),'T1/T2/N1/F1+D1')+
      card('WATCH / BUY',num(act.watch,0)+' / '+num(act.buy,0),'今日动作')+
      card('组合入选',num(plan.selected,0),'BUY 才入选');
    document.getElementById('data-meta').textContent='池 owner='+(d.owner||'ACAD1')+'｜数据日 '+(d.data_date||'—')+
      '｜新鲜度 '+(d.freshness_days==null?'—':d.freshness_days+' 天')+'｜池ID '+(d.pool_id||'—');
    const items=d.items||[];
    const rows=document.getElementById('rows');
    rows.innerHTML=items.length?items.map(function(r){
      const main='<tr class="main" data-code="'+esc(r.code)+'" onclick="toggle(this)">'+
        '<td><b>'+esc(r.code)+'</b></td><td>'+esc(r.name||'—')+'</td><td>'+esc(r.tier||'—')+'</td>'+
        '<td>'+esc((r.sources||[]).join('+'))+'</td><td>'+esc(r.recommendation||'—')+'</td>'+
        '<td class="num">'+num(r.confidence,2)+'</td><td class="num">'+num(r.price,2)+'</td>'+
        '<td>'+actionBadge(r.action)+'</td></tr>';
      const detail='<tr class="detail" id="d-'+esc(r.code)+'"><td colspan="8">'+detailHtml(r)+'</td></tr>';
      return main+detail;
    }).join(''):'<tr><td colspan="8" class="empty">池为空</td></tr>';
  }catch(e){
    err.innerHTML='<div class="err">加载失败：'+esc(e.message||e)+'</div>';
  }
}
function toggle(tr){
  const code=tr.getAttribute('data-code'); const d=document.getElementById('d-'+code);
  if(d) d.style.display = d.style.display==='table-row' ? 'none' : 'table-row';
}
document.getElementById('btn-refresh').addEventListener('click',load);
load(); setInterval(load,60000);
</script>
</body>
</html>
