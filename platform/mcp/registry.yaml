# 零界私有 MCP Registry v1（W3 前置）
# 只登记元数据，不分发密钥；实际配置仍以 ~/.hermes/config.yaml 为准。
schema: zerobound/mcp-registry/v1
version: 1.0.0
generated_at: "2026-11-03"
owner: ARCH1
source: "~/.hermes/config.yaml"
policy:
  transport_allow: [stdio, streamable_http, sse]
  secret_handling: "env/secret-ref only; no plaintext in this file"
  access: "Hermes 8787 内部；经 8734 单点登录后可用"
servers:
  - id: stock-data
    transport: stdio
    command: "C:/Program Files/Python311/python.exe"
    args: ["C:/项目/zerobound-kg/stock_data_mcp.py"]
    owner: DATA1
    status: active
    capabilities: [stock_data, warehouse_catalog, table_detail]
  - id: stock-intel-readonly
    transport: stdio
    command: "C:/Program Files/Python311/python.exe"
    args: ["C:/项目/zerobound-kg/stock_data_mcp.py", "--intel-readonly"]
    owner: INTEL0
    status: active
    capabilities: [latest_intel, sources_recon]
  - id: jev-news
    transport: stdio
    command: "C:/Program Files/Python311/python.exe"
    args: ["C:/aios/tools/jev_mcp.py"]
    owner: INTEL0
    status: active
    capabilities: [news, jev]
  - id: playwright
    transport: stdio
    command: "C:/aios/Hermes/node_tools/bin/node.exe"
    args: ["C:/aios/Hermes/node_tools/playwright-mcp/node_modules/@playwright/mcp/cli.js", "--browser", "chromium"]
    owner: ARCH1
    status: active
    capabilities: [browser, e2e, screenshot]
  - id: om-metadata
    transport: stdio
    command: "C:/Program Files/Python311/python.exe"
    args: ["C:/aios/Hermes/node_tools/om_mcp_bridge.py"]
    owner: DATA1
    status: active
