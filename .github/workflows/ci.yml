name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -e '.[dev]'
      - name: Ruff 静态检查（阻塞）
        run: ruff check src tests
      - name: Pytest + 覆盖率（阻塞）
        run: pytest -q --cov=zhice_os_v2 --cov-report=term-missing
      - name: Mypy 类型检查（非阻塞，遗留错误逐步收敛）
        continue-on-error: true
        run: mypy src

  frontend-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: Vitest 单测（阻塞）
        run: npm test
      - name: 构建产物（阻塞）
        run: npm run build
