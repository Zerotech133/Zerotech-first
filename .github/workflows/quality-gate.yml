name: quality-gate

# 质量闸 CI 上移草稿（P0-1）
# 原则：100% 复用 tools/test_gate.ps1 现有参数面（-Suite fast 含 budget --strict/nav/route/artifact），
#       不复制逻辑、不碰任何在改文件；Windows runner 因 ps1 依赖必选。
# 触发：push 到主干（活树高频提交，每笔必拦）+ PR。
# 2026-11-08 修正：远端默认分支是 main（origin/main），本机工作分支是 master，
# 原文本只写了 [master]，而主干在 GitHub 上是 main —— 那样推上去根本不会触发，
# 且 workflow_dispatch 要求 workflow 存在于默认分支。故两个名字都收。

on:
  push:
    # 2026-11-12（P0-1 补完）：main/master 是同 SHA 镜像，双推会创建两个 run；
    # 二者同属 quality-gate-${{ github.sha }} 组，master 的空跑（job 全 skipped）
    # 仍会按 cancel-in-progress 取消 main 的实跑（实测 run 43189137796 被
    # 43189148228 取消，status=cancelled），导致闸根本跑不完。
    # 收敛到默认分支 main：每笔提交只创建一个 run。同一笔提交双推时 main 必触发，
    # 严格性零放宽、无漏检；PR / 手动 / 定时不受影响。
    branches: [main]
  pull_request:
    branches: [main, master]
  # 2026-11-08：下面状态块写着"合入后手动触发一次"，但原文本没配 workflow_dispatch，
  # 想手动验证只能空 commit（会污染历史）。补上触发器。
  workflow_dispatch:
  # 2026-11-08：nightly-full 名为"夜间"，原条件却是 push —— 每推一次就跑一次
  # 90 分钟整仓 pytest（本仓两天 235 个提交的节奏）。而本 workflow 的 concurrency
  # 是 cancel-in-progress，下一次 push 会把它直接掐掉，等于每次都跑不完还占机时。
  # 改为真正的定时 + 手动，push 只跑 fast 闸。
  schedule:
    - cron: '30 18 * * *'    # UTC 18:30 = 北京时间 02:30

permissions:
  contents: read

concurrency:
  # 2026-11-12（P0-1 通知洪水修复）：ls-remote 实证 main 与 master 指向同一 SHA
  # （84eae94，同一笔提交双推）。按 github.ref 分组会让这两个 run 各跑满约 8 分钟、
  # 各发一条 failure 通知，且因分属不同组互不取消 —— 每笔提交被放大成两次红。
  # 改为按提交 SHA 分组：同一 commit 的重复触发互为同组，后触发者取消前者，
  # 只跑一次、只留一条结论。PR / 手动 / 定时仍各自独立。
  group: quality-gate-${{ github.sha }}
  cancel-in-progress: true

jobs:
  fast-gate:
    # 2026-11-12（P0-1）：master 是 main 的镜像分支（同一 commit 双推）。
    # push 触发器已收敛到 [main]，此 if 作为第二道保险：万一有其它 push 事件落到
    # master，job 直接 skipped，不再产生 failure 通知。因 main 上同一 SHA 已跑过
    # 完全相同的闸，严格性零放宽、无漏检。
    # PR / schedule / workflow_dispatch 不受影响，仍照常执行。
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: windows-latest
    # 本地实测 11:28（688s）。runner 磁盘慢、首次还要装依赖，按 2.5x 留余量；
    # timeout 触发会以红报出，掩盖真正的失败原因，故给到 45 分钟。
    timeout-minutes: 45
    # 2026-11-08：CI 环境 profile。干净 runner 没有本机运行时资产（reports/ 未入库、
    # .worktrees/、_vault、PG catalog、行情湖 parquet、docker/schtasks），一批用例
    # 在云端必然红。这些**不许**写进 test_baseline.json（会连带放宽本机判定=假绿），
    # 改由 tools/test_baseline.ci.json 在 profile=ci 时叠加；本机不设该变量，
    # 判定与今天完全一致。
    env:
      TEST_GATE_PROFILE: ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # nav/route 基线对比需要历史

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # 与本地质量闸同版本（P3-5 实测口径）

      # 2026-11-08：原工作流没有任何依赖安装步骤 —— 干净 runner 上 quant 套件
      # 会因 import pandas 直接崩，闸红的原因会是"没装包"而不是"代码坏了"。
      # 清单来源：_audit_20261108/scan_gate_imports.py（扫 309 个受控文件的
      # 一级 import，扣掉标准库与本仓自有模块后剩 8 个第三方发行版）。
      # 运行时依赖按各线 venv 管理、未集中声明，故此处为**首轮基线**：
      # 首次 dispatch 若仍报缺包，按日志补这里，不要改测试去绕过。
      - name: Install gate dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install numpy pandas pyyaml jsonschema pyjwt cryptography lark-oapi
          # 2026-11-08 首轮实跑补齐（run 42442700503）：datawarehouse 套件
          # test_dataset_query.py 顶部 `import pyarrow`，缺包导致整个 datawarehouse
          # 目录 rc=2 收集失败（日志：pytest 异常退出 rc=2）；requests 为
          # xq_crawl_trust_env 等用例所需；python-docx 供 learning_intake 类用例
          # （仅 tools 全量触发，fast 不跑，但缺包同样会收集失败）。
          python -m pip install pyarrow requests python-docx

      - name: Preflight（不假绿）
        shell: pwsh
        run: |
          # fail-fast：闸脚本缺失直接红，不静默跳过（对齐 test_gate.ps1 的 fail-closed 判例）
          if (-not (Test-Path tools/test_gate.ps1)) { Write-Host "::error::tools/test_gate.ps1 missing"; exit 1 }
          if (-not (Test-Path tools/check_portal_split.py)) { Write-Host "::error::budget tool missing"; exit 1 }
          python -X utf8 -c "import sys; print(sys.version)"

      - name: Quality gate（-Suite fast）
        shell: pwsh
        env:
          # 2026-11-08：日志落点必须与 upload-artifact 的 runner.temp 对齐（闸脚本默认写
          # $env:TEMP=C:\Users\RUNNER~1\...\Temp，upload-artifact 用的是 D:\a\_temp，
          # 不同目录 + if-no-files-found: ignore = artifact 恒空且不报错）。
          # 注意：runner 上下文**只在 step 级 env 可用**；放到 job 级 env 会让整份 workflow
          # 校验失败 → 0 job 直接 failure（实测 run #15 就是这样），千万别上移。
          TEST_GATE_LOG_DIR: ${{ runner.temp }}
        run: |
          # 与 devtask merge 内联闸完全同参：portal+kstock+ide+agent_key+quant_key+tools_key+datawarehouse
          # + budget --strict + nav --check + route inventory --check + artifact guard
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/test_gate.ps1 -Suite fast

      - name: Summary（每次留下机读台账）
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== gate done（rc=$LASTEXITCODE）==="

      # 2026-11-08：闸脚本把各套件明细写在 runner 的 %TEMP%\test_gate_*.log，
      # 只回显最后一行摘要，且 job 结束后随即销毁——云端红一次就只能靠摘要里
      # 前 20 条猜原因（datawarehouse 那次 43 项只看到 20 项）。上传后可直接下载
      # 全量明细，不用再靠"改代码—重推—等九分钟"试错。
      - name: Upload gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/test_gate_*.log
          if-no-files-found: ignore
          retention-days: 14

  # 可选第二档：夜间全仓（P3-5 口径），不阻塞合并；只在定时/手动时跑
  nightly-full:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full repo pytest（活树快照，红仅通报不阻断）
        shell: pwsh
        continue-on-error: true
        run: |
          python -X utf8 -m pytest -q 2>&1 | Tee-Object -FilePath C:\Temp\nightly_full.log
          Write-Host "::warning::夜间全仓为通报档（P3-5 基线对账用），红不阻断"

