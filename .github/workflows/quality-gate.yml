#    本机 push 走本地代理 127.0.0.1:7890（git config 已配），Actions 在云端跑不受影响。
# 2. 【激活前置已清空】xq 41 项已修复（2026-11-08，K-ORG-20261108-XQSEAM）。
#    38+2+1 的真因是 LLM 替身接缝断开：xq_classify 经 safe_urlopen 出网，loopback
#    走 _NO_PROXY_OPENER，绕开 urllib.request.urlopen，旧 monkeypatch 失效后测试
#    真调本机 qwen3.5:9b。修完 4 个文件全部转绿（47+2+2+22），并已**纳入**
#    quant_key 套件（21→25 文件），不是 deselect 也不是加白。
#    证据：_audit_20261108/（各文件 7~78s → 秒级；quant 全量 2474 passed）。
# 3. runner 时长：fast 约 4-5 分钟/笔（本地口径）；concurrency 已设 cancel-in-progress。
#    2026-11-08 本地实测三轮：8:41 / 11:57 / 11:28（第三轮 GATE PASS，13 套件 New 全 0）。
#    注意 runner 比本机慢，且云端首次还要装依赖，30 分钟 timeout 留足。
# 4. 首次生效验证：workflow_dispatch 手动触发一次，核对 fast 各套件在 windows
#    runner 上全部起跑（重点是 portal 套件的 sys.path/conftest 兼容性）。
# 5. 【依赖基线未在云端验证】本 workflow 的 Install 步骤清单是扫仓得出的首轮
#    基线（309 个受控文件的第三方一级 import，8 个包）。运行时依赖按各线 venv
#    管理、未集中声明，首次跑若报缺包，**按日志补这一步**，不得改测试绕过。
# 6. nightly-full 的 `pytest -q` 全仓跑曾稳定挂死（栈停在 os_goal_store._file_lock，
#    成因是 deadline 用 time.time()，被同目录测试冻结墙钟后永不超时）。
#    2026-11-08 已改 time.monotonic() 并加守卫用例，重跑实测无 Timeout。
# 7. 2026-11-12（K-CI-20261112-DUP 通知洪水修复）：ls-remote 实证 main/master 指向
#    同一 SHA（84eae94，同一笔提交双推），双分支各触发一次 quality-gate 且按 ref
#    分组互不取消，每笔提交产生两条 failure；叠加自愈任务每 7~16 分钟一次提交，
#    形成「提交→红→再修→再提交」自激振荡。修复两处（均在上方）：
#      · concurrency.group: github.ref → github.sha（同一 commit 只跑一次）
#      · fast-gate 增加 job 级 if：push 到 master 的 run 不再重复跑闸
#    main 上同一 SHA 已跑过完全相同的闸，严格性零放宽、无漏检；PR/手动/定时不受影响。
# 8. Node.js 20 deprecated annotation（checkout@v4 / setup-python@v5 / upload-artifact@v4
#    被强制跑在 Node 24）是 warning，相关 step 全部 success，与 gate 失败无关。
#    升级需跨 v4→v7 并核对 breaking changes，列为 P2 单独回归，勿与本次修复捆绑。
