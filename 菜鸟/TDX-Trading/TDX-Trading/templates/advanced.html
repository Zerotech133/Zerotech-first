<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>通达信 · 多模型实时监控系统</title>
<style>
:root{
  --bg:#0d1117;
  --panel:#0f141c;
  --card:#161b22;
  --card2:#1c2229;
  --line:#30363d;
  --line2:#3d444d;
  --text:#e6edf3;
  --text2:#c9d1d9;
  --muted:#8b949e;
  --muted2:#6e7681;
  --cyan:#58a6ff;
  --cyan-d:#1f6feb;
  --cyan-glow:rgba(88,166,255,.13);
  --orange:#d29922;
  --orange-glow:rgba(210,153,34,.13);
  --up:#f85149;
  --down:#3fb950;
  --buy:#f85149;
  --sell:#3fb950;
  --alert:#2d1416;
  --radius:10px;
  --shadow:0 4px 16px rgba(0,0,0,.35);
  --grad-cyan:linear-gradient(135deg,#1f6feb,#388bfd);
  --grad-orange:linear-gradient(135deg,#bb8009,#d29922);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{display:flex;background:var(--bg);color:var(--text);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
a{color:inherit;text-decoration:none}

/* ---------- 侧边栏 ---------- */
.sidebar{width:210px;min-width:210px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;padding:22px 14px;position:fixed;inset:0 auto 0 0;z-index:30}
.s-logo{display:flex;align-items:center;gap:10px;padding:0 10px 22px}
.s-logo .logo-mark{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;color:#fff;background:linear-gradient(135deg,var(--cyan),#388bfd);box-shadow:0 0 18px rgba(88,166,255,.35)}
.s-logo .logo-txt{font-weight:700;font-size:15px;letter-spacing:.5px}
.s-nav{flex:1;display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);
  font-size:13px;font-weight:600;transition:.15s;border-left:3px solid transparent}
.nav-item:hover{background:rgba(255,255,255,.03);color:var(--text2)}
.nav-item.active{background:rgba(88,166,255,.08);color:var(--cyan);border-left-color:var(--cyan)}
.nav-item .ic{width:18px;text-align:center;font-size:15px}
.s-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.s-clock{font-family:ui-monospace,Consolas,monospace;color:var(--text2);font-size:13px;margin-top:6px;letter-spacing:.5px}

/* ---------- 主内容 ---------- */
main{flex:1;margin-left:210px;min-width:0;padding:26px 28px 40px;min-height:100vh}
.page-header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px}
.page-title h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px}
.page-title p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.status-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:20px;
  background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.25);color:var(--cyan);
  font-size:12px;font-weight:700;letter-spacing:.3px}
.status-pill.off{background:rgba(148,163,184,.08);border-color:rgba(148,163,184,.2);color:var(--muted)}
.status-pill .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px rgba(88,166,255,.22);animation:pulse 1.8s infinite}
.status-pill.off .dot{background:var(--muted2);box-shadow:none;animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,166,255,.35)}70%{box-shadow:0 0 0 6px rgba(88,166,255,0)}100%{box-shadow:0 0 0 0 rgba(88,166,255,0)}}

/* ---------- 提示条 ---------- */
.notice{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:10px;margin-bottom:22px;font-size:13px}
.notice-warn{background:rgba(210,153,34,.1);border:1px solid rgba(210,153,34,.2);color:#fbbf24}
.notice-err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#fca5a5}
.notice .tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:5px;background:rgba(255,255,255,.08)}

/* ---------- KPI ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.kpi{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow);overflow:hidden}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--cyan)}
.kpi.k2::before{background:var(--orange)} .kpi.k3::before{background:var(--up)} .kpi.k4::before{background:var(--sell)}
.kpi .num{font-size:28px;font-weight:800;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.kpi .lab{margin-top:8px;font-size:12px;color:var(--muted);font-weight:600}
.kpi .sub{margin-top:3px;font-size:11px;color:var(--muted2)}

/* ---------- 分节标题 ---------- */
.section-title{display:flex;align-items:center;gap:10px;margin:28px 0 14px}
.section-title h2{margin:0;font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}
.section-title .bar{width:3px;height:16px;background:var(--cyan);border-radius:2px}
.section-title .line{flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}

/* ---------- 模型卡片 ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{position:relative;display:block;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px;box-shadow:var(--shadow);overflow:hidden;transition:.18s}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--buy)}
.card.sell::before{background:var(--sell)}
.card:hover{border-color:var(--line2);transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.55)}
.card-h{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.card-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  background:rgba(88,166,255,.1);color:var(--cyan);font-size:16px}
.card.sell .card-icon{background:rgba(210,153,34,.1);color:var(--sell)}
.card-title{flex:1;min-width:0}
.card-title .name{font-weight:700;font-size:15px;display:block}
.card-title .id{font-size:11px;color:var(--muted2);font-family:ui-monospace,Consolas,monospace}
.card-score{font-size:26px;font-weight:800;color:var(--cyan);font-variant-numeric:tabular-nums}
.card.sell .card-score{color:var(--sell)}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px;margin:14px 0}
.cmi .k{font-size:11px;color:var(--muted);letter-spacing:.4px;margin-bottom:3px}
.cmi .v{font-size:13px;font-weight:600;color:var(--text2);font-variant-numeric:tabular-nums}
.prog{display:flex;align-items:center;gap:10px;margin-top:4px}
.prog-track{flex:1;height:6px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
.prog-fill{height:100%;border-radius:3px;transition:width .3s ease}
.prog-txt{font-size:11px;color:var(--muted);font-weight:700;min-width:32px;text-align:right}
.card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line2);font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px;color:#fff;letter-spacing:.3px}
.badge.buy{background:rgba(88,166,255,.18);color:var(--cyan);border:1px solid rgba(88,166,255,.25)}
.badge.sell{background:rgba(210,153,34,.15);color:var(--orange);border:1px solid rgba(210,153,34,.25)}
.badge.run{background:rgba(88,166,255,.18);color:var(--cyan);border:1px solid rgba(88,166,255,.25)}
.badge.idle{background:rgba(148,163,184,.12);color:var(--muted);border:1px solid rgba(148,163,184,.2)}

/* ---------- 面板/表单 ---------- */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.panel-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.panel-head .ic{width:28px;height:28px;border-radius:8px;background:rgba(88,166,255,.1);color:var(--cyan);display:flex;align-items:center;justify-content:center;font-size:15px}
.panel-head h3{margin:0;font-size:15px;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
input,select{font:13px/1.4 inherit;padding:8px 11px;border:1px solid var(--line2);border-radius:9px;background:var(--card2);color:var(--text);outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--cyan);background:#161b22;box-shadow:0 0 0 3px rgba(88,166,255,.12)}
button{cursor:pointer;font:13px/1.4 inherit;font-weight:700;padding:8px 16px;border:1px solid var(--cyan);background:var(--cyan);color:#0b0d12;border-radius:9px;transition:.15s}
button:hover{background:var(--cyan-d);border-color:var(--cyan-d)}
button.ghost{background:transparent;color:var(--cyan)} button.ghost:hover{background:rgba(88,166,255,.08)}
button.danger{border-color:rgba(239,68,68,.5);background:transparent;color:var(--up)} button.danger:hover{background:rgba(239,68,68,.1)}
button.mini{padding:5px 12px;font-size:12px}
.list-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .meta{color:var(--muted);font-size:12px}
.list-row .grow{flex:1}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:4px 11px;border-radius:8px;border:1px solid var(--line2);background:var(--card2);color:var(--muted);cursor:pointer;transition:.15s;margin:3px 4px 3px 0}
.chip:hover{border-color:var(--cyan);color:var(--cyan)}
.chip.on{background:rgba(88,166,255,.15);color:var(--cyan);border-color:rgba(88,166,255,.35)}
.chips{display:flex;flex-wrap:wrap}
.empty{color:var(--muted2);padding:16px 4px;font-size:13px}

/* 编辑分组模态框 */
.modal-overlay{position:fixed;inset:0;background:rgba(10,15,25,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px}
.modal{background:var(--card);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4);animation:pop .18s ease}
@keyframes pop{from{transform:scale(.96);opacity:.5}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:16px;font-weight:700}
.modal-x{background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;padding:4px 8px;border-radius:8px}
.modal-x:hover{background:var(--card2);color:var(--txt)}
.modal-body{padding:18px 20px}
.modal-foot{display:flex;gap:10px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.edit-section{margin-bottom:18px}
.edit-section-title{font-weight:700;font-size:14px;margin-bottom:10px}
.chk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.chk-item{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--line2);border-radius:9px;background:var(--card2);cursor:pointer;font-size:13px;transition:.15s;user-select:none}
.chk-item:hover{border-color:var(--cyan)}
.chk-item input{accent-color:var(--cyan);width:15px;height:15px;cursor:pointer}
.chk-id{font-weight:700}
.chk-meta{color:var(--muted);font-size:11px;margin-left:auto}


/* ---------- 详情页 ---------- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--cyan);font-size:13px;font-weight:600;margin-bottom:14px}
.back:hover{color:#67e8f9}
.detail-h{display:flex;align-items:center;gap:12px;margin-bottom:4px}
.detail-h h1{margin:0;font-size:22px;font-weight:800}
.infobar{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;
  box-shadow:var(--shadow);margin:14px 0 22px}
.infobar .it{display:flex;flex-direction:column;gap:4px}
.infobar .it .k{font-size:11px;color:var(--muted);letter-spacing:.4px}
.infobar .it .v{font-size:14px;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums}
.infobar .it .v.mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;color:var(--text)}

/* ---------- 表格 ---------- */
.tbl-wrap{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--card2);color:var(--muted);font-weight:700;font-size:12px;letter-spacing:.4px;
  text-align:right;padding:13px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;position:sticky;top:0}
thead th.l{text-align:left}
tbody td{padding:13px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--text2)}
tbody td.l{text-align:left;color:var(--text)}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:rgba(255,255,255,.02)}
tbody tr.alert td{background:var(--alert)}
tbody tr.alert td:first-child{box-shadow:inset 3px 0 0 var(--up)}
.up{color:var(--up);font-weight:700} .down{color:var(--down);font-weight:700} .muted{color:var(--muted2)}
.err{color:var(--up);font-weight:600}
.alert-badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:#fff;background:var(--up);padding:3px 10px;border-radius:6px}
.normal{color:var(--muted2);font-size:12px}
.alerts{list-style:none;padding:0;margin:0}
.alerts li{padding:11px 4px;border-bottom:1px solid var(--line);font-size:13px;color:var(--text2)}
.alerts li:last-child{border-bottom:0}
.alerts .t{font-family:ui-monospace,Consolas,monospace;color:var(--muted);margin-right:8px}
.foot-note{margin-top:28px;text-align:center;color:var(--muted2);font-size:11px;letter-spacing:.5px}
.dt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:12px}
.dt-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;transition:.15s}
.dt-card:hover{border-color:var(--cyan);transform:translateY(-2px)}
.dt-card .dt-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dt-card .dt-name{font-size:14px;font-weight:600;color:var(--text2)}
.dt-card .dt-tbl{font-size:11px;color:var(--muted2);font-family:ui-monospace,Consolas,monospace}
.dt-card .dt-rows{font-size:24px;font-weight:700;color:var(--cyan);margin:6px 0 2px}
.dt-card .dt-latest{font-size:11px;color:var(--muted)}
.dt-card.empty .dt-rows{color:var(--muted2)}
.dt-card .dt-prog{margin-top:6px}
.dl-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:14px}
.dl-log{background:#08090d;border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-top:10px;max-height:200px;overflow-y:auto;font-family:ui-monospace,Consolas,monospace;font-size:11.5px;line-height:1.7;color:var(--muted)}
.dl-log .err{color:var(--orange)}.dl-log .ok{color:var(--cyan)}
.dl-bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin:8px 0}
.dl-bar-fill{height:100%;background:linear-gradient(90deg,var(--cyan),#1f6feb);transition:width .4s}
.tbl-browse{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px;margin-top:14px}
.tbl-browse table{width:100%;border-collapse:collapse;font-size:12px;font-family:ui-monospace,Consolas,monospace}
.tbl-browse th,.tbl-browse td{padding:6px 10px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap}
.tbl-browse th{color:var(--muted);font-weight:500;position:sticky;top:0;background:var(--card)}
.tbl-browse th:first-child,.tbl-browse td:first-child{text-align:left}
.tbl-browse tbody tr:hover{background:rgba(88,166,255,.05)}
.tbl-scroll{max-height:440px;overflow:auto;margin-top:10px;border:1px solid var(--border);border-radius:8px}
.pager{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}

/* ---------- 仪表盘专用样式 ---------- */
.dash-hero{background:linear-gradient(135deg,#0f141c 0%,#161b22 50%,#0d1117 100%);border:1px solid var(--line);border-radius:10px;padding:24px 28px;margin-bottom:20px;position:relative;overflow:hidden}
.dash-hero::after{content:"";position:absolute;right:-40px;top:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(88,166,255,.08) 0%,transparent 70%);pointer-events:none}
.dash-hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;flex-wrap:wrap}
.dash-hero h1{margin:0;font-size:24px;font-weight:800;letter-spacing:.3px}
.dash-hero .sub{margin:6px 0 0;font-size:13px;color:var(--muted)}
.dash-kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.dash-kpi{background:rgba(255,255,255,.025);border:1px solid var(--line);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;transition:.2s}
.dash-kpi:hover{border-color:var(--line2);background:rgba(255,255,255,.04)}
.dash-kpi .dk-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:17px;margin-bottom:10px}
.dash-kpi .dk-num{font-size:30px;font-weight:800;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.dash-kpi .dk-lab{margin-top:6px;font-size:12px;color:var(--muted);font-weight:600}
.dash-kpi .dk-sub{margin-top:2px;font-size:11px;color:var(--muted2)}
.dk-cyan .dk-icon{background:rgba(88,166,255,.12);color:var(--cyan)}
.dk-orange .dk-icon{background:rgba(210,153,34,.12);color:var(--orange)}
.dk-red .dk-icon{background:rgba(239,68,68,.12);color:var(--up)}
.dk-green .dk-icon{background:rgba(34,197,94,.12);color:var(--down)}
.dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.dash-panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.dash-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dash-panel-head h3{margin:0;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.dash-panel-head .dp-dot{width:8px;height:8px;border-radius:50%}
.dash-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.dash-metric{text-align:center;padding:10px 6px}
.dash-metric .dm-val{font-size:22px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.dash-metric .dm-val.warn{color:var(--orange)}
.dash-metric .dm-lab{font-size:11px;color:var(--muted);margin-top:4px}
.dash-collector-row{display:flex;gap:12px;flex-wrap:wrap}
.dash-collector{flex:1;min-width:160px;background:rgba(255,255,255,.02);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.dash-collector .dc-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.dash-collector .dc-name{font-size:13px;font-weight:600;color:var(--text2)}
.dash-collector .dc-line{font-size:11px;color:var(--muted);line-height:1.8}
.dash-collector .dc-line b{color:var(--text)}
.dash-clock-mini{font-family:ui-monospace,Consolas,monospace;font-size:12px;color:var(--cyan);font-weight:700}
@media(max-width:1100px){.dash-kpi-row{grid-template-columns:repeat(2,1fr)}.dash-grid{grid-template-columns:1fr}.dash-metrics{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}.sidebar{position:relative;width:100%;inset:auto}.main{margin-left:0}}
@media(max-width:600px){.kpis{grid-template-columns:1fr}.cards{grid-template-columns:1fr}.dash-kpi-row{grid-template-columns:1fr}body{flex-direction:column}.sidebar{display:none}}
</style></head>
<body>
<aside class="sidebar">
  <div class="s-logo"><div class="logo-mark">TDX</div><div class="logo-txt">监控系统</div></div>
  <nav class="s-nav">
    <a href="/" class="nav-item" data-page="dash"><span class="ic">◈</span> 仪表盘</a>
    <a href="/#models" class="nav-item" data-page="models"><span class="ic">⬡</span> 监控模型</a>
    <a href="/#stocks" class="nav-item" data-page="stocks"><span class="ic">⚹</span> 股票管理</a>

  </div>
</aside>
<main id="app">加载中…</main>
<script>
const REFRESH = __REFRESH__;
const $=s=>document.querySelector(s);
const fmt=v=>v==null?'—':v.toFixed(2);
const sideBadge=s=>s==='buy'?'<span class="badge buy">买</span>':'<span class="badge sell">卖</span>';
async function api(path,opts){const r=await fetch(path,opts);if(!r.ok)throw new Error(await r.text()||r.status);return r.json();}
function modelTypeLabel(t){return t==='drop'?'跌幅预警':t==='condition'?'卖出条件单':t==='buy_condition'?'买入条件单':'涨幅预警';}
// 判涨还是判跌只看 type；side 只表示触发后的交易语义（涨→卖出止盈 / 跌→买入抄底）
function isRise(mo){return mo&&mo.type!=='drop';}
function modelParamText(mo){return mo.param_text||(mo.threshold+'% / '+mo.window+'分');}
function isCond(mo){return mo&&(mo.type==='condition'||mo.type==='buy_condition');}
function updateClock(){$('#clock').textContent=new Date().toLocaleTimeString('zh-CN',{hour12:false});}
setInterval(updateClock,1000);updateClock();
function setSidebarActive(){
  const h=location.hash;
  document.querySelectorAll('.nav-item').forEach(el=>{
    const want=(h==='#models'&&el.dataset.page==='models')
      ||(h==='#stocks'&&el.dataset.page==='stocks')
      ||(h==='#data'&&el.dataset.page==='data')
      ||((h===''||h==='#dash'||h==='#')&&el.dataset.page==='dash');
    el.classList.toggle('active', want);
  });
}
setSidebarActive();
function setLive(connected,trading){
  const el=$('#live');
  if(!el)return;
  const txt=$('#live-txt');
  if(connected){el.classList.remove('off');if(txt)txt.textContent=trading?'实时交易中':'已连接 · 休市';}
  else{el.classList.add('off');if(txt)txt.textContent='未连接';}
}

function render(){
  const p=location.pathname, h=location.hash;
  clearInterval(window.__iv);
  setSidebarActive();
  if(p.startsWith('/model/')){renderDetail(p.slice(7));return;}
  if(h==='#models'){renderModels();}
  else if(h==='#stocks'){renderStocks();}
  else if(h==='#data'){renderData();}
  else{renderDashboard();}
}
window.addEventListener('hashchange', ()=>{ setSidebarActive(); render(); });

// ---------------- 仪表盘 ----------------
async function renderDashboard(){
  try{
    const [models,stocks,status]=await Promise.all([
      api('/api/models'),api('/api/stocks'),api('/api/status').catch(()=>null)]);
    buildDashboard(models,stocks,status);
    if(status)setLive(status.connected,status.trading);
  }catch(e){$('#app').innerHTML='<p class="err">加载失败: '+e.message+'</p>';}
}
function buildDashboard(models,stocks,status){
  models=models||[];stocks=stocks||[];
  const triggered=models.filter(m=>m.last_trigger).length;
  const running=models.filter(m=>m.status==='running').length;
  const buyStocks=stocks.filter(s=>s.side==='buy').length;
  const sellStocks=stocks.filter(s=>s.side==='sell').length;
  const now=new Date();
  const timeStr=now.toLocaleTimeString('zh-CN',{hour12:false});
  const dateStr=now.toLocaleDateString('zh-CN');
  let h='';

  // ---- Hero 顶部区域 ----
  h+='<div class="dash-hero">';
  h+='<div class="dash-hero-top">';
  h+='<div>';
  h+='<h1>多模型实时监控中心</h1>';
  h+='<p class="sub">通达信行情 · 涨速/跌幅双模型 · 实时轮询自动预��</p>';
  h+='</div>';
  h+='<div class="status-pill" id="live"><span class="dot"></span><span id="live-txt">连接中…</span></div>';
  h+='</div>';

  // ---- KPI 行 ----
  h+='<div class="dash-kpi-row">';
  h+=dashKpi('dk-cyan','◈','模型总数',models.length,'多策略并行监控');
  h+=dashKpi('dk-orange','⚹','监控股票',stocks.length,'买 '+(buyStocks||'0')+' · 卖 '+(sellStocks||'0'));
  h+=dashKpi('dk-red','⚡','已触发',triggered,'达到阈值并推送');
  h+=dashKpi('dk-green','◉',models.length?(running>0?'监控中':'待命'):'空',models.length?'运行 '+running+'/'+models.length:'请先添加股票');
  h+='</div>';
  h+='</div>';

  // ---- 提示条 ----
  h+=buildNotice(status);

  // ---- 系统状态双栏（分钟线 + 资讯采集） ----
  h+='<div class="dash-grid">';
  h+=buildDashRtMin(status);
  h+=buildDashStockInfo(status);
  h+='</div>';

  // ---- 监控模型卡片 ----
  h+='<div class="section-title"><span class="bar"></span><h2>监控模型</h2><span class="line"></span></div>';
  h+='<div class="cards">';
  if(!models.length)h+='<p class="empty">暂无模型，请在下方管理面板添加。</p>';
  models.forEach(mo=>{
    const tm=mo.top_mover;
    const score=tm?tm.val:(mo.status==='idle'?0:0);
    const scoreTxt=tm?score.toFixed(2):'—';
    const stCls=mo.status==='idle'?'badge idle':mo.status==='error'?'badge idle':'badge run';
    const stTxt=mo.status==='idle'?'空闲':mo.status==='error'?'异常':'运行中';
    h+='<a class="card '+(mo.side==='sell'?'sell':'')+'" href="/model/'+mo.id+'">'
      +'<div class="card-h">'
      +'<div class="card-icon">'+(isCond(mo)?'◎':isRise(mo)?'⬆':'⬇')+'</div>'
      +'<div class="card-title"><span class="name">'+mo.name+'</span><span class="id">'+mo.id+'</span></div>'
      +'<div class="card-score">'+scoreTxt+(tm?'<small style="font-size:12px;font-weight:600">%</small>':'')+'</div></div>'
      +'<div class="card-body">'
      +cmi('类型',modelTypeLabel(mo.type))
      +cmi(isCond(mo)?'触发方式':'阈值 / 窗口',modelParamText(mo))
      +cmi('核心指标',mo.metric_label)
      +cmi(isCond(mo)?'条件单股票':'订阅股票',mo.stock_count+' 只')
      +cmi('运行状态',stTxt,stCls)
      +cmi('最近触发',mo.last_trigger||'—')
      +'</div>'
      +(tm&&!isCond(mo)?progressBar(score,mo.threshold,isRise(mo)):'')
      +'<div class="card-foot"><span>'+(isCond(mo)?'监控中':isRise(mo)?'领涨标的':'领跌标的')+'</span>'
      +(isCond(mo)?'<b>'+mo.stock_count+' 只挂单</b>':(tm?'<b>'+tm.code+'</b>':'<span>—</span>'))+'</div>'
      +'</a>';
  });
  h+='</div>';
  $('#app').innerHTML=h;
}
function dashKpi(cls,icon,lab,num,sub){
  return '<div class="dash-kpi '+cls+'"><div class="dk-icon">'+icon+'</div>'
    +'<div class="dk-num">'+num+'</div>'
    +'<div class="dk-lab">'+lab+'</div>'
    +'<div class="dk-sub">'+sub+'</div></div>';
}
function buildDashRtMin(status){
  if(!status||!status.rt_min)return dashEmptyPanel('分钟线采集','暂无数据');
  const rt=status.rt_min;
  const active=rt.active;
  const dotColor=active?'var(--cyan)':'var(--muted2)';
  let h='<div class="dash-panel">';
  h+='<div class="dash-panel-head"><h3><span class="dp-dot" style="background:'+dotColor+';'+(active?'animation:pulse 1.5s infinite':'')+'"></span>分钟线采集</h3>';
  h+='<span class="badge '+(active?'run':'idle')+'">'+(active?'采集中':'待机')+'</span></div>';
  h+='<div class="dash-metrics">';
  h+=dashMetric(rt.last_collect_count||0,'上次采集(只)');
  h+=dashMetric(rt.total_minutes||0,'今日分钟数');
  h+=dashMetric(((rt.total_rows||0)/10000).toFixed(1)+'万','今日行数');
  h+=dashMetric(rt.last_missing||0,'最终缺失',rt.last_missing>0);
  h+='</div>';
  if(rt.last_collect_time){
    h+='<div style="margin-top:12px;font-size:12px;color:var(--muted);">上次采集 <b style="color:var(--text2);">'+rt.last_collect_time+'</b> · 重查轮次 <b style="color:var(--text2);">'+(rt.last_retry_rounds||0)+'</b></div>';
  }
  if(rt.error){
    h+='<div class="notice notice-err" style="margin-top:10px;padding:8px 12px;font-size:12px;"><span class="tag">错误</span>'+rt.error+'</div>';
  }
  h+='</div>';
  return h;
}
function buildDashStockInfo(status){
  if(!status||!status.stock_info)return dashEmptyPanel('资讯采集','暂无数据');
  const si=status.stock_info;
  const items=[
    {name:'公告',data:si.notice},
    {name:'个股新闻',data:si.news},
    {name:'研报',data:si.report},
  ];
  let h='<div class="dash-panel">';
  h+='<div class="dash-panel-head"><h3><span class="dp-dot" style="background:var(--cyan);"></span>资讯采集</h3></h3></div>';
  h+='<div class="dash-collector-row">';
  items.forEach(it=>{
    const d=it.data||{};
    const active=d.active;
    const color=active?'var(--cyan)':'var(--muted2)';
    h+='<div class="dash-collector">';
    h+='<div class="dc-head"><span style="width:8px;height:8px;border-radius:50%;background:'+color+';'+(active?'animation:pulse 1.5s infinite':'')+'"></span><span class="dc-name">'+it.name+'</span></div>';
    h+='<div class="dc-line">累计 <b>'+(d.total||0)+'</b>';
    if(d.progress)h+=' · '+d.progress;
    h+='</div>';
    if(d.last_time)h+='<div class="dc-line">'+d.last_time+'</div>';
    if(d.last_count!==undefined)h+='<div class="dc-line">本轮新增 <b>'+(d.last_count||0)+'</b></div>';
    h+='</div>';
  });
  h+='</div></div>';
  return h;
}
function dashMetric(val,lab,warn){
  return '<div class="dash-metric"><div class="dm-val'+(warn?' warn':'')+'">'+val+'</div><div class="dm-lab">'+lab+'</div></div>';
}
function dashEmptyPanel(title,txt){
  return '<div class="dash-panel"><div class="dash-panel-head"><h3><span class="dp-dot" style="background:var(--muted2);"></span>'+title+'</h3></div><p class="empty">'+txt+'</p></div>';
}
function buildNotice(status){
  if(!status)return'';
  if(!status.connected)return'<div class="notice notice-err"><span class="tag">异常</span>行情连接未建立，请稍等或检查网络/通达信节点</div>';
  if(!status.trading)return'<div class="notice notice-warn"><span class="tag">提示</span>当前非交易时段，仅展示现价与当日涨跌，暂停涨速 / 跌幅计算</div>';
  return'';
}
function cmi(k,v,badge){const vv=badge?('<span class="'+badge+'">'+v+'</span>'):v;return '<div class="cmi"><div class="k">'+k+'</div><div class="v">'+vv+'</div></div>';}
function progressBar(val,threshold,rise){
  if(threshold<=0)return'';
  const pct=Math.min(100,Math.max(0,Math.abs(val)/threshold*100));
  const color=rise?'var(--up)':'var(--down)';
  return '<div class="prog"><div class="prog-track"><div class="prog-fill" style="width:'+pct.toFixed(0)+'%;background:'+color+'"></div></div><span class="prog-txt">'+pct.toFixed(0)+'%</span></div>';
}

// ---------------- 监控模型视图 ----------------
async function renderModels(){
  try{
    const [models,stocks,status]=await Promise.all([
      api('/api/models'),api('/api/stocks'),api('/api/status').catch(()=>null)]);
    // 条件单模型：股票 id 已从 /api/stocks 剔除（防错配），chips 数据改由模型详情提供
    const condIds=(models||[]).filter(isCond).map(mo=>mo.id);
    const condMap={};
    await Promise.all(condIds.map(id=>api('/api/model/'+id).then(d=>{condMap[id]=(d&&d.stocks)||[];}).catch(()=>{condMap[id]=[];})));
    buildModelsView(models,stocks,status,condMap);
    if(status)setLive(status.connected,status.trading);
  }catch(e){$('#app').innerHTML='<p class="err">加载失败: '+e.message+'</p>';}
}
function buildModelsView(models,stocks,status,condMap){
  models=models||[];stocks=stocks||[];
  let h='<div class="page-header"><div class="page-title"><h1>监控模型</h1><p>创建 / 删除监控模型，并查看各模型订阅的股票</p></div>'
    +'<div class="status-pill" id="live"><span class="dot"></span><span id="live-txt">连接中…</span></div></div>';
  h+=buildNotice(status);
  h+='<div class="section-title"><span class="bar"></span><h2>模型概览</h2><span class="line"></span></div>';
  h+='<div class="cards">';
  if(!models.length)h+='<p class="empty">暂无模型。</p>';
  models.forEach(mo=>{
    const tm=mo.top_mover;
    const score=tm?tm.val:0;
    const scoreTxt=tm?score.toFixed(2):'—';
    const stCls=mo.status==='idle'?'badge idle':mo.status==='error'?'badge idle':'badge run';
    const stTxt=mo.status==='idle'?'空闲':mo.status==='error'?'异常':'运行中';
    h+='<a class="card '+(mo.side==='sell'?'sell':'')+'" href="/model/'+mo.id+'">'
      +'<div class="card-h">'
      +'<div class="card-icon">'+(isCond(mo)?'◎':isRise(mo)?'⬆':'⬇')+'</div>'
      +'<div class="card-title"><span class="name">'+mo.name+'</span><span class="id">'+mo.id+'</span></div>'
      +'<div class="card-score">'+scoreTxt+(tm?'<small style="font-size:12px;font-weight:600">%</small>':'')+'</div></div>'
      +'<div class="card-body">'
      +cmi('类型',modelTypeLabel(mo.type))
      +cmi(isCond(mo)?'触发方式':'阈值 / 窗口',modelParamText(mo))
      +cmi('核心指标',mo.metric_label)
      +cmi(isCond(mo)?'条件单股票':'订阅股票',mo.stock_count+' 只')
      +cmi('运行状态',stTxt,stCls)
      +cmi('最近触发',mo.last_trigger||'—')
      +'</div>'
      +(tm&&!isCond(mo)?progressBar(score,mo.threshold,isRise(mo)):'')
      +'<div class="card-foot"><span>'+(isCond(mo)?'监控中':isRise(mo)?'领涨标的':'领跌标的')+'</span>'
      +(isCond(mo)?'<b>'+mo.stock_count+' 只挂单</b>':(tm?'<b>'+tm.code+'</b>':'<span>—</span>'))+'</div>'
      +'</a>';
  });
  h+='</div>';
  h+=buildModelManage(models,stocks,condMap);
  $('#app').innerHTML=h;
}
function buildModelManage(models,stocks,condMap){
  models=models||[];stocks=stocks||[];
  let h='<div class="section-title"><span class="bar"></span><h2>模型列表</h2><span class="line"></span></div>';
  h+='<div class="panel"><div class="panel-head"><span class="ic">⬡</span><h3>已配置的监控模型</h3></div>';
  h+='<div id="model_list">';
  models.forEach(mo=>{
    let subs;
    if(isCond(mo)){
      // 条件单模型：从详情接口取（股票 id 不在 /api/stocks，防错配）
      const rows=condMap[mo.id]||[];
      subs=rows.map(r=>({code:r.code,name:r.name}));
    }else{
      subs=stocks.filter(s=>s.models.includes(mo.id));
    }
    const chips=subs.length?subs.map(s=>'<span class="chip on">'+s.code+' '+s.name+'</span>').join(''):'<span class="meta">暂无订阅股票</span>';
    h+='<div class="list-row"><span>'+sideBadge(mo.side)+'</span>'
      +'<b>'+mo.name+'</b>'
      +'<span class="meta">'+mo.id+' · '+modelTypeLabel(mo.type)+' · '+modelParamText(mo)+'</span>'
      +'<span class="grow"></span>'
      +'<span class="chips" style="margin-right:10px">'+chips+'</span></div>';
  });
  if(!models.length)h+='<p class="empty">暂无模型。</p>';
  h+='</div></div>';
  return h;
}

// ---------------- 股票管理视图（分组化） ----------------
let __qmtStrategies = [];
let __allModels = [];
function modelName(mid){const m=__allModels.find(x=>x.id===mid);return m?m.name:mid;}
async function renderStocks(){
  try{
    const [groups,status,qmtStatus,models]=await Promise.all([
      api('/api/groups'),api('/api/status').catch(()=>null),
      api('/api/qmt/status').catch(()=>null),
      api('/api/models').catch(()=>[])]);
    __allModels = models||[];
    // 异步加载策略列表（不阻塞渲染）
    api('/api/qmt/strategies').then(r=>{__qmtStrategies=r.strategies||[];}).catch(()=>{});
    buildGroupsView(groups,status,qmtStatus);
    if(status)setLive(status.connected,status.trading);
  }catch(e){$('#app').innerHTML='<p class="err">加载失败: '+e.message+'</p>';}
}
function buildGroupsView(groups,status,qmtStatus){
  groups=groups||[];
  let h='<div class="page-header"><div class="page-title"><h1>股票管理</h1><p>策略组自动同步 QMT，自定义组手动维护成分股</p></div>'
    +'<div class="status-pill" id="live"><span class="dot"></span><span id="live-txt">连接中…</span></div></div>';
  h+=buildNotice(status);
  // QMT 同步状态条
  if(qmtStatus){
    const ok=qmtStatus.last_sync_ok;
    h+='<div class="panel" style="display:flex;align-items:center;gap:16px;flex-wrap:wrap;">';
    h+='<div class="panel-ic" style="width:36px;height:36px;border-radius:10px;background:'+(ok?'rgba(88,166,255,.1)':'rgba(239,68,68,.1)')+';color:'+(ok?'var(--cyan)':'var(--up)')+';display:flex;align-items:center;justify-content:center;font-size:18px;">'+(ok?'✓':'!')+'</div>';
    h+='<div style="flex:1;min-width:200px;"><div style="font-weight:700;font-size:14px;">QMT 策略同步</div>';
    h+='<div style="font-size:12px;color:var(--muted);">';
    if(qmtStatus.last_sync){h+='上次同步: '+qmtStatus.last_sync+' · ';}
    h+=(ok?'正常':'<span style="color:var(--up);">'+(qmtStatus.error||'同步失败')+'</span>');
    if(ok){h+=' · '+qmtStatus.strategy_count+' 个策略 · '+qmtStatus.synced_stock_count+' 只股票 · '+(qmtStatus.condition_count||0)+' 张条件单';}
    h+='</div></div>';
    h+='<button class="ghost" onclick="syncQmt()">🔄 立即同步</button>';
    h+='<button onclick="showNewGroup()">+ 创建分组</button>';
    h+='</div>';
  }
  // 分组列表
  const strategyGroups = groups.filter(g=>g.type==='strategy');
  const customGroups = groups.filter(g=>g.type==='custom');
  if(strategyGroups.length){
    h+='<div class="section-title"><span class="bar"></span><h2>策略组（QMT 自动同步）</h2><span class="line"></span></div>';
    strategyGroups.forEach(g=>{h+=buildGroupCard(g);});
  }
  h+='<div class="section-title"><span class="bar"></span><h2>自定义组（手动维护）</h2><span class="line"></span></div>';
  if(customGroups.length){customGroups.forEach(g=>{h+=buildGroupCard(g);});}
  else{h+='<p class="empty">暂无自定义分组，点击「创建分组」添加。</p>';}
  $('#app').innerHTML=h;
}
function buildGroupCard(g){
  let h='<div class="panel" style="margin-bottom:16px;">';
  h+='<div class="panel-head" style="margin-bottom:12px;">';
  h+='<span class="ic" style="background:'+(g.type==='strategy'?'rgba(88,166,255,.1)':'rgba(96,165,250,.1)')+';color:'+(g.type==='strategy'?'var(--cyan)':'#60a5fa')+';">'+(g.type==='strategy'?'⚡':'✎')+'</span>';
  h+='<h3 style="flex:1;">'+g.name+(g.type==='strategy'?' <span class="badge run" style="margin-left:6px;">策略组</span>':' <span class="badge idle" style="margin-left:6px;">自定义</span>')+'</h3>';
  h+='<button class="mini ghost" onclick="editGroup(\''+g.id+'\')">编辑</button>';
  h+='<button class="mini danger" onclick="delGroup(\''+g.id+'\',\''+g.name.replace(/'/g,"")+'\')">删除</button>';
  h+='</div>';
  // 买入组
  if(g.buy_group){
    h+=buildSideGroup(g.id,'buy',g.buy_group,g.type);
  }
  // 卖出组
  if(g.sell_group){
    h+=buildSideGroup(g.id,'sell',g.sell_group,g.type);
  }
  if(!g.buy_group&&!g.sell_group){
    h+='<p class="empty">该组尚无买卖组，点击「编辑」创建。</p>';
  }
  h+='</div>';
  return h;
}
function buildSideGroup(gid,side,bg,gtype){
  const label=side==='buy'?'买入组':'卖出组';
  const color=side==='buy'?'var(--cyan)':'var(--sell)';
  let h='<div style="border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;">';
  h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">';

async function editGroup(gid){

    try{__allModels=await api('/api/models');}catch(e){}

function openEditModal(gid, grp){
  const section=(side)=>{
    const bg = side==='buy' ? grp.buy_group : grp.sell_group;
    const color = side==='buy' ? 'var(--cyan)' : 'var(--sell)';
    const label = side==='buy' ? '买入组' : '卖出组';
    const list = __allModels.filter(m=>m.side===side);
    const cur = (bg && bg.models) || [];
    let h = '<div class="edit-section">';
    h += '<div class="edit-section-title" style="color:'+color+'">'+label+' · 监控模型'
       + '<span style="color:var(--muted2);font-weight:400;margin-left:8px;">'
       + (bg ? bg.stocks.length+' 只成分股' : '未创建') + '</span></div>';
    if(!bg){
      h += '<label class="chk-item" style="margin-bottom:8px;"><input type="checkbox" data-create="'+side+'">'
         + '<span class="chk-id">创建'+label+'</span>'
         + '<span class="chk-meta">勾选后可添加成分股</span></label>';
    }
    if(!list.length){
      h += '<p class="empty" style="padding:8px 0;">该方向暂无可用监控模型</p>';
    }else{
      h += '<div class="chk-grid">';
      list.forEach(m=>{
        const checked = cur.includes(m.id) ? 'checked' : '';
        const desc = m.type==='condition' ? '服务端条件单：突破/跌破 价格·比例触发（时间窗内有效）'
                   : (m.type==='buy_condition' ? '服务端买入条件单：突破/跌破 价格·比例触发'
                   : (m.type==='drop'?'跌幅':'涨速') + ' ≥ ' + m.threshold + '% / ' + m.window + '分钟');
        h += '<label class="chk-item"><input type="checkbox" value="'+m.id+'" data-side="'+side+'" '+checked+'>'
           + '<span class="chk-id">'+m.name+'</span>'
           + '<span class="chk-meta">'+desc+'</span></label>';
      });
      h += '</div>';
    }
    // 策略绑定（只读，由 QMT 同步维护）
    if(grp.type==='strategy' && bg && bg.bound_strategies && bg.bound_strategies.length){
      h += '<div style="margin-top:8px;font-size:11px;color:var(--muted2);">QMT 绑定策略: '
         + bg.bound_strategies.map(s=>'#'+s).join(', ') + '（自动同步，不可编辑）</div>';
    }
    h += '</div>';
    return h;
  };
  let h = '<div class="modal-overlay" style="display:flex" onclick="if(event.target===this)closeEditModal()">';
  h += '<div class="modal">';
  h += '<div class="modal-head"><h3>编辑分组 · '+grp.name+'</h3><button class="modal-x" onclick="closeEditModal()">✕</button></div>';
  h += '<div class="modal-body">';
  h += '<p style="font-size:12px;color:var(--muted);margin:0 0 12px;">勾选该买卖组的成分股要参与哪些监控模型，取消勾选则不再监控。</p>';
  h += section('buy');
  h += section('sell');
  h += '</div>';
  h += '<div class="modal-foot"><button class="ghost" onclick="closeEditModal()">取消</button>'
     + '<button onclick="saveEditModal(\''+gid+'\')">保存</button></div>';
  h += '</div></div>';
  let el = document.getElementById('edit_modal');
  if(!el){ el = document.createElement('div'); el.id = 'edit_modal'; document.body.appendChild(el); }
  el.innerHTML = h;
  el.style.display = 'block';
}
function closeEditModal(){ const el=document.getElementById('edit_modal'); if(el){el.style.display='none';el.innerHTML='';} }
async function saveEditModal(gid){
  const pick=side=>[...document.querySelectorAll('#edit_modal input[data-side="'+side+'"]:checked')].map(i=>i.value);
  const body={id:gid, buy_models:pick('buy'), sell_models:pick('sell')};
  const cb=document.querySelector('#edit_modal input[data-create="buy"]');
  const cs=document.querySelector('#edit_modal input[data-create="sell"]');
  if(cb&&cb.checked)body.create_buy=true;
  if(cs&&cs.checked)body.create_sell=true;
  try{
    await api('/api/groups/update',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    closeEditModal();
    render();
  }catch(e){alert('更新失败: '+e.message);}
}

function metricCell(mo,x){
  if(x.value==null)return '<span class="muted">—</span>';
  let cls='muted';
  if(isRise(mo)){cls=x.signed>0?'up':x.signed<0?'down':'muted';}
  else{cls=x.signed<0?'down':'muted';}
  const txt=(isRise(mo)&&x.signed>0?'+':'')+x.value.toFixed(2);
  return '<span class="'+cls+'">'+txt+'</span>';
}

function buildMetricTable(mo,d){
  let h='<div class="tbl-wrap"><table><thead><tr>'
    +'<th class="l">代码</th><th class="l">名称</th><th>现价</th><th>'+mo.metric_label+'</th>'
    +'<th>N分钟前价</th><th>当日涨跌</th><th>更新</th><th>状态</th></tr></thead><tbody>';
  if(!(d.stocks||[]).length)h+='<tr><td colspan="8" class="muted" style="text-align:center;padding:26px">该模型暂无订阅股票</td></tr>';
  (d.stocks||[]).forEach(x=>{
    const up=x.day_change>0,down=x.day_change<0;
    const dc=x.day_change==null?'<span class="muted">—</span>'
      :'<span class="'+(up?'up':down?'down':'')+'">'+(up?'+':'')+x.day_change.toFixed(2)+'%</span>';
    const st=x.alert?'<span class="alert-badge">⚠ 超阈值</span>':'<span class="normal">正常</span>';
    h+='<tr class="'+(x.alert?'alert':'')+'">'
      +'<td class="l"><code>'+x.code+'</code></td>'
      +'<td class="l">'+(x.name||'—')+'</td>'
      +'<td>'+(x.price==null?'<span class="muted">—</span>':x.price.toFixed(2))+'</td>'
      +'<td>'+metricCell(mo,x)+'</td>'
      +'<td>'+(x.prev_price==null?'<span class="muted">—</span>':x.prev_price.toFixed(2))+'</td>'
      +'<td>'+dc+'</td>'
      +'<td class="muted">'+x.updated+'</td>'
      +'<td>'+st+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}
function buildCondTable(d){
  const px=v=>v==null?'<span class="muted">—</span>':v.toFixed(2);
  let h='<div class="tbl-wrap"><table><thead><tr>'
    +'<th class="l">代码</th><th class="l">名称</th><th>策略</th><th>现价</th><th>触发条件</th>'
    +'<th>时间窗</th><th>距触发</th><th>当日涨跌</th><th>更新</th><th>状态</th></tr></thead><tbody>';
  if(!(d.stocks||[]).length)h+='<tr><td colspan="10" class="muted" style="text-align:center;padding:26px">暂无条件单（服务端无监控中的条件单，或策略未绑定本模型）</td></tr>';
  (d.stocks||[]).forEach(x=>{
    const up=x.day_change>0,down=x.day_change<0;
    const dc=x.day_change==null?'<span class="muted">—</span>'
      :'<span class="'+(up?'up':down?'down':'')+'">'+(up?'+':'')+x.day_change.toFixed(2)+'%</span>';
    let st='<span class="normal">监控中</span>';
    if(x.cond_kind==='breakout_price')st='<span class="alert-badge">⚠ 突破价格</span>';
    else if(x.cond_kind==='breakdown_price')st='<span class="alert-badge">⚠ 跌破价格</span>';
    else if(x.cond_kind==='breakout_ratio')st='<span class="alert-badge">⚠ 突破比例</span>';
    else if(x.cond_kind==='breakdown_ratio')st='<span class="alert-badge">⚠ 跌破比例</span>';
    // 已触发过、仍在监听的单：标注"提醒中"（等用户点卡片处理，每冷却期一轮反复提醒）
    if(x.retrigger)st='<span class="alert-badge" style="background:rgba(255,159,67,.18);color:#ff9f42">🔁 提醒中</span>'+st;
    const condCls=x.cond_kind&&(x.cond_kind.indexOf('breakdown')===0)?'down':'up';
    h+='<tr class="'+(x.alert?'alert':'')+'">'
      +'<td class="l"><code>'+x.code+'</code></td>'
      +'<td class="l">'+(x.name||'—')+'</td>'
      +'<td class="muted">#'+(x.strategy_id==null?'—':x.strategy_id)+'</td>'
      +'<td><b>'+(x.price==null?'—':x.price.toFixed(2))+'</b></td>'
      +'<td><span class="'+condCls+'">'+(x.trigger_desc||'—')+'</span></td>'
      +'<td class="muted" style="font-size:11px;">'+(x.window_txt||'—')+'</td>'
      +'<td>'+(x.gap==null?'<span class="muted">—</span>':x.gap.toFixed(2)+'%')+'</td>'
      +'<td>'+dc+'</td>'
      +'<td class="muted">'+x.updated+'</td>'
      +'<td>'+st+'</td></tr>';
  });
  return h+'</tbody></table></div>';
}

function pollDataProgress(){
  clearInterval(__dataState.progressTimer);
  __dataState.progressTimer=setInterval(async()=>{
    try{
      const p=await api('/api/data/progress');
      updateDlStatus(p);
      if(!p.running){clearInterval(__dataState.progressTimer);}
    }catch(e){}
  },1500);
}
function updateDlStatus(p){
  const el=$('#dl-status');const logEl=$('#dl-log');
  if(!el)return;
  if(!p.running && !p.type){el.innerHTML='<span class="muted">空闲</span>';return;}
  const pct=p.pct||0;
  let h='<div style="display:flex;justify-content:space-between;font-size:12px">'
    +'<span>'+(p.type==='download'?'全量下载':'增量更新')+' · '+(p.table||'—')+'</span>'
    +'<span class="muted">'+p.done+' / '+p.total+' ('+pct+'%)</span></div>';
  h+='<div class="dl-bar"><div class="dl-bar-fill" style="width:'+pct+'%"></div></div>';
  el.innerHTML=h;
  if(logEl&&(p.log||[]).length){
    logEl.innerHTML=(p.log||[]).map(l=>{
      if(/出错|失败/.test(l))return '<span class="err">'+l+'</span>';
      if(/完成/.test(l))return '<span class="ok">'+l+'</span>';
      return l;
    }).join('\n');
    logEl.scrollTop=logEl.scrollHeight;
  }
  // 更新每个表卡片的独立进度条
  const tps=p.tables||{};
  for(const tbl in tps){
    const tp=tps[tbl];
    const progEl=$('#prog-'+tbl);
    if(!progEl)continue;
    if(tp.status==='done'||tp.status==='skipped'){
      progEl.style.display='block';
      progEl.innerHTML='<div style="font-size:10px;color:#52c41a">✓ '+tp.status+'</div>';
    }else if(tp.status==='error'){
      progEl.style.display='block';
      progEl.innerHTML='<div style="font-size:10px;color:#f5222d">✗ 出错</div>';
    }else if(tp.status==='running'||tp.status==='pending'){
      progEl.style.display='block';
      const stLbl=tp.status==='pending'?'等待…':(tp.done+'/'+tp.total);
      const stColor=tp.status==='pending'?'#999':'#1890ff';
      progEl.innerHTML='<div style="font-size:10px;color:'+stColor+';margin-bottom:2px">'+stLbl+'</div>'
        +'<div style="height:3px;background:#e8e8e8;border-radius:2px;overflow:hidden">'
        +'<div style="height:100%;width:'+tp.pct+'%;background:#1890ff;transition:width 0.3s"></div></div>';
    }
  }
}
async function startDownload(){
  if(!confirm('全量下载 26 张表约需数小时（取决于积分），确认开始？'))return;
  try{await api('/api/data/download',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});pollDataProgress();}
  catch(e){alert('启动失败: '+e.message);}
}
async function startUpdate(){
  try{await api('/api/data/update',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});pollDataProgress();}
  catch(e){alert('启动失败: '+e.message);}
}
async function stopDownload(){
  try{await api('/api/data/stop',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});}
  catch(e){alert('停止失败: '+e.message);}

async function saveToken(){
  const v=($('#token_input')||{}).value;
  if(!v||!v.trim()){alert('请输入 token');return;}
  try{await api('/api/data/token',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:v.trim()})});alert('token 已保存');renderData();}
  catch(e){alert('保存失败: '+e.message);}
}
async function browseTable(tbl){
  __dataState.curTable=tbl;__dataState.page=0;__dataState.code='';__dataState.startDate='';__dataState.endDate='';
  await loadTablePage();
}
async function loadTablePage(){
  const tbl=__dataState.curTable;if(!tbl)return;
  const s=__dataState;
  let url='/api/data/table/'+tbl+'?limit='+s.pageSize+'&offset='+(s.page*s.pageSize);
  if(s.code)url+='&code='+encodeURIComponent(s.code);
  if(s.startDate)url+='&start_date='+encodeURIComponent(s.startDate);
  if(s.endDate)url+='&end_date='+encodeURIComponent(s.endDate);
  try{
    const d=await api(url);
    let h='<div class="section-title"><span class="bar"></span><h2>'+d.name_cn+' · '+tbl+'</h2><span class="line"></span></div>';
    h+='<div class="tbl-browse">';
    h+='<div class="row" style="flex-wrap:wrap;gap:8px;align-items:center">';
    h+='<input id="browse_code" placeholder="股票代码（如 600519）" value="'+s.code+'" style="width:140px">';
    h+='<input id="browse_start" type="date" value="'+s.startDate+'" title="开始日期" style="width:150px">';
    h+='<span class="muted">~</span>';
    h+='<input id="browse_end" type="date" value="'+s.endDate+'" title="结束日期" style="width:150px">';
    h+='<button onclick="applyFilter()">查询</button>'
      +'<button onclick="exportCsv()">导出 CSV</button>'
      +'<button class="danger" onclick="closeBrowse()">关闭</button>';
    h+='</div>';
    h+='<div class="muted" style="margin-top:8px;font-size:12px">共 '+d.total.toLocaleString()+' 行 · 第 '+(s.page+1)+' 页'+(d.date_col?(' · 日期列: '+d.date_col):'')+'</div>';
    h+='<div class="tbl-scroll"><table><thead><tr>'+d.columns.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';
    if(!d.rows.length)h+='<tr><td colspan="'+d.columns.length+'" class="muted" style="text-align:center;padding:20px">无数据</td></tr>';
    d.rows.forEach(r=>{h+='<tr>'+r.map(v=>'<td>'+(v==null?'—':v)+'</td>').join('')+'</tr>';});
    h+='</tbody></table></div>';
    h+='<div class="pager">'
      +'<button onclick="gotoPage('+(s.page-1)+')" '+(s.page<=0?'disabled':'')+'>上一页</button>'
      +'<span class="muted">第 '+(s.page+1)+' 页</span>'
      +'<button onclick="gotoPage('+(s.page+1)+')" '+(d.rows.length<s.pageSize?'disabled':'')+'>下一页</button>'
      +'<span class="grow"></span><span class="muted">每页 '+s.pageSize+' 行</span></div>';
    h+='</div>';
    const area=$('#browse-area');if(area)area.innerHTML=h;
  }catch(e){
    const area=$('#browse-area');if(area)area.innerHTML='<p class="err">查询失败: '+e.message+'</p>';
  }
}
function gotoPage(n){if(n<0)n=0;__dataState.page=n;loadTablePage();}
function applyFilter(){
  __dataState.code=($('#browse_code')||{}).value.trim();
  __dataState.startDate=($('#browse_start')||{}).value||'';
  __dataState.endDate=($('#browse_end')||{}).value||'';
  __dataState.page=0;loadTablePage();
}
function closeBrowse(){const a=$('#browse-area');if(a)a.innerHTML='';__dataState.curTable=null;}
function exportCsv(){
  const tbl=__dataState.curTable;if(!tbl)return;
  let url='/api/data/table/'+tbl+'?limit=5000&offset=0';
  if(__dataState.code)url+='&code='+encodeURIComponent(__dataState.code);
  if(__dataState.startDate)url+='&start_date='+encodeURIComponent(__dataState.startDate);
  if(__dataState.endDate)url+='&end_date='+encodeURIComponent(__dataState.endDate);
  window.open(url,'_blank');
}
function ib(k,v,badge){const cls=badge?(' '+badge):'';return '<div class="it"><div class="k">'+k+'</div><div class="v'+cls+'">'+v+'</div></div>';}
render();
</script></body></html>
