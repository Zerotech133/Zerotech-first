<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简单预警</title>
<style>
  /* ===== 零界设计令牌（portal tokens.css 同源）===== */
  :root {
    --gray-0: #0d1117; --gray-1: #161b22; --gray-2: #21262d;
    --border: #30363d; --fg: #e6edf3; --fg-dim: #8b949e;
    --blue: #58a6ff; --red: #f85149; --green: #3fb950; --amber: #d29922;
    --radius: 10px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: var(--gray-0); color: var(--fg);
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 14px; line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }

  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 8px; }
  .brand { font-size: 17px; font-weight: 700; }
  .brand small { color: var(--fg-dim); font-weight: 400; margin-left: 8px; font-size: 12px; }
  .status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px;
    background: rgba(139,148,158,.12); color: var(--fg-dim); border: 1px solid rgba(139,148,158,.3); }
  .pill.ok { background: rgba(63,185,80,.12); color: var(--green); border-color: rgba(63,185,80,.3); }
  .pill.bad { background: rgba(248,81,73,.12); color: var(--red); border-color: rgba(248,81,73,.3); }
  .pill.blue { background: rgba(88,166,255,.12); color: var(--blue); border-color: rgba(88,166,255,.3); }
  .pill a { color: inherit; text-decoration: none; }

  .add-btn { width: 100%; padding: 14px; border-radius: var(--radius);
    background: rgba(88,166,255,.12); color: var(--blue);
    border: 1px dashed rgba(88,166,255,.45);
    font-size: 15px; font-weight: 600; cursor: pointer; transition: .15s; }
  .add-btn:hover { background: rgba(88,166,255,.2); }

  .panel { display: none; margin-top: 12px; background: var(--gray-1);
    border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .panel.open { display: block; }
  .step { display: flex; gap: 12px; margin-bottom: 16px; }
  .step-num { flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--blue); color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .step-body { flex: 1; }
  .step-title { font-weight: 600; margin-bottom: 8px; }

  .code-row { display: flex; gap: 8px; }
  .code-input { flex: 1; max-width: 240px; padding: 8px 12px;
    background: var(--gray-0); border: 1px solid var(--border); border-radius: 8px;
    color: var(--fg); font-size: 15px; letter-spacing: 1px; }
  .code-input:focus { outline: none; border-color: var(--blue); }
  .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--gray-2); color: var(--fg); cursor: pointer; font-size: 13px; }
  .btn.primary { background: #1f6feb; border-color: #1f6feb; color: #fff; font-weight: 600; }
  .btn:hover { filter: brightness(1.15); }
  .mkt-hint { font-size: 12px; color: var(--fg-dim); margin-top: 6px; }

  .tpl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
  .tpl { padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; transition: .12s; background: var(--gray-0); }
  .tpl:hover { border-color: var(--blue); }
  .tpl.active { border-color: var(--blue); background: rgba(88,166,255,.1); }
  .tpl-name { font-weight: 600; font-size: 13px; }
  .tpl-desc { font-size: 12px; color: var(--fg-dim); margin-top: 2px; }

  .thresh-row { display: flex; align-items: center; gap: 10px; }
  .thresh-row input { width: 90px; padding: 8px 10px; text-align: center;
    background: var(--gray-0); border: 1px solid var(--border); border-radius: 8px;
    color: var(--fg); font-size: 15px; font-weight: 600; }
  .thresh-row input:focus { outline: none; border-color: var(--blue); }
  .thresh-hint { font-size: 12px; color: var(--fg-dim); }
  .save-row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
  .save-msg { font-size: 12px; }
  .save-msg.ok { color: var(--green); } .save-msg.err { color: var(--red); }

  .section-title { display: flex; align-items: baseline; justify-content: space-between; margin: 26px 0 10px; }
  .section-title h2 { font-size: 14px; font-weight: 600; }
  .section-title span { font-size: 12px; color: var(--fg-dim); }

  .alert-card { background: var(--gray-1); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 8px;
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .alert-card.off { opacity: .45; }
  .stock { width: 128px; }
  .stock .nm { font-weight: 600; }
  .stock .cd { font-size: 12px; color: var(--fg-dim); }
  .price { width: 104px; text-align: right; }
  .price .p { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .price .chg { font-size: 12px; }
  .up { color: var(--red); } .down { color: var(--green); }
  .cond { flex: 1; display: flex; align-items: center; gap: 6px; min-width: 200px; }
  .cond .tag { padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    cursor: pointer; border: 1px solid transparent; white-space: nowrap; }
  .tag.sell { background: rgba(248,81,73,.12); color: var(--red); border-color: rgba(248,81,73,.35); }
  .tag.buy  { background: rgba(63,185,80,.12); color: var(--green); border-color: rgba(63,185,80,.35); }
  .tag.speed{ background: rgba(210,153,34,.12); color: var(--amber); border-color: rgba(210,153,34,.35); }
  .cond .hit { font-size: 11px; color: var(--fg-dim); }
  .cond .hit.hot { color: var(--amber); font-weight: 600; }
  .grp-tag { font-size: 11px; color: var(--fg-dim); border: 1px solid var(--border);
    padding: 1px 7px; border-radius: 999px; }

  .switch { position: relative; width: 36px; height: 20px; flex: none; cursor: pointer; }
  .switch input { display: none; }
  .switch .track { position: absolute; inset: 0; border-radius: 999px;
    background: var(--gray-2); border: 1px solid var(--border); transition: .15s; }
  .switch .dot { position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
    border-radius: 50%; background: var(--fg-dim); transition: .15s; }
  .switch input:checked ~ .track { background: rgba(63,185,80,.25); border-color: var(--green); }
  .switch input:checked ~ .dot { left: 18px; background: var(--green); }

  .del { flex: none; width: 28px; height: 28px; border-radius: 6px; border: none;
    background: transparent; color: var(--fg-dim); cursor: pointer; font-size: 15px; }
  .del:hover { background: rgba(248,81,73,.12); color: var(--red); }

  .empty { text-align: center; color: var(--fg-dim); padding: 26px 0; font-size: 13px;
    background: var(--gray-1); border: 1px dashed var(--border); border-radius: var(--radius); }

  .feed-item { display: flex; gap: 10px; align-items: center; padding: 9px 12px;
    border-bottom: 1px solid var(--border); font-size: 13px; }
  .feed-card { background: var(--gray-1); border: 1px solid var(--border); border-radius: var(--radius); }
  .feed-item:last-child { border-bottom: none; }
  .feed-item .t { color: var(--fg-dim); font-size: 12px; width: 78px; flex: none;
    font-variant-numeric: tabular-nums; }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex: none; }

  details.settings { margin-top: 26px; background: var(--gray-1);
    border: 1px solid var(--border); border-radius: var(--radius); }
  details.settings summary { padding: 12px 14px; cursor: pointer; font-size: 13px;
    font-weight: 600; color: var(--fg-dim); user-select: none; }
  details.settings summary:hover { color: var(--fg); }
  .settings-body { padding: 4px 14px 14px; display: grid; gap: 12px; }
  .set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .set-row label { font-size: 13px; }
  .set-row small { display: block; color: var(--fg-dim); font-size: 11px; font-weight: 400; }
  .set-row select { padding: 6px 10px; background: var(--gray-0); border: 1px solid var(--border);
    border-radius: 8px; color: var(--fg); font-size: 13px; }

  .note { margin-top: 20px; padding: 10px 14px; border-radius: 8px; font-size: 12px;
    background: rgba(88,166,255,.08); color: var(--fg-dim); border: 1px solid rgba(88,166,255,.2); }
  .note b { color: var(--fg); }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <div class="brand">简单预警 <small>通达信监控</small></div>
    <div class="status" id="statusBar">
      <span class="pill">连接中…</span>
      <a class="pill blue" href="/advanced">高级功能 ▸</a>
    </div>
  </div>

  <button class="add-btn" onclick="toggleAdd()">＋ 添加预警</button>

  <div class="panel" id="addPanel">
    <div class="step">
      <div class="step-num">1</div>
      <div class="step-body">
        <div class="step-title">输入股票代码</div>
        <div class="code-row">
          <input class="code-input" id="codeInput" placeholder="如 601985" maxlength="6" inputmode="numeric" autocomplete="off">
        </div>
        <div class="mkt-hint" id="mktHint">6 位数字：60 开头沪市 · 0/3 开头深市 · 8/4 开头北交所</div>
      </div>
    </div>

    <div class="step">
      <div class="step-num">2</div>
      <div class="step-body">
        <div class="step-title">选一个预警类型（已帮你填好常用值）</div>
        <div class="tpl-grid" id="tplGrid"></div>
      </div>
    </div>

    <div class="step">
      <div class="step-num">3</div>
      <div class="step-body">
        <div class="step-title">确认阈值</div>
        <div class="thresh-row">
          <input type="number" id="thresh" value="2.88" step="0.01" min="0.1">
          <span class="thresh-hint" id="threshHint"></span>
        </div>
        <div class="save-row">
          <button class="btn primary" onclick="save()">保存预警</button>
          <button class="btn" onclick="toggleAdd()">取消</button>
          <span class="save-msg" id="saveMsg"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="section-title"><h2>我的预警</h2><span id="listCount"></span></div>
  <div id="list"><div class="empty">加载中…</div></div>

  <div class="section-title"><h2>今日动态</h2><span>触发即推送（飞书/钉钉等按后端渠道配置）</span></div>
  <div class="feed-card" id="feed"><div class="feed-item"><span class="dot-live"></span><span>加载中…</span></div></div>

  <details class="settings">
    <summary>⚙️ 设置（一般不用动）</summary>
    <div class="settings-body">
      <div class="set-row">
        <label>修改类型阈值<small>也可以直接点列表里的条件标签修改</small></label>
        <select id="thrModel" onchange="pickModelThr()"></select>
      </div>
      <div class="set-row">
        <label>QMT 策略同步<small id="qmtHint">从 QMT 拉取策略持仓生成监控分组</small></label>
        <button class="btn" onclick="qmtSync()">立即同步</button>
      </div>
      <div class="set-row">
        <label>完整功能<small>数据下载 · 回测引擎 · 板块行情 · 股票管理</small></label>
        <a class="pill blue" href="/advanced" style="text-decoration:none">打开高级功能 ▸</a>
      </div>
      <div class="set-row">
        <label>检查频率<small>引擎每 3 秒轮询一次行情（内置默认）</small></label>
        <span class="pill">3 秒</span>
      </div>
    </div>
  </details>

  <div class="note">
    💡 <b>提示</b>：同一类预警共用一个阈值（改阈值对该类全部生效）；同一股票触发后进入冷却期，
    冷却期内不重复推送。QMT 策略同步来的股票（标 QMT）由策略系统管理，本地不能删除。
  </div>
</div>

<script>
'use strict';
/* ================= 模板定义（对应后端内置模型） ================= */
const TPLS = [
  { key:'rise',  icon:'📈', name:'急涨 → 提醒卖出', desc:'3分钟涨超阈值，提醒止盈', model:'speed_sell', side:'sell', def:2.88, tag:'sell',
    hint:'3 分钟内涨幅达到这个百分比就提醒卖出（默认 2.88%，可改）' },
  { key:'sink',  icon:'🌀', name:'急跌 → 提醒抄底', desc:'3分钟跌超阈值，提醒低吸', model:'drop_buy',  side:'buy',  def:2.0,  tag:'buy',
    hint:'3 分钟内跌幅达到这个百分比就提醒买入（默认 2.0%，可改）' },
  { key:'speed', icon:'⚡', name:'急涨 → 追买提醒', desc:'3分钟涨超阈值，提醒追涨', model:'speed_buy', side:'buy',  def:2.88, tag:'speed',
    hint:'3 分钟内涨幅达到这个百分比就提醒追买（默认 2.88%，可改）' },
  { key:'stop',  icon:'🛑', name:'急跌 → 止损提醒', desc:'3分钟跌超阈值，提醒止损', model:'drop_sell', side:'sell', def:2.0,  tag:'sell',
    hint:'3 分钟内跌幅达到这个百分比就提醒止损卖出（默认 2.0%，可改）' },
];
const TPL_BY_MODEL = {}; TPLS.forEach(t => TPL_BY_MODEL[t.model] = t);
const PHRASE = {
  speed_sell: v => `急涨 ${v}% → 卖出提醒`, drop_sell: v => `急跌 ${v}% → 止损提醒`,
  drop_buy:   v => `急跌 ${v}% → 抄底提醒`, speed_buy:  v => `急涨 ${v}% → 追买提醒`,
};
const LS_KEY = 'simple_alerts_disabled';
let MODELS = {};          // mid -> model summary
let picked = TPLS[0];
let curThr = {};          // mid -> 当前阈值（来自后端）

/* ================= 基础工具 ================= */
async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(await r.text() || r.status);
  return r.json();
}
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = (v, d=2) => (v === null || v === undefined || isNaN(v)) ? '--' : Number(v).toFixed(d);
const cls = v => v > 0 ? 'up' : (v < 0 ? 'down' : '');
const sign = v => v > 0 ? '+' : '';
function lsGet(){ try { return JSON.parse(localStorage.getItem(LS_KEY) || '[]'); } catch(e){ return []; } }
function lsSet(a){ localStorage.setItem(LS_KEY, JSON.stringify(a)); }

/* ================= 状态栏 ================= */
function renderStatus(s) {
  const el = document.getElementById('statusBar');
  let h = '';
  if (s) {
    h += `<span class="pill ${s.connected ? 'ok' : 'bad'}">${s.connected ? '● 行情源已连接' : '● 行情源断开'}</span>`;
    h += `<span class="pill ${s.trading ? 'ok' : ''}">${s.trading ? '盘中' : '盘后'}</span>`;
  } else {
    h += '<span class="pill bad">● 状态未知</span>';
  }
  h += '<a class="pill blue" href="/advanced">高级功能 ▸</a>';
  el.innerHTML = h;
}

/* ================= 添加面板 ================= */
function toggleAdd(){ document.getElementById('addPanel').classList.toggle('open'); }
function mktOf(c){ return c.indexOf('688') === 0 ? '科创板' : c.indexOf('6') === 0 ? '沪市' :
  (c.indexOf('0') === 0 || c.indexOf('3') === 0) ? '深市' :
  (c.indexOf('8') === 0 || c.indexOf('4') === 0) ? '北交所' : ''; }

function renderTpls() {
  document.getElementById('tplGrid').innerHTML = TPLS.map((t, i) =>
    `<div class="tpl ${i === 0 ? 'active' : ''}" data-key="${t.key}" onclick="pick(this)">
       <div class="tpl-name">${t.icon} ${t.name}</div><div class="tpl-desc">${t.desc}</div></div>`).join('');
}
function pick(el) {
  document.querySelectorAll('.tpl').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  picked = TPLS.find(t => t.key === el.dataset.key);
  const cur = curThr[picked.model];
  document.getElementById('thresh').value = cur !== undefined ? cur : picked.def;
  document.getElementById('threshHint').textContent = picked.hint;
}
function pickModelThr(mid) {
  mid = mid || document.getElementById('thrModel').value;
  if (!mid) return;
  const v = prompt(`修改「${(MODELS[mid]||{}).name||mid}」阈值（%，对该类所有预警生效）：`, curThr[mid] ?? '');
  if (v === null) return;
  const n = parseFloat(v);
  if (isNaN(n) || n <= 0) return alert('请输入正数');
  api('/api/model/params', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ id: mid, threshold: n }) })
    .then(() => { document.getElementById('thrModel').value = ''; load(); })
    .catch(e => alert('修改失败: ' + e.message));
}

async function save() {
  const msg = document.getElementById('saveMsg');
  const code = document.getElementById('codeInput').value.trim();
  const thrEl = document.getElementById('thresh');
  msg.className = 'save-msg'; msg.textContent = '';
  if (!/^\d{6}$/.test(code)) { msg.className = 'save-msg err'; msg.textContent = '请输入 6 位数字代码'; return; }
  const thr = parseFloat(thrEl.value);
  if (isNaN(thr) || thr <= 0) { msg.className = 'save-msg err'; msg.textContent = '阈值必须是正数'; return; }
  msg.textContent = '保存中…';
  try {
    const side = picked.side, sideKey = side + '_group', field = side + '_models';
    let groups = await api('/api/groups');
    let grp = groups.find(g => g.type === 'custom' && g[sideKey]);
    if (!grp) {
      grp = await api('/api/groups', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ name:'我的预警', type:'custom',
          buy_group:{ models: [] }, sell_group:{ models: [] } }) });
    }
    // 确保该方向的买卖组绑定了所选模型（speed_buy / drop_sell 为手动绑定模型）
    const bg = grp[sideKey] || {};
    const want = Array.from(new Set([...(bg.models || []), picked.model]));
    const body = { id: grp.id, create_buy: side === 'buy', create_sell: side === 'sell' };
    body[field] = want;
    await api('/api/groups/update', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body) });
    // 加股票（服务端自动识别名称与市场）
    try {
      await api(`/api/groups/${grp.id}/${side}/stocks`, { method:'POST',
        headers:{'Content-Type':'application/json'}, body: JSON.stringify({ code }) });
    } catch (e) {
      if (String(e.message).indexOf('已在该组') === -1) throw e;   // 重复添加仅更新阈值
    }
    // 阈值与模型当前值不同才更新（模型级全局参数）
    const cur = curThr[picked.model];
    if (cur === undefined || Math.abs(cur - thr) > 0.001) {
      await api('/api/model/params', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ id: picked.model, threshold: thr }) });
    }
    lsSet(lsGet().filter(x => x.key !== `${grp.id}/${side}/${code}/${picked.model}`));
    msg.className = 'save-msg ok'; msg.textContent = '✓ 已保存';
    setTimeout(toggleAdd, 400);
    document.getElementById('codeInput').value = '';
    load();
  } catch (e) {
    msg.className = 'save-msg err'; msg.textContent = '保存失败: ' + e.message;
  }
}

/* ================= 列表 ================= */
function toggleRow(chk, key, payloadJson) {
  const payload = JSON.parse(payloadJson);
  const dis = lsGet();
  if (chk) {           // 启用 → 重新加回分组
    api(`/api/groups/${payload.gid}/${payload.side}/stocks`, { method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ code: payload.code, name: payload.name }) })
      .then(() => { lsSet(dis.filter(x => x.key !== key)); load(); })
      .catch(e => { alert('启用失败: ' + e.message); load(); });
  } else {             // 停用 → 从分组移除（本地记住，可一键恢复）
    api(`/api/groups/${payload.gid}/${payload.side}/stocks/${payload.code}`, { method:'DELETE' })
      .then(() => { dis.push({ key, payload }); lsSet(dis); load(); })
      .catch(e => { alert('停用失败: ' + e.message); load(); });
  }
}
function delRow(key, payloadJson, origin) {
  if (origin === 'qmt') return;   // QMT 同步来的股票不允许本地删
  const payload = JSON.parse(payloadJson);
  if (!confirm(`删除「${payload.name || payload.code}」的这条预警？`)) return;
  api(`/api/groups/${payload.gid}/${payload.side}/stocks/${payload.code}`, { method:'DELETE' })
    .then(() => { lsSet(lsGet().filter(x => x.key !== key)); load(); })
    .catch(e => alert('删除失败: ' + e.message));
}
async function qmtSync() {
  try { await api('/api/qmt/sync', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{}' });
        alert('同步完成'); load(); }
  catch (e) { alert('同步失败: ' + e.message); }
}

function renderList(groups, details) {
  const dis = lsGet(); const disMap = {}; dis.forEach(x => disMap[x.key] = x);
  const rows = [];
  for (const g of groups) {
    for (const side of ['buy', 'sell']) {
      const bg = g[side + '_group']; if (!bg) continue;
      for (const stk of (bg.stocks || [])) {
        for (const mid of (bg.models || [])) {
          const tpl = TPL_BY_MODEL[mid]; if (!tpl) continue;   // 条件单不进简化列表
          const key = `${g.id}/${side}/${stk.code}/${mid}`;
          rows.push({ key, gid: g.id, gname: g.name, side, code: stk.code,
                      name: stk.name, origin: stk.origin, mid, disabled: !!disMap[key] });
        }
      }
    }
  }
  const list = document.getElementById('list');
  document.getElementById('listCount').textContent = rows.length ? `共 ${rows.length} 条 · 触发即推送` : '';
  if (!rows.length && !dis.length) {
    list.innerHTML = '<div class="empty">还没有预警，点上面「＋ 添加预警」开始</div>';
    return;
  }
  // 已停用的也显示（可一键恢复）
  const disRows = dis.filter(x => !rows.some(r => r.key === x.key))
                     .map(x => Object.assign({}, x.payload, { key: x.key, disabled: true, origin: 'local' }));
  const all = rows.concat(disRows);
  list.innerHTML = all.map(r => {
    const tpl = TPL_BY_MODEL[r.mid];
    const mo = MODELS[r.mid] || {};
    const thr = mo.threshold;
    const det = (details[r.mid] || {}).stocks || [];
    const st = det.find(x => x.code === r.code);
    const price = st ? st.price : null, chg = st ? st.day_change : null;
    let dist = '';
    if (!r.disabled && st && st.signed !== null && st.signed !== undefined && thr) {
      const d = (mo.type === 'drop') ? (thr + st.signed) : (thr - st.signed);
      dist = d <= 0 ? '<span class="hit hot">🔴 已达标</span>'
                    : `<span class="hit">距触发 ${fmt(d)}%</span>`;
    }
    const payloadJson = JSON.stringify({ gid: r.gid, side: r.side, code: r.code, name: r.name }).replace(/"/g, '&quot;');
    return `<div class="alert-card ${r.disabled ? 'off' : ''}">
      <div class="stock"><div class="nm">${esc(r.name || r.code)}</div><div class="cd">${esc(r.code)}${r.origin === 'qmt' ? ' · QMT' : ''}</div></div>
      <div class="price"><div class="p ${cls(chg)}">${fmt(price)}</div><div class="chg ${cls(chg)}">${(chg !== null && chg !== undefined) ? sign(chg) + fmt(chg) + '%' : '--'}</div></div>
      <div class="cond"><span class="tag ${tpl.tag}" title="点击修改阈值（对该类预警全局生效）"
        onclick="pickModelThr('${r.mid}')">${esc(PHRASE[r.mid](thr !== undefined ? thr : '?'))}</span>${dist}</div>
      ${r.gname ? `<span class="grp-tag">${esc(r.gname)}</span>` : ''}
      <label class="switch" title="停用/启用">
        <input type="checkbox" ${r.disabled ? '' : 'checked'} onchange="toggleRow(this.checked, '${r.key}', '${payloadJson}')">
        <span class="track"></span><span class="dot"></span></label>
      <button class="del" title="删除" onclick="delRow('${r.key}', '${payloadJson}', '${r.origin || ''}')">✕</button>
    </div>`;
  }).join('');
}

/* ================= 今日动态 ================= */
function renderFeed(details) {
  const items = [];
  for (const mid of Object.keys(details || {})) {
    (details[mid].alerts || []).forEach(a => items.push(Object.assign({}, a, { mid })));
  }
  items.sort((a, b) => String(b.time).localeCompare(String(a.time)));
  const feed = document.getElementById('feed');
  if (!items.length) { feed.innerHTML = '<div class="feed-item"><span class="dot-live"></span><span>今日暂无触发</span></div>'; return; }
  feed.innerHTML = items.slice(0, 12).map(a =>
    `<div class="feed-item"><span class="dot-live"></span><span class="t">${esc(a.time)}</span>
     <span>${esc(a.name || a.code)} ${esc(PHRASE[a.mid] ? PHRASE[a.mid](fmt(a.speed)) : fmt(a.speed) + '%')} @ ${fmt(a.price)}</span></div>`).join('');
}

/* ================= 主加载 ================= */
let loading = false;
async function load() {
  if (loading) return; loading = true;
  try {
    const [models, groups, status] = await Promise.all([
      api('/api/models'), api('/api/groups').catch(() => []),
      api('/api/status').catch(() => null)]);
    renderStatus(status);
    MODELS = {}; models.forEach(m => { MODELS[m.id] = m; curThr[m.id] = m.threshold; });
    const sel = document.getElementById('thrModel');
    const metric = models.filter(m => m.type === 'speed' || m.type === 'drop');
    if (!sel.options.length)
      sel.innerHTML = '<option value="">选择类型改阈值…</option>' +
        metric.map(m => `<option value="${m.id}">${esc(m.name)}（当前 ${m.threshold}%）</option>`).join('');
    const details = {};
    await Promise.all(metric.map(m =>
      api('/api/model/' + m.id).then(d => details[m.id] = d).catch(() => {})));
    renderList(groups, details);
    renderFeed(details);
  } catch (e) { console.error('load error', e); }
  finally { loading = false; }
}

renderTpls();
pick(document.querySelector('.tpl'));
document.getElementById('codeInput').addEventListener('input', function () {
  const v = this.value.trim(); const h = document.getElementById('mktHint');
  h.textContent = /^\d{6}$/.test(v) ? `${v} · ${mktOf(v) || '未知市场'} · 保存后自动识别股票名称` :
    '6 位数字：60 开头沪市 · 0/3 开头深市 · 8/4 开头北交所';
});
load();
setInterval(load, 5000);
</script>
