# -*- coding: utf-8 -*-
# pytest 门禁配置（K-STOCK-211 任务 4，2026-10-17）
# importlib 模式按文件路径唯一化测试模块，解决多目录同名测试文件冲突：
# - strategy_layer/tests/test_registry.py vs tools/gatekeeper/tests/test_registry.py
# - 审计底稿记录的 vendored 测试目录同名中断（2026-10-13 全面审计）
# 注意：脚本式自检（module 体直跑）由 portal/conftest.py collect_ignore 排除。
[pytest]
addopts = --import-mode=importlib
