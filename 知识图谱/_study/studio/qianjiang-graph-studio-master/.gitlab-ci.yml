build-deploy-dev:
  stage: build
  script:
    - node -v
    - npm -v
    - npm install
    - npm rebuild node-sass
    - npm run build
    - sudo rm -rf /home/qianjiangGraph/html/build
    - sudo cp -r ./build /home/qianjiangGraph/html/
  only:
    - master
  cache:
    key: "node_modules"
    paths:
      - node_modules/
  tags:
    - dev


